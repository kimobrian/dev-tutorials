w\">from</span> jose <span class=\"kw\">import</span> jwt, <span class=\"nm\">JWTError</span>\n<span class=\"kw\">from</span> .database <span class=\"kw\">import</span> <span class=\"nm\">AsyncSessionLocal</span>\n<span class=\"kw\">from</span> .models <span class=\"kw\">import</span> <span class=\"nm\">User</span>\n<span class=\"kw\">from</span> .config <span class=\"kw\">import</span> settings\n\noauth2_scheme <span class=\"op\">=</span> <span class=\"fn\">OAuth2PasswordBearer</span>(tokenUrl<span class=\"op\">=</span><span class=\"st\">\"/auth/token\"</span>)\n\n<span class=\"cm\"># ── Layer 1: Database session ─────────────────────────────────────────────</span>\n<span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">get_db</span>() <span class=\"op\">-&gt;</span> <span class=\"nm\">AsyncSession</span>:\n    <span class=\"st\">\"\"\"Provides a database session for one request.\n    Commits on success, rolls back on exception, always closes.\n    \"\"\"</span>\n    <span class=\"kw\">async</span> <span class=\"kw\">with</span> <span class=\"fn\">AsyncSessionLocal</span>() <span class=\"kw\">as</span> session:\n        <span class=\"kw\">try</span>:\n            <span class=\"kw\">yield</span> session\n            <span class=\"kw\">await</span> session.<span class=\"fn\">commit</span>()\n        <span class=\"kw\">except</span> <span class=\"nm\">Exception</span>:\n            <span class=\"kw\">await</span> session.<span class=\"fn\">rollback</span>()\n            <span class=\"kw\">raise</span>\n\n<span class=\"nm\">DB</span> <span class=\"op\">=</span> <span class=\"fn\">Annotated</span>[<span class=\"nm\">AsyncSession</span>, <span class=\"fn\">Depends</span>(get_db)]\n\n<span class=\"cm\"># ── Layer 2: Token decoding ───────────────────────────────────────────────</span>\n<span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">decode_token</span>(token: <span class=\"fn\">str</span> <span class=\"op\">=</span> <span class=\"fn\">Depends</span>(oauth2_scheme)) <span class=\"op\">-&gt;</span> <span class=\"fn\">int</span>:\n    <span class=\"st\">\"\"\"Decode JWT and extract user_id.\n    Returns user_id on success, raises 401 on any failure.\n    \"\"\"</span>\n    <span class=\"kw\">try</span>:\n        payload <span class=\"op\">=</span> jwt.<span class=\"fn\">decode</span>(\n            token, settings.secret_key, algorithms<span class=\"op\">=</span>[settings.algorithm]\n        )\n        user_id <span class=\"op\">=</span> payload.<span class=\"fn\">get</span>(<span class=\"st\">\"sub\"</span>)\n        <span class=\"kw\">if</span> user_id <span class=\"kw\">is</span> <span class=\"kw\">None</span>:\n            <span class=\"kw\">raise</span> <span class=\"fn\">ValueError</span>(<span class=\"st\">\"No subject in token\"</span>)\n        <span class=\"kw\">return</span> <span class=\"fn\">int</span>(user_id)\n    <span class=\"kw\">except</span> (<span class=\"nm\">JWTError</span>, <span class=\"nm\">ValueError</span>):\n        <span class=\"kw\">raise</span> <span class=\"fn\">HTTPException</span>(\n            status_code<span class=\"op\">=</span>status.<span class=\"nm\">HTTP_401_UNAUTHORIZED</span>,\n            detail<span class=\"op\">=</span><span class=\"st\">\"Could not validate credentials\"</span>,\n            headers<span class=\"op\">=</span>{<span class=\"st\">\"WWW-Authenticate\"</span>: <span class=\"st\">\"Bearer\"</span>},\n        )\n\n<span class=\"cm\"># ── Layer 3: Fetch user from DB ────────────────────────────────────────────</span>\n<span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">get_current_user</span>(\n    user_id: <span class=\"fn\">int</span>         <span class=\"op\">=</span> <span class=\"fn\">Depends</span>(decode_token),   <span class=\"cm\"># needs layer 2</span>\n    db:      <span class=\"nm\">AsyncSession</span> <span class=\"op\">=</span> <span class=\"fn\">Depends</span>(get_db),         <span class=\"cm\"># needs layer 1</span>\n) <span class=\"op\">-&gt;</span> <span class=\"nm\">User</span>:\n    <span class=\"st\">\"\"\"Load the user from the database using the decoded user_id.\"\"\"</span>\n    user <span class=\"op\">=</span> <span class=\"kw\">await</span> db.<span class=\"fn\">get</span>(<span class=\"nm\">User</span>, user_id)\n    <span class=\"kw\">if</span> user <span class=\"kw\">is</span> <span class=\"kw\">None</span>:\n        <span class=\"kw\">raise</span> <span class=\"fn\">HTTPException</span>(status.<span class=\"nm\">HTTP_401_UNAUTHORIZED</span>, <span class=\"st\">\"User not found\"</span>)\n    <span class=\"kw\">return</span> user\n\n<span class=\"nm\">CurrentUser</span> <span class=\"op\">=</span> <span class=\"fn\">Annotated</span>[<span class=\"nm\">User</span>, <span class=\"fn\">Depends</span>(get_current_user)]\n\n<span class=\"cm\"># ── Layer 4: Business rule checks ─────────────────────────────────────────</span>\n<span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">require_active_user</span>(user: <span class=\"nm\">CurrentUser</span>) <span class=\"op\">-&gt;</span> <span class=\"nm\">User</span>:\n    <span class=\"st\">\"\"\"Ensure the user's account is not suspended.\"\"\"</span>\n    <span class=\"kw\">if</span> <span class=\"kw\">not</span> user.is_active:\n        <span class=\"kw\">raise</span> <span class=\"fn\">HTTPException</span>(\n            status.<span class=\"nm\">HTTP_403_FORBIDDEN</span>,\n            <span class=\"st\">\"Your account has been suspended. Contact support.\"</span>\n        )\n    <span class=\"kw\">return</span> user\n\n<span class=\"nm\">ActiveUser</span> <span class=\"op\">=</span> <span class=\"fn\">Annotated</span>[<span class=\"nm\">User</span>, <span class=\"fn\">Depends</span>(require_active_user)]\n\n<span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">require_admin</span>(user: <span class=\"nm\">ActiveUser</span>) <span class=\"op\">-&gt;</span> <span class=\"nm\">User</span>:\n    <span class=\"st\">\"\"\"Ensure the user has admin role.\"\"\"</span>\n    <span class=\"kw\">if</span> user.role <span class=\"op\">!=</span> <span class=\"st\">\"admin\"</span>:\n        <span class=\"kw\">raise</span> <span class=\"fn\">HTTPException</span>(\n            status.<span class=\"nm\">HTTP_403_FORBIDDEN</span>,\n            <span class=\"st\">\"Admin access required\"</span>\n        )\n    <span class=\"kw\">return</span> user\n\n<span class=\"nm\">AdminUser</span> <span class=\"op\">=</span> <span class=\"fn\">Annotated</span>[<span class=\"nm\">User</span>, <span class=\"fn\">Depends</span>(require_admin)]\n\n<span class=\"cm\"># ── Clean routes — auth logic is entirely in dependencies ─────────────────</span>\n<span class=\"dc\">@router.get</span>(<span class=\"st\">\"/tasks/\"</span>)\n<span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">list_tasks</span>(db: <span class=\"nm\">DB</span>, user: <span class=\"nm\">ActiveUser</span>):   <span class=\"cm\"># 3 layers of auth in 2 args!</span>\n    <span class=\"kw\">return</span> <span class=\"kw\">await</span> <span class=\"fn\">get_user_tasks</span>(db, user.<span class=\"fn\">id</span>)\n\n<span class=\"dc\">@router.delete</span>(<span class=\"st\">\"/admin/tasks/{task_id}\"</span>)\n<span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">admin_delete_task</span>(task_id: <span class=\"fn\">int</span>, db: <span class=\"nm\">DB</span>, admin: <span class=\"nm\">AdminUser</span>):\n    <span class=\"kw\">return</span> <span class=\"kw\">await</span> <span class=\"fn\">force_delete_task</span>(db, task_id)</code></pre><h3>Server-Sent Events (SSE) — Real-Time Pushes</h3><p>SSE is a one-way channel from server to client over a regular HTTP connection. Unlike WebSockets (bidirectional), SSE is simpler — the browser just listens. It's perfect for live notifications, progress bars, and log streaming.</p><div class=\"cl\">python — SSE endpoint</div><pre><code><span class=\"kw\">from</span> fastapi <span class=\"kw\">import</span> <span class=\"nm\">Request</span>\n<span class=\"kw\">from</span> fastapi.responses <span class=\"kw\">import</span> <span class=\"nm\">StreamingResponse</span>\n<span class=\"kw\">import</span> asyncio, json\n\n<span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">event_stream</span>(request: <span class=\"nm\">Request</span>, user_id: <span class=\"fn\">int</span>):\n    <span class=\"st\">\"\"\"Generate a stream of server-sent events for a user.\n    \n    SSE format: each event is \"data: \\n\\n\"\n    The double newline marks the end of each event.\n    \"\"\"</span>\n    <span class=\"kw\">while</span> <span class=\"kw\">True</span>:\n        <span class=\"cm\"># Check if the client has disconnected</span>\n        <span class=\"cm\"># This prevents memory leaks from abandoned connections</span>\n        <span class=\"kw\">if</span> <span class=\"kw\">await</span> request.<span class=\"fn\">is_disconnected</span>():\n            <span class=\"fn\">print</span>(f<span class=\"st\">\"Client {user_id} disconnected\"</span>)\n            <span class=\"kw\">break</span>\n        \n        <span class=\"cm\"># Fetch pending events for this user (from DB, Redis, etc.)</span>\n        events <span class=\"op\">=</span> <span class=\"kw\">await</span> <span class=\"fn\">fetch_pending_events</span>(user_id)\n        \n        <span class=\"kw\">for</span> event <span class=\"kw\">in</span> events:\n            <span class=\"cm\"># Format as SSE: \"data: {...}\\n\\n\"</span>\n            payload <span class=\"op\">=</span> json.<span class=\"fn\">dumps</span>(event)\n            <span class=\"kw\">yield</span> f<span class=\"st\">\"data: {payload}\\n\\n\"</span>\n            <span class=\"kw\">await</span> <span class=\"fn\">mark_event_sent</span>(event[<span class=\"st\">\"id\"</span>])\n        \n        <span class=\"cm\"># Wait before polling again — adjust based on how real-time you need</span>\n        <span class=\"kw\">await</span> asyncio.<span class=\"fn\">sleep</span>(<span class=\"nb\">2</span>)\n\n<span class=\"dc\">@app.get</span>(<span class=\"st\">\"/events/stream\"</span>)\n<span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">stream_events</span>(request: <span class=\"nm\">Request</span>, user: <span class=\"nm\">ActiveUser</span>):\n    <span class=\"st\">\"\"\"Stream real-time events to the authenticated user.\n    \n    Client-side usage:\n    const es = new EventSource('/events/stream', {\n        headers: {Authorization: 'Bearer \" + token}\n    });\n    es.onmessage = (e) =&gt; console.log(JSON.parse(e.data));\n    \"\"\"</span>\n    <span class=\"kw\">return</span> <span class=\"fn\">StreamingResponse</span>(\n        <span class=\"fn\">event_stream</span>(request, user.<span class=\"fn\">id</span>),\n        media_type<span class=\"op\">=</span><span class=\"st\">\"text/event-stream\"</span>,\n        headers<span class=\"op\">=</span>{\n            <span class=\"st\">\"Cache-Control\"</span>:    <span class=\"st\">\"no-cache\"</span>,\n            <span class=\"st\">\"X-Accel-Buffering\"</span>: <span class=\"st\">\"no\"</span>,   <span class=\"cm\"># disable Nginx buffering</span>\n        }\n    )</code></pre><h3>Background Tasks with arq</h3><p><code>arq</code> is an async Redis task queue — lighter and more Pythonic than Celery for FastAPI applications. Tasks are defined as regular async functions and enqueued with a single call. Workers pick them up and run them independently of the web process.</p><div class=\"cl\">bash</div><pre><code><span class=\"fn\">pip</span> install <span class=\"fn\">arq</span> redis</code></pre><div class=\"cl\">python — arq tasks and worker</div><pre><code><span class=\"kw\">from</span> arq <span class=\"kw\">import</span> create_pool\n<span class=\"kw\">from</span> arq.connections <span class=\"kw\">import</span> <span class=\"nm\">RedisSettings</span>\n<span class=\"kw\">import</span> asyncio\n\n<span class=\"cm\"># ── Task definitions — regular async functions ─────────────────────────────</span>\n<span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">send_email_task</span>(\n    ctx: <span class=\"fn\">dict</span>,    <span class=\"cm\"># arq passes the worker context as first arg</span>\n    recipient: <span class=\"fn\">str</span>,\n    subject:   <span class=\"fn\">str</span>,\n    body:      <span class=\"fn\">str</span>,\n) <span class=\"op\">-&gt;</span> <span class=\"fn\">dict</span>:\n    <span class=\"st\">\"\"\"Send an email. Runs in the arq worker, not the web process.\n    \n    ctx contains: job_id, job_try (attempt number), enqueue_time, etc.\n    Access shared resources via ctx: ctx['db'], ctx['redis'], etc.\n    \"\"\"</span>\n    <span class=\"fn\">print</span>(f<span class=\"st\">\"[Job {ctx['job_id']}] Sending email to {recipient}\"</span>)\n    \n    <span class=\"cm\"># Use the DB session from the worker context</span>\n    <span class=\"cm\"># (set up in on_startup)</span>\n    db <span class=\"op\">=</span> ctx[<span class=\"st\">\"db\"</span>]\n    \n    <span class=\"kw\">await</span> <span class=\"fn\">smtp_send</span>(recipient, subject, body)\n    \n    <span class=\"cm\"># Record in DB that email was sent</span>\n    <span class=\"kw\">await</span> <span class=\"fn\">record_email_sent</span>(db, recipient, subject)\n    \n    <span class=\"kw\">return</span> {<span class=\"st\">\"status\"</span>: <span class=\"st\">\"sent\"</span>, <span class=\"st\">\"recipient\"</span>: recipient}\n\n<span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">process_image_task</span>(\n    ctx:      <span class=\"fn\">dict</span>,\n    image_id: <span class=\"fn\">int</span>,\n    widths:   <span class=\"fn\">list</span>[<span class=\"fn\">int</span>] <span class=\"op\">=</span> [<span class=\"nb\">400</span>, <span class=\"nb\">800</span>, <span class=\"nb\">1200</span>],\n) <span class=\"op\">-&gt;</span> <span class=\"fn\">dict</span>:\n    <span class=\"st\">\"\"\"Generate thumbnail images at multiple widths.\"\"\"</span>\n    db <span class=\"op\">=</span> ctx[<span class=\"st\">\"db\"</span>]\n    image <span class=\"op\">=</span> <span class=\"kw\">await</span> db.<span class=\"fn\">get</span>(<span class=\"nm\">Image</span>, image_id)\n    \n    thumbnails <span class=\"op\">=</span> {}\n    <span class=\"kw\">for</span> width <span class=\"kw\">in</span> widths:\n        thumb_url <span class=\"op\">=</span> <span class=\"kw\">await</span> <span class=\"fn\">generate_thumbnail</span>(image.path, width)\n        thumbnails[<span class=\"fn\">str</span>(width)] <span class=\"op\">=</span> thumb_url\n    \n    <span class=\"cm\"># Update the image record with thumbnail URLs</span>\n    image.thumbnails <span class=\"op\">=</span> thumbnails\n    <span class=\"kw\">await</span> db.<span class=\"fn\">commit</span>()\n    <span class=\"kw\">return</span> {<span class=\"st\">\"image_id\"</span>: image_id, <span class=\"st\">\"thumbnails\"</span>: thumbnails}\n\n<span class=\"cm\"># ── Worker configuration ────────────────────────────────────────────────────</span>\n<span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">startup</span>(ctx):\n    <span class=\"st\">\"\"\"Runs when the worker starts — set up shared resources.\"\"\"</span>\n    ctx[<span class=\"st\">\"db\"</span>]    <span class=\"op\">=</span> <span class=\"kw\">await</span> <span class=\"fn\">create_db_session</span>()\n    ctx[<span class=\"st\">\"redis\"</span>] <span class=\"op\">=</span> <span class=\"kw\">await</span> <span class=\"fn\">create_redis_pool</span>()\n    <span class=\"fn\">print</span>(<span class=\"st\">\"Worker started\"</span>)\n\n<span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">shutdown</span>(ctx):\n    <span class=\"st\">\"\"\"Runs when the worker stops — clean up resources.\"\"\"</span>\n    <span class=\"kw\">await</span> ctx[<span class=\"st\">\"db\"</span>].<span class=\"fn\">close</span>()\n    <span class=\"kw\">await</span> ctx[<span class=\"st\">\"redis\"</span>].<span class=\"fn\">close</span>()\n\n<span class=\"kw\">class</span> <span class=\"nm\">WorkerSettings</span>:\n    <span class=\"st\">\"\"\"Worker configuration.\"\"\"</span>\n    functions         <span class=\"op\">=</span> [send_email_task, process_image_task]\n    redis_settings    <span class=\"op\">=</span> <span class=\"fn\">RedisSettings</span>(host<span class=\"op\">=</span><span class=\"st\">\"localhost\"</span>, port<span class=\"op\">=</span><span class=\"nb\">6379</span>)\n    max_jobs          <span class=\"op\">=</span> <span class=\"nb\">10</span>       <span class=\"cm\"># max concurrent jobs per worker</span>\n    job_timeout       <span class=\"op\">=</span> <span class=\"nb\">300</span>      <span class=\"cm\"># 5 minute timeout per job</span>\n    on_startup        <span class=\"op\">=</span> startup\n    on_shutdown       <span class=\"op\">=</span> shutdown\n    health_check_interval <span class=\"op\">=</span> <span class=\"nb\">30</span>   <span class=\"cm\"># seconds</span>\n\n<span class=\"cm\"># ── Enqueue tasks from FastAPI routes ─────────────────────────────────────</span>\n<span class=\"dc\">@app.post</span>(<span class=\"st\">\"/users/\"</span>, response_model<span class=\"op\">=</span><span class=\"nm\">UserResponse</span>)\n<span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">create_user</span>(payload: <span class=\"nm\">UserCreate</span>, db: <span class=\"nm\">DB</span>):\n    user <span class=\"op\">=</span> <span class=\"fn\">User</span>(<span class=\"op\">**</span>payload.<span class=\"fn\">model_dump</span>())\n    db.<span class=\"fn\">add</span>(user)\n    <span class=\"kw\">await</span> db.<span class=\"fn\">commit</span>()\n    <span class=\"kw\">await</span> db.<span class=\"fn\">refresh</span>(user)\n    \n    <span class=\"cm\"># Enqueue the email task — returns immediately, task runs later</span>\n    redis <span class=\"op\">=</span> <span class=\"kw\">await</span> <span class=\"fn\">create_pool</span>(<span class=\"nm\">WorkerSettings</span>.redis_settings)\n    job <span class=\"op\">=</span> <span class=\"kw\">await</span> redis.<span class=\"fn\">enqueue_job</span>(\n        <span class=\"st\">\"send_email_task\"</span>,      <span class=\"cm\"># function name</span>\n        recipient<span class=\"op\">=</span>user.email,\n        subject<span class=\"op\">=</span>f<span class=\"st\">\"Welcome to TaskBoard, {user.username}!\"</span>,\n        body<span class=\"op\">=</span><span class=\"st\">\"Thanks for joining!\"</span>,\n        _defer_by<span class=\"op\">=</span><span class=\"nb\">5</span>,            <span class=\"cm\"># wait 5 seconds before starting</span>\n    )\n    <span class=\"fn\">print</span>(f<span class=\"st\">\"Email job enqueued: {job.job_id}\"</span>)\n    <span class=\"kw\">return</span> user</code></pre><div class=\"cl\">bash — running the worker</div><pre><code><span class=\"cm\"># Start the worker (in a separate process/container)</span>\n<span class=\"fn\">arq</span> app.tasks.WorkerSettings\n\n<span class=\"cm\"># With multiple workers for higher throughput</span>\n<span class=\"fn\">for</span> i <span class=\"kw\">in</span> {1..4}; <span class=\"kw\">do</span> <span class=\"fn\">arq</span> app.tasks.WorkerSettings &amp; <span class=\"kw\">done</span></code></pre><h2>API Versioning Strategies</h2><p>APIs evolve. Breaking changes — removing fields, changing formats, renaming endpoints — will break clients that depend on the old behaviour. Versioning lets you evolve your API while keeping old clients working.</p><div class=\"tw\"><table><tr><th>Strategy</th><th>Example</th><th>Pros</th><th>Cons</th></tr><tr><td>URL prefix</td><td><code>/api/v1/posts</code></td><td>Simple, explicit, caching-friendly</td><td>Duplicates routes</td></tr><tr><td>Header</td><td><code>API-Version: 2</code></td><td>Clean URLs</td><td>Less visible, harder to test in browser</td></tr><tr><td>Query param</td><td><code>/posts?version=2</code></td><td>Simple to test</td><td>Pollutes query strings</td></tr><tr><td>Accept header</td><td><code>Accept: application/vnd.api+json;version=2</code></td><td>REST-pure</td><td>Complex client setup</td></tr></table></div><div class=\"cl\">python — URL prefix versioning (recommended)</div><pre><code><span class=\"kw\">from</span> fastapi <span class=\"kw\">import</span> <span class=\"nm\">FastAPI</span>, <span class=\"nm\">APIRouter</span>\n\n<span class=\"cm\"># Separate routers for each version</span>\nrouter_v1 <span class=\"op\">=</span> <span class=\"fn\">APIRouter</span>(prefix<span class=\"op\">=</span><span class=\"st\">\"/api/v1\"</span>)\nrouter_v2 <span class=\"op\">=</span> <span class=\"fn\">APIRouter</span>(prefix<span class=\"op\">=</span><span class=\"st\">\"/api/v2\"</span>)\n\n<span class=\"cm\"># v1 endpoint — returns simple list</span>\n<span class=\"dc\">@router_v1.get</span>(<span class=\"st\">\"/posts\"</span>)\n<span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">list_posts_v1</span>(db: <span class=\"nm\">DB</span>):\n    posts <span class=\"op\">=</span> <span class=\"kw\">await</span> <span class=\"fn\">get_all_posts</span>(db)\n    <span class=\"kw\">return</span> [{<span class=\"st\">\"id\"</span>: p.<span class=\"fn\">id</span>, <span class=\"st\">\"title\"</span>: p.title} <span class=\"kw\">for</span> p <span class=\"kw\">in</span> posts]  <span class=\"cm\"># old format</span>\n\n<span class=\"cm\"># v2 endpoint — returns paginated response with metadata</span>\n<span class=\"dc\">@router_v2.get</span>(<span class=\"st\">\"/posts\"</span>)\n<span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">list_posts_v2</span>(\n    db: <span class=\"nm\">DB</span>, page: <span class=\"fn\">int</span> <span class=\"op\">=</span> <span class=\"nb\">1</span>, per_page: <span class=\"fn\">int</span> <span class=\"op\">=</span> <span class=\"nb\">20</span>\n):\n    total, posts <span class=\"op\">=</span> <span class=\"kw\">await</span> <span class=\"fn\">get_paginated_posts</span>(db, page, per_page)\n    <span class=\"kw\">return</span> {   <span class=\"cm\"># new format — breaking change from v1</span>\n        <span class=\"st\">\"items\"</span>:    [p.<span class=\"fn\">model_dump</span>() <span class=\"kw\">for</span> p <span class=\"kw\">in</span> posts],\n        <span class=\"st\">\"total\"</span>:    total,\n        <span class=\"st\">\"page\"</span>:     page,\n        <span class=\"st\">\"per_page\"</span>: per_page,\n    }\n\napp <span class=\"op\">=</span> <span class=\"fn\">FastAPI</span>()\napp.<span class=\"fn\">include_router</span>(router_v1)\napp.<span class=\"fn\">include_router</span>(router_v2)\n\n<span class=\"cm\"># Deprecation headers — warn clients to upgrade</span>\n<span class=\"kw\">from</span> starlette.middleware.base <span class=\"kw\">import</span> <span class=\"nm\">BaseHTTPMiddleware</span>\n<span class=\"kw\">from</span> starlette.responses <span class=\"kw\">import</span> <span class=\"nm\">Response</span>\n\n<span class=\"kw\">class</span> <span class=\"fn\">DeprecationMiddleware</span>(<span class=\"nm\">BaseHTTPMiddleware</span>):\n    <span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">dispatch</span>(self, request, call_next):\n        response <span class=\"op\">=</span> <span class=\"kw\">await</span> <span class=\"fn\">call_next</span>(request)\n        <span class=\"kw\">if</span> request.url.path.<span class=\"fn\">startswith</span>(<span class=\"st\">\"/api/v1/\"</span>):\n            response.headers[<span class=\"st\">\"Deprecation\"</span>] <span class=\"op\">=</span> <span class=\"st\">\"true\"</span>\n            response.headers[<span class=\"st\">\"Sunset\"</span>]      <span class=\"op\">=</span> <span class=\"st\">\"2025-12-31\"</span>\n            response.headers[<span class=\"st\">\"Link\"</span>]        <span class=\"op\">=</span> <span class=\"st\">'; rel=\"successor-version\"'</span>\n        <span class=\"kw\">return</span> response\n\napp.<span class=\"fn\">add_middleware</span>(<span class=\"nm\">DeprecationMiddleware</span>)</code></pre>"},{"id":"fa-05","track":"fastapi","tl":"FastAPI","title":"FastAPI: Testing, Security & Production","sub":"Comprehensive async testing, security hardening, rate limiting, HTTPS setup, observability with OpenTelemetry.","content":"<h2>Comprehensive Testing Strategy</h2><p>A FastAPI test suite has three layers: unit tests for individual functions (validators, business logic), integration tests for endpoint behaviour (auth, validation, responses), and the dependency override mechanism that replaces real infrastructure with test doubles.</p><h3>Test Infrastructure Setup</h3><div class=\"cl\">python — tests/conftest.py</div><pre><code><span class=\"kw\">import</span> pytest\n<span class=\"kw\">import</span> pytest_asyncio\n<span class=\"kw\">from</span> httpx <span class=\"kw\">import</span> <span class=\"nm\">AsyncClient</span>, <span class=\"nm\">ASGITransport</span>\n<span class=\"kw\">from</span> sqlalchemy.ext.asyncio <span class=\"kw\">import</span> create_async_engine, async_sessionmaker, <span class=\"nm\">AsyncSession</span>\n<span class=\"kw\">from</span> app.main <span class=\"kw\">import</span> app\n<span class=\"kw\">from</span> app.database <span class=\"kw\">import</span> <span class=\"nm\">Base</span>, get_db\n<span class=\"kw\">from</span> app.models <span class=\"kw\">import</span> <span class=\"nm\">User</span>, <span class=\"nm\">Task</span>\n\n<span class=\"cm\"># In-memory SQLite is perfect for tests: fast, no setup, isolated</span>\n<span class=\"nm\">TEST_DB_URL</span> <span class=\"op\">=</span> <span class=\"st\">\"sqlite+aiosqlite:///:memory:\"</span>\n\n<span class=\"dc\">@pytest_asyncio.fixture</span>(scope<span class=\"op\">=</span><span class=\"st\">\"session\"</span>)\n<span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">engine</span>():\n    <span class=\"st\">\"\"\"Create the test database engine once per test session.\"\"\"</span>\n    eng <span class=\"op\">=</span> <span class=\"fn\">create_async_engine</span>(<span class=\"nm\">TEST_DB_URL</span>, echo<span class=\"op\">=</span><span class=\"kw\">False</span>)\n    <span class=\"kw\">async</span> <span class=\"kw\">with</span> eng.<span class=\"fn\">begin</span>() <span class=\"kw\">as</span> conn:\n        <span class=\"cm\"># Create all tables defined in your models</span>\n        <span class=\"kw\">await</span> conn.<span class=\"fn\">run_sync</span>(<span class=\"nm\">Base</span>.metadata.create_all)\n    <span class=\"kw\">yield</span> eng\n    <span class=\"kw\">await</span> eng.<span class=\"fn\">dispose</span>()\n\n<span class=\"dc\">@pytest_asyncio.fixture</span>\n<span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">db</span>(engine) <span class=\"op\">-&gt;</span> <span class=\"nm\">AsyncSession</span>:\n    <span class=\"st\">\"\"\"Provide a fresh DB session for each test.\n    \n    Uses SAVEPOINT/ROLLBACK to isolate test data:\n    - Begin outer transaction\n    - Each test runs in a savepoint\n    - Roll back after each test — no data persists between tests\n    \"\"\"</span>\n    <span class=\"kw\">async</span> <span class=\"kw\">with</span> engine.<span class=\"fn\">connect</span>() <span class=\"kw\">as</span> conn:\n        <span class=\"kw\">await</span> conn.<span class=\"fn\">begin</span>()    <span class=\"cm\"># outer transaction</span>\n        \n        <span class=\"nm\">TestSession</span> <span class=\"op\">=</span> <span class=\"fn\">async_sessionmaker</span>(conn, expire_on_commit<span class=\"op\">=</span><span class=\"kw\">False</span>)\n        session <span class=\"op\">=</span> <span class=\"fn\">TestSession</span>()\n        \n        <span class=\"kw\">try</span>:\n            <span class=\"kw\">yield</span> session\n        <span class=\"kw\">finally</span>:\n            <span class=\"kw\">await</span> session.<span class=\"fn\">close</span>()\n            <span class=\"kw\">await</span> conn.<span class=\"fn\">rollback</span>()   <span class=\"cm\"># undo EVERYTHING from this test</span>\n\n<span class=\"dc\">@pytest_asyncio.fixture</span>\n<span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">client</span>(db: <span class=\"nm\">AsyncSession</span>) <span class=\"op\">-&gt;</span> <span class=\"nm\">AsyncClient</span>:\n    <span class=\"st\">\"\"\"HTTP test client with dependency overrides.\n    \n    The key: we override get_db so the API routes use the\n    same test database session as our test code. This means\n    we can insert test data and immediately test it via the API.\n    \"\"\"</span>\n    <span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">override_db</span>():\n        <span class=\"kw\">yield</span> db   <span class=\"cm\"># yield the test session instead of creating a real one</span>\n    \n    app.dependency_overrides[get_db] <span class=\"op\">=</span> override_db\n    \n    <span class=\"kw\">async</span> <span class=\"kw\">with</span> <span class=\"fn\">AsyncClient</span>(\n        transport<span class=\"op\">=</span><span class=\"fn\">ASGITransport</span>(app<span class=\"op\">=</span>app),\n        base_url<span class=\"op\">=</span><span class=\"st\">\"http://testserver\"</span>,\n    ) <span class=\"kw\">as</span> ac:\n        <span class=\"kw\">yield</span> ac\n    \n    <span class=\"cm\"># Clean up the override so it doesn't affect other test files</span>\n    app.dependency_overrides.<span class=\"fn\">clear</span>()\n\n<span class=\"dc\">@pytest_asyncio.fixture</span>\n<span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">user</span>(db: <span class=\"nm\">AsyncSession</span>) <span class=\"op\">-&gt;</span> <span class=\"nm\">User</span>:\n    <span class=\"st\">\"\"\"Create a test user in the database.\"\"\"</span>\n    u <span class=\"op\">=</span> <span class=\"fn\">User</span>(\n        username<span class=\"op\">=</span><span class=\"st\">\"testuser\"</span>,\n        email<span class=\"op\">=</span><span class=\"st\">\"test@example.com\"</span>,\n        hashed_password<span class=\"op\">=</span><span class=\"fn\">hash_password</span>(<span class=\"st\">\"TestPass123\"</span>),\n        is_active<span class=\"op\">=</span><span class=\"kw\">True</span>\n    )\n    db.<span class=\"fn\">add</span>(u); <span class=\"kw\">await</span> db.<span class=\"fn\">commit</span>(); <span class=\"kw\">await</span> db.<span class=\"fn\">refresh</span>(u)\n    <span class=\"kw\">return</span> u\n\n<span class=\"dc\">@pytest_asyncio.fixture</span>\n<span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">auth_headers</span>(client: <span class=\"nm\">AsyncClient</span>, user: <span class=\"nm\">User</span>) <span class=\"op\">-&gt;</span> <span class=\"fn\">dict</span>:\n    <span class=\"st\">\"\"\"Log in and return Authorization header.\"\"\"</span>\n    r <span class=\"op\">=</span> <span class=\"kw\">await</span> client.<span class=\"fn\">post</span>(<span class=\"st\">\"/auth/token\"</span>, data<span class=\"op\">=</span>{\n        <span class=\"st\">\"username\"</span>: <span class=\"st\">\"test@example.com\"</span>,\n        <span class=\"st\">\"password\"</span>: <span class=\"st\">\"TestPass123\"</span>\n    })\n    token <span class=\"op\">=</span> r.<span class=\"fn\">json</span>()[<span class=\"st\">\"access_token\"</span>]\n    <span class=\"kw\">return</span> {<span class=\"st\">\"Authorization\"</span>: f<span class=\"st\">\"Bearer {token}\"</span>}</code></pre><div class=\"cl\">python — tests/test_tasks.py</div><pre><code><span class=\"kw\">import</span> pytest\n<span class=\"kw\">from</span> datetime <span class=\"kw\">import</span> datetime, timedelta\n\n<span class=\"kw\">class</span> <span class=\"nm\">TestTaskCRUD</span>:\n    <span class=\"st\">\"\"\"Test the full lifecycle of task operations.\"\"\"</span>\n    \n    <span class=\"dc\">@pytest.mark.asyncio</span>\n    <span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">test_create_task_minimal</span>(self, client, auth_headers):\n        <span class=\"st\">\"\"\"Create a task with only required fields.\"\"\"</span>\n        r <span class=\"op\">=</span> <span class=\"kw\">await</span> client.<span class=\"fn\">post</span>(\n            <span class=\"st\">\"/tasks/\"</span>,\n            json<span class=\"op\">=</span>{<span class=\"st\">\"title\"</span>: <span class=\"st\">\"Buy groceries\"</span>},\n            headers<span class=\"op\">=</span>auth_headers\n        )\n        <span class=\"kw\">assert</span> r.status_code <span class=\"op\">==</span> <span class=\"nb\">201</span>\n        data <span class=\"op\">=</span> r.<span class=\"fn\">json</span>()\n        \n        <span class=\"cm\"># Verify all expected fields are present and correct</span>\n        <span class=\"kw\">assert</span> data[<span class=\"st\">\"title\"</span>]    <span class=\"op\">==</span> <span class=\"st\">\"Buy groceries\"</span>\n        <span class=\"kw\">assert</span> data[<span class=\"st\">\"priority\"</span>] <span class=\"op\">==</span> <span class=\"st\">\"medium\"</span>      <span class=\"cm\"># default</span>\n        <span class=\"kw\">assert</span> data[<span class=\"st\">\"is_done\"</span>]  <span class=\"op\">==</span> <span class=\"kw\">False</span>          <span class=\"cm\"># default</span>\n        <span class=\"kw\">assert</span> data[<span class=\"st\">\"owner_id\"</span>] <span class=\"kw\">is</span> <span class=\"kw\">not</span> <span class=\"kw\">None</span>       <span class=\"cm\"># set from auth token</span>\n        <span class=\"kw\">assert</span> <span class=\"st\">\"id\"</span> <span class=\"kw\">in</span> data\n        <span class=\"kw\">assert</span> <span class=\"st\">\"created_at\"</span> <span class=\"kw\">in</span> data\n    \n    <span class=\"dc\">@pytest.mark.asyncio</span>\n    <span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">test_create_task_full</span>(self, client, auth_headers):\n        <span class=\"st\">\"\"\"Create a task with all optional fields.\"\"\"</span>\n        due <span class=\"op\">=</span> (datetime.<span class=\"fn\">utcnow</span>() <span class=\"op\">+</span> <span class=\"fn\">timedelta</span>(days<span class=\"op\">=</span><span class=\"nb\">7</span>)).<span class=\"fn\">isoformat</span>()\n        r <span class=\"op\">=</span> <span class=\"kw\">await</span> client.<span class=\"fn\">post</span>(\n            <span class=\"st\">\"/tasks/\"</span>,\n            json<span class=\"op\">=</span>{\n                <span class=\"st\">\"title\"</span>:       <span class=\"st\">\"Prepare presentation\"</span>,\n                <span class=\"st\">\"description\"</span>: <span class=\"st\">\"Q3 results review for stakeholders\"</span>,\n                <span class=\"st\">\"priority\"</span>:    <span class=\"st\">\"high\"</span>,\n                <span class=\"st\">\"due_date\"</span>:    due,\n            },\n            headers<span class=\"op\">=</span>auth_headers\n        )\n        <span class=\"kw\">assert</span> r.status_code <span class=\"op\">==</span> <span class=\"nb\">201</span>\n        data <span class=\"op\">=</span> r.<span class=\"fn\">json</span>()\n        <span class=\"kw\">assert</span> data[<span class=\"st\">\"priority\"</span>]    <span class=\"op\">==</span> <span class=\"st\">\"high\"</span>\n        <span class=\"kw\">assert</span> data[<span class=\"st\">\"description\"</span>] <span class=\"op\">==</span> <span class=\"st\">\"Q3 results review for stakeholders\"</span>\n        <span class=\"kw\">assert</span> data[<span class=\"st\">\"due_date\"</span>] <span class=\"kw\">is</span> <span class=\"kw\">not</span> <span class=\"kw\">None</span>\n    \n    <span class=\"dc\">@pytest.mark.asyncio</span>\n    <span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">test_create_task_title_too_short</span>(self, client, auth_headers):\n        <span class=\"st\">\"\"\"Pydantic validation: title must be &gt;= 3 characters.\"\"\"</span>\n        r <span class=\"op\">=</span> <span class=\"kw\">await</span> client.<span class=\"fn\">post</span>(\n            <span class=\"st\">\"/tasks/\"</span>,\n            json<span class=\"op\">=</span>{<span class=\"st\">\"title\"</span>: <span class=\"st\">\"Hi\"</span>},   <span class=\"cm\"># only 2 chars</span>\n            headers<span class=\"op\">=</span>auth_headers\n        )\n        <span class=\"kw\">assert</span> r.status_code <span class=\"op\">==</span> <span class=\"nb\">422</span>   <span class=\"cm\"># Unprocessable Entity</span>\n        errors <span class=\"op\">=</span> r.<span class=\"fn\">json</span>()[<span class=\"st\">\"detail\"</span>]\n        <span class=\"cm\"># Verify the error points to the right field</span>\n        <span class=\"kw\">assert</span> <span class=\"fn\">any</span>(e[<span class=\"st\">\"loc\"</span>] <span class=\"op\">==</span> [<span class=\"st\">\"body\"</span>, <span class=\"st\">\"title\"</span>] <span class=\"kw\">for</span> e <span class=\"kw\">in</span> errors)\n    \n    <span class=\"dc\">@pytest.mark.asyncio</span>\n    <span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">test_list_tasks_empty</span>(self, client, auth_headers):\n        <span class=\"st\">\"\"\"New user starts with no tasks.\"\"\"</span>\n        r <span class=\"op\">=</span> <span class=\"kw\">await</span> client.<span class=\"fn\">get</span>(<span class=\"st\">\"/tasks/\"</span>, headers<span class=\"op\">=</span>auth_headers)\n        <span class=\"kw\">assert</span> r.status_code <span class=\"op\">==</span> <span class=\"nb\">200</span>\n        <span class=\"kw\">assert</span> r.<span class=\"fn\">json</span>() <span class=\"op\">==</span> []\n    \n    <span class=\"dc\">@pytest.mark.asyncio</span>\n    <span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">test_tasks_isolated_by_user</span>(\n        self, client, db, auth_headers\n    ):\n        <span class=\"st\">\"\"\"Users can only see their own tasks.\n        Create a task for user A and verify user B cannot see it.\n        \"\"\"</span>\n        <span class=\"cm\"># Create task as user A (our test user)</span>\n        <span class=\"kw\">await</span> client.<span class=\"fn\">post</span>(<span class=\"st\">\"/tasks/\"</span>, json<span class=\"op\">=</span>{<span class=\"st\">\"title\"</span>: <span class=\"st\">\"User A task\"</span>}, headers<span class=\"op\">=</span>auth_headers)\n        \n        <span class=\"cm\"># Create user B</span>\n        user_b <span class=\"op\">=</span> <span class=\"fn\">User</span>(username<span class=\"op\">=</span><span class=\"st\">\"userb\"</span>, email<span class=\"op\">=</span><span class=\"st\">\"b@b.com\"</span>,\n                      hashed_password<span class=\"op\">=</span><span class=\"fn\">hash_password</span>(<span class=\"st\">\"Pass123\"</span>), is_active<span class=\"op\">=</span><span class=\"kw\">True</span>)\n        db.<span class=\"fn\">add</span>(user_b); <span class=\"kw\">await</span> db.<span class=\"fn\">commit</span>()\n        \n        <span class=\"cm\"># Login as user B</span>\n        r <span class=\"op\">=</span> <span class=\"kw\">await</span> client.<span class=\"fn\">post</span>(<span class=\"st\">\"/auth/token\"</span>,\n                              data<span class=\"op\">=</span>{<span class=\"st\">\"username\"</span>: <span class=\"st\">\"b@b.com\"</span>, <span class=\"st\">\"password\"</span>: <span class=\"st\">\"Pass123\"</span>})\n        b_headers <span class=\"op\">=</span> {<span class=\"st\">\"Authorization\"</span>: f<span class=\"st\">\"Bearer {r.json()['access_token']}\"</span>}\n        \n        <span class=\"cm\"># User B's task list should be empty</span>\n        r <span class=\"op\">=</span> <span class=\"kw\">await</span> client.<span class=\"fn\">get</span>(<span class=\"st\">\"/tasks/\"</span>, headers<span class=\"op\">=</span>b_headers)\n        <span class=\"kw\">assert</span> r.<span class=\"fn\">json</span>() <span class=\"op\">==</span> []\n    \n    <span class=\"dc\">@pytest.mark.asyncio</span>\n    <span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">test_update_task_status</span>(self, client, auth_headers):\n        <span class=\"st\">\"\"\"Mark a task as done.\"\"\"</span>\n        <span class=\"cm\"># Create</span>\n        create_r <span class=\"op\">=</span> <span class=\"kw\">await</span> client.<span class=\"fn\">post</span>(<span class=\"st\">\"/tasks/\"</span>, json<span class=\"op\">=</span>{<span class=\"st\">\"title\"</span>: <span class=\"st\">\"Do laundry\"</span>}, headers<span class=\"op\">=</span>auth_headers)\n        task_id  <span class=\"op\">=</span> create_r.<span class=\"fn\">json</span>()[<span class=\"st\">\"id\"</span>]\n        \n        <span class=\"cm\"># Update</span>\n        update_r <span class=\"op\">=</span> <span class=\"kw\">await</span> client.<span class=\"fn\">patch</span>(\n            f<span class=\"st\">\"/tasks/{task_id}\"</span>,\n            json<span class=\"op\">=</span>{<span class=\"st\">\"is_done\"</span>: <span class=\"kw\">True</span>},\n            headers<span class=\"op\">=</span>auth_headers\n        )\n        <span class=\"kw\">assert</span> update_r.status_code <span class=\"op\">==</span> <span class=\"nb\">200</span>\n        <span class=\"kw\">assert</span> update_r.<span class=\"fn\">json</span>()[<span class=\"st\">\"is_done\"</span>] <span class=\"op\">==</span> <span class=\"kw\">True</span>\n    \n    <span class=\"dc\">@pytest.mark.asyncio</span>\n    <span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">test_cannot_access_other_users_task</span>(\n        self, client, db, auth_headers\n    ):\n        <span class=\"st\">\"\"\"Attempting to access another user's task returns 404 (not 403).\n        Returning 404 is a security best practice: it doesn't confirm\n        whether the task exists, preventing enumeration attacks.\n        \"\"\"</span>\n        <span class=\"cm\"># Create a task owned by another user directly in DB</span>\n        other_user <span class=\"op\">=</span> <span class=\"fn\">User</span>(username<span class=\"op\">=</span><span class=\"st\">\"other\"</span>, email<span class=\"op\">=</span><span class=\"st\">\"o@o.com\"</span>,\n                         hashed_password<span class=\"op\">=</span><span class=\"fn\">hash_password</span>(<span class=\"st\">\"Pass123\"</span>), is_active<span class=\"op\">=</span><span class=\"kw\">True</span>)\n        db.<span class=\"fn\">add</span>(other_user); <span class=\"kw\">await</span> db.<span class=\"fn\">commit</span>()\n        other_task <span class=\"op\">=</span> <span class=\"fn\">Task</span>(title<span class=\"op\">=</span><span class=\"st\">\"Private task\"</span>, owner_id<span class=\"op\">=</span>other_user.<span class=\"fn\">id</span>)\n        db.<span class=\"fn\">add</span>(other_task); <span class=\"kw\">await</span> db.<span class=\"fn\">commit</span>()\n        \n        <span class=\"cm\"># Try to access it as our test user</span>\n        r <span class=\"op\">=</span> <span class=\"kw\">await</span> client.<span class=\"fn\">get</span>(f<span class=\"st\">\"/tasks/{other_task.id}\"</span>, headers<span class=\"op\">=</span>auth_headers)\n        <span class=\"kw\">assert</span> r.status_code <span class=\"op\">==</span> <span class=\"nb\">404</span>   <span class=\"cm\"># not 403 — don't reveal existence</span></code></pre><h2>Security Hardening</h2><p>FastAPI applications in production need layers of security beyond basic authentication: rate limiting to prevent brute force and DoS, security headers to protect against XSS and clickjacking, and input validation to prevent injection attacks.</p><div class=\"cl\">python — security middleware</div><pre><code><span class=\"kw\">from</span> starlette.middleware.base <span class=\"kw\">import</span> <span class=\"nm\">BaseHTTPMiddleware</span>\n<span class=\"kw\">from</span> fastapi.middleware.trustedhost <span class=\"kw\">import</span> <span class=\"nm\">TrustedHostMiddleware</span>\n<span class=\"kw\">from</span> fastapi.middleware.httpsredirect <span class=\"kw\">import</span> <span class=\"nm\">HTTPSRedirectMiddleware</span>\n\n<span class=\"cm\"># 1. Trust only your own domains</span>\napp.<span class=\"fn\">add_middleware</span>(\n    <span class=\"nm\">TrustedHostMiddleware</span>,\n    allowed_hosts<span class=\"op\">=</span>[<span class=\"st\">\"taskboard.com\"</span>, <span class=\"st\">\"*.taskboard.com\"</span>, <span class=\"st\">\"localhost\"</span>]\n)\n\n<span class=\"cm\"># 2. Force HTTPS in production</span>\n<span class=\"kw\">if</span> settings.environment <span class=\"op\">==</span> <span class=\"st\">\"production\"</span>:\n    app.<span class=\"fn\">add_middleware</span>(<span class=\"nm\">HTTPSRedirectMiddleware</span>)\n\n<span class=\"cm\"># 3. Security headers</span>\n<span class=\"kw\">class</span> <span class=\"fn\">SecurityHeadersMiddleware</span>(<span class=\"nm\">BaseHTTPMiddleware</span>):\n    <span class=\"st\">\"\"\"Add security headers to every response.\n    \n    These headers instruct browsers to:\n    - Not guess content types (X-Content-Type-Options)\n    - Deny framing (prevents clickjacking attacks)\n    - Enforce HTTPS (HSTS)\n    - Restrict what resources can be loaded (CSP)\n    \"\"\"</span>\n    <span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">dispatch</span>(self, request, call_next):\n        response <span class=\"op\">=</span> <span class=\"kw\">await</span> <span class=\"fn\">call_next</span>(request)\n        response.headers.<span class=\"fn\">update</span>({\n            <span class=\"st\">\"X-Content-Type-Options\"</span>:    <span class=\"st\">\"nosniff\"</span>,\n            <span class=\"st\">\"X-Frame-Options\"</span>:           <span class=\"st\">\"DENY\"</span>,\n            <span class=\"st\">\"X-XSS-Protection\"</span>:          <span class=\"st\">\"1; mode=block\"</span>,\n            <span class=\"st\">\"Strict-Transport-Security\"</span>: <span class=\"st\">\"max-age=31536000; includeSubDomains; preload\"</span>,\n            <span class=\"st\">\"Content-Security-Policy\"</span>:   <span class=\"st\">\"default-src 'self'\"</span>,\n            <span class=\"st\">\"Referrer-Policy\"</span>:           <span class=\"st\">\"strict-origin-when-cross-origin\"</span>,\n            <span class=\"st\">\"Permissions-Policy\"</span>:        <span class=\"st\">\"geolocation=(), microphone=(), camera=()\"</span>,\n        })\n        <span class=\"kw\">return</span> response\n\napp.<span class=\"fn\">add_middleware</span>(<span class=\"nm\">SecurityHeadersMiddleware</span>)\n\n<span class=\"cm\"># 4. Rate limiting with slowapi</span>\n<span class=\"kw\">from</span> slowapi <span class=\"kw\">import</span> <span class=\"nm\">Limiter</span>, _rate_limit_exceeded_handler\n<span class=\"kw\">from</span> slowapi.util <span class=\"kw\">import</span> get_remote_address\n<span class=\"kw\">from</span> slowapi.errors <span class=\"kw\">import</span> <span class=\"nm\">RateLimitExceeded</span>\n\nlimiter <span class=\"op\">=</span> <span class=\"fn\">Limiter</span>(\n    key_func<span class=\"op\">=</span>get_remote_address,\n    storage_uri<span class=\"op\">=</span>f<span class=\"st\">\"redis://{settings.redis_url}\"</span>,\n    default_limits<span class=\"op\">=</span>[<span class=\"st\">\"1000/day\"</span>, <span class=\"st\">\"100/hour\"</span>]\n)\napp.state.limiter <span class=\"op\">=</span> limiter\napp.<span class=\"fn\">add_exception_handler</span>(<span class=\"nm\">RateLimitExceeded</span>, _rate_limit_exceeded_handler)\n\n<span class=\"cm\"># Apply tight limits to auth endpoints</span>\n<span class=\"dc\">@app.post</span>(<span class=\"st\">\"/auth/token\"</span>)\n<span class=\"dc\">@limiter.limit</span>(<span class=\"st\">\"10/minute\"</span>)   <span class=\"cm\"># 10 login attempts per minute per IP</span>\n<span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">login</span>(request: <span class=\"nm\">Request</span>, form: <span class=\"nm\">OAuth2PasswordRequestForm</span> <span class=\"op\">=</span> <span class=\"fn\">Depends</span>(), db: <span class=\"nm\">DB</span> <span class=\"op\">=</span> <span class=\"fn\">Depends</span>(get_db)):\n    user <span class=\"op\">=</span> <span class=\"kw\">await</span> <span class=\"fn\">authenticate_user</span>(db, form.username, form.password)\n    <span class=\"kw\">if</span> <span class=\"kw\">not</span> user:\n        <span class=\"kw\">raise</span> <span class=\"fn\">HTTPException</span>(\n            status.<span class=\"nm\">HTTP_401_UNAUTHORIZED</span>,\n            <span class=\"st\">\"Incorrect email or password\"</span>,\n            <span class=\"cm\"># Generic message — don't say \"wrong password\" vs \"wrong email\"</span>\n            <span class=\"cm\"># That leaks whether an account exists</span>\n        )\n    token <span class=\"op\">=</span> <span class=\"fn\">create_access_token</span>({<span class=\"st\">\"sub\"</span>: <span class=\"fn\">str</span>(user.<span class=\"fn\">id</span>)})\n    <span class=\"kw\">return</span> {<span class=\"st\">\"access_token\"</span>: token, <span class=\"st\">\"token_type\"</span>: <span class=\"st\">\"bearer\"</span>}</code></pre><h2>Production Deployment</h2><div class=\"cl\">dockerfile — production FastAPI</div><pre><code><span class=\"kw\">FROM</span> python:3.12-slim\n<span class=\"kw\">WORKDIR</span> /app\n\n<span class=\"cm\"># Install dependencies first (better layer caching)</span>\n<span class=\"cm\"># If requirements.txt doesn't change, this layer is cached</span>\n<span class=\"kw\">COPY</span> requirements.txt .\n<span class=\"kw\">RUN</span> pip install --no-cache-dir -r requirements.txt\n\n<span class=\"cm\"># Copy application code</span>\n<span class=\"kw\">COPY</span> ./app ./app\n<span class=\"kw\">COPY</span> alembic.ini .\n<span class=\"kw\">COPY</span> ./migrations ./migrations\n\n<span class=\"cm\"># Non-root user for security</span>\n<span class=\"kw\">RUN</span> adduser --disabled-password appuser\n<span class=\"kw\">USER</span> appuser\n\n<span class=\"kw\">EXPOSE</span> 8000\n\n<span class=\"cm\"># Gunicorn with Uvicorn workers:</span>\n<span class=\"cm\"># --workers: 2*CPUs+1 is the standard formula</span>\n<span class=\"cm\"># --worker-class UvicornWorker: handles async properly</span>\n<span class=\"cm\"># --bind 0.0.0.0:8000: listen on all interfaces</span>\n<span class=\"cm\"># --timeout 60: kill workers that hang for 60s</span>\n<span class=\"kw\">CMD</span> [<span class=\"st\">\"gunicorn\"</span>, <span class=\"st\">\"app.main:app\"</span>,\n     \"--workers\", \"4\",\n     \"--worker-class\", \"uvicorn.workers.UvicornWorker\",\n     \"--bind\", \"0.0.0.0:8000\",\n     \"--timeout\", \"60\",\n     \"--access-logfile\", \"-\",\n     \"--error-logfile\", \"-\"]</code></pre><div class=\"cal cal-tip\"><span class=\"cal-title\">&#10003; Database Migrations on Deploy</span><p>Always run <code>alembic upgrade head</code> as part of your deployment, before starting new app instances. The safest way: a Kubernetes init container, a Render pre-deploy command, or a CI step. Never run migrations inside the app startup code — it runs once per worker process.</p></div>"}]
</script>

<script>const CH=JSON.parse(document.getElementById('ch-data').textContent);




const SDOCS = CH.map(ch => ({
  id:    ch.id,
  track: ch.track,
  tl:    ch.tl,
  title: ch.title,
  sub:   ch.sub,
  body:  ch.content.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,500),
}));



let activeIdx = -1;
let flatResults = [];

// ── Scoring: rank matches by relevance ─────────────────────────────────────
function scoreDoc(doc, query) {
  const q   = query.toLowerCase();
  const tl  = doc.title.toLowerCase();
  const sl  = doc.sub.toLowerCase();
  const bl  = doc.body.toLowerCase();
  let score = 0;

  // Exact phrase in title = highest value
  if (tl === q)             score += 100;
  if (tl.startsWith(q))    score += 60;
  if (tl.includes(q))      score += 40;
  if (sl.includes(q))      score += 20;
  if (bl.includes(q))      score += 8;

  // Individual word matches (only for multi-word queries)
  const words = q.split(/\s+/).filter(w => w.length >= 2);
  if (words.length > 1) {
    for (const w of words) {
      if (tl.includes(w)) score += 15;
      if (sl.includes(w)) score += 7;
      if (bl.includes(w)) score += 2;
    }
  } else if (q.length >= 3) {
    // Single word: also check if title/sub CONTAINS the word as a substring
    // but only give partial credit to avoid noise
    const wordBoundary = new RegExp('\\b' + q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'i');
    if (wordBoundary.test(doc.title)) score += 25;
    if (wordBoundary.test(doc.sub))   score += 12;
  }

  return score;
}

// ── Highlight: wrap matched text in <mark> ──────────────────────────────────
function hl(text, query) {
  if (!query || !text) return esc(text || '');
  // Build regex from query words (length >= 2)
  const parts = [...new Set([query, ...query.split(/\s+/)])].filter(w => w.length >= 2);
  const pattern = parts.map(p => p.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');
  try {
    const re = new RegExp('(' + pattern + ')', 'gi');
    return esc(text).replace(re, '<mark>$1</mark>');
  } catch(e) {
    return esc(text);
  }
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Context snippet: show text around first match ───────────────────────────
function snippet(text, query, maxLen) {
  maxLen = maxLen || 110;
  const q = query.toLowerCase();
  const idx = text.toLowerCase().indexOf(q);
  if (idx < 0) {
    const s = text.slice(0, maxLen);
    return hl(s + (text.length > maxLen ? '…' : ''), query);
  }
  const pad  = 40;
  const from = Math.max(0, idx - pad);
  const to   = Math.min(text.length, idx + q.length + (maxLen - pad));
  const pre  = from > 0 ? '…' : '';
  const suf  = to < text.length ? '…' : '';
  return pre + hl(text.slice(from, to), query) + suf;
}

// ── Run search ───────────────────────────────────────────────────────────────
function runSearch(query) {
  query = (query || '').trim();
  const body = document.getElementById('search-body');
  if (!query || query.length < 1) { body.innerHTML = ''; flatResults = []; return; }

  // Score all docs
  const scored = SDOCS
    .map(doc => ({ doc, score: scoreDoc(doc, query) }))
    .filter(x => x.score > 0)
    .sort((a,b) => b.score - a.score);

  if (!scored.length) {
    body.innerHTML = '<div class="sr-empty">No results for "' + esc(query) + '"</div>';
    flatResults = [];
    return;
  }

  // Group by track: max 2 per track, total max 8
  const byTrack = {};
  for (const { doc, score } of scored) {
    if (!byTrack[doc.track]) byTrack[doc.track] = [];
    byTrack[doc.track].push({ doc, score });
  }

  flatResults = [];
  for (const t of TORDER) {
    if (byTrack[t]) flatResults.push(...byTrack[t].slice(0, 2));
  }
  // If fewer than 4 total, relax to 3 per track
  if (flatResults.length < 4) {
    flatResults = [];
    for (const t of TORDER) {
      if (byTrack[t]) flatResults.push(...byTrack[t].slice(0, 3));
    }
  }
  flatResults = flatResults.slice(0, 9);

  // Render
  let html = '';
  let lastTrack = null;
  flatResults.forEach(({ doc }, i) => {
    if (doc.track !== lastTrack) {
      lastTrack = doc.track;
      html += `<div class="sg-hdr">
        <span class="sg-dot" style="background:${TDOT[doc.track]}"></span>
        ${esc(TPHASE[doc.track])} &mdash; ${esc(TNAME[doc.track].toUpperCase())}
      </div>`;
    }
    const chIdx = CH.findIndex(c => c.id === doc.id);
    const num   = chIdx >= 0 ? String(chIdx + 1).padStart(2, '0') : '--';
    const titleHl = hl(doc.title, query);
    const subHl   = snippet(doc.sub, query, 115);
    html += `<div class="sr-row${i === activeIdx ? ' hi' : ''}" onclick="pickResult('${doc.id}')" data-i="${i}">
      <span class="sr-num">${num}</span>
      <div class="sr-body">
        <div class="sr-title">
          <span class="sr-badge ${TBADGE[doc.track]}">${esc(doc.tl)}</span>${titleHl}
        </div>
        <div class="sr-sub">${subHl}</div>
      </div>
    </div>`;
  });
  body.innerHTML = html;
  activeIdx = -1;
  syncActive();
}

function syncActive() {
  document.querySelectorAll('.sr-row').forEach((el, i) => {
    el.classList.toggle('hi', i === activeIdx);
    if (i === activeIdx) el.scrollIntoView({ block: 'nearest' });
  });
}

// ── Open / Close ─────────────────────────────────────────────────────────────
function openSearch() {
  const ov = document.getElementById('search-overlay');
  ov.style.display = 'flex';
  // Use rAF to allow display:flex to take effect before adding class
  requestAnimationFrame(() => ov.classList.add('open'));
  document.body.style.overflow = 'hidden';
  const inp = document.getElementById('search-inp');
  inp.value = '';
  document.getElementById('search-body').innerHTML = '';
  activeIdx = -1; flatResults = [];
  setTimeout(() => inp.focus(), 40);
}

function closeSearch() {
  const ov = document.getElementById('search-overlay');
  ov.classList.remove('open');
  setTimeout(() => { ov.style.display = 'none'; }, 150);
  document.body.style.overflow = '';
}

function pickResult(id) { closeSearch(); sc(id); }

document.getElementById('search-overlay').addEventListener('click', function(e) {
  if (e.target === this) closeSearch();
});

document.getElementById('search-inp').addEventListener('input', function() {
  runSearch(this.value);
});

document.getElementById('search-inp').addEventListener('keydown', function(e) {
  const n = flatResults.length;
  if (e.key === 'ArrowDown')  { e.preventDefault(); activeIdx = (activeIdx + 1) % n; syncActive(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); activeIdx = (activeIdx - 1 + n) % n; syncActive(); }
  else if (e.key === 'Enter' && activeIdx >= 0) { e.preventDefault(); pickResult(flatResults[activeIdx].doc.id); }
  else if (e.key === 'Escape') closeSearch();
});







const TC={python:'bp',flask:'bf',django:'bdj',fastapi:'bfa'};
const TD={python:'#4fc3f7',flask:'#56c596',django:'#44b78b',fastapi:'#009688'};
const TORDER=['python','flask','django','fastapi'];
const TBADGE={python:'bp',flask:'bf',django:'bdj',fastapi:'bfa'};
const TDOT={python:'#4fc3f7',flask:'#56c596',django:'#44b78b',fastapi:'#009688'};
const TPHASE={python:'Phase 1',flask:'Phase 2',django:'Phase 3',fastapi:'Phase 4'};
const TNAME={python:'Python Core',flask:'Flask',django:'Django',fastapi:'FastAPI'};
const GRP=[
  {key:'python',label:'Python Core',icon:'🐍'},
  {key:'flask', label:'Flask',       icon:'🌶'},
  {key:'django',label:'Django',      icon:'🎸'},
  {key:'fastapi',label:'FastAPI',    icon:'⚡'},
];
let cur=null;

function buildSidebar(){
  const s=document.getElementById('sidebar');
  let h='<div class="ss"><div class="sl">Navigation</div>';
  h+=`<div class="ni" onclick="showHome()" id="ni-home">🏠 Home &amp; Table of Contents</div></div>`;
  h+='<div class="ss"><div class="sl">Progress</div>';
  h+=`<div class="pb"><div class="pf" id="pf" style="width:0%"></div></div>`;
  h+=`<div style="padding:0 18px 8px;font-size:.72rem;color:var(--text3)" id="pl">0 / ${CH.length} chapters</div></div>`;
  for(const g of GRP){
    const chs=CH.filter(c=>c.track===g.key);
    h+=`<div class="ss"><div class="gh" onclick="tg('${g.key}')" id="gh-${g.key}">`;
    h+=`<span class="dot" style="background:${TD[g.key]}"></span>${g.icon} ${g.label}<span class="ar">▶</span></div>`;
    h+=`<div class="gc" id="gc-${g.key}">`;
    chs.forEach(ch=>{const n=CH.indexOf(ch)+1;h+=`<div class="ni" id="ni-${ch.id}" onclick="sc('${ch.id}')">${n}. ${ch.title}</div>`;});
    h+=`</div></div>`;
  }
  s.innerHTML=h;
}
function tg(k){document.getElementById(`gh-${k}`).classList.toggle('open');document.getElementById(`gc-${k}`).classList.toggle('open');}
function og(id){const ch=CH.find(c=>c.id===id);if(!ch)return;const gh=document.getElementById(`gh-${ch.track}`);if(gh&&!gh.classList.contains('open')){gh.classList.add('open');document.getElementById(`gc-${ch.track}`).classList.add('open');}}

function buildHome(){
  const hp=document.getElementById('hp');
  const desc={python:'From variables to async — master Python from the ground up.',flask:'Build REST APIs and web apps with the micro-framework.',django:'Production-grade full-stack with batteries included.',fastapi:'High-performance async APIs with automatic OpenAPI docs.'};
  const cards=GRP.map(g=>{const n=CH.filter(c=>c.track===g.key).length;return `<div class="tc ${g.key}" onclick="gt('${g.key}')"><div class="ti">${g.icon}</div><h3>${g.label}</h3><p>${desc[g.key]}</p><div class="tco">${n} chapters</div></div>`;}).join('');
  const toc=CH.map((ch,i)=>`<div class="ti2" onclick="sc('${ch.id}')"><span class="tn">${String(i+1).padStart(2,'0')}</span><span class="tt">${ch.title}</span><span class="tb"><span class="sr-badge ${TC[ch.track]}">${ch.tl}</span></span></div>`).join('');
  hp.innerHTML=`<div class="hh"><h1>Python <em>Mastery</em><br>From Basics to Production</h1><p>A hands-on tutorial covering Python core, Flask, Django, and FastAPI — with real projects, production patterns, and the packages that matter.</p></div><div class="ht">${cards}</div><div class="htoc"><h2>All ${CH.length} Chapters</h2><div class="tg">${toc}</div></div>`;
}
function gt(t){const f=CH.find(c=>c.track===t);if(f)sc(f.id);}

function showHome(){
  document.getElementById('hp').style.display='block';
  document.getElementById('cp').style.display='none';
  cur=null;
  document.querySelectorAll('.ni').forEach(e=>e.classList.remove('active'));
  const h=document.getElementById('ni-home');if(h)h.classList.add('active');
  closeSidebar();
}
function sc(id){
  const idx=CH.findIndex(c=>c.id===id);if(idx<0)return;
  const ch=CH[idx];cur=id;
  document.getElementById('hp').style.display='none';
  document.getElementById('cp').style.display='block';
  const prev=idx>0?CH[idx-1]:null,next=idx<CH.length-1?CH[idx+1]:null;
  document.getElementById('ch-wrap').innerHTML=`<div class="cm2"><span class="sr-badge ${TC[ch.track]}">${ch.tl}</span><span class="cn">Chapter ${idx+1} of ${CH.length}</span></div><h1 class="ct">${ch.title}</h1><p class="cs">${ch.sub}</p><div class="cb">${ch.content}</div><nav class="cnav">${prev?`<div class="nb2" onclick="sc('${prev.id}')"><span class="nar">←</span><div><span class="bl">Previous</span><span class="bt">${prev.title}</span></div></div>`:`<div class="nb2 dis"><span class="nar">←</span><div><span class="bl">Previous</span><span class="bt">—</span></div></div>`}${next?`<div class="nb2 rt" onclick="sc('${next.id}')"><div><span class="bl">Next</span><span class="bt">${next.title}</span></div><span class="nar">→</span></div>`:`<div class="nb2 rt dis"><div><span class="bl">Next</span><span class="bt">—</span></div><span class="nar">→</span></div>`}</nav>`;
  document.querySelectorAll('.ni').forEach(e=>e.classList.remove('active'));
  const ni=document.getElementById(`ni-${id}`);if(ni){ni.classList.add('active');ni.scrollIntoView({block:'nearest'});}
  og(id);upProg();window.scrollTo(0,0);closeSidebar();
}
function getV(){try{return new Set(JSON.parse(localStorage.getItem('pym_v')||'[]'));}catch{return new Set();}}
function markV(id){const v=getV();v.add(id);try{localStorage.setItem('pym_v',JSON.stringify([...v]));}catch{}}
function upProg(){if(cur)markV(cur);const v=getV(),n=CH.filter(c=>v.has(c.id)).length,pct=Math.round(n/CH.length*100);const pf=document.getElementById('pf'),pl=document.getElementById('pl');if(pf)pf.style.width=pct+'%';if(pl)pl.textContent=`${n} / ${CH.length} chapters`;}
function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('ov').classList.toggle('show');}
function closeSidebar(){document.getElementById('sidebar').classList.remove('open');document.getElementById('ov').classList.remove('show');}
document.getElementById('ov').addEventListener('click',closeSidebar);
document.addEventListener('keydown',e=>{
  if(document.getElementById('search-overlay').classList.contains('open'))return;
  if(e.target.tagName==='INPUT')return;
  if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();openSearch();return;}
  if(e.key==='ArrowRight'&&cur){const i=CH.findIndex(c=>c.id===cur);if(i<CH.length-1)sc(CH[i+1].id);}
  if(e.key==='ArrowLeft'&&cur){const i=CH.findIndex(c=>c.id===cur);if(i>0)sc(CH[i-1].id);}
});
buildSidebar();buildHome();upProg();showHome();

</script>
