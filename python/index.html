as_next,\n    })\n\n<span class=\"dc\">@posts_bp.route</span>(<span class=\"st\">\"/\"</span>, methods<span class=\"op\">=</span>[<span class=\"st\">\"POST\"</span>])\n<span class=\"dc\">@jwt_required</span>()  <span class=\"cm\"># requires a valid JWT token in the Authorization header</span>\n<span class=\"kw\">def</span> <span class=\"fn\">create_post</span>():\n    <span class=\"st\">\"\"\"Create a new post. Requires authentication.\"\"\"</span>\n    author_id <span class=\"op\">=</span> <span class=\"fn\">get_jwt_identity</span>()  <span class=\"cm\"># extracted from the token</span>\n    data      <span class=\"op\">=</span> request.<span class=\"fn\">get_json</span>()\n    \n    <span class=\"kw\">if</span> <span class=\"kw\">not</span> data <span class=\"kw\">or</span> <span class=\"kw\">not</span> data.<span class=\"fn\">get</span>(<span class=\"st\">\"title\"</span>) <span class=\"kw\">or</span> <span class=\"kw\">not</span> data.<span class=\"fn\">get</span>(<span class=\"st\">\"body\"</span>):\n        <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>({<span class=\"st\">\"error\"</span>: <span class=\"st\">\"title and body are required\"</span>}), <span class=\"nb\">400</span>\n    \n    post <span class=\"op\">=</span> <span class=\"fn\">Post</span>(title<span class=\"op\">=</span>data[<span class=\"st\">\"title\"</span>], body<span class=\"op\">=</span>data[<span class=\"st\">\"body\"</span>], author_id<span class=\"op\">=</span>author_id)\n    db.session.<span class=\"fn\">add</span>(post)\n    db.session.<span class=\"fn\">commit</span>()\n    <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>(post.<span class=\"fn\">to_dict</span>()), <span class=\"nb\">201</span>\n\n<span class=\"dc\">@posts_bp.route</span>(<span class=\"st\">\"/\"</span>, methods<span class=\"op\">=</span>[<span class=\"st\">\"GET\"</span>])\n<span class=\"kw\">def</span> <span class=\"fn\">get_post</span>(post_id: <span class=\"fn\">int</span>):\n    post <span class=\"op\">=</span> db.session.<span class=\"fn\">get</span>(<span class=\"nm\">Post</span>, post_id) <span class=\"kw\">or</span> <span class=\"fn\">abort</span>(<span class=\"nb\">404</span>)\n    <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>(post.<span class=\"fn\">to_dict</span>())\n\n<span class=\"dc\">@posts_bp.route</span>(<span class=\"st\">\"/\"</span>, methods<span class=\"op\">=</span>[<span class=\"st\">\"PUT\"</span>])\n<span class=\"dc\">@jwt_required</span>()\n<span class=\"kw\">def</span> <span class=\"fn\">update_post</span>(post_id: <span class=\"fn\">int</span>):\n    post <span class=\"op\">=</span> db.session.<span class=\"fn\">get</span>(<span class=\"nm\">Post</span>, post_id) <span class=\"kw\">or</span> <span class=\"fn\">abort</span>(<span class=\"nb\">404</span>)\n    data <span class=\"op\">=</span> request.<span class=\"fn\">get_json</span>()\n    post.title <span class=\"op\">=</span> data.<span class=\"fn\">get</span>(<span class=\"st\">\"title\"</span>, post.title)\n    post.body  <span class=\"op\">=</span> data.<span class=\"fn\">get</span>(<span class=\"st\">\"body\"</span>,  post.body)\n    db.session.<span class=\"fn\">commit</span>()\n    <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>(post.<span class=\"fn\">to_dict</span>())\n\n<span class=\"dc\">@posts_bp.route</span>(<span class=\"st\">\"/\"</span>, methods<span class=\"op\">=</span>[<span class=\"st\">\"DELETE\"</span>])\n<span class=\"dc\">@jwt_required</span>()\n<span class=\"kw\">def</span> <span class=\"fn\">delete_post</span>(post_id: <span class=\"fn\">int</span>):\n    post <span class=\"op\">=</span> db.session.<span class=\"fn\">get</span>(<span class=\"nm\">Post</span>, post_id) <span class=\"kw\">or</span> <span class=\"fn\">abort</span>(<span class=\"nb\">404</span>)\n    db.session.<span class=\"fn\">delete</span>(post)\n    db.session.<span class=\"fn\">commit</span>()\n    <span class=\"kw\">return</span> <span class=\"st\">\"\"</span>, <span class=\"nb\">204</span>   <span class=\"cm\"># 204 No Content — success, no body</span></code></pre><h2>Error Handlers</h2><p>Flask lets you register functions to handle specific HTTP error codes or exception types globally. Without custom handlers, Flask returns HTML error pages — not ideal for an API. Register JSON error handlers to ensure every error response is consistent.</p><div class=\"cl\">python — global error handlers</div><pre><code><span class=\"kw\">from</span> flask <span class=\"kw\">import</span> jsonify\n<span class=\"kw\">from</span> werkzeug.exceptions <span class=\"kw\">import</span> <span class=\"nm\">HTTPException</span>\n\n<span class=\"dc\">@app.errorhandler</span>(<span class=\"nb\">400</span>)\n<span class=\"kw\">def</span> <span class=\"fn\">bad_request</span>(e):\n    <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>({<span class=\"st\">\"error\"</span>: <span class=\"st\">\"Bad request\"</span>, <span class=\"st\">\"message\"</span>: <span class=\"fn\">str</span>(e), <span class=\"st\">\"code\"</span>: <span class=\"nb\">400</span>}), <span class=\"nb\">400</span>\n\n<span class=\"dc\">@app.errorhandler</span>(<span class=\"nb\">401</span>)\n<span class=\"kw\">def</span> <span class=\"fn\">unauthorized</span>(e):\n    <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>({<span class=\"st\">\"error\"</span>: <span class=\"st\">\"Unauthorized\"</span>, <span class=\"st\">\"message\"</span>: <span class=\"st\">\"Authentication required\"</span>, <span class=\"st\">\"code\"</span>: <span class=\"nb\">401</span>}), <span class=\"nb\">401</span>\n\n<span class=\"dc\">@app.errorhandler</span>(<span class=\"nb\">403</span>)\n<span class=\"kw\">def</span> <span class=\"fn\">forbidden</span>(e):\n    <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>({<span class=\"st\">\"error\"</span>: <span class=\"st\">\"Forbidden\"</span>, <span class=\"st\">\"message\"</span>: <span class=\"fn\">str</span>(e), <span class=\"st\">\"code\"</span>: <span class=\"nb\">403</span>}), <span class=\"nb\">403</span>\n\n<span class=\"dc\">@app.errorhandler</span>(<span class=\"nb\">404</span>)\n<span class=\"kw\">def</span> <span class=\"fn\">not_found</span>(e):\n    <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>({<span class=\"st\">\"error\"</span>: <span class=\"st\">\"Not found\"</span>, <span class=\"st\">\"message\"</span>: <span class=\"fn\">str</span>(e), <span class=\"st\">\"code\"</span>: <span class=\"nb\">404</span>}), <span class=\"nb\">404</span>\n\n<span class=\"dc\">@app.errorhandler</span>(<span class=\"nb\">422</span>)\n<span class=\"kw\">def</span> <span class=\"fn\">unprocessable</span>(e):\n    <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>({<span class=\"st\">\"error\"</span>: <span class=\"st\">\"Validation error\"</span>, <span class=\"st\">\"details\"</span>: e.description, <span class=\"st\">\"code\"</span>: <span class=\"nb\">422</span>}), <span class=\"nb\">422</span>\n\n<span class=\"dc\">@app.errorhandler</span>(<span class=\"nm\">Exception</span>)\n<span class=\"kw\">def</span> <span class=\"fn\">generic_error</span>(e):\n    <span class=\"kw\">if</span> <span class=\"fn\">isinstance</span>(e, <span class=\"nm\">HTTPException</span>):\n        <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>({<span class=\"st\">\"error\"</span>: e.name, <span class=\"st\">\"code\"</span>: e.code}), e.code\n    <span class=\"cm\"># Unknown error — log it, return generic message</span>\n    app.logger.<span class=\"fn\">exception</span>(<span class=\"st\">\"Unhandled exception\"</span>)\n    <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>({<span class=\"st\">\"error\"</span>: <span class=\"st\">\"Internal server error\"</span>, <span class=\"st\">\"code\"</span>: <span class=\"nb\">500</span>}), <span class=\"nb\">500</span></code></pre>"},{"id":"fl-03","track":"flask","tl":"Flask","title":"SQLAlchemy Models &amp; JWT Auth","sub":"Defining models with relationships, ORM queries, Flask-Migrate, JWT auth, and RBAC.","content":"<h2>SQLAlchemy Models</h2><p>Flask-SQLAlchemy integrates SQLAlchemy's powerful ORM (Object-Relational Mapper) with Flask. Instead of writing raw SQL, you define Python classes that map to database tables. SQLAlchemy handles the SQL generation, connection pooling, and transaction management.</p><p>The key concept: each class is a <em>model</em> that maps to a table. Each instance of the class is a <em>row</em>. Relationships between tables are expressed as Python attributes, not JOIN statements.</p><div class=\"cl\">python — app/models/user.py</div><pre><code><span class=\"kw\">from</span> datetime <span class=\"kw\">import</span> datetime, timezone\n<span class=\"kw\">from</span> werkzeug.security <span class=\"kw\">import</span> generate_password_hash, check_password_hash\n<span class=\"kw\">from</span> ..extensions <span class=\"kw\">import</span> db\n\n<span class=\"kw\">class</span> <span class=\"fn\">User</span>(db.<span class=\"nm\">Model</span>):\n    __tablename__ <span class=\"op\">=</span> <span class=\"st\">\"users\"</span>  <span class=\"cm\"># explicit table name (defaults to class name lowercased)</span>\n    \n    <span class=\"cm\"># Columns — each is a Python attribute that maps to a DB column</span>\n    <span class=\"fn\">id</span>         <span class=\"op\">=</span> db.<span class=\"fn\">Column</span>(db.<span class=\"nm\">Integer</span>, primary_key<span class=\"op\">=</span><span class=\"kw\">True</span>)           <span class=\"cm\"># auto-increment PK</span>\n    username   <span class=\"op\">=</span> db.<span class=\"fn\">Column</span>(db.<span class=\"fn\">String</span>(<span class=\"nb\">80</span>),  unique<span class=\"op\">=</span><span class=\"kw\">True</span>, nullable<span class=\"op\">=</span><span class=\"kw\">False</span>, index<span class=\"op\">=</span><span class=\"kw\">True</span>)\n    email      <span class=\"op\">=</span> db.<span class=\"fn\">Column</span>(db.<span class=\"fn\">String</span>(<span class=\"nb\">120</span>), unique<span class=\"op\">=</span><span class=\"kw\">True</span>, nullable<span class=\"op\">=</span><span class=\"kw\">False</span>, index<span class=\"op\">=</span><span class=\"kw\">True</span>)\n    _password  <span class=\"op\">=</span> db.<span class=\"fn\">Column</span>(<span class=\"st\">\"password\"</span>, db.<span class=\"fn\">String</span>(<span class=\"nb\">256</span>), nullable<span class=\"op\">=</span><span class=\"kw\">False</span>)  <span class=\"cm\"># internal name</span>\n    created_at <span class=\"op\">=</span> db.<span class=\"fn\">Column</span>(db.<span class=\"nm\">DateTime</span>, default<span class=\"op\">=</span><span class=\"kw\">lambda</span>: datetime.<span class=\"fn\">now</span>(timezone.utc))\n    is_active  <span class=\"op\">=</span> db.<span class=\"fn\">Column</span>(db.<span class=\"nm\">Boolean</span>,  default<span class=\"op\">=</span><span class=\"kw\">True</span>)\n    \n    <span class=\"cm\"># Relationship — Post objects related to this user</span>\n    <span class=\"cm\"># backref='author' adds a .author attribute to Post instances</span>\n    <span class=\"cm\"># lazy='dynamic' means posts are not loaded until you access them</span>\n    posts <span class=\"op\">=</span> db.<span class=\"fn\">relationship</span>(<span class=\"st\">\"Post\"</span>, backref<span class=\"op\">=</span><span class=\"st\">\"author\"</span>, lazy<span class=\"op\">=</span><span class=\"st\">\"dynamic\"</span>,\n                            cascade<span class=\"op\">=</span><span class=\"st\">\"all, delete-orphan\"</span>)\n    \n    <span class=\"cm\"># Property hides the raw _password column</span>\n    <span class=\"dc\">@property</span>\n    <span class=\"kw\">def</span> <span class=\"fn\">password</span>(self):\n        <span class=\"kw\">raise</span> <span class=\"fn\">AttributeError</span>(<span class=\"st\">\"Password is write-only\"</span>)\n    \n    <span class=\"dc\">@password.setter</span>\n    <span class=\"kw\">def</span> <span class=\"fn\">password</span>(self, value: <span class=\"fn\">str</span>):\n        <span class=\"st\">\"\"\"Hash the password before storing — never store plaintext.\"\"\"</span>\n        self._password <span class=\"op\">=</span> <span class=\"fn\">generate_password_hash</span>(value)\n    \n    <span class=\"kw\">def</span> <span class=\"fn\">check_password</span>(self, password: <span class=\"fn\">str</span>) <span class=\"op\">-&gt;</span> <span class=\"fn\">bool</span>:\n        <span class=\"st\">\"\"\"Verify a plain password against the stored hash.\"\"\"</span>\n        <span class=\"kw\">return</span> <span class=\"fn\">check_password_hash</span>(self._password, password)\n    \n    <span class=\"kw\">def</span> <span class=\"fn\">to_dict</span>(self) <span class=\"op\">-&gt;</span> <span class=\"fn\">dict</span>:\n        <span class=\"st\">\"\"\"Serialise to a JSON-safe dictionary (excludes password).\"\"\"</span>\n        <span class=\"kw\">return</span> {\n            <span class=\"st\">\"id\"</span>:         self.<span class=\"fn\">id</span>,\n            <span class=\"st\">\"username\"</span>:   self.username,\n            <span class=\"st\">\"email\"</span>:      self.email,\n            <span class=\"st\">\"created_at\"</span>: self.created_at.<span class=\"fn\">isoformat</span>(),\n            <span class=\"st\">\"is_active\"</span>:  self.is_active,\n        }\n    \n    <span class=\"kw\">def</span> <span class=\"fn\">__repr__</span>(self) <span class=\"op\">-&gt;</span> <span class=\"fn\">str</span>:\n        <span class=\"kw\">return</span> f<span class=\"st\">\"User(id={self.id}, username={self.username!r})\"</span></code></pre><div class=\"cl\">python — app/models/post.py</div><pre><code><span class=\"kw\">from</span> ..extensions <span class=\"kw\">import</span> db\n\n<span class=\"cm\"># Many-to-many relationship requires a junction table</span>\npost_tags <span class=\"op\">=</span> db.<span class=\"fn\">Table</span>(\n    <span class=\"st\">\"post_tags\"</span>,\n    db.<span class=\"fn\">Column</span>(<span class=\"st\">\"post_id\"</span>, db.<span class=\"nm\">Integer</span>, db.<span class=\"fn\">ForeignKey</span>(<span class=\"st\">\"posts.id\"</span>),  primary_key<span class=\"op\">=</span><span class=\"kw\">True</span>),\n    db.<span class=\"fn\">Column</span>(<span class=\"st\">\"tag_id\"</span>,  db.<span class=\"nm\">Integer</span>, db.<span class=\"fn\">ForeignKey</span>(<span class=\"st\">\"tags.id\"</span>),   primary_key<span class=\"op\">=</span><span class=\"kw\">True</span>),\n)\n\n<span class=\"kw\">class</span> <span class=\"fn\">Post</span>(db.<span class=\"nm\">Model</span>):\n    __tablename__ <span class=\"op\">=</span> <span class=\"st\">\"posts\"</span>\n    \n    <span class=\"fn\">id</span>        <span class=\"op\">=</span> db.<span class=\"fn\">Column</span>(db.<span class=\"nm\">Integer</span>, primary_key<span class=\"op\">=</span><span class=\"kw\">True</span>)\n    title     <span class=\"op\">=</span> db.<span class=\"fn\">Column</span>(db.<span class=\"fn\">String</span>(<span class=\"nb\">200</span>), nullable<span class=\"op\">=</span><span class=\"kw\">False</span>)\n    body      <span class=\"op\">=</span> db.<span class=\"fn\">Column</span>(db.<span class=\"nm\">Text</span>,        nullable<span class=\"op\">=</span><span class=\"kw\">False</span>)\n    excerpt   <span class=\"op\">=</span> db.<span class=\"fn\">Column</span>(db.<span class=\"fn\">String</span>(<span class=\"nb\">500</span>))\n    author_id <span class=\"op\">=</span> db.<span class=\"fn\">Column</span>(db.<span class=\"nm\">Integer</span>, db.<span class=\"fn\">ForeignKey</span>(<span class=\"st\">\"users.id\"</span>), nullable<span class=\"op\">=</span><span class=\"kw\">False</span>)\n    tags      <span class=\"op\">=</span> db.<span class=\"fn\">relationship</span>(<span class=\"st\">\"Tag\"</span>, secondary<span class=\"op\">=</span>post_tags, backref<span class=\"op\">=</span><span class=\"st\">\"posts\"</span>)\n    views     <span class=\"op\">=</span> db.<span class=\"fn\">Column</span>(db.<span class=\"nm\">Integer</span>, default<span class=\"op\">=</span><span class=\"nb\">0</span>)\n    status    <span class=\"op\">=</span> db.<span class=\"fn\">Column</span>(db.<span class=\"fn\">String</span>(<span class=\"nb\">20</span>), default<span class=\"op\">=</span><span class=\"st\">\"draft\"</span>)  <span class=\"cm\"># draft | published</span>\n    created_at<span class=\"op\">=</span> db.<span class=\"fn\">Column</span>(db.<span class=\"nm\">DateTime</span>,  server_default<span class=\"op\">=</span>db.func.<span class=\"fn\">now</span>())\n    updated_at<span class=\"op\">=</span> db.<span class=\"fn\">Column</span>(db.<span class=\"nm\">DateTime</span>,  onupdate<span class=\"op\">=</span>db.func.<span class=\"fn\">now</span>())\n\n<span class=\"kw\">class</span> <span class=\"fn\">Tag</span>(db.<span class=\"nm\">Model</span>):\n    __tablename__ <span class=\"op\">=</span> <span class=\"st\">\"tags\"</span>\n    <span class=\"fn\">id</span>   <span class=\"op\">=</span> db.<span class=\"fn\">Column</span>(db.<span class=\"nm\">Integer</span>, primary_key<span class=\"op\">=</span><span class=\"kw\">True</span>)\n    name <span class=\"op\">=</span> db.<span class=\"fn\">Column</span>(db.<span class=\"fn\">String</span>(<span class=\"nb\">50</span>), unique<span class=\"op\">=</span><span class=\"kw\">True</span>, nullable<span class=\"op\">=</span><span class=\"kw\">False</span>)</code></pre><h2>Querying with SQLAlchemy</h2><p>SQLAlchemy provides a rich query API that generates optimised SQL. For simple cases, the <code>Model.query</code> shorthand is convenient. For complex queries, use the core <code>select()</code> API.</p><div class=\"cl\">python — ORM queries</div><pre><code><span class=\"cm\"># Get by primary key — returns None if not found</span>\nuser <span class=\"op\">=</span> db.session.<span class=\"fn\">get</span>(<span class=\"nm\">User</span>, <span class=\"nb\">1</span>)\n\n<span class=\"cm\"># Filter — returns a Query object (lazy, not executed yet)</span>\nalice <span class=\"op\">=</span> <span class=\"nm\">User</span>.query.<span class=\"fn\">filter_by</span>(username<span class=\"op\">=</span><span class=\"st\">\"alice\"</span>).<span class=\"fn\">first</span>()          <span class=\"cm\"># first or None</span>\nalice <span class=\"op\">=</span> <span class=\"nm\">User</span>.query.<span class=\"fn\">filter_by</span>(username<span class=\"op\">=</span><span class=\"st\">\"alice\"</span>).<span class=\"fn\">first_or_404</span>()   <span class=\"cm\"># 404 if not found</span>\n\n<span class=\"cm\"># Complex filters with operators</span>\n<span class=\"kw\">from</span> sqlalchemy <span class=\"kw\">import</span> or_, and_, desc\n\nactive_admins <span class=\"op\">=</span> <span class=\"nm\">User</span>.query.<span class=\"fn\">filter</span>(\n    <span class=\"nm\">User</span>.is_active <span class=\"op\">==</span> <span class=\"kw\">True</span>,\n    <span class=\"nm\">User</span>.role <span class=\"op\">==</span> <span class=\"st\">\"admin\"</span>\n).<span class=\"fn\">all</span>()\n\n<span class=\"cm\"># OR condition</span>\nposts <span class=\"op\">=</span> <span class=\"nm\">Post</span>.query.<span class=\"fn\">filter</span>(\n    <span class=\"fn\">or_</span>(<span class=\"nm\">Post</span>.title.<span class=\"fn\">ilike</span>(<span class=\"st\">\"%python%\"</span>), <span class=\"nm\">Post</span>.body.<span class=\"fn\">ilike</span>(<span class=\"st\">\"%python%\"</span>))\n).<span class=\"fn\">all</span>()\n\n<span class=\"cm\"># Ordering and limiting</span>\nrecent <span class=\"op\">=</span> <span class=\"nm\">Post</span>.query.<span class=\"fn\">order_by</span>(<span class=\"fn\">desc</span>(<span class=\"nm\">Post</span>.created_at)).<span class=\"fn\">limit</span>(<span class=\"nb\">10</span>).<span class=\"fn\">all</span>()\n\n<span class=\"cm\"># Pagination — returns Pagination object with items, total, pages, etc.</span>\npage <span class=\"op\">=</span> <span class=\"nm\">Post</span>.query.<span class=\"fn\">paginate</span>(page<span class=\"op\">=</span><span class=\"nb\">2</span>, per_page<span class=\"op\">=</span><span class=\"nb\">10</span>, error_out<span class=\"op\">=</span><span class=\"kw\">False</span>)\n<span class=\"kw\">for</span> post <span class=\"kw\">in</span> page.items:\n    <span class=\"fn\">print</span>(post.title)\n\n<span class=\"cm\"># Aggregation</span>\n<span class=\"kw\">from</span> sqlalchemy <span class=\"kw\">import</span> func\npost_count <span class=\"op\">=</span> db.session.<span class=\"fn\">query</span>(func.<span class=\"fn\">count</span>(<span class=\"nm\">Post</span>.<span class=\"fn\">id</span>)).<span class=\"fn\">scalar</span>()\navg_views  <span class=\"op\">=</span> db.session.<span class=\"fn\">query</span>(func.<span class=\"fn\">avg</span>(<span class=\"nm\">Post</span>.views)).<span class=\"fn\">scalar</span>()\n\n<span class=\"cm\"># Create, update, delete</span>\nnew_user <span class=\"op\">=</span> <span class=\"fn\">User</span>(username<span class=\"op\">=</span><span class=\"st\">\"bob\"</span>, email<span class=\"op\">=</span><span class=\"st\">\"bob@example.com\"</span>)\nnew_user.password <span class=\"op\">=</span> <span class=\"st\">\"securepass\"</span>\ndb.session.<span class=\"fn\">add</span>(new_user)\ndb.session.<span class=\"fn\">commit</span>()           <span class=\"cm\"># writes to DB</span>\n\nuser.email <span class=\"op\">=</span> <span class=\"st\">\"newemail@example.com\"</span>\ndb.session.<span class=\"fn\">commit</span>()           <span class=\"cm\"># update</span>\n\ndb.session.<span class=\"fn\">delete</span>(user)\ndb.session.<span class=\"fn\">commit</span>()           <span class=\"cm\"># delete</span></code></pre><h2>Migrations with Flask-Migrate</h2><p>Every time you change your models (add a column, rename a table, change a type), you need to update the database schema to match. Flask-Migrate (built on Alembic) tracks these changes as <em>migration files</em> — versioned scripts that can be applied forward (upgrade) or reversed (downgrade). This gives you a complete, reproducible history of every schema change.</p><div class=\"cl\">bash — migration workflow</div><pre><code><span class=\"cm\"># 1. One-time setup: create the migrations/ directory</span>\n<span class=\"fn\">flask</span> db init\n\n<span class=\"cm\"># 2. After changing your models, generate a migration</span>\n<span class=\"fn\">flask</span> db migrate -m <span class=\"st\">\"Add views column to posts\"</span>\n<span class=\"cm\"># This compares your models to the current DB and generates a migration script</span>\n\n<span class=\"cm\"># 3. Review the generated migration file in migrations/versions/</span>\n<span class=\"cm\"># Always check it — auto-generation isn't perfect for complex changes</span>\n\n<span class=\"cm\"># 4. Apply the migration to your database</span>\n<span class=\"fn\">flask</span> db upgrade\n\n<span class=\"cm\"># 5. If something goes wrong, revert</span>\n<span class=\"fn\">flask</span> db downgrade\n\n<span class=\"cm\"># 6. Show migration history</span>\n<span class=\"fn\">flask</span> db history\n<span class=\"fn\">flask</span> db current   <span class=\"cm\"># which migration is applied right now</span></code></pre><h2>JWT Authentication</h2><div class=\"cl\">python — routes/auth.py</div><pre><code><span class=\"kw\">from</span> flask <span class=\"kw\">import</span> <span class=\"nm\">Blueprint</span>, request, jsonify\n<span class=\"kw\">from</span> flask_jwt_extended <span class=\"kw\">import</span> (\n    create_access_token, create_refresh_token,\n    jwt_required, get_jwt_identity\n)\n<span class=\"kw\">from</span> ..models.user <span class=\"kw\">import</span> <span class=\"nm\">User</span>\n<span class=\"kw\">from</span> ..extensions <span class=\"kw\">import</span> db\n\nauth_bp <span class=\"op\">=</span> <span class=\"fn\">Blueprint</span>(<span class=\"st\">\"auth\"</span>, __name__)\n\n<span class=\"dc\">@auth_bp.route</span>(<span class=\"st\">\"/register\"</span>, methods<span class=\"op\">=</span>[<span class=\"st\">\"POST\"</span>])\n<span class=\"kw\">def</span> <span class=\"fn\">register</span>():\n    <span class=\"st\">\"\"\"Create a new user account.\"\"\"</span>\n    data <span class=\"op\">=</span> request.<span class=\"fn\">get_json</span>()\n    \n    <span class=\"kw\">if</span> <span class=\"nm\">User</span>.query.<span class=\"fn\">filter_by</span>(email<span class=\"op\">=</span>data.<span class=\"fn\">get</span>(<span class=\"st\">\"email\"</span>)).<span class=\"fn\">first</span>():\n        <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>({<span class=\"st\">\"error\"</span>: <span class=\"st\">\"Email already registered\"</span>}), <span class=\"nb\">409</span>\n    \n    user <span class=\"op\">=</span> <span class=\"fn\">User</span>(username<span class=\"op\">=</span>data[<span class=\"st\">\"username\"</span>], email<span class=\"op\">=</span>data[<span class=\"st\">\"email\"</span>])\n    user.password <span class=\"op\">=</span> data[<span class=\"st\">\"password\"</span>]   <span class=\"cm\"># setter hashes it automatically</span>\n    db.session.<span class=\"fn\">add</span>(user)\n    db.session.<span class=\"fn\">commit</span>()\n    \n    <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>(user.<span class=\"fn\">to_dict</span>()), <span class=\"nb\">201</span>\n\n<span class=\"dc\">@auth_bp.route</span>(<span class=\"st\">\"/login\"</span>, methods<span class=\"op\">=</span>[<span class=\"st\">\"POST\"</span>])\n<span class=\"kw\">def</span> <span class=\"fn\">login</span>():\n    <span class=\"st\">\"\"\"Authenticate and return JWT tokens.\"\"\"</span>\n    data <span class=\"op\">=</span> request.<span class=\"fn\">get_json</span>()\n    user <span class=\"op\">=</span> <span class=\"nm\">User</span>.query.<span class=\"fn\">filter_by</span>(email<span class=\"op\">=</span>data.<span class=\"fn\">get</span>(<span class=\"st\">\"email\"</span>)).<span class=\"fn\">first</span>()\n    \n    <span class=\"kw\">if</span> <span class=\"kw\">not</span> user <span class=\"kw\">or</span> <span class=\"kw\">not</span> user.<span class=\"fn\">check_password</span>(data.<span class=\"fn\">get</span>(<span class=\"st\">\"password\"</span>, <span class=\"st\">\"\"</span>)):\n        <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>({<span class=\"st\">\"error\"</span>: <span class=\"st\">\"Invalid credentials\"</span>}), <span class=\"nb\">401</span>\n    \n    <span class=\"cm\"># Create tokens — identity is stored in the JWT payload</span>\n    access_token  <span class=\"op\">=</span> <span class=\"fn\">create_access_token</span>(identity<span class=\"op\">=</span>user.<span class=\"fn\">id</span>)\n    refresh_token <span class=\"op\">=</span> <span class=\"fn\">create_refresh_token</span>(identity<span class=\"op\">=</span>user.<span class=\"fn\">id</span>)\n    \n    <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>({\n        <span class=\"st\">\"access_token\"</span>:  access_token,\n        <span class=\"st\">\"refresh_token\"</span>: refresh_token,\n        <span class=\"st\">\"user\"</span>:          user.<span class=\"fn\">to_dict</span>(),\n    })\n\n<span class=\"dc\">@auth_bp.route</span>(<span class=\"st\">\"/refresh\"</span>, methods<span class=\"op\">=</span>[<span class=\"st\">\"POST\"</span>])\n<span class=\"dc\">@jwt_required</span>(refresh<span class=\"op\">=</span><span class=\"kw\">True</span>)   <span class=\"cm\"># only accepts refresh tokens</span>\n<span class=\"kw\">def</span> <span class=\"fn\">refresh</span>():\n    <span class=\"st\">\"\"\"Get a new access token using a refresh token.\"\"\"</span>\n    user_id      <span class=\"op\">=</span> <span class=\"fn\">get_jwt_identity</span>()\n    access_token <span class=\"op\">=</span> <span class=\"fn\">create_access_token</span>(identity<span class=\"op\">=</span>user_id)\n    <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>({<span class=\"st\">\"access_token\"</span>: access_token})\n\n<span class=\"dc\">@auth_bp.route</span>(<span class=\"st\">\"/me\"</span>, methods<span class=\"op\">=</span>[<span class=\"st\">\"GET\"</span>])\n<span class=\"dc\">@jwt_required</span>()   <span class=\"cm\"># requires valid access token in Authorization: Bearer </span>\n<span class=\"kw\">def</span> <span class=\"fn\">get_current_user</span>():\n    <span class=\"st\">\"\"\"Return the authenticated user's profile.\"\"\"</span>\n    user_id <span class=\"op\">=</span> <span class=\"fn\">get_jwt_identity</span>()\n    user    <span class=\"op\">=</span> db.session.<span class=\"fn\">get</span>(<span class=\"nm\">User</span>, user_id)\n    <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>(user.<span class=\"fn\">to_dict</span>())</code></pre>"},{"id":"fl-04","track":"flask","tl":"Flask","title":"Marshmallow, Caching &amp; Rate Limiting","sub":"Schema-based validation with marshmallow, Redis caching, and Flask-Limiter.","content":"<h2>Marshmallow — Schema-Driven Validation</h2><p>Marshmallow is Flask's most popular serialisation and validation library. It bridges the gap between raw HTTP request data (untyped dicts, strings) and your application's domain objects. Every API endpoint that receives data needs to validate it — marshmallow makes this declarative and reusable.</p><p>The core concept is a <em>Schema</em> — a class that describes the shape of your data. The same schema validates incoming data (<em>deserialization</em>) and formats outgoing data (<em>serialization</em>). Define it once, use it everywhere.</p><div class=\"cl\">python — marshmallow schema definition</div><pre><code><span class=\"kw\">from</span> marshmallow <span class=\"kw\">import</span> <span class=\"nm\">Schema</span>, fields, validate, validates, <span class=\"fn\">ValidationError</span>, post_load\n<span class=\"kw\">from</span> datetime <span class=\"kw\">import</span> datetime\n\n<span class=\"kw\">class</span> <span class=\"fn\">PostSchema</span>(<span class=\"nm\">Schema</span>):\n    <span class=\"st\">\"\"\"Defines the shape of a blog post for both input (create/update)\n    and output (API responses). The same class handles both directions.\n    \"\"\"</span>\n    <span class=\"cm\"># dump_only=True — only included in OUTPUT (responses), ignored in INPUT</span>\n    <span class=\"fn\">id</span>         <span class=\"op\">=</span> fields.<span class=\"fn\">Int</span>(dump_only<span class=\"op\">=</span><span class=\"kw\">True</span>)\n    created_at <span class=\"op\">=</span> fields.<span class=\"fn\">DateTime</span>(dump_only<span class=\"op\">=</span><span class=\"kw\">True</span>)\n    \n    <span class=\"cm\"># Required input fields</span>\n    title <span class=\"op\">=</span> fields.<span class=\"fn\">Str</span>(\n        required<span class=\"op\">=</span><span class=\"kw\">True</span>,\n        validate<span class=\"op\">=</span>[\n            validate.<span class=\"fn\">Length</span>(<span class=\"fn\">min</span><span class=\"op\">=</span><span class=\"nb\">5</span>, <span class=\"fn\">max</span><span class=\"op\">=</span><span class=\"nb\">200</span>,\n                            error<span class=\"op\">=</span><span class=\"st\">\"Title must be 5-200 characters\"</span>),\n            validate.<span class=\"fn\">Regexp</span>(r<span class=\"st\">\".*\\S.*\"</span>,\n                            error<span class=\"op\">=</span><span class=\"st\">\"Title cannot be only whitespace\"</span>),\n        ]\n    )\n    body <span class=\"op\">=</span> fields.<span class=\"fn\">Str</span>(\n        required<span class=\"op\">=</span><span class=\"kw\">True</span>,\n        validate<span class=\"op\">=</span>validate.<span class=\"fn\">Length</span>(<span class=\"fn\">min</span><span class=\"op\">=</span><span class=\"nb\">20</span>, error<span class=\"op\">=</span><span class=\"st\">\"Body must be at least 20 characters\"</span>)\n    )\n    \n    <span class=\"cm\"># Optional fields with defaults</span>\n    status <span class=\"op\">=</span> fields.<span class=\"fn\">Str</span>(\n        load_default<span class=\"op\">=</span><span class=\"st\">\"draft\"</span>,\n        validate<span class=\"op\">=</span>validate.<span class=\"fn\">OneOf</span>([<span class=\"st\">\"draft\"</span>, <span class=\"st\">\"published\"</span>, <span class=\"st\">\"archived\"</span>])\n    )\n    tags   <span class=\"op\">=</span> fields.<span class=\"fn\">List</span>(fields.<span class=\"fn\">Str</span>(), load_default<span class=\"op\">=</span><span class=\"fn\">list</span>)\n    \n    <span class=\"cm\"># Custom field validator — same as @field_validator in Pydantic</span>\n    <span class=\"dc\">@validates</span>(<span class=\"st\">\"title\"</span>)\n    <span class=\"kw\">def</span> <span class=\"fn\">validate_title_not_reserved</span>(self, value):\n        <span class=\"kw\">if</span> value.<span class=\"fn\">lower</span>().<span class=\"fn\">startswith</span>(<span class=\"st\">\"test \"</span>):\n            <span class=\"kw\">raise</span> <span class=\"fn\">ValidationError</span>(<span class=\"st\">\"Production posts cannot start with 'test'\"</span>)\n    \n    <span class=\"cm\"># @post_load — runs after all field validation, transforms the data</span>\n    <span class=\"cm\"># Returns a dict (or object if you use the @post_load target pattern)</span>\n    <span class=\"dc\">@post_load</span>\n    <span class=\"kw\">def</span> <span class=\"fn\">normalise_data</span>(self, data, <span class=\"op\">**</span>kwargs):\n        data[<span class=\"st\">\"title\"</span>] <span class=\"op\">=</span> data[<span class=\"st\">\"title\"</span>].<span class=\"fn\">strip</span>()\n        data[<span class=\"st\">\"body\"</span>]  <span class=\"op\">=</span> data[<span class=\"st\">\"body\"</span>].<span class=\"fn\">strip</span>()\n        <span class=\"kw\">return</span> data\n\n<span class=\"cm\"># Create schema instances — reuse these throughout your app</span>\npost_schema        <span class=\"op\">=</span> <span class=\"fn\">PostSchema</span>()           <span class=\"cm\"># single item</span>\nposts_schema       <span class=\"op\">=</span> <span class=\"fn\">PostSchema</span>(many<span class=\"op\">=</span><span class=\"kw\">True</span>)  <span class=\"cm\"># list of items</span>\npost_update_schema <span class=\"op\">=</span> <span class=\"fn\">PostSchema</span>(<span class=\"fn\">partial</span><span class=\"op\">=</span><span class=\"kw\">True</span>)  <span class=\"cm\"># all fields optional (for PATCH)</span></code></pre><div class=\"cl\">python — using schemas in route handlers</div><pre><code><span class=\"kw\">from</span> flask <span class=\"kw\">import</span> request, jsonify\n<span class=\"kw\">from</span> marshmallow <span class=\"kw\">import</span> <span class=\"fn\">ValidationError</span>\n\n<span class=\"dc\">@posts_bp.route</span>(<span class=\"st\">\"/\"</span>, methods<span class=\"op\">=</span>[<span class=\"st\">\"POST\"</span>])\n<span class=\"dc\">@jwt_required</span>()\n<span class=\"kw\">def</span> <span class=\"fn\">create_post</span>():\n    <span class=\"cm\"># Step 1: Parse the request body</span>\n    <span class=\"cm\"># load() validates AND deserialises (returns Python dict)</span>\n    <span class=\"cm\"># It raises ValidationError if anything fails</span>\n    <span class=\"kw\">try</span>:\n        data <span class=\"op\">=</span> post_schema.<span class=\"fn\">load</span>(request.<span class=\"fn\">get_json</span>() <span class=\"kw\">or</span> {})\n    <span class=\"kw\">except</span> <span class=\"fn\">ValidationError</span> <span class=\"kw\">as</span> err:\n        <span class=\"cm\"># err.messages is a dict: {field_name: [list of error strings]}</span>\n        <span class=\"cm\"># e.g. {\"title\": [\"Title must be 5-200 characters\"], \"body\": [\"Field may not be null\"]}</span>\n        <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>({<span class=\"st\">\"errors\"</span>: err.messages}), <span class=\"nb\">422</span>\n    \n    <span class=\"cm\"># Step 2: data is now validated and cleaned — safe to use</span>\n    post <span class=\"op\">=</span> <span class=\"fn\">Post</span>(\n        title<span class=\"op\">=</span>data[<span class=\"st\">\"title\"</span>],\n        body<span class=\"op\">=</span>data[<span class=\"st\">\"body\"</span>],\n        status<span class=\"op\">=</span>data[<span class=\"st\">\"status\"</span>],\n        author_id<span class=\"op\">=</span><span class=\"fn\">get_jwt_identity</span>()\n    )\n    db.session.<span class=\"fn\">add</span>(post)\n    db.session.<span class=\"fn\">commit</span>()\n    \n    <span class=\"cm\"># Step 3: Serialise the response</span>\n    <span class=\"cm\"># dump() converts the SQLAlchemy model to a JSON-safe dict</span>\n    <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>(post_schema.<span class=\"fn\">dump</span>(post)), <span class=\"nb\">201</span>\n\n<span class=\"dc\">@posts_bp.route</span>(<span class=\"st\">\"/\"</span>, methods<span class=\"op\">=</span>[<span class=\"st\">\"PUT\"</span>])\n<span class=\"dc\">@jwt_required</span>()\n<span class=\"kw\">def</span> <span class=\"fn\">update_post</span>(post_id: <span class=\"fn\">int</span>):\n    post <span class=\"op\">=</span> db.session.<span class=\"fn\">get</span>(<span class=\"nm\">Post</span>, post_id) <span class=\"kw\">or</span> <span class=\"fn\">abort</span>(<span class=\"nb\">404</span>)\n    \n    <span class=\"cm\"># partial=True allows updating only a subset of fields</span>\n    <span class=\"kw\">try</span>:\n        data <span class=\"op\">=</span> post_update_schema.<span class=\"fn\">load</span>(request.<span class=\"fn\">get_json</span>() <span class=\"kw\">or</span> {})\n    <span class=\"kw\">except</span> <span class=\"fn\">ValidationError</span> <span class=\"kw\">as</span> err:\n        <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>({<span class=\"st\">\"errors\"</span>: err.messages}), <span class=\"nb\">422</span>\n    \n    <span class=\"cm\"># Only update fields that were actually sent</span>\n    <span class=\"kw\">for</span> <span class=\"fn\">field</span>, value <span class=\"kw\">in</span> data.<span class=\"fn\">items</span>():\n        <span class=\"fn\">setattr</span>(post, <span class=\"fn\">field</span>, value)\n    db.session.<span class=\"fn\">commit</span>()\n    <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>(post_schema.<span class=\"fn\">dump</span>(post))\n\n<span class=\"dc\">@posts_bp.route</span>(<span class=\"st\">\"/\"</span>, methods<span class=\"op\">=</span>[<span class=\"st\">\"GET\"</span>])\n<span class=\"kw\">def</span> <span class=\"fn\">list_posts</span>():\n    posts <span class=\"op\">=</span> <span class=\"nm\">Post</span>.query.<span class=\"fn\">filter_by</span>(status<span class=\"op\">=</span><span class=\"st\">\"published\"</span>).<span class=\"fn\">all</span>()\n    <span class=\"cm\"># many=True serialises a list of objects</span>\n    <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>(posts_schema.<span class=\"fn\">dump</span>(posts))</code></pre><h2>Redis Caching — Speed Up Your API</h2><p>Caching stores the result of expensive operations (database queries, external API calls, complex computations) so future requests get the cached result instead of repeating the work. Redis is the standard choice — it's in-memory (microsecond latency), supports expiry, and scales across multiple app servers.</p><p>The cache-aside pattern: check cache first, if missing compute it and store it, return the result. Simple in concept, but the implementation details matter: choosing good cache keys, setting appropriate TTLs, and invalidating stale data.</p><div class=\"cl\">python — Flask-Caching with Redis</div><pre><code><span class=\"kw\">from</span> flask_caching <span class=\"kw\">import</span> <span class=\"nm\">Cache</span>\n\n<span class=\"cm\"># Configuration — Redis backend</span>\napp.config[<span class=\"st\">\"CACHE_TYPE\"</span>]       <span class=\"op\">=</span> <span class=\"st\">\"RedisCache\"</span>\napp.config[<span class=\"st\">\"CACHE_REDIS_URL\"</span>]  <span class=\"op\">=</span> <span class=\"st\">\"redis://localhost:6379/0\"</span>\napp.config[<span class=\"st\">\"CACHE_KEY_PREFIX\"</span>] <span class=\"op\">=</span> <span class=\"st\">\"pyblog:\"</span>\napp.config[<span class=\"st\">\"CACHE_DEFAULT_TIMEOUT\"</span>] <span class=\"op\">=</span> <span class=\"nb\">300</span>   <span class=\"cm\"># 5 minutes default TTL</span>\n\n<span class=\"fn\">cache</span> <span class=\"op\">=</span> <span class=\"fn\">Cache</span>(app)\n\n<span class=\"cm\"># Method 1: @cache.cached decorator — cache the entire route response</span>\n<span class=\"cm\"># cache_key is computed from the URL including query parameters</span>\n<span class=\"dc\">@posts_bp.route</span>(<span class=\"st\">\"/\"</span>)\n<span class=\"dc\">@cache.cached</span>(\n    timeout<span class=\"op\">=</span><span class=\"nb\">600</span>,     <span class=\"cm\"># 10 minutes — this content doesn't change often</span>\n    key_prefix<span class=\"op\">=</span><span class=\"kw\">lambda</span>: f<span class=\"st\">\"post:{request.view_args['post_id']}\"</span>\n)\n<span class=\"kw\">def</span> <span class=\"fn\">get_post</span>(post_id: <span class=\"fn\">int</span>):\n    <span class=\"cm\"># This function body runs only on CACHE MISS</span>\n    <span class=\"cm\"># On subsequent requests, Flask-Caching returns the cached response</span>\n    post <span class=\"op\">=</span> db.session.<span class=\"fn\">get</span>(<span class=\"nm\">Post</span>, post_id) <span class=\"kw\">or</span> <span class=\"fn\">abort</span>(<span class=\"nb\">404</span>)\n    <span class=\"nm\">Post</span>.query.<span class=\"fn\">filter_by</span>(<span class=\"fn\">id</span><span class=\"op\">=</span>post_id).<span class=\"fn\">update</span>({<span class=\"st\">\"views\"</span>: <span class=\"nm\">Post</span>.views <span class=\"op\">+</span> <span class=\"nb\">1</span>})\n    db.session.<span class=\"fn\">commit</span>()\n    <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>(post_schema.<span class=\"fn\">dump</span>(post))\n\n<span class=\"cm\"># Method 2: Low-level cache API — more control</span>\n<span class=\"dc\">@posts_bp.route</span>(<span class=\"st\">\"/trending\"</span>)\n<span class=\"kw\">def</span> <span class=\"fn\">trending_posts</span>():\n    cache_key <span class=\"op\">=</span> <span class=\"st\">\"trending:v2:top10\"</span>\n    \n    <span class=\"cm\"># Try to get from cache first</span>\n    cached <span class=\"op\">=</span> <span class=\"fn\">cache</span>.<span class=\"fn\">get</span>(cache_key)\n    <span class=\"kw\">if</span> cached <span class=\"kw\">is</span> <span class=\"kw\">not</span> <span class=\"kw\">None</span>:\n        <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>(cached)   <span class=\"cm\"># cache hit — no DB query!</span>\n    \n    <span class=\"cm\"># Cache miss — compute the expensive result</span>\n    posts <span class=\"op\">=</span> <span class=\"nm\">Post</span>.query.<span class=\"fn\">filter_by</span>(status<span class=\"op\">=</span><span class=\"st\">\"published\"</span>)\\\n                      .<span class=\"fn\">order_by</span>(<span class=\"nm\">Post</span>.views.<span class=\"fn\">desc</span>())\\\n                      .<span class=\"fn\">limit</span>(<span class=\"nb\">10</span>).<span class=\"fn\">all</span>()\n    result <span class=\"op\">=</span> posts_schema.<span class=\"fn\">dump</span>(posts)\n    \n    <span class=\"cm\"># Store in cache for 5 minutes</span>\n    <span class=\"fn\">cache</span>.<span class=\"fn\">set</span>(cache_key, result, timeout<span class=\"op\">=</span><span class=\"nb\">300</span>)\n    \n    <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>(result)\n\n<span class=\"cm\"># Cache invalidation — clear related cache when data changes</span>\n<span class=\"dc\">@posts_bp.route</span>(<span class=\"st\">\"/\"</span>, methods<span class=\"op\">=</span>[<span class=\"st\">\"POST\"</span>])\n<span class=\"dc\">@jwt_required</span>()\n<span class=\"kw\">def</span> <span class=\"fn\">create_post</span>():\n    <span class=\"cm\"># ... create post ...</span>\n    db.session.<span class=\"fn\">commit</span>()\n    \n    <span class=\"cm\"># New post created — trending cache is now stale</span>\n    <span class=\"fn\">cache</span>.<span class=\"fn\">delete</span>(<span class=\"st\">\"trending:v2:top10\"</span>)   <span class=\"cm\"># force next request to recompute</span>\n    <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>(post_schema.<span class=\"fn\">dump</span>(new_post)), <span class=\"nb\">201</span></code></pre><h2>Flask-Limiter — Rate Limiting</h2><p>Rate limiting protects your API from abuse — both accidental (buggy clients) and intentional (DoS attacks, credential stuffing). Flask-Limiter applies per-client request quotas, optionally backed by Redis for sharing limits across multiple app instances.</p><div class=\"cl\">python — Flask-Limiter setup and usage</div><pre><code><span class=\"kw\">from</span> flask_limiter <span class=\"kw\">import</span> <span class=\"nm\">Limiter</span>\n<span class=\"kw\">from</span> flask_limiter.util <span class=\"kw\">import</span> get_remote_address\n<span class=\"kw\">from</span> flask <span class=\"kw\">import</span> jsonify\n\n<span class=\"cm\"># Initialise — Redis storage shares limits across all app instances</span>\nlimiter <span class=\"op\">=</span> <span class=\"fn\">Limiter</span>(\n    key_func<span class=\"op\">=</span>get_remote_address,   <span class=\"cm\"># identify clients by IP address</span>\n    app<span class=\"op\">=</span>app,\n    default_limits<span class=\"op\">=</span>[<span class=\"st\">\"1000/day\"</span>, <span class=\"st\">\"100/hour\"</span>],   <span class=\"cm\"># applied to ALL routes</span>\n    storage_uri<span class=\"op\">=</span><span class=\"st\">\"redis://localhost:6379/1\"</span>,     <span class=\"cm\"># namespace 1 for rate data</span>\n    headers_enabled<span class=\"op\">=</span><span class=\"kw\">True</span>,   <span class=\"cm\"># include X-RateLimit-* headers in responses</span>\n)\n\n<span class=\"cm\"># Per-route overrides — stricter limits on sensitive endpoints</span>\n<span class=\"dc\">@auth_bp.route</span>(<span class=\"st\">\"/login\"</span>, methods<span class=\"op\">=</span>[<span class=\"st\">\"POST\"</span>])\n<span class=\"dc\">@limiter.limit</span>(<span class=\"st\">\"10/minute\"</span>)   <span class=\"cm\"># max 10 login attempts per minute per IP</span>\n<span class=\"kw\">def</span> <span class=\"fn\">login</span>():\n    data <span class=\"op\">=</span> request.<span class=\"fn\">get_json</span>()\n    user <span class=\"op\">=</span> <span class=\"nm\">User</span>.query.<span class=\"fn\">filter_by</span>(email<span class=\"op\">=</span>data.<span class=\"fn\">get</span>(<span class=\"st\">\"email\"</span>)).<span class=\"fn\">first</span>()\n    <span class=\"kw\">if</span> <span class=\"kw\">not</span> user <span class=\"kw\">or</span> <span class=\"kw\">not</span> user.<span class=\"fn\">check_password</span>(data.<span class=\"fn\">get</span>(<span class=\"st\">\"password\"</span>, <span class=\"st\">\"\"</span>)):\n        <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>({<span class=\"st\">\"error\"</span>: <span class=\"st\">\"Invalid credentials\"</span>}), <span class=\"nb\">401</span>\n    <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>({<span class=\"st\">\"access_token\"</span>: <span class=\"fn\">create_access_token</span>(user.<span class=\"fn\">id</span>)})\n\n<span class=\"dc\">@auth_bp.route</span>(<span class=\"st\">\"/register\"</span>, methods<span class=\"op\">=</span>[<span class=\"st\">\"POST\"</span>])\n<span class=\"dc\">@limiter.limit</span>(<span class=\"st\">\"3/hour\"</span>)   <span class=\"cm\"># 3 registrations per hour per IP (anti-bot)</span>\n<span class=\"kw\">def</span> <span class=\"fn\">register</span>():\n    <span class=\"kw\">pass</span>\n\n<span class=\"dc\">@api_bp.route</span>(<span class=\"st\">\"/search\"</span>)\n<span class=\"dc\">@limiter.limit</span>(<span class=\"st\">\"30/minute\"</span>)   <span class=\"cm\"># search is expensive — limit it</span>\n<span class=\"kw\">def</span> <span class=\"fn\">search</span>():\n    <span class=\"kw\">pass</span>\n\n<span class=\"cm\"># Exempt certain routes from rate limiting</span>\n<span class=\"dc\">@app.route</span>(<span class=\"st\">\"/health\"</span>)\n<span class=\"dc\">@limiter.exempt</span>   <span class=\"cm\"># health checks bypass all limits</span>\n<span class=\"kw\">def</span> <span class=\"fn\">health</span>():\n    <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>({<span class=\"st\">\"status\"</span>: <span class=\"st\">\"ok\"</span>})\n\n<span class=\"cm\"># Custom error response when limit is exceeded</span>\n<span class=\"dc\">@app.errorhandler</span>(<span class=\"nb\">429</span>)   <span class=\"cm\"># 429 Too Many Requests</span>\n<span class=\"kw\">def</span> <span class=\"fn\">rate_limit_exceeded</span>(e):\n    <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>({\n        <span class=\"st\">\"error\"</span>: <span class=\"st\">\"Rate limit exceeded\"</span>,\n        <span class=\"st\">\"message\"</span>: <span class=\"fn\">str</span>(e.description),\n        <span class=\"st\">\"retry_after\"</span>: e.retry_after <span class=\"kw\">if</span> <span class=\"fn\">hasattr</span>(e, <span class=\"st\">\"retry_after\"</span>) <span class=\"kw\">else</span> <span class=\"kw\">None</span>\n    }), <span class=\"nb\">429</span>\n\n<span class=\"cm\"># Per-user limits (authenticated routes) — more generous than IP limits</span>\n<span class=\"kw\">def</span> <span class=\"fn\">get_user_id</span>():\n    <span class=\"st\">\"\"\"Use user ID instead of IP for authenticated requests.\"\"\"</span>\n    <span class=\"kw\">from</span> flask_jwt_extended <span class=\"kw\">import</span> get_jwt_identity, verify_jwt_in_request\n    <span class=\"kw\">try</span>:\n        <span class=\"fn\">verify_jwt_in_request</span>(optional<span class=\"op\">=</span><span class=\"kw\">True</span>)\n        user_id <span class=\"op\">=</span> <span class=\"fn\">get_jwt_identity</span>()\n        <span class=\"kw\">return</span> f<span class=\"st\">\"user:{user_id}\"</span> <span class=\"kw\">if</span> user_id <span class=\"kw\">else</span> <span class=\"fn\">get_remote_address</span>()\n    <span class=\"kw\">except</span> <span class=\"nm\">Exception</span>:\n        <span class=\"kw\">return</span> <span class=\"fn\">get_remote_address</span>()\n\npremium_limiter <span class=\"op\">=</span> <span class=\"fn\">Limiter</span>(\n    key_func<span class=\"op\">=</span>get_user_id,\n    app<span class=\"op\">=</span>app,\n    default_limits<span class=\"op\">=</span>[<span class=\"st\">\"10000/day\"</span>],   <span class=\"cm\"># premium users get more</span>\n)</code></pre>"},{"id":"fl-05","track":"flask","tl":"Flask","title":"Celery, Email &amp; File Uploads","sub":"Background tasks with Celery and Redis, Flask-Mail, and secure file upload handling.","content":"<h2>Celery — Asynchronous Task Queue</h2><p>Celery handles work that's too slow to do synchronously in a web request. Examples: sending emails (200ms+), generating PDFs, processing uploaded images, sending webhooks, and scheduled jobs. Instead of making the user wait, you enqueue the task and return a response immediately. A separate worker process handles the task in the background.</p><p>The architecture has three components: your Flask app (the <em>producer</em>) enqueues tasks, Redis/RabbitMQ (the <em>broker</em>) stores the task queue, and Celery workers (the <em>consumers</em>) pick up and execute tasks. Workers can run on the same machine or a different server.</p><div class=\"cl\">python — Celery setup with Flask</div><pre><code><span class=\"kw\">from</span> celery <span class=\"kw\">import</span> <span class=\"nm\">Celery</span>\n<span class=\"kw\">from</span> flask <span class=\"kw\">import</span> <span class=\"nm\">Flask</span>\n\n<span class=\"kw\">def</span> <span class=\"fn\">make_celery</span>(app: <span class=\"nm\">Flask</span>) <span class=\"op\">-&gt;</span> <span class=\"nm\">Celery</span>:\n    <span class=\"st\">\"\"\"Create a Celery instance bound to the Flask app context.\n    The app context is important so tasks can use Flask extensions\n    like SQLAlchemy (db.session) without \"outside of application context\" errors.\n    \"\"\"</span>\n    celery <span class=\"op\">=</span> <span class=\"fn\">Celery</span>(\n        app.import_name,\n        broker<span class=\"op\">=</span>app.config[<span class=\"st\">\"CELERY_BROKER_URL\"</span>],      <span class=\"cm\"># Redis where tasks are queued</span>\n        backend<span class=\"op\">=</span>app.config[<span class=\"st\">\"CELERY_RESULT_BACKEND\"</span>],  <span class=\"cm\"># Redis where results are stored</span>\n    )\n    celery.conf.<span class=\"fn\">update</span>(app.config)   <span class=\"cm\"># sync Celery config with Flask config</span>\n    \n    <span class=\"cm\"># Make Celery tasks run inside the Flask application context</span>\n    <span class=\"kw\">class</span> <span class=\"fn\">ContextTask</span>(celery.<span class=\"nm\">Task</span>):\n        <span class=\"kw\">def</span> <span class=\"fn\">__call__</span>(self, <span class=\"op\">*</span>args, <span class=\"op\">**</span>kwargs):\n            <span class=\"kw\">with</span> app.<span class=\"fn\">app_context</span>():   <span class=\"cm\"># ensures db.session etc. are available</span>\n                <span class=\"kw\">return</span> self.<span class=\"fn\">run</span>(<span class=\"op\">*</span>args, <span class=\"op\">**</span>kwargs)\n    \n    celery.<span class=\"nm\">Task</span> <span class=\"op\">=</span> <span class=\"nm\">ContextTask</span>\n    <span class=\"kw\">return</span> celery\n\n<span class=\"cm\"># In app/__init__.py:</span>\napp <span class=\"op\">=</span> <span class=\"fn\">Flask</span>(__name__)\napp.config[<span class=\"st\">\"CELERY_BROKER_URL\"</span>]     <span class=\"op\">=</span> <span class=\"st\">\"redis://localhost:6379/2\"</span>\napp.config[<span class=\"st\">\"CELERY_RESULT_BACKEND\"</span>] <span class=\"op\">=</span> <span class=\"st\">\"redis://localhost:6379/3\"</span>\ncelery <span class=\"op\">=</span> <span class=\"fn\">make_celery</span>(app)</code></pre><div class=\"cl\">python — defining and calling tasks</div><pre><code><span class=\"kw\">from</span> app <span class=\"kw\">import</span> celery, db\n<span class=\"kw\">from</span> app.models <span class=\"kw\">import</span> <span class=\"nm\">User</span>, <span class=\"nm\">Post</span>\n<span class=\"kw\">from</span> app.email <span class=\"kw\">import</span> send_email\n<span class=\"kw\">import</span> time\n\n<span class=\"cm\"># bind=True gives the task access to self (for retries and metadata)</span>\n<span class=\"cm\"># max_retries=3 will retry up to 3 times on failure</span>\n<span class=\"cm\"># default_retry_delay=60 waits 60 seconds between retries</span>\n<span class=\"dc\">@celery.task</span>(bind<span class=\"op\">=</span><span class=\"kw\">True</span>, max_retries<span class=\"op\">=</span><span class=\"nb\">3</span>, default_retry_delay<span class=\"op\">=</span><span class=\"nb\">60</span>)\n<span class=\"kw\">def</span> <span class=\"fn\">send_welcome_email</span>(self, user_id: <span class=\"fn\">int</span>) <span class=\"op\">-&gt;</span> <span class=\"fn\">dict</span>:\n    <span class=\"st\">\"\"\"Send a welcome email to a newly registered user.\n    \n    This runs in a Celery worker PROCESS, not in the web request.\n    The user sees \"Registration successful\" immediately while this runs.\n    \"\"\"</span>\n    <span class=\"kw\">try</span>:\n        user <span class=\"op\">=</span> db.session.<span class=\"fn\">get</span>(<span class=\"nm\">User</span>, user_id)\n        <span class=\"kw\">if</span> <span class=\"kw\">not</span> user:\n            <span class=\"kw\">raise</span> <span class=\"fn\">ValueError</span>(f<span class=\"st\">\"User {user_id} not found\"</span>)\n        \n        <span class=\"fn\">send_email</span>(\n            to<span class=\"op\">=</span>user.email,\n            subject<span class=\"op\">=</span>f<span class=\"st\">\"Welcome to PyBlog, {user.username}!\"</span>,\n            template<span class=\"op\">=</span><span class=\"st\">\"emails/welcome.html\"</span>,\n            context<span class=\"op\">=</span>{<span class=\"st\">\"user\"</span>: user}\n        )\n        <span class=\"kw\">return</span> {<span class=\"st\">\"status\"</span>: <span class=\"st\">\"sent\"</span>, <span class=\"st\">\"user_id\"</span>: user_id, <span class=\"st\">\"email\"</span>: user.email}\n    \n    <span class=\"kw\">except</span> <span class=\"nm\">Exception</span> <span class=\"kw\">as</span> exc:\n        <span class=\"cm\"># Log the failure and retry with exponential backoff</span>\n        <span class=\"cm\"># countdown doubles on each retry: 60s, 120s, 240s</span>\n        <span class=\"kw\">raise</span> self.<span class=\"fn\">retry</span>(exc<span class=\"op\">=</span>exc, countdown<span class=\"op\">=</span><span class=\"nb\">60</span> <span class=\"op\">*</span> (<span class=\"nb\">2</span> <span class=\"op\">**</span> self.request.retries))\n\n<span class=\"dc\">@celery.task</span>(bind<span class=\"op\">=</span><span class=\"kw\">True</span>)\n<span class=\"kw\">def</span> <span class=\"fn\">generate_post_preview</span>(self, post_id: <span class=\"fn\">int</span>, width<span class=\"op\">=</span><span class=\"nb\">800</span>, height<span class=\"op\">=</span><span class=\"nb\">400</span>) <span class=\"op\">-&gt;</span> <span class=\"fn\">str</span>:\n    <span class=\"st\">\"\"\"Generate a social media preview image for a post.\"\"\"</span>\n    post <span class=\"op\">=</span> db.session.<span class=\"fn\">get</span>(<span class=\"nm\">Post</span>, post_id)\n    <span class=\"cm\"># ... image generation logic ...</span>\n    image_url <span class=\"op\">=</span> <span class=\"fn\">upload_to_s3</span>(generated_image)\n    post.preview_image <span class=\"op\">=</span> image_url\n    db.session.<span class=\"fn\">commit</span>()\n    <span class=\"kw\">return</span> image_url\n\n<span class=\"cm\"># Calling tasks from your Flask routes:</span>\n<span class=\"dc\">@auth_bp.route</span>(<span class=\"st\">\"/register\"</span>, methods<span class=\"op\">=</span>[<span class=\"st\">\"POST\"</span>])\n<span class=\"kw\">def</span> <span class=\"fn\">register</span>():\n    user <span class=\"op\">=</span> <span class=\"fn\">create_user</span>(request.<span class=\"fn\">get_json</span>())\n    db.session.<span class=\"fn\">commit</span>()\n    \n    <span class=\"cm\"># .delay() enqueues the task and returns IMMEDIATELY</span>\n    <span class=\"cm\"># The task runs later in a worker process</span>\n    send_welcome_email.<span class=\"fn\">delay</span>(user.<span class=\"fn\">id</span>)\n    \n    <span class=\"cm\"># .apply_async() gives more control</span>\n    generate_post_preview.<span class=\"fn\">apply_async</span>(\n        args<span class=\"op\">=</span>[user.first_post_id],\n        kwargs<span class=\"op\">=</span>{<span class=\"st\">\"width\"</span>: <span class=\"nb\">1200</span>},\n        countdown<span class=\"op\">=</span><span class=\"nb\">5</span>,    <span class=\"cm\"># start in 5 seconds</span>\n        expires<span class=\"op\">=</span><span class=\"nb\">3600</span>,   <span class=\"cm\"># expire if not started within 1 hour</span>\n    )\n    \n    <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>(user.<span class=\"fn\">to_dict</span>()), <span class=\"nb\">201</span></code></pre><div class=\"cl\">bash — running and monitoring workers</div><pre><code><span class=\"cm\"># Start a worker (run this in a separate terminal or systemd service)</span>\n<span class=\"fn\">celery</span> -A app.celery worker --loglevel=info\n\n<span class=\"cm\"># Start multiple workers with concurrency</span>\n<span class=\"fn\">celery</span> -A app.celery worker --concurrency=4 --loglevel=info\n\n<span class=\"cm\"># Separate queues for different priority tasks</span>\n<span class=\"fn\">celery</span> -A app.celery worker --queues=high_priority,default\n\n<span class=\"cm\"># Flower — beautiful real-time monitoring dashboard at http://localhost:5555</span>\n<span class=\"fn\">pip</span> install flower\n<span class=\"fn\">celery</span> -A app.celery flower\n\n<span class=\"cm\"># Celery Beat — scheduled tasks (like cron)</span>\n<span class=\"cm\"># In your app:</span>\n<span class=\"cm\"># celery.conf.beat_schedule = {</span>\n<span class=\"cm\">#     \"cleanup-expired-tokens\": {</span>\n<span class=\"cm\">#         \"task\": \"app.tasks.cleanup_expired_tokens\",</span>\n<span class=\"cm\">#         \"schedule\": crontab(hour=2, minute=0),  # daily at 2am</span>\n<span class=\"cm\">#     }</span>\n<span class=\"cm\"># }</span>\n<span class=\"fn\">celery</span> -A app.celery beat --loglevel=info</code></pre><h2>Secure File Uploads</h2><p>File uploads are a common attack vector. Users might upload files with malicious names, malicious content disguised as images, or files large enough to fill your disk. Every upload must be validated for extension, MIME type, and size — and stored outside the web root.</p><div class=\"cl\">python — secure file upload handling</div><pre><code><span class=\"kw\">import</span> os, uuid, magic   <span class=\"cm\"># pip install python-magic</span>\n<span class=\"kw\">from</span> werkzeug.utils <span class=\"kw\">import</span> secure_filename\n<span class=\"kw\">from</span> flask <span class=\"kw\">import</span> current_app\n<span class=\"kw\">from</span> pathlib <span class=\"kw\">import</span> <span class=\"fn\">Path</span>\n\n<span class=\"cm\"># Allowed extensions AND their expected MIME types</span>\n<span class=\"cm\"># Checking extension alone is not enough — anyone can rename malware.exe to photo.jpg</span>\n<span class=\"nm\">ALLOWED</span> <span class=\"op\">=</span> {\n    <span class=\"st\">\"jpg\"</span>:  <span class=\"st\">\"image/jpeg\"</span>,\n    <span class=\"st\">\"jpeg\"</span>: <span class=\"st\">\"image/jpeg\"</span>,\n    <span class=\"st\">\"png\"</span>:  <span class=\"st\">\"image/png\"</span>,\n    <span class=\"st\">\"gif\"</span>:  <span class=\"st\">\"image/gif\"</span>,\n    <span class=\"st\">\"webp\"</span>: <span class=\"st\">\"image/webp\"</span>,\n    <span class=\"st\">\"pdf\"</span>:  <span class=\"st\">\"application/pdf\"</span>,\n}\n<span class=\"nm\">MAX_FILE_SIZE</span> <span class=\"op\">=</span> <span class=\"nb\">10</span> <span class=\"op\">*</span> <span class=\"nb\">1024</span> <span class=\"op\">*</span> <span class=\"nb\">1024</span>   <span class=\"cm\"># 10 MB</span>\n\n<span class=\"kw\">def</span> <span class=\"fn\">validate_and_save_file</span>(file) <span class=\"op\">-&gt;</span> <span class=\"fn\">str</span>:\n    <span class=\"st\">\"\"\"Validate an uploaded file and save it securely.\n    Returns the saved filename on success, raises ValueError on failure.\n    \"\"\"</span>\n    <span class=\"kw\">if</span> <span class=\"kw\">not</span> file <span class=\"kw\">or</span> <span class=\"kw\">not</span> file.filename:\n        <span class=\"kw\">raise</span> <span class=\"fn\">ValueError</span>(<span class=\"st\">\"No file provided\"</span>)\n    \n    <span class=\"cm\"># 1. Sanitise filename — remove path separators, null bytes, etc.</span>\n    original_name <span class=\"op\">=</span> <span class=\"fn\">secure_filename</span>(file.filename)\n    ext <span class=\"op\">=</span> original_name.<span class=\"fn\">rsplit</span>(<span class=\"st\">\".\"</span>, <span class=\"nb\">1</span>)[<span class=\"nb\">-1</span>].<span class=\"fn\">lower</span>() <span class=\"kw\">if</span> <span class=\"st\">\".\"</span> <span class=\"kw\">in</span> original_name <span class=\"kw\">else</span> <span class=\"st\">\"\"</span>\n    \n    <span class=\"kw\">if</span> ext <span class=\"kw\">not</span> <span class=\"kw\">in</span> <span class=\"nm\">ALLOWED</span>:\n        <span class=\"kw\">raise</span> <span class=\"fn\">ValueError</span>(f<span class=\"st\">\"File type .{ext} is not allowed. Allowed: {list(ALLOWED)}\"</span>)\n    \n    <span class=\"cm\"># 2. Check file size BEFORE reading it fully</span>\n    file.<span class=\"fn\">seek</span>(<span class=\"nb\">0</span>, <span class=\"nb\">2</span>)           <span class=\"cm\"># seek to end</span>\n    size <span class=\"op\">=</span> file.<span class=\"fn\">tell</span>()        <span class=\"cm\"># get position = file size</span>\n    file.<span class=\"fn\">seek</span>(<span class=\"nb\">0</span>)              <span class=\"cm\"># seek back to start</span>\n    <span class=\"kw\">if</span> size <span class=\"op\">&gt;</span> <span class=\"nm\">MAX_FILE_SIZE</span>:\n        <span class=\"kw\">raise</span> <span class=\"fn\">ValueError</span>(f<span class=\"st\">\"File too large: {size/1024/1024:.1f}MB. Max: {MAX_FILE_SIZE/1024/1024}MB\"</span>)\n    \n    <span class=\"cm\"># 3. Read file content and check REAL MIME type via magic bytes</span>\n    header <span class=\"op\">=</span> file.<span class=\"fn\">read</span>(<span class=\"nb\">2048</span>)   <span class=\"cm\"># read first 2KB for MIME detection</span>\n    file.<span class=\"fn\">seek</span>(<span class=\"nb\">0</span>)               <span class=\"cm\"># seek back</span>\n    real_mime <span class=\"op\">=</span> magic.<span class=\"fn\">from_buffer</span>(header, mime<span class=\"op\">=</span><span class=\"kw\">True</span>)\n    \n    <span class=\"kw\">if</span> real_mime <span class=\"op\">!=</span> <span class=\"nm\">ALLOWED</span>[ext]:\n        <span class=\"kw\">raise</span> <span class=\"fn\">ValueError</span>(\n            f<span class=\"st\">\"File claims to be .{ext} ({ALLOWED[ext]}) \"</span>\n            f<span class=\"st\">\"but is actually {real_mime}\"</span>\n        )\n    \n    <span class=\"cm\"># 4. Generate a UUID filename — prevents path traversal and collisions</span>\n    safe_filename <span class=\"op\">=</span> f<span class=\"st\">\"{uuid.uuid4().hex}.{ext}\"</span>\n    \n    <span class=\"cm\"># 5. Save to upload folder (which should NOT be web-accessible)</span>\n    upload_dir <span class=\"op\">=</span> <span class=\"fn\">Path</span>(current_app.config[<span class=\"st\">\"UPLOAD_FOLDER\"</span>]) <span class=\"op\">/</span> ext\n    upload_dir.<span class=\"fn\">mkdir</span>(parents<span class=\"op\">=</span><span class=\"kw\">True</span>, exist_ok<span class=\"op\">=</span><span class=\"kw\">True</span>)\n    filepath <span class=\"op\">=</span> upload_dir <span class=\"op\">/</span> safe_filename\n    file.<span class=\"fn\">save</span>(<span class=\"fn\">str</span>(filepath))\n    \n    <span class=\"kw\">return</span> safe_filename\n\n<span class=\"dc\">@app.route</span>(<span class=\"st\">\"/upload\"</span>, methods<span class=\"op\">=</span>[<span class=\"st\">\"POST\"</span>])\n<span class=\"dc\">@jwt_required</span>()\n<span class=\"kw\">def</span> <span class=\"fn\">upload_file</span>():\n    file <span class=\"op\">=</span> request.files.<span class=\"fn\">get</span>(<span class=\"st\">\"file\"</span>)\n    <span class=\"kw\">try</span>:\n        filename <span class=\"op\">=</span> <span class=\"fn\">validate_and_save_file</span>(file)\n        <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>({<span class=\"st\">\"filename\"</span>: filename, <span class=\"st\">\"url\"</span>: f<span class=\"st\">\"/media/{filename}\"</span>}), <span class=\"nb\">201</span>\n    <span class=\"kw\">except</span> <span class=\"nm\">ValueError</span> <span class=\"kw\">as</span> e:\n        <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>({<span class=\"st\">\"error\"</span>: <span class=\"fn\">str</span>(e)}), <span class=\"nb\">400</span></code></pre><h2>Flask-Mail — Transactional Email</h2><div class=\"cl\">python — Flask-Mail setup and sending</div><pre><code><span class=\"kw\">from</span> flask_mail <span class=\"kw\">import</span> <span class=\"nm\">Mail</span>, <span class=\"nm\">Message</span>\n\napp.config.<span class=\"fn\">update</span>(\n    <span class=\"nm\">MAIL_SERVER</span>   <span class=\"op\">=</span> <span class=\"st\">\"smtp.sendgrid.net\"</span>,\n    <span class=\"nm\">MAIL_PORT</span>     <span class=\"op\">=</span> <span class=\"nb\">587</span>,\n    <span class=\"nm\">MAIL_USE_TLS</span>  <span class=\"op\">=</span> <span class=\"kw\">True</span>,\n    <span class=\"nm\">MAIL_USERNAME</span> <span class=\"op\">=</span> <span class=\"st\">\"apikey\"</span>,\n    <span class=\"nm\">MAIL_PASSWORD</span> <span class=\"op\">=</span> os.<span class=\"fn\">getenv</span>(<span class=\"st\">\"SENDGRID_API_KEY\"</span>),\n    <span class=\"nm\">MAIL_DEFAULT_SENDER</span> <span class=\"op\">=</span> (<span class=\"st\">\"PyBlog\"</span>, <span class=\"st\">\"noreply@pyblog.com\"</span>),\n)\nmail <span class=\"op\">=</span> <span class=\"fn\">Mail</span>(app)\n\n<span class=\"kw\">def</span> <span class=\"fn\">send_password_reset</span>(user, token: <span class=\"fn\">str</span>):\n    <span class=\"st\">\"\"\"Send a password reset email with a time-limited token.\"\"\"</span>\n    reset_url <span class=\"op\">=</span> f<span class=\"st\">\"https://pyblog.com/reset-password?token={token}\"</span>\n    \n    msg <span class=\"op\">=</span> <span class=\"fn\">Message</span>(\n        subject<span class=\"op\">=</span><span class=\"st\">\"Reset your PyBlog password\"</span>,\n        recipients<span class=\"op\">=</span>[user.email],\n    )\n    <span class=\"cm\"># Plain text fallback (important for email clients that block HTML)</span>\n    msg.body <span class=\"op\">=</span> f<span class=\"st\">\"\"\"Hi {user.username},\n\nClick this link to reset your password (valid for 1 hour):\n{reset_url}\n\nIf you didn't request this, ignore this email.\n\"\"\"</span>\n    <span class=\"cm\"># HTML version</span>\n    msg.html <span class=\"op\">=</span> <span class=\"fn\">render_template</span>(<span class=\"st\">\"emails/password_reset.html\"</span>,\n                                user<span class=\"op\">=</span>user, reset_url<span class=\"op\">=</span>reset_url)\n    mail.<span class=\"fn\">send</span>(msg)</code></pre>"},{"id":"fl-06","track":"flask","tl":"Flask","title":"Testing, Deployment &amp; Ecosystem","sub":"pytest test client, Gunicorn, Nginx, Docker, and the Flask package ecosystem.","content":"<h2>Testing Flask Applications</h2><p>A Flask application can be tested without running a real HTTP server. Flask provides a <em>test client</em> that simulates HTTP requests directly against your app. Combined with pytest fixtures that set up a fresh in-memory database for each test, you get fast, isolated tests that catch bugs before deployment.</p><h3>Setting Up the Test Suite</h3><div class=\"cl\">python — tests/conftest.py</div><pre><code><span class=\"kw\">import</span> pytest\n<span class=\"kw\">from</span> app <span class=\"kw\">import</span> create_app, db <span class=\"kw\">as</span> _db\n<span class=\"kw\">from</span> app.models <span class=\"kw\">import</span> <span class=\"nm\">User</span>, <span class=\"nm\">Post</span>\n\n<span class=\"dc\">@pytest.fixture</span>(scope<span class=\"op\">=</span><span class=\"st\">\"session\"</span>)\n<span class=\"kw\">def</span> <span class=\"fn\">app</span>():\n    <span class=\"st\">\"\"\"Create a Flask app configured for testing.\n    \n    scope=\"session\" means this fixture runs ONCE for the entire test session.\n    The app is created once, the DB is created once, all tests share it.\n    \"\"\"</span>\n    app <span class=\"op\">=</span> <span class=\"fn\">create_app</span>(<span class=\"st\">\"testing\"</span>)   <span class=\"cm\"># uses TestingConfig: in-memory SQLite</span>\n    \n    <span class=\"kw\">with</span> app.<span class=\"fn\">app_context</span>():\n        _db.<span class=\"fn\">create_all</span>()   <span class=\"cm\"># create all tables</span>\n        <span class=\"kw\">yield</span> app\n        _db.<span class=\"fn\">drop_all</span>()     <span class=\"cm\"># clean up after all tests run</span>\n\n<span class=\"dc\">@pytest.fixture</span>\n<span class=\"kw\">def</span> <span class=\"fn\">db</span>(app):\n    <span class=\"st\">\"\"\"Provide a clean DB state for each test.\n    \n    Uses transaction rollback: each test runs inside a transaction\n    that gets rolled back, leaving the DB clean for the next test.\n    Far faster than dropping and recreating tables.\n    \"\"\"</span>\n    <span class=\"kw\">with</span> app.<span class=\"fn\">app_context</span>():\n        connection <span class=\"op\">=</span> _db.engine.<span class=\"fn\">connect</span>()\n        transaction <span class=\"op\">=</span> connection.<span class=\"fn\">begin</span>()\n        <span class=\"cm\"># Override the db session to use our transaction</span>\n        _db.session.bind <span class=\"op\">=</span> connection\n        <span class=\"kw\">yield</span> _db\n        _db.session.<span class=\"fn\">remove</span>()\n        transaction.<span class=\"fn\">rollback</span>()   <span class=\"cm\"># undo ALL changes from this test</span>\n        connection.<span class=\"fn\">close</span>()\n\n<span class=\"dc\">@pytest.fixture</span>\n<span class=\"kw\">def</span> <span class=\"fn\">client</span>(app):\n    <span class=\"st\">\"\"\"HTTP test client — use this to make fake HTTP requests.\"\"\"</span>\n    <span class=\"kw\">return</span> app.<span class=\"fn\">test_client</span>()\n\n<span class=\"dc\">@pytest.fixture</span>\n<span class=\"kw\">def</span> <span class=\"fn\">auth_client</span>(client, db):\n    <span class=\"st\">\"\"\"A client pre-authenticated as a test user.\n    Returns (client, access_token) tuple.\n    \"\"\"</span>\n    <span class=\"cm\"># Create test user</span>\n    user <span class=\"op\">=</span> <span class=\"fn\">User</span>(username<span class=\"op\">=</span><span class=\"st\">\"testuser\"</span>, email<span class=\"op\">=</span><span class=\"st\">\"test@example.com\"</span>)\n    user.password <span class=\"op\">=</span> <span class=\"st\">\"TestPass123\"</span>\n    db.session.<span class=\"fn\">add</span>(user)\n    db.session.<span class=\"fn\">commit</span>()\n    \n    <span class=\"cm\"># Login and get token</span>\n    r <span class=\"op\">=</span> client.<span class=\"fn\">post</span>(<span class=\"st\">\"/api/auth/login\"</span>, json<span class=\"op\">=</span>{\n        <span class=\"st\">\"email\"</span>: <span class=\"st\">\"test@example.com\"</span>,\n        <span class=\"st\">\"password\"</span>: <span class=\"st\">\"TestPass123\"</span>\n    })\n    token <span class=\"op\">=</span> r.<span class=\"fn\">get_json</span>()[<span class=\"st\">\"access_token\"</span>]\n    \n    <span class=\"cm\"># Return a wrapper that auto-adds the auth header</span>\n    <span class=\"kw\">class</span> <span class=\"nm\">AuthClient</span>:\n        <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(self, c, t):\n            self._client <span class=\"op\">=</span> c\n            self._headers <span class=\"op\">=</span> {<span class=\"st\">\"Authorization\"</span>: f<span class=\"st\">\"Bearer {t}\"</span>}\n        <span class=\"kw\">def</span> <span class=\"fn\">get</span>(self, <span class=\"op\">*</span>a, <span class=\"op\">**</span>kw):\n            kw.<span class=\"fn\">setdefault</span>(<span class=\"st\">\"headers\"</span>, {}).<span class=\"fn\">update</span>(self._headers)\n            <span class=\"kw\">return</span> self._client.<span class=\"fn\">get</span>(<span class=\"op\">*</span>a, <span class=\"op\">**</span>kw)\n        <span class=\"kw\">def</span> <span class=\"fn\">post</span>(self, <span class=\"op\">*</span>a, <span class=\"op\">**</span>kw):\n            kw.<span class=\"fn\">setdefault</span>(<span class=\"st\">\"headers\"</span>, {}).<span class=\"fn\">update</span>(self._headers)\n            <span class=\"kw\">return</span> self._client.<span class=\"fn\">post</span>(<span class=\"op\">*</span>a, <span class=\"op\">**</span>kw)\n        <span class=\"kw\">def</span> <span class=\"fn\">put</span>(self, <span class=\"op\">*</span>a, <span class=\"op\">**</span>kw):\n            kw.<span class=\"fn\">setdefault</span>(<span class=\"st\">\"headers\"</span>, {}).<span class=\"fn\">update</span>(self._headers)\n            <span class=\"kw\">return</span> self._client.<span class=\"fn\">put</span>(<span class=\"op\">*</span>a, <span class=\"op\">**</span>kw)\n        <span class=\"kw\">def</span> <span class=\"fn\">delete</span>(self, <span class=\"op\">*</span>a, <span class=\"op\">**</span>kw):\n            kw.<span class=\"fn\">setdefault</span>(<span class=\"st\">\"headers\"</span>, {}).<span class=\"fn\">update</span>(self._headers)\n            <span class=\"kw\">return</span> self._client.<span class=\"fn\">delete</span>(<span class=\"op\">*</span>a, <span class=\"op\">**</span>kw)\n    <span class=\"kw\">return</span> <span class=\"fn\">AuthClient</span>(client, token)</code></pre><div class=\"cl\">python — tests/test_posts.py</div><pre><code><span class=\"kw\">import</span> pytest\n\n<span class=\"kw\">class</span> <span class=\"nm\">TestCreatePost</span>:\n    <span class=\"kw\">def</span> <span class=\"fn\">test_create_post_success</span>(self, auth_client, db):\n        <span class=\"st\">\"\"\"A logged-in user can create a post with valid data.\"\"\"</span>\n        r <span class=\"op\">=</span> auth_client.<span class=\"fn\">post</span>(<span class=\"st\">\"/api/posts/\"</span>, json<span class=\"op\">=</span>{\n            <span class=\"st\">\"title\"</span>: <span class=\"st\">\"My First Blog Post\"</span>,\n            <span class=\"st\">\"body\"</span>: <span class=\"st\">\"This is a well-written blog post with enough content to pass validation.\"</span>,\n        })\n        <span class=\"kw\">assert</span> r.status_code <span class=\"op\">==</span> <span class=\"nb\">201</span>\n        data <span class=\"op\">=</span> r.<span class=\"fn\">get_json</span>()\n        <span class=\"kw\">assert</span> data[<span class=\"st\">\"title\"</span>] <span class=\"op\">==</span> <span class=\"st\">\"My First Blog Post\"</span>\n        <span class=\"kw\">assert</span> data[<span class=\"st\">\"status\"</span>] <span class=\"op\">==</span> <span class=\"st\">\"draft\"</span>   <span class=\"cm\"># default status</span>\n        <span class=\"kw\">assert</span> <span class=\"st\">\"id\"</span> <span class=\"kw\">in</span> data\n        <span class=\"kw\">assert</span> <span class=\"st\">\"created_at\"</span> <span class=\"kw\">in</span> data\n        <span class=\"kw\">assert</span> <span class=\"st\">\"password\"</span> <span class=\"kw\">not</span> <span class=\"kw\">in</span> data      <span class=\"cm\"># security: password never serialised</span>\n    \n    <span class=\"kw\">def</span> <span class=\"fn\">test_create_post_requires_authentication</span>(self, client):\n        <span class=\"st\">\"\"\"Unauthenticated requests are rejected wi
