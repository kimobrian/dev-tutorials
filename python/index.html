th 401.\"\"\"</span>\n        r <span class=\"op\">=</span> client.<span class=\"fn\">post</span>(<span class=\"st\">\"/api/posts/\"</span>, json<span class=\"op\">=</span>{\n            <span class=\"st\">\"title\"</span>: <span class=\"st\">\"Hacked Post\"</span>,\n            <span class=\"st\">\"body\"</span>: <span class=\"st\">\"This should not work\"</span>\n        })\n        <span class=\"kw\">assert</span> r.status_code <span class=\"op\">==</span> <span class=\"nb\">401</span>\n    \n    <span class=\"kw\">def</span> <span class=\"fn\">test_create_post_validates_title_length</span>(self, auth_client):\n        <span class=\"st\">\"\"\"Titles shorter than 5 characters fail validation.\"\"\"</span>\n        r <span class=\"op\">=</span> auth_client.<span class=\"fn\">post</span>(<span class=\"st\">\"/api/posts/\"</span>, json<span class=\"op\">=</span>{\n            <span class=\"st\">\"title\"</span>: <span class=\"st\">\"Hi\"</span>,   <span class=\"cm\"># too short</span>\n            <span class=\"st\">\"body\"</span>: <span class=\"st\">\"Some body content that is long enough\"</span>\n        })\n        <span class=\"kw\">assert</span> r.status_code <span class=\"op\">==</span> <span class=\"nb\">422</span>\n        errors <span class=\"op\">=</span> r.<span class=\"fn\">get_json</span>()[<span class=\"st\">\"errors\"</span>]\n        <span class=\"kw\">assert</span> <span class=\"st\">\"title\"</span> <span class=\"kw\">in</span> errors   <span class=\"cm\"># error reported on title field</span>\n    \n    <span class=\"kw\">def</span> <span class=\"fn\">test_create_post_sanitises_whitespace</span>(self, auth_client, db):\n        <span class=\"st\">\"\"\"Leading/trailing whitespace is stripped from title and body.\"\"\"</span>\n        r <span class=\"op\">=</span> auth_client.<span class=\"fn\">post</span>(<span class=\"st\">\"/api/posts/\"</span>, json<span class=\"op\">=</span>{\n            <span class=\"st\">\"title\"</span>: <span class=\"st\">\"  Padded Title  \"</span>,\n            <span class=\"st\">\"body\"</span>: <span class=\"st\">\"  Some content that is long enough to pass validation  \"</span>\n        })\n        <span class=\"kw\">assert</span> r.status_code <span class=\"op\">==</span> <span class=\"nb\">201</span>\n        data <span class=\"op\">=</span> r.<span class=\"fn\">get_json</span>()\n        <span class=\"kw\">assert</span> data[<span class=\"st\">\"title\"</span>] <span class=\"op\">==</span> <span class=\"st\">\"Padded Title\"</span>   <span class=\"cm\"># stripped</span>\n\n<span class=\"kw\">class</span> <span class=\"nm\">TestGetPost</span>:\n    <span class=\"kw\">def</span> <span class=\"fn\">test_get_published_post</span>(self, client, db):\n        <span class=\"st\">\"\"\"Anyone can read a published post — no auth required.\"\"\"</span>\n        <span class=\"cm\"># Create and publish a post directly in DB</span>\n        post <span class=\"op\">=</span> <span class=\"fn\">Post</span>(title<span class=\"op\">=</span><span class=\"st\">\"Public Post\"</span>, body<span class=\"op\">=</span><span class=\"st\">\"Public content here.\"</span>,\n                    status<span class=\"op\">=</span><span class=\"st\">\"published\"</span>, author_id<span class=\"op\">=</span><span class=\"nb\">1</span>)\n        db.session.<span class=\"fn\">add</span>(post)\n        db.session.<span class=\"fn\">commit</span>()\n        \n        r <span class=\"op\">=</span> client.<span class=\"fn\">get</span>(f<span class=\"st\">\"/api/posts/{post.id}\"</span>)\n        <span class=\"kw\">assert</span> r.status_code <span class=\"op\">==</span> <span class=\"nb\">200</span>\n        <span class=\"kw\">assert</span> r.<span class=\"fn\">get_json</span>()[<span class=\"st\">\"title\"</span>] <span class=\"op\">==</span> <span class=\"st\">\"Public Post\"</span>\n    \n    <span class=\"kw\">def</span> <span class=\"fn\">test_get_nonexistent_post</span>(self, client):\n        <span class=\"st\">\"\"\"404 for posts that don't exist.\"\"\"</span>\n        r <span class=\"op\">=</span> client.<span class=\"fn\">get</span>(<span class=\"st\">\"/api/posts/99999\"</span>)\n        <span class=\"kw\">assert</span> r.status_code <span class=\"op\">==</span> <span class=\"nb\">404</span></code></pre><h2>Docker and Deployment</h2><div class=\"cl\">dockerfile — multi-stage production Dockerfile</div><pre><code><span class=\"cm\"># Stage 1: Build dependencies</span>\n<span class=\"cm\"># Using a slim image to keep the final image small</span>\n<span class=\"kw\">FROM</span> python:3.12-slim AS builder\n<span class=\"kw\">WORKDIR</span> /build\n\n<span class=\"cm\"># Install build dependencies (needed to compile some packages)</span>\n<span class=\"kw\">RUN</span> apt-get update &amp;&amp; apt-get install -y \\\n    build-essential libpq-dev \\\n    &amp;&amp; rm -rf /var/lib/apt/lists/*\n\n<span class=\"kw\">COPY</span> requirements.txt .\n<span class=\"kw\">RUN</span> pip install --no-cache-dir --prefix=/install -r requirements.txt\n\n<span class=\"cm\"># Stage 2: Runtime image</span>\n<span class=\"cm\"># Only copies the installed packages, not the build tools</span>\n<span class=\"kw\">FROM</span> python:3.12-slim AS runtime\n<span class=\"kw\">WORKDIR</span> /app\n\n<span class=\"cm\"># Copy installed packages from builder stage</span>\n<span class=\"kw\">COPY</span> --from=builder /install /usr/local\n\n<span class=\"cm\"># Non-root user for security</span>\n<span class=\"kw\">RUN</span> adduser --disabled-password --gecos <span class=\"st\">\"\"</span> appuser\n\n<span class=\"kw\">COPY</span> . .\n<span class=\"kw\">RUN</span> chown -R appuser:appuser /app\n<span class=\"kw\">USER</span> appuser\n\n<span class=\"kw\">EXPOSE</span> 8000\n\n<span class=\"cm\"># Gunicorn: production WSGI server</span>\n<span class=\"cm\"># --workers: 2*CPUs+1 is the standard formula</span>\n<span class=\"cm\"># --worker-class: sync workers for CPU-bound, gevent for I/O-bound</span>\n<span class=\"kw\">CMD</span> [<span class=\"st\">\"gunicorn\"</span>, <span class=\"st\">\"--workers=4\"</span>, <span class=\"st\">\"--worker-class=sync\"</span>,\n     \"--bind=0.0.0.0:8000\", \"--timeout=60\",\n     \"--access-logfile=-\", \"--error-logfile=-\",\n     \"wsgi:app\"]</code></pre><div class=\"tw\"><table><tr><th>Package</th><th>Category</th><th>Purpose</th></tr><tr><td><code>Flask-JWT-Extended</code></td><td>Auth</td><td>JWT access + refresh tokens</td></tr><tr><td><code>Flask-SQLAlchemy</code></td><td>Database</td><td>SQLAlchemy ORM integration</td></tr><tr><td><code>Flask-Migrate</code></td><td>Database</td><td>Alembic-powered schema migrations</td></tr><tr><td><code>marshmallow</code></td><td>Validation</td><td>Schema-based serialisation + validation</td></tr><tr><td><code>Flask-Caching</code></td><td>Performance</td><td>Redis/memcached response caching</td></tr><tr><td><code>Flask-Limiter</code></td><td>Security</td><td>Rate limiting per IP or user</td></tr><tr><td><code>Celery</code></td><td>Tasks</td><td>Distributed async task queue</td></tr><tr><td><code>Flask-Mail</code></td><td>Email</td><td>SMTP email with template support</td></tr><tr><td><code>Flask-Talisman</code></td><td>Security</td><td>Security headers: CSP, HSTS, etc.</td></tr><tr><td><code>Flask-CORS</code></td><td>API</td><td>Cross-Origin Resource Sharing headers</td></tr><tr><td><code>Sentry-SDK</code></td><td>Monitoring</td><td>Error tracking and performance monitoring</td></tr><tr><td><code>Gunicorn</code></td><td>Deployment</td><td>Production WSGI server</td></tr></table></div>"},{"id":"fl-07","track":"flask","tl":"Flask","title":"Flask REST API: Pagination, Filtering & OpenAPI","sub":"Advanced REST patterns: cursor & offset pagination, multi-field filtering, sorting, Flask-Smorest for OpenAPI 3 docs.","content":"<h2>Pagination — Handling Large Datasets</h2><p>Any endpoint that returns a list of items needs pagination. Without it, a single request for all posts could return 50,000 records, consuming gigabytes of memory and timing out. Pagination splits results into pages, letting clients request one page at a time.</p><p>There are two main pagination strategies. <em>Offset pagination</em> uses <code>page</code> and <code>per_page</code> — simple to implement but becomes slow and unstable with large datasets (items can shift between pages as new items are added). <em>Cursor pagination</em> uses an opaque cursor (often an encoded timestamp or ID) — stable, fast at any scale, used by all major APIs (Twitter, GitHub).</p><h3>Offset Pagination Implementation</h3><div class=\"cl\">python — generic Page dataclass</div><pre><code><span class=\"kw\">from</span> dataclasses <span class=\"kw\">import</span> <span class=\"fn\">dataclass</span>, <span class=\"fn\">field</span>\n<span class=\"kw\">from</span> typing <span class=\"kw\">import</span> <span class=\"nm\">Generic</span>, <span class=\"nm\">TypeVar</span>, <span class=\"nm\">List</span>\n<span class=\"kw\">from</span> flask <span class=\"kw\">import</span> url_for, request\n\n<span class=\"nm\">T</span> <span class=\"op\">=</span> <span class=\"fn\">TypeVar</span>(<span class=\"st\">\"T\"</span>)\n\n<span class=\"dc\">@dataclass</span>\n<span class=\"kw\">class</span> <span class=\"fn\">Page</span>(<span class=\"nm\">Generic</span>[<span class=\"nm\">T</span>]):\n    <span class=\"st\">\"\"\"A page of results with navigation metadata.\n    Generic so it works with any type: Page[Post], Page[User], etc.\n    \"\"\"</span>\n    items:    <span class=\"nm\">List</span>[<span class=\"nm\">T</span>]   <span class=\"cm\"># the actual items for this page</span>\n    total:    <span class=\"fn\">int</span>       <span class=\"cm\"># total number of items across ALL pages</span>\n    page:     <span class=\"fn\">int</span>       <span class=\"cm\"># current page number (1-based)</span>\n    per_page: <span class=\"fn\">int</span>       <span class=\"cm\"># items per page</span>\n    has_next: <span class=\"fn\">bool</span>      <span class=\"cm\"># is there a next page?</span>\n    has_prev: <span class=\"fn\">bool</span>      <span class=\"cm\"># is there a previous page?</span>\n    \n    <span class=\"dc\">@property</span>\n    <span class=\"kw\">def</span> <span class=\"fn\">pages</span>(self) <span class=\"op\">-&gt;</span> <span class=\"fn\">int</span>:\n        <span class=\"st\">\"\"\"Total number of pages.\"\"\"</span>\n        <span class=\"kw\">return</span> <span class=\"op\">-</span>(<span class=\"op\">-</span>self.total <span class=\"op\">//</span> self.per_page)   <span class=\"cm\"># ceiling division</span>\n    \n    <span class=\"dc\">@property</span>\n    <span class=\"kw\">def</span> <span class=\"fn\">next_page</span>(self) <span class=\"op\">-&gt;</span> <span class=\"fn\">int</span> <span class=\"op\">|</span> <span class=\"kw\">None</span>:\n        <span class=\"kw\">return</span> self.page <span class=\"op\">+</span> <span class=\"nb\">1</span> <span class=\"kw\">if</span> self.has_next <span class=\"kw\">else</span> <span class=\"kw\">None</span>\n    \n    <span class=\"dc\">@property</span>\n    <span class=\"kw\">def</span> <span class=\"fn\">prev_page</span>(self) <span class=\"op\">-&gt;</span> <span class=\"fn\">int</span> <span class=\"op\">|</span> <span class=\"kw\">None</span>:\n        <span class=\"kw\">return</span> self.page <span class=\"op\">-</span> <span class=\"nb\">1</span> <span class=\"kw\">if</span> self.has_prev <span class=\"kw\">else</span> <span class=\"kw\">None</span>\n    \n    <span class=\"kw\">def</span> <span class=\"fn\">to_dict</span>(self, serialise_item<span class=\"op\">=</span><span class=\"kw\">None</span>) <span class=\"op\">-&gt;</span> <span class=\"fn\">dict</span>:\n        <span class=\"st\">\"\"\"Convert to JSON-safe dict. serialise_item is called on each item.\"\"\"</span>\n        fn <span class=\"op\">=</span> serialise_item <span class=\"kw\">or</span> (<span class=\"kw\">lambda</span> x: x)\n        <span class=\"kw\">return</span> {\n            <span class=\"st\">\"items\"</span>:    [<span class=\"fn\">fn</span>(item) <span class=\"kw\">for</span> item <span class=\"kw\">in</span> self.items],\n            <span class=\"st\">\"pagination\"</span>: {\n                <span class=\"st\">\"total\"</span>:    self.total,\n                <span class=\"st\">\"page\"</span>:     self.page,\n                <span class=\"st\">\"per_page\"</span>: self.per_page,\n                <span class=\"st\">\"pages\"</span>:    self.pages,\n                <span class=\"st\">\"has_next\"</span>: self.has_next,\n                <span class=\"st\">\"has_prev\"</span>: self.has_prev,\n                <span class=\"st\">\"next_page\"</span>: self.next_page,\n                <span class=\"st\">\"prev_page\"</span>: self.prev_page,\n            }\n        }\n\n<span class=\"kw\">def</span> <span class=\"fn\">paginate_query</span>(query, page: <span class=\"fn\">int</span>, per_page: <span class=\"fn\">int</span>, max_per_page: <span class=\"fn\">int</span> <span class=\"op\">=</span> <span class=\"nb\">100</span>) <span class=\"op\">-&gt;</span> <span class=\"nm\">Page</span>:\n    <span class=\"st\">\"\"\"Apply pagination to a SQLAlchemy query and return a Page object.\"\"\"</span>\n    <span class=\"cm\"># Clamp values to safe ranges</span>\n    page     <span class=\"op\">=</span> <span class=\"fn\">max</span>(<span class=\"nb\">1</span>, page)\n    per_page <span class=\"op\">=</span> <span class=\"fn\">min</span>(<span class=\"fn\">max</span>(<span class=\"nb\">1</span>, per_page), max_per_page)\n    \n    <span class=\"cm\"># COUNT query first — executed once, cached by SQLAlchemy</span>\n    total <span class=\"op\">=</span> query.<span class=\"fn\">count</span>()\n    \n    <span class=\"cm\"># OFFSET/LIMIT query — fetch just this page's items</span>\n    items <span class=\"op\">=</span> query.<span class=\"fn\">offset</span>((page <span class=\"op\">-</span> <span class=\"nb\">1</span>) <span class=\"op\">*</span> per_page).<span class=\"fn\">limit</span>(per_page).<span class=\"fn\">all</span>()\n    \n    <span class=\"kw\">return</span> <span class=\"fn\">Page</span>(\n        items    <span class=\"op\">=</span> items,\n        total    <span class=\"op\">=</span> total,\n        page     <span class=\"op\">=</span> page,\n        per_page <span class=\"op\">=</span> per_page,\n        has_next <span class=\"op\">=</span> page <span class=\"op\">*</span> per_page  <span class=\"nb\">1</span>,\n    )</code></pre><h3>Dynamic Filtering and Sorting</h3><p>A useful API lets clients filter and sort results without you writing a separate endpoint for every combination. The key is building queries dynamically from query parameters while carefully validating what's allowed — never interpolate user input directly into SQL.</p><div class=\"cl\">python — dynamic filter builder</div><pre><code><span class=\"kw\">from</span> sqlalchemy <span class=\"kw\">import</span> or_, and_, desc, asc\n<span class=\"kw\">from</span> flask <span class=\"kw\">import</span> request\n\n<span class=\"cm\"># Whitelist of sortable fields — NEVER allow arbitrary column names</span>\n<span class=\"cm\"># An attacker could use \"password\" as a sort field to leak data via timing</span>\n<span class=\"nm\">ALLOWED_SORT_FIELDS</span> <span class=\"op\">=</span> {<span class=\"st\">\"created_at\"</span>, <span class=\"st\">\"title\"</span>, <span class=\"st\">\"views\"</span>, <span class=\"st\">\"updated_at\"</span>}\n<span class=\"nm\">ALLOWED_SORT_DIRS</span>   <span class=\"op\">=</span> {<span class=\"st\">\"asc\"</span>, <span class=\"st\">\"desc\"</span>}\n\n<span class=\"kw\">def</span> <span class=\"fn\">build_post_query</span>(args: <span class=\"fn\">dict</span>):\n    <span class=\"st\">\"\"\"Build a SQLAlchemy query from request query parameters.\n    \n    Supports: ?q=search_term&amp;status=published&amp;since=2024-01-01&amp;sort=views&amp;dir=desc\n    All parameters are optional — pass none for \"all posts\".\n    \"\"\"</span>\n    <span class=\"cm\"># Start with the base query</span>\n    query   <span class=\"op\">=</span> <span class=\"nm\">Post</span>.query\n    filters <span class=\"op\">=</span> []\n    \n    <span class=\"cm\"># Full-text search: ?q=python</span>\n    <span class=\"cm\"># ilike = case-insensitive LIKE, % is wildcard on both sides</span>\n    <span class=\"kw\">if</span> q :<span class=\"op\">=</span> args.<span class=\"fn\">get</span>(<span class=\"st\">\"q\"</span>):\n        pattern <span class=\"op\">=</span> f<span class=\"st\">\"%{q}%\"</span>\n        filters.<span class=\"fn\">append</span>(\n            <span class=\"fn\">or_</span>(\n                <span class=\"nm\">Post</span>.title.<span class=\"fn\">ilike</span>(pattern),   <span class=\"cm\"># search in title</span>\n                <span class=\"nm\">Post</span>.body.<span class=\"fn\">ilike</span>(pattern),    <span class=\"cm\"># OR in body</span>\n            )\n        )\n    \n    <span class=\"cm\"># Status filter: ?status=published</span>\n    <span class=\"kw\">if</span> status :<span class=\"op\">=</span> args.<span class=\"fn\">get</span>(<span class=\"st\">\"status\"</span>):\n        <span class=\"kw\">if</span> status <span class=\"kw\">not</span> <span class=\"kw\">in</span> (<span class=\"st\">\"draft\"</span>, <span class=\"st\">\"published\"</span>, <span class=\"st\">\"archived\"</span>):\n            <span class=\"kw\">from</span> flask <span class=\"kw\">import</span> abort\n            <span class=\"fn\">abort</span>(<span class=\"nb\">400</span>, f<span class=\"st\">\"Invalid status: {status}\"</span>)\n        filters.<span class=\"fn\">append</span>(<span class=\"nm\">Post</span>.status <span class=\"op\">==</span> status)\n    \n    <span class=\"cm\"># Date range filters: ?since=2024-01-01&amp;until=2024-12-31</span>\n    <span class=\"kw\">if</span> since :<span class=\"op\">=</span> args.<span class=\"fn\">get</span>(<span class=\"st\">\"since\"</span>):\n        <span class=\"kw\">try</span>:\n            since_dt <span class=\"op\">=</span> datetime.<span class=\"fn\">fromisoformat</span>(since)\n            filters.<span class=\"fn\">append</span>(<span class=\"nm\">Post</span>.created_at <span class=\"op\">&gt;=</span> since_dt)\n        <span class=\"kw\">except</span> <span class=\"nm\">ValueError</span>:\n            <span class=\"fn\">abort</span>(<span class=\"nb\">400</span>, <span class=\"st\">\"Invalid since date format. Use ISO format: 2024-01-15\"</span>)\n    \n    <span class=\"kw\">if</span> until :<span class=\"op\">=</span> args.<span class=\"fn\">get</span>(<span class=\"st\">\"until\"</span>):\n        <span class=\"kw\">try</span>:\n            until_dt <span class=\"op\">=</span> datetime.<span class=\"fn\">fromisoformat</span>(until)\n            filters.<span class=\"fn\">append</span>(<span class=\"nm\">Post</span>.created_at <span class=\"op\">&lt;=</span> until_dt)\n        <span class=\"kw\">except</span> <span class=\"nm\">ValueError</span>:\n            <span class=\"fn\">abort</span>(<span class=\"nb\">400</span>, <span class=\"st\">\"Invalid until date format\"</span>)\n    \n    <span class=\"cm\"># Tag filter: ?tag=python&amp;tag=django (can specify multiple)</span>\n    tags <span class=\"op\">=</span> args.<span class=\"fn\">getlist</span>(<span class=\"st\">\"tag\"</span>)\n    <span class=\"kw\">if</span> tags:\n        <span class=\"cm\"># Join to tags table and filter</span>\n        query <span class=\"op\">=</span> query.<span class=\"fn\">join</span>(<span class=\"nm\">Post</span>.tags).<span class=\"fn\">filter</span>(<span class=\"nm\">Tag</span>.name.<span class=\"fn\">in_</span>(tags))\n    \n    <span class=\"cm\"># Apply all filters together (AND logic)</span>\n    <span class=\"kw\">if</span> filters:\n        query <span class=\"op\">=</span> query.<span class=\"fn\">filter</span>(<span class=\"fn\">and_</span>(<span class=\"op\">*</span>filters))\n    \n    <span class=\"cm\"># Sorting — validate field and direction against whitelist</span>\n    sort_field <span class=\"op\">=</span> args.<span class=\"fn\">get</span>(<span class=\"st\">\"sort\"</span>, <span class=\"st\">\"created_at\"</span>)\n    sort_dir   <span class=\"op\">=</span> args.<span class=\"fn\">get</span>(<span class=\"st\">\"dir\"</span>,  <span class=\"st\">\"desc\"</span>)\n    \n    <span class=\"kw\">if</span> sort_field <span class=\"kw\">not</span> <span class=\"kw\">in</span> <span class=\"nm\">ALLOWED_SORT_FIELDS</span>:\n        sort_field <span class=\"op\">=</span> <span class=\"st\">\"created_at\"</span>\n    <span class=\"kw\">if</span> sort_dir <span class=\"kw\">not</span> <span class=\"kw\">in</span> <span class=\"nm\">ALLOWED_SORT_DIRS</span>:\n        sort_dir <span class=\"op\">=</span> <span class=\"st\">\"desc\"</span>\n    \n    sort_column <span class=\"op\">=</span> <span class=\"fn\">getattr</span>(<span class=\"nm\">Post</span>, sort_field)\n    <span class=\"kw\">return</span> query.<span class=\"fn\">order_by</span>(<span class=\"fn\">desc</span>(sort_column) <span class=\"kw\">if</span> sort_dir <span class=\"op\">==</span> <span class=\"st\">\"desc\"</span> <span class=\"kw\">else</span> <span class=\"fn\">asc</span>(sort_column))\n\n<span class=\"dc\">@posts_bp.route</span>(<span class=\"st\">\"/\"</span>)\n<span class=\"kw\">def</span> <span class=\"fn\">list_posts</span>():\n    <span class=\"st\">\"\"\"GET /api/posts/?q=python&amp;status=published&amp;sort=views&amp;dir=desc&amp;page=1&amp;per_page=20\"\"\"</span>\n    query    <span class=\"op\">=</span> <span class=\"fn\">build_post_query</span>(request.args)\n    page     <span class=\"op\">=</span> request.args.<span class=\"fn\">get</span>(<span class=\"st\">\"page\"</span>,     <span class=\"nb\">1</span>,  <span class=\"fn\">type</span><span class=\"op\">=</span><span class=\"fn\">int</span>)\n    per_page <span class=\"op\">=</span> request.args.<span class=\"fn\">get</span>(<span class=\"st\">\"per_page\"</span>, <span class=\"nb\">20</span>, <span class=\"fn\">type</span><span class=\"op\">=</span><span class=\"fn\">int</span>)\n    \n    result <span class=\"op\">=</span> <span class=\"fn\">paginate_query</span>(query, page, per_page)\n    <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>(result.<span class=\"fn\">to_dict</span>(serialise_item<span class=\"op\">=</span>post_schema.dump))</code></pre><h2>OpenAPI Documentation with Flask-Smorest</h2><p>Flask-Smorest automatically generates OpenAPI 3 documentation from your code. Instead of writing YAML by hand, you decorate your routes with schema classes and Flask-Smorest generates a full Swagger UI and ReDoc page. The documentation stays in sync with the code because it IS the code.</p><div class=\"cl\">bash</div><pre><code><span class=\"fn\">pip</span> install flask-smorest</code></pre><div class=\"cl\">python — Flask-Smorest setup</div><pre><code><span class=\"kw\">from</span> flask_smorest <span class=\"kw\">import</span> <span class=\"nm\">Api</span>, <span class=\"nm\">Blueprint</span> <span class=\"kw\">as</span> <span class=\"nm\">SmorestBlueprint</span>\n<span class=\"kw\">from</span> marshmallow <span class=\"kw\">import</span> <span class=\"nm\">Schema</span>, fields\n\n<span class=\"cm\"># Required configuration</span>\napp.config[<span class=\"st\">\"API_TITLE\"</span>]   <span class=\"op\">=</span> <span class=\"st\">\"PyBlog API\"</span>\napp.config[<span class=\"st\">\"API_VERSION\"</span>] <span class=\"op\">=</span> <span class=\"st\">\"v1\"</span>\napp.config[<span class=\"st\">\"OPENAPI_VERSION\"</span>]  <span class=\"op\">=</span> <span class=\"st\">\"3.0.3\"</span>\napp.config[<span class=\"st\">\"OPENAPI_URL_PREFIX\"</span>]   <span class=\"op\">=</span> <span class=\"st\">\"/\"</span>\napp.config[<span class=\"st\">\"OPENAPI_SWAGGER_UI_PATH\"</span>] <span class=\"op\">=</span> <span class=\"st\">\"/docs\"</span>    <span class=\"cm\"># Swagger UI at /docs</span>\napp.config[<span class=\"st\">\"OPENAPI_SWAGGER_UI_URL\"</span>]  <span class=\"op\">=</span> <span class=\"st\">\"https://cdn.jsdelivr.net/npm/swagger-ui-dist/\"</span>\napp.config[<span class=\"st\">\"OPENAPI_REDOC_PATH\"</span>]  <span class=\"op\">=</span> <span class=\"st\">\"/redoc\"</span>       <span class=\"cm\"># ReDoc at /redoc</span>\n\napi <span class=\"op\">=</span> <span class=\"fn\">Api</span>(app)\n\n<span class=\"cm\"># Use SmorestBlueprint instead of regular Flask Blueprint</span>\nposts_blp <span class=\"op\">=</span> <span class=\"fn\">SmorestBlueprint</span>(\n    <span class=\"st\">\"Posts\"</span>, __name__,\n    url_prefix<span class=\"op\">=</span><span class=\"st\">\"/api/posts\"</span>,\n    description<span class=\"op\">=</span><span class=\"st\">\"Blog post CRUD operations\"</span>,\n)\n\n<span class=\"cm\"># Query argument schema — documents and validates query params</span>\n<span class=\"kw\">class</span> <span class=\"fn\">PostQueryArgs</span>(<span class=\"nm\">Schema</span>):\n    q        <span class=\"op\">=</span> fields.<span class=\"fn\">Str</span>(metadata<span class=\"op\">=</span>{<span class=\"st\">\"description\"</span>: <span class=\"st\">\"Full-text search query\"</span>})\n    status   <span class=\"op\">=</span> fields.<span class=\"fn\">Str</span>(validate<span class=\"op\">=</span>validate.<span class=\"fn\">OneOf</span>([<span class=\"st\">\"draft\"</span>, <span class=\"st\">\"published\"</span>]))\n    sort     <span class=\"op\">=</span> fields.<span class=\"fn\">Str</span>(load_default<span class=\"op\">=</span><span class=\"st\">\"created_at\"</span>)\n    page     <span class=\"op\">=</span> fields.<span class=\"fn\">Int</span>(load_default<span class=\"op\">=</span><span class=\"nb\">1</span>,  metadata<span class=\"op\">=</span>{<span class=\"st\">\"minimum\"</span>: <span class=\"nb\">1</span>})\n    per_page <span class=\"op\">=</span> fields.<span class=\"fn\">Int</span>(load_default<span class=\"op\">=</span><span class=\"nb\">20</span>, metadata<span class=\"op\">=</span>{<span class=\"st\">\"minimum\"</span>: <span class=\"nb\">1</span>, <span class=\"st\">\"maximum\"</span>: <span class=\"nb\">100</span>})\n\n<span class=\"dc\">@posts_blp.route</span>(<span class=\"st\">\"/\"</span>)\n<span class=\"kw\">class</span> <span class=\"fn\">PostCollection</span>(<span class=\"nm\">MethodView</span>):\n    <span class=\"dc\">@posts_blp.arguments</span>(<span class=\"nm\">PostQueryArgs</span>, location<span class=\"op\">=</span><span class=\"st\">\"query\"</span>)  <span class=\"cm\"># validates query params</span>\n    <span class=\"dc\">@posts_blp.response</span>(<span class=\"nb\">200</span>, <span class=\"fn\">PostSchema</span>(many<span class=\"op\">=</span><span class=\"kw\">True</span>))         <span class=\"cm\"># documents response</span>\n    <span class=\"dc\">@posts_blp.paginate</span>(<span class=\"nm\">CursorPage</span>)                         <span class=\"cm\"># adds pagination headers</span>\n    <span class=\"kw\">def</span> <span class=\"fn\">get</span>(self, args):\n        <span class=\"st\">\"\"\"List all posts.\n        \n        This docstring appears in the Swagger UI as the endpoint description.\n        Supports full-text search, filtering by status, and sorting.\n        \"\"\"</span>\n        <span class=\"kw\">return</span> <span class=\"fn\">build_post_query</span>(args)   <span class=\"cm\"># queryset, paginated by flask-smorest</span>\n    \n    <span class=\"dc\">@posts_blp.arguments</span>(<span class=\"nm\">PostSchema</span>)    <span class=\"cm\"># validates and documents request body</span>\n    <span class=\"dc\">@posts_blp.response</span>(<span class=\"nb\">201</span>, <span class=\"nm\">PostSchema</span>)\n    <span class=\"dc\">@jwt_required</span>()\n    <span class=\"kw\">def</span> <span class=\"fn\">post</span>(self, new_post_data):\n        <span class=\"st\">\"\"\"Create a new post. Requires authentication.\"\"\"</span>\n        post <span class=\"op\">=</span> <span class=\"fn\">Post</span>(<span class=\"op\">**</span>new_post_data, author_id<span class=\"op\">=</span><span class=\"fn\">get_jwt_identity</span>())\n        db.session.<span class=\"fn\">add</span>(post); db.session.<span class=\"fn\">commit</span>()\n        <span class=\"kw\">return</span> post\n\napi.<span class=\"fn\">register_blueprint</span>(posts_blp)\n<span class=\"cm\"># Now visit /docs for interactive Swagger UI</span>\n<span class=\"cm\"># Visit /redoc for clean ReDoc documentation</span></code></pre>"},{"id":"dj-01","track":"django","tl":"Django","title":"Django: Batteries Included","sub":"Django philosophy, project creation, MTV pattern, settings management, and URL configuration.","content":"<h2>Django's Philosophy</h2><p>Django is the <em>batteries-included</em> Python web framework. Where Flask gives you a blank canvas, Django gives you a complete workshop with every tool already hung on the wall: an ORM, an admin interface, authentication, form handling, security middleware, and a templating engine — all configured to work together from day one.</p><p>Django follows the <strong>Convention over Configuration</strong> principle. There's a right way to structure a Django project, and if you follow those conventions, everything integrates seamlessly. This means you can build a feature-complete web application much faster than with a micro-framework, at the cost of some flexibility.</p><p>Django powers Instagram, Pinterest, the Washington Post, Disqus, and NASA's website. Its admin interface alone is worth learning — non-technical team members can manage data without writing a single line of code.</p><h2>The MTV Pattern</h2><p>Django uses the MTV (Model-Template-View) pattern, which is functionally equivalent to MVC but with Django's naming:</p><div class=\"tw\"><table><tr><th>Django Term</th><th>Equivalent</th><th>Responsibility</th></tr><tr><td>Model</td><td>Model</td><td>Defines data structure and business logic; talks to the database</td></tr><tr><td>Template</td><td>View</td><td>Renders HTML (or JSON) with data from the view</td></tr><tr><td>View</td><td>Controller</td><td>Handles the request, fetches data from the model, returns a response</td></tr><tr><td>URL conf</td><td>Router</td><td>Maps URL patterns to view functions or classes</td></tr></table></div><h2>Creating a Project</h2><div class=\"cl\">bash — project setup</div><pre><code><span class=\"fn\">pip</span> install django djangorestframework psycopg2-binary python-dotenv \\\n            djangorestframework-simplejwt django-cors-headers\n\n<span class=\"cm\"># Create the project (. = use current directory, not a subdirectory)</span>\n<span class=\"fn\">django-admin</span> startproject core .\n\n<span class=\"cm\"># Create an app — each app is a focused component of the project</span>\n<span class=\"fn\">python</span> manage.py startapp blog\n<span class=\"fn\">python</span> manage.py startapp users\n\n<span class=\"cm\"># Run the development server</span>\n<span class=\"fn\">python</span> manage.py runserver\n<span class=\"cm\"># Visit http://127.0.0.1:8000/ — you should see Django's welcome page</span></code></pre><div class=\"cl\">text — project structure</div><pre><code>taskboard/\n├── manage.py              ← Django's command-line utility\n├── core/                  ← project package (settings, root URLs)\n│   ├── settings/\n│   │   ├── base.py        ← settings shared across all environments\n│   │   ├── dev.py         ← development overrides\n│   │   └── prod.py        ← production overrides\n│   ├── urls.py            ← root URL configuration\n│   └── wsgi.py            ← production WSGI entry point\n├── users/                 ← users app\n│   ├── models.py\n│   ├── views.py\n│   ├── urls.py\n│   ├── serializers.py\n│   ├── admin.py\n│   └── tests.py\n└── blog/                  ← blog app (similar structure)</code></pre><div class=\"cl\">python — settings/base.py</div><pre><code><span class=\"kw\">from</span> pathlib <span class=\"kw\">import</span> <span class=\"fn\">Path</span>\n<span class=\"kw\">import</span> os\n<span class=\"kw\">from</span> dotenv <span class=\"kw\">import</span> load_dotenv\n<span class=\"fn\">load_dotenv</span>()\n\n<span class=\"nm\">BASE_DIR</span> <span class=\"op\">=</span> <span class=\"fn\">Path</span>(__file__).<span class=\"fn\">resolve</span>().parent.parent.parent\n\n<span class=\"cm\"># Django's secret key — generate a new one for production</span>\n<span class=\"nm\">SECRET_KEY</span> <span class=\"op\">=</span> os.environ[<span class=\"st\">\"DJANGO_SECRET_KEY\"</span>]\n<span class=\"nm\">DEBUG</span> <span class=\"op\">=</span> <span class=\"kw\">False</span>  <span class=\"cm\"># overridden in dev.py</span>\n\n<span class=\"nm\">INSTALLED_APPS</span> <span class=\"op\">=</span> [\n    <span class=\"cm\"># Django built-ins</span>\n    <span class=\"st\">\"django.contrib.admin\"</span>,\n    <span class=\"st\">\"django.contrib.auth\"</span>,\n    <span class=\"st\">\"django.contrib.contenttypes\"</span>,\n    <span class=\"st\">\"django.contrib.sessions\"</span>,\n    <span class=\"st\">\"django.contrib.messages\"</span>,\n    <span class=\"st\">\"django.contrib.staticfiles\"</span>,\n    <span class=\"cm\"># Third-party</span>\n    <span class=\"st\">\"rest_framework\"</span>,\n    <span class=\"st\">\"rest_framework_simplejwt\"</span>,\n    <span class=\"st\">\"corsheaders\"</span>,\n    <span class=\"cm\"># Our apps — register them so Django finds models, migrations, admin config</span>\n    <span class=\"st\">\"users\"</span>,\n    <span class=\"st\">\"blog\"</span>,\n]\n\n<span class=\"cm\"># CRITICAL: set before creating any migrations</span>\n<span class=\"cm\"># Tells Django to use your custom User model instead of the default</span>\n<span class=\"nm\">AUTH_USER_MODEL</span> <span class=\"op\">=</span> <span class=\"st\">\"users.User\"</span>\n\n<span class=\"nm\">DATABASES</span> <span class=\"op\">=</span> {\n    <span class=\"st\">\"default\"</span>: {\n        <span class=\"st\">\"ENGINE\"</span>:   <span class=\"st\">\"django.db.backends.postgresql\"</span>,\n        <span class=\"st\">\"NAME\"</span>:     os.<span class=\"fn\">getenv</span>(<span class=\"st\">\"DB_NAME\"</span>),\n        <span class=\"st\">\"USER\"</span>:     os.<span class=\"fn\">getenv</span>(<span class=\"st\">\"DB_USER\"</span>),\n        <span class=\"st\">\"PASSWORD\"</span>: os.<span class=\"fn\">getenv</span>(<span class=\"st\">\"DB_PASS\"</span>),\n        <span class=\"st\">\"HOST\"</span>:     os.<span class=\"fn\">getenv</span>(<span class=\"st\">\"DB_HOST\"</span>, <span class=\"st\">\"localhost\"</span>),\n        <span class=\"st\">\"PORT\"</span>:     os.<span class=\"fn\">getenv</span>(<span class=\"st\">\"DB_PORT\"</span>, <span class=\"st\">\"5432\"</span>),\n    }\n}\n\n<span class=\"nm\">DEFAULT_AUTO_FIELD</span> <span class=\"op\">=</span> <span class=\"st\">\"django.db.models.BigAutoField\"</span>  <span class=\"cm\"># 64-bit integer primary keys</span></code></pre><div class=\"cal cal-warn\"><span class=\"cal-title\">&#9888; Set AUTH_USER_MODEL Before Any Migrations</span><p>If you don't define a custom User model before running your first migration, changing it later is very painful — it requires database surgery and rewriting all foreign keys. Always set <code>AUTH_USER_MODEL</code> at the start of a new project, even if you plan to use Django's default User for now.</p></div><h2>URL Configuration</h2><div class=\"cl\">python — core/urls.py</div><pre><code><span class=\"kw\">from</span> django.contrib <span class=\"kw\">import</span> admin\n<span class=\"kw\">from</span> django.urls <span class=\"kw\">import</span> path, include\n\nurlpatterns <span class=\"op\">=</span> [\n    <span class=\"fn\">path</span>(<span class=\"st\">\"admin/\"</span>,     admin.site.urls),             <span class=\"cm\"># Django admin</span>\n    <span class=\"fn\">path</span>(<span class=\"st\">\"api/auth/\"</span>,  <span class=\"fn\">include</span>(<span class=\"st\">\"users.urls\"</span>)),        <span class=\"cm\"># /api/auth/*</span>\n    <span class=\"fn\">path</span>(<span class=\"st\">\"api/blog/\"</span>,  <span class=\"fn\">include</span>(<span class=\"st\">\"blog.urls\"</span>)),         <span class=\"cm\"># /api/blog/*</span>\n    <span class=\"fn\">path</span>(<span class=\"st\">\"api/token/\"</span>, <span class=\"fn\">include</span>(<span class=\"st\">\"simplejwt_urls\"</span>)),   <span class=\"cm\"># JWT token endpoints</span>\n]</code></pre><div class=\"cl\">python — blog/urls.py</div><pre><code><span class=\"kw\">from</span> django.urls <span class=\"kw\">import</span> path\n<span class=\"kw\">from</span> rest_framework.routers <span class=\"kw\">import</span> <span class=\"nm\">DefaultRouter</span>\n<span class=\"kw\">from</span> . <span class=\"kw\">import</span> views\n\nrouter <span class=\"op\">=</span> <span class=\"fn\">DefaultRouter</span>()\nrouter.<span class=\"fn\">register</span>(<span class=\"st\">\"posts\"</span>, views.<span class=\"nm\">PostViewSet</span>, basename<span class=\"op\">=</span><span class=\"st\">\"post\"</span>)\nrouter.<span class=\"fn\">register</span>(<span class=\"st\">\"tags\"</span>,  views.<span class=\"nm\">TagViewSet</span>,  basename<span class=\"op\">=</span><span class=\"st\">\"tag\"</span>)\n\nurlpatterns <span class=\"op\">=</span> router.urls\n<span class=\"cm\"># Generates:</span>\n<span class=\"cm\"># GET  POST  /posts/</span>\n<span class=\"cm\"># GET  PUT  PATCH  DELETE  /posts/{id}/</span>\n<span class=\"cm\"># GET  POST  /tags/</span>\n<span class=\"cm\"># GET  PUT  PATCH  DELETE  /tags/{id}/</span></code></pre>"},{"id":"dj-02","track":"django","tl":"Django","title":"Models, Admin &amp; Custom Managers","sub":"Model definitions, TextChoices, relationships, custom managers, and the Django admin.","content":"<h2>Models — Defining Your Data Layer</h2><p>Django models are Python classes that map to database tables. Each class attribute maps to a column. Django's ORM handles SQL generation, connection pooling, and query optimisation — you rarely write raw SQL.</p><p>Model design is one of the most important decisions in a Django project. Good models reflect your domain accurately, define appropriate constraints, and make common queries efficient. Bad models become expensive to change after data accumulates.</p><h3>Model Fields and Their Purpose</h3><p>Each field type maps to a specific database column type and enforces validation at both the Python and database level. Choosing the right field type gives you free validation and appropriate DB indexing.</p><div class=\"tw\"><table><tr><th>Field</th><th>DB Type</th><th>Use For</th></tr><tr><td><code>CharField(max_length=N)</code></td><td>VARCHAR(N)</td><td>Short strings: names, titles, slugs</td></tr><tr><td><code>TextField()</code></td><td>TEXT</td><td>Long strings: article bodies, descriptions</td></tr><tr><td><code>IntegerField()</code></td><td>INTEGER</td><td>Whole numbers</td></tr><tr><td><code>FloatField()</code></td><td>REAL</td><td>Decimal numbers (use DecimalField for money)</td></tr><tr><td><code>DecimalField(max_digits, decimal_places)</code></td><td>DECIMAL</td><td>Financial amounts — exact precision</td></tr><tr><td><code>BooleanField()</code></td><td>BOOLEAN</td><td>True/False flags</td></tr><tr><td><code>DateTimeField(auto_now_add=True)</code></td><td>TIMESTAMP</td><td>Creation timestamp, set once</td></tr><tr><td><code>DateTimeField(auto_now=True)</code></td><td>TIMESTAMP</td><td>Last updated timestamp, always current</td></tr><tr><td><code>SlugField()</code></td><td>VARCHAR</td><td>URL-friendly string: 'my-post-title'</td></tr><tr><td><code>EmailField()</code></td><td>VARCHAR</td><td>Email address with format validation</td></tr><tr><td><code>ImageField(upload_to=...)</code></td><td>VARCHAR</td><td>File path for uploaded images</td></tr><tr><td><code>JSONField()</code></td><td>JSONB</td><td>Structured JSON data (PostgreSQL)</td></tr><tr><td><code>ForeignKey(Model, on_delete=...)</code></td><td>INTEGER FK</td><td>Many-to-one relationship</td></tr><tr><td><code>ManyToManyField(Model)</code></td><td>Junction table</td><td>Many-to-many relationship</td></tr></table></div><div class=\"cl\">python — complete model example</div><pre><code><span class=\"kw\">from</span> django.db <span class=\"kw\">import</span> models\n<span class=\"kw\">from</span> django.contrib.auth <span class=\"kw\">import</span> get_user_model\n<span class=\"kw\">from</span> django.utils.text <span class=\"kw\">import</span> slugify\n<span class=\"kw\">from</span> django.core.validators <span class=\"kw\">import</span> <span class=\"nm\">MinValueValidator</span>, <span class=\"nm\">MaxValueValidator</span>\n\n<span class=\"nm\">User</span> <span class=\"op\">=</span> <span class=\"fn\">get_user_model</span>()\n\n<span class=\"kw\">class</span> <span class=\"fn\">Category</span>(models.<span class=\"nm\">Model</span>):\n    name <span class=\"op\">=</span> models.<span class=\"fn\">CharField</span>(max_length<span class=\"op\">=</span><span class=\"nb\">100</span>, unique<span class=\"op\">=</span><span class=\"kw\">True</span>)\n    slug <span class=\"op\">=</span> models.<span class=\"fn\">SlugField</span>(unique<span class=\"op\">=</span><span class=\"kw\">True</span>, blank<span class=\"op\">=</span><span class=\"kw\">True</span>)   <span class=\"cm\"># blank=True = optional in forms</span>\n    description <span class=\"op\">=</span> models.<span class=\"fn\">TextField</span>(blank<span class=\"op\">=</span><span class=\"kw\">True</span>)\n    \n    <span class=\"kw\">class</span> <span class=\"nm\">Meta</span>:\n        verbose_name_plural <span class=\"op\">=</span> <span class=\"st\">\"categories\"</span>   <span class=\"cm\"># \"Categorys\" is wrong, this fixes it</span>\n        ordering <span class=\"op\">=</span> [<span class=\"st\">\"name\"</span>]\n    \n    <span class=\"kw\">def</span> <span class=\"fn\">save</span>(self, <span class=\"op\">*</span>args, <span class=\"op\">**</span>kwargs):\n        <span class=\"kw\">if</span> <span class=\"kw\">not</span> self.slug:   <span class=\"cm\"># auto-generate slug from name on first save</span>\n            self.slug <span class=\"op\">=</span> <span class=\"fn\">slugify</span>(self.name)\n        <span class=\"fn\">super</span>().<span class=\"fn\">save</span>(<span class=\"op\">*</span>args, <span class=\"op\">**</span>kwargs)\n    \n    <span class=\"kw\">def</span> <span class=\"fn\">__str__</span>(self):\n        <span class=\"kw\">return</span> self.name\n\n<span class=\"kw\">class</span> <span class=\"fn\">Post</span>(models.<span class=\"nm\">Model</span>):\n    <span class=\"kw\">class</span> <span class=\"fn\">Status</span>(models.<span class=\"nm\">TextChoices</span>):\n        <span class=\"nm\">DRAFT</span>     <span class=\"op\">=</span> <span class=\"st\">\"draft\"</span>,     <span class=\"st\">\"Draft\"</span>\n        <span class=\"nm\">PUBLISHED</span> <span class=\"op\">=</span> <span class=\"st\">\"published\"</span>, <span class=\"st\">\"Published\"</span>\n        <span class=\"nm\">ARCHIVED</span>  <span class=\"op\">=</span> <span class=\"st\">\"archived\"</span>,  <span class=\"st\">\"Archived\"</span>\n    \n    <span class=\"cm\"># Core fields</span>\n    title    <span class=\"op\">=</span> models.<span class=\"fn\">CharField</span>(max_length<span class=\"op\">=</span><span class=\"nb\">200</span>)\n    slug     <span class=\"op\">=</span> models.<span class=\"fn\">SlugField</span>(max_length<span class=\"op\">=</span><span class=\"nb\">220</span>, unique<span class=\"op\">=</span><span class=\"kw\">True</span>, blank<span class=\"op\">=</span><span class=\"kw\">True</span>)\n    body     <span class=\"op\">=</span> models.<span class=\"fn\">TextField</span>()\n    excerpt  <span class=\"op\">=</span> models.<span class=\"fn\">CharField</span>(max_length<span class=\"op\">=</span><span class=\"nb\">500</span>, blank<span class=\"op\">=</span><span class=\"kw\">True</span>)\n    \n    <span class=\"cm\"># Relationships</span>\n    <span class=\"cm\"># CASCADE: delete posts when author is deleted</span>\n    <span class=\"cm\"># related_name=\"posts\": access as user.posts.all() instead of user.post_set.all()</span>\n    author   <span class=\"op\">=</span> models.<span class=\"fn\">ForeignKey</span>(<span class=\"nm\">User</span>, on_delete<span class=\"op\">=</span>models.<span class=\"nm\">CASCADE</span>, related_name<span class=\"op\">=</span><span class=\"st\">\"posts\"</span>)\n    category <span class=\"op\">=</span> models.<span class=\"fn\">ForeignKey</span>(<span class=\"nm\">Category</span>, on_delete<span class=\"op\">=</span>models.<span class=\"nm\">SET_NULL</span>,\n                                  null<span class=\"op\">=</span><span class=\"kw\">True</span>, blank<span class=\"op\">=</span><span class=\"kw\">True</span>, related_name<span class=\"op\">=</span><span class=\"st\">\"posts\"</span>)\n    tags     <span class=\"op\">=</span> models.<span class=\"fn\">ManyToManyField</span>(<span class=\"st\">\"Tag\"</span>, blank<span class=\"op\">=</span><span class=\"kw\">True</span>, related_name<span class=\"op\">=</span><span class=\"st\">\"posts\"</span>)\n    \n    <span class=\"cm\"># Status and visibility</span>\n    status      <span class=\"op\">=</span> models.<span class=\"fn\">CharField</span>(max_length<span class=\"op\">=</span><span class=\"nb\">20</span>, choices<span class=\"op\">=</span><span class=\"nm\">Status</span>.choices,\n                                   default<span class=\"op\">=</span><span class=\"nm\">Status</span>.<span class=\"nm\">DRAFT</span>, db_index<span class=\"op\">=</span><span class=\"kw\">True</span>)\n    is_featured <span class=\"op\">=</span> models.<span class=\"fn\">BooleanField</span>(default<span class=\"op\">=</span><span class=\"kw\">False</span>)\n    \n    <span class=\"cm\"># Metrics</span>\n    views    <span class=\"op\">=</span> models.<span class=\"fn\">PositiveIntegerField</span>(default<span class=\"op\">=</span><span class=\"nb\">0</span>)\n    <span class=\"cm\"># PositiveIntegerField ensures DB-level constraint against negative values</span>\n    \n    <span class=\"cm\"># Ratings with validation</span>\n    rating   <span class=\"op\">=</span> models.<span class=\"fn\">FloatField</span>(\n        null<span class=\"op\">=</span><span class=\"kw\">True</span>, blank<span class=\"op\">=</span><span class=\"kw\">True</span>,\n        validators<span class=\"op\">=</span>[<span class=\"fn\">MinValueValidator</span>(<span class=\"nb\">0.0</span>), <span class=\"fn\">MaxValueValidator</span>(<span class=\"nb\">5.0</span>)]\n    )\n    \n    <span class=\"cm\"># Timestamps</span>\n    created_at <span class=\"op\">=</span> models.<span class=\"fn\">DateTimeField</span>(auto_now_add<span class=\"op\">=</span><span class=\"kw\">True</span>)  <span class=\"cm\"># set ONCE on creation</span>\n    updated_at <span class=\"op\">=</span> models.<span class=\"fn\">DateTimeField</span>(auto_now<span class=\"op\">=</span><span class=\"kw\">True</span>)      <span class=\"cm\"># updated on EVERY save</span>\n    published_at <span class=\"op\">=</span> models.<span class=\"fn\">DateTimeField</span>(null<span class=\"op\">=</span><span class=\"kw\">True</span>, blank<span class=\"op\">=</span><span class=\"kw\">True</span>)  <span class=\"cm\"># nullable</span>\n    \n    <span class=\"kw\">class</span> <span class=\"nm\">Meta</span>:\n        ordering <span class=\"op\">=</span> [<span class=\"st\">\"-created_at\"</span>]   <span class=\"cm\"># newest first by default</span>\n        <span class=\"cm\"># Compound index: speeds up the common query</span>\n        <span class=\"cm\"># Post.objects.filter(status=\"published\").order_by(\"-created_at\")</span>\n        indexes <span class=\"op\">=</span> [\n            models.<span class=\"fn\">Index</span>(fields<span class=\"op\">=</span>[<span class=\"st\">\"status\"</span>, <span class=\"st\">\"-created_at\"</span>], name<span class=\"op\">=</span><span class=\"st\">\"status_date_idx\"</span>),\n            models.<span class=\"fn\">Index</span>(fields<span class=\"op\">=</span>[<span class=\"st\">\"author\"</span>, <span class=\"st\">\"status\"</span>],      name<span class=\"op\">=</span><span class=\"st\">\"author_status_idx\"</span>),\n        ]\n        <span class=\"cm\"># Unique constraint: same author cannot have two posts with same title</span>\n        constraints <span class=\"op\">=</span> [\n            models.<span class=\"fn\">UniqueConstraint</span>(\n                fields<span class=\"op\">=</span>[<span class=\"st\">\"author\"</span>, <span class=\"st\">\"title\"</span>],\n                name<span class=\"op\">=</span><span class=\"st\">\"unique_author_title\"</span>\n            )\n        ]\n    \n    <span class=\"kw\">def</span> <span class=\"fn\">save</span>(self, <span class=\"op\">*</span>args, <span class=\"op\">**</span>kwargs):\n        <span class=\"kw\">if</span> <span class=\"kw\">not</span> self.slug:\n            self.slug <span class=\"op\">=</span> <span class=\"fn\">slugify</span>(self.title)\n        <span class=\"cm\"># Auto-generate excerpt from body if not provided</span>\n        <span class=\"kw\">if</span> <span class=\"kw\">not</span> self.excerpt <span class=\"kw\">and</span> self.body:\n            self.excerpt <span class=\"op\">=</span> self.body[:<span class=\"nb\">497</span>] <span class=\"op\">+</span> <span class=\"st\">\"...\"</span>\n        <span class=\"fn\">super</span>().<span class=\"fn\">save</span>(<span class=\"op\">*</span>args, <span class=\"op\">**</span>kwargs)\n    \n    <span class=\"kw\">def</span> <span class=\"fn\">__str__</span>(self):\n        <span class=\"kw\">return</span> f<span class=\"st\">\"{self.title} ({self.status})\"</span>\n    \n    <span class=\"kw\">def</span> <span class=\"fn\">get_absolute_url</span>(self):\n        <span class=\"kw\">from</span> django.urls <span class=\"kw\">import</span> reverse\n        <span class=\"kw\">return</span> <span class=\"fn\">reverse</span>(<span class=\"st\">\"blog:post-detail\"</span>, kwargs<span class=\"op\">=</span>{<span class=\"st\">\"slug\"</span>: self.slug})</code></pre><h3>Custom Managers — Reusable Query Logic</h3><p>A manager is the interface through which Django performs database queries. The default <code>objects</code> manager returns everything. Custom managers let you encapsulate common filtering logic so you don't repeat yourself across views.</p><div class=\"cl\">python — custom managers</div><pre><code><span class=\"kw\">class</span> <span class=\"fn\">PublishedManager</span>(models.<span class=\"nm\">Manager</span>):\n    <span class=\"st\">\"\"\"Manager that returns only published posts.\n    \n    Usage: Post.published.all()\n    Compared to: Post.objects.filter(status=\"published\")\n    \"\"\"</span>\n    <span class=\"kw\">def</span> <span class=\"fn\">get_queryset</span>(self):\n        <span class=\"cm\"># Override the base queryset — all calls to this manager</span>\n        <span class=\"cm\"># start from here instead of returning ALL objects</span>\n        <span class=\"kw\">return</span> <span class=\"fn\">super</span>().<span class=\"fn\">get_queryset</span>().<span class=\"fn\">filter</span>(status<span class=\"op\">=</span><span class=\"nm\">Post</span>.<span class=\"nm\">Status</span>.<span class=\"nm\">PUBLISHED</span>)\n    \n    <span class=\"kw\">def</span> <span class=\"fn\">for_author</span>(self, author):\n        <span class=\"st\">\"\"\"Published posts by a specific author.\"\"\"</span>\n        <span class=\"kw\">return</span> self.<span class=\"fn\">get_queryset</span>().<span class=\"fn\">filter</span>(author<span class=\"op\">=</span>author)\n    \n    <span class=\"kw\">def</span> <span class=\"fn\">trending</span>(self, limit<span class=\"op\">=</span><span class=\"nb\">10</span>):\n        <span class=\"st\">\"\"\"Most-viewed published posts.\"\"\"</span>\n        <span class=\"kw\">return</span> self.<span class=\"fn\">get_queryset</span>().<span class=\"fn\">order_by</span>(<span class=\"st\">\"-views\"</span>)[:limit]\n    \n    <span class=\"kw\">def</span> <span class=\"fn\">with_relations</span>(self):\n        <span class=\"st\">\"\"\"Published posts with all related data preloaded.\n        Use this for list views to avoid N+1 queries.\n        \"\"\"</span>\n        <span class=\"kw\">return</span> self.<span class=\"fn\">get_queryset</span>()\\\n                   .<span class=\"fn\">select_related</span>(<span class=\"st\">\"author\"</span>, <span class=\"st\">\"category\"</span>)\\\n                   .<span class=\"fn\">prefetch_related</span>(<span class=\"st\">\"tags\"</span>)\n\n<span class=\"kw\">class</span> <span class=\"fn\">Post</span>(models.<span class=\"nm\">Model</span>):\n    <span class=\"cm\"># Define BOTH managers — objects stays for admin and internal use</span>\n    objects   <span class=\"op\">=</span> models.<span class=\"fn\">Manager</span>()    <span class=\"cm\"># returns ALL posts (including drafts)</span>\n    published <span class=\"op\">=</span> <span class=\"fn\">PublishedManager</span>()  <span class=\"cm\"># returns ONLY published posts</span>\n\n<span class=\"cm\"># Clean, expressive usage:</span>\nrecent_posts   <span class=\"op\">=</span> <span class=\"nm\">Post</span>.published.<span class=\"fn\">all</span>()[:<span class=\"nb\">10</span>]\ntrending       <span class=\"op\">=</span> <span class=\"nm\">Post</span>.published.<span class=\"fn\">trending</span>(limit<span class=\"op\">=</span><span class=\"nb\">5</span>)\nalice_posts    <span class=\"op\">=</span> <span class=\"nm\">Post</span>.published.<span class=\"fn\">for_author</span>(alice)\nlisted_posts   <span class=\"op\">=</span> <span class=\"nm\">Post</span>.published.<span class=\"fn\">with_relations</span>()   <span class=\"cm\"># efficient for list views</span></code></pre><h3>The Django Admin — Free Management Interface</h3><div class=\"cl\">python — blog/admin.py</div><pre><code><span class=\"kw\">from</span> django.contrib <span class=\"kw\">import</span> admin\n<span class=\"kw\">from</span> django.utils.html <span class=\"kw\">import</span> format_html\n<span class=\"kw\">from</span> .models <span class=\"kw\">import</span> <span class=\"nm\">Post</span>, <span class=\"nm\">Tag</span>, <span class=\"nm\">Category</span>\n\n<span class=\"dc\">@admin.register</span>(<span class=\"nm\">Post</span>)\n<span class=\"kw\">class</span> <span class=\"fn\">PostAdmin</span>(admin.<span class=\"nm\">ModelAdmin</span>):\n    <span class=\"cm\"># Columns shown in the list view</span>\n    list_display <span class=\"op\">=</span> [\n        <span class=\"st\">\"title\"</span>, <span class=\"st\">\"author_link\"</span>, <span class=\"st\">\"category\"</span>, <span class=\"st\">\"status\"</span>,\n        <span class=\"st\">\"views\"</span>, <span class=\"st\">\"is_featured\"</span>, <span class=\"st\">\"created_at\"</span>\n    ]\n    \n    <span class=\"cm\"># Clickable filter sidebar</span>\n    list_filter  <span class=\"op\">=</span> [<span class=\"st\">\"status\"</span>, <span class=\"st\">\"is_featured\"</span>, <span class=\"st\">\"category\"</span>, <span class=\"st\">\"created_at\"</span>]\n    \n    <span class=\"cm\"># Search box — __ traverses relationships</span>\n    <span class=\"cm\"># \"author__username\" means Post.author.username</span>\n    search_fields <span class=\"op\">=</span> [<span class=\"st\">\"title\"</span>, <span class=\"st\">\"body\"</span>, <span class=\"st\">\"author__username\"</span>, <span class=\"st\">\"tags__name\"</span>]\n    \n    <span class=\"cm\"># Auto-fill slug from title as the user types</span>\n    prepopulated_fields <span class=\"op\">=</span> {<span class=\"st\">\"slug\"</span>: (<span class=\"st\">\"title\"</span>,)}\n    \n    <span class=\"cm\"># Date drill-down navigation</span>\n    date_hierarchy <span class=\"op\">=</span> <span class=\"st\">\"created_at\"</span>\n    \n    <span class=\"cm\"># Use a more efficient widget for the author field</span>\n    <span class=\"cm\"># (avoids loading all users in a dropdown for large user tables)</span>\n    raw_id_fields <span class=\"op\">=</span> [<span class=\"st\">\"author\"</span>]\n    \n    <span class=\"cm\"># Many-to-many filter widget</span>\n    filter_horizontal <span class=\"op\">=</span> [<span class=\"st\">\"tags\"</span>]\n    \n    <span class=\"cm\"># Editable columns directly in the list view (no click-through required)</span>\n    list_editable <span class=\"op\">=</span> [<span class=\"st\">\"status\"</span>, <span class=\"st\">\"is_featured\"</span>]\n    \n    <span class=\"cm\"># Custom column: clickable author name</span>\n    <span class=\"kw\">def</span> <span class=\"fn\">author_link</span>(self, obj):\n        url <span class=\"op\">=</span> f<span class=\"st\">\"/admin/users/user/{obj.author.id}/change/\"</span>\n        <span class=\"kw\">return</span> <span class=\"fn\">format_html</span>(<span class=\"st\">'{}'</span>, url, obj.author.username)\n    author_link.short_description <span class=\"op\">=</span> <span class=\"st\">\"Author\"</span>\n    author_link.admin_order_field <span class=\"op\">=</span> <span class=\"st\">\"author__username\"</span>   <span class=\"cm\"># make it sortable</span>\n    \n    <span class=\"cm\"># Bulk actions — appear in the \"Action\" dropdown</span>\n    actions <span class=\"op\">=</span> [<span class=\"st\">\"publish_posts\"</span>, <span class=\"st\">\"archive_posts\"</span>, <span class=\"st\">\"feature_posts\"</span>]\n    \n    <span class=\"kw\">def</span> <span class=\"fn\">publish_posts</span>(self, request, queryset):\n        count <span class=\"op\">=</span> queryset.<span class=\"fn\">update</span>(status<span class=\"op\">=</span><span class=\"nm\">Post</span>.<span class=\"nm\">Status</span>.<span class=\"nm\">PUBLISHED</span>)\n        self.<span class=\"fn\">message_user</span>(request, f<span class=\"st\">\"{count} post(s) published.\"</span>)\n    publish_posts.short_description <span class=\"op\">=</span> <span class=\"st\">\"Publish selected posts\"</span>\n    \n    <span class=\"kw\">def</span> <span class=\"fn\">archive_posts</span>(self, request, queryset):\n        count <span class=\"op\">=</span> queryset.<span class=\"fn\">update</span>(status<span class=\"op\">=</span><span class=\"nm\">Post</span>.<span class=\"nm\">Status</span>.<span class=\"nm\">ARCHIVED</span>)\n        self.<span class=\"fn\">message_user</span>(request, f<span class=\"st\">\"{count} post(s) archived.\"</span>)\n    archive_posts.short_description <span class=\"op\">=</span> <span class=\"st\">\"Archive selected posts\"</span>\n    \n    <span class=\"kw\">def</span> <span class=\"fn\">feature_posts</span>(self, request, queryset):\n        count <span class=\"op\">=</span> queryset.<span class=\"fn\">update</span>(is_featured<span class=\"op\">=</span><span class=\"kw\">True</span>)\n        self.<span class=\"fn\">message_user</span>(request, f<span class=\"st\">\"{count} post(s) featured.\"</span>)\n    feature_posts.short_description <span class=\"op\">=</span> <span class=\"st\">\"Mark selected posts as featured\"</span></code></pre>"},{"id":"dj-03","track":"django","tl":"Django","title":"Django REST Framework","sub":"ModelSerializers, ViewSets, Routers, permissions, custom actions, and pagination.","content":"<h2>Django REST Framework — Building REST APIs</h2><p>Django REST Framework (DRF) is the standard toolkit for building REST APIs with Django. It adds serializers, class-based API views, permissions, pagination, and a browsable API interface. It integrates deeply with Django's ORM, auth system, and admin.</p><h3>Serializers — The Data Contract</h3><p>A DRF serializer converts between complex Django objects (model instances, querysets) and simple Python data types (dicts, lists) that can be rendered to JSON. It also validates incoming data. The <code>ModelSerializer</code> auto-generates fields from your model, saving significant boilerplate.</p><div class=\"cl\">python — blog/serializers.py</div><pre><code><span class=\"kw\">from</span> rest_framework <span class=\"kw\">import</span> serializers\n<span class=\"kw\">from</span> .models <span class=\"kw\">import</span> <span class=\"nm\">Post</span>, <span class=\"nm\">Tag</span>, <span class=\"nm\">Category</span>\n<span class=\"kw\">from</span> django.contrib.auth <span class=\"kw\">import</span> get_user_model\n\n<span class=\"nm\">User</span> <span class=\"op\">=</span> <span class=\"fn\">get_user_model</span>()\n\n<span class=\"kw\">class</span> <span class=\"fn\">UserBriefSerializer</span>(serializers.<span class=\"nm\">ModelSerializer</span>):\n    <span class=\"st\">\"\"\"Minimal user info included in post responses.\n    We don't want to expose all user data every time a post is listed.\n    \"\"\"</span>\n    <span class=\"kw\">class</span> <span class=\"nm\">Meta</span>:\n        model  <span class=\"op\">=</span> <span class=\"nm\">User</span>\n        fields <span class=\"op\">=</span> [<span class=\"st\">\"id\"</span>, <span class=\"st\">\"username\"</span>]   <span class=\"cm\"># only these two fields</span>\n\n<span class=\"kw\">class</span> <span class=\"fn\">TagSerializer</span>(serializers.<span class=\"nm\">ModelSerializer</span>):\n    <span class=\"kw\">class</span> <span class=\"nm\">Meta</span>:\n        model  <span class=\"op\">=</span> <span class=\"nm\">Tag</span>\n        fields <span class=\"op\">=</span> [<span class=\"st\">\"id\"</span>, <span class=\"st\">\"name\"</span>, <span class=\"st\">\"slug\"</span>]\n\n<span class=\"kw\">class</span> <span class=\"fn\">PostListSerializer</span>(serializers.<span class=\"nm\">ModelSerializer</span>):\n    <span class=\"st\">\"\"\"Used for list views — compact representation for browsing.\n    Includes author name and tag names, excludes the full body.\n    \"\"\"</span>\n    <span class=\"cm\"># nested serializer — embeds author object instead of just author_id</span>\n    author <span class=\"op\">=</span> <span class=\"fn\">UserBriefSerializer</span>(read_only<span class=\"op\">=</span><span class=\"kw\">True</span>)\n    tags   <span class=\"op\">=</span> <span class=\"fn\">TagSerializer</span>(many<span class=\"op\">=</span><span class=\"kw\">True</span>, read_only<span class=\"op\">=</span><span class=\"kw\">True</span>)\n    \n    <span class=\"kw\">class</span> <span class=\"nm\">Meta</span>:\n        model  <span class=\"op\">=</span> <span class=\"nm\">Post</span>\n        <span class=\"cm\"># Only include fields needed for a list item</span>\n        fields <span class=\"op\">=</span> [<span class=\"st\">\"id\"</span>, <span class=\"st\">\"title\"</span>, <span class=\"st\">\"slug\"</span>, <span class=\"st\">\"excerpt\"</span>, <span class=\"st\">\"author\"</span>,\n                  <span class=\"st\">\"tags\"</span>, <span class=\"st\">\"status\"</span>, <span class=\"st\">\"views\"</span>, <span class=\"st\">\"created_at\"</span>]\n\n<span class=\"kw\">class</span> <span class=\"fn\">PostDetailSerializer</span>(serializers.<span class=\"nm\">ModelSerializer</span>):\n    <span class=\"st\">\"\"\"Used for detail/create/update views — full representation.\n    Reads tags as full objects, writes them as IDs.\n    \"\"\"</span>\n    author <span class=\"op\">=</span> <span class=\"fn\">UserBriefSerializer</span>(read_only<span class=\"op\">=</span><span class=\"kw\">True</span>)   <span class=\"cm\"># always read-only</span>\n    tags   <span class=\"op\">=</span> <span class=\"fn\">TagSerializer</span>(many<span class=\"op\">=</span><span class=\"kw\">True</span>, read_only<span class=\"op\">=</span><span class=\"kw\">True</span>)   <span class=\"cm\"># read: full objects</span>\n    <span class=\"cm\"># tag_ids: write-only field so clients can set tags by ID</span>\n    <span class=\"cm\"># source=\"tags\" means this field maps to the \"tags\" model field</span>\n    tag_ids <span class=\"op\">=</span> serializers.<span class=\"fn\">PrimaryKeyRelatedField</span>(\n        queryset<span class=\"op\">=</span><span class=\"nm\">Tag</span>.objects.<span class=\"fn\">all</span>(),\n        many<span class=\"op\">=</span><span class=\"kw\">True</span>,\n        write_only<span class=\"op\">=</span><span class=\"kw\">True</span>,\n        source<span class=\"op\">=</span><span class=\"st\">\"tags\"</span>\n    )\n    \n    <span class=\"kw\">class</span> <span class=\"nm\">Meta</span>:\n        model  <span class=\"op\">=</span> <span class=\"nm\">Post</span>\n        fields <span class=\"op\">=</span> [\n            <span class=\"st\">\"id\"</span>, <span class=\"st\">\"title\"</span>, <span class=\"st\">\"slug\"</span>, <span class=\"st\">\"body\"</span>, <span class=\"st\">\"excerpt\"</span>,\n            <span class=\"st\">\"author\"</span>, <span class=\"st\">\"tags\"</span>, <span class=\"st\">\"tag_ids\"</span>, <span class=\"st\">\"status\"</span>,\n            <span class=\"st\">\"views\"</span>, <span class=\"st\">\"is_featured\"</span>, <span class=\"st\">\"created_at\"</span>, <span class=\"st\">\"updated_at\"</span>\n        ]\n        <span class=\"cm\"># These fields are computed by the system — clients can't set them</span>\n        read_only_fields <span class=\"op\">=</span> [<span class=\"st\">\"id\"</span>, <span class=\"st\">\"slug\"</span>, <span class=\"st\">\"author\"</span>, <span class=\"st\">\"views\"</span>, <span class=\"st\">\"created_at\"</span>, <span class=\"st\">\"updated_at\"</span>]\n    \n    <span class=\"kw\">def</span> <span class=\"fn\">validate_title</span>(self, value: <span class=\"fn\">str</span>) <span class=\"op\">-&gt;</span> <span class=\"fn\">str</span>:\n        <span class=\"st\">\"\"\"Field-level validation — runs after type checking.\n        Receives the field's value, return the cleaned value or raise ValidationError.\n        \"\"\"</span>\n        <span class=\"kw\">if</span> <span class=\"fn\">len</span>(value.<span class=\"fn\">strip</span>())  <span class=\"fn\">dict</span>:\n        <span class=\"st\">\"\"\"Object-level validation — access to ALL fields simultaneously.\n        Use this when validation depends on multiple fields.\n        \"\"\"</span>\n        <span class=\"kw\">if</span> data.<span class=\"fn\">get</span>(<span class=\"st\">\"status\"</span>) <span class=\"op\">==</span> <span class=\"st\">\"published\"</span> <span class=\"kw\">and</span> <span class=\"kw\">not</span> data.<span class=\"fn\">get</span>(<span class=\"st\">\"body\"</span>):\n            <span class=\"kw\">raise</span> serializers.<span class=\"fn\">ValidationError</span>(\n                {<span class=\"st\">\"body\"</span>: <span class=\"st\">\"Body is required for published posts\"</span>}\n            )\n        <span class=\"kw\">return</span> data\n    \n    <span class=\"kw\">def</span> <span class=\"fn\">create</span>(self, validated_data):\n        <span class=\"st\">\"\"\"Custom create: extract tags before creating the post.\n        Many-to-many fields must be set after the main object is created.\n        \"\"\"</span>\n        tags <span class=\"op\">=</span> validated_data.<span class=\"fn\">pop</span>(<span class=\"st\">\"tags\"</span>, [])   <span class=\"cm\"># remove from data</span>\n        post <span class=\"op\">=</span> <span class=\"nm\">Post</span>.objects.<span class=\"fn\">create</span>(<span class=\"op\">**</span>validated_data)\n        post.tags.<span class=\"fn\">set</span>(tags)   <span class=\"cm\"># set M2M relationship separately</span>\n        <span class=\"kw\">return</span> post\n    \n    <span class=\"kw\">def</span> <span class=\"fn\">update</span>(self, instance, validated_data):\n        <span class=\"st\">\"\"\"Custom update: handle tags separately.\"\"\"</span>\n        tags <span class=\"op\">=</span> validated_data.<span class=\"fn\">pop</span>(<span class=\"st\">\"tags\"</span>, <span class=\"kw\">None</span>)\n        <span class=\"kw\">for</span> attr, value <span class=\"kw\">in</span> validated_data.<span class=\"fn\">items</span>():\n            <span class=\"fn\">setattr</span>(instance, attr, value)\n        instance.<span class=\"fn\">save</span>()\n        <span class=\"kw\">if</span> tags <span class=\"kw\">is</span> <span class=\"kw\">not</span> <span class=\"kw\">None</span>:\n            instance.tags.<span class=\"fn\">set</span>(tags)\n        <span class=\"kw\">return</span> instance</code></pre><h3>ViewSets — CRUD Without Repetition</h3><p>A ViewSet combines the logic for list, create, retrieve, update, and destroy into one class. DRF generates all the URL patterns automatically via a Router. This eliminates writing 5+ separate view functions for standard CRUD.</p><div class=\"cl\">python — blog/views.py</div><pre><code><span class=\"kw\">from</span> rest_framework <span class=\"kw\">import</span> viewsets, permissions, filters, status\n<span class=\"kw\">from</span> rest_framework.decorators <span class=\"kw\">import</span> action\n<span class=\"kw\">from</span> rest_framework.response <span class=\"kw\">import</span> <span class=\"nm\">Response</span>\n<span class=\"kw\">from</span> django.db.models <span class=\"kw\">import</span> <span class=\"nm\">F</span>\n<span class=\"kw\">from</span> django_filters.rest_framework <span class=\"kw\">import</span> <span class=\"nm\">DjangoFilterBackend</span>\n<span class=\"kw\">from</span> .models <span class=\"kw\">import</span> <span class=\"nm\">Post</span>, <span class=\"nm\">Tag</span>\n<span class=\"kw\">from</span> .serializers <span class=\"kw\">import</span> <span class=\"nm\">PostListSerializer</span>, <span class=\"nm\">PostDetailSerializer</span>, <span class=\"nm\">TagSerializer</span>\n<span class=\"kw\">from</span> .permissions <span class=\"kw\">import</span> <span class=\"nm\">IsAuthorOrReadOnly</span>\n\n<span class=\"kw\">class</span> <span class=\"fn\">PostViewSet</span>(viewsets.<span class=\"nm\">ModelViewSet</span>):\n    <span class=\"st\">\"\"\"Complete CRUD for blog posts.\n    \n    This single class provides:\n    GET  /posts/           -&gt; list()\n    POST /posts/           -&gt; create()\n    GET  /posts/{id}/      -&gt; retrieve()\n    PUT  /posts/{id}/      -&gt; update()\n    PATCH /posts/{id}/     -&gt; partial_update()\n    DELETE /posts/{id}/    -&gt; destroy()\n    GET  /posts/trending/  -&gt; trending() (custom action)\n    \"\"\"</span>\n    \n    <span class=\"cm\"># Use published manager — drafts are never exposed via API</span>\n    <span class=\"cm\"># select_related and prefetch_related prevent N+1 queries</span>\n    queryset <span class=\"op\">=</span> <span class=\"nm\">Post</span>.published.<span class=\"fn\">with_relations</span>()\n    \n    <span class=\"cm\"># Permission: anyone can read, only authenticated users can write</span>\n    <span class=\"cm\"># IsAuthorOrReadOnly: only the post's author can modify it</span>\n    permission_classes <span class=\"op\">=</span> [permissions.<span class=\"nm\">IsAuthenticatedOrReadOnly</span>, <span class=\"nm\">IsAuthorOrReadOnly</span>]\n    \n    <span class=\"cm\"># DRF's built-in filtering and search backends</span>\n    filter_backends <span class=\"op\">=</span> [\n        <span class=\"nm\">DjangoFilterBackend</span>,    <span class=\"cm\"># ?status=published&amp;category__slug=python</span>\n        filters.<span class=\"nm\">SearchFilter</span>,   <span class=\"cm\"># ?search=flask+api</span>\n        filters.<span class=\"nm\">OrderingFilter</span>, <span class=\"cm\"># ?ordering=-views</span>\n    ]\n    filterset_fields <span class=\"op\">=</span> [<span class=\"st\">\"status\"</span>, <span class=\"st\">\"is_featured\"</span>, <span class=\"st\">\"category__slug\"</span>, <span class=\"st\">\"author__username\"</span>]\n    search_fields    <span class=\"op\">=</span> [<span class=\"st\">\"title\"</span>, <span class=\"st\">\"body\"</span>, <span class=\"st\">\"tags__name\"</span>]   <span class=\"cm\"># full-text search fields</span>\n    ordering_fields  <span class=\"op\">=</span> [<span class=\"st\">\"created_at\"</span>, <span class=\"st\">\"views\"</span>, <span class=\"st\">\"title\"</span>]  <span class=\"cm\"># sortable fields</span>\n    ordering         <span class=\"op\">=</span> [<span class=\"st\">\"-created_at\"</span>]   <span class=\"cm\"># default sort</span>\n    \n    <span class=\"kw\">def</span> <span class=\"fn\">get_serializer_class</span>(self):\n        <span class=\"st\">\"\"\"Return different serializers for list vs detail/create/update.\n        List views return a compact serializer; detail views return full data.\n        \"\"\"</span>\n        <span class=\"kw\">if</span> self.action <span class=\"op\">==</span> <span class=\"st\">\"list\"</span>:\n            <span class=\"kw\">return</span> <span class=\"nm\">PostListSerializer</span>\n        <span class=\"kw\">return</span> <span class=\"nm\">PostDetailSerializer</span>\n    \n    <span class=\"kw\">def</span> <span class=\"fn\">perform_create</span>(self, serializer):\n        <span class=\"st\">\"\"\"Set the author to the currently authenticated user.\n        Called by the default create() action after validation passes.\n        \"\"\"</span>\n        serializer.<span class=\"fn\">save</span>(author<span class=\"op\">=</span>self.request.user)\n    \n    <span class=\"kw\">def</span> <span class=\"fn\">retrieve</span>(self, request, <span class=\"op\">*</span>args, <span class=\"op\">**</span>kwargs):\n        <span class=\"st\">\"\"\"Override retrieve to increment view counter atomically.\n        Using F() expression prevents race conditions.\n        \"\"\"</span>\n        instance <span class=\"op\">=</span> self.<span class=\"fn\">get_object</span>()\n        <span class=\"cm\"># F(\"views\") + 1 executes UPDATE posts SET views = views + 1</span>\n        <span class=\"cm\"># This is safe under concurrent requests — no read-modify-write race</span>\n        <span class=\"nm\">Post</span>.objects.<span class=\"fn\">filter</span>(pk<span class=\"op\">=</span>instance.pk).<span class=\"fn\">update</span>(views<span class=\"op\">=</span><span class=\"fn\">F</span>(<span class=\"st\">\"views\"</span>) <span class=\"op\">+</span> <span class=\"nb\">1</span>)\n        instance.<span class=\"fn\">refresh_from_db</span>(fields<span class=\"op\">=</span>[<span class=\"st\">\"views\"</span>])   <span class=\"cm\"># reload the new count</span>\n        serializer <span class=\"op\">=</span> self.<span class=\"fn\">get_serializer</span>(instance)\n        <span class=\"kw\">return</span> <span class=\"fn\">Response</span>(serializer.data)\n    \n    <span class=\"cm\"># Custom actions — endpoints that don't fit the standard CRUD pattern</span>\n    <span class=\"dc\">@action</span>(\n        detail<span class=\"op\">=</span><span class=\"kw\">False</span>,     <span class=\"cm\"># False = operates on the collection, not a specific item</span>\n        methods<span class=\"op\">=</span>[<span class=\"st\">\"get\"</span>],\n        url_path<span class=\"op\">=</span><span class=\"st\">\"trending\"</span>,  <span class=\"cm\"># GET /posts/trending/</span>\n    )\n    <span class=\"kw\">def</span> <span class=\"fn\">trending</span>(self, request):\n        <span class=\"st\">\"\"\"Return the 10 most-viewed published posts.\"\"\"</span>\n        posts      <span class=\"op\">=</span> self.queryset.<span class=\"fn\">order_by</span>(<span class=\"st\">\"-views\"</span>)[:<span class=\"nb\">10</span>]\n        serializer <span class=\"op\">=</span> <span class=\"fn\">PostListSerializer</span>(posts, many<span class=\"op\">=</span><span class=\"kw\">True</span>, context<span class=\"op\">=</span>{<span class=\"st\">\"request\"</span>: request})\n        <span class=\"kw\">return</span> <span class=\"fn\">Response</span>(serializer.data)\n    \n    <span class=\"dc\">@action</span>(detail<span class=\"op\">=</span><span class=\"kw\">True</span>, methods<span class=\"op\">=</span>[<span class=\"st\">\"post\"</span>], url_path<span class=\"op\">=</span><span class=\"st\">\"publish\"</span>)\n    <span class=\"kw\">def</span> <span class=\"fn\">publish</span>(self, request, pk<span class=\"op\">=</span><span class=\"kw\">None</span>):\n        <span class=\"st\">\"\"\"POST /posts/{id}/publish/ — publish a draft.\"\"\"</span>\n        post <span class=\"op\">=</span> self.<span class=\"fn\">get_object</span>()   <span class=\"cm\"># handles 404 and permission check</span>\n        <span class=\"kw\">if</span> post.status <span class=\"op\">==</span> <span class=\"nm\">Post</span>.<span class=\"nm\">Status</span>.<span class=\"nm\">PUBLISHED</span>:\n            <span class=\"kw\">return</span> <span class=\"fn\">Response</span>(\n                {<span class=\"st\">\"detail\"</span>: <span class=\"st\">\"Post is already published\"</span>},\n                status<span class=\"op\">=</span>status.<span class=\"nm\">HTTP_400_BAD_REQUEST</span>\n            )\n        post.status <span class=\"op\">=</span> <span class=\"nm\">Post</span>.<span class=\"nm\">Status</span>.<span class=\"nm\">PUBLISHED</span>\n        post.<span class=\"fn\">save</span>(update_fields<span class=\"op\">=</span>[<span class=\"st\">\"status\"</span>, <span class=\"st\">\"updated_at\"</span>])   <span class=\"cm\"># only update these fields</span>\n        <span class=\"kw\">return</span> <span class=\"fn\">Response</span>({<span class=\"st\">\"status\"</span>: <span class=\"st\">\"published\"</span>})</code></pre>"},{"id":"dj-04","track":"django","tl":"Django","title":"ORM: Advanced Queries &amp; Signals","sub":"F/Q expressions, annotations, aggregation, select_related, prefetch_related, and signals.","content":"<h2>Advanced ORM — Writing Efficient Queries</h2><p>Django's ORM is deceptively powerful. Beyond basic <code>.filter()</code> and <code>.get()</code>, it provides F expressions for atomic DB-level operations, Q objects for complex filters, annotations for computed columns, and aggregations for statistical queries — all generating optimised SQL.</p><h3>F Expressions — Database-Level Arithmetic</h3><p>An <code>F()</code> expression represents a model field's value at the database level, without fetching it into Python. This is critical for safely incrementing counters: if you read a value, increment it in Python, then write it back, two concurrent requests both reading 100 will both write 101, losing one increment. <code>F()</code> expressions perform the increment in a single atomic SQL statement.</p><div class=\"cl\">python — F expressions in depth</div><pre><code><span class=\"kw\">from</span> django.db.models <span class=\"kw\">import</span> <span class=\"nm\">F</span>, <span class=\"nm\">ExpressionWrapper</span>, <span class=\"nm\">DurationField</span>, <span class=\"nm\">DecimalField</span>\n<span class=\"kw\">from</span> django.db.models.functions <span class=\"kw\">import</span> <span class=\"nm\">Coalesce</span>\n\n<span class=\"cm\"># ❌ WRONG: race condition with concurrent requests</span>\npost <span class=\"op\">=</span> <span class=\"nm\">Post</span>.objects.<span class=\"fn\">get</span>(pk<span class=\"op\">=</span><span class=\"nb\">1</span>)\npost.views <span class=\"op\">=</span> post.views <span class=\"op\">+</span> <span class=\"nb\">1</span>   <span class=\"cm\"># reads 100 into Python</span>\npost.<span class=\"fn\">save</span>()                    <span class=\"cm\"># writes 101 — but another request also read 100!</span>\n\n<span class=\"cm\"># ✅ CORRECT: atomic update — generates UPDATE posts SET views =
