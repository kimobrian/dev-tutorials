or missing keys using a factory function you provide. This eliminates the boilerplate <code>if key not in dict: dict[key] = []</code> pattern that appears constantly in grouping operations.</p><div class=\"cl\">python — collections.defaultdict</div><pre><code><span class=\"kw\">from</span> collections <span class=\"kw\">import</span> <span class=\"fn\">defaultdict</span>\n\n<span class=\"cm\"># Group items without defaultdict — verbose</span>\ngrouped <span class=\"op\">=</span> {}\n<span class=\"kw\">for</span> item <span class=\"kw\">in</span> [<span class=\"st\">\"apple\"</span>, <span class=\"st\">\"banana\"</span>, <span class=\"st\">\"avocado\"</span>, <span class=\"st\">\"blueberry\"</span>, <span class=\"st\">\"cherry\"</span>]:\n    first_letter <span class=\"op\">=</span> item[<span class=\"nb\">0</span>]\n    <span class=\"kw\">if</span> first_letter <span class=\"kw\">not</span> <span class=\"kw\">in</span> grouped:    <span class=\"cm\"># must check every time</span>\n        grouped[first_letter] <span class=\"op\">=</span> []\n    grouped[first_letter].<span class=\"fn\">append</span>(item)\n\n<span class=\"cm\"># Same thing with defaultdict — clean and elegant</span>\ngrouped <span class=\"op\">=</span> <span class=\"fn\">defaultdict</span>(<span class=\"fn\">list</span>)   <span class=\"cm\"># missing keys auto-initialise to []</span>\n<span class=\"kw\">for</span> item <span class=\"kw\">in</span> [<span class=\"st\">\"apple\"</span>, <span class=\"st\">\"banana\"</span>, <span class=\"st\">\"avocado\"</span>, <span class=\"st\">\"blueberry\"</span>, <span class=\"st\">\"cherry\"</span>]:\n    grouped[item[<span class=\"nb\">0</span>]].<span class=\"fn\">append</span>(item)   <span class=\"cm\"># no check needed</span>\n<span class=\"fn\">print</span>(<span class=\"fn\">dict</span>(grouped))  <span class=\"cm\"># {'a': ['apple', 'avocado'], 'b': ['banana', 'blueberry'], 'c': ['cherry']}</span>\n\n<span class=\"cm\"># defaultdict(int) — auto-initialise to 0 (word counting)</span>\nword_count <span class=\"op\">=</span> <span class=\"fn\">defaultdict</span>(<span class=\"fn\">int</span>)\n<span class=\"kw\">for</span> word <span class=\"kw\">in</span> <span class=\"st\">\"to be or not to be that is the question\"</span>.<span class=\"fn\">split</span>():\n    word_count[word] <span class=\"op\">+=</span> <span class=\"nb\">1</span>   <span class=\"cm\"># no KeyError even on first occurrence</span>\n<span class=\"fn\">print</span>(<span class=\"fn\">dict</span>(word_count))\n\n<span class=\"cm\"># defaultdict(set) — group unique values</span>\nuser_tags <span class=\"op\">=</span> <span class=\"fn\">defaultdict</span>(<span class=\"fn\">set</span>)\n<span class=\"kw\">for</span> user, tag <span class=\"kw\">in</span> [(<span class=\"st\">\"alice\"</span>, <span class=\"st\">\"python\"</span>), (<span class=\"st\">\"alice\"</span>, <span class=\"st\">\"django\"</span>), (<span class=\"st\">\"bob\"</span>, <span class=\"st\">\"python\"</span>), (<span class=\"st\">\"alice\"</span>, <span class=\"st\">\"python\"</span>)]:\n    user_tags[user].<span class=\"fn\">add</span>(tag)   <span class=\"cm\"># auto-creates set for new users</span>\n<span class=\"fn\">print</span>(<span class=\"fn\">dict</span>(user_tags))  <span class=\"cm\"># {'alice': {'python', 'django'}, 'bob': {'python'}}</span>\n\n<span class=\"cm\"># Nested defaultdict — for tree-like structures</span>\n<span class=\"kw\">def</span> <span class=\"fn\">nested_dict</span>(): <span class=\"kw\">return</span> <span class=\"fn\">defaultdict</span>(nested_dict)\nconfig <span class=\"op\">=</span> <span class=\"fn\">nested_dict</span>()\nconfig[<span class=\"st\">\"database\"</span>][<span class=\"st\">\"host\"</span>] <span class=\"op\">=</span> <span class=\"st\">\"localhost\"</span>\nconfig[<span class=\"st\">\"database\"</span>][<span class=\"st\">\"port\"</span>] <span class=\"op\">=</span> <span class=\"nb\">5432</span>\nconfig[<span class=\"st\">\"cache\"</span>][<span class=\"st\">\"ttl\"</span>] <span class=\"op\">=</span> <span class=\"nb\">300</span>\n<span class=\"fn\">print</span>(config[<span class=\"st\">\"database\"</span>][<span class=\"st\">\"host\"</span>])   <span class=\"cm\"># localhost</span>\n<span class=\"fn\">print</span>(config[<span class=\"st\">\"email\"</span>][<span class=\"st\">\"from\"</span>])      <span class=\"cm\"># defaultdict (empty, no error!)</span></code></pre><h3>deque — O(1) Operations on Both Ends</h3><p><code>deque</code> (double-ended queue) is a list-like container optimised for fast appends and pops from <em>both ends</em>. Appending to the front of a list is O(n) because all elements shift — a deque does it in O(1). Use deques for queues, sliding windows, and breadth-first search.</p><div class=\"cl\">python — collections.deque</div><pre><code><span class=\"kw\">from</span> collections <span class=\"kw\">import</span> <span class=\"fn\">deque</span>\n\n<span class=\"cm\"># Creating a deque</span>\nd <span class=\"op\">=</span> <span class=\"fn\">deque</span>([<span class=\"nb\">1</span>, <span class=\"nb\">2</span>, <span class=\"nb\">3</span>, <span class=\"nb\">4</span>, <span class=\"nb\">5</span>])\n\n<span class=\"cm\"># O(1) operations on both ends — much faster than list for front operations</span>\nd.<span class=\"fn\">append</span>(<span class=\"nb\">6</span>)       <span class=\"cm\"># add to RIGHT end: [1,2,3,4,5,6]</span>\nd.<span class=\"fn\">appendleft</span>(<span class=\"nb\">0</span>)   <span class=\"cm\"># add to LEFT end:  [0,1,2,3,4,5,6]  — list.insert(0,x) is O(n)!</span>\nd.<span class=\"fn\">pop</span>()           <span class=\"cm\"># remove from RIGHT: returns 6</span>\nd.<span class=\"fn\">popleft</span>()       <span class=\"cm\"># remove from LEFT:  returns 0  — list.pop(0) is O(n)!</span>\n\n<span class=\"cm\"># maxlen — creates a sliding window of fixed size</span>\n<span class=\"cm\"># When full, adding to one end automatically removes from the other</span>\nlast_3_requests <span class=\"op\">=</span> <span class=\"fn\">deque</span>(maxlen<span class=\"op\">=</span><span class=\"nb\">3</span>)\n<span class=\"kw\">for</span> url <span class=\"kw\">in</span> [<span class=\"st\">\"/home\"</span>, <span class=\"st\">\"/about\"</span>, <span class=\"st\">\"/posts\"</span>, <span class=\"st\">\"/login\"</span>, <span class=\"st\">\"/dashboard\"</span>]:\n    last_3_requests.<span class=\"fn\">append</span>(url)   <span class=\"cm\"># oldest auto-removed when full</span>\n<span class=\"fn\">print</span>(last_3_requests)   <span class=\"cm\"># deque([\"/posts\", \"/login\", \"/dashboard\"], maxlen=3)</span>\n\n<span class=\"cm\"># rotate — move elements from one end to the other</span>\nd <span class=\"op\">=</span> <span class=\"fn\">deque</span>([<span class=\"nb\">1</span>, <span class=\"nb\">2</span>, <span class=\"nb\">3</span>, <span class=\"nb\">4</span>, <span class=\"nb\">5</span>])\nd.<span class=\"fn\">rotate</span>(<span class=\"nb\">2</span>)    <span class=\"cm\"># rotate RIGHT by 2: [4, 5, 1, 2, 3]</span>\nd.<span class=\"fn\">rotate</span>(<span class=\"nb\">-1</span>)   <span class=\"cm\"># rotate LEFT by 1:  [5, 1, 2, 3, 4]</span>\n\n<span class=\"cm\"># Real-world: BFS (breadth-first search) uses deque as a queue</span>\n<span class=\"kw\">def</span> <span class=\"fn\">bfs</span>(graph, start, goal):\n    queue   <span class=\"op\">=</span> <span class=\"fn\">deque</span>([[start]])          <span class=\"cm\"># deque of paths</span>\n    visited <span class=\"op\">=</span> {start}\n    <span class=\"kw\">while</span> queue:\n        path <span class=\"op\">=</span> queue.<span class=\"fn\">popleft</span>()          <span class=\"cm\"># O(1) — not O(n) like list.pop(0)</span>\n        node <span class=\"op\">=</span> path[<span class=\"nb\">-1</span>]\n        <span class=\"kw\">if</span> node <span class=\"op\">==</span> goal: <span class=\"kw\">return</span> path\n        <span class=\"kw\">for</span> neighbor <span class=\"kw\">in</span> graph.<span class=\"fn\">get</span>(node, []):\n            <span class=\"kw\">if</span> neighbor <span class=\"kw\">not</span> <span class=\"kw\">in</span> visited:\n                visited.<span class=\"fn\">add</span>(neighbor)\n                queue.<span class=\"fn\">append</span>(path <span class=\"op\">+</span> [neighbor])\n    <span class=\"kw\">return</span> <span class=\"kw\">None</span></code></pre><h3>ChainMap — Layered Configuration Lookups</h3><p><code>ChainMap</code> combines multiple dicts into a single view. Lookups search through the maps in order — the first dict wins. This is perfect for layered configurations where user settings override project settings which override defaults.</p><div class=\"cl\">python — collections.ChainMap</div><pre><code><span class=\"kw\">from</span> collections <span class=\"kw\">import</span> <span class=\"fn\">ChainMap</span>\n\n<span class=\"cm\"># Layered configuration: user &gt; project &gt; system defaults</span>\nsystem_defaults <span class=\"op\">=</span> {<span class=\"st\">\"debug\"</span>: <span class=\"kw\">False</span>, <span class=\"st\">\"log_level\"</span>: <span class=\"st\">\"WARNING\"</span>, <span class=\"st\">\"workers\"</span>: <span class=\"nb\">4</span>, <span class=\"st\">\"timeout\"</span>: <span class=\"nb\">30</span>}\nproject_config  <span class=\"op\">=</span> {<span class=\"st\">\"debug\"</span>: <span class=\"kw\">True</span>, <span class=\"st\">\"log_level\"</span>: <span class=\"st\">\"INFO\"</span>, <span class=\"st\">\"db_url\"</span>: <span class=\"st\">\"sqlite:///dev.db\"</span>}\nuser_config     <span class=\"op\">=</span> {<span class=\"st\">\"log_level\"</span>: <span class=\"st\">\"DEBUG\"</span>}   <span class=\"cm\"># user overrides only what they care about</span>\n\n<span class=\"cm\"># ChainMap searches left-to-right — first dict that has the key wins</span>\nconfig <span class=\"op\">=</span> <span class=\"fn\">ChainMap</span>(user_config, project_config, system_defaults)\n\n<span class=\"fn\">print</span>(config[<span class=\"st\">\"log_level\"</span>])  <span class=\"cm\"># \"DEBUG\"    — from user_config (first)</span>\n<span class=\"fn\">print</span>(config[<span class=\"st\">\"debug\"</span>])      <span class=\"cm\"># True       — from project_config (not in user_config)</span>\n<span class=\"fn\">print</span>(config[<span class=\"st\">\"workers\"</span>])    <span class=\"cm\"># 4          — from system_defaults (not in others)</span>\n<span class=\"fn\">print</span>(config[<span class=\"st\">\"db_url\"</span>])     <span class=\"cm\"># sqlite:... — from project_config</span>\n\n<span class=\"cm\"># Writing goes to the FIRST map only — doesn't modify defaults</span>\nconfig[<span class=\"st\">\"timeout\"</span>] <span class=\"op\">=</span> <span class=\"nb\">60</span>   <span class=\"cm\"># written to user_config, not system_defaults</span>\n<span class=\"fn\">print</span>(user_config)       <span class=\"cm\"># {'log_level': 'DEBUG', 'timeout': 60}</span>\n<span class=\"fn\">print</span>(system_defaults[<span class=\"st\">\"timeout\"</span>])   <span class=\"cm\"># still 30 — unchanged</span>\n\n<span class=\"cm\"># .new_child() — create a child context (push a new map on top)</span>\ntemp_config <span class=\"op\">=</span> config.<span class=\"fn\">new_child</span>({<span class=\"st\">\"debug\"</span>: <span class=\"kw\">False</span>, <span class=\"st\">\"trace\"</span>: <span class=\"kw\">True</span>})\n<span class=\"fn\">print</span>(temp_config[<span class=\"st\">\"debug\"</span>])   <span class=\"cm\"># False  — from temp layer</span>\n<span class=\"fn\">print</span>(config[<span class=\"st\">\"debug\"</span>])        <span class=\"cm\"># True   — original unchanged</span>\n\n<span class=\"cm\"># Python's own variable scope uses ChainMap internally!</span>\n<span class=\"cm\"># local -&gt; enclosing -&gt; global -&gt; builtin is exactly ChainMap behaviour</span></code></pre><div class=\"cal cal-tip\"><span class=\"cal-title\">&#10003; When to Use Each</span><p>Use <code>Counter</code> when counting. Use <code>defaultdict</code> when grouping into lists, sets, or dicts. Use <code>deque</code> when you need a queue or sliding window. Use <code>ChainMap</code> for layered configs. These are not exotic — they come up in almost every non-trivial Python codebase.</p></div>"},{"id":"py-09","track":"python","tl":"Python Core","title":"Context Managers, Protocols & Descriptors","sub":"Advanced Python patterns: custom context managers, structural subtyping with Protocols, and the descriptor protocol.","content":"<h2>Guaranteed Cleanup: Context Managers</h2><p>A context manager guarantees that cleanup code runs regardless of whether an exception occurs. This solves a fundamental reliability problem: you open a file, allocate a resource, or acquire a lock — and you need it released even if the code between acquisition and release crashes.</p><p>The <code>with</code> statement is the syntax for using context managers. It calls <code>__enter__</code> when entering the block and <code>__exit__</code> when leaving, whether normally or due to an exception. Every file, database connection, lock, and network socket in Python implements this protocol.</p><h3>Class-Based Context Managers</h3><p>Implementing <code>__enter__</code> and <code>__exit__</code> gives you full control. <code>__exit__</code> receives the exception info — returning <code>True</code> suppresses the exception, <code>False</code> (or <code>None</code>) lets it propagate.</p><div class=\"cl\">python — class-based context manager</div><pre><code><span class=\"kw\">import</span> time\n\n<span class=\"kw\">class</span> <span class=\"nm\">Timer</span>:\n    <span class=\"st\">\"\"\"Measure how long a block of code takes to execute.\"\"\"</span>\n    \n    <span class=\"kw\">def</span> <span class=\"fn\">__enter__</span>(self):\n        <span class=\"cm\"># Called when entering the \"with\" block</span>\n        <span class=\"cm\"># Returns the value bound to \"as\" variable</span>\n        self.start <span class=\"op\">=</span> time.<span class=\"fn\">perf_counter</span>()\n        <span class=\"kw\">return</span> self   <span class=\"cm\"># \"with Timer() as t:\" — t is this object</span>\n    \n    <span class=\"kw\">def</span> <span class=\"fn\">__exit__</span>(self, exc_type, exc_val, exc_tb):\n        <span class=\"cm\"># Called when leaving the \"with\" block</span>\n        <span class=\"cm\"># exc_type/val/tb are None if no exception occurred</span>\n        self.elapsed <span class=\"op\">=</span> time.<span class=\"fn\">perf_counter</span>() <span class=\"op\">-</span> self.start\n        <span class=\"kw\">if</span> exc_type <span class=\"kw\">is</span> <span class=\"kw\">not</span> <span class=\"kw\">None</span>:\n            <span class=\"fn\">print</span>(f<span class=\"st\">\"Block failed after {self.elapsed:.3f}s: {exc_val}\"</span>)\n        <span class=\"cm\"># Return False (or None) = let exceptions propagate normally</span>\n        <span class=\"cm\"># Return True = suppress the exception (usually wrong!)</span>\n        <span class=\"kw\">return</span> <span class=\"kw\">False</span>\n\n<span class=\"kw\">with</span> <span class=\"fn\">Timer</span>() <span class=\"kw\">as</span> t:\n    <span class=\"cm\"># Your code here — Timer.elapsed will be set when block exits</span>\n    result <span class=\"op\">=</span> <span class=\"fn\">sum</span>(x<span class=\"op\">**</span><span class=\"nb\">2</span> <span class=\"kw\">for</span> x <span class=\"kw\">in</span> <span class=\"fn\">range</span>(<span class=\"nb\">1_000_000</span>))\n<span class=\"fn\">print</span>(f<span class=\"st\">\"Computation took {t.elapsed:.4f}s\"</span>)\n\n<span class=\"cm\"># Even if an exception occurs, __exit__ still runs</span>\n<span class=\"kw\">class</span> <span class=\"nm\">DatabaseConnection</span>:\n    <span class=\"kw\">def</span> <span class=\"fn\">__enter__</span>(self):\n        self.conn <span class=\"op\">=</span> <span class=\"fn\">create_connection</span>()\n        self.conn.<span class=\"fn\">begin</span>()   <span class=\"cm\"># start transaction</span>\n        <span class=\"kw\">return</span> self.conn\n    \n    <span class=\"kw\">def</span> <span class=\"fn\">__exit__</span>(self, exc_type, exc_val, exc_tb):\n        <span class=\"kw\">if</span> exc_type:          <span class=\"cm\"># an exception occurred</span>\n            self.conn.<span class=\"fn\">rollback</span>()   <span class=\"cm\"># undo all changes</span>\n        <span class=\"kw\">else</span>:\n            self.conn.<span class=\"fn\">commit</span>()     <span class=\"cm\"># save all changes</span>\n        self.conn.<span class=\"fn\">close</span>()     <span class=\"cm\"># ALWAYS close, exception or not</span>\n        <span class=\"kw\">return</span> <span class=\"kw\">False</span>          <span class=\"cm\"># let any exception propagate</span>\n\n<span class=\"kw\">with</span> <span class=\"fn\">DatabaseConnection</span>() <span class=\"kw\">as</span> conn:\n    conn.<span class=\"fn\">execute</span>(<span class=\"st\">\"INSERT INTO users VALUES (1, 'Alice')\"</span>)\n    conn.<span class=\"fn\">execute</span>(<span class=\"st\">\"UPDATE accounts SET balance = 500 WHERE user_id = 1\"</span>)\n<span class=\"cm\"># Both INSERTs committed atomically, or both rolled back on error</span></code></pre><h3>@contextmanager — Generator-Based Context Managers</h3><p>The <code>@contextmanager</code> decorator turns a generator function into a context manager. Code before <code>yield</code> is the setup (<code>__enter__</code>). The yielded value is bound to the <code>as</code> variable. Code after <code>yield</code> (in <code>finally</code>) is the teardown (<code>__exit__</code>). This is cleaner for simple cases.</p><div class=\"cl\">python — @contextmanager</div><pre><code><span class=\"kw\">from</span> contextlib <span class=\"kw\">import</span> <span class=\"fn\">contextmanager</span>, <span class=\"fn\">suppress</span>\n<span class=\"kw\">import</span> tempfile, shutil, os\n\n<span class=\"dc\">@contextmanager</span>\n<span class=\"kw\">def</span> <span class=\"fn\">temp_directory</span>():\n    <span class=\"st\">\"\"\"Create a temporary directory, yield it, then delete it.\n    The directory is ALWAYS cleaned up, even if an exception occurs.\n    \"\"\"</span>\n    <span class=\"cm\"># Setup: runs before yielding (like __enter__)</span>\n    path <span class=\"op\">=</span> tempfile.<span class=\"fn\">mkdtemp</span>()\n    <span class=\"fn\">print</span>(f<span class=\"st\">\"Created temp dir: {path}\"</span>)\n    <span class=\"kw\">try</span>:\n        <span class=\"kw\">yield</span> path   <span class=\"cm\"># &lt;-- this is where the \"with\" body runs</span>\n    <span class=\"kw\">finally</span>:\n        <span class=\"cm\"># Teardown: ALWAYS runs (like __exit__)</span>\n        <span class=\"cm\"># The finally block ensures cleanup even if body raised an exception</span>\n        shutil.<span class=\"fn\">rmtree</span>(path, ignore_errors<span class=\"op\">=</span><span class=\"kw\">True</span>)\n        <span class=\"fn\">print</span>(f<span class=\"st\">\"Cleaned up: {path}\"</span>)\n\n<span class=\"cm\"># Usage: identical to any built-in context manager</span>\n<span class=\"kw\">with</span> <span class=\"fn\">temp_directory</span>() <span class=\"kw\">as</span> tmpdir:\n    <span class=\"cm\"># Write some files for processing</span>\n    (<span class=\"fn\">Path</span>(tmpdir) <span class=\"op\">/</span> <span class=\"st\">\"data.csv\"</span>).<span class=\"fn\">write_text</span>(<span class=\"st\">\"id,name\\n1,Alice\"</span>)\n    <span class=\"fn\">process_files</span>(tmpdir)\n<span class=\"cm\"># tmpdir is gone here, guaranteed</span>\n\n<span class=\"dc\">@contextmanager</span>\n<span class=\"kw\">def</span> <span class=\"fn\">managed_transaction</span>(session):\n    <span class=\"st\">\"\"\"Wrap a database session in a transaction.\"\"\"</span>\n    <span class=\"kw\">try</span>:\n        <span class=\"kw\">yield</span> session\n        session.<span class=\"fn\">commit</span>()    <span class=\"cm\"># only commits if no exception</span>\n    <span class=\"kw\">except</span> <span class=\"nm\">Exception</span>:\n        session.<span class=\"fn\">rollback</span>()  <span class=\"cm\"># revert on any error</span>\n        <span class=\"kw\">raise</span>               <span class=\"cm\"># re-raise so caller knows it failed</span>\n    <span class=\"kw\">finally</span>:\n        session.<span class=\"fn\">close</span>()     <span class=\"cm\"># always close</span>\n\n<span class=\"cm\"># contextlib.suppress — a context manager that silences specific exceptions</span>\n<span class=\"cm\"># Much cleaner than try/except when you want to ignore certain errors</span>\n<span class=\"kw\">with</span> <span class=\"fn\">suppress</span>(<span class=\"nm\">FileNotFoundError</span>):\n    os.<span class=\"fn\">remove</span>(<span class=\"st\">\"cache/old_file.txt\"</span>)   <span class=\"cm\"># silently skip if file doesn't exist</span>\n\n<span class=\"cm\"># Equivalent to:</span>\n<span class=\"kw\">try</span>:\n    os.<span class=\"fn\">remove</span>(<span class=\"st\">\"cache/old_file.txt\"</span>)\n<span class=\"kw\">except</span> <span class=\"nm\">FileNotFoundError</span>:\n    <span class=\"kw\">pass</span>   <span class=\"cm\"># suppress achieves this in one line</span></code></pre><h3>Nesting and Combining Context Managers</h3><div class=\"cl\">python — multiple context managers</div><pre><code><span class=\"cm\"># Old way — deeply nested</span>\n<span class=\"kw\">with</span> <span class=\"fn\">open</span>(<span class=\"st\">\"input.txt\"</span>) <span class=\"kw\">as</span> infile:\n    <span class=\"kw\">with</span> <span class=\"fn\">open</span>(<span class=\"st\">\"output.txt\"</span>, <span class=\"st\">\"w\"</span>) <span class=\"kw\">as</span> outfile:\n        <span class=\"kw\">with</span> <span class=\"fn\">Timer</span>() <span class=\"kw\">as</span> t:\n            <span class=\"fn\">process</span>(infile, outfile)\n\n<span class=\"cm\"># Modern way — comma-separated on one line</span>\n<span class=\"kw\">with</span> <span class=\"fn\">open</span>(<span class=\"st\">\"input.txt\"</span>) <span class=\"kw\">as</span> infile, <span class=\"fn\">open</span>(<span class=\"st\">\"output.txt\"</span>, <span class=\"st\">\"w\"</span>) <span class=\"kw\">as</span> outfile, <span class=\"fn\">Timer</span>() <span class=\"kw\">as</span> t:\n    <span class=\"fn\">process</span>(infile, outfile)\n\n<span class=\"fn\">print</span>(f<span class=\"st\">\"Processing took {t.elapsed:.3f}s\"</span>)\n\n<span class=\"cm\"># contextlib.ExitStack — dynamic number of context managers</span>\n<span class=\"cm\"># Useful when you don't know at compile time how many you'll have</span>\n<span class=\"kw\">from</span> contextlib <span class=\"kw\">import</span> <span class=\"nm\">ExitStack</span>\n\nfile_paths <span class=\"op\">=</span> [<span class=\"st\">\"file1.txt\"</span>, <span class=\"st\">\"file2.txt\"</span>, <span class=\"st\">\"file3.txt\"</span>]\n\n<span class=\"kw\">with</span> <span class=\"fn\">ExitStack</span>() <span class=\"kw\">as</span> stack:\n    <span class=\"cm\"># Register context managers dynamically — all cleaned up when block exits</span>\n    files <span class=\"op\">=</span> [stack.<span class=\"fn\">enter_context</span>(<span class=\"fn\">open</span>(path)) <span class=\"kw\">for</span> path <span class=\"kw\">in</span> file_paths]\n    <span class=\"kw\">for</span> f <span class=\"kw\">in</span> files:\n        <span class=\"fn\">print</span>(f.<span class=\"fn\">readline</span>())\n<span class=\"cm\"># All files closed here, even if one raised an exception</span></code></pre><h2>Protocols — Structural Subtyping</h2><p>Traditional class inheritance says: 'this IS-A Bird'. Python Protocols say: 'this CAN-DO what a Bird does — it has <code>fly()</code> and <code>sing()</code>'. This is called <em>structural subtyping</em> or duck typing with type safety. An object satisfies a Protocol by having the required methods — no explicit inheritance needed.</p><p>Protocols (PEP 544, Python 3.8+) are how the standard library's abstract base classes (<code>Iterable</code>, <code>Sized</code>, <code>Comparable</code>) work. Understanding them lets you write code that accepts any object with the right shape, not just objects from a specific class hierarchy.</p><div class=\"cl\">python — typing.Protocol</div><pre><code><span class=\"kw\">from</span> typing <span class=\"kw\">import</span> <span class=\"nm\">Protocol</span>, runtime_checkable\n\n<span class=\"cm\"># Define a Protocol — a contract of required methods</span>\n<span class=\"dc\">@runtime_checkable</span>  <span class=\"cm\"># enables isinstance() checks at runtime</span>\n<span class=\"kw\">class</span> <span class=\"fn\">Drawable</span>(<span class=\"nm\">Protocol</span>):\n    <span class=\"st\">\"\"\"Any object that can draw itself and report its area.\"\"\"</span>\n    <span class=\"kw\">def</span> <span class=\"fn\">draw</span>(self) <span class=\"op\">-&gt;</span> <span class=\"fn\">str</span>: ...   <span class=\"cm\"># ... is the \"abstract\" body for Protocols</span>\n    <span class=\"kw\">def</span> <span class=\"fn\">area</span>(self) <span class=\"op\">-&gt;</span> <span class=\"fn\">float</span>: ...\n    <span class=\"kw\">def</span> <span class=\"fn\">move</span>(self, dx: <span class=\"fn\">float</span>, dy: <span class=\"fn\">float</span>) <span class=\"op\">-&gt;</span> <span class=\"kw\">None</span>: ...\n\n<span class=\"cm\"># These classes DON'T inherit from Drawable — but they satisfy the Protocol</span>\n<span class=\"kw\">class</span> <span class=\"nm\">Circle</span>:\n    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(self, x, y, radius):\n        self.x, self.y, self.radius <span class=\"op\">=</span> x, y, radius\n    <span class=\"kw\">def</span> <span class=\"fn\">draw</span>(self) <span class=\"op\">-&gt;</span> <span class=\"fn\">str</span>: <span class=\"kw\">return</span> f<span class=\"st\">\"○ at ({self.x},{self.y}) r={self.radius}\"</span>\n    <span class=\"kw\">def</span> <span class=\"fn\">area</span>(self) <span class=\"op\">-&gt;</span> <span class=\"fn\">float</span>: <span class=\"kw\">return</span> <span class=\"nb\">3.14159</span> <span class=\"op\">*</span> self.radius <span class=\"op\">**</span> <span class=\"nb\">2</span>\n    <span class=\"kw\">def</span> <span class=\"fn\">move</span>(self, dx, dy): self.x <span class=\"op\">+=</span> dx; self.y <span class=\"op\">+=</span> dy\n\n<span class=\"kw\">class</span> <span class=\"nm\">Rectangle</span>:\n    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(self, x, y, w, h):\n        self.x, self.y, self.w, self.h <span class=\"op\">=</span> x, y, w, h\n    <span class=\"kw\">def</span> <span class=\"fn\">draw</span>(self) <span class=\"op\">-&gt;</span> <span class=\"fn\">str</span>: <span class=\"kw\">return</span> f<span class=\"st\">\"□ at ({self.x},{self.y}) {self.w}x{self.h}\"</span>\n    <span class=\"kw\">def</span> <span class=\"fn\">area</span>(self) <span class=\"op\">-&gt;</span> <span class=\"fn\">float</span>: <span class=\"kw\">return</span> self.w <span class=\"op\">*</span> self.h\n    <span class=\"kw\">def</span> <span class=\"fn\">move</span>(self, dx, dy): self.x <span class=\"op\">+=</span> dx; self.y <span class=\"op\">+=</span> dy\n\n<span class=\"cm\"># Type-safe function that accepts ANY Drawable — not just Circle or Rectangle</span>\n<span class=\"kw\">def</span> <span class=\"fn\">render_scene</span>(shapes: <span class=\"fn\">list</span>[<span class=\"nm\">Drawable</span>]) <span class=\"op\">-&gt;</span> <span class=\"fn\">float</span>:\n    <span class=\"st\">\"\"\"Render all shapes and return total area. Works with any Drawable.\"\"\"</span>\n    total <span class=\"op\">=</span> <span class=\"nb\">0.0</span>\n    <span class=\"kw\">for</span> shape <span class=\"kw\">in</span> shapes:\n        <span class=\"fn\">print</span>(shape.<span class=\"fn\">draw</span>())   <span class=\"cm\"># we know draw() exists — Protocol guarantees it</span>\n        total <span class=\"op\">+=</span> shape.<span class=\"fn\">area</span>()\n    <span class=\"kw\">return</span> total\n\nscene <span class=\"op\">=</span> [<span class=\"fn\">Circle</span>(<span class=\"nb\">0</span>, <span class=\"nb\">0</span>, <span class=\"nb\">5</span>), <span class=\"fn\">Rectangle</span>(<span class=\"nb\">10</span>, <span class=\"nb\">20</span>, <span class=\"nb\">30</span>, <span class=\"nb\">40</span>), <span class=\"fn\">Circle</span>(<span class=\"nb\">50</span>, <span class=\"nb\">50</span>, <span class=\"nb\">3</span>)]\ntotal_area <span class=\"op\">=</span> <span class=\"fn\">render_scene</span>(scene)   <span class=\"cm\"># type checker is happy!</span>\n\n<span class=\"cm\"># runtime_checkable enables isinstance() with Protocol</span>\n<span class=\"fn\">print</span>(<span class=\"fn\">isinstance</span>(<span class=\"fn\">Circle</span>(<span class=\"nb\">0</span>,<span class=\"nb\">0</span>,<span class=\"nb\">1</span>), <span class=\"nm\">Drawable</span>))    <span class=\"cm\"># True</span>\n<span class=\"fn\">print</span>(<span class=\"fn\">isinstance</span>(<span class=\"st\">\"hello\"</span>,      <span class=\"nm\">Drawable</span>))     <span class=\"cm\"># False — str has no area()</span>\n\n<span class=\"cm\"># Protocol composition — build complex protocols from simpler ones</span>\n<span class=\"kw\">class</span> <span class=\"fn\">Persistable</span>(<span class=\"nm\">Protocol</span>):\n    <span class=\"kw\">def</span> <span class=\"fn\">save</span>(self) <span class=\"op\">-&gt;</span> <span class=\"kw\">None</span>: ...\n    <span class=\"kw\">def</span> <span class=\"fn\">load</span>(cls) <span class=\"op\">-&gt;</span> <span class=\"st\">\"Persistable\"</span>: ...\n\n<span class=\"kw\">class</span> <span class=\"fn\">DrawableAndPersistable</span>(<span class=\"nm\">Drawable</span>, <span class=\"nm\">Persistable</span>, <span class=\"nm\">Protocol</span>):\n    <span class=\"st\">\"\"\"An object that can both draw itself AND be saved/loaded.\"\"\"</span>\n    <span class=\"kw\">pass</span></code></pre><h2>Descriptors — The Mechanism Behind Properties</h2><p>Descriptors are objects that define how attribute access works on classes. When you access <code>obj.attr</code>, Python checks if <code>attr</code> in the class has <code>__get__</code>, <code>__set__</code>, or <code>__delete__</code> methods — if so, it calls those methods instead of returning the attribute directly. This is how <code>@property</code>, <code>@classmethod</code>, <code>@staticmethod</code>, and Django model fields all work.</p><h3>Understanding the Descriptor Protocol</h3><div class=\"cl\">python — descriptor protocol</div><pre><code><span class=\"cm\"># A descriptor is any class with __get__, __set__, or __delete__</span>\n<span class=\"cm\"># Non-data descriptor: only __get__ (e.g. methods, @staticmethod)</span>\n<span class=\"cm\"># Data descriptor: __get__ AND __set__ (e.g. @property)</span>\n\n<span class=\"kw\">class</span> <span class=\"nm\">ValidatedField</span>:\n    <span class=\"st\">\"\"\"\n    A reusable descriptor that validates attribute values.\n    Unlike @property, this can be REUSED across multiple classes\n    without repeating the validation logic.\n    \"\"\"</span>\n    <span class=\"kw\">def</span> <span class=\"fn\">__set_name__</span>(self, owner, name):\n        <span class=\"cm\"># Called when the descriptor is assigned to a class attribute.</span>\n        <span class=\"cm\"># owner = the class (e.g. Product), name = the attribute name (e.g. \"price\")</span>\n        self.public_name  <span class=\"op\">=</span> name\n        self.private_name <span class=\"op\">=</span> f<span class=\"st\">\"_{name}\"</span>   <span class=\"cm\"># store actual value in _price</span>\n    \n    <span class=\"kw\">def</span> <span class=\"fn\">__get__</span>(self, obj, objtype<span class=\"op\">=</span><span class=\"kw\">None</span>):\n        <span class=\"cm\"># Called when the attribute is READ: obj.price</span>\n        <span class=\"cm\"># obj = the instance, objtype = the class</span>\n        <span class=\"kw\">if</span> obj <span class=\"kw\">is</span> <span class=\"kw\">None</span>:\n            <span class=\"kw\">return</span> self   <span class=\"cm\"># accessed on class, not instance — return descriptor itself</span>\n        <span class=\"kw\">return</span> <span class=\"fn\">getattr</span>(obj, self.private_name, <span class=\"kw\">None</span>)\n    \n    <span class=\"kw\">def</span> <span class=\"fn\">__set__</span>(self, obj, value):\n        <span class=\"cm\"># Called when the attribute is WRITTEN: obj.price = 9.99</span>\n        self.<span class=\"fn\">validate</span>(value)   <span class=\"cm\"># validate before storing</span>\n        <span class=\"fn\">setattr</span>(obj, self.private_name, value)\n    \n    <span class=\"kw\">def</span> <span class=\"fn\">validate</span>(self, value):\n        <span class=\"kw\">pass</span>   <span class=\"cm\"># subclasses override this</span>\n\n<span class=\"kw\">class</span> <span class=\"fn\">PositiveFloat</span>(<span class=\"nm\">ValidatedField</span>):\n    <span class=\"st\">\"\"\"Descriptor that ensures a float is positive.\"\"\"</span>\n    <span class=\"kw\">def</span> <span class=\"fn\">validate</span>(self, value):\n        <span class=\"kw\">if</span> <span class=\"kw\">not</span> <span class=\"fn\">isinstance</span>(value, (<span class=\"fn\">int</span>, <span class=\"fn\">float</span>)):\n            <span class=\"kw\">raise</span> <span class=\"fn\">TypeError</span>(f<span class=\"st\">\"Expected a number, got {type(value).__name__}\"</span>)\n        <span class=\"kw\">if</span> value  — the descriptor itself\n<span class=\"fn\">print</span>(p.__dict__)                   <span class=\"cm\"># {'_name': 'Widget', '_price': 12.50, ...}</span></code></pre><div class=\"cal cal-info\"><span class=\"cal-title\">&#8505; Why Descriptors Matter</span><p>Django model fields (<code>CharField</code>, <code>IntegerField</code>) are descriptors. SQLAlchemy's <code>Column</code> is a descriptor. FastAPI's <code>Field</code> uses descriptor-like mechanisms. Understanding this lets you read framework source code confidently and build your own reusable attribute validation.</p></div>"},{"id":"py-10","track":"python","tl":"Python Core","title":"Pydantic, Logging & Configuration","sub":"Data validation with Pydantic v2, structured logging with structlog, and managing configuration with pydantic-settings.","content":"<h2>Pydantic v2 — Runtime Data Validation</h2><p>Pydantic is Python's most popular data validation library, used by FastAPI, SQLModel, and countless other frameworks. It converts raw data (dicts, JSON, form data) into typed Python objects, validates every field against your rules, and gives precise error messages when something is wrong.</p><p>The core insight: you define a data shape as a Python class with type annotations, and Pydantic handles everything else — coercion (converting '42' to 42), validation, serialisation, and JSON schema generation. It's not just type checking — it runs at runtime and actually rejects bad data.</p><h3>Basic Models and Field Validation</h3><div class=\"cl\">python — pydantic BaseModel</div><pre><code><span class=\"kw\">from</span> pydantic <span class=\"kw\">import</span> <span class=\"fn\">BaseModel</span>, <span class=\"fn\">Field</span>, <span class=\"nm\">EmailStr</span>, <span class=\"fn\">field_validator</span>, <span class=\"fn\">model_validator</span>\n<span class=\"kw\">from</span> pydantic <span class=\"kw\">import</span> <span class=\"fn\">ValidationError</span>, <span class=\"nm\">ConfigDict</span>\n<span class=\"kw\">from</span> typing <span class=\"kw\">import</span> <span class=\"fn\">Annotated</span>\n<span class=\"kw\">from</span> datetime <span class=\"kw\">import</span> datetime\n<span class=\"kw\">from</span> enum <span class=\"kw\">import</span> <span class=\"nm\">Enum</span>\n\n<span class=\"kw\">class</span> <span class=\"fn\">Role</span>(<span class=\"fn\">str</span>, <span class=\"nm\">Enum</span>):\n    <span class=\"nm\">USER</span>  <span class=\"op\">=</span> <span class=\"st\">\"user\"</span>\n    <span class=\"nm\">ADMIN</span> <span class=\"op\">=</span> <span class=\"st\">\"admin\"</span>\n    <span class=\"nm\">EDITOR</span> <span class=\"op\">=</span> <span class=\"st\">\"editor\"</span>\n\n<span class=\"kw\">class</span> <span class=\"fn\">UserCreate</span>(<span class=\"fn\">BaseModel</span>):\n    <span class=\"cm\"># model_config controls the model's behaviour</span>\n    model_config <span class=\"op\">=</span> <span class=\"fn\">ConfigDict</span>(\n        str_strip_whitespace<span class=\"op\">=</span><span class=\"kw\">True</span>,   <span class=\"cm\"># auto-strip whitespace from all strings</span>\n        validate_default<span class=\"op\">=</span><span class=\"kw\">True</span>,        <span class=\"cm\"># validate even fields with defaults</span>\n        extra<span class=\"op\">=</span><span class=\"st\">\"forbid\"</span>,               <span class=\"cm\"># raise error if unknown fields are sent</span>\n    )\n    \n    <span class=\"cm\"># Field(...) = required (no default)</span>\n    <span class=\"cm\"># Field(\"\") = optional with default</span>\n    <span class=\"cm\"># Metadata: description appears in OpenAPI docs, example in Swagger UI</span>\n    username: <span class=\"fn\">str</span> <span class=\"op\">=</span> <span class=\"fn\">Field</span>(\n        ...,\n        min_length<span class=\"op\">=</span><span class=\"nb\">3</span>, max_length<span class=\"op\">=</span><span class=\"nb\">30</span>,\n        pattern<span class=\"op\">=</span>r<span class=\"st\">\"^[a-zA-Z0-9_]+$\"</span>,    <span class=\"cm\"># only letters, numbers, underscore</span>\n        description<span class=\"op\">=</span><span class=\"st\">\"Unique username\"</span>,\n        examples<span class=\"op\">=</span>[<span class=\"st\">\"alice_99\"</span>, <span class=\"st\">\"bob_dev\"</span>],\n    )\n    email: <span class=\"nm\">EmailStr</span>   <span class=\"cm\"># validates email format (requires pydantic[email])</span>\n    password: <span class=\"fn\">str</span> <span class=\"op\">=</span> <span class=\"fn\">Field</span>(..., min_length<span class=\"op\">=</span><span class=\"nb\">8</span>)\n    age: <span class=\"fn\">int</span>   <span class=\"op\">=</span> <span class=\"fn\">Field</span>(ge<span class=\"op\">=</span><span class=\"nb\">18</span>, le<span class=\"op\">=</span><span class=\"nb\">120</span>)   <span class=\"cm\"># ge=&gt;=, le=, lt=&lt;</span>\n    role: <span class=\"nm\">Role</span> <span class=\"op\">=</span> <span class=\"fn\">Field</span>(default<span class=\"op\">=</span><span class=\"nm\">Role</span>.<span class=\"nm\">USER</span>)\n    bio: <span class=\"fn\">str</span>   <span class=\"op\">=</span> <span class=\"fn\">Field</span>(default<span class=\"op\">=</span><span class=\"st\">\"\"</span>, max_length<span class=\"op\">=</span><span class=\"nb\">500</span>)\n    created_at: datetime <span class=\"op\">=</span> <span class=\"fn\">Field</span>(default_factory<span class=\"op\">=</span>datetime.utcnow)\n    tags: <span class=\"fn\">list</span>[<span class=\"fn\">str</span>] <span class=\"op\">=</span> <span class=\"fn\">Field</span>(default_factory<span class=\"op\">=</span><span class=\"fn\">list</span>)</code></pre><div class=\"cl\">python — field validators</div><pre><code>    <span class=\"cm\"># @field_validator — runs after type coercion for a specific field</span>\n    <span class=\"dc\">@field_validator</span>(<span class=\"st\">\"username\"</span>)\n    <span class=\"dc\">@classmethod</span>\n    <span class=\"kw\">def</span> <span class=\"fn\">username_not_reserved</span>(cls, v: <span class=\"fn\">str</span>) <span class=\"op\">-&gt;</span> <span class=\"fn\">str</span>:\n        <span class=\"cm\"># v is already type-checked and stripped (due to str_strip_whitespace)</span>\n        reserved <span class=\"op\">=</span> {<span class=\"st\">\"admin\"</span>, <span class=\"st\">\"root\"</span>, <span class=\"st\">\"system\"</span>, <span class=\"st\">\"api\"</span>, <span class=\"st\">\"null\"</span>}\n        <span class=\"kw\">if</span> v.<span class=\"fn\">lower</span>() <span class=\"kw\">in</span> reserved:\n            <span class=\"kw\">raise</span> <span class=\"fn\">ValueError</span>(f<span class=\"st\">\"Username '{v}' is reserved\"</span>)\n        <span class=\"kw\">return</span> v.<span class=\"fn\">lower</span>()   <span class=\"cm\"># normalise to lowercase</span>\n    \n    <span class=\"dc\">@field_validator</span>(<span class=\"st\">\"password\"</span>)\n    <span class=\"dc\">@classmethod</span>\n    <span class=\"kw\">def</span> <span class=\"fn\">password_strength</span>(cls, v: <span class=\"fn\">str</span>) <span class=\"op\">-&gt;</span> <span class=\"fn\">str</span>:\n        <span class=\"kw\">if</span> <span class=\"kw\">not</span> <span class=\"fn\">any</span>(c.<span class=\"fn\">isdigit</span>() <span class=\"kw\">for</span> c <span class=\"kw\">in</span> v):\n            <span class=\"kw\">raise</span> <span class=\"fn\">ValueError</span>(<span class=\"st\">\"Password must contain at least one digit\"</span>)\n        <span class=\"kw\">if</span> <span class=\"kw\">not</span> <span class=\"fn\">any</span>(c.<span class=\"fn\">isupper</span>() <span class=\"kw\">for</span> c <span class=\"kw\">in</span> v):\n            <span class=\"kw\">raise</span> <span class=\"fn\">ValueError</span>(<span class=\"st\">\"Password must contain at least one uppercase letter\"</span>)\n        <span class=\"kw\">return</span> v\n    \n    <span class=\"cm\"># @model_validator runs after ALL field validators — has access to all fields</span>\n    <span class=\"dc\">@model_validator</span>(mode<span class=\"op\">=</span><span class=\"st\">\"after\"</span>)   <span class=\"cm\"># mode=\"after\" = receives a validated model instance</span>\n    <span class=\"kw\">def</span> <span class=\"fn\">check_admin_requirements</span>(self) <span class=\"op\">-&gt;</span> <span class=\"st\">\"UserCreate\"</span>:\n        <span class=\"cm\"># Admins must provide a bio</span>\n        <span class=\"kw\">if</span> self.role <span class=\"op\">==</span> <span class=\"nm\">Role</span>.<span class=\"nm\">ADMIN</span> <span class=\"kw\">and</span> <span class=\"kw\">not</span> self.bio:\n            <span class=\"kw\">raise</span> <span class=\"fn\">ValueError</span>(<span class=\"st\">\"Admin users must provide a bio\"</span>)\n        <span class=\"kw\">return</span> self</code></pre><div class=\"cl\">python — using the model</div><pre><code><span class=\"cm\"># Pydantic coerces types when possible</span>\nuser <span class=\"op\">=</span> <span class=\"fn\">UserCreate</span>(\n    username<span class=\"op\">=</span><span class=\"st\">\"  Alice_Dev  \"</span>,   <span class=\"cm\"># stripped to \"Alice_Dev\", lowercased to \"alice_dev\"</span>\n    email<span class=\"op\">=</span><span class=\"st\">\"alice@example.com\"</span>,\n    password<span class=\"op\">=</span><span class=\"st\">\"SecurePass99\"</span>,\n    age<span class=\"op\">=</span><span class=\"st\">\"30\"</span>,                    <span class=\"cm\"># \"30\" is coerced to int 30!</span>\n    tags<span class=\"op\">=</span>[<span class=\"st\">\"python\"</span>, <span class=\"st\">\"django\"</span>],\n)\n<span class=\"fn\">print</span>(user.username)    <span class=\"cm\"># \"alice_dev\"</span>\n<span class=\"fn\">print</span>(user.role)        <span class=\"cm\"># Role.USER (default)</span>\n\n<span class=\"cm\"># Validation errors are structured and precise</span>\n<span class=\"kw\">try</span>:\n    <span class=\"fn\">UserCreate</span>(\n        username<span class=\"op\">=</span><span class=\"st\">\"a\"</span>,             <span class=\"cm\"># too short</span>\n        email<span class=\"op\">=</span><span class=\"st\">\"not-an-email\"</span>,     <span class=\"cm\"># invalid format</span>\n        password<span class=\"op\">=</span><span class=\"st\">\"weak\"</span>,          <span class=\"cm\"># no digit, no uppercase</span>\n        age<span class=\"op\">=</span><span class=\"nb\">15</span>,                   <span class=\"cm\"># under 18</span>\n    )\n<span class=\"kw\">except</span> <span class=\"fn\">ValidationError</span> <span class=\"kw\">as</span> e:\n    <span class=\"fn\">print</span>(f<span class=\"st\">\"{e.error_count()} validation errors\"</span>)\n    <span class=\"kw\">for</span> error <span class=\"kw\">in</span> e.<span class=\"fn\">errors</span>():\n        <span class=\"fn\">print</span>(f<span class=\"st\">\"  Field: {error['loc']}  Error: {error['msg']}\"</span>)\n<span class=\"cm\"># 4 validation errors</span>\n<span class=\"cm\">#   Field: ('username',)  Error: String should have at least 3 characters</span>\n<span class=\"cm\">#   Field: ('email',)    Error: value is not a valid email address</span>\n<span class=\"cm\">#   Field: ('password',) Error: Password must contain at least one digit</span>\n<span class=\"cm\">#   Field: ('age',)      Error: Input should be greater than or equal to 18</span>\n\n<span class=\"cm\"># Serialisation</span>\n<span class=\"fn\">print</span>(user.<span class=\"fn\">model_dump</span>())               <span class=\"cm\"># Python dict (excludes unset by default)</span>\n<span class=\"fn\">print</span>(user.<span class=\"fn\">model_dump</span>(exclude<span class=\"op\">=</span>{<span class=\"st\">\"password\"</span>}))  <span class=\"cm\"># exclude sensitive fields</span>\n<span class=\"fn\">print</span>(user.<span class=\"fn\">model_dump_json</span>())          <span class=\"cm\"># JSON string</span>\n<span class=\"fn\">print</span>(user.<span class=\"fn\">model_json_schema</span>())        <span class=\"cm\"># JSON Schema for OpenAPI docs</span></code></pre><h3>Nested Models and ORM Mode</h3><div class=\"cl\">python — nested models and from_attributes</div><pre><code><span class=\"kw\">class</span> <span class=\"fn\">Address</span>(<span class=\"fn\">BaseModel</span>):\n    street: <span class=\"fn\">str</span>\n    city:   <span class=\"fn\">str</span>\n    country: <span class=\"fn\">str</span> <span class=\"op\">=</span> <span class=\"st\">\"KE\"</span>   <span class=\"cm\"># default to Kenya</span>\n\n<span class=\"kw\">class</span> <span class=\"fn\">UserResponse</span>(<span class=\"fn\">BaseModel</span>):\n    <span class=\"st\">\"\"\"The model we return from the API — excludes password.\n    model_config with from_attributes=True lets Pydantic read\n    attributes from SQLAlchemy ORM objects, not just dicts.\n    \"\"\"</span>\n    model_config <span class=\"op\">=</span> <span class=\"fn\">ConfigDict</span>(from_attributes<span class=\"op\">=</span><span class=\"kw\">True</span>)\n    \n    <span class=\"fn\">id</span>:         <span class=\"fn\">int</span>\n    username:   <span class=\"fn\">str</span>\n    email:      <span class=\"fn\">str</span>\n    role:       <span class=\"nm\">Role</span>\n    address:    <span class=\"nm\">Address</span> <span class=\"op\">|</span> <span class=\"kw\">None</span> <span class=\"op\">=</span> <span class=\"kw\">None</span>   <span class=\"cm\"># nested model — None if not provided</span>\n    created_at: datetime\n\n<span class=\"cm\"># Create from dict (normal usage)</span>\nresponse <span class=\"op\">=</span> <span class=\"fn\">UserResponse</span>(\n    <span class=\"fn\">id</span><span class=\"op\">=</span><span class=\"nb\">1</span>, username<span class=\"op\">=</span><span class=\"st\">\"alice\"</span>, email<span class=\"op\">=</span><span class=\"st\">\"a@b.com\"</span>,\n    role<span class=\"op\">=</span><span class=\"nm\">Role</span>.<span class=\"nm\">USER</span>, created_at<span class=\"op\">=</span>datetime.<span class=\"fn\">utcnow</span>()\n)\n\n<span class=\"cm\"># Create from SQLAlchemy ORM object (from_attributes=True enables this)</span>\n<span class=\"cm\"># db_user = session.get(User, 1)</span>\n<span class=\"cm\"># response = UserResponse.model_validate(db_user)   # reads attributes directly</span></code></pre><h2>pydantic-settings — Type-Safe Configuration</h2><p>Configuration from environment variables is the industry standard (12-factor app). <code>pydantic-settings</code> reads environment variables and <code>.env</code> files and validates them with the same Pydantic machinery — you get type coercion, validation, and IDE autocompletion on your settings.</p><div class=\"cl\">python — pydantic-settings</div><pre><code><span class=\"kw\">from</span> pydantic_settings <span class=\"kw\">import</span> <span class=\"nm\">BaseSettings</span>, <span class=\"nm\">SettingsConfigDict</span>\n<span class=\"kw\">from</span> pydantic <span class=\"kw\">import</span> <span class=\"nm\">PostgresDsn</span>, <span class=\"nm\">RedisDsn</span>, <span class=\"nm\">AnyHttpUrl</span>\n<span class=\"kw\">from</span> functools <span class=\"kw\">import</span> <span class=\"fn\">lru_cache</span>\n\n<span class=\"kw\">class</span> <span class=\"fn\">Settings</span>(<span class=\"nm\">BaseSettings</span>):\n    model_config <span class=\"op\">=</span> <span class=\"fn\">SettingsConfigDict</span>(\n        env_file<span class=\"op\">=</span><span class=\"st\">\".env\"</span>,              <span class=\"cm\"># load from .env file</span>\n        env_file_encoding<span class=\"op\">=</span><span class=\"st\">\"utf-8\"</span>,\n        case_sensitive<span class=\"op\">=</span><span class=\"kw\">False</span>,         <span class=\"cm\"># DATABASE_URL == database_url</span>\n        extra<span class=\"op\">=</span><span class=\"st\">\"ignore\"</span>,               <span class=\"cm\"># silently ignore unknown env vars</span>\n    )\n    \n    <span class=\"cm\"># App settings — these come from environment variables</span>\n    app_name:    <span class=\"fn\">str</span>     <span class=\"op\">=</span> <span class=\"st\">\"My App\"</span>\n    app_version: <span class=\"fn\">str</span>     <span class=\"op\">=</span> <span class=\"st\">\"1.0.0\"</span>\n    debug:       <span class=\"fn\">bool</span>    <span class=\"op\">=</span> <span class=\"kw\">False</span>      <span class=\"cm\"># \"True\", \"true\", \"1\" all work</span>\n    secret_key:  <span class=\"fn\">str</span>                  <span class=\"cm\"># REQUIRED — no default = crashes if missing</span>\n    \n    <span class=\"cm\"># Type-validated URLs — pydantic checks these are valid connection strings</span>\n    database_url: <span class=\"nm\">PostgresDsn</span>\n    redis_url:    <span class=\"nm\">RedisDsn</span>    <span class=\"op\">=</span> <span class=\"st\">\"redis://localhost:6379/0\"</span>\n    \n    <span class=\"cm\"># Numeric settings</span>\n    workers:       <span class=\"fn\">int</span>   <span class=\"op\">=</span> <span class=\"nb\">4</span>\n    max_conn:      <span class=\"fn\">int</span>   <span class=\"op\">=</span> <span class=\"nb\">100</span>\n    request_timeout: <span class=\"fn\">float</span> <span class=\"op\">=</span> <span class=\"nb\">30.0</span>\n    \n    <span class=\"cm\"># Nested settings — CORS_ORIGINS=\"http://a.com,http://b.com\" parsed as list</span>\n    cors_origins: <span class=\"fn\">list</span>[<span class=\"nm\">AnyHttpUrl</span>] <span class=\"op\">=</span> []\n\n<span class=\"dc\">@lru_cache</span>   <span class=\"cm\"># create Settings once, reuse everywhere</span>\n<span class=\"kw\">def</span> <span class=\"fn\">get_settings</span>() <span class=\"op\">-&gt;</span> <span class=\"nm\">Settings</span>:\n    <span class=\"st\">\"\"\"Return cached settings. Re-reads from env only once per process.\"\"\"</span>\n    <span class=\"kw\">return</span> <span class=\"fn\">Settings</span>()\n\n<span class=\"cm\"># Usage throughout your application</span>\nsettings <span class=\"op\">=</span> <span class=\"fn\">get_settings</span>()\n<span class=\"fn\">print</span>(settings.debug)         <span class=\"cm\"># False (from env or default)</span>\n<span class=\"fn\">print</span>(settings.database_url)  <span class=\"cm\"># postgresql://user:pass@host:5432/db</span>\n\n<span class=\"cm\"># In tests, override settings without touching environment:</span>\n<span class=\"kw\">from</span> unittest.mock <span class=\"kw\">import</span> patch\n<span class=\"kw\">with</span> patch.<span class=\"fn\">dict</span>(<span class=\"st\">\"os.environ\"</span>, {<span class=\"st\">\"DEBUG\"</span>: <span class=\"st\">\"true\"</span>, <span class=\"st\">\"SECRET_KEY\"</span>: <span class=\"st\">\"test-key\"</span>}):\n    test_settings <span class=\"op\">=</span> <span class=\"fn\">Settings</span>()  <span class=\"cm\"># re-parse with patched env</span>\n    <span class=\"kw\">assert</span> test_settings.debug <span class=\"op\">==</span> <span class=\"kw\">True</span></code></pre><h2>Structured Logging with structlog</h2><p>The standard <code>logging</code> module produces text logs. Structured logging produces machine-readable logs — usually JSON — where every field (timestamp, level, user_id, request_id) is a discrete key-value pair. This is essential for log aggregation systems like Datadog, CloudWatch, and ELK.</p><div class=\"cl\">bash</div><pre><code><span class=\"fn\">pip</span> install structlog</code></pre><div class=\"cl\">python — structlog setup and usage</div><pre><code><span class=\"kw\">import</span> structlog\n<span class=\"kw\">import</span> logging\n\n<span class=\"cm\"># Configure structlog ONCE at application startup</span>\n<span class=\"kw\">def</span> <span class=\"fn\">configure_logging</span>(debug: <span class=\"fn\">bool</span> <span class=\"op\">=</span> <span class=\"kw\">False</span>):\n    shared_processors <span class=\"op\">=</span> [\n        <span class=\"cm\"># Add log level to every event</span>\n        structlog.stdlib.add_log_level,\n        <span class=\"cm\"># Add ISO timestamp to every event</span>\n        structlog.processors.<span class=\"fn\">TimeStamper</span>(fmt<span class=\"op\">=</span><span class=\"st\">\"iso\"</span>),\n        <span class=\"cm\"># Include caller information (file, line number)</span>\n        structlog.processors.<span class=\"fn\">CallsiteParameterAdder</span>(\n            [structlog.processors.<span class=\"nm\">CallsiteParameter</span>.<span class=\"nm\">FILENAME</span>,\n             structlog.processors.<span class=\"nm\">CallsiteParameter</span>.<span class=\"nm\">LINENO</span>]\n        ),\n    ]\n    \n    structlog.<span class=\"fn\">configure</span>(\n        processors<span class=\"op\">=</span>[\n            <span class=\"op\">*</span>shared_processors,\n            <span class=\"cm\"># Dev: colourful, human-readable output</span>\n            structlog.dev.<span class=\"fn\">ConsoleRenderer</span>() <span class=\"kw\">if</span> debug <span class=\"kw\">else</span>\n            <span class=\"cm\"># Prod: JSON output for log aggregators</span>\n            structlog.processors.<span class=\"fn\">JSONRenderer</span>()\n        ],\n        wrapper_class<span class=\"op\">=</span>structlog.stdlib.<span class=\"nm\">BoundLogger</span>,\n        context_class<span class=\"op\">=</span><span class=\"fn\">dict</span>,\n        logger_factory<span class=\"op\">=</span>structlog.<span class=\"fn\">PrintLoggerFactory</span>(),\n    )\n\n<span class=\"fn\">configure_logging</span>(debug<span class=\"op\">=</span><span class=\"kw\">True</span>)\n\n<span class=\"cm\"># Get a logger — bind persistent context fields</span>\nlog <span class=\"op\">=</span> structlog.<span class=\"fn\">get_logger</span>()\n\n<span class=\"cm\"># Log a simple event</span>\nlog.<span class=\"fn\">info</span>(<span class=\"st\">\"server_started\"</span>, host<span class=\"op\">=</span><span class=\"st\">\"0.0.0.0\"</span>, port<span class=\"op\">=</span><span class=\"nb\">8000</span>)\n<span class=\"cm\"># Output: 2024-01-15T10:23:45Z [info] server_started host=0.0.0.0 port=8000</span>\n\n<span class=\"cm\"># Bind context that carries through ALL subsequent log calls</span>\n<span class=\"cm\"># Perfect for request-level context (user_id, request_id)</span>\nrequest_log <span class=\"op\">=</span> log.<span class=\"fn\">bind</span>(\n    user_id<span class=\"op\">=</span><span class=\"nb\">42</span>,\n    request_id<span class=\"op\">=</span><span class=\"st\">\"req-abc123\"</span>,\n    endpoint<span class=\"op\">=</span><span class=\"st\">\"/api/posts\"</span>\n)\n\nrequest_log.<span class=\"fn\">info</span>(<span class=\"st\">\"request_received\"</span>, method<span class=\"op\">=</span><span class=\"st\">\"POST\"</span>)\nrequest_log.<span class=\"fn\">info</span>(<span class=\"st\">\"db_query_executed\"</span>, table<span class=\"op\">=</span><span class=\"st\">\"posts\"</span>, duration_ms<span class=\"op\">=</span><span class=\"nb\">12</span>)\nrequest_log.<span class=\"fn\">warning</span>(<span class=\"st\">\"rate_limit_approaching\"</span>, remaining<span class=\"op\">=</span><span class=\"nb\">5</span>)\nrequest_log.<span class=\"fn\">error</span>(<span class=\"st\">\"db_connection_failed\"</span>, host<span class=\"op\">=</span><span class=\"st\">\"pg-01\"</span>, port<span class=\"op\">=</span><span class=\"nb\">5432</span>)\n\n<span class=\"cm\"># All log lines automatically include user_id and request_id</span>\n<span class=\"cm\"># Output (JSON mode):</span>\n<span class=\"cm\"># {\"event\":\"request_received\",\"level\":\"info\",\"user_id\":42,\"request_id\":\"req-abc123\",\"method\":\"POST\",\"timestamp\":\"...\"}</span>\n<span class=\"cm\"># {\"event\":\"db_query_executed\",\"level\":\"info\",\"user_id\":42,\"request_id\":\"req-abc123\",\"table\":\"posts\",\"duration_ms\":12,...}</span>\n\n<span class=\"cm\"># Unbind specific context fields</span>\nnew_log <span class=\"op\">=</span> request_log.<span class=\"fn\">unbind</span>(<span class=\"st\">\"endpoint\"</span>)\n\n<span class=\"cm\"># Exception logging — automatically includes traceback</span>\n<span class=\"kw\">try</span>:\n    result <span class=\"op\">=</span> <span class=\"nb\">1</span> <span class=\"op\">/</span> <span class=\"nb\">0</span>\n<span class=\"kw\">except</span> <span class=\"nm\">ZeroDivisionError</span>:\n    log.<span class=\"fn\">exception</span>(<span class=\"st\">\"calculation_failed\"</span>, operation<span class=\"op\">=</span><span class=\"st\">\"divide\"</span>)   <span class=\"cm\"># includes full traceback</span></code></pre><div class=\"cal cal-tip\"><span class=\"cal-title\">&#10003; Structured Logging in Production</span><p>Switch to JSON renderer in production with <code>configure_logging(debug=False)</code>. Your log aggregation platform (Datadog, ELK, CloudWatch) parses JSON logs and lets you filter, alert on, and visualise any field — user_id, response time, error type — with zero parsing regex.</p></div>"},{"id":"fl-01","track":"flask","tl":"Flask","title":"Flask: Getting Started","sub":"Flask philosophy, installation, app factory pattern, config management, and first REST endpoints.","content":"<h2>What is Flask?</h2><p>Flask is a <em>micro-framework</em> for Python web development. Micro doesn't mean small or limited — it means Flask gives you the essentials (routing, request handling, templating) and lets you choose everything else. There's no built-in ORM, no admin panel, no authentication — you pick the best tool for each job.</p><p>This philosophy makes Flask ideal for REST APIs, microservices, and applications where you want full control. Companies like LinkedIn, Pinterest, and Lyft have used Flask in production. It's also the most popular Python framework for learning web development because the concepts are explicit — nothing is hidden.</p><h2>Flask vs Django</h2><div class=\"tw\"><table><tr><th>Aspect</th><th>Flask</th><th>Django</th></tr><tr><td>Philosophy</td><td>Micro — bring your own components</td><td>Batteries included — everything built in</td></tr><tr><td>Learning curve</td><td>Gentle — concepts are explicit</td><td>Steeper — many conventions to learn</td></tr><tr><td>Best for</td><td>APIs, microservices, custom stacks</td><td>Full-stack apps, content sites, admin tools</td></tr><tr><td>ORM</td><td>You choose (SQLAlchemy, etc.)</td><td>Django ORM built in</td></tr><tr><td>Admin</td><td>Not included</td><td>Powerful auto-generated admin</td></tr><tr><td>Flexibility</td><td>Maximum — nothing forced on you</td><td>Less — follows Django's way</td></tr></table></div><h2>Installation and First App</h2><p>Install Flask and its ecosystem into a virtual environment. For production work, you'll want these packages from the start:</p><div class=\"cl\">bash</div><pre><code><span class=\"fn\">mkdir</span> flask-blog &amp;&amp; <span class=\"fn\">cd</span> flask-blog\n<span class=\"fn\">python</span> -m venv .venv &amp;&amp; <span class=\"fn\">source</span> .venv/bin/activate\n<span class=\"fn\">pip</span> install <span class=\"fn\">flask</span> flask-sqlalchemy flask-migrate flask-jwt-extended \\\n            marshmallow flask-cors python-dotenv redis <span class=\"fn\">celery</span></code></pre><p>Here's the simplest possible Flask app. Even this tiny example teaches you three important concepts: how Flask represents an application (the <code>Flask</code> class), how routes map URLs to functions (the <code>@app.route</code> decorator), and how Flask serves JSON responses.</p><div class=\"cl\">python — minimal app</div><pre><code><span class=\"kw\">from</span> flask <span class=\"kw\">import</span> <span class=\"nm\">Flask</span>, jsonify\n\napp <span class=\"op\">=</span> <span class=\"fn\">Flask</span>(__name__)  <span class=\"cm\"># __name__ tells Flask where to find templates and static files</span>\n\n<span class=\"dc\">@app.route</span>(<span class=\"st\">\"/\"</span>)\n<span class=\"kw\">def</span> <span class=\"fn\">index</span>():\n    <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>({<span class=\"st\">\"message\"</span>: <span class=\"st\">\"Hello, Flask!\"</span>, <span class=\"st\">\"version\"</span>: <span class=\"st\">\"1.0\"</span>})\n\n<span class=\"dc\">@app.route</span>(<span class=\"st\">\"/health\"</span>)\n<span class=\"kw\">def</span> <span class=\"fn\">health</span>():\n    <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>({<span class=\"st\">\"status\"</span>: <span class=\"st\">\"ok\"</span>})\n\n<span class=\"kw\">if</span> __name__ <span class=\"op\">==</span> <span class=\"st\">\"__main__\"</span>:\n    app.<span class=\"fn\">run</span>(debug<span class=\"op\">=</span><span class=\"kw\">True</span>)  <span class=\"cm\"># debug=True: auto-reload on changes, detailed error pages</span></code></pre><div class=\"cl\">bash — run and test</div><pre><code><span class=\"fn\">flask</span> --app app run --debug\n<span class=\"cm\"># or: python app.py</span>\n\n<span class=\"cm\"># In another terminal:</span>\n<span class=\"fn\">curl</span> http://127.0.0.1:5000/\n<span class=\"cm\"># {\"message\": \"Hello, Flask!\", \"version\": \"1.0\"}</span></code></pre><h2>The Application Factory Pattern</h2><p>For any real project, you should use the <em>application factory</em> pattern instead of creating the Flask app at module level. The factory is a function that creates and configures the app. This enables three critical things:</p><ul><li><strong>Multiple configurations</strong> — development, testing, and production apps with different settings</li><li><strong>Testing</strong> — create a fresh app instance for each test with a clean database</li><li><strong>Circular import prevention</strong> — extensions are initialised after imports are resolved</li></ul><div class=\"cl\">text — recommended project structure</div><pre><code>flask-blog/\n├── app/\n│   ├── __init__.py        ← application factory\n│   ├── config.py          ← configuration classes\n│   ├── extensions.py      ← db, jwt, cors, cache\n│   ├── models/\n│   │   ├── user.py\n│   │   └── post.py\n│   ├── routes/\n│   │   ├── auth.py        ← /api/auth blueprint\n│   │   └── posts.py       ← /api/posts blueprint\n│   └── schemas/\n│       └── post_schema.py ← marshmallow schemas\n├── migrations/            ← auto-generated by Flask-Migrate\n├── tests/\n│   └── conftest.py\n├── .env                   ← secret keys (never commit!)\n├── requirements.txt\n└── wsgi.py                ← production entry point</code></pre><div class=\"cl\">python — app/__init__.py (factory)</div><pre><code><span class=\"kw\">from</span> flask <span class=\"kw\">import</span> <span class=\"nm\">Flask</span>\n<span class=\"kw\">from</span> .config <span class=\"kw\">import</span> config_by_name\n<span class=\"kw\">from</span> .extensions <span class=\"kw\">import</span> db, migrate, jwt, cors\n\n<span class=\"kw\">def</span> <span class=\"fn\">create_app</span>(config_name: <span class=\"fn\">str</span> <span class=\"op\">=</span> <span class=\"st\">\"development\"</span>) <span class=\"op\">-&gt;</span> <span class=\"nm\">Flask</span>:\n    <span class=\"st\">\"\"\"Application factory — create and configure a Flask app instance.\"\"\"</span>\n    app <span class=\"op\">=</span> <span class=\"fn\">Flask</span>(__name__)\n    app.config.<span class=\"fn\">from_object</span>(config_by_name[config_name])\n    \n    <span class=\"cm\"># Initialise extensions — binds each to this specific app instance</span>\n    db.<span class=\"fn\">init_app</span>(app)\n    migrate.<span class=\"fn\">init_app</span>(app, db)\n    jwt.<span class=\"fn\">init_app</span>(app)\n    cors.<span class=\"fn\">init_app</span>(app, resources<span class=\"op\">=</span>{<span class=\"st\">\"/api/*\"</span>: {<span class=\"st\">\"origins\"</span>: <span class=\"st\">\"*\"</span>}})\n    \n    <span class=\"cm\"># Register blueprints — modular route collections</span>\n    <span class=\"kw\">from</span> .routes.auth  <span class=\"kw\">import</span> auth_bp\n    <span class=\"kw\">from</span> .routes.posts <span class=\"kw\">import</span> posts_bp\n    app.<span class=\"fn\">register_blueprint</span>(auth_bp,  url_prefix<span class=\"op\">=</span><span class=\"st\">\"/api/auth\"</span>)\n    app.<span class=\"fn\">register_blueprint</span>(posts_bp, url_prefix<span class=\"op\">=</span><span class=\"st\">\"/api/posts\"</span>)\n    \n    <span class=\"kw\">return</span> app</code></pre><div class=\"cl\">python — app/config.py</div><pre><code><span class=\"kw\">import</span> os\n<span class=\"kw\">from</span> dotenv <span class=\"kw\">import</span> load_dotenv\n<span class=\"fn\">load_dotenv</span>()  <span class=\"cm\"># read .env file into environment variables</span>\n\n<span class=\"kw\">class</span> <span class=\"nm\">BaseConfig</span>:\n    <span class=\"st\">\"\"\"Settings shared across all environments.\"\"\"</span>\n    <span class=\"nm\">SECRET_KEY</span> <span class=\"op\">=</span> os.<span class=\"fn\">getenv</span>(<span class=\"st\">\"SECRET_KEY\"</span>, <span class=\"st\">\"dev-secret-change-in-production\"</span>)\n    <span class=\"nm\">SQLALCHEMY_TRACK_MODIFICATIONS</span> <span class=\"op\">=</span> <span class=\"kw\">False</span>\n    <span class=\"nm\">JWT_ACCESS_TOKEN_EXPIRES</span>  <span class=\"op\">=</span> <span class=\"nb\">3600</span>    <span class=\"cm\"># 1 hour</span>\n    <span class=\"nm\">JWT_REFRESH_TOKEN_EXPIRES</span> <span class=\"op\">=</span> <span class=\"nb\">86400</span>   <span class=\"cm\"># 24 hours</span>\n\n<span class=\"kw\">class</span> <span class=\"fn\">DevelopmentConfig</span>(<span class=\"nm\">BaseConfig</span>):\n    <span class=\"nm\">DEBUG</span> <span class=\"op\">=</span> <span class=\"kw\">True</span>\n    <span class=\"nm\">SQLALCHEMY_DATABASE_URI</span> <span class=\"op\">=</span> os.<span class=\"fn\">getenv</span>(<span class=\"st\">\"DEV_DB_URL\"</span>, <span class=\"st\">\"sqlite:///dev.db\"</span>)\n\n<span class=\"kw\">class</span> <span class=\"fn\">TestingConfig</span>(<span class=\"nm\">BaseConfig</span>):\n    <span class=\"nm\">TESTING</span> <span class=\"op\">=</span> <span class=\"kw\">True</span>\n    <span class=\"nm\">SQLALCHEMY_DATABASE_URI</span> <span class=\"op\">=</span> <span class=\"st\">\"sqlite:///:memory:\"</span>  <span class=\"cm\"># in-memory, resets per test</span>\n\n<span class=\"kw\">class</span> <span class=\"fn\">ProductionConfig</span>(<span class=\"nm\">BaseConfig</span>):\n    <span class=\"nm\">DEBUG</span> <span class=\"op\">=</span> <span class=\"kw\">False</span>\n    <span class=\"nm\">SQLALCHEMY_DATABASE_URI</span> <span class=\"op\">=</span> os.<span class=\"fn\">getenv</span>(<span class=\"st\">\"DATABASE_URL\"</span>)  <span class=\"cm\"># required — crash if missing</span>\n    <span class=\"cm\"># In production, also set: SENTRY_DSN, AWS credentials, etc.</span>\n\nconfig_by_name <span class=\"op\">=</span> {\n    <span class=\"st\">\"development\"</span>: <span class=\"nm\">DevelopmentConfig</span>,\n    <span class=\"st\">\"testing\"</span>:     <span class=\"nm\">TestingConfig</span>,\n    <span class=\"st\">\"production\"</span>:  <span class=\"nm\">ProductionConfig</span>,\n}</code></pre><div class=\"cl\">python — wsgi.py (production entry point)</div><pre><code><span class=\"kw\">from</span> app <span class=\"kw\">import</span> create_app\n\napp <span class=\"op\">=</span> <span class=\"fn\">create_app</span>(<span class=\"st\">\"production\"</span>)\n\n<span class=\"kw\">if</span> __name__ <span class=\"op\">==</span> <span class=\"st\">\"__main__\"</span>:\n    app.<span class=\"fn\">run</span>()</code></pre><div class=\"cal cal-tip\"><span class=\"cal-title\">&#10003; Environment Variables and .env</span><p>Never hardcode secrets in your code. Use environment variables. In development, a <code>.env</code> file with <code>python-dotenv</code> is convenient. In production, use your platform's secret management (AWS Secrets Manager, Railway variables, etc.). Always add <code>.env</code> to <code>.gitignore</code>.</p></div>"},{"id":"fl-02","track":"flask","tl":"Flask","title":"Routing, Blueprints &amp; Error Handlers","sub":"URL rules, HTTP methods, request/response objects, Blueprints for modular apps.","content":"<h2>URL Routing</h2><p>Flask's routing system maps URLs to Python functions. The <code>@app.route()</code> decorator (or <code>@blueprint.route()</code>) registers the function as a handler for that URL. Flask supports URL variables with type converters, multiple HTTP methods on a single route, and flexible URL matching.</p><div class=\"cl\">python — routing fundamentals</div><pre><code><span class=\"kw\">from</span> flask <span class=\"kw\">import</span> <span class=\"nm\">Flask</span>, request, jsonify, abort, url_for\n\napp <span class=\"op\">=</span> <span class=\"fn\">Flask</span>(__name__)\n\n<span class=\"cm\"># Basic route — responds to GET by default</span>\n<span class=\"dc\">@app.route</span>(<span class=\"st\">\"/\"</span>)\n<span class=\"kw\">def</span> <span class=\"fn\">index</span>():\n    <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>({<span class=\"st\">\"message\"</span>: <span class=\"st\">\"API root\"</span>})\n\n<span class=\"cm\"># URL variable — captured and passed as a function argument</span>\n<span class=\"dc\">@app.route</span>(<span class=\"st\">\"/users/\"</span>)\n<span class=\"kw\">def</span> <span class=\"fn\">get_user</span>(user_id: <span class=\"fn\">int</span>):\n    <span class=\"cm\"># Type converter 'int' validates and converts automatically</span>\n    <span class=\"cm\"># Other converters: string (default), float, path, uuid</span>\n    <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>({<span class=\"st\">\"id\"</span>: user_id})\n\n<span class=\"cm\"># Catching anything including slashes</span>\n<span class=\"dc\">@app.route</span>(<span class=\"st\">\"/files/\"</span>)\n<span class=\"kw\">def</span> <span class=\"fn\">serve_file</span>(filepath: <span class=\"fn\">str</span>):\n    <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>({<span class=\"st\">\"path\"</span>: filepath})   <span class=\"cm\"># e.g. /files/docs/api/v1.md</span>\n\n<span class=\"cm\"># Multiple HTTP methods on one route</span>\n<span class=\"dc\">@app.route</span>(<span class=\"st\">\"/items\"</span>, methods<span class=\"op\">=</span>[<span class=\"st\">\"GET\"</span>, <span class=\"st\">\"POST\"</span>])\n<span class=\"kw\">def</span> <span class=\"fn\">items</span>():\n    <span class=\"kw\">if</span> request.method <span class=\"op\">==</span> <span class=\"st\">\"POST\"</span>:\n        data <span class=\"op\">=</span> request.<span class=\"fn\">get_json</span>()   <span class=\"cm\"># parse JSON request body</span>\n        <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>(data), <span class=\"nb\">201</span>   <span class=\"cm\"># 201 Created</span>\n    <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>([])              <span class=\"cm\"># 200 OK by default</span>\n\n<span class=\"cm\"># Query string parameters: /search?q=python&amp;page=2&amp;limit=20</span>\n<span class=\"dc\">@app.route</span>(<span class=\"st\">\"/search\"</span>)\n<span class=\"kw\">def</span> <span class=\"fn\">search</span>():\n    q       <span class=\"op\">=</span> request.args.<span class=\"fn\">get</span>(<span class=\"st\">\"q\"</span>, <span class=\"st\">\"\"</span>)            <span class=\"cm\"># string, default \"\"</span>\n    page    <span class=\"op\">=</span> request.args.<span class=\"fn\">get</span>(<span class=\"st\">\"page\"</span>, <span class=\"nb\">1</span>, <span class=\"fn\">type</span><span class=\"op\">=</span><span class=\"fn\">int</span>) <span class=\"cm\"># int, default 1</span>\n    limit   <span class=\"op\">=</span> request.args.<span class=\"fn\">get</span>(<span class=\"st\">\"limit\"</span>, <span class=\"nb\">20</span>, <span class=\"fn\">type</span><span class=\"op\">=</span><span class=\"fn\">int</span>)\n    sort_by <span class=\"op\">=</span> request.args.<span class=\"fn\">get</span>(<span class=\"st\">\"sort\"</span>, <span class=\"st\">\"created_at\"</span>)\n    <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>({<span class=\"st\">\"q\"</span>: q, <span class=\"st\">\"page\"</span>: page, <span class=\"st\">\"limit\"</span>: limit, <span class=\"st\">\"sort\"</span>: sort_by})\n\n<span class=\"cm\"># Redirect and URL generation</span>\n<span class=\"dc\">@app.route</span>(<span class=\"st\">\"/old-path\"</span>)\n<span class=\"kw\">def</span> <span class=\"fn\">old_path</span>():\n    <span class=\"kw\">from</span> flask <span class=\"kw\">import</span> redirect\n    <span class=\"kw\">return</span> <span class=\"fn\">redirect</span>(<span class=\"fn\">url_for</span>(<span class=\"st\">\"index\"</span>))  <span class=\"cm\"># url_for() generates URLs by function name</span></code></pre><h2>The Request Object</h2><p>Flask's <code>request</code> object (imported from flask) is a proxy that points to the current HTTP request. It's only valid during a request context — inside a route handler or a function called from one.</p><div class=\"cl\">python — reading request data</div><pre><code><span class=\"kw\">from</span> flask <span class=\"kw\">import</span> request\n\n<span class=\"dc\">@app.route</span>(<span class=\"st\">\"/api/orders\"</span>, methods<span class=\"op\">=</span>[<span class=\"st\">\"POST\"</span>])\n<span class=\"kw\">def</span> <span class=\"fn\">create_order</span>():\n    <span class=\"cm\"># JSON body (Content-Type: application/json)</span>\n    data <span class=\"op\">=</span> request.<span class=\"fn\">get_json</span>()\n    <span class=\"kw\">if</span> <span class=\"kw\">not</span> data:\n        <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>({<span class=\"st\">\"error\"</span>: <span class=\"st\">\"JSON body required\"</span>}), <span class=\"nb\">400</span>\n    \n    <span class=\"cm\"># Form data (Content-Type: application/x-www-form-urlencoded)</span>\n    username <span class=\"op\">=</span> request.form.<span class=\"fn\">get</span>(<span class=\"st\">\"username\"</span>)\n    \n    <span class=\"cm\"># File uploads (multipart/form-data)</span>\n    file <span class=\"op\">=</span> request.files.<span class=\"fn\">get</span>(<span class=\"st\">\"attachment\"</span>)\n    \n    <span class=\"cm\"># Request headers</span>\n    auth  <span class=\"op\">=</span> request.headers.<span class=\"fn\">get</span>(<span class=\"st\">\"Authorization\"</span>)\n    ct    <span class=\"op\">=</span> request.headers.<span class=\"fn\">get</span>(<span class=\"st\">\"Content-Type\"</span>)\n    \n    <span class=\"cm\"># Client info</span>\n    ip   <span class=\"op\">=</span> request.remote_addr\n    host <span class=\"op\">=</span> request.host\n    \n    <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>({<span class=\"st\">\"received\"</span>: data}), <span class=\"nb\">201</span></code></pre><h2>Blueprints — Modular Routes</h2><p>A Blueprint is a collection of routes that can be registered on an app with a URL prefix. They're Flask's mechanism for splitting a large application into logical modules. Each feature area (auth, posts, users, admin) gets its own blueprint with its own file. This keeps route files manageable and related code grouped together.</p><div class=\"cl\">python — routes/posts.py</div><pre><code><span class=\"kw\">from</span> flask <span class=\"kw\">import</span> <span class=\"nm\">Blueprint</span>, request, jsonify\n<span class=\"kw\">from</span> flask_jwt_extended <span class=\"kw\">import</span> jwt_required, get_jwt_identity\n<span class=\"kw\">from</span> ..models.post <span class=\"kw\">import</span> <span class=\"nm\">Post</span>\n<span class=\"kw\">from</span> ..extensions <span class=\"kw\">import</span> db\n\n<span class=\"cm\"># Create a blueprint — 'posts' is the name used with url_for()</span>\nposts_bp <span class=\"op\">=</span> <span class=\"fn\">Blueprint</span>(<span class=\"st\">\"posts\"</span>, __name__)\n\n<span class=\"dc\">@posts_bp.route</span>(<span class=\"st\">\"/\"</span>, methods<span class=\"op\">=</span>[<span class=\"st\">\"GET\"</span>])\n<span class=\"kw\">def</span> <span class=\"fn\">list_posts</span>():\n    <span class=\"st\">\"\"\"Return paginated list of posts.\"\"\"</span>\n    page     <span class=\"op\">=</span> request.args.<span class=\"fn\">get</span>(<span class=\"st\">\"page\"</span>, <span class=\"nb\">1</span>, <span class=\"fn\">type</span><span class=\"op\">=</span><span class=\"fn\">int</span>)\n    per_page <span class=\"op\">=</span> request.args.<span class=\"fn\">get</span>(<span class=\"st\">\"per_page\"</span>, <span class=\"nb\">20</span>, <span class=\"fn\">type</span><span class=\"op\">=</span><span class=\"fn\">int</span>)\n    posts    <span class=\"op\">=</span> <span class=\"nm\">Post</span>.query.<span class=\"fn\">paginate</span>(page<span class=\"op\">=</span>page, per_page<span class=\"op\">=</span>per_page, error_out<span class=\"op\">=</span><span class=\"kw\">False</span>)\n    <span class=\"kw\">return</span> <span class=\"fn\">jsonify</span>({\n        <span class=\"st\">\"items\"</span>:    [p.<span class=\"fn\">to_dict</span>() <span class=\"kw\">for</span> p <span class=\"kw\">in</span> posts.items],\n        <span class=\"st\">\"total\"</span>:    posts.total,\n        <span class=\"st\">\"page\"</span>:     posts.page,\n        <span class=\"st\">\"pages\"</span>:    posts.pages,\n        <span class=\"st\">\"has_next\"</span>: posts.h
