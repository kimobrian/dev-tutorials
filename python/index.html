 views + 1 WHERE id=1</span>\n<span class=\"nm\">Post</span>.objects.<span class=\"fn\">filter</span>(pk<span class=\"op\">=</span><span class=\"nb\">1</span>).<span class=\"fn\">update</span>(views<span class=\"op\">=</span><span class=\"fn\">F</span>(<span class=\"st\">\"views\"</span>) <span class=\"op\">+</span> <span class=\"nb\">1</span>)\n\n<span class=\"cm\"># F() in filter — compare two fields on the same model</span>\n<span class=\"cm\"># Find posts that have been edited after being published</span>\nedited_after_publish <span class=\"op\">=</span> <span class=\"nm\">Post</span>.objects.<span class=\"fn\">filter</span>(\n    published_at__isnull<span class=\"op\">=</span><span class=\"kw\">False</span>,\n    updated_at__gt<span class=\"op\">=</span><span class=\"fn\">F</span>(<span class=\"st\">\"published_at\"</span>)   <span class=\"cm\"># compare two datetime fields</span>\n)\n\n<span class=\"cm\"># F() with arithmetic</span>\n<span class=\"cm\"># Give all authors a 10% bonus on their post view counts</span>\n<span class=\"nm\">Post</span>.objects.<span class=\"fn\">update</span>(views<span class=\"op\">=</span><span class=\"fn\">F</span>(<span class=\"st\">\"views\"</span>) <span class=\"op\">*</span> <span class=\"nb\">1.1</span>)\n\n<span class=\"cm\"># ExpressionWrapper — calculate the duration between two fields</span>\n<span class=\"cm\"># Returns a new annotated field: post.time_to_first_edit</span>\ntime_to_edit <span class=\"op\">=</span> <span class=\"fn\">ExpressionWrapper</span>(\n    <span class=\"fn\">F</span>(<span class=\"st\">\"updated_at\"</span>) <span class=\"op\">-</span> <span class=\"fn\">F</span>(<span class=\"st\">\"created_at\"</span>),\n    output_field<span class=\"op\">=</span><span class=\"fn\">DurationField</span>()\n)\npost <span class=\"op\">=</span> <span class=\"nm\">Post</span>.objects.<span class=\"fn\">annotate</span>(edit_delay<span class=\"op\">=</span>time_to_edit).<span class=\"fn\">first</span>()\n<span class=\"fn\">print</span>(f<span class=\"st\">\"Edited {post.edit_delay.days} days after creation\"</span>)\n\n<span class=\"cm\"># Coalesce — return the first non-null value</span>\n<span class=\"cm\"># Use when a field might be null and you want a fallback</span>\n<span class=\"kw\">from</span> django.db.models.functions <span class=\"kw\">import</span> <span class=\"nm\">Coalesce</span>\n<span class=\"cm\"># Show published_at if available, otherwise show created_at</span>\nposts <span class=\"op\">=</span> <span class=\"nm\">Post</span>.objects.<span class=\"fn\">annotate</span>(\n    display_date<span class=\"op\">=</span><span class=\"fn\">Coalesce</span>(<span class=\"st\">\"published_at\"</span>, <span class=\"st\">\"created_at\"</span>)\n)</code></pre><h3>Q Objects — Complex Filter Conditions</h3><p><code>Q()</code> objects let you build complex WHERE clauses with OR, AND, and NOT logic. Regular <code>.filter()</code> arguments are always ANDed together — Q objects are the only way to express OR conditions.</p><div class=\"cl\">python — Q objects</div><pre><code><span class=\"kw\">from</span> django.db.models <span class=\"kw\">import</span> <span class=\"nm\">Q</span>\n\n<span class=\"cm\"># Simple OR — show published posts OR featured posts</span>\nposts <span class=\"op\">=</span> <span class=\"nm\">Post</span>.objects.<span class=\"fn\">filter</span>(\n    <span class=\"fn\">Q</span>(status<span class=\"op\">=</span><span class=\"st\">\"published\"</span>) <span class=\"op\">|</span> <span class=\"fn\">Q</span>(is_featured<span class=\"op\">=</span><span class=\"kw\">True</span>)\n)\n<span class=\"cm\"># SQL: WHERE status = 'published' OR is_featured = true</span>\n\n<span class=\"cm\"># NOT — exclude archived posts</span>\nnon_archived <span class=\"op\">=</span> <span class=\"nm\">Post</span>.objects.<span class=\"fn\">filter</span>(<span class=\"op\">~</span><span class=\"fn\">Q</span>(status<span class=\"op\">=</span><span class=\"st\">\"archived\"</span>))\n<span class=\"cm\"># SQL: WHERE NOT status = 'archived'</span>\n\n<span class=\"cm\"># Complex combination: AND, OR, NOT together</span>\n<span class=\"cm\"># Published posts by alice, OR any featured post that isn't archived</span>\nposts <span class=\"op\">=</span> <span class=\"nm\">Post</span>.objects.<span class=\"fn\">filter</span>(\n    (<span class=\"fn\">Q</span>(status<span class=\"op\">=</span><span class=\"st\">\"published\"</span>) <span class=\"op\">&amp;</span> <span class=\"fn\">Q</span>(author__username<span class=\"op\">=</span><span class=\"st\">\"alice\"</span>))\n    <span class=\"op\">|</span> (<span class=\"fn\">Q</span>(is_featured<span class=\"op\">=</span><span class=\"kw\">True</span>) <span class=\"op\">&amp;</span> <span class=\"op\">~</span><span class=\"fn\">Q</span>(status<span class=\"op\">=</span><span class=\"st\">\"archived\"</span>))\n)\n\n<span class=\"cm\"># Dynamic Q building — build queries based on runtime conditions</span>\n<span class=\"kw\">def</span> <span class=\"fn\">search_posts</span>(q<span class=\"op\">=</span><span class=\"st\">\"\"</span>, status<span class=\"op\">=</span><span class=\"kw\">None</span>, author<span class=\"op\">=</span><span class=\"kw\">None</span>, tags<span class=\"op\">=</span><span class=\"kw\">None</span>):\n    <span class=\"st\">\"\"\"Build a dynamic query based on which filters are provided.\"\"\"</span>\n    filters <span class=\"op\">=</span> <span class=\"fn\">Q</span>()   <span class=\"cm\"># empty Q = matches everything</span>\n    \n    <span class=\"kw\">if</span> q:\n        <span class=\"cm\"># Search across multiple fields</span>\n        filters <span class=\"op\">&amp;=</span> <span class=\"fn\">Q</span>(title__icontains<span class=\"op\">=</span>q) <span class=\"op\">|</span> <span class=\"fn\">Q</span>(body__icontains<span class=\"op\">=</span>q)\n    \n    <span class=\"kw\">if</span> status:\n        filters <span class=\"op\">&amp;=</span> <span class=\"fn\">Q</span>(status<span class=\"op\">=</span>status)\n    \n    <span class=\"kw\">if</span> author:\n        filters <span class=\"op\">&amp;=</span> <span class=\"fn\">Q</span>(author__username<span class=\"op\">=</span>author)\n    \n    <span class=\"kw\">if</span> tags:\n        <span class=\"cm\"># Post must have ALL of these tags (loop ANDs them)</span>\n        <span class=\"kw\">for</span> tag <span class=\"kw\">in</span> tags:\n            filters <span class=\"op\">&amp;=</span> <span class=\"fn\">Q</span>(tags__name<span class=\"op\">=</span>tag)\n    \n    <span class=\"kw\">return</span> <span class=\"nm\">Post</span>.objects.<span class=\"fn\">filter</span>(filters).<span class=\"fn\">distinct</span>()\n\nresults <span class=\"op\">=</span> <span class=\"fn\">search_posts</span>(q<span class=\"op\">=</span><span class=\"st\">\"python\"</span>, status<span class=\"op\">=</span><span class=\"st\">\"published\"</span>, tags<span class=\"op\">=</span>[<span class=\"st\">\"django\"</span>, <span class=\"st\">\"rest\"</span>])</code></pre><h3>Annotation and Aggregation</h3><p><em>Aggregation</em> computes a single value summarising a queryset. <em>Annotation</em> adds a computed field to each row in a queryset. Both execute in the database, not in Python — orders of magnitude faster for large datasets.</p><div class=\"cl\">python — aggregation and annotation</div><pre><code><span class=\"kw\">from</span> django.db.models <span class=\"kw\">import</span> <span class=\"nm\">Count</span>, <span class=\"nm\">Avg</span>, <span class=\"nm\">Sum</span>, <span class=\"nm\">Max</span>, <span class=\"nm\">Min</span>, <span class=\"nm\">Value</span>\n<span class=\"kw\">from</span> django.db.models.functions <span class=\"kw\">import</span> <span class=\"nm\">TruncMonth</span>, <span class=\"nm\">TruncDate</span>, <span class=\"nm\">Lower</span>\n\n<span class=\"cm\"># Aggregation — a single summary value for the whole queryset</span>\nstats <span class=\"op\">=</span> <span class=\"nm\">Post</span>.published.<span class=\"fn\">aggregate</span>(\n    total_posts  <span class=\"op\">=</span> <span class=\"fn\">Count</span>(<span class=\"st\">\"id\"</span>),\n    total_views  <span class=\"op\">=</span> <span class=\"fn\">Sum</span>(<span class=\"st\">\"views\"</span>),\n    avg_views    <span class=\"op\">=</span> <span class=\"fn\">Avg</span>(<span class=\"st\">\"views\"</span>),\n    max_views    <span class=\"op\">=</span> <span class=\"fn\">Max</span>(<span class=\"st\">\"views\"</span>),\n    featured_count <span class=\"op\">=</span> <span class=\"fn\">Count</span>(<span class=\"st\">\"id\"</span>, <span class=\"fn\">filter</span><span class=\"op\">=</span><span class=\"fn\">Q</span>(is_featured<span class=\"op\">=</span><span class=\"kw\">True</span>)),\n)\n<span class=\"fn\">print</span>(stats)\n<span class=\"cm\"># {\"total_posts\": 250, \"total_views\": 125000, \"avg_views\": 500.0, ...}</span>\n\n<span class=\"cm\"># Annotation — adds a new field to EACH row in the queryset</span>\n<span class=\"cm\"># This runs SQL: SELECT *, COUNT(comments.id) AS comment_count FROM posts ...</span>\nposts_with_stats <span class=\"op\">=</span> <span class=\"nm\">Post</span>.published.<span class=\"fn\">annotate</span>(\n    comment_count <span class=\"op\">=</span> <span class=\"fn\">Count</span>(<span class=\"st\">\"comments\"</span>),     <span class=\"cm\"># count related comments</span>\n    tag_count     <span class=\"op\">=</span> <span class=\"fn\">Count</span>(<span class=\"st\">\"tags\"</span>),         <span class=\"cm\"># count related tags</span>\n).<span class=\"fn\">order_by</span>(<span class=\"st\">\"-comment_count\"</span>)\n\n<span class=\"kw\">for</span> post <span class=\"kw\">in</span> posts_with_stats:\n    <span class=\"fn\">print</span>(f<span class=\"st\">\"{post.title}: {post.comment_count} comments, {post.tag_count} tags\"</span>)\n\n<span class=\"cm\"># Grouping with annotation — \"GROUP BY\" in Django</span>\n<span class=\"cm\"># Monthly post counts: how many posts published per month?</span>\nmonthly_stats <span class=\"op\">=</span> (\n    <span class=\"nm\">Post</span>.published\n    .<span class=\"fn\">annotate</span>(month<span class=\"op\">=</span><span class=\"fn\">TruncMonth</span>(<span class=\"st\">\"published_at\"</span>))   <span class=\"cm\"># truncate datetime to month</span>\n    .<span class=\"fn\">values</span>(<span class=\"st\">\"month\"</span>)                               <span class=\"cm\"># GROUP BY month</span>\n    .<span class=\"fn\">annotate</span>(\n        post_count <span class=\"op\">=</span> <span class=\"fn\">Count</span>(<span class=\"st\">\"id\"</span>),\n        total_views <span class=\"op\">=</span> <span class=\"fn\">Sum</span>(<span class=\"st\">\"views\"</span>),\n    )\n    .<span class=\"fn\">order_by</span>(<span class=\"st\">\"month\"</span>)\n)\n<span class=\"kw\">for</span> row <span class=\"kw\">in</span> monthly_stats:\n    <span class=\"fn\">print</span>(f<span class=\"st\">\"{row['month'].strftime('%B %Y')}: {row['post_count']} posts\"</span>)\n\n<span class=\"cm\"># Per-author statistics</span>\nauthor_stats <span class=\"op\">=</span> (\n    <span class=\"nm\">User</span>.objects\n    .<span class=\"fn\">annotate</span>(\n        post_count     <span class=\"op\">=</span> <span class=\"fn\">Count</span>(<span class=\"st\">\"posts\"</span>),   <span class=\"cm\"># using related_name=\"posts\"</span>\n        total_views    <span class=\"op\">=</span> <span class=\"fn\">Sum</span>(<span class=\"st\">\"posts__views\"</span>),\n        published_count <span class=\"op\">=</span> <span class=\"fn\">Count</span>(<span class=\"st\">\"posts\"</span>, <span class=\"fn\">filter</span><span class=\"op\">=</span><span class=\"fn\">Q</span>(posts__status<span class=\"op\">=</span><span class=\"st\">\"published\"</span>))\n    )\n    .<span class=\"fn\">filter</span>(post_count__gt<span class=\"op\">=</span><span class=\"nb\">0</span>)   <span class=\"cm\"># only authors with at least one post</span>\n    .<span class=\"fn\">order_by</span>(<span class=\"st\">\"-total_views\"</span>)\n)</code></pre><h3>Optimising Queries — select_related and prefetch_related</h3><p>The N+1 query problem is the most common Django performance issue. It happens silently — Python code looks fine but Django makes hundreds of database queries. The tools to fix it: <code>select_related</code> for ForeignKey/OneToOne (SQL JOIN), <code>prefetch_related</code> for ManyToMany/reverse FK (separate query + Python join).</p><div class=\"cl\">python — preventing N+1 queries</div><pre><code><span class=\"cm\"># THE N+1 PROBLEM — silent killer</span>\nposts <span class=\"op\">=</span> <span class=\"nm\">Post</span>.published.<span class=\"fn\">all</span>()   <span class=\"cm\"># 1 query: SELECT * FROM posts</span>\n<span class=\"kw\">for</span> post <span class=\"kw\">in</span> posts:\n    <span class=\"fn\">print</span>(post.author.username)    <span class=\"cm\"># N queries: SELECT * FROM users WHERE id=?</span>\n    <span class=\"kw\">for</span> tag <span class=\"kw\">in</span> post.tags.<span class=\"fn\">all</span>():    <span class=\"cm\"># N*M queries: SELECT * FROM tags WHERE post_id=?</span>\n        <span class=\"fn\">print</span>(tag.name)\n<span class=\"cm\"># For 100 posts with 5 tags each: 1 + 100 + 500 = 601 queries!</span>\n\n<span class=\"cm\"># FIXED with select_related + prefetch_related</span>\nposts <span class=\"op\">=</span> (\n    <span class=\"nm\">Post</span>.published\n    .<span class=\"fn\">select_related</span>(<span class=\"st\">\"author\"</span>, <span class=\"st\">\"category\"</span>)    <span class=\"cm\"># JOIN: author and category in 1 query</span>\n    .<span class=\"fn\">prefetch_related</span>(                        <span class=\"cm\"># 2 extra queries (not N!)</span>\n        <span class=\"st\">\"tags\"</span>,\n        <span class=\"fn\">Prefetch</span>(\n            <span class=\"st\">\"comments\"</span>,\n            queryset<span class=\"op\">=</span><span class=\"nm\">Comment</span>.objects.<span class=\"fn\">filter</span>(approved<span class=\"op\">=</span><span class=\"kw\">True</span>).<span class=\"fn\">select_related</span>(<span class=\"st\">\"author\"</span>),\n            to_attr<span class=\"op\">=</span><span class=\"st\">\"approved_comments\"</span>   <span class=\"cm\"># access as post.approved_comments</span>\n        )\n    )\n)\n<span class=\"cm\"># Total: 3 queries regardless of how many posts!</span>\n\n<span class=\"cm\"># .only() and .defer() — limit fetched columns</span>\n<span class=\"cm\"># Useful when body is large text you don't need in list views</span>\nlight_posts <span class=\"op\">=</span> (\n    <span class=\"nm\">Post</span>.published\n    .<span class=\"fn\">select_related</span>(<span class=\"st\">\"author\"</span>)\n    .<span class=\"fn\">only</span>(<span class=\"st\">\"id\"</span>, <span class=\"st\">\"title\"</span>, <span class=\"st\">\"slug\"</span>, <span class=\"st\">\"excerpt\"</span>,   <span class=\"cm\"># fetch ONLY these columns</span>\n          <span class=\"st\">\"author__id\"</span>, <span class=\"st\">\"author__username\"</span>,    <span class=\"cm\"># and these from author</span>\n          <span class=\"st\">\"views\"</span>, <span class=\"st\">\"created_at\"</span>)\n)\n<span class=\"cm\"># SQL: SELECT id, title, slug, excerpt, views, created_at FROM posts</span>\n<span class=\"cm\">#      JOIN users ON posts.author_id = users.id</span>\n\n<span class=\"cm\"># defer() is the opposite: fetch everything EXCEPT these columns</span>\nheavy_posts <span class=\"op\">=</span> <span class=\"nm\">Post</span>.published.<span class=\"fn\">defer</span>(<span class=\"st\">\"body\"</span>)   <span class=\"cm\"># skip the large text body</span></code></pre><div class=\"cal cal-info\"><span class=\"cal-title\">&#8505; django-debug-toolbar</span><p>Install <code>pip install django-debug-toolbar</code> and add it to your dev settings. It shows a panel in your browser with every SQL query, how long each took, and which view generated it. Essential for spotting N+1 problems in development before they hit production.</p></div>"},{"id":"dj-05","track":"django","tl":"Django","title":"Auth, Celery &amp; Django Ecosystem","sub":"Custom User model, SimpleJWT, Celery beat scheduler, and the Django package ecosystem.","content":"<h2>Custom User Model — Getting It Right From the Start</h2><p>Django's default User model uses <code>username</code> as the primary login field. Most modern applications use email. Changing the user model after you've run your first migration is genuinely painful — it requires rewriting foreign keys across your entire database. <em>Always start with a custom user model.</em></p><div class=\"cl\">python — users/models.py</div><pre><code><span class=\"kw\">from</span> django.contrib.auth.models <span class=\"kw\">import</span> <span class=\"nm\">AbstractUser</span>\n<span class=\"kw\">from</span> django.db <span class=\"kw\">import</span> models\n\n<span class=\"kw\">class</span> <span class=\"fn\">User</span>(<span class=\"nm\">AbstractUser</span>):\n    <span class=\"st\">\"\"\"Custom User model — inherits all of Django's auth machinery.\n    \n    AbstractUser provides: username, email, password, first_name, last_name,\n    is_staff, is_active, is_superuser, groups, user_permissions, date_joined,\n    last_login.\n    \n    We override email to be unique and make it the login field.\n    \"\"\"</span>\n    \n    <span class=\"kw\">class</span> <span class=\"fn\">Role</span>(models.<span class=\"nm\">TextChoices</span>):\n        <span class=\"nm\">USER</span>       <span class=\"op\">=</span> <span class=\"st\">\"user\"</span>,       <span class=\"st\">\"User\"</span>\n        <span class=\"nm\">EDITOR</span>     <span class=\"op\">=</span> <span class=\"st\">\"editor\"</span>,     <span class=\"st\">\"Editor\"</span>\n        <span class=\"nm\">MODERATOR</span>  <span class=\"op\">=</span> <span class=\"st\">\"moderator\"</span>,  <span class=\"st\">\"Moderator\"</span>\n        <span class=\"nm\">ADMIN</span>      <span class=\"op\">=</span> <span class=\"st\">\"admin\"</span>,      <span class=\"st\">\"Admin\"</span>\n    \n    <span class=\"cm\"># Override email to add unique constraint</span>\n    <span class=\"cm\"># By default Django allows duplicate emails!</span>\n    email <span class=\"op\">=</span> models.<span class=\"fn\">EmailField</span>(unique<span class=\"op\">=</span><span class=\"kw\">True</span>, db_index<span class=\"op\">=</span><span class=\"kw\">True</span>)\n    \n    <span class=\"cm\"># Additional profile fields</span>\n    bio         <span class=\"op\">=</span> models.<span class=\"fn\">TextField</span>(blank<span class=\"op\">=</span><span class=\"kw\">True</span>, max_length<span class=\"op\">=</span><span class=\"nb\">500</span>)\n    avatar      <span class=\"op\">=</span> models.<span class=\"fn\">ImageField</span>(upload_to<span class=\"op\">=</span><span class=\"st\">\"avatars/%Y/%m/\"</span>, blank<span class=\"op\">=</span><span class=\"kw\">True</span>)\n    website     <span class=\"op\">=</span> models.<span class=\"fn\">URLField</span>(blank<span class=\"op\">=</span><span class=\"kw\">True</span>)\n    twitter     <span class=\"op\">=</span> models.<span class=\"fn\">CharField</span>(max_length<span class=\"op\">=</span><span class=\"nb\">50</span>, blank<span class=\"op\">=</span><span class=\"kw\">True</span>)\n    location    <span class=\"op\">=</span> models.<span class=\"fn\">CharField</span>(max_length<span class=\"op\">=</span><span class=\"nb\">100</span>, blank<span class=\"op\">=</span><span class=\"kw\">True</span>)\n    \n    role <span class=\"op\">=</span> models.<span class=\"fn\">CharField</span>(\n        max_length<span class=\"op\">=</span><span class=\"nb\">20</span>, choices<span class=\"op\">=</span><span class=\"nm\">Role</span>.choices, default<span class=\"op\">=</span><span class=\"nm\">Role</span>.<span class=\"nm\">USER</span>\n    )\n    \n    <span class=\"cm\"># Email as login field — users enter email, not username</span>\n    <span class=\"nm\">USERNAME_FIELD</span>  <span class=\"op\">=</span> <span class=\"st\">\"email\"</span>\n    <span class=\"cm\"># REQUIRED_FIELDS are prompted by createsuperuser (besides USERNAME_FIELD)</span>\n    <span class=\"nm\">REQUIRED_FIELDS</span> <span class=\"op\">=</span> [<span class=\"st\">\"username\"</span>]   <span class=\"cm\"># username still required but not for login</span>\n    \n    <span class=\"cm\"># Convenience properties</span>\n    <span class=\"dc\">@property</span>\n    <span class=\"kw\">def</span> <span class=\"fn\">is_editor</span>(self) <span class=\"op\">-&gt;</span> <span class=\"fn\">bool</span>:\n        <span class=\"kw\">return</span> self.role <span class=\"kw\">in</span> (self.<span class=\"nm\">Role</span>.<span class=\"nm\">EDITOR</span>, self.<span class=\"nm\">Role</span>.<span class=\"nm\">ADMIN</span>)\n    \n    <span class=\"dc\">@property</span>\n    <span class=\"kw\">def</span> <span class=\"fn\">is_moderator</span>(self) <span class=\"op\">-&gt;</span> <span class=\"fn\">bool</span>:\n        <span class=\"kw\">return</span> self.role <span class=\"kw\">in</span> (self.<span class=\"nm\">Role</span>.<span class=\"nm\">MODERATOR</span>, self.<span class=\"nm\">Role</span>.<span class=\"nm\">ADMIN</span>)\n    \n    <span class=\"dc\">@property</span>\n    <span class=\"kw\">def</span> <span class=\"fn\">full_name</span>(self) <span class=\"op\">-&gt;</span> <span class=\"fn\">str</span>:\n        <span class=\"kw\">return</span> f<span class=\"st\">\"{self.first_name} {self.last_name}\"</span>.<span class=\"fn\">strip</span>() <span class=\"kw\">or</span> self.username\n    \n    <span class=\"kw\">def</span> <span class=\"fn\">__str__</span>(self):\n        <span class=\"kw\">return</span> f<span class=\"st\">\"{self.username} \"</span>\n\n<span class=\"cm\"># settings.py — MUST be set before your first migration!</span>\n<span class=\"nm\">AUTH_USER_MODEL</span> <span class=\"op\">=</span> <span class=\"st\">\"users.User\"</span></code></pre><h2>SimpleJWT — JSON Web Token Authentication</h2><p>JWT (JSON Web Token) authentication is stateless — the server doesn't need to store sessions. The token is cryptographically signed and contains the user's ID. The server verifies the signature on every request.</p><p>The pattern: an <em>access token</em> (short-lived, 15 minutes to 1 hour) is sent with every API request. A <em>refresh token</em> (long-lived, 7-30 days) is stored securely and used only to get new access tokens. If the access token is stolen, it expires quickly. If the refresh token is stolen, you can blacklist it.</p><div class=\"cl\">python — JWT configuration and endpoints</div><pre><code><span class=\"kw\">from</span> datetime <span class=\"kw\">import</span> timedelta\n\n<span class=\"nm\">REST_FRAMEWORK</span> <span class=\"op\">=</span> {\n    <span class=\"st\">\"DEFAULT_AUTHENTICATION_CLASSES\"</span>: [\n        <span class=\"st\">\"rest_framework_simplejwt.authentication.JWTAuthentication\"</span>,\n    ],\n    <span class=\"st\">\"DEFAULT_PERMISSION_CLASSES\"</span>: [\n        <span class=\"st\">\"rest_framework.permissions.IsAuthenticated\"</span>,  <span class=\"cm\"># default: require auth</span>\n    ],\n    <span class=\"st\">\"DEFAULT_PAGINATION_CLASS\"</span>: <span class=\"st\">\"rest_framework.pagination.PageNumberPagination\"</span>,\n    <span class=\"st\">\"PAGE_SIZE\"</span>: <span class=\"nb\">20</span>,\n    <span class=\"st\">\"DEFAULT_FILTER_BACKENDS\"</span>: [\n        <span class=\"st\">\"django_filters.rest_framework.DjangoFilterBackend\"</span>,\n        <span class=\"st\">\"rest_framework.filters.SearchFilter\"</span>,\n        <span class=\"st\">\"rest_framework.filters.OrderingFilter\"</span>,\n    ]\n}\n\n<span class=\"nm\">SIMPLE_JWT</span> <span class=\"op\">=</span> {\n    <span class=\"st\">\"ACCESS_TOKEN_LIFETIME\"</span>:   <span class=\"fn\">timedelta</span>(hours<span class=\"op\">=</span><span class=\"nb\">1</span>),\n    <span class=\"st\">\"REFRESH_TOKEN_LIFETIME\"</span>:  <span class=\"fn\">timedelta</span>(days<span class=\"op\">=</span><span class=\"nb\">7</span>),\n    <span class=\"st\">\"ROTATE_REFRESH_TOKENS\"</span>:   <span class=\"kw\">True</span>,    <span class=\"cm\"># new refresh token on each use</span>\n    <span class=\"st\">\"BLACKLIST_AFTER_ROTATION\"</span>: <span class=\"kw\">True</span>,   <span class=\"cm\"># old refresh token becomes invalid</span>\n    <span class=\"st\">\"UPDATE_LAST_LOGIN\"</span>: <span class=\"kw\">True</span>,          <span class=\"cm\"># update User.last_login on token refresh</span>\n    <span class=\"st\">\"AUTH_HEADER_TYPES\"</span>: (<span class=\"st\">\"Bearer\"</span>,),   <span class=\"cm\"># Authorization: Bearer </span>\n    <span class=\"st\">\"TOKEN_OBTAIN_SERIALIZER\"</span>: <span class=\"st\">\"users.serializers.MyTokenObtainPairSerializer\"</span>,\n}</code></pre><div class=\"cl\">python — custom token with extra claims</div><pre><code><span class=\"kw\">from</span> rest_framework_simplejwt.serializers <span class=\"kw\">import</span> <span class=\"nm\">TokenObtainPairSerializer</span>\n<span class=\"kw\">from</span> rest_framework_simplejwt.views <span class=\"kw\">import</span> <span class=\"nm\">TokenObtainPairView</span>\n\n<span class=\"kw\">class</span> <span class=\"fn\">MyTokenObtainPairSerializer</span>(<span class=\"nm\">TokenObtainPairSerializer</span>):\n    <span class=\"st\">\"\"\"Add custom claims to the JWT payload.\n    \n    Default payload: {\"token_type\": \"access\", \"exp\": ..., \"user_id\": ...}\n    Our payload adds: role, username, email\n    \n    This lets the frontend read user info from the token\n    without an extra API call.\n    \"\"\"</span>\n    <span class=\"dc\">@classmethod</span>\n    <span class=\"kw\">def</span> <span class=\"fn\">get_token</span>(cls, user):\n        token <span class=\"op\">=</span> <span class=\"fn\">super</span>().<span class=\"fn\">get_token</span>(user)\n        <span class=\"cm\"># Add custom claims — these are embedded in the token</span>\n        token[<span class=\"st\">\"username\"</span>] <span class=\"op\">=</span> user.username\n        token[<span class=\"st\">\"email\"</span>]    <span class=\"op\">=</span> user.email\n        token[<span class=\"st\">\"role\"</span>]     <span class=\"op\">=</span> user.role\n        <span class=\"kw\">return</span> token\n\n<span class=\"kw\">class</span> <span class=\"fn\">MyTokenObtainPairView</span>(<span class=\"nm\">TokenObtainPairView</span>):\n    serializer_class <span class=\"op\">=</span> <span class=\"nm\">MyTokenObtainPairSerializer</span>\n\n<span class=\"cm\"># urls.py</span>\n<span class=\"kw\">from</span> rest_framework_simplejwt.views <span class=\"kw\">import</span> <span class=\"nm\">TokenRefreshView</span>\nurlpatterns <span class=\"op\">=</span> [\n    <span class=\"fn\">path</span>(<span class=\"st\">\"api/token/\"</span>,         <span class=\"nm\">MyTokenObtainPairView</span>.<span class=\"fn\">as_view</span>()),  <span class=\"cm\"># login</span>\n    <span class=\"fn\">path</span>(<span class=\"st\">\"api/token/refresh/\"</span>, <span class=\"nm\">TokenRefreshView</span>.<span class=\"fn\">as_view</span>()),        <span class=\"cm\"># refresh</span>\n]</code></pre>"},{"id":"dj-06","track":"django","tl":"Django","title":"Django: Caching, Search & Performance","sub":"Redis caching strategies, full-text search with PostgreSQL and Elasticsearch, query optimization, and silk profiling.","content":"<h2>Django Caching — Accelerate Your App</h2><p>Django supports multiple cache backends and three caching strategies: per-view caching (entire response), template fragment caching (parts of a template), and low-level cache API (arbitrary Python objects). Redis is the production standard.</p><div class=\"cl\">python — cache configuration</div><pre><code><span class=\"cm\"># settings.py — Redis backend</span>\n<span class=\"nm\">CACHES</span> <span class=\"op\">=</span> {\n    <span class=\"st\">\"default\"</span>: {\n        <span class=\"st\">\"BACKEND\"</span>:  <span class=\"st\">\"django.core.cache.backends.redis.RedisCache\"</span>,\n        <span class=\"st\">\"LOCATION\"</span>: <span class=\"st\">\"redis://127.0.0.1:6379/1\"</span>,\n        <span class=\"st\">\"OPTIONS\"</span>: {\n            <span class=\"st\">\"CLIENT_CLASS\"</span>:         <span class=\"st\">\"django_redis.client.DefaultClient\"</span>,\n            <span class=\"st\">\"SOCKET_CONNECT_TIMEOUT\"</span>: <span class=\"nb\">5</span>,    <span class=\"cm\"># seconds to wait for connection</span>\n            <span class=\"st\">\"SOCKET_TIMEOUT\"</span>:         <span class=\"nb\">5</span>,    <span class=\"cm\"># seconds to wait for command</span>\n            <span class=\"st\">\"RETRY_ON_TIMEOUT\"</span>:       <span class=\"kw\">True</span>,\n        },\n        <span class=\"st\">\"KEY_PREFIX\"</span>: <span class=\"st\">\"myblog\"</span>,   <span class=\"cm\"># prevents key collisions with other apps</span>\n        <span class=\"st\">\"TIMEOUT\"</span>: <span class=\"nb\">300</span>,           <span class=\"cm\"># default TTL: 5 minutes</span>\n    }\n}</code></pre><div class=\"cl\">python — caching strategies</div><pre><code><span class=\"kw\">from</span> django.core.<span class=\"fn\">cache</span> <span class=\"kw\">import</span> <span class=\"fn\">cache</span>\n<span class=\"kw\">from</span> django.views.decorators.<span class=\"fn\">cache</span> <span class=\"kw\">import</span> cache_page\n<span class=\"kw\">from</span> django.utils.decorators <span class=\"kw\">import</span> method_decorator\n\n<span class=\"cm\"># Strategy 1: Low-level API — cache arbitrary Python objects</span>\n<span class=\"kw\">def</span> <span class=\"fn\">get_site_stats</span>():\n    <span class=\"st\">\"\"\"Returns site statistics. Cached for 1 hour.\n    Computing this requires multiple expensive queries.\n    \"\"\"</span>\n    <span class=\"nm\">CACHE_KEY</span> <span class=\"op\">=</span> <span class=\"st\">\"site_stats_v2\"</span>\n    \n    stats <span class=\"op\">=</span> <span class=\"fn\">cache</span>.<span class=\"fn\">get</span>(<span class=\"nm\">CACHE_KEY</span>)\n    <span class=\"kw\">if</span> stats <span class=\"kw\">is</span> <span class=\"kw\">None</span>:\n        <span class=\"cm\"># Cache miss — compute the expensive result</span>\n        stats <span class=\"op\">=</span> {\n            <span class=\"st\">\"total_posts\"</span>:    <span class=\"nm\">Post</span>.published.<span class=\"fn\">count</span>(),\n            <span class=\"st\">\"total_authors\"</span>:  <span class=\"nm\">User</span>.objects.<span class=\"fn\">filter</span>(posts__status<span class=\"op\">=</span><span class=\"st\">\"published\"</span>).<span class=\"fn\">distinct</span>().<span class=\"fn\">count</span>(),\n            <span class=\"st\">\"total_views\"</span>:    <span class=\"nm\">Post</span>.published.<span class=\"fn\">aggregate</span>(v<span class=\"op\">=</span><span class=\"fn\">Sum</span>(<span class=\"st\">\"views\"</span>))[<span class=\"st\">\"v\"</span>] <span class=\"kw\">or</span> <span class=\"nb\">0</span>,\n            <span class=\"st\">\"popular_tags\"</span>:   <span class=\"fn\">list</span>(<span class=\"nm\">Tag</span>.objects.<span class=\"fn\">annotate</span>(c<span class=\"op\">=</span><span class=\"fn\">Count</span>(<span class=\"st\">\"posts\"</span>)).<span class=\"fn\">order_by</span>(<span class=\"st\">\"-c\"</span>)[:<span class=\"nb\">10</span>].<span class=\"fn\">values</span>(<span class=\"st\">\"name\"</span>, <span class=\"st\">\"c\"</span>))\n        }\n        <span class=\"fn\">cache</span>.<span class=\"fn\">set</span>(<span class=\"nm\">CACHE_KEY</span>, stats, timeout<span class=\"op\">=</span><span class=\"nb\">3600</span>)   <span class=\"cm\"># cache for 1 hour</span>\n    \n    <span class=\"kw\">return</span> stats\n\n<span class=\"cm\"># Strategy 2: @cache_page decorator — cache an entire view's response</span>\n<span class=\"dc\">@method_decorator</span>(<span class=\"fn\">cache_page</span>(<span class=\"nb\">60</span> <span class=\"op\">*</span> <span class=\"nb\">15</span>), name<span class=\"op\">=</span><span class=\"st\">\"dispatch\"</span>)   <span class=\"cm\"># 15 minutes</span>\n<span class=\"kw\">class</span> <span class=\"fn\">PostListView</span>(generics.<span class=\"nm\">ListAPIView</span>):\n    queryset <span class=\"op\">=</span> <span class=\"nm\">Post</span>.published.<span class=\"fn\">with_relations</span>()\n    serializer_class <span class=\"op\">=</span> <span class=\"nm\">PostListSerializer</span>\n\n<span class=\"cm\"># Strategy 3: Cache versioning — safer invalidation</span>\n<span class=\"kw\">def</span> <span class=\"fn\">get_user_profile</span>(user_id: <span class=\"fn\">int</span>):\n    <span class=\"st\">\"\"\"Cache user profile with versioning.\n    When a user updates their profile, increment version instead of\n    doing a point delete — safer under high concurrency.\n    \"\"\"</span>\n    version <span class=\"op\">=</span> <span class=\"fn\">cache</span>.<span class=\"fn\">get</span>(f<span class=\"st\">\"user_version:{user_id}\"</span>, default<span class=\"op\">=</span><span class=\"nb\">1</span>)\n    profile <span class=\"op\">=</span> <span class=\"fn\">cache</span>.<span class=\"fn\">get</span>(f<span class=\"st\">\"user_profile:{user_id}\"</span>, version<span class=\"op\">=</span>version)\n    <span class=\"kw\">if</span> profile <span class=\"kw\">is</span> <span class=\"kw\">None</span>:\n        user    <span class=\"op\">=</span> <span class=\"nm\">User</span>.objects.<span class=\"fn\">get</span>(pk<span class=\"op\">=</span>user_id)\n        profile <span class=\"op\">=</span> <span class=\"fn\">UserSerializer</span>(user).data\n        <span class=\"fn\">cache</span>.<span class=\"fn\">set</span>(f<span class=\"st\">\"user_profile:{user_id}\"</span>, profile, version<span class=\"op\">=</span>version, timeout<span class=\"op\">=</span><span class=\"nb\">1800</span>)\n    <span class=\"kw\">return</span> profile\n\n<span class=\"kw\">def</span> <span class=\"fn\">invalidate_user_profile</span>(user_id: <span class=\"fn\">int</span>):\n    <span class=\"st\">\"\"\"Invalidate profile cache by bumping version.\"\"\"</span>\n    current <span class=\"op\">=</span> <span class=\"fn\">cache</span>.<span class=\"fn\">get</span>(f<span class=\"st\">\"user_version:{user_id}\"</span>, default<span class=\"op\">=</span><span class=\"nb\">1</span>)\n    <span class=\"fn\">cache</span>.<span class=\"fn\">set</span>(f<span class=\"st\">\"user_version:{user_id}\"</span>, current <span class=\"op\">+</span> <span class=\"nb\">1</span>, timeout<span class=\"op\">=</span><span class=\"nb\">86400</span>)</code></pre><h2>Full-Text Search with PostgreSQL</h2><div class=\"cl\">python — django.contrib.postgres search</div><pre><code><span class=\"kw\">from</span> django.contrib.postgres.search <span class=\"kw\">import</span> (\n    <span class=\"nm\">SearchVector</span>, <span class=\"nm\">SearchQuery</span>, <span class=\"nm\">SearchRank</span>, <span class=\"nm\">SearchHeadline</span>, <span class=\"nm\">TrigramSimilarity</span>\n)\n\n<span class=\"cm\"># Basic full-text search — uses PostgreSQL's tsvector/tsquery</span>\n<span class=\"kw\">def</span> <span class=\"fn\">search_posts</span>(query_str: <span class=\"fn\">str</span>):\n    <span class=\"st\">\"\"\"Full-text search across title and body.\n    \n    Weights: A (highest) for title matches, B for body matches.\n    This means a title match scores higher than an equal body match.\n    \"\"\"</span>\n    search_query <span class=\"op\">=</span> <span class=\"fn\">SearchQuery</span>(query_str, search_type<span class=\"op\">=</span><span class=\"st\">\"websearch\"</span>)  <span class=\"cm\"># understands AND/OR/NOT</span>\n    search_vector <span class=\"op\">=</span> (\n        <span class=\"fn\">SearchVector</span>(<span class=\"st\">\"title\"</span>, weight<span class=\"op\">=</span><span class=\"st\">\"A\"</span>) <span class=\"op\">+</span>    <span class=\"cm\"># title matches worth more</span>\n        <span class=\"fn\">SearchVector</span>(<span class=\"st\">\"body\"</span>,  weight<span class=\"op\">=</span><span class=\"st\">\"B\"</span>)      <span class=\"cm\"># body matches worth less</span>\n    )\n    \n    <span class=\"kw\">return</span> (\n        <span class=\"nm\">Post</span>.published\n        .<span class=\"fn\">annotate</span>(\n            rank     <span class=\"op\">=</span> <span class=\"fn\">SearchRank</span>(search_vector, search_query),\n            headline <span class=\"op\">=</span> <span class=\"fn\">SearchHeadline</span>(   <span class=\"cm\"># highlight matching terms in excerpt</span>\n                <span class=\"st\">\"body\"</span>,\n                search_query,\n                start_sel<span class=\"op\">=</span><span class=\"st\">''</span>,\n                stop_sel<span class=\"op\">=</span><span class=\"st\">''</span>,\n                max_words<span class=\"op\">=</span><span class=\"nb\">50</span>,\n                min_words<span class=\"op\">=</span><span class=\"nb\">10</span>,\n            )\n        )\n        .<span class=\"fn\">filter</span>(rank__gte<span class=\"op\">=</span><span class=\"nb\">0.05</span>)    <span class=\"cm\"># minimum relevance threshold</span>\n        .<span class=\"fn\">order_by</span>(<span class=\"st\">\"-rank\"</span>)         <span class=\"cm\"># most relevant first</span>\n    )\n\n<span class=\"cm\"># Fuzzy search with trigrams — handles typos</span>\n<span class=\"cm\"># \"pythun\" matches \"Python\" with 0.6+ similarity</span>\n<span class=\"kw\">def</span> <span class=\"fn\">fuzzy_search</span>(query_str: <span class=\"fn\">str</span>):\n    <span class=\"kw\">return</span> (\n        <span class=\"nm\">Post</span>.published\n        .<span class=\"fn\">annotate</span>(similarity<span class=\"op\">=</span><span class=\"fn\">TrigramSimilarity</span>(<span class=\"st\">\"title\"</span>, query_str))\n        .<span class=\"fn\">filter</span>(similarity__gt<span class=\"op\">=</span><span class=\"nb\">0.3</span>)   <span class=\"cm\"># 0-1 scale, 1=identical</span>\n        .<span class=\"fn\">order_by</span>(<span class=\"st\">\"-similarity\"</span>)\n    )\n\n<span class=\"cm\"># migrations — add GIN index for performance</span>\n<span class=\"cm\"># Run: python manage.py makemigrations</span>\n<span class=\"cm\"># In the generated file, add:</span>\n<span class=\"kw\">from</span> django.contrib.postgres.indexes <span class=\"kw\">import</span> <span class=\"nm\">GinIndex</span>\n<span class=\"kw\">class</span> <span class=\"fn\">Post</span>(models.<span class=\"nm\">Model</span>):\n    <span class=\"kw\">class</span> <span class=\"nm\">Meta</span>:\n        indexes <span class=\"op\">=</span> [\n            <span class=\"fn\">GinIndex</span>(<span class=\"fn\">SearchVector</span>(<span class=\"st\">\"title\"</span>, <span class=\"st\">\"body\"</span>, config<span class=\"op\">=</span><span class=\"st\">\"english\"</span>),\n                     name<span class=\"op\">=</span><span class=\"st\">\"post_search_gin_idx\"</span>)\n        ]</code></pre>"},{"id":"fa-01","track":"fastapi","tl":"FastAPI","title":"FastAPI: Modern Async APIs","sub":"FastAPI philosophy, Pydantic models, automatic OpenAPI docs, and first endpoints.","content":"<h2>Why FastAPI?</h2><p>FastAPI is the newest of the three frameworks but has taken the Python ecosystem by storm since its release in 2018. Built on Starlette (ASGI) and Pydantic, it combines ideas from multiple frameworks into something new: the performance of async Python, the type safety of Pydantic, and automatic API documentation that's always up-to-date.</p><p>FastAPI's killer features:</p><ul><li><strong>Automatic OpenAPI docs</strong> — Swagger UI at <code>/docs</code> and ReDoc at <code>/redoc</code>, generated from your code with zero configuration</li><li><strong>Type-safe by default</strong> — Pydantic validates all request/response data automatically</li><li><strong>Async-first</strong> — native <code>async/await</code> throughout, no bolted-on async support</li><li><strong>Performance</strong> — benchmarks comparable to Node.js and Go for I/O-bound workloads</li><li><strong>Developer experience</strong> — excellent IDE support, autocompletion, inline error checking</li></ul><h2>Installation</h2><div class=\"cl\">bash</div><pre><code><span class=\"fn\">pip</span> install fastapi <span class=\"fn\">uvicorn</span>[standard] sqlalchemy[asyncio] <span class=\"fn\">alembic</span> \\\n            pydantic[email] python-jose[cryptography] passlib[bcrypt] \\\n            python-multipart aiosqlite asyncpg\n\n<span class=\"cm\"># Run the development server with auto-reload</span>\n<span class=\"fn\">uvicorn</span> main:app --reload\n\n<span class=\"cm\"># Access:</span>\n<span class=\"cm\"># API:     http://127.0.0.1:8000/</span>\n<span class=\"cm\"># Swagger: http://127.0.0.1:8000/docs</span>\n<span class=\"cm\"># ReDoc:   http://127.0.0.1:8000/redoc</span></code></pre><h2>Your First FastAPI Application</h2><p>Even the simplest FastAPI app demonstrates all the key concepts: path decorators, automatic JSON serialisation, path parameters, and query parameters. Notice that FastAPI auto-generates an interactive Swagger UI from this code — you can test every endpoint in the browser without any frontend work.</p><div class=\"cl\">python — main.py</div><pre><code><span class=\"kw\">from</span> fastapi <span class=\"kw\">import</span> <span class=\"nm\">FastAPI</span>, <span class=\"nm\">HTTPException</span>, <span class=\"nm\">Query</span>\n<span class=\"kw\">from</span> typing <span class=\"kw\">import</span> <span class=\"nm\">Optional</span>\n\napp <span class=\"op\">=</span> <span class=\"fn\">FastAPI</span>(\n    title<span class=\"op\">=</span><span class=\"st\">\"TaskBoard API\"</span>,\n    description<span class=\"op\">=</span><span class=\"st\">\"A production-ready task management API\"</span>,\n    version<span class=\"op\">=</span><span class=\"st\">\"1.0.0\"</span>,\n    docs_url<span class=\"op\">=</span><span class=\"st\">\"/docs\"</span>,     <span class=\"cm\"># Swagger UI</span>\n    redoc_url<span class=\"op\">=</span><span class=\"st\">\"/redoc\"</span>,   <span class=\"cm\"># ReDoc</span>\n)\n\n<span class=\"cm\"># Fake database for now</span>\nfake_db <span class=\"op\">=</span> {\n    <span class=\"nb\">1</span>: {<span class=\"st\">\"id\"</span>: <span class=\"nb\">1</span>, <span class=\"st\">\"title\"</span>: <span class=\"st\">\"Buy groceries\"</span>, <span class=\"st\">\"done\"</span>: <span class=\"kw\">False</span>},\n    <span class=\"nb\">2</span>: {<span class=\"st\">\"id\"</span>: <span class=\"nb\">2</span>, <span class=\"st\">\"title\"</span>: <span class=\"st\">\"Read a book\"</span>,   <span class=\"st\">\"done\"</span>: <span class=\"kw\">True</span>},\n}\n\n<span class=\"dc\">@app.get</span>(<span class=\"st\">\"/\"</span>)\n<span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">root</span>():\n    <span class=\"kw\">return</span> {<span class=\"st\">\"message\"</span>: <span class=\"st\">\"TaskBoard API\"</span>, <span class=\"st\">\"docs\"</span>: <span class=\"st\">\"/docs\"</span>}\n\n<span class=\"dc\">@app.get</span>(<span class=\"st\">\"/tasks/{task_id}\"</span>)\n<span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">get_task</span>(task_id: <span class=\"fn\">int</span>):  <span class=\"cm\"># FastAPI validates task_id is an int</span>\n    <span class=\"kw\">if</span> task_id <span class=\"kw\">not</span> <span class=\"kw\">in</span> fake_db:\n        <span class=\"kw\">raise</span> <span class=\"fn\">HTTPException</span>(status_code<span class=\"op\">=</span><span class=\"nb\">404</span>, detail<span class=\"op\">=</span>f<span class=\"st\">\"Task {task_id} not found\"</span>)\n    <span class=\"kw\">return</span> fake_db[task_id]\n\n<span class=\"dc\">@app.get</span>(<span class=\"st\">\"/tasks\"</span>)\n<span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">list_tasks</span>(\n    done:   <span class=\"nm\">Optional</span>[<span class=\"fn\">bool</span>] <span class=\"op\">=</span> <span class=\"kw\">None</span>,          <span class=\"cm\"># ?done=true filters by status</span>\n    limit:  <span class=\"fn\">int</span> <span class=\"op\">=</span> <span class=\"fn\">Query</span>(<span class=\"nb\">20</span>, ge<span class=\"op\">=</span><span class=\"nb\">1</span>, le<span class=\"op\">=</span><span class=\"nb\">100</span>),  <span class=\"cm\"># ge=1 le=100 enforced automatically</span>\n    offset: <span class=\"fn\">int</span> <span class=\"op\">=</span> <span class=\"fn\">Query</span>(<span class=\"nb\">0</span>,  ge<span class=\"op\">=</span><span class=\"nb\">0</span>),\n):\n    tasks <span class=\"op\">=</span> <span class=\"fn\">list</span>(fake_db.<span class=\"fn\">values</span>())\n    <span class=\"kw\">if</span> done <span class=\"kw\">is</span> <span class=\"kw\">not</span> <span class=\"kw\">None</span>:\n        tasks <span class=\"op\">=</span> [t <span class=\"kw\">for</span> t <span class=\"kw\">in</span> tasks <span class=\"kw\">if</span> t[<span class=\"st\">\"done\"</span>] <span class=\"op\">==</span> done]\n    <span class=\"kw\">return</span> tasks[offset : offset <span class=\"op\">+</span> limit]</code></pre><h2>Pydantic Models — The Heart of FastAPI</h2><p>Pydantic is FastAPI's data validation engine. You define a model class inheriting from <code>BaseModel</code>, and Pydantic automatically validates all incoming data, converts types, runs your validators, and generates the JSON schema that becomes the OpenAPI documentation. This is not optional middleware — it's the core of how FastAPI works.</p><div class=\"cl\">python — schemas/task.py</div><pre><code><span class=\"kw\">from</span> pydantic <span class=\"kw\">import</span> <span class=\"fn\">BaseModel</span>, <span class=\"fn\">Field</span>, <span class=\"fn\">field_validator</span>, <span class=\"nm\">EmailStr</span>\n<span class=\"kw\">from</span> datetime <span class=\"kw\">import</span> datetime\n<span class=\"kw\">from</span> typing <span class=\"kw\">import</span> <span class=\"nm\">Optional</span>\n<span class=\"kw\">from</span> enum <span class=\"kw\">import</span> <span class=\"nm\">Enum</span>\n\n<span class=\"kw\">class</span> <span class=\"fn\">Priority</span>(<span class=\"fn\">str</span>, <span class=\"nm\">Enum</span>):\n    <span class=\"st\">\"\"\"Task priority levels — str Enum serialises as a string in JSON.\"\"\"</span>\n    <span class=\"nm\">LOW</span>    <span class=\"op\">=</span> <span class=\"st\">\"low\"</span>\n    <span class=\"nm\">MEDIUM</span> <span class=\"op\">=</span> <span class=\"st\">\"medium\"</span>\n    <span class=\"nm\">HIGH</span>   <span class=\"op\">=</span> <span class=\"st\">\"high\"</span>\n    <span class=\"nm\">URGENT</span> <span class=\"op\">=</span> <span class=\"st\">\"urgent\"</span>\n\n<span class=\"kw\">class</span> <span class=\"fn\">TaskCreate</span>(<span class=\"fn\">BaseModel</span>):\n    <span class=\"st\">\"\"\"Schema for creating a new task — what the client sends.\"\"\"</span>\n    title:       <span class=\"fn\">str</span>      <span class=\"op\">=</span> <span class=\"fn\">Field</span>(..., min_length<span class=\"op\">=</span><span class=\"nb\">3</span>, max_length<span class=\"op\">=</span><span class=\"nb\">200</span>,\n                                  description<span class=\"op\">=</span><span class=\"st\">\"Task title\"</span>,\n                                  example<span class=\"op\">=</span><span class=\"st\">\"Finish the quarterly report\"</span>)\n    description: <span class=\"fn\">str</span>      <span class=\"op\">=</span> <span class=\"fn\">Field</span>(<span class=\"st\">\"\"</span>, max_length<span class=\"op\">=</span><span class=\"nb\">2000</span>)\n    priority:    <span class=\"nm\">Priority</span> <span class=\"op\">=</span> <span class=\"nm\">Priority</span>.<span class=\"nm\">MEDIUM</span>\n    due_date:    <span class=\"nm\">Optional</span>[datetime] <span class=\"op\">=</span> <span class=\"kw\">None</span>\n    \n    <span class=\"dc\">@field_validator</span>(<span class=\"st\">\"title\"</span>)\n    <span class=\"dc\">@classmethod</span>\n    <span class=\"kw\">def</span> <span class=\"fn\">title_must_not_be_blank</span>(cls, v: <span class=\"fn\">str</span>) <span class=\"op\">-&gt;</span> <span class=\"fn\">str</span>:\n        <span class=\"kw\">if</span> <span class=\"kw\">not</span> v.<span class=\"fn\">strip</span>():\n            <span class=\"kw\">raise</span> <span class=\"fn\">ValueError</span>(<span class=\"st\">\"Title cannot be blank or whitespace only\"</span>)\n        <span class=\"kw\">return</span> v.<span class=\"fn\">strip</span>()  <span class=\"cm\"># also clean the value</span>\n\n<span class=\"kw\">class</span> <span class=\"fn\">TaskUpdate</span>(<span class=\"fn\">BaseModel</span>):\n    <span class=\"st\">\"\"\"Schema for updating — all fields are optional.\"\"\"</span>\n    title:       <span class=\"nm\">Optional</span>[<span class=\"fn\">str</span>]      <span class=\"op\">=</span> <span class=\"kw\">None</span>\n    description: <span class=\"nm\">Optional</span>[<span class=\"fn\">str</span>]      <span class=\"op\">=</span> <span class=\"kw\">None</span>\n    priority:    <span class=\"nm\">Optional</span>[<span class=\"nm\">Priority</span>] <span class=\"op\">=</span> <span class=\"kw\">None</span>\n    due_date:    <span class=\"nm\">Optional</span>[datetime] <span class=\"op\">=</span> <span class=\"kw\">None</span>\n    is_done:     <span class=\"nm\">Optional</span>[<span class=\"fn\">bool</span>]     <span class=\"op\">=</span> <span class=\"kw\">None</span>\n\n<span class=\"kw\">class</span> <span class=\"fn\">TaskResponse</span>(<span class=\"fn\">BaseModel</span>):\n    <span class=\"st\">\"\"\"Schema for responses — what we send to the client.\"\"\"</span>\n    <span class=\"fn\">id</span>:          <span class=\"fn\">int</span>\n    title:       <span class=\"fn\">str</span>\n    description: <span class=\"fn\">str</span>\n    priority:    <span class=\"nm\">Priority</span>\n    is_done:     <span class=\"fn\">bool</span>\n    owner_id:    <span class=\"fn\">int</span>\n    created_at:  datetime\n    due_date:    <span class=\"nm\">Optional</span>[datetime]\n    \n    <span class=\"cm\"># Pydantic v2: enable reading from ORM objects (SQLAlchemy models)</span>\n    model_config <span class=\"op\">=</span> {<span class=\"st\">\"from_attributes\"</span>: <span class=\"kw\">True</span>}</code></pre>"},{"id":"fa-02","track":"fastapi","tl":"FastAPI","title":"Routing, Dependencies &amp; Auth","sub":"Path/query params, Depends injection, OAuth2 JWT, middleware, and WebSockets.","content":"<h2>Dependency Injection with Depends</h2><p>FastAPI's dependency injection system is one of its most powerful features. A <em>dependency</em> is any callable that FastAPI calls before your route handler, injecting the result as a parameter. Dependencies can have their own dependencies, creating composable chains.</p><p>This pattern cleanly handles cross-cutting concerns: database sessions, authentication, rate limiting, feature flags. Instead of repeating auth code in every route, declare it as a dependency once and inject it where needed.</p><div class=\"cl\">python — dependencies.py</div><pre><code><span class=\"kw\">from</span> fastapi <span class=\"kw\">import</span> <span class=\"nm\">Depends</span>, <span class=\"nm\">HTTPException</span>, status\n<span class=\"kw\">from</span> fastapi.security <span class=\"kw\">import</span> <span class=\"nm\">OAuth2PasswordBearer</span>\n<span class=\"kw\">from</span> sqlalchemy.ext.asyncio <span class=\"kw\">import</span> <span class=\"nm\">AsyncSession</span>\n<span class=\"kw\">from</span> jose <span class=\"kw\">import</span> jwt, <span class=\"nm\">JWTError</span>\n<span class=\"kw\">from</span> .config <span class=\"kw\">import</span> settings\n<span class=\"kw\">from</span> .database <span class=\"kw\">import</span> get_db\n<span class=\"kw\">from</span> .models <span class=\"kw\">import</span> <span class=\"nm\">User</span>\n<span class=\"kw\">from</span> typing <span class=\"kw\">import</span> <span class=\"fn\">Annotated</span>\n\noauth2_scheme <span class=\"op\">=</span> <span class=\"fn\">OAuth2PasswordBearer</span>(tokenUrl<span class=\"op\">=</span><span class=\"st\">\"/auth/token\"</span>)\n\n<span class=\"cm\"># DB session dependency — yields a session, commits or rolls back</span>\n<span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">get_db_session</span>() <span class=\"op\">-&gt;</span> <span class=\"nm\">AsyncSession</span>:\n    <span class=\"kw\">async</span> <span class=\"kw\">with</span> <span class=\"fn\">AsyncSessionLocal</span>() <span class=\"kw\">as</span> session:\n        <span class=\"kw\">try</span>:\n            <span class=\"kw\">yield</span> session\n            <span class=\"kw\">await</span> session.<span class=\"fn\">commit</span>()\n        <span class=\"kw\">except</span> <span class=\"nm\">Exception</span>:\n            <span class=\"kw\">await</span> session.<span class=\"fn\">rollback</span>()\n            <span class=\"kw\">raise</span>\n\n<span class=\"cm\"># Authentication dependency — validates JWT, returns User</span>\n<span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">get_current_user</span>(\n    token: <span class=\"fn\">str</span> <span class=\"op\">=</span> <span class=\"fn\">Depends</span>(oauth2_scheme),\n    db: <span class=\"nm\">AsyncSession</span> <span class=\"op\">=</span> <span class=\"fn\">Depends</span>(get_db_session)\n) <span class=\"op\">-&gt;</span> <span class=\"nm\">User</span>:\n    credentials_exception <span class=\"op\">=</span> <span class=\"fn\">HTTPException</span>(\n        status_code<span class=\"op\">=</span>status.<span class=\"nm\">HTTP_401_UNAUTHORIZED</span>,\n        detail<span class=\"op\">=</span><span class=\"st\">\"Could not validate credentials\"</span>,\n        headers<span class=\"op\">=</span>{<span class=\"st\">\"WWW-Authenticate\"</span>: <span class=\"st\">\"Bearer\"</span>},\n    )\n    <span class=\"kw\">try</span>:\n        payload <span class=\"op\">=</span> jwt.<span class=\"fn\">decode</span>(token, settings.<span class=\"nm\">SECRET_KEY</span>, algorithms<span class=\"op\">=</span>[settings.<span class=\"nm\">ALGORITHM</span>])\n        user_id: <span class=\"fn\">int</span> <span class=\"op\">=</span> <span class=\"fn\">int</span>(payload.<span class=\"fn\">get</span>(<span class=\"st\">\"sub\"</span>))\n    <span class=\"kw\">except</span> (<span class=\"nm\">JWTError</span>, <span class=\"nm\">TypeError</span>, <span class=\"nm\">ValueError</span>):\n        <span class=\"kw\">raise</span> credentials_exception\n    \n    user <span class=\"op\">=</span> <span class=\"kw\">await</span> db.<span class=\"fn\">get</span>(<span class=\"nm\">User</span>, user_id)\n    <span class=\"kw\">if</span> <span class=\"kw\">not</span> user <span class=\"kw\">or</span> <span class=\"kw\">not</span> user.is_active:\n        <span class=\"kw\">raise</span> credentials_exception\n    <span class=\"kw\">return</span> user\n\n<span class=\"cm\"># Type aliases make route signatures clean</span>\n<span class=\"nm\">DB</span>          <span class=\"op\">=</span> <span class=\"fn\">Annotated</span>[<span class=\"nm\">AsyncSession</span>, <span class=\"fn\">Depends</span>(get_db_session)]\n<span class=\"nm\">CurrentUser</span> <span class=\"op\">=</span> <span class=\"fn\">Annotated</span>[<span class=\"nm\">User</span>, <span class=\"fn\">Depends</span>(get_current_user)]</code></pre><div class=\"cl\">python — clean route signatures with Annotated</div><pre><code><span class=\"kw\">from</span> fastapi <span class=\"kw\">import</span> <span class=\"nm\">APIRouter</span>\n<span class=\"kw\">from</span> .dependencies <span class=\"kw\">import</span> <span class=\"nm\">DB</span>, <span class=\"nm\">CurrentUser</span>\n<span class=\"kw\">from</span> .schemas.task <span class=\"kw\">import</span> <span class=\"nm\">TaskCreate</span>, <span class=\"nm\">TaskResponse</span>\n<span class=\"kw\">from</span> .models <span class=\"kw\">import</span> <span class=\"nm\">Task</span>\n\nrouter <span class=\"op\">=</span> <span class=\"fn\">APIRouter</span>(prefix<span class=\"op\">=</span><span class=\"st\">\"/tasks\"</span>, tags<span class=\"op\">=</span>[<span class=\"st\">\"Tasks\"</span>])\n\n<span class=\"dc\">@router.get</span>(<span class=\"st\">\"/\"</span>, response_model<span class=\"op\">=</span><span class=\"fn\">list</span>[<span class=\"nm\">TaskResponse</span>])\n<span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">list_tasks</span>(\n    db:   <span class=\"nm\">DB</span>,           <span class=\"cm\"># injected: gets a DB session</span>\n    user: <span class=\"nm\">CurrentUser</span>,  <span class=\"cm\"># injected: authenticates user</span>\n    done: <span class=\"fn\">bool</span> <span class=\"op\">|</span> <span class=\"kw\">None</span> <span class=\"op\">=</span> <span class=\"kw\">None</span>,\n    page: <span class=\"fn\">int</span> <span class=\"op\">=</span> <span class=\"nb\">1</span>,\n    per_page: <span class=\"fn\">int</span> <span class=\"op\">=</span> <span class=\"nb\">20</span>,\n):\n    <span class=\"st\">\"\"\"Return the current user's tasks, optionally filtered by status.\"\"\"</span>\n    <span class=\"cm\"># db and user are already resolved — just use them</span>\n    ...\n\n<span class=\"dc\">@router.post</span>(<span class=\"st\">\"/\"</span>, response_model<span class=\"op\">=</span><span class=\"nm\">TaskResponse</span>, status_code<span class=\"op\">=</span><span class=\"nb\">201</span>)\n<span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">create_task</span>(\n    payload: <span class=\"nm\">TaskCreate</span>,  <span class=\"cm\"># request body, validated by Pydantic</span>\n    db:      <span class=\"nm\">DB</span>,\n    user:    <span class=\"nm\">CurrentUser</span>,\n):\n    task <span class=\"op\">=</span> <span class=\"fn\">Task</span>(<span class=\"op\">**</span>payload.<span class=\"fn\">model_dump</span>(), owner_id<span class=\"op\">=</span>user.<span class=\"fn\">id</span>)\n    db.<span class=\"fn\">add</span>(task)\n    <span class=\"kw\">await</span> db.<span class=\"fn\">commit</span>()\n    <span class=\"kw\">await</span> db.<span class=\"fn\">refresh</span>(task)\n    <span class=\"kw\">return</span> task</code></pre><h2>Async SQLAlchemy Database</h2><p>FastAPI is async-first, so we use SQLAlchemy's async engine and session. Async database access means requests don't block while waiting for queries — the event loop serves other requests during that time. This is how FastAPI handles high concurrency efficiently.</p><div class=\"cl\">python — database.py</div><pre><code><span class=\"kw\">from</span> sqlalchemy.ext.asyncio <span class=\"kw\">import</span> (\n    create_async_engine, <span class=\"nm\">AsyncSession</span>, async_sessionmaker\n)\n<span class=\"kw\">from</span> sqlalchemy.orm <span class=\"kw\">import</span> <span class=\"nm\">DeclarativeBase</span>\n<span class=\"kw\">from</span> .config <span class=\"kw\">import</span> settings\n\n<span class=\"cm\"># Async engine — uses asyncpg for PostgreSQL, aiosqlite for SQLite</span>\nengine <span class=\"op\">=</span> <span class=\"fn\">create_async_engine</span>(\n    settings.<span class=\"nm\">DATABASE_URL</span>,  <span class=\"cm\"># e.g. postgresql+asyncpg://user:pass@host/dbname</span>\n    echo<span class=\"op\">=</span>settings.<span class=\"nm\">DEBUG</span>,    <span class=\"cm\"># log all SQL in debug mode</span>\n    pool_size<span class=\"op\">=</span><span class=\"nb\">10</span>,           <span class=\"cm\"># keep 10 connections open</span>\n    max_overflow<span class=\"op\">=</span><span class=\"nb\">20</span>,        <span class=\"cm\"># allow 20 more under load</span>\n)\n\n<span class=\"nm\">AsyncSessionLocal</span> <span class=\"op\">=</span> <span class=\"fn\">async_sessionmaker</span>(\n    engine,\n    class_<span class=\"op\">=</span><span class=\"nm\">AsyncSession</span>,\n    expire_on_commit<span class=\"op\">=</span><span class=\"kw\">False</span>,  <span class=\"cm\"># don't expire objects after commit</span>\n)\n\n<span class=\"cm\"># Base class for all models</span>\n<span class=\"kw\">class</span> <span class=\"fn\">Base</span>(<span class=\"nm\">DeclarativeBase</span>):\n    <span class=\"kw\">pass</span></code></pre><h2>WebSockets — Real-Time Communication</h2><p>WebSockets provide a persistent bidirectional connection between client and server. Unlike HTTP where the client always initiates, WebSockets let the server push messages to clients in real time. Perfect for live notifications, chat, dashboards, and collaborative features.</p><div class=\"cl\">python — WebSocket endpoint</div><pre><code><span class=\"kw\">from</span> fastapi <span class=\"kw\">import</span> <span class=\"nm\">WebSocket</span>, <span class=\"nm\">WebSocketDisconnect</span>\n<span class=\"kw\">from</span> typing <span class=\"kw\">import</span> <span class=\"nm\">Dict</span>, <span class=\"nm\">List</span>\n\n<span class=\"kw\">class</span> <span class=\"nm\">ConnectionManager</span>:\n    <span class=\"st\">\"\"\"Manages active WebSocket connections.\"\"\"</span>\n    \n    <span class=\"kw\">def</span> <span class=\"fn\">__init__</span>(self):\n        <span class=\"cm\"># Map user_id -&gt; list of their WebSocket connections</span>\n        <span class=\"cm\"># (a user might have multiple browser tabs open)</span>\n        self.connections: <span class=\"nm\">Dict</span>[<span class=\"fn\">int</span>, <span class=\"nm\">List</span>[<span class=\"nm\">WebSocket</span>]] <span class=\"op\">=</span> {}\n    \n    <span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">connect</span>(self, websocket: <span class=\"nm\">WebSocket</span>, user_id: <span class=\"fn\">int</span>):\n        <span class=\"kw\">await</span> websocket.<span class=\"fn\">accept</span>()\n        self.connections.<span class=\"fn\">setdefault</span>(user_id, []).<span class=\"fn\">append</span>(websocket)\n    \n    <span class=\"kw\">def</span> <span class=\"fn\">disconnect</span>(self, websocket: <span class=\"nm\">WebSocket</span>, user_id: <span class=\"fn\">int</span>):\n        conns <span class=\"op\">=</span> self.connections.<span class=\"fn\">get</span>(user_id, [])\n        <span class=\"kw\">if</span> websocket <span class=\"kw\">in</span> conns:\n            conns.<span class=\"fn\">remove</span>(websocket)\n    \n    <span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">send_to_user</span>(self, user_id: <span class=\"fn\">int</span>, message: <span class=\"fn\">dict</span>):\n        <span class=\"st\">\"\"\"Send a message to all connections for a specific user.\"\"\"</span>\n        <span class=\"kw\">for</span> ws <span class=\"kw\">in</span> self.connections.<span class=\"fn\">get</span>(user_id, []):\n            <span class=\"kw\">await</span> ws.<span class=\"fn\">send_json</span>(message)\n    \n    <span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">broadcast</span>(self, message: <span class=\"fn\">dict</span>):\n        <span class=\"st\">\"\"\"Send a message to ALL connected users.\"\"\"</span>\n        <span class=\"kw\">for</span> conns <span class=\"kw\">in</span> self.connections.<span class=\"fn\">values</span>():\n            <span class=\"kw\">for</span> ws <span class=\"kw\">in</span> conns:\n                <span class=\"kw\">await</span> ws.<span class=\"fn\">send_json</span>(message)\n\nmanager <span class=\"op\">=</span> <span class=\"fn\">ConnectionManager</span>()\n\n<span class=\"dc\">@app.websocket</span>(<span class=\"st\">\"/ws/{user_id}\"</span>)\n<span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">websocket_endpoint</span>(websocket: <span class=\"nm\">WebSocket</span>, user_id: <span class=\"fn\">int</span>):\n    <span class=\"kw\">await</span> manager.<span class=\"fn\">connect</span>(websocket, user_id)\n    <span class=\"kw\">try</span>:\n        <span class=\"kw\">while</span> <span class=\"kw\">True</span>:\n            data <span class=\"op\">=</span> <span class=\"kw\">await</span> websocket.<span class=\"fn\">receive_json</span>()  <span class=\"cm\"># blocks until message arrives</span>\n            <span class=\"cm\"># Echo back with timestamp</span>\n            <span class=\"kw\">await</span> manager.<span class=\"fn\">send_to_user</span>(user_id, {\n                <span class=\"st\">\"type\"</span>: <span class=\"st\">\"echo\"</span>,\n                <span class=\"st\">\"data\"</span>: data,\n                <span class=\"st\">\"from_user\"</span>: user_id,\n            })\n    <span class=\"kw\">except</span> <span class=\"nm\">WebSocketDisconnect</span>:\n        manager.<span class=\"fn\">disconnect</span>(websocket, user_id)\n        <span class=\"kw\">await</span> manager.<span class=\"fn\">broadcast</span>({<span class=\"st\">\"type\"</span>: <span class=\"st\">\"user_disconnected\"</span>, <span class=\"st\">\"user_id\"</span>: user_id})</code></pre>"},{"id":"fa-03","track":"fastapi","tl":"FastAPI","title":"Database, Testing &amp; Deployment","sub":"Async SQLAlchemy, Alembic, httpx testing, lifespan events, Docker, and the FastAPI ecosystem.","content":"<h2>Testing FastAPI Applications</h2><p>FastAPI applications are tested with <code>pytest</code> and <code>httpx</code> — an async HTTP client that can talk directly to your ASGI app without a real server. The key technique is <em>dependency overriding</em>: you replace production dependencies (like the real database) with test versions (an in-memory SQLite database) at test time.</p><div class=\"cl\">bash</div><pre><code><span class=\"fn\">pip</span> install <span class=\"fn\">pytest</span> pytest-asyncio httpx aiosqlite</code></pre><div class=\"cl\">python — tests/conftest.py</div><pre><code><span class=\"kw\">import</span> pytest\n<span class=\"kw\">import</span> pytest_asyncio\n<span class=\"kw\">from</span> httpx <span class=\"kw\">import</span> <span class=\"nm\">AsyncClient</span>, <span class=\"nm\">ASGITransport</span>\n<span class=\"kw\">from</span> sqlalchemy.ext.asyncio <span class=\"kw\">import</span> create_async_engine, async_sessionmaker\n<span class=\"kw\">from</span> app.main <span class=\"kw\">import</span> app\n<span class=\"kw\">from</span> app.database <span class=\"kw\">import</span> <span class=\"nm\">Base</span>, get_db\n\n<span class=\"cm\"># Use in-memory SQLite for tests — fast, no state between test runs</span>\n<span class=\"nm\">TEST_DATABASE_URL</span> <span class=\"op\">=</span> <span class=\"st\">\"sqlite+aiosqlite:///:memory:\"</span>\n\n<span class=\"dc\">@pytest_asyncio.fixture</span>(scope<span class=\"op\">=</span><span class=\"st\">\"session\"</span>)\n<span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">engine</span>():\n    <span class=\"st\">\"\"\"Create test database engine once per session.\"\"\"</span>\n    eng <span class=\"op\">=</span> <span class=\"fn\">create_async_engine</span>(<span class=\"nm\">TEST_DATABASE_URL</span>)\n    <span class=\"kw\">async</span> <span class=\"kw\">with</span> eng.<span class=\"fn\">begin</span>() <span class=\"kw\">as</span> conn:\n        <span class=\"kw\">await</span> conn.<span class=\"fn\">run_sync</span>(<span class=\"nm\">Base</span>.metadata.create_all)\n    <span class=\"kw\">yield</span> eng\n    <span class=\"kw\">await</span> eng.<span class=\"fn\">dispose</span>()\n\n<span class=\"dc\">@pytest_asyncio.fixture</span>\n<span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">db_session</span>(engine):\n    <span class=\"st\">\"\"\"Fresh session per test — rolled back after each test.\"\"\"</span>\n    <span class=\"nm\">TestSession</span> <span class=\"op\">=</span> <span class=\"fn\">async_sessionmaker</span>(engine, expire_on_commit<span class=\"op\">=</span><span class=\"kw\">False</span>)\n    <span class=\"kw\">async</span> <span class=\"kw\">with</span> <span class=\"fn\">TestSession</span>() <span class=\"kw\">as</span> session:\n        <span class=\"kw\">yield</span> session\n\n<span class=\"dc\">@pytest_asyncio.fixture</span>\n<span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">client</span>(db_session):\n    <span class=\"st\">\"\"\"HTTP test client with database overridden to test session.\"\"\"</span>\n    <span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">override_get_db</span>():\n        <span class=\"kw\">yield</span> db_session\n    \n    app.dependency_overrides[get_db] <span class=\"op\">=</span> override_get_db\n    \n    <span class=\"kw\">async</span> <span class=\"kw\">with</span> <span class=\"fn\">AsyncClient</span>(\n        transport<span class=\"op\">=</span><span class=\"fn\">ASGITransport</span>(app<span class=\"op\">=</span>app),\n        base_url<span class=\"op\">=</span><span class=\"st\">\"http://test\"</span>\n    ) <span class=\"kw\">as</span> ac:\n        <span class=\"kw\">yield</span> ac\n    \n    app.dependency_overrides.<span class=\"fn\">clear</span>()\n\n<span class=\"dc\">@pytest_asyncio.fixture</span>\n<span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">auth_headers</span>(client):\n    <span class=\"st\">\"\"\"Register a test user and return JWT auth headers.\"\"\"</span>\n    <span class=\"kw\">await</span> client.<span class=\"fn\">post</span>(<span class=\"st\">\"/auth/register\"</span>, json<span class=\"op\">=</span>{\n        <span class=\"st\">\"username\"</span>: <span class=\"st\">\"testuser\"</span>,\n        <span class=\"st\">\"email\"</span>:    <span class=\"st\">\"test@example.com\"</span>,\n        <span class=\"st\">\"password\"</span>: <span class=\"st\">\"securepass123\"</span>,\n    })\n    r <span class=\"op\">=</span> <span class=\"kw\">await</span> client.<span class=\"fn\">post</span>(<span class=\"st\">\"/auth/token\"</span>, data<span class=\"op\">=</span>{\n        <span class=\"st\">\"username\"</span>: <span class=\"st\">\"test@example.com\"</span>,\n        <span class=\"st\">\"password\"</span>: <span class=\"st\">\"securepass123\"</span>,\n    })\n    token <span class=\"op\">=</span> r.<span class=\"fn\">json</span>()[<span class=\"st\">\"access_token\"</span>]\n    <span class=\"kw\">return</span> {<span class=\"st\">\"Authorization\"</span>: f<span class=\"st\">\"Bearer {token}\"</span>}</code></pre><div class=\"cl\">python — tests/test_tasks.py</div><pre><code><span class=\"kw\">import</span> pytest\n\n<span class=\"dc\">@pytest.mark.asyncio</span>\n<span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">test_create_task</span>(client, auth_headers):\n    <span class=\"st\">\"\"\"Creating a task returns 201 with the task data.\"\"\"</span>\n    response <span class=\"op\">=</span> <span class=\"kw\">await</span> client.<span class=\"fn\">post</span>(\n        <span class=\"st\">\"/tasks/\"</span>,\n        json<span class=\"op\">=</span>{<span class=\"st\">\"title\"</span>: <span class=\"st\">\"Buy milk\"</span>, <span class=\"st\">\"priority\"</span>: <span class=\"st\">\"high\"</span>},\n        headers<span class=\"op\">=</span>auth_headers,\n    )\n    <span class=\"kw\">assert</span> response.status_code <span class=\"op\">==</span> <span class=\"nb\">201</span>\n    data <span class=\"op\">=</span> response.<span class=\"fn\">json</span>()\n    <span class=\"kw\">assert</span> data[<span class=\"st\">\"title\"</span>] <span class=\"op\">==</span> <span class=\"st\">\"Buy milk\"</span>\n    <span class=\"kw\">assert</span> data[<span class=\"st\">\"priority\"</span>] <span class=\"op\">==</span> <span class=\"st\">\"high\"</span>\n    <span class=\"kw\">assert</span> data[<span class=\"st\">\"is_done\"</span>] <span class=\"op\">==</span> <span class=\"kw\">False</span>\n    <span class=\"kw\">assert</span> <span class=\"st\">\"id\"</span> <span class=\"kw\">in</span> data\n\n<span class=\"dc\">@pytest.mark.asyncio</span>\n<span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">test_create_task_requires_auth</span>(client):\n    <span class=\"st\">\"\"\"Creating a task without a token returns 401.\"\"\"</span>\n    response <span class=\"op\">=</span> <span class=\"kw\">await</span> client.<span class=\"fn\">post</span>(<span class=\"st\">\"/tasks/\"</span>, json<span class=\"op\">=</span>{<span class=\"st\">\"title\"</span>: <span class=\"st\">\"Hack\"</span>})\n    <span class=\"kw\">assert</span> response.status_code <span class=\"op\">==</span> <span class=\"nb\">401</span>\n\n<span class=\"dc\">@pytest.mark.asyncio</span>\n<span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">test_create_task_validates_title</span>(client, auth_headers):\n    <span class=\"st\">\"\"\"Title shorter than 3 characters fails validation.\"\"\"</span>\n    response <span class=\"op\">=</span> <span class=\"kw\">await</span> client.<span class=\"fn\">post</span>(\n        <span class=\"st\">\"/tasks/\"</span>,\n        json<span class=\"op\">=</span>{<span class=\"st\">\"title\"</span>: <span class=\"st\">\"Hi\"</span>},  <span class=\"cm\"># too short</span>\n        headers<span class=\"op\">=</span>auth_headers,\n    )\n    <span class=\"kw\">assert</span> response.status_code <span class=\"op\">==</span> <span class=\"nb\">422</span>   <span class=\"cm\"># Unprocessable Entity</span>\n\n<span class=\"dc\">@pytest.mark.asyncio</span>\n<span class=\"kw\">async</span> <span class=\"kw\">def</span> <span class=\"fn\">test_list_tasks_empty</span>(client, auth_headers):\n    <span class=\"st\">\"\"\"A new user has no tasks.\"\"\"</span>\n    response <span class=\"op\">=</span> <span class=\"kw\">await</span> client.<span class=\"fn\">get</span>(<span class=\"st\">\"/tasks/\"</span>, headers<span class=\"op\">=</span>auth_headers)\n    <span class=\"kw\">assert</span> response.status_code <span class=\"op\">==</span> <span class=\"nb\">200</span>\n    <span class=\"kw\">assert</span> response.<span class=\"fn\">json</span>() <span class=\"op\">==</span> []</code></pre><h2>Production Deployment</h2><p>For production, FastAPI runs behind Gunicorn using Uvicorn workers. Gunicorn manages multiple Uvicorn worker processes (one per CPU core), while Uvicorn handles the async I/O within each process. A load balancer (Nginx, Caddy) sits in front and handles SSL termination.</p><div class=\"cl\">bash — Gunicorn with Uvicorn workers</div><pre><code><span class=\"cm\"># Number of workers: (2 x CPUs) + 1 is a common starting point</span>\n<span class=\"fn\">gunicorn</span> app.main:app \\\n    --workers 4 \\\n    --worker-class uvicorn.workers.UvicornWorker \\\n    --bind 0.0.0.0:8000 \\\n    --access-logfile - \\\n    --error-logfile - \\\n    --timeout 60</code></pre><div class=\"cl\">dockerfile — containerise FastAPI</div><pre><code><span class=\"kw\">FROM</span> python:3.12-slim\n<span class=\"kw\">WORKDIR</span> /app\n\n<span class=\"cm\"># Copy and install dependencies first (layer caching)</span>\n<span class=\"kw\">COPY</span> requirements.txt .\n<span class=\"kw\">RUN</span> pip install --no-cache-dir -r requirements.txt\n\n<span class=\"cm\"># Copy application code</span>\n<span class=\"kw\">COPY</span> ./app ./app\n\n<span class=\"kw\">EXPOSE</span> 8000\n\n<span class=\"kw\">CMD</span> [<span class=\"st\">\"gunicorn\"</span>, <span class=\"st\">\"app.main:app\"</span>,\n     \"--workers\", \"4\",\n     \"--worker-class\", \"uvicorn.workers.UvicornWorker\",\n     \"--bind\", \"0.0.0.0:8000\"]</code></pre><h2>FastAPI Package Ecosystem</h2><div class=\"tw\"><table><tr><th>Category</th><th>Package</th><th>Purpose</th></tr><tr><td>ASGI</td><td><code>uvicorn[standard]</code></td><td>Production-grade ASGI server</td></tr><tr><td>Database</td><td><code>sqlalchemy[asyncio]</code></td><td>Async ORM</td></tr><tr><td>Database</td><td><code>asyncpg</code></td><td>High-performance async PostgreSQL driver</td></tr><tr><td>Database</td><td><code>aiosqlite</code></td><td>Async SQLite — use in development and tests</td></tr><tr><td>Database</td><td><code>alembic</code></td><td>Database migrations</td></tr><tr><td>Auth</td><td><code>python-jose[cryptography]</code></td><td>JWT token encoding and decoding</td></tr><tr><td>Auth</td><td><code>passlib[bcrypt]</code></td><td>Secure password hashing</td></tr><tr><td>Auth</td><td><code>fastapi-users</code></td><td>Complete user management: register, login, OAuth2</td></tr><tr><td>Validation</td><td><code>pydantic[email]</code></td><td>Email validation in Pydantic models</td></tr><tr><td>Validation</td><td><code>pydantic-settings</code></td><td>Type-safe settings from environment variables</td></tr><tr><td>Cache</td><td><code>redis[asyncio]</code></td><td>Async Redis client for caching</td></tr><tr><td>Tasks</td><td><code>arq</code></td><td>Async Redis task queue — lighter alternative to Celery</td></tr><tr><td>Rate limit</td><td><code>slowapi</code></td><td>Rate limiting middleware for FastAPI</td></tr><tr><td>Testing</td><td><code>httpx</code></td><td>Async HTTP client for testing FastAPI</td></tr><tr><td>Testing</td><td><code>pytest-asyncio</code></td><td>Run async test functions with pytest</td></tr></table></div><div class=\"cal cal-tip\"><span class=\"cal-title\">&#10003; Framework Selection Guide</span><p><strong>Flask</strong> — best for simple REST APIs, microservices, and when you want maximum flexibility with minimal assumptions. <strong>Django</strong> — best for content-heavy applications, internal tools, teams that value convention, and anything that needs a built-in admin panel. <strong>FastAPI</strong> — best for high-performance async APIs, ML inference endpoints, teams that value type safety and automatic API documentation.</p></div>"},{"id":"fa-04","track":"fastapi","tl":"FastAPI","title":"FastAPI: Advanced Patterns & Background Tasks","sub":"Dependency chains, custom middleware, Celery + arq task queues, SSE, advanced Pydantic, and API versioning.","content":"<h2>Advanced Dependency Injection</h2><p>FastAPI's dependency injection system scales from simple cases (inject a DB session) to complex layered architectures (inject a permissions-checked, rate-limited, request-scoped user object). The key properties: dependencies are composable (they can depend on other dependencies), cacheable (the same dependency instance can be reused within a request), and overridable (for testing).</p><h3>Dependency Chains in Practice</h3><div class=\"cl\">python — layered dependencies</div><pre><code><span class=\"kw\">from</span> fastapi <span class=\"kw\">import</span> <span class=\"nm\">Depends</span>, <span class=\"nm\">HTTPException</span>, status, <span class=\"nm\">Request</span>\n<span class=\"kw\">from</span> fastapi.security <span class=\"kw\">import</span> <span class=\"nm\">OAuth2PasswordBearer</span>\n<span class=\"kw\">from</span> sqlalchemy.ext.asyncio <span class=\"kw\">import</span> <span class=\"nm\">AsyncSession</span>\n<span class=\"kw\">from</span> typing <span class=\"kw\">import</span> <span class=\"fn\">Annotated</span>\n<span class=\"k
