/* Wrap matched ranges of a string in <mark>, merging overlapping ranges */
function highlight(str, indices){
  if (!indices || !indices.length) return escapeHtml(str);
  const sorted = [...indices].sort((a,b) => a[0]-b[0]);
  const merged = [];
  for (const [s,e] of sorted) {
    if (merged.length && s <= merged[merged.length-1][1] + 1) {
      merged[merged.length-1][1] = Math.max(merged[merged.length-1][1], e);
    } else {
      merged.push([s,e]);
    }
  }
  let out = '', last = 0;
  for (const [s,e] of merged) {
    out += escapeHtml(str.slice(last, s));
    out += '<mark>' + escapeHtml(str.slice(s, e+1)) + '</mark>';
    last = e+1;
  }
  out += escapeHtml(str.slice(last));
  return out;
}
function escapeHtml(str){
  return str.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

/* Find all case-insensitive occurrences of `q` inside `str`, as [start,end] index pairs */
function findOccurrences(str, q){
  const lower = str.toLowerCase();
  const ql = q.toLowerCase();
  const out = [];
  let i = 0;
  while ((i = lower.indexOf(ql, i)) !== -1) {
    out.push([i, i + ql.length - 1]);
    i += ql.length;
  }
  return out;
}

/* Build 1-3 highlighted snippets of surrounding context around given index pairs */
function buildSnippetsFromIndices(text, indices, max = 2){
  const snippets = [];
  const used = new Set();
  for (const [s,e] of indices) {
    if (snippets.length >= max) break;
    const start = Math.max(0, s - 60);
    const end = Math.min(text.length, e + 60);
    const key = Math.floor(start/40);
    if (used.has(key)) continue;
    used.add(key);
    const localIndices = indices
      .filter(([is,ie]) => is >= start && ie <= end)
      .map(([is,ie]) => [is-start, ie-start]);
    let snippet = text.slice(start, end);
    let prefix = start > 0 ? '… ' : '';
    let suffix = end < text.length ? ' …' : '';
    snippets.push(prefix + highlight(snippet, localIndices) + suffix);
  }
  return snippets;
}

function renderResults(items){
  if (items.length === 0) return false;
  modalBody.innerHTML = items.map(({item, titleIdx, snippets}) => `
    <div class="sm-result" data-nav="chapter" data-id="${item.id}">
      <div class="sm-result-head">
        <span class="sm-result-badge ${item.track}">${item.track === 'php' ? 'PHP' : 'Laravel'}</span>
        <span class="sm-result-title">${titleIdx.length ? highlight(item.title, titleIdx) : escapeHtml(item.title)}</span>
      </div>
      ${snippets.map(s => `<div class="sm-snippet">${s}</div>`).join('')}
    </div>
  `).join('');
  return true;
}

/* Exact substring search across title + body text. Each chapter contributes
   at most one result, with up to 2 snippets around its best matches. */
function exactSearch(q){
  const results = [];
  for (const item of searchIndex) {
    const titleIdx = findOccurrences(item.title, q);
    const textIdx = findOccurrences(item.text, q);
    if (titleIdx.length === 0 && textIdx.length === 0) continue;
    const snippets = buildSnippetsFromIndices(item.text, textIdx);
    // rank: title matches first, then by number of occurrences
    const score = (titleIdx.length ? -1000 : 0) - (titleIdx.length + textIdx.length);
    results.push({ item, titleIdx, snippets, score });
  }
  results.sort((a,b) => a.score - b.score);
  return results.slice(0, 10);
}

modalInput.addEventListener('input', () => {
  const q = modalInput.value.trim();
  if (q.length < 2) {
    modalBody.innerHTML = `<div class="sm-hint">Type to search across all chapters — titles, code samples, and explanations.</div>`;
    return;
  }

  // 1) Exact (case-insensitive) substring matches -- clean, contiguous highlights
  const exact = exactSearch(q);
  if (renderResults(exact)) return;

  // 2) Fall back to fuzzy matching for typos / close spellings, with a strict threshold
  const fuzzy = fuse.search(q).slice(0, 10);
  const fuzzyItems = fuzzy.map(r => {
    const titleMatch = r.matches.find(m => m.key === 'title');
    const textMatch = r.matches.find(m => m.key === 'text');
    const snippets = textMatch ? buildSnippetsFromIndices(r.item.text, [...textMatch.indices]) : [];
    return { item: r.item, titleIdx: titleMatch ? [...titleMatch.indices] : [], snippets };
  });
  if (renderResults(fuzzyItems)) return;

  modalBody.innerHTML = `<div class="sm-empty">No matches for "${escapeHtml(q)}"</div>`;
});
