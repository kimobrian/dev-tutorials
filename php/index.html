<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHP & Laravel — Zero to API</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">

<style>
:root{
  --bg:#0a0d12;
  --panel:#10141b;
  --panel-2:#161b24;
  --border:#232a35;
  --text:#dde3ec;
  --muted:#8893a3;
  --php:#9089d6;
  --php-soft:#9089d61f;
  --laravel:#ff6b52;
  --laravel-soft:#ff6b521f;
  --accent:#f0b94d;
  --code-bg:#0d1117;
  --good:#5fd0a0;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:"Segoe UI", system-ui, -apple-system, sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.65;
}
a{color:var(--accent); text-decoration:none;}
a:hover{text-decoration:underline;}
::-webkit-scrollbar{width:10px; height:10px;}
::-webkit-scrollbar-thumb{background:var(--border); border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}

/* ===== Layout ===== */
.app{display:flex; min-height:100vh;}

/* ===== Sidebar ===== */
.sidebar{
  width:300px; flex-shrink:0; background:var(--panel);
  border-right:1px solid var(--border);
  height:100vh; overflow-y:auto; position:sticky; top:0;
  padding:22px 16px 40px;
}
.brand{
  font-family: Georgia, 'Times New Roman', serif;
  font-size:1.55rem; font-weight:800; margin:0 4px 22px; letter-spacing:0.3px;
}
.brand .accent{color:var(--accent); font-style:italic; font-weight:600;}
.brand .laravel-word{color:var(--laravel); font-style:italic; font-weight:600;}

.side-label{
  font-size:0.68rem; text-transform:uppercase; letter-spacing:2.5px;
  color:var(--muted); font-weight:700; margin:0 6px 8px;
}
.search-box{position:relative; margin-bottom:22px;}
.search-box input{
  width:100%; padding:10px 12px; border-radius:8px;
  border:1px solid var(--border); background:var(--code-bg);
  color:var(--text); font-size:0.88rem; outline:none;
}
.search-box input:focus{border-color:var(--accent);}
.search-results{
  position:absolute; top:calc(100% + 6px); left:0; right:0;
  background:var(--panel-2); border:1px solid var(--border);
  border-radius:8px; max-height:340px; overflow-y:auto; z-index:60;
  display:none; box-shadow:0 14px 32px rgba(0,0,0,0.55);
}
.search-results.show{display:block;}
.search-results .res-item{padding:10px 12px; border-bottom:1px solid var(--border); cursor:pointer; font-size:0.85rem;}
.search-results .res-item:last-child{border-bottom:none;}
.search-results .res-item:hover{background:var(--php-soft);}
.search-results .res-track{font-size:0.68rem; text-transform:uppercase; letter-spacing:1.5px; color:var(--muted);}
.search-results .res-title{font-weight:600;}
.search-results .res-empty{padding:12px; color:var(--muted); font-size:0.85rem;}

/* ===== Search modal ===== */
.search-modal-overlay{
  position:fixed; inset:0; background:rgba(5,7,11,0.65); backdrop-filter:blur(2px);
  z-index:200; display:none; align-items:flex-start; justify-content:center; padding:10vh 20px 20px;
}
.search-modal-overlay.show{display:flex;}
.search-modal{
  width:100%; max-width:680px; max-height:74vh; background:var(--panel);
  border:1px solid var(--border); border-radius:14px; overflow:hidden;
  display:flex; flex-direction:column; box-shadow:0 24px 60px rgba(0,0,0,0.55);
}
.search-modal-header{
  display:flex; align-items:center; gap:10px; padding:14px 16px; border-bottom:1px solid var(--border);
}
.search-modal-header input{
  flex:1; background:none; border:none; outline:none; color:var(--text); font-size:1rem;
}
.search-modal-header .sm-esc{
  font-size:0.7rem; color:var(--muted); border:1px solid var(--border); border-radius:6px; padding:2px 6px;
}
.search-modal-body{overflow-y:auto; padding:8px;}
.sm-result{
  display:block; padding:12px 14px; border-radius:10px; cursor:pointer; margin-bottom:4px;
}
.sm-result:hover, .sm-result.active{background:var(--panel-2);}
.sm-result-head{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
.sm-result-title{font-weight:700; font-size:0.95rem;}
.sm-result-badge{
  font-size:0.64rem; font-weight:800; letter-spacing:1.5px; text-transform:uppercase;
  padding:3px 7px; border-radius:5px; flex-shrink:0;
}
.sm-result-badge.php{background:var(--php-soft); color:var(--php);}
.sm-result-badge.laravel{background:var(--laravel-soft); color:var(--laravel);}
.sm-snippet{
  font-size:0.83rem; color:var(--muted); line-height:1.55;
  font-family:'Fira Code', Consolas, Monaco, monospace; margin-top:4px;
}
.sm-snippet + .sm-snippet{margin-top:8px;}
.sm-snippet mark, .sm-result-title mark{
  background:var(--accent); color:#1a1306; border-radius:3px; padding:0 2px; font-style:normal;
}
.sm-empty{padding:36px 16px; text-align:center; color:var(--muted); font-size:0.92rem;}
.sm-hint{padding:36px 16px; text-align:center; color:var(--muted); font-size:0.88rem;}

.nav-home{
  display:flex; align-items:center; gap:10px;
  padding:10px 12px; border-radius:9px; color:var(--text);
  font-weight:600; font-size:0.92rem; margin-bottom:22px;
  border:1px solid var(--border); cursor:pointer;
}
.nav-home:hover{border-color:var(--accent); text-decoration:none;}
.nav-home.active{border-color:var(--accent); background:var(--accent)14; color:var(--accent);}

.progress-wrap{margin-bottom:24px;}
.progress-text{font-size:0.8rem; color:var(--muted); margin:4px 6px 8px;}
.progress-bar{height:6px; border-radius:4px; background:var(--code-bg); overflow:hidden; margin:0 6px;}
.progress-fill{height:100%; background:linear-gradient(90deg, var(--php), var(--laravel)); border-radius:4px; transition:width .3s;}

.track-group{margin-bottom:6px;}
.track-head{
  display:flex; align-items:center; gap:10px; width:100%;
  padding:9px 10px; border-radius:8px; cursor:pointer;
  background:none; border:none; color:var(--text); font-weight:700; font-size:0.92rem;
  text-align:left;
}
.track-head:hover{background:var(--panel-2);}
.track-head .dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
.track-head.php .dot{background:var(--php);}
.track-head.laravel .dot{background:var(--laravel);}
.track-head .chev{margin-left:auto; color:var(--muted); font-size:0.75rem; transition:transform .15s;}
.track-head.collapsed .chev{transform:rotate(-90deg);}

.track-list{display:flex; flex-direction:column; gap:1px; padding:4px 0 10px 4px; overflow:hidden;}
.track-list.collapsed{display:none;}
.track-list a{
  display:flex; gap:10px; align-items:baseline; padding:7px 10px 7px 24px;
  border-radius:7px; color:var(--text); font-size:0.86rem; cursor:pointer;
}
.track-list a:hover{background:var(--panel-2); text-decoration:none;}
.track-list a.active{color:var(--text);}
.track-list a.active.php-active{background:var(--php-soft); border-left:3px solid var(--php); padding-left:21px;}
.track-list a.active.laravel-active{background:var(--laravel-soft); border-left:3px solid var(--laravel); padding-left:21px;}
.track-list a .num{color:var(--muted); font-size:0.76rem; min-width:24px; flex-shrink:0;}
.track-list a .check{margin-left:auto; color:var(--good); font-size:0.8rem; flex-shrink:0; opacity:0;}
.track-list a.done .check{opacity:1;}

/* ===== Main ===== */
.main{flex:1; min-width:0;}
.topbar{
  display:flex; justify-content:space-between; align-items:center;
  padding:14px 32px; border-bottom:1px solid var(--border);
  position:sticky; top:0; background:var(--bg)cc; backdrop-filter:blur(6px); z-index:20;
}
.topbar .crumb{font-size:0.82rem; color:var(--muted);}
.topbar .crumb b{color:var(--text);}
.toggle-btn{
  background:var(--panel-2); border:1px solid var(--border); color:var(--text);
  padding:8px 14px; border-radius:8px; cursor:pointer; font-size:0.85rem;
}
.toggle-btn:hover{border-color:var(--accent);}
.menu-toggle{display:none;}

/* ===== Home page ===== */
.home{max-width:1080px; margin:0 auto; padding:56px 32px 90px;}
.home-eyebrow{
  font-size:0.75rem; letter-spacing:3px; text-transform:uppercase; color:var(--muted);
  margin:0 0 14px; font-weight:700;
}
.home h1{
  font-family: Georgia, 'Times New Roman', serif;
  font-size:3.4rem; line-height:1.18; margin:0 0 22px; font-weight:800;
}
.home h1 .it{font-style:italic; color:var(--laravel); font-weight:700;}
.home .lede{font-size:1.12rem; color:var(--muted); max-width:680px; margin:0 0 40px;}

.track-cards{display:grid; grid-template-columns:repeat(2, 1fr); gap:18px; margin-bottom:54px;}
.track-card{
  background:var(--panel); border:1px solid var(--border); border-radius:14px;
  padding:24px; border-top:3px solid var(--border); cursor:pointer; transition:border-color .15s, transform .15s;
}
.track-card:hover{transform:translateY(-2px);}
.track-card.php{border-top-color:var(--php);}
.track-card.laravel{border-top-color:var(--laravel);}
.track-card .emoji{font-size:1.8rem; margin-bottom:10px; display:block;}
.track-card h3{margin:0 0 8px; font-size:1.25rem; font-family:Georgia, serif;}
.track-card p{margin:0 0 14px; color:var(--muted); font-size:0.92rem;}
.track-card .count{font-size:0.78rem; color:var(--muted); font-weight:700; letter-spacing:1px; text-transform:uppercase;}
.track-card.php .count{color:var(--php);}
.track-card.laravel .count{color:var(--laravel);}

.home h2.section-title{
  font-family:Georgia, serif; font-size:1.7rem; margin:0 0 20px; font-weight:800;
}
.chapter-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:14px;}
.chapter-card{
  display:flex; align-items:center; gap:14px;
  background:var(--panel); border:1px solid var(--border); border-radius:12px;
  padding:16px 18px; cursor:pointer; transition:border-color .15s;
}
.chapter-card:hover{border-color:var(--accent);}
.chapter-card .cnum{font-size:0.78rem; color:var(--muted); font-weight:700; min-width:24px;}
.chapter-card .ctitle{font-size:0.92rem; font-weight:600; flex:1;}
.chapter-card .badge{
  font-size:0.66rem; font-weight:800; letter-spacing:1.5px; text-transform:uppercase;
  padding:4px 8px; border-radius:5px; flex-shrink:0;
}
.chapter-card .badge.php{background:var(--php-soft); color:var(--php);}
.chapter-card .badge.laravel{background:var(--laravel-soft); color:var(--laravel);}
.chapter-card .check{color:var(--good); font-size:0.9rem; flex-shrink:0;}

  .track-cards{grid-template-columns:1fr;}

  .home{padding:36px 18px 60px;}
}

/* ===== Chapter content ===== */
.content{max-width:780px; margin:0 auto; padding:36px 32px 90px;}
.content h1{font-family:Georgia, 'Times New Roman', serif; font-size:2.1rem; margin:0 0 6px;}
.chapter-top{display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:6px;}
.chapter-meta{

  padding:4px 10px; border-radius:20px; margin-bottom:18px; font-weight:700;
}
.chapter-meta.php{background:var(--php-soft); color:var(--php);}
.chapter-meta.laravel{background:var(--laravel-soft); color:var(--laravel);}

.complete-toggle{
  display:flex; align-items:center; gap:8px; font-size:0.8rem; color:var(--muted);
  border:1px solid var(--border); border-radius:20px; padding:6px 12px 6px 8px;
  cursor:pointer; white-space:nowrap; user-select:none; flex-shrink:0;
}
.complete-toggle .box{width:16px; height:16px; border-radius:50%; border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:0.7rem;}
.complete-toggle.done{color:var(--good); border-color:var(--good)55;}
.complete-toggle.done .box{background:var(--good); border-color:var(--good); color:#06281c;}

.content h2{font-family:Georgia, 'Times New Roman', serif; font-size:1.45rem; margin:34px 0 12px; padding-top:8px; border-top:1px solid var(--border);}
.content h2:first-of-type{border-top:none; padding-top:0;}
.content h3{font-size:1.12rem; margin:22px 0 8px;}
.content p{margin:0 0 14px;}
.content ul, .content ol{margin:0 0 14px; padding-left:22px;}
.content li{margin-bottom:6px;}
.content strong{color:#fff;}
.content code{background:var(--code-bg); padding:2px 6px; border-radius:4px; font-family:'Fira Code', Consolas, Monaco, monospace; font-size:0.85em; color:#e0a96d;}
pre{background:var(--code-bg); border:1px solid var(--border); border-radius:10px; padding:14px 16px; overflow-x:auto; margin:10px 0 18px; font-size:0.85rem;}
pre code{background:none; padding:0; color:inherit;}
.callout{border-left:4px solid var(--accent); background:#f0b94d14; padding:12px 16px; border-radius:0 8px 8px 0; margin:14px 0; font-size:0.92rem;}
.callout.warn{border-left-color:#f0b429; background:#f0b42914;}
.callout b{display:block; margin-bottom:4px; font-size:0.78rem; text-transform:uppercase; letter-spacing:1px; color:var(--accent);}
.callout.warn b{color:#f0b429;}

.pagenav{display:flex; justify-content:space-between; gap:16px; margin-top:48px; padding-top:24px; border-top:1px solid var(--border);}
.pagenav a{flex:1; border:1px solid var(--border); border-radius:10px; padding:14px 16px; display:flex; flex-direction:column; gap:4px; color:var(--text); transition:border-color .15s; cursor:pointer;}
.pagenav a:hover{border-color:var(--accent); text-decoration:none;}
.pagenav a.next{text-align:right; align-items:flex-end;}
.pagenav .label{font-size:0.7rem; text-transform:uppercase; letter-spacing:2px; color:var(--muted);}
.pagenav .title{font-weight:600; font-size:0.95rem;}
.pagenav .spacer{flex:1;}

@media (max-width:880px){
  .sidebar{position:fixed; left:0; top:0; height:100vh; z-index:100; transform:translateX(-100%); transition:transform .2s; width:280px;}
  .sidebar.open{transform:translateX(0); box-shadow:20px 0 40px rgba(0,0,0,0.5);}
  .menu-toggle{display:inline-block;}
  .content{padding:24px 18px 60px;}
  .pagenav{flex-direction:column;}
  .pagenav a.next{align-items:flex-start; text-align:left;}
}

/* Light mode */
body.light{
  --bg:#f7f6f3; --panel:#ffffff; --panel-2:#f0eee9; --border:#e2dfd8;

}
body.light pre{border-color:#e2dfd8;}

/* ============================================================

const chapters = [

/* ===================== PHP TRACK ===================== */
{
  id: "php-intro",
  track: "php",
  title: "Welcome to PHP & Setting Up",
  html: `
  <h2>What PHP actually is</h2>
  <p>PHP ("PHP: Hypertext Preprocessor") is a <strong>server-side scripting language</strong>. That means PHP code runs on a server, produces output (usually HTML, JSON, or other text), and that output is what gets sent to the browser. The browser never sees your PHP code — only the result.</p>
  <p>This is the single most important mental model for the whole tutorial: every request a browser makes to a PHP-powered page triggers your PHP script to run from top to bottom, produce some output, and then the script's memory is thrown away. Nothing persists between requests unless you explicitly store it somewhere (a file, a database, a session, etc).</p>

  <h2>Why learn plain PHP before Laravel?</h2>
  <p>Laravel is a framework <em>written in PHP</em>. Every "magic" feature it gives you — routing, the database layer, request handling — is built on top of the plain PHP concepts we're about to cover. If you jump straight to Laravel, the framework will feel like magic you can't debug. If you understand plain PHP first, Laravel feels like "oh, this is just a well-organized version of what I'd build myself."</p>

  <h2>Setting up your environment</h2>
  <p>You need three things: PHP itself, a web server (or PHP's built-in one), and a database (we'll use MySQL/MariaDB later). The fastest path on any OS:</p>
  <ol>
    <li><strong>Install PHP 8.x</strong> — on macOS use <code>brew install php</code>, on Ubuntu/Debian use <code>sudo apt install php php-cli php-mysql php-sqlite3</code>, on Windows install via <a href="https://windows.php.net/download" target="_blank">windows.php.net</a> or use Laragon/XAMPP.</li>
    <li><strong>Verify it</strong>: run <code>php -v</code> in your terminal. You should see a version 8.1 or higher.</li>
    <li><strong>Use PHP's built-in server</strong> for development — no Apache/Nginx config needed yet.</li>
  </ol>

  <h3>Your first script</h3>
  <p>Create a folder, e.g. <code>php-tutorial</code>, and inside it a file named <code>index.php</code>:</p>
  <pre><code class="language-php">&lt;?php

echo "Hello, PHP!";
</code></pre>
  <p>PHP code lives between <code>&lt;?php</code> and <code>?&gt;</code> tags. If the file is pure PHP (no HTML mixed in), you can omit the closing <code>?&gt;</code> — this is actually the recommended style to avoid accidental whitespace being sent as output.</p>

  <p>Now run the built-in development server from inside that folder:</p>
  <pre><code class="language-bash">php -S localhost:8000</code></pre>
  <p>Open <code>http://localhost:8000</code> in your browser. You should see <strong>Hello, PHP!</strong>. Every time you save the file and refresh, PHP re-runs the whole script — there's no compile step, which is part of why PHP is so fast to iterate with.</p>

  <div class="callout">
    <b>Mental model</b>
    Think of a .php file as a recipe that gets cooked fresh for every single visitor, every single time. There's no "running" PHP server holding state in memory between requests by default — every request is a clean slate.
  </div>

  <h2>php.ini: where defaults live</h2>
  <p>Every PHP installation has a configuration file called <code>php.ini</code> that controls dozens of runtime defaults: error reporting, max upload size, time zone, memory limits. Find which file is active with <code>php --ini</code>. A few settings worth knowing about early:</p>
  <pre><code class="language-ini">display_errors = On       ; show errors in the browser (dev only!)
error_reporting = E_ALL    ; report every kind of error/warning/notice
memory_limit = 128M         ; max memory a single script can use
upload_max_filesize = 8M
date.timezone = "Africa/Nairobi"</code></pre>
  <p>You can also override most of these per-script with <code>ini_set()</code>, which is handy when you don't control the server's php.ini.</p>

  <h2>Choosing an editor</h2>
  <p>Any text editor works, but <strong>VS Code</strong> with the "PHP Intelephense" extension gives you autocompletion, type-checking hints, and jump-to-definition for free — extremely useful once you start working with classes across multiple files. PhpStorm is a paid alternative with even deeper refactoring tools, popular for larger Laravel projects.</p>

  <h2>A note on PHP versions</h2>
  <p>This tutorial targets <strong>PHP 8.1+</strong>. Features like constructor property promotion, enums, readonly properties, and the <code>match</code> expression were introduced in PHP 8.0/8.1 and are used throughout. If <code>php -v</code> shows 7.x, upgrade before continuing — a lot of "why doesn't this work" confusion when following modern tutorials comes from running an old PHP version.</p>
  `

{
  id: "php-syntax",
  track: "php",
  title: "Syntax, Variables & Data Types",
  html: `
  <h2>Mixing PHP with HTML</h2>
  <p>PHP was originally designed to be embedded directly inside HTML. You can open and close PHP tags as many times as you like in one file:</p>
  <pre><code class="language-php">&lt;!DOCTYPE html&gt;
&lt;html&gt;
&lt;body&gt;
  &lt;h1&gt;&lt;?php echo "Welcome"; ?&gt;&lt;/h1&gt;
  &lt;p&gt;Today is &lt;?= date("l, F j") ?&gt;&lt;/p&gt;
&lt;/body&gt;
&lt;/html&gt;</code></pre>
  <p><code>&lt;?= ?&gt;</code> is shorthand for <code>&lt;?php echo ?&gt;</code> — it's the most common way to print a single value inside HTML templates.</p>

  <h2>Variables</h2>
  <p>Every variable in PHP starts with a <code>$</code> sign. PHP is <strong>dynamically typed</strong> — you don't declare a type, and a variable can hold different types over its lifetime.</p>
  <pre><code class="language-php">&lt;?php
$name = "Kimo";        // string
$age = 30;             // integer
$price = 19.99;        // float
$isActive = true;      // boolean
$nothing = null;       // null

echo "Name: $name, Age: $age";  // double-quoted strings interpolate variables
</code></pre>

  <div class="callout">
    <b>Single vs double quotes</b>
    Single quotes <code>'$name'</code> are taken literally — PHP won't replace <code>$name</code> with its value. Double quotes <code>"$name"</code> interpolate variables. Use single quotes for plain text (slightly faster, no parsing needed) and double quotes whenever you need to insert variables or escape sequences like <code>\\n</code>.
  </div>

  <h2>Core data types</h2>
  <ul>
    <li><strong>string</strong> — text, e.g. <code>"hello"</code></li>
    <li><strong>int</strong> — whole numbers, e.g. <code>42</code></li>
    <li><strong>float</strong> (or double) — decimals, e.g. <code>3.14</code></li>
    <li><strong>bool</strong> — <code>true</code> or <code>false</code></li>
    <li><strong>array</strong> — ordered map of values (covered in depth later)</li>
    <li><strong>null</strong> — the absence of a value</li>
    <li><strong>object</strong> — instances of classes (covered in OOP chapter)</li>
  </ul>

  <h3>Type juggling and type checking</h3>
  <p>PHP will silently convert types when it makes sense — this is called <strong>type juggling</strong>. <code>"5" + 1</code> gives the integer <code>6</code>, because the numeric string is converted automatically. This is convenient but can hide bugs, which is why modern PHP encourages explicit checks and type declarations.</p>
  <pre><code class="language-php">&lt;?php
var_dump("5" + 1);      // int(6)
var_dump("5" . 1);      // string(2) "51"  -- the dot is the concatenation operator
var_dump(gettype(3.14)); // string(6) "double"
var_dump(is_int(42));    // bool(true)
</code></pre>

  <h2>Constants</h2>
  <p>Constants don't use <code>$</code> and, once defined, can't change:</p>
  <pre><code class="language-php">&lt;?php
define('MAX_USERS', 100);
const APP_NAME = 'MyApp'; // const is preferred for compile-time-known values

echo APP_NAME;</code></pre>

  <h2>Heredoc and Nowdoc: multi-line strings</h2>
  <p>When you need to build a large block of text with variable interpolation — an email body, a chunk of HTML — quoted strings get unwieldy. <strong>Heredoc</strong> syntax lets you write a multi-line string that still interpolates variables, without escaping quotes:</p>
  <pre><code class="language-php">&lt;?php
$name = "Amina";
$message = &lt;&lt;&lt;EOT
Dear $name,

Thank you for signing up. Your account is ready.

The Team
EOT;
echo $message;</code></pre>
  <p><strong>Nowdoc</strong> (<code>&lt;&lt;&lt;'EOT'</code> with quotes around the marker) is the single-quote equivalent — no interpolation at all, useful for literal templates or code snippets.</p>

  <h2>Casting and converting types explicitly</h2>
  <p>Rather than relying on implicit type juggling, you can convert explicitly — this is especially important for data coming from <code>$_GET</code>/<code>$_POST</code>, which always arrive as strings:</p>
  <pre><code class="language-php">&lt;?php
$page = (int) "5abc";     // 5 -- casting stops at the first non-numeric character
$price = (float) "19.99"; // 19.99
$flag = (bool) "0";       // false -- the string "0" is falsy
$flag2 = (bool) "0.0";    // true  -- but "0.0" is NOT the special falsy string!
$str = (string) 42;       // "42"

// Function equivalents, slightly more forgiving with whitespace
intval("  42  ");   // 42
floatval("3.14abc"); // 3.14
</code></pre>
  <div class="callout warn">
    <b>Falsy values to memorize</b>
    These all count as <code>false</code> in a boolean context: <code>false</code>, <code>0</code>, <code>0.0</code>, <code>""</code> (empty string), <code>"0"</code> (the string zero), <code>[]</code> (empty array), and <code>null</code>. Every other value, including <code>"0.0"</code> and <code>"false"</code> (as strings!), is truthy. This trips up almost every PHP beginner at least once.
  </div>
  `
},

  <h2>Comparison: == vs ===</h2>
  <p>This is one of the most important things to internalize in PHP. <code>==</code> compares values <em>after</em> type juggling ("loose" comparison). <code>===</code> compares both value <strong>and</strong> type ("strict" comparison).</p>
  <pre><code class="language-php">&lt;?php
var_dump(0 == "a");      // false in PHP 8 (was true in PHP 7!)
var_dump("1" == 1);       // true  -- "1" is converted to 1
var_dump("1" === 1);      // false -- different types
var_dump(null == false);  // true
var_dump(null === false); // false
</code></pre>
  <div class="callout warn">
    <b>Rule of thumb</b>
    Default to <code>===</code> and <code>!==</code> everywhere. Only reach for <code>==</code> when you have a specific, documented reason. This single habit eliminates a huge class of subtle bugs.
  </div>

  <h2>Conditionals</h2>
  <pre><code class="language-php">&lt;?php
$score = 85;

if ($score >= 90) {
    echo "Grade: A";
} elseif ($score >= 80) {
    echo "Grade: B";
} else {
    echo "Grade: C or below";
}

// Ternary operator
$status = ($score >= 60) ? "Pass" : "Fail";

// Null coalescing operator -- very common in real code
$username = $_GET['user'] ?? 'Guest'; // use 'Guest' if $_GET['user'] is unset or null
</code></pre>
  <p>The <code>??</code> null coalescing operator is everywhere in real PHP code, especially when reading data from forms, arrays, or APIs where a key might not exist.</p>

  <h2>Loops</h2>
  <pre><code class="language-php">&lt;?php
// for: when you know how many iterations
for ($i = 1; $i <= 5; $i++) {
    echo $i . " ";
}

// while: condition checked before each iteration
$count = 0;
while ($count < 3) {
    echo "tick ";
    $count++;
}

// foreach: the workhorse for arrays
$fruits = ["apple", "banana", "cherry"];
foreach ($fruits as $fruit) {
    echo $fruit . "\\n";
}

// foreach with key => value, for associative arrays
$prices = ["apple" => 0.5, "banana" => 0.3];
foreach ($prices as $name => $price) {
    echo "$name costs $price\\n";
}
</code></pre>

  <h2>match (PHP 8+)</h2>
  <p><code>match</code> is a more powerful, strict replacement for <code>switch</code>. It uses <code>===</code> comparison, doesn't need <code>break</code>, and returns a value directly.</p>
  <pre><code class="language-php">&lt;?php
$role = "editor";

$permissions = match($role) {
    "admin" => "full access",
    "editor", "author" => "can write posts", // multiple conditions per arm
    default => "read only",
};

echo $permissions; // "can write posts"
</code></pre>

  <h2>switch vs match</h2>
  <p>Before <code>match</code> existed, <code>switch</code> was the standard way to branch on a single value. You'll still see it in older code, so it's worth recognizing — but prefer <code>match</code> in new code.</p>
  <pre><code class="language-php">&lt;?php
switch ($role) {
    case "admin":
        $permissions = "full access";
        break;       // without break, execution "falls through" to the next case!
    case "editor":
    case "author":
        $permissions = "can write posts";
        break;
    default:
        $permissions = "read only";
}
</code></pre>
  <table style="width:100%; border-collapse:collapse; margin:0 0 14px; font-size:0.9rem;">
    <tr style="border-bottom:1px solid var(--border);"><th style="text-align:left; padding:6px;">switch</th><th style="text-align:left; padding:6px;">match</th></tr>
    <tr style="border-bottom:1px solid var(--border);"><td style="padding:6px;">Uses <code>==</code> (loose) comparison</td><td style="padding:6px;">Uses <code>===</code> (strict) comparison</td></tr>
    <tr style="border-bottom:1px solid var(--border);"><td style="padding:6px;">Needs <code>break</code> to avoid fall-through</td><td style="padding:6px;">No fall-through, ever</td></tr>
    <tr><td style="padding:6px;">A statement (doesn't return a value)</td><td style="padding:6px;">An expression (returns a value)</td></tr>
  </table>

  <h2>break and continue with levels</h2>
  <p>Inside nested loops, <code>break</code> and <code>continue</code> normally affect only the innermost loop. You can pass a number to affect an outer loop:</p>
  <pre><code class="language-php">&lt;?php
for ($i = 0; $i < 3; $i++) {
    for ($j = 0; $j < 3; $j++) {
        if ($j === 1) {
            continue 2; // skip to the next iteration of the OUTER loop
        }
        echo "$i,$j ";
    }
}
// Output: 0,0 1,0 2,0
</code></pre>

  <h2>Alternative syntax for templates</h2>
  <p>When PHP is mixed heavily with HTML (as in Blade-less view files), the colon-based alternative syntax is often more readable than curly braces:</p>
  <pre><code class="language-php">&lt;?php if ($loggedIn): ?&gt;
  &lt;p&gt;Welcome back!&lt;/p&gt;
&lt;?php else: ?&gt;
  &lt;p&gt;Please log in.&lt;/p&gt;
&lt;?php endif; ?&gt;

&lt;ul&gt;
&lt;?php foreach ($items as $item): ?&gt;
  &lt;li&gt;&lt;?= htmlspecialchars($item) ?&gt;&lt;/li&gt;
&lt;?php endforeach; ?&gt;
&lt;/ul&gt;</code></pre>
  `

  id: "php-functions",
  track: "php",
  title: "Functions & Scope",
  html: `
  <h2>Defining functions</h2>
  <pre><code class="language-php">&lt;?php
function greet(string $name): string {
    return "Hello, $name!";
}

echo greet("Kimo");</code></pre>
  <p>The <code>: string</code> after the parentheses is a <strong>return type declaration</strong>, and <code>string $name</code> is a <strong>type-hinted parameter</strong>. These aren't required, but using them turns PHP from a "anything goes" language into something much closer to a statically typed one — PHP will throw a <code>TypeError</code> if you pass the wrong type, instead of silently producing garbage output three steps later.</p>

  <h2>Default values, named arguments & variadics</h2>
  <pre><code class="language-php">&lt;?php
function makeUser(string $name, string $role = "member"): array {
    return ['name' => $name, 'role' => $role];
}

makeUser("Amina");                       // role defaults to "member"
makeUser(name: "Amina", role: "admin");  // named arguments (PHP 8+) -- order doesn't matter

// Variadic functions accept any number of arguments
function sum(int ...$numbers): int {
    return array_sum($numbers);
}
echo sum(1, 2, 3, 4); // 10
</code></pre>

  <h2>Scope: the most common beginner trap</h2>
  <p>Variables defined inside a function are <strong>local</strong> to that function — they don't exist outside it, and variables from outside don't exist inside it, even if the names match.</p>
  <pre><code class="language-php">&lt;?php
$counter = 0;

function increment() {
    $counter = $counter + 1; // ERROR-prone: this $counter is a DIFFERENT variable
    return $counter;
}

echo increment(); // 1, not 1-based on the outer $counter
echo $counter;    // still 0 -- the outer variable was never touched
</code></pre>
  <p>To work with outer state, pass it in and return the new value (preferred), or use the <code>global</code> keyword (discouraged — it makes code hard to test and reason about), or use static variables for state that persists across calls within the same request:</p>
  <pre><code class="language-php">&lt;?php
function increment(int $counter): int {
    return $counter + 1;
}
$counter = increment($counter ?? 0);

// static keeps its value between calls, but only for THIS request's lifetime
function callCount(): int {
    static $calls = 0;
    $calls++;
    return $calls;
}
echo callCount(); // 1
echo callCount(); // 2
</code></pre>

  <h2>Arrow functions & closures</h2>
  <p>Closures are anonymous functions you can store in variables or pass around — essential for callbacks used by array functions later.</p>
  <pre><code class="language-php">&lt;?php
$double = fn($x) => $x * 2;       // arrow function, short syntax
echo $double(5); // 10

$multiplier = 3;
$triple = function($x) use ($multiplier) {
    return $x * $multiplier;      // 'use' imports outer variables into the closure
};
echo $triple(5); // 15
</code></pre>

  <h2>Recursion</h2>
  <p>A recursive function calls itself to break a problem into smaller sub-problems. Every recursive function needs a <strong>base case</strong> (when to stop) to avoid infinite recursion.</p>
  <pre><code class="language-php">&lt;?php
function factorial(int $n): int {
    if ($n <= 1) {
        return 1; // base case
    }
    return $n * factorial($n - 1); // recursive case
}

echo factorial(5); // 120

// Recursion is also natural for tree-like data, e.g. nested categories
function countItems(array $tree): int {
    $count = count($tree);
    foreach ($tree as $node) {
        if (!empty($node['children'])) {
            $count += countItems($node['children']);
        }
    }
    return $count;
}
</code></pre>

  <h2>First-class callable syntax (PHP 8.1+)</h2>
  <p>Passing an existing function or method as a callback used to require awkward strings or arrays. PHP 8.1 introduced a cleaner syntax:</p>
  <pre><code class="language-php">&lt;?php
// Old way
$upper = array_map('strtoupper', $names);
$upper = array_map([$this, 'formatName'], $names);

// New first-class callable syntax
$upper = array_map(strtoupper(...), $names);
$upper = array_map($this->formatName(...), $names);
</code></pre>

  <h2>Pure functions and why they matter</h2>
  <p>A function is <strong>pure</strong> if its output depends only on its inputs, and it has no side effects (doesn't modify global state, doesn't write to a database, doesn't print anything). Pure functions are easier to test, reason about, and reuse.</p>
  <pre><code class="language-php">&lt;?php
// Pure -- same input always produces same output, no side effects
function applyTax(float $price, float $rate): float {
    return $price * (1 + $rate);
}

// Impure -- depends on hidden global state AND has a side effect
function applyTaxAndLog(float $price): float {
    global $taxRate;
    $result = $price * (1 + $taxRate);
    file_put_contents('log.txt', "Applied tax: $result\n", FILE_APPEND);
    return $result;
}
</code></pre>
  <p>You don't need to make <em>everything</em> pure, but isolating your business logic (calculations, formatting, validation rules) into pure functions — and pushing side effects (database writes, emails, file I/O) to the edges of your program — makes code dramatically easier to unit test, as you'll see in the Laravel testing chapter.</p>
  `
},

  <h2>Indexed arrays</h2>
  <pre><code class="language-php">&lt;?php
$colors = ["red", "green", "blue"];
echo $colors[0];      // red
$colors[] = "yellow"; // append
unset($colors[1]);    // remove "green" -- leaves a gap in the keys!
echo count($colors);  // 3
</code></pre>

  <h2>Associative arrays — PHP's most-used data structure</h2>
  <p>An associative array maps string (or int) keys to values. Conceptually identical to a dictionary, hash map, or object literal in other languages. This is how PHP represents almost everything: form data, JSON, database rows, configuration.</p>
  <pre><code class="language-php">&lt;?php
$user = [
    'id' => 1,
    'name' => 'Amina Yusuf',
    'email' => 'amina@example.com',
];

echo $user['name'];

// Nested arrays -- common for JSON-like structures
$post = [
    'title' => 'My first post',
    'author' => $user,
    'tags' => ['php', 'tutorial'],
];
echo $post['author']['name'];   // Amina Yusuf
echo $post['tags'][0];          // php
</code></pre>

  <h2>Essential array functions</h2>
  <pre><code class="language-php">&lt;?php
$numbers = [5, 3, 8, 1, 9];

sort($numbers);                 // [1, 3, 5, 8, 9] -- modifies in place
$doubled = array_map(fn($n) => $n * 2, $numbers);
$evens   = array_filter($numbers, fn($n) => $n % 2 === 0);
$total   = array_reduce($numbers, fn($carry, $n) => $carry + $n, 0);

print_r($doubled); // [2, 6, 10, 16, 18]
print_r($evens);   // keeps original keys: [2 => 8]
echo $total;       // 26

// Searching
in_array(8, $numbers);          // true
array_search(8, $numbers);      // returns the key where 8 is found

// Combining
$a = ['a' => 1, 'b' => 2];
$b = ['b' => 99, 'c' => 3];
$merged = array_merge($a, $b);  // ['a'=>1, 'b'=>99, 'c'=>3] -- later keys win
</code></pre>
  <div class="callout">
    <b>array_map / array_filter / array_reduce</b>
    These three functions are the functional-programming backbone of PHP. <code>map</code> transforms every element, <code>filter</code> keeps only elements that pass a test, <code>reduce</code> collapses an array into a single value. Get comfortable with these — Laravel's Collections (covered later) are essentially a fluent, chainable wrapper around exactly these ideas.
  </div>

  <h2>String functions you'll use constantly</h2>
  <pre><code class="language-php">&lt;?php
$s = "  Hello, World!  ";

trim($s);                  // "Hello, World!" -- removes whitespace from both ends
strtolower($s);            // "  hello, world!  "
str_replace("World", "PHP", $s);
strlen($s);                // byte-length of the string
substr($s, 2, 5);          // "Hello"
explode(", ", "a, b, c");  // ["a", "b", "c"] -- string to array
implode("-", ["a","b","c"]); // "a-b-c" -- array to string
sprintf("Price: $%.2f", 19.5); // "Price: $19.50" -- formatted strings
str_contains($s, "World");  // true (PHP 8+)
</code></pre>

  <h2>Sorting with custom logic</h2>
  <p><code>sort()</code> and friends only handle simple cases. For sorting arrays of arrays (e.g. rows from a database) by a specific field, use <code>usort()</code> with a comparison function:</p>
  <pre><code class="language-php">&lt;?php
$users = [
    ['name' => 'Charlie', 'age' => 35],
    ['name' => 'Amina', 'age' => 28],
    ['name' => 'Bashir', 'age' => 42],
];

usort($users, fn($a, $b) => $a['age'] <=> $b['age']); // sort by age, ascending

// The <=> "spaceship operator" returns -1, 0, or 1 -- exactly what sort
// functions expect, and works for numbers and strings alike.

usort($users, fn($a, $b) => $a['name'] <=> $b['name']); // sort by name
</code></pre>

  <h2>More array utilities you'll see often</h2>
  <pre><code class="language-php">&lt;?php
$users = [
    ['id' => 1, 'name' => 'Amina', 'role' => 'admin'],
    ['id' => 2, 'name' => 'Bashir', 'role' => 'editor'],
];

// Pluck a single column -- very common when preparing data for a dropdown
$names = array_column($users, 'name');           // ['Amina', 'Bashir']
$byId  = array_column($users, 'name', 'id');     // [1 => 'Amina', 2 => 'Bashir']

// Remove duplicate values
$tags = array_unique(['php', 'laravel', 'php', 'api']); // ['php', 'laravel', 'api']

// Slice a portion of an array (e.g. for simple pagination)
$page2 = array_slice($users, 10, 10); // skip 10, take 10

// Check structure quickly while debugging
var_dump($users[0]);
print_r($users);
</code></pre>

  <h2>Destructuring with list()</h2>
  <p>You can unpack array values directly into variables — handy for functions that return multiple values:</p>
  <pre><code class="language-php">&lt;?php
function minMax(array $numbers): array {
    return [min($numbers), max($numbers)];
}

[$low, $high] = minMax([4, 1, 9, 3]);
echo "Low: $low, High: $high"; // Low: 1, High: 9

// Works with keys too
['name' => $name, 'role' => $role] = $users[0];
</code></pre>
  `

{
  id: "php-forms-superglobals",
  track: "php",
  title: "Forms & Superglobals",
  html: `
  <h2>What are superglobals?</h2>
  <p>Superglobals are built-in arrays that PHP populates automatically with information about the current request. They're available everywhere — inside any function, any file, without needing to import or pass them.</p>
  <ul>
    <li><code>$_GET</code> — data from the URL query string (<code>?id=5</code>)</li>
    <li><code>$_POST</code> — data submitted via an HTML form with method="POST"</li>
    <li><code>$_REQUEST</code> — merged GET, POST and COOKIE data (avoid — ambiguous about source)</li>
    <li><code>$_SERVER</code> — server and request metadata (URL path, HTTP method, headers...)</li>
    <li><code>$_SESSION</code> — persistent data tied to a visitor across requests (needs <code>session_start()</code>)</li>
    <li><code>$_COOKIE</code> — cookies sent by the browser</li>
    <li><code>$_FILES</code> — uploaded files</li>
  </ul>

  <h2>Building a simple contact form</h2>
  <p><strong>form.php</strong> — the HTML form:</p>
  <pre><code class="language-php">&lt;!DOCTYPE html&gt;
&lt;html&gt;
&lt;body&gt;
  &lt;form action="process.php" method="POST"&gt;
    &lt;label&gt;Name: &lt;input type="text" name="name" required&gt;&lt;/label&gt;&lt;br&gt;
    &lt;label&gt;Email: &lt;input type="email" name="email" required&gt;&lt;/label&gt;&lt;br&gt;
    &lt;label&gt;Message: &lt;textarea name="message"&gt;&lt;/textarea&gt;&lt;/label&gt;&lt;br&gt;
    &lt;button type="submit"&gt;Send&lt;/button&gt;
  &lt;/form&gt;
&lt;/html&gt;</code></pre>

  <p><strong>process.php</strong> — handling the submission:</p>
  <pre><code class="language-php">&lt;?php
// Always check the request method before trusting $_POST
if ($_SERVER['REQUEST_METHOD'] !== 'POST') {
    http_response_code(405);
    exit('Method not allowed');
}

// htmlspecialchars() prevents the value being interpreted as HTML/JS
// when echoed back -- this is your first line of defense against XSS
$name = htmlspecialchars(trim($_POST['name'] ?? ''));
$email = trim($_POST['email'] ?? '');
$message = htmlspecialchars(trim($_POST['message'] ?? ''));

$errors = [];
if ($name === '') {
    $errors[] = "Name is required.";
}
if (!filter_var($email, FILTER_VALIDATE_EMAIL)) {
    $errors[] = "Please provide a valid email.";
}

if (!empty($errors)) {
    foreach ($errors as $error) {
        echo "&lt;p style='color:red'&gt;$error&lt;/p&gt;";
    }
} else {
    echo "&lt;p&gt;Thanks, $name! We'll get back to you at $email.&lt;/p&gt;";
}
</code></pre>

  <div class="callout warn">
    <b>Never trust user input</b>
    Every value in <code>$_GET</code>, <code>$_POST</code>, <code>$_COOKIE</code> and <code>$_FILES</code> comes directly from the visitor's browser and can contain anything — including malicious HTML, JavaScript, or SQL. Always validate (check it's the shape/type you expect) and escape (neutralize special characters) before using it. We'll cover SQL-specific protection (prepared statements) in the database chapter.
  </div>

  <h2>Sessions: remembering a user across requests</h2>
  <pre><code class="language-php">&lt;?php
session_start(); // must be called before ANY output, on every page that uses sessions

// Store data
$_SESSION['user_id'] = 42;
$_SESSION['username'] = 'kimo';

// Read it on a later request
if (isset($_SESSION['user_id'])) {
    echo "Welcome back, " . $_SESSION['username'];
} else {
    echo "Please log in.";
}

// Logging out
session_destroy();
</code></pre>
  <p>Behind the scenes, <code>session_start()</code> sets a cookie (by default named <code>PHPSESSID</code>) in the browser containing a random ID. The actual session data is stored on the <em>server</em> (by default as a file), keyed by that ID. This is how PHP "remembers" a logged-in user without storing sensitive data in the browser itself.</p>

  <h2>Handling file uploads</h2>
  <p>File inputs require <code>enctype="multipart/form-data"</code> on the form, and uploaded files appear in <code>$_FILES</code> rather than <code>$_POST</code>:</p>
  <pre><code class="language-html">&lt;form action="upload.php" method="POST" enctype="multipart/form-data"&gt;
  &lt;input type="file" name="avatar"&gt;
  &lt;button type="submit"&gt;Upload&lt;/button&gt;
&lt;/form&gt;</code></pre>
  <pre><code class="language-php">&lt;?php
if ($_FILES['avatar']['error'] !== UPLOAD_ERR_OK) {
    exit('Upload failed.');
}

// Validate type and size BEFORE moving the file anywhere
$allowed = ['image/jpeg', 'image/png', 'image/webp'];
if (!in_array($_FILES['avatar']['type'], $allowed, true)) {
    exit('Invalid file type.');
}
if ($_FILES['avatar']['size'] > 2 * 1024 * 1024) { // 2MB
    exit('File too large.');
}

// Generate a new, safe filename -- NEVER trust the original filename
$ext = pathinfo($_FILES['avatar']['name'], PATHINFO_EXTENSION);
$filename = bin2hex(random_bytes(16)) . '.' . $ext;
$destination = __DIR__ . '/uploads/' . $filename;

move_uploaded_file($_FILES['avatar']['tmp_name'], $destination);
echo "Saved as $filename";
</code></pre>
  <div class="callout warn">
    <b>Why generate a new filename?</b>
    A file named <code>../../config.php</code> or <code>shell.php</code> uploaded by an attacker could overwrite sensitive files or, if your uploads folder is web-accessible, let them execute arbitrary PHP. Always generate a random name, validate the actual content type (not just the client-supplied MIME type, which can be spoofed), and ideally store uploads outside the web root or in object storage.
  </div>

  <h2>Flash messages: one-time session messages</h2>
  <p>A common pattern after a redirect-after-POST: show a "Task created!" message exactly once, then have it disappear on the next page load. This is what Laravel's <code>session()->flash()</code> does under the hood:</p>
  <pre><code class="language-php">&lt;?php
session_start();

// After a successful action, before redirecting:
$_SESSION['flash'] = "Task created successfully!";
header('Location: /index.php');
exit;
</code></pre>
  <pre><code class="language-php">&lt;?php
// At the top of the next page's view
session_start();
$flash = $_SESSION['flash'] ?? null;
unset($_SESSION['flash']); // remove it so it only shows once
?&gt;
&lt;?php if ($flash): ?&gt;
  &lt;div class="alert"&gt;&lt;?= htmlspecialchars($flash) ?&gt;&lt;/div&gt;
&lt;?php endif; ?&gt;</code></pre>
  `
},

{
  id: "php-oop",
  track: "php",
  title: "Object-Oriented PHP",
  html: `
  <h2>Why OOP?</h2>
  <p>As programs grow, plain functions and arrays scattered everywhere become hard to organize. Object-oriented programming groups <strong>data</strong> (properties) and <strong>behavior</strong> (methods) that belong together into a single unit: a <strong>class</strong>. An <strong>object</strong> is one instance of that class. Laravel is built almost entirely from classes — Controllers, Models, Requests, Jobs are all just classes — so this chapter is essential groundwork.</p>

  <h2>Classes, properties, and methods</h2>
  <pre><code class="language-php">&lt;?php
class Product {
    // Properties: the data each Product instance holds
    public string $name;
    public float $price;
    private int $stock;

    // Constructor: runs automatically when you create a new instance
    public function __construct(string $name, float $price, int $stock) {
        $this->name = $name;
        $this->price = $price;
        $this->stock = $stock;
    }

    // Methods: behavior
    public function isInStock(): bool {
        return $this->stock > 0;
    }

    public function sell(int $quantity): void {
        if ($quantity > $this->stock) {
            throw new InvalidArgumentException("Not enough stock");
        }
        $this->stock -= $quantity;
    }
}

$laptop = new Product("Laptop", 1200.00, 5);
echo $laptop->name;        // Laptop
echo $laptop->isInStock();  // 1 (true)
$laptop->sell(2);
</code></pre>
  <p><code>$this</code> refers to "the current object" — the specific instance the method was called on. <code>public</code>, <code>private</code> and <code>protected</code> control <strong>visibility</strong>: public properties/methods can be accessed from anywhere, private only from within the class itself, and protected from the class and its children (subclasses).</p>

  <h2>Constructor promotion (modern, concise syntax)</h2>
  <p>PHP 8 lets you declare and assign properties directly in the constructor signature — this is the style you'll see constantly in Laravel code:</p>
  <pre><code class="language-php">&lt;?php
class Product {
    public function __construct(
        public string $name,
        public float $price,
        private int $stock = 0,
    ) {}

    public function isInStock(): bool {
        return $this->stock > 0;
    }
}
</code></pre>

  <h2>Inheritance & abstract classes</h2>
  <pre><code class="language-php">&lt;?php
abstract class Shape {
    abstract public function area(): float; // every subclass MUST implement this

    public function describe(): string {
        return "This shape has an area of " . $this->area();
    }
}

class Circle extends Shape {
    public function __construct(private float $radius) {}

    public function area(): float {
        return pi() * $this->radius ** 2;
    }
}

class Rectangle extends Shape {
    public function __construct(private float $width, private float $height) {}

    public function area(): float {
        return $this->width * $this->height;
    }
}

$shapes = [new Circle(3), new Rectangle(4, 5)];
foreach ($shapes as $shape) {
    echo $shape->describe() . "\\n"; // describe() is inherited, area() is overridden per-class
}
</code></pre>
  <p>An <code>abstract class</code> can't be instantiated directly (<code>new Shape()</code> would error) — it exists purely to be extended. This guarantees every subclass implements <code>area()</code> while sharing the common <code>describe()</code> logic.</p>

  <h2>Interfaces</h2>
  <p>An interface defines a <strong>contract</strong> — a set of methods a class promises to implement — without providing any implementation itself. Unlike abstract classes, a class can implement multiple interfaces.</p>
  <pre><code class="language-php">&lt;?php
interface Discountable {
    public function applyDiscount(float $percent): void;
}

class Product implements Discountable {
    public function __construct(public string $name, public float $price) {}

    public function applyDiscount(float $percent): void {
        $this->price -= $this->price * ($percent / 100);
    }
}
</code></pre>
  <p>Interfaces are how Laravel achieves a lot of its flexibility: code can depend on <code>CacheInterface</code> rather than a specific cache implementation, and you can swap Redis for file-based caching without changing any code that uses the interface.</p>

  <h2>Static properties and methods</h2>
  <p><code>static</code> members belong to the <em>class</em> itself, not to any individual instance — useful for counters, factories, or utility functions.</p>
  <pre><code class="language-php">&lt;?php
class User {
    public static int $count = 0;

    public function __construct(public string $name) {
        self::$count++; // 'self' refers to the class itself
    }

    public static function make(string $name): self {
        return new self($name);
    }
}

$u1 = User::make("Amina");
$u2 = User::make("Kimo");
echo User::$count; // 2 -- accessed via :: , not ->
</code></pre>

  <h2>Traits: sharing code without inheritance</h2>
  <p>PHP classes can only extend <em>one</em> parent class, but sometimes several unrelated classes need the same chunk of behavior. A <strong>trait</strong> is a reusable block of methods you can "mix in" to any class:</p>
  <pre><code class="language-php">&lt;?php
trait Loggable {
    protected array $logs = [];

    public function log(string $message): void {
        $this->logs[] = date('Y-m-d H:i:s') . " - $message";
    }

    public function getLogs(): array {
        return $this->logs;
    }
}

trait Timestamps {
    public ?string $createdAt = null;

    public function touchCreatedAt(): void {
        $this->createdAt = date('Y-m-d H:i:s');
    }
}

class Order {
    use Loggable, Timestamps; // mix in both traits

    public function __construct(public string $id) {
        $this->touchCreatedAt();
        $this->log("Order $id created");
    }
}
</code></pre>
  <p>Laravel uses traits extensively — <code>HasFactory</code>, <code>Notifiable</code>, and <code>SoftDeletes</code> are all traits you'll <code>use</code> inside Eloquent models later.</p>

  <h2>Magic methods</h2>
  <p>Methods starting with two underscores have special meaning to PHP and are called automatically in certain situations. You've already met <code>__construct</code>. A few others:</p>
  <pre><code class="language-php">&lt;?php
class Money {
    public function __construct(private int $cents) {}

    // Called when the object is treated as a string, e.g. echo $money;
    public function __toString(): string {
        return sprintf('$%.2f', $this->cents / 100);
    }

    // Called when accessing an undefined/inaccessible property
    public function __get(string $name) {
        if ($name === 'dollars') {
            return $this->cents / 100;
        }
        throw new \Exception("Unknown property: $name");
    }
}

$price = new Money(1999);
echo $price;          // "$19.99" -- __toString is called automatically
echo $price->dollars; // 19.99    -- __get is called automatically
</code></pre>
  <div class="callout">
    <b>Use magic methods sparingly</b>
    They're powerful but make code harder to navigate -- an IDE can't "jump to definition" for a property created dynamically inside <code>__get</code>. Laravel relies on them heavily (Eloquent models use <code>__get</code>/<code>__set</code> for attribute access), but in your own code, prefer explicit methods and properties unless you have a good reason.
  </div>

  <h2>Enums (PHP 8.1+)</h2>
  <p>Enums give a fixed set of named values a proper type, replacing the old pattern of class constants like <code>const STATUS_PENDING = 'pending'</code>:</p>
  <pre><code class="language-php">&lt;?php
enum OrderStatus: string {
    case Pending = 'pending';
    case Shipped = 'shipped';
    case Delivered = 'delivered';

    public function label(): string {
        return match($this) {
            self::Pending => 'Awaiting shipment',
            self::Shipped => 'On its way',
            self::Delivered => 'Delivered',
        };
    }
}

$status = OrderStatus::Shipped;
echo $status->value;       // "shipped"
echo $status->label();     // "On its way"

function process(OrderStatus $status) { /* ... */ } // type-safe parameter
</code></pre>
  `
},

  id: "php-errors",
  track: "php",
  title: "Error Handling & Exceptions",
  html: `
  <h2>Errors vs Exceptions</h2>
  <p>PHP distinguishes between <strong>errors</strong> (problems with the code itself — calling an undefined function, fatal type errors) and <strong>exceptions</strong> (problems that occur during normal program flow that <em>you</em> can anticipate and handle — a file not found, invalid user input, a failed API call). As of PHP 7+, many internal errors are also thrown as <code>Error</code> objects, which share a common ancestor (<code>Throwable</code>) with exceptions, so they can be caught the same way.</p>

  <h2>try / catch / finally</h2>
  <pre><code class="language-php">&lt;?php
function divide(float $a, float $b): float {
    if ($b === 0.0) {
        throw new InvalidArgumentException("Cannot divide by zero");
    }
    return $a / $b;
}

try {
    echo divide(10, 0);
} catch (InvalidArgumentException $e) {
    echo "Error: " . $e->getMessage();
} finally {
    echo "\\n(this always runs, success or failure)";
}
</code></pre>
  <p><code>throw</code> immediately stops execution of the current function and "throws" the exception object up the call stack until something catches it. If nothing catches it, PHP halts the script with a fatal error — which is why uncaught exceptions in production show ugly error pages (and why Laravel wraps everything in a global exception handler, as we'll see later).</p>

  <h2>Catching multiple exception types</h2>
  <pre><code class="language-php">&lt;?php
try {
    $data = json_decode($jsonString, flags: JSON_THROW_ON_ERROR);
    $result = 10 / $divisor;
} catch (JsonException $e) {
    echo "Invalid JSON: " . $e->getMessage();
} catch (DivisionByZeroError $e) {
    echo "Math error: " . $e->getMessage();
} catch (Throwable $e) {
    // Catches absolutely anything else -- a useful last resort
    echo "Unexpected error: " . $e->getMessage();
}
</code></pre>

  <h2>Custom exceptions</h2>
  <p>You can create your own exception classes by extending <code>Exception</code>. This lets calling code catch <em>specific</em> problems by type, which is far more useful than checking error message strings.</p>
  <pre><code class="language-php">&lt;?php
class InsufficientStockException extends Exception {
    public function __construct(public string $product, public int $requested, public int $available) {
        parent::__construct("Cannot fulfill order for $product: requested $requested, only $available available");
    }
}

class Inventory {
    private array $stock = ['widget' => 5];

    public function reserve(string $product, int $quantity): void {
        $available = $this->stock[$product] ?? 0;
        if ($quantity > $available) {
            throw new InsufficientStockException($product, $quantity, $available);
        }
        $this->stock[$product] -= $quantity;
    }
}

try {
    (new Inventory())->reserve('widget', 10);
} catch (InsufficientStockException $e) {
    echo $e->getMessage();
    echo " (You can also access \\$e->product, \\$e->requested, etc.)";
}
</code></pre>

  <h2>Logging vs displaying errors</h2>
  <p>In development, you want to <em>see</em> every notice, warning, and error immediately. In production, you never want raw error details shown to visitors (they can leak file paths, database structure, or other sensitive info), but you absolutely want them logged somewhere you can review.</p>
  <pre><code class="language-php">&lt;?php
// Development settings (e.g. in a local php.ini or at the top of a bootstrap file)
error_reporting(E_ALL);
ini_set('display_errors', '1');

// Production settings
error_reporting(E_ALL);
ini_set('display_errors', '0');
ini_set('log_errors', '1');
ini_set('error_log', '/var/log/php/app-errors.log');
</code></pre>

  <h2>A global exception handler</h2>
  <p>Even with try/catch everywhere, something will eventually slip through. <code>set_exception_handler()</code> registers a function that catches <em>any</em> uncaught exception in the script — the last line of defense, and the manual version of what Laravel's exception handler does automatically.</p>
  <pre><code class="language-php">&lt;?php
set_exception_handler(function (Throwable $e) {
    error_log($e->getMessage() . ' in ' . $e->getFile() . ':' . $e->getLine());

    http_response_code(500);
    if (getenv('APP_ENV') === 'production') {
        echo json_encode(['error' => 'Something went wrong.']);
    } else {
        echo json_encode(['error' => $e->getMessage(), 'trace' => $e->getTraceAsString()]);
    }
});

// Now, anywhere in the app, an uncaught exception is logged and
// produces a clean JSON error response instead of a raw PHP error page
throw new RuntimeException("Database connection failed");
</code></pre>

  <h2>The @ error suppression operator (and why to avoid it)</h2>
  <p>Prefixing an expression with <code>@</code> silences any error it produces:</p>
  <pre><code class="language-php">&lt;?php
$data = @file_get_contents('maybe-missing.txt'); // returns false silently on failure, no warning
</code></pre>
  <div class="callout warn">
    <b>Avoid @ in new code</b>
    It doesn't just hide the <em>warning</em> — it hides the fact that something went wrong at all, making bugs much harder to track down. Instead, check explicitly:
    <pre style="margin-top:8px;"><code class="language-php">if (file_exists('maybe-missing.txt')) {
    $data = file_get_contents('maybe-missing.txt');
} else {
    $data = null; // or throw, or log
}</code></pre>
  </div>

  <h2>Assertions for invariants during development</h2>
  <p><code>assert()</code> checks a condition and throws an <code>AssertionError</code> if it's false — useful for catching "this should never happen" situations during development. In production, assertions can be disabled entirely (zero-cost), so never rely on them for actual validation of user input.</p>
  <pre><code class="language-php">&lt;?php
function withdraw(float $balance, float $amount): float {
    assert($amount > 0, "Withdrawal amount must be positive");
    assert($amount <= $balance, "Insufficient funds");
    return $balance - $amount;
}
</code></pre>
  `
},

{
  id: "php-files-sessions",
  track: "php",
  title: "File Handling & Configuration",
  html: `
  <h2>Reading and writing files</h2>
  <pre><code class="language-php">&lt;?php
// Quick read/write of whole files
file_put_contents('notes.txt', "Hello file system\\n");
$contents = file_get_contents('notes.txt');
echo $contents;

// Append instead of overwrite
file_put_contents('notes.txt', "Another line\\n", FILE_APPEND);

// Line-by-line reading -- memory-efficient for big files
$handle = fopen('notes.txt', 'r');
while (($line = fgets($handle)) !== false) {
    echo "Line: $line";
}
fclose($handle);

// Check existence before acting
if (file_exists('config.json')) {
    $config = json_decode(file_get_contents('config.json'), true); // true = return as array
}
</code></pre>

  <h2>Working with JSON</h2>
  <p>JSON is the universal data interchange format, and you'll use it constantly once we build APIs.</p>
  <pre><code class="language-php">&lt;?php
$data = ['name' => 'Amina', 'roles' => ['admin', 'editor']];

$json = json_encode($data);
echo $json; // {"name":"Amina","roles":["admin","editor"]}

// Decode back -- 'true' as second argument returns associative arrays
// instead of stdClass objects, which is usually what you want
$decoded = json_decode($json, true);
echo $decoded['name']; // Amina

// Pretty printing for readability/debugging
echo json_encode($data, JSON_PRETTY_PRINT);
</code></pre>

  <h2>Organizing code: include, require, and autoloading</h2>
  <p>As your app grows past one file, you'll split code into multiple files. <code>require</code> brings in another file's code and halts with a fatal error if the file is missing; <code>include</code> only emits a warning. <code>require_once</code>/<code>include_once</code> prevent loading the same file twice.</p>
  <pre><code class="language-php">&lt;?php
// db.php
function getConnection() { /* ... */ }

// index.php
require_once 'db.php';
$conn = getConnection();
</code></pre>
  <p>For class-based code, manually requiring every file becomes tedious. The standard solution is <strong>Composer's autoloader</strong>, following the <code>PSR-4</code> naming convention. We'll set this up properly in the database chapter — but the idea is: organize classes into folders matching their namespace, run <code>composer dump-autoload</code>, and then any <code>new App\\Models\\Product()</code> just works without manual <code>require</code> statements.</p>

  <h2>Environment configuration</h2>
  <p>Hardcoding things like database passwords directly in your source code is a security risk and makes it hard to use different settings in development vs production. The standard pattern is a <code>.env</code> file (never committed to version control) containing key=value pairs, loaded at runtime.</p>
  <pre><code class="language-bash"># .env
DB_HOST=127.0.0.1
DB_NAME=myapp
DB_USER=root
DB_PASS=secret</code></pre>
  <pre><code class="language-php">&lt;?php
// A tiny hand-rolled loader (Laravel uses the vlucas/phpdotenv package for this)
function loadEnv(string $path): void {
    foreach (file($path) as $line) {
        $line = trim($line);
        if ($line === '' || str_starts_with($line, '#')) continue;
        [$key, $value] = explode('=', $line, 2);
        putenv("$key=$value");
    }
}

loadEnv(__DIR__ . '/.env');
$dbHost = getenv('DB_HOST');
</code></pre>
  <div class="callout warn">
    <b>Always .gitignore your .env file</b>
    Committing credentials to a Git repository — even a private one — is one of the most common real-world security incidents. Add <code>.env</code> to <code>.gitignore</code> on day one of every project, and commit a <code>.env.example</code> with placeholder values instead.
  </div>

  <h2>Composer and PSR-4 autoloading in practice</h2>
  <p>Composer is PHP's package manager <em>and</em> the standard way to autoload your own classes. Initialize a project with <code>composer init</code>, which creates a <code>composer.json</code>. The key part for autoloading:</p>
  <pre><code class="language-json">{
    "autoload": {
        "psr-4": {
            "App\\": "src/"
        }
    },
    "require": {
        "vlucas/phpdotenv": "^5.6"
    }
}</code></pre>
  <p>This tells Composer: "any class under the <code>App\\</code> namespace lives in the <code>src/</code> folder, following the same path structure." So <code>App\Models\Product</code> maps to <code>src/Models/Product.php</code>.</p>
  <pre><code class="language-php">&lt;?php
// src/Models/Product.php
namespace App\Models;

class Product {
    public function __construct(public string $name, public float $price) {}
}
</code></pre>
  <pre><code class="language-php">&lt;?php
// public/index.php
require __DIR__ . '/../vendor/autoload.php'; // generated by Composer

use App\Models\Product;

$product = new Product("Laptop", 1200);
</code></pre>
  <p>Run <code>composer dump-autoload</code> after adding new classes if autoloading doesn't pick them up immediately (it usually does automatically). This single <code>require</code> at the top of your entry point replaces dozens of manual <code>require_once</code> statements — and it's exactly what every Laravel app's <code>public/index.php</code> does on its very first line.</p>

  <h2>A simple dependency injection container</h2>
  <p>As classes depend on other classes (a controller needs a repository, a repository needs a database connection), manually wiring everything up gets repetitive. A <strong>DI container</strong> is just an object that knows how to build other objects:</p>
  <pre><code class="language-php">&lt;?php
class Container {
    private array $bindings = [];

    public function bind(string $name, callable $factory): void {
        $this->bindings[$name] = $factory;
    }

    public function make(string $name) {
        return ($this->bindings[$name])($this);
    }
}

$container = new Container();
$container->bind(PDO::class, fn() => Database::getConnection());
$container->bind(TaskRepository::class, fn($c) => new TaskRepository($c->make(PDO::class)));

$repo = $container->make(TaskRepository::class);
</code></pre>
  <p>This is a toy version of Laravel's <strong>service container</strong> — when you type-hint <code>TaskRepository $repo</code> in a Laravel controller method, the framework's container resolves the entire dependency chain automatically, the same way <code>make()</code> does here.</p>
  `
},

  id: "php-pdo",
  track: "php",
  title: "Databases with PDO & MySQL",
  html: `
  <h2>PDO: PHP Data Objects</h2>
  <p>PDO is PHP's database abstraction layer — a single, consistent API for talking to MySQL, PostgreSQL, SQLite, and others. We'll use MySQL for this tutorial, but the PDO code barely changes if you switch databases.</p>

  <h3>Setting up the database</h3>
  <p>Assume you have MySQL running and create a database and table:</p>
  <pre><code class="language-sql">CREATE DATABASE tutorial_app;

USE tutorial_app;

CREATE TABLE tasks (
    id INT AUTO_INCREMENT PRIMARY KEY,
    title VARCHAR(255) NOT NULL,
    completed BOOLEAN NOT NULL DEFAULT FALSE,
    created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
);</code></pre>

  <h3>Connecting</h3>
  <pre><code class="language-php">&lt;?php
$host = '127.0.0.1';
$db   = 'tutorial_app';
$user = 'root';
$pass = '';
$charset = 'utf8mb4';

$dsn = "mysql:host=$host;dbname=$db;charset=$charset";

$options = [
    PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION,        // throw exceptions on errors
    PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC,   // rows as associative arrays
    PDO::ATTR_EMULATE_PREPARES => false,                // use REAL prepared statements
];

try {
    $pdo = new PDO($dsn, $user, $pass, $options);
} catch (PDOException $e) {
    throw new PDOException($e->getMessage(), (int)$e->getCode());
}
</code></pre>
  <p>Setting <code>ERRMODE_EXCEPTION</code> is critical — without it, PDO fails <em>silently</em> by default, and you'll spend hours debugging "nothing happened" bugs. With it, any database error throws a catchable <code>PDOException</code>.</p>

  <h2>Prepared statements: the ONLY safe way to query with user input</h2>
  <p>SQL injection is one of the most dangerous and most preventable vulnerabilities. It happens when user input is concatenated directly into a SQL string:</p>
  <pre><code class="language-php">&lt;?php
// NEVER DO THIS
$title = $_POST['title']; // attacker sends: '); DROP TABLE tasks; --
$pdo->query("INSERT INTO tasks (title) VALUES ('$title')"); // catastrophic
</code></pre>
  <p>A <strong>prepared statement</strong> separates the SQL structure from the data. The database receives the query template first, then the values separately — there's no way for the values to be interpreted as SQL syntax, no matter what they contain.</p>
  <pre><code class="language-php">&lt;?php
// Insert
$stmt = $pdo->prepare("INSERT INTO tasks (title, completed) VALUES (:title, :completed)");
$stmt->execute([
    'title' => $_POST['title'],
    'completed' => false,
]);
$newId = $pdo->lastInsertId();

// Select one row
$stmt = $pdo->prepare("SELECT * FROM tasks WHERE id = :id");
$stmt->execute(['id' => $taskId]);
$task = $stmt->fetch(); // returns one row as an associative array, or false

// Select many rows
$stmt = $pdo->prepare("SELECT * FROM tasks WHERE completed = :completed ORDER BY created_at DESC");
$stmt->execute(['completed' => false]);
$tasks = $stmt->fetchAll(); // array of associative arrays

// Update
$stmt = $pdo->prepare("UPDATE tasks SET completed = :completed WHERE id = :id");
$stmt->execute(['completed' => true, 'id' => $taskId]);

// Delete
$stmt = $pdo->prepare("DELETE FROM tasks WHERE id = :id");
$stmt->execute(['id' => $taskId]);
</code></pre>
  <div class="callout">
    <b>:named vs ?positional placeholders</b>
    PDO supports <code>:name</code> placeholders (matched by name, order-independent, very readable) and <code>?</code> placeholders (matched by position). Named placeholders are generally preferred for anything beyond 1-2 parameters because the code stays readable as queries grow.
  </div>

  <h2>A reusable Database connection class</h2>
  <p>Rather than opening a connection in every file, wrap it in a class using the <strong>singleton pattern</strong> — a class that ensures only one instance of itself ever exists, shared everywhere it's needed:</p>
  <pre><code class="language-php">&lt;?php
// src/Database.php
class Database {
    private static ?PDO $instance = null;

    private function __construct() {} // prevent "new Database()" from outside

    public static function getConnection(): PDO {
        if (self::$instance === null) {
            $dsn = "mysql:host=127.0.0.1;dbname=tutorial_app;charset=utf8mb4";
            self::$instance = new PDO($dsn, 'root', '', [
                PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION,
                PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC,
            ]);
        }
        return self::$instance;
    }
}

// Anywhere else in the app:
$pdo = Database::getConnection();
</code></pre>

  <h2>Transactions: all-or-nothing operations</h2>
  <p>Some operations involve multiple related writes that must <em>all</em> succeed or <em>all</em> fail together — e.g. transferring money between two accounts. A <strong>transaction</strong> groups statements so that if anything fails partway through, everything is rolled back.</p>
  <pre><code class="language-php">&lt;?php
$pdo->beginTransaction();

try {
    $pdo->prepare("UPDATE accounts SET balance = balance - :amount WHERE id = :from")
        ->execute(['amount' => 100, 'from' => 1]);

    $pdo->prepare("UPDATE accounts SET balance = balance + :amount WHERE id = :to")
        ->execute(['amount' => 100, 'to' => 2]);

    $pdo->commit(); // both updates are saved permanently
} catch (PDOException $e) {
    $pdo->rollBack(); // neither update is saved -- balances unchanged
    throw $e;
}
</code></pre>
  <p>Without a transaction, if the second query failed (network blip, constraint violation), the first would already be committed — money would vanish from one account without appearing in the other.</p>

  <h2>Fetch modes</h2>
  <p>We set <code>PDO::FETCH_ASSOC</code> as the default, but PDO supports several fetch styles depending on what shape of data you need:</p>
  <pre><code class="language-php">&lt;?php
$stmt = $pdo->query("SELECT * FROM tasks");

$stmt->fetch(PDO::FETCH_ASSOC);   // ['id' => 1, 'title' => 'Buy milk', ...]
$stmt->fetch(PDO::FETCH_OBJ);     // stdClass object: $row->id, $row->title
$stmt->fetch(PDO::FETCH_NUM);     // [0 => 1, 1 => 'Buy milk', ...] -- numeric indices
$stmt->fetchAll(PDO::FETCH_COLUMN, 0); // a flat array of just the first column's values
</code></pre>

  <h2>Counting and aggregate queries</h2>
  <pre><code class="language-php">&lt;?php
// Single scalar value -- fetchColumn() avoids the overhead of fetching a full row
$stmt = $pdo->query("SELECT COUNT(*) FROM tasks WHERE completed = 0");
$pendingCount = $stmt->fetchColumn();

// Parameterized aggregate
$stmt = $pdo->prepare("SELECT COUNT(*) FROM tasks WHERE created_at >= :since");
$stmt->execute(['since' => date('Y-m-d', strtotime('-7 days'))]);
$recentCount = $stmt->fetchColumn();
</code></pre>

  <h2>Indexes: why queries get slow</h2>
  <p>Without an index, <code>WHERE</code> clauses force the database to scan every row ("full table scan"). An index is a sorted lookup structure on one or more columns that makes lookups fast — at the cost of slightly slower writes and extra storage.</p>
  <pre><code class="language-sql">-- Speeds up WHERE completed = ... and ORDER BY created_at
CREATE INDEX idx_tasks_completed ON tasks (completed);
CREATE INDEX idx_tasks_created_at ON tasks (created_at);</code></pre>
  <p>Primary keys and (usually) foreign keys are indexed automatically. As a rule of thumb: any column you frequently filter (<code>WHERE</code>), sort (<code>ORDER BY</code>), or join on is a candidate for an index. We'll revisit this when Laravel migrations define foreign keys.</p>
  `
