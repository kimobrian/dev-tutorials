  title: "Building a CRUD App",
  html: `
  <h2>Putting it together: a Task Manager</h2>
  <p>We now have everything needed to build a real, working application: variables, control flow, functions, OOP, sessions, and a database. Let's build a small task manager with full CRUD (Create, Read, Update, Delete) and a clean folder structure.</p>

  <h3>Project structure</h3>
  <pre><code class="language-text">task-manager/
├── public/
│   └── index.php        # entry point + router
├── src/
│   ├── Database.php
│   └── TaskRepository.php
├── views/
│   ├── index.php
│   └── form.php
└── .env</code></pre>

  <h2>The Repository pattern</h2>
  <p>A <strong>repository</strong> is a class whose only job is to talk to the database for one type of "thing" (here, Tasks). This keeps SQL out of your routing/view code and makes it easy to test or swap the storage layer later.</p>
  <pre><code class="language-php">&lt;?php
// src/TaskRepository.php
class TaskRepository {
    public function __construct(private PDO $pdo) {}

    public function all(): array {
        return $this->pdo->query("SELECT * FROM tasks ORDER BY created_at DESC")->fetchAll();
    }

    public function find(int $id): array|false {
        $stmt = $this->pdo->prepare("SELECT * FROM tasks WHERE id = :id");
        $stmt->execute(['id' => $id]);
        return $stmt->fetch();
    }

    public function create(string $title): int {
        $stmt = $this->pdo->prepare("INSERT INTO tasks (title) VALUES (:title)");
        $stmt->execute(['title' => $title]);
        return (int) $this->pdo->lastInsertId();
    }

    public function toggleComplete(int $id): void {
        $stmt = $this->pdo->prepare(
            "UPDATE tasks SET completed = NOT completed WHERE id = :id"
        );
        $stmt->execute(['id' => $id]);
    }

    public function delete(int $id): void {
        $stmt = $this->pdo->prepare("DELETE FROM tasks WHERE id = :id");
        $stmt->execute(['id' => $id]);
    }
}
</code></pre>

  <h2>A simple front controller</h2>
  <p>Instead of one PHP file per "page", we'll route everything through <code>public/index.php</code> based on a <code>?action=</code> query parameter — a simplified version of what frameworks do with proper routers.</p>
  <pre><code class="language-php">&lt;?php
// public/index.php
require __DIR__ . '/../src/Database.php';
require __DIR__ . '/../src/TaskRepository.php';

$repo = new TaskRepository(Database::getConnection());
$action = $_GET['action'] ?? 'list';

switch ($action) {
    case 'create':
        if ($_SERVER['REQUEST_METHOD'] === 'POST') {
            $title = trim($_POST['title'] ?? '');
            if ($title !== '') {
                $repo->create($title);
            }
            header('Location: /index.php'); // redirect after POST (prevents resubmission)
            exit;
        }
        break;

    case 'toggle':
        $repo->toggleComplete((int) $_GET['id']);
        header('Location: /index.php');
        exit;

    case 'delete':
        $repo->delete((int) $_GET['id']);
        header('Location: /index.php');
        exit;
}

$tasks = $repo->all();
require __DIR__ . '/../views/index.php';
</code></pre>

  <h2>The view</h2>
  <pre><code class="language-php">&lt;?php // views/index.php ?&gt;
&lt;!DOCTYPE html&gt;
&lt;html&gt;
&lt;head&gt;&lt;title&gt;Task Manager&lt;/title&gt;&lt;/head&gt;
&lt;body&gt;
  &lt;h1&gt;My Tasks&lt;/h1&gt;

  &lt;form action="?action=create" method="POST"&gt;
    &lt;input type="text" name="title" placeholder="New task..." required&gt;
    &lt;button type="submit"&gt;Add&lt;/button&gt;
  &lt;/form&gt;

  &lt;ul&gt;
  &lt;?php foreach ($tasks as $task): ?&gt;
    &lt;li style="&lt;?= $task['completed'] ? 'text-decoration: line-through' : '' ?&gt;"&gt;
      &lt;?= htmlspecialchars($task['title']) ?&gt;
      &lt;a href="?action=toggle&amp;id=&lt;?= $task['id'] ?&gt;"&gt;Toggle&lt;/a&gt;
      &lt;a href="?action=delete&amp;id=&lt;?= $task['id'] ?&gt;"&gt;Delete&lt;/a&gt;
    &lt;/li&gt;
  &lt;?php endforeach; ?&gt;
  &lt;/ul&gt;
&lt;/body&gt;
&lt;/html&gt;</code></pre>
  <div class="callout">
    <b>The redirect-after-POST pattern</b>
    Notice that after creating, toggling, or deleting a task, we call <code>header('Location: ...')</code> and <code>exit</code> rather than rendering the view directly. This is the standard "POST/Redirect/GET" pattern — it prevents the browser's "submit again?" warning if the user refreshes the page, because the refresh re-runs a GET request, not the original POST.
  </div>

  <h2>Adding search and filtering</h2>
  <p>Real list views almost always need filtering. Add an optional search term and a status filter to the repository and front controller:</p>
  <pre><code class="language-php">&lt;?php
// TaskRepository.php
public function search(?string $term, ?bool $completed): array {
    $sql = "SELECT * FROM tasks WHERE 1=1";
    $params = [];

    if ($term !== null && $term !== '') {
        $sql .= " AND title LIKE :term";
        $params['term'] = "%$term%";
    }
    if ($completed !== null) {
        $sql .= " AND completed = :completed";
        $params['completed'] = $completed;
    }

    $sql .= " ORDER BY created_at DESC";

    $stmt = $this->pdo->prepare($sql);
    $stmt->execute($params);
    return $stmt->fetchAll();
}
</code></pre>
  <pre><code class="language-php">&lt;?php
// public/index.php
$term = $_GET['q'] ?? null;
$completedParam = $_GET['completed'] ?? null;
$completed = $completedParam === null ? null : (bool) $completedParam;

$tasks = $repo->search($term, $completed);
</code></pre>
  <div class="callout warn">
    <b>The "WHERE 1=1" trick</b>
    Starting the SQL string with a condition that's always true lets every subsequent filter be appended with <code>AND ...</code> without worrying about whether it's the "first" condition. It's a small readability win when building queries dynamically, and is completely safe since it's not user input.
  </div>

  <h2>Pagination</h2>
  <p>Once a table has thousands of rows, loading them all at once is wasteful. SQL's <code>LIMIT</code>/<code>OFFSET</code> fetch one "page" at a time:</p>
  <pre><code class="language-php">&lt;?php
public function paginate(int $page, int $perPage = 10): array {
    $offset = ($page - 1) * $perPage;

    $stmt = $this->pdo->prepare(
        "SELECT * FROM tasks ORDER BY created_at DESC LIMIT :limit OFFSET :offset"
    );
    // LIMIT/OFFSET must be bound as integers explicitly with PDO::PARAM_INT
    $stmt->bindValue(':limit', $perPage, PDO::PARAM_INT);
    $stmt->bindValue(':offset', $offset, PDO::PARAM_INT);
    $stmt->execute();

    return $stmt->fetchAll();
}

public function count(): int {
    return (int) $this->pdo->query("SELECT COUNT(*) FROM tasks")->fetchColumn();
}
</code></pre>
  <pre><code class="language-php">&lt;?php
$page = max(1, (int) ($_GET['page'] ?? 1));
$perPage = 10;
$tasks = $repo->paginate($page, $perPage);
$totalPages = (int) ceil($repo->count() / $perPage);
</code></pre>
  <pre><code class="language-php">&lt;?php // views/index.php -- pagination links ?&gt;
&lt;div class="pagination"&gt;
  &lt;?php for ($i = 1; $i <= $totalPages; $i++): ?&gt;
    &lt;a href="?page=&lt;?= $i ?&gt;" class="&lt;?= $i === $page ? 'active' : '' ?&gt;"&gt;&lt;?= $i ?&gt;&lt;/a&gt;
  &lt;?php endfor; ?&gt;
&lt;/div&gt;</code></pre>
  <p>Keep this <code>LIMIT</code>/<code>OFFSET</code> approach in mind — when we reach Laravel's <code>Post::paginate(15)</code>, it's executing exactly this pattern, plus computing <code>$totalPages</code> and generating the links automatically.</p>
  `

  id: "php-rest-api",
  track: "php",
  title: "Building a REST API in Plain PHP",
  html: `
  <h2>What makes an API "RESTful"</h2>
  <p>REST (Representational State Transfer) is a set of conventions for designing APIs around <strong>resources</strong> (nouns, like "tasks") and standard HTTP methods (verbs):</p>
  <ul>
    <li><code>GET /tasks</code> — list all tasks</li>
    <li><code>GET /tasks/5</code> — get task with id 5</li>
    <li><code>POST /tasks</code> — create a new task</li>
    <li><code>PUT/PATCH /tasks/5</code> — update task 5</li>
    <li><code>DELETE /tasks/5</code> — delete task 5</li>
  </ul>
  <p>Instead of returning HTML, an API returns <strong>JSON</strong>, and uses HTTP status codes meaningfully (200 OK, 201 Created, 404 Not Found, 422 Unprocessable Entity, etc).</p>

  <h2>Setting the right headers</h2>
  <pre><code class="language-php">&lt;?php
header('Content-Type: application/json');

// CORS headers -- required if your frontend (e.g. a React app) runs on a
// different origin/port than your API
header('Access-Control-Allow-Origin: *');
header('Access-Control-Allow-Methods: GET, POST, PUT, PATCH, DELETE, OPTIONS');
header('Access-Control-Allow-Headers: Content-Type, Authorization');

// Browsers send a "preflight" OPTIONS request before real requests for
// non-simple methods -- respond and stop immediately
if ($_SERVER['REQUEST_METHOD'] === 'OPTIONS') {
    http_response_code(200);
    exit;
}
</code></pre>

  <h2>A minimal router</h2>
  <p>Real frameworks have sophisticated routers, but the core idea is simple: inspect the URL path and HTTP method, then call the matching handler.</p>
  <pre><code class="language-php">&lt;?php
// public/api.php
require __DIR__ . '/../src/Database.php';
require __DIR__ . '/../src/TaskRepository.php';

header('Content-Type: application/json');

$repo = new TaskRepository(Database::getConnection());
$method = $_SERVER['REQUEST_METHOD'];

// Strip the script's own path so /api.php/tasks/5 -> /tasks/5
$path = parse_url($_SERVER['REQUEST_URI'], PHP_URL_PATH);
$path = trim(str_replace('/api.php', '', $path), '/');
$segments = explode('/', $path); // e.g. ['tasks', '5']

$resource = $segments[0] ?? null;
$id = isset($segments[1]) ? (int) $segments[1] : null;

function jsonResponse(mixed $data, int $status = 200): never {
    http_response_code($status);
    echo json_encode($data);
    exit;
}

if ($resource !== 'tasks') {
    jsonResponse(['error' => 'Not found'], 404);
}

match (true) {
    $method === 'GET' && $id === null   => jsonResponse($repo->all()),
    $method === 'GET' && $id !== null   => handleShow($repo, $id),
    $method === 'POST'                  => handleCreate($repo),
    $method === 'PUT' || $method === 'PATCH' => handleUpdate($repo, $id),
    $method === 'DELETE'                => handleDelete($repo, $id),
    default => jsonResponse(['error' => 'Method not allowed'], 405),
};

function handleShow(TaskRepository $repo, int $id): never {
    $task = $repo->find($id);
    $task ? jsonResponse($task) : jsonResponse(['error' => 'Task not found'], 404);
}

function handleCreate(TaskRepository $repo): never {
    $input = json_decode(file_get_contents('php://input'), true);

    $title = trim($input['title'] ?? '');
    if ($title === '') {
        jsonResponse(['error' => 'The title field is required'], 422);
    }

    $id = $repo->create($title);
    jsonResponse($repo->find($id), 201);
}

function handleUpdate(TaskRepository $repo, ?int $id): never {
    if ($id === null || !$repo->find($id)) {
        jsonResponse(['error' => 'Task not found'], 404);
    }
    $repo->toggleComplete($id);
    jsonResponse($repo->find($id));
}

function handleDelete(TaskRepository $repo, ?int $id): never {
    if ($id === null || !$repo->find($id)) {
        jsonResponse(['error' => 'Task not found'], 404);
    }
    $repo->delete($id);
    jsonResponse(null, 204);
}
</code></pre>

  <h2>Reading the request body</h2>
  <p>For JSON APIs, clients send data in the request <em>body</em> as JSON, not as <code>$_POST</code> form fields. You read it with <code>php://input</code>:</p>
  <pre><code class="language-php">&lt;?php
$rawBody = file_get_contents('php://input');
$data = json_decode($rawBody, true);
// $data is now a normal associative array, e.g. ['title' => 'Buy milk']
</code></pre>

  <h2>Testing the API</h2>
  <p>To try these endpoints, we need something that can send HTTP requests with a chosen method, headers, and body — a browser's address bar only sends simple <code>GET</code> requests. <strong>curl</strong> is a command-line tool for making HTTP requests, pre-installed on macOS and most Linux distributions (and available for Windows). Each flag below maps directly to a part of the request: <code>-X</code> sets the HTTP method, <code>-H</code> adds a header, and <code>-d</code> sends a request body.</p>
  <pre><code class="language-bash"># List tasks
curl http://localhost:8000/api.php/tasks

# Create a task
curl -X POST http://localhost:8000/api.php/tasks \\
  -H "Content-Type: application/json" \\
  -d '{"title": "Learn PHP APIs"}'

# Get one task
curl http://localhost:8000/api.php/tasks/1

# Delete
curl -X DELETE http://localhost:8000/api.php/tasks/1</code></pre>

  <div class="callout">
    <b>What this exercise teaches</b>
    Building this by hand shows you exactly what a framework router, request object, and response object are <em>for</em>. When you reach Laravel's <code>Route::apiResource()</code>, you'll recognize it as a clean abstraction over the match-on-method-and-path pattern you just wrote yourself.
  </div>

  <h2>Pagination in APIs</h2>
  <p>JSON APIs paginate the same way, but the metadata travels alongside the data so clients know how to fetch the next page:</p>
  <pre><code class="language-php">&lt;?php
$page = max(1, (int) ($_GET['page'] ?? 1));
$perPage = 10;

$tasks = $repo->paginate($page, $perPage);
$total = $repo->count();

jsonResponse([
    'data' => $tasks,
    'meta' => [
        'page' => $page,
        'per_page' => $perPage,
        'total' => $total,
        'total_pages' => (int) ceil($total / $perPage),
    ],
]);
</code></pre>

  <h2>Versioning your API</h2>
  <p>Once an API has real consumers, changing response shapes can break their code. <strong>Versioning</strong> lets you evolve the API while old clients keep working. The simplest approach is a version segment in the URL:</p>
  <pre><code class="language-text">/api/v1/tasks
/api/v2/tasks   -- new response shape, new clients opt in</code></pre>
  <pre><code class="language-php">&lt;?php
// crude routing example
$segments = explode('/', trim($path, '/')); // ['v1', 'tasks']
$version = $segments[0] ?? 'v1';
$resource = $segments[1] ?? null;

if ($version === 'v1') {
    require __DIR__ . '/../src/Api/V1/router.php';
} elseif ($version === 'v2') {
    require __DIR__ . '/../src/Api/V2/router.php';
} else {
    jsonResponse(['error' => 'Unknown API version'], 404);
}
</code></pre>

  <h2>Basic rate limiting</h2>
  <p>Without limits, a single client (or attacker) could hammer your API with thousands of requests per second. A simple approach using a file or cache to track request counts per IP:</p>
  <pre><code class="language-php">&lt;?php
function rateLimit(string $key, int $maxRequests, int $windowSeconds): void {
    $file = sys_get_temp_dir() . '/ratelimit_' . md5($key);
    $data = file_exists($file) ? json_decode(file_get_contents($file), true) : ['count' => 0, 'reset' => time() + $windowSeconds];

    if (time() > $data['reset']) {
        $data = ['count' => 0, 'reset' => time() + $windowSeconds];
    }

    $data['count']++;
    file_put_contents($file, json_encode($data));

    if ($data['count'] > $maxRequests) {
        header('Retry-After: ' . ($data['reset'] - time()));
        jsonResponse(['error' => 'Too many requests'], 429);
    }
}

// At the top of api.php
rateLimit($_SERVER['REMOTE_ADDR'], maxRequests: 60, windowSeconds: 60);
</code></pre>
  <p>This file-based approach is fine for learning, but in production you'd use Redis or Memcached for shared, fast counters across multiple servers — which is exactly what Laravel's <code>throttle</code> middleware does (covered later).</p>
  <div class="callout">
    <b>What are Redis and Memcached?</b>
    Both are <strong>in-memory data stores</strong> — they keep data in RAM rather than on disk, making reads and writes extremely fast, at the cost of that data not surviving a restart (unless configured to persist). They're used as a shared, fast layer for things like caching, rate-limit counters, and session storage across multiple web servers. <strong>Redis</strong> is the more feature-rich of the two (supports lists, sets, pub/sub) and is the default choice in most modern PHP/Laravel setups; <strong>Memcached</strong> is simpler and purely a cache. Neither is required to follow this tutorial — file-based or database-based alternatives work fine for development.
  </div>

  <h2>Returning consistent error shapes</h2>
  <p>Clients benefit hugely from every error response having the same structure, regardless of what went wrong:</p>
  <pre><code class="language-php">&lt;?php
function errorResponse(string $message, int $status, array $details = []): never {
    jsonResponse([
        'error' => [
            'message' => $message,
            'status' => $status,
            'details' => $details,
        ],
    ], $status);
}

// Usage
errorResponse('Validation failed', 422, ['title' => 'The title field is required']);
errorResponse('Task not found', 404);
</code></pre>
  `
},

  id: "php-security",
  track: "php",
  title: "Security Essentials",
  html: `
  <h2>Password hashing</h2>
  <p>Never store passwords in plain text, and never use fast general-purpose hashes like MD5 or SHA-1 for passwords — they're designed to be fast, which makes them easy to brute-force. PHP's built-in <code>password_hash()</code> uses bcrypt by default, which is intentionally slow and includes a random "salt" automatically.</p>
  <pre><code class="language-php">&lt;?php
// When a user registers
$hashed = password_hash($_POST['password'], PASSWORD_DEFAULT);
// Store $hashed in the database -- NEVER the raw password

// When a user logs in
$user = $repo->findByEmail($_POST['email']);
if ($user && password_verify($_POST['password'], $user['password_hash'])) {
    // correct password
    session_regenerate_id(true); // prevent session fixation attacks
    $_SESSION['user_id'] = $user['id'];
} else {
    // Use a generic message -- don't reveal whether the email or password was wrong
    echo "Invalid credentials";
}
</code></pre>

  <h2>SQL Injection — recap</h2>
  <p>Covered in depth earlier: <strong>always</strong> use prepared statements with PDO. Never build SQL strings via concatenation or string interpolation with user input, no matter how "safe" the value looks (even integers from <code>$_GET</code> should go through bound parameters or be explicitly cast with <code>(int)</code>).</p>

  <h2>Cross-Site Scripting (XSS)</h2>
  <p>XSS happens when user-supplied content is rendered as HTML/JS in someone else's browser. The fix is to escape output with <code>htmlspecialchars()</code> whenever you print user-controlled data into HTML:</p>
  <pre><code class="language-php">&lt;?php
// If $comment contains "&lt;script&gt;alert('hacked')&lt;/script&gt;"...
echo $comment;                       // DANGEROUS: script executes in the browser
echo htmlspecialchars($comment);     // SAFE: renders as literal text
</code></pre>

  <h2>Cross-Site Request Forgery (CSRF)</h2>
  <p>CSRF tricks a logged-in user's browser into submitting a request to your site without their knowledge (e.g. via a malicious link or auto-submitting form on another site). The defense is a unique, unpredictable <strong>token</strong> embedded in every form, which the server verifies on submission.</p>
  <pre><code class="language-php">&lt;?php
// Generating a token (store it in the session)
if (empty($_SESSION['csrf_token'])) {
    $_SESSION['csrf_token'] = bin2hex(random_bytes(32));
}
$token = $_SESSION['csrf_token'];
</code></pre>
  <pre><code class="language-html">&lt;form method="POST" action="/process.php"&gt;
  &lt;input type="hidden" name="csrf_token" value="&lt;?= $token ?&gt;"&gt;
  ...
&lt;/form&gt;</code></pre>
  <pre><code class="language-php">&lt;?php
// Verifying on submission -- hash_equals() prevents timing attacks
if (!hash_equals($_SESSION['csrf_token'], $_POST['csrf_token'] ?? '')) {
    http_response_code(419);
    exit('Invalid CSRF token');
}
</code></pre>
  <p>Laravel does all of this automatically via the <code>@csrf</code> Blade directive and <code>VerifyCsrfToken</code> middleware — but knowing what it's protecting against is what makes that middleware make sense.</p>

  <h2>Validating and sanitizing input</h2>
  <pre><code class="language-php">&lt;?php
filter_var('user@example.com', FILTER_VALIDATE_EMAIL); // returns the email or false
filter_var('not-a-number', FILTER_VALIDATE_INT);        // false
filter_var('123', FILTER_VALIDATE_INT);                 // 123 (int)

// Type-casting is also a form of validation
$page = (int) ($_GET['page'] ?? 1);  // "abc" becomes 0, "5abc" becomes 5
$page = max(1, $page);               // enforce a minimum
</code></pre>

  <h2>HTTPS and security headers</h2>
  <p>In production, always serve over HTTPS (so credentials and session cookies can't be intercepted), and configure session cookies with <code>secure</code>, <code>httponly</code>, and <code>samesite</code> flags:</p>
  <pre><code class="language-php">&lt;?php
session_set_cookie_params([
    'secure' => true,    // only sent over HTTPS
    'httponly' => true,  // inaccessible to JavaScript -- mitigates XSS cookie theft
    'samesite' => 'Lax', // mitigates CSRF
]);
session_start();
</code></pre>
  <div class="callout">
    <b>The big picture</b>
    Every one of these protections corresponds to a feature Laravel gives you "for free": hashed passwords via <code>Hash::make()</code>, Eloquent's parameter binding, Blade's automatic escaping with <code>{{ }}</code>, CSRF middleware, and validation rules. You're not learning these to reinvent them forever — you're learning them so the framework's defaults make sense and so you can debug when something doesn't behave as expected.
  </div>

  <h2>Brute-force protection on login</h2>
  <p>Without protection, an attacker can try thousands of password guesses per second against a login form. Combine rate limiting (from the API chapter) with account-level lockouts:</p>
  <pre><code class="language-php">&lt;?php
$attempts = $_SESSION['login_attempts'] ?? 0;
$lockedUntil = $_SESSION['locked_until'] ?? 0;

if (time() < $lockedUntil) {
    exit('Too many failed attempts. Try again later.');
}

if (!password_verify($_POST['password'], $user['password_hash'])) {
    $attempts++;
    $_SESSION['login_attempts'] = $attempts;

    if ($attempts >= 5) {
        $_SESSION['locked_until'] = time() + (60 * 5); // 5-minute lockout
    }
    exit('Invalid credentials');
}

// success -- reset counters
unset($_SESSION['login_attempts'], $_SESSION['locked_until']);
</code></pre>

  <h2>Mass assignment</h2>
  <p>If you ever build an "update profile" form by looping over <code>$_POST</code> and writing each field directly to the database, you've created a mass-assignment vulnerability: an attacker can add an extra field like <code>is_admin=1</code> to the form submission.</p>
  <pre><code class="language-php">&lt;?php
// DANGEROUS -- updates ANY column the attacker includes in the POST body
foreach ($_POST as $key => $value) {
    $fields[] = "$key = :$key";
}
$pdo->prepare("UPDATE users SET " . implode(', ', $fields) . " WHERE id = :id")
    ->execute([...$_POST, 'id' => $userId]);

// SAFE -- explicitly whitelist which fields can be updated
$allowed = ['name', 'email', 'bio'];
$updates = array_intersect_key($_POST, array_flip($allowed));
</code></pre>
  <p>This is precisely the problem Eloquent's <code>$fillable</code> property (seen in the Laravel track) solves at the framework level.</p>

  <h2>Dependency security</h2>
  <p>Every Composer package you install is code you're trusting to run inside your application. Keep dependencies updated and check for known vulnerabilities:</p>
  <pre><code class="language-bash">composer outdated         # see which packages have newer versions
composer audit             # check installed packages against known CVEs</code></pre>

  <h2>A security checklist for going live</h2>
  <ul>
    <li>All user input validated and/or escaped before use (SQL, HTML, file paths, shell commands)</li>
    <li>Passwords hashed with <code>password_hash()</code>, never reversible encryption</li>
    <li><code>display_errors</code> off, errors logged instead</li>
    <li>HTTPS enforced, secure session cookie flags set</li>
    <li>CSRF tokens on all state-changing forms</li>
    <li>Rate limiting on authentication and public API endpoints</li>
    <li><code>.env</code> excluded from version control and the web root</li>
    <li>Dependencies kept up to date</li>
  </ul>
  `
},

{
  id: "laravel-intro",
  track: "laravel",
  title: "Introduction to Laravel",
  html: `
  <h2>What Laravel gives you</h2>
  <p>Everything in the PHP track — routing, request/response handling, database access, validation, security — Laravel provides as polished, well-tested, conventionally-organized components. Laravel is an implementation of the <strong>MVC (Model-View-Controller)</strong> architectural pattern:</p>
  <ul>
    <li><strong>Model</strong> — represents data and business rules (built on Eloquent, Laravel's ORM)</li>
    <li><strong>View</strong> — what gets rendered to the user (Blade templates)</li>
    <li><strong>Controller</strong> — receives requests, talks to models, returns a view or response</li>
  </ul>
  <p>Recognize this? It's the same separation you built by hand in the CRUD chapter: <code>TaskRepository</code> (Model-ish), <code>views/index.php</code> (View), and <code>index.php</code>'s routing logic (Controller-ish). Laravel formalizes and extends that structure.</p>

  <h2>Installation</h2>
  <p>Laravel requires Composer (PHP's package manager) and PHP 8.2+. Create a new project:</p>
  <pre><code class="language-bash"># Install the Laravel installer (one-time)
composer global require laravel/installer

# Create a new project
laravel new my-app
cd my-app

# Or directly via Composer without the installer
composer create-project laravel/laravel my-app

# Run the development server
php artisan serve</code></pre>
  <p>Visit <code>http://localhost:8000</code> — you should see the Laravel welcome page.</p>

  <h2>Project structure tour</h2>
  <pre><code class="language-text">my-app/
├── app/
│   ├── Http/
│   │   ├── Controllers/   # request handlers
│   │   └── Middleware/     # request/response filters
│   ├── Models/             # Eloquent models
│   └── Providers/          # service registration
├── routes/
│   ├── web.php             # routes returning HTML/views
│   └── api.php             # routes returning JSON
├── database/
│   ├── migrations/         # version-controlled schema changes
│   └── seeders/            # sample/test data
├── resources/
│   └── views/               # Blade templates
├── config/                  # configuration files
├── .env                     # environment-specific config (DB credentials etc.)
└── artisan                  # command-line tool</code></pre>

  <h2>Artisan: Laravel's CLI</h2>
  <p>Artisan is Laravel's command-line tool for code generation, database tasks, and maintenance. You'll use it constantly:</p>
  <pre><code class="language-bash">php artisan serve              # start dev server
php artisan make:controller PostController
php artisan make:model Post
php artisan make:migration create_posts_table
php artisan migrate            # run pending migrations
php artisan route:list         # show all registered routes
php artisan tinker             # interactive PHP REPL with app loaded</code></pre>

  <h2>The .env file and config</h2>
  <p>Remember the hand-rolled <code>.env</code> loader from the plain-PHP track? Laravel does exactly that, automatically, on every request, via the <code>vlucas/phpdotenv</code> package. Values are accessed through <code>config()</code> helpers rather than <code>getenv()</code> directly — config files in <code>config/</code> read from <code>env()</code> once and cache the result:</p>
  <pre><code class="language-bash"># .env
DB_CONNECTION=mysql
DB_HOST=127.0.0.1
DB_PORT=3306
DB_DATABASE=my_app
DB_USERNAME=root
DB_PASSWORD=</code></pre>
  <pre><code class="language-php">&lt;?php
// config/database.php (excerpt) -- reads from .env, falls back to defaults
'mysql' => [
    'host' => env('DB_HOST', '127.0.0.1'),
    'database' => env('DB_DATABASE', 'forge'),
    'username' => env('DB_USERNAME', 'forge'),
],
</code></pre>
  <div class="callout">
    <b>Why this matters</b>
    Once you've built a config loader by hand, you know <em>why</em> Laravel caches config in production (<code>php artisan config:cache</code>) — reading and parsing <code>.env</code> on every single request, like our hand-rolled version did, is genuinely slow at scale.
  </div>

  <h2>Tinker: a REPL for your app</h2>
  <p><code>php artisan tinker</code> opens an interactive PHP shell with your entire Laravel application already loaded — models, config, helpers, everything. It's invaluable for quick experiments without writing a route or controller:</p>
  <pre><code class="language-bash">php artisan tinker</code></pre>
  <pre><code class="language-php">&gt;&gt;&gt; User::count()
=&gt; 12

&gt;&gt;&gt; User::first()
=&gt; App\Models\User {#...}

&gt;&gt;&gt; User::create(['name' => 'Test', 'email' => 'test@example.com', 'password' => bcrypt('secret')])

&gt;&gt;&gt; config('app.name')
=&gt; "Laravel"
</code></pre>

  <h2>The service container, briefly</h2>
  <p>Recall the hand-rolled DI container from the plain-PHP track — a <code>Container</code> class that knew how to build objects and resolve their dependencies. Laravel's <strong>service container</strong> is the production-grade version of exactly that idea, and it underlies almost everything: when a controller method type-hints a class, Laravel's container resolves it automatically.</p>
  <pre><code class="language-php">&lt;?php
// Laravel resolves TaskRepository (and whatever IT depends on) automatically
class TaskController extends Controller {
    public function index(TaskRepository $repo) {
        return $repo->all();
    }
}

// You can also resolve things manually
$repo = app(TaskRepository::class);
// or
$repo = resolve(TaskRepository::class);
</code></pre>
  <p>For most day-to-day Laravel work you won't interact with the container directly — but understanding that it exists explains "magic" like why type-hinting a class in a constructor or controller method just works.</p>

  <h2>Artisan commands you'll reach for constantly</h2>
  <pre><code class="language-bash">php artisan make:controller PostController
php artisan make:model Post -m          # -m also creates a migration
php artisan make:migration add_status_to_posts_table
php artisan make:request StorePostRequest
php artisan make:resource PostResource
php artisan make:factory PostFactory
php artisan make:seeder PostSeeder
php artisan db:seed                      # run seeders
php artisan tinker                       # interactive shell
php artisan route:list --path=posts      # filter routes by path</code></pre>
  `
},

{
  id: "laravel-routing-blade",
  track: "laravel",
  title: "Routing, Controllers & Blade",
  html: `
  <h2>Defining routes</h2>
  <p>Routes live in <code>routes/web.php</code> (for browser-facing pages) and <code>routes/api.php</code> (for JSON APIs). A route maps a URL + HTTP method to a piece of code.</p>
  <pre><code class="language-php">&lt;?php
// routes/web.php
use Illuminate\\Support\\Facades\\Route;
use App\\Http\\Controllers\\PostController;

Route::get('/', function () {
    return view('welcome');
});

Route::get('/posts', [PostController::class, 'index']);
Route::get('/posts/{id}', [PostController::class, 'show']);
Route::post('/posts', [PostController::class, 'store']);
Route::put('/posts/{id}', [PostController::class, 'update']);
Route::delete('/posts/{id}', [PostController::class, 'destroy']);

// Route parameters can be type-constrained
Route::get('/posts/{id}', [PostController::class, 'show'])->whereNumber('id');
</code></pre>
  <p>Notice this is the exact same set of (method, path) pairs you wrote a <code>match</code> statement for in the plain-PHP API chapter — Laravel's router is doing the same job, just registered declaratively and matched internally with much more sophistication (named routes, groups, middleware, etc).</p>

  <h2>Resource routes — the shortcut</h2>
  <p>Because CRUD routes follow such a predictable pattern, Laravel provides a one-liner:</p>
  <pre><code class="language-php">&lt;?php
Route::resource('posts', PostController::class);
// Generates all 7 routes: index, create, store, show, edit, update, destroy</code></pre>
  <p>Run <code>php artisan route:list</code> to see exactly what that expands to.</p>

  <h2>Controllers</h2>
  <pre><code class="language-bash">php artisan make:controller PostController --resource</code></pre>
  <pre><code class="language-php">&lt;?php
namespace App\\Http\\Controllers;

use App\\Models\\Post;
use Illuminate\\Http\\Request;

class PostController extends Controller
{
    public function index()
    {
        $posts = Post::latest()->get(); // Eloquent -- covered in depth next chapter
        return view('posts.index', ['posts' => $posts]);
    }

    public function show(int $id)
    {
        $post = Post::findOrFail($id); // 404s automatically if not found
        return view('posts.show', ['post' => $post]);
    }

    public function store(Request $request)
    {
        $validated = $request->validate([
            'title' => 'required|string|max:255',
            'body' => 'required|string',
        ]);

        $post = Post::create($validated);

        return redirect()->route('posts.show', $post->id)
            ->with('success', 'Post created!');
    }
}
</code></pre>
  <p>Compare <code>Post::findOrFail($id)</code> to the plain-PHP <code>TaskRepository::find()</code> — same idea (look up a row by id), but Eloquent throws a <code>ModelNotFoundException</code> automatically, which Laravel's exception handler converts into a 404 response. That's the "uncaught exception → exception handler" pattern from the error-handling chapter, applied at the framework level.</p>

  <h2>Blade templates</h2>
  <p>Blade is Laravel's templating engine. Blade files end in <code>.blade.php</code> and live in <code>resources/views</code>.</p>
  <pre><code class="language-blade">{{-- resources/views/posts/index.blade.php --}}
@extends('layouts.app')

@section('content')
  &lt;h1&gt;All Posts&lt;/h1&gt;

  @if ($posts->isEmpty())
    &lt;p&gt;No posts yet.&lt;/p&gt;
  @else
    &lt;ul&gt;
      @foreach ($posts as $post)
        &lt;li&gt;
          &lt;a href="{{ route('posts.show', $post->id) }}"&gt;{{ $post->title }}&lt;/a&gt;
        &lt;/li&gt;
      @endforeach
    &lt;/ul&gt;
  @endif
@endsection</code></pre>
  <p><code>{{ $post->title }}</code> automatically runs through <code>htmlspecialchars()</code> — this is Blade's built-in XSS protection, the same escaping you did manually in plain PHP. If you genuinely need raw, unescaped HTML output (rare, and only for trusted content), use <code>{!! $raw !!}</code>.</p>

  <h3>Layouts and includes</h3>
  <pre><code class="language-blade">{{-- resources/views/layouts/app.blade.php --}}
&lt;!DOCTYPE html&gt;
&lt;html&gt;
&lt;head&gt;&lt;title&gt;My App&lt;/title&gt;&lt;/head&gt;
&lt;body&gt;
  @include('partials.nav')

  &lt;main&gt;@yield('content')&lt;/main&gt;
&lt;/body&gt;
&lt;/html&gt;</code></pre>
  <p><code>@extends</code>, <code>@section</code>/<code>@yield</code>, and <code>@include</code> are how Blade avoids repeating your <code>&lt;html&gt;</code>, <code>&lt;head&gt;</code>, navigation, etc on every page — the templating equivalent of the <code>require</code>-based partials you'd write in plain PHP.</p>

  <h2>Route groups</h2>
  <p>Group related routes to share a prefix, middleware, or namespace without repeating yourself:</p>
  <pre><code class="language-php">&lt;?php
Route::prefix('admin')->middleware(['auth', 'admin'])->group(function () {
    Route::get('/dashboard', [AdminController::class, 'dashboard']);
    Route::get('/users', [AdminController::class, 'users']);
    // both become /admin/dashboard and /admin/users, both require auth+admin middleware
});

// Named route groups -- useful for generating URLs consistently
Route::name('admin.')->group(function () {
    Route::get('/admin/dashboard', [AdminController::class, 'dashboard'])->name('dashboard');
    // referenced elsewhere as route('admin.dashboard')
});
</code></pre>

  <h2>Named routes</h2>
  <p>Hardcoding URLs throughout your views and controllers is fragile -- if a URL changes, every reference breaks. Named routes let you refer to a route by name instead:</p>
  <pre><code class="language-php">&lt;?php
Route::get('/posts/{id}', [PostController::class, 'show'])->name('posts.show');
</code></pre>
  <pre><code class="language-blade">&lt;a href="{{ route('posts.show', $post->id) }}"&gt;{{ $post->title }}&lt;/a&gt;</code></pre>
  <p>If <code>/posts/{id}</code> later becomes <code>/articles/{id}</code>, you only update the route definition -- every <code>route('posts.show', ...)</code> call across hundreds of views keeps working unchanged.</p>

  <h2>Blade components</h2>
  <p>For reusable UI pieces (a button, a card, an alert), Blade components are cleaner than <code>@include</code> -- they accept props like mini-templates with their own logic:</p>
  <pre><code class="language-bash">php artisan make:component Alert</code></pre>
  <pre><code class="language-php">&lt;?php
// app/View/Components/Alert.php
class Alert extends Component {
    public function __construct(public string $type = 'info') {}

    public function render() {
        return view('components.alert');
    }
}
</code></pre>
  <pre><code class="language-blade">{{-- resources/views/components/alert.blade.php --}}
&lt;div class="alert alert-{{ $type }}"&gt;
  {{ $slot }}
&lt;/div&gt;</code></pre>
  <pre><code class="language-blade">{{-- Usage in any view --}}
&lt;x-alert type="success"&gt;
  Post created successfully!
&lt;/x-alert&gt;</code></pre>

  <h2>Common Blade directives reference</h2>
  <pre><code class="language-blade">{{-- Output (auto-escaped) --}}
{{ $variable }}

{{-- Conditionals --}}
@if($condition) ... @elseif(...) ... @else ... @endif
@unless($condition) ... @endunless

{{-- Loops --}}
@foreach($items as $item) ... @endforeach
@forelse($items as $item) ... @empty No items @endforelse

{{-- Loop variable --}}
@foreach($items as $item)
  {{ $loop->index }} / {{ $loop->count }} -- {{ $loop->first ? 'first!' : '' }}
@endforeach

{{-- CSRF token for forms --}}
&lt;form method="POST"&gt;
  @csrf
  @method('PUT') {{-- spoof PUT/DELETE, since HTML forms only support GET/POST --}}
&lt;/form&gt;</code></pre>
  `
},

{
  id: "laravel-eloquent",
  track: "laravel",
  title: "Eloquent ORM & Migrations",
  html: `
  <h2>Migrations: version control for your database schema</h2>
  <p>A migration is a PHP class describing a change to your database schema (creating a table, adding a column, etc). Migrations are run in order and tracked in a <code>migrations</code> table, so every developer and every environment (local, staging, production) ends up with an identical schema by running the same commands.</p>
  <pre><code class="language-bash">php artisan make:migration create_posts_table</code></pre>
  <pre><code class="language-php">&lt;?php
// database/migrations/xxxx_create_posts_table.php
use Illuminate\\Database\\Migrations\\Migration;
use Illuminate\\Database\\Schema\\Blueprint;
use Illuminate\\Support\\Facades\\Schema;

return new class extends Migration
{
    public function up(): void
    {
        Schema::create('posts', function (Blueprint $table) {
            $table->id();                                  // auto-incrementing primary key
            $table->string('title');
            $table->text('body');
            $table->foreignId('user_id')->constrained();   // foreign key to users.id
            $table->boolean('published')->default(false);
            $table->timestamps();                          // created_at, updated_at
        });
    }

    public function down(): void
    {
        Schema::dropIfExists('posts');
    }
};
</code></pre>
  <pre><code class="language-bash">php artisan migrate           # apply pending migrations
php artisan migrate:rollback  # undo the last batch
php artisan migrate:fresh     # drop everything and re-run from scratch</code></pre>
  <p>Compare this to the raw <code>CREATE TABLE</code> statement we wrote by hand earlier — migrations are that same SQL, but expressed in PHP, versioned in Git alongside your code, and reversible.</p>

  <h2>Eloquent Models</h2>
  <pre><code class="language-bash">php artisan make:model Post</code></pre>
  <pre><code class="language-php">&lt;?php
namespace App\\Models;

use Illuminate\\Database\\Eloquent\\Model;

class Post extends Model
{
    // Eloquent assumes table name "posts" (snake_case, plural of class name)
    // and a primary key column "id" -- override with $table / $primaryKey if needed

    protected $fillable = ['title', 'body', 'user_id', 'published'];

    public function user()
    {
        return $this->belongsTo(User::class);
    }
}
</code></pre>
  <p><code>$fillable</code> is a security feature: it whitelists which attributes can be set via mass-assignment (e.g. <code>Post::create($request->all())</code>). Without it, an attacker could potentially set <em>any</em> column — including things like <code>is_admin</code> — by adding extra fields to a form submission.</p>

  <h2>Querying with the Eloquent Query Builder</h2>
  <pre><code class="language-php">&lt;?php
// All of these compile to prepared statements under the hood -- no manual escaping needed

Post::all();                                    // SELECT * FROM posts
Post::find(5);                                  // SELECT * FROM posts WHERE id = 5
Post::findOrFail(5);                            // same, but 404s if not found
Post::where('published', true)->get();          // SELECT * FROM posts WHERE published = 1
Post::where('title', 'like', '%laravel%')->get();
Post::orderBy('created_at', 'desc')->limit(10)->get();
Post::where('published', true)->latest()->paginate(15); // pagination built in

// Creating
$post = Post::create([
    'title' => 'Hello Eloquent',
    'body' => '...',
    'user_id' => auth()->id(),
]);

// Updating
$post = Post::find(5);
$post->title = 'Updated title';
$post->save();
// or in one line:
Post::find(5)->update(['title' => 'Updated title']);

// Deleting
Post::find(5)->delete();
</code></pre>

  <h2>Relationships</h2>
  <p>This is where Eloquent shines compared to hand-written SQL. Define relationships once on the model, then traverse them like properties:</p>
  <pre><code class="language-php">&lt;?php
class User extends Model {
    public function posts() {
        return $this->hasMany(Post::class);
    }
}

class Post extends Model {
    public function user() {
        return $this->belongsTo(User::class);
    }
    public function tags() {
        return $this->belongsToMany(Tag::class); // many-to-many via pivot table
    }
}

// Usage
$user = User::find(1);
foreach ($user->posts as $post) {  // note: no parentheses -- accessed as a property
    echo $post->title;
}

$post = Post::find(1);
echo $post->user->name; // "belongs to" -- the author's name
foreach ($post->tags as $tag) {
    echo $tag->name;
}
</code></pre>

  <h2>The N+1 problem and eager loading</h2>
  <p>If you loop over 50 posts and access <code>$post->user->name</code> on each, that's <strong>1 query for the posts + 50 queries for each user</strong> — the "N+1" problem. Eager loading with <code>with()</code> fixes this by fetching related data in a second, single query:</p>
  <pre><code class="language-php">&lt;?php
// Bad: 1 + N queries
$posts = Post::all();
foreach ($posts as $post) {
    echo $post->user->name; // triggers a query EVERY iteration
}

// Good: 2 queries total, regardless of how many posts
$posts = Post::with('user')->get();
foreach ($posts as $post) {
    echo $post->user->name; // no extra query -- already loaded
}
</code></pre>
  <div class="callout warn">
    <b>Watch for this in code review</b>
    The N+1 problem is probably the single most common Laravel performance bug in real applications. Laravel even has a package, "Laravel Debugbar" or the built-in <code>DB::listen()</code>, to spot it — if you ever see query counts scale linearly with the number of rows displayed, suspect a missing <code>with()</code>.
  </div>

  <h2>Accessors, mutators & casts</h2>
  <p>Sometimes a database column needs transforming whenever it's read or written -- formatting a price, hashing a password, decoding JSON. Eloquent handles this with <strong>casts</strong> (for simple type conversions) and <strong>accessors/mutators</strong> (for custom logic).</p>
  <pre><code class="language-php">&lt;?php
class Post extends Model {
    protected function casts(): array {
        return [
            'published' => 'boolean',
            'published_at' => 'datetime',
            'metadata' => 'array',       // automatically json_encode/json_decode
        ];
    }

    // Accessor: runs whenever $post->excerpt is accessed
    protected function excerpt(): Attribute {
        return Attribute::make(
            get: fn() => str($this->body)->limit(100),
        );
    }

    // Mutator: runs whenever $post->title = ... is set
    protected function title(): Attribute {
        return Attribute::make(
            set: fn(string $value) => ucfirst(trim($value)),
        );
    }
}

$post = Post::find(1);
echo $post->excerpt;        // computed on the fly, not a real column
$post->title = '  my post'; // stored as "My post"
</code></pre>

  <h2>Query scopes</h2>
  <p>Reusable query fragments -- instead of repeating <code>->where('published', true)</code> everywhere:</p>
  <pre><code class="language-php">&lt;?php
class Post extends Model {
    public function scopePublished($query) {
        return $query->where('published', true);
    }

    public function scopeByAuthor($query, $userId) {
        return $query->where('user_id', $userId);
    }
}

// Usage -- reads almost like English
Post::published()->byAuthor($userId)->latest()->get();
</code></pre>

  <h2>Soft deletes</h2>
  <p>Instead of permanently removing a row, "soft delete" sets a <code>deleted_at</code> timestamp -- the record is hidden from normal queries but can be restored.</p>
  <pre><code class="language-php">&lt;?php
// migration
Schema::table('posts', function (Blueprint $table) {
    $table->softDeletes(); // adds nullable deleted_at column
});

// model
class Post extends Model {
    use SoftDeletes;
}

$post->delete();              // sets deleted_at, doesn't remove the row
Post::all();                   // soft-deleted posts excluded automatically
Post::withTrashed()->get();    // include soft-deleted
Post::onlyTrashed()->get();    // only soft-deleted
$post->restore();              // un-delete
$post->forceDelete();          // permanently remove
</code></pre>

  <h2>Database seeding</h2>
  <p>Seeders populate your database with sample data -- useful for development and demos. Combined with <strong>factories</strong>, you can generate realistic fake data using <strong>Faker</strong>, a library (accessed via the <code>fake()</code> helper) that generates random-but-realistic values — names, emails, paragraphs of text, dates — so your seeded data looks like real content instead of "test123":</p>
  <pre><code class="language-bash">php artisan make:factory PostFactory
php artisan make:seeder PostSeeder</code></pre>
  <pre><code class="language-php">&lt;?php
// database/factories/PostFactory.php
class PostFactory extends Factory {
    public function definition(): array {
        return [
            'title' => fake()->sentence(),
            'body' => fake()->paragraphs(3, true),
            'published' => fake()->boolean(80), // 80% chance of true
            'user_id' => User::factory(),
        ];
    }
}
</code></pre>
  <pre><code class="language-php">&lt;?php
// database/seeders/DatabaseSeeder.php
public function run(): void {
    User::factory(5)->create()->each(function ($user) {
        Post::factory(10)->create(['user_id' => $user->id]);
    });
}
</code></pre>
  <pre><code class="language-bash">php artisan db:seed</code></pre>
  `
},

{
  id: "laravel-validation-middleware",
  track: "laravel",
  title: "Validation, Form Requests & Middleware",
  html: `
  <h2>Validation in controllers</h2>
  <p>Remember the manual validation in the plain-PHP forms chapter — checking <code>$_POST['name']</code> isn't empty, checking the email format? Laravel's <code>validate()</code> does all of that declaratively:</p>
  <pre><code class="language-php">&lt;?php
public function store(Request $request)
{
    $validated = $request->validate([
        'title' => 'required|string|max:255',
        'email' => 'required|email|unique:users,email',
        'age' => 'nullable|integer|min:18',
        'role' => 'required|in:admin,editor,viewer',
    ]);

    // If validation fails, Laravel automatically redirects back with errors
    // and old input -- this line only runs if everything passed
    User::create($validated);

    return redirect('/users')->with('success', 'User created');
}
</code></pre>
  <p>In the Blade view, validation errors and old input are available automatically via the <code>$errors</code> variable and <code>old()</code> helper:</p>
  <pre><code class="language-blade">&lt;input type="text" name="title" value="{{ old('title') }}"&gt;
@error('title')
  &lt;p class="error"&gt;{{ $message }}&lt;/p&gt;
@enderror</code></pre>

  <h2>Form Request classes</h2>
  <p>For complex validation, extract it into its own class — this keeps controllers focused on orchestration rather than validation rules:</p>
  <pre><code class="language-bash">php artisan make:request StorePostRequest</code></pre>
  <pre><code class="language-php">&lt;?php
namespace App\\Http\\Requests;

use Illuminate\\Foundation\\Http\\FormRequest;

class StorePostRequest extends FormRequest
{
    public function authorize(): bool
    {
        return true; // or e.g. $this->user()->can('create', Post::class)
    }

    public function rules(): array
    {
        return [
            'title' => 'required|string|max:255',
            'body' => 'required|string|min:10',
            'published' => 'boolean',
        ];
    }
}
</code></pre>
  <pre><code class="language-php">&lt;?php
// Controller: type-hint the Form Request instead of Request
public function store(StorePostRequest $request)
{
    // $request->validated() returns only the validated fields
    Post::create($request->validated());
    return redirect('/posts');
}
</code></pre>
  <p>Laravel automatically resolves the Form Request, runs <code>authorize()</code> and <code>rules()</code> <em>before</em> your controller method body even executes. If validation fails, your controller code never runs at all — Laravel redirects back with errors.</p>

  <h2>Middleware: request/response filters</h2>
  <p>Middleware sits "between" the incoming request and your controller (and between your response and the browser). It's the formal version of the "check this before doing that" guards you'd write manually — like checking <code>$_SESSION['user_id']</code> at the top of every protected plain-PHP page.</p>
  <pre><code class="language-bash">php artisan make:middleware EnsureUserIsAdmin</code></pre>
  <pre><code class="language-php">&lt;?php
namespace App\\Http\\Middleware;

use Closure;
use Illuminate\\Http\\Request;

class EnsureUserIsAdmin
{
    public function handle(Request $request, Closure $next)
    {
        if (!$request->user() || !$request->user()->is_admin) {
            abort(403, 'Unauthorized');
        }

        return $next($request); // pass control to the next middleware / controller
    }
}
</code></pre>
  <p>Register it (in <code>bootstrap/app.php</code> for Laravel 11+, or <code>app/Http/Kernel.php</code> for earlier versions) and apply it to routes:</p>
  <pre><code class="language-php">&lt;?php
Route::get('/admin/dashboard', [AdminController::class, 'index'])
    ->middleware('admin');

// Or group multiple routes
Route::middleware(['auth', 'admin'])->group(function () {
    Route::get('/admin/users', [AdminController::class, 'users']);
    Route::get('/admin/settings', [AdminController::class, 'settings']);
});
</code></pre>
  <div class="callout">
    <b>Built-in middleware you'll use constantly</b>
    <code>auth</code> (must be logged in), <code>guest</code> (must NOT be logged in — for login/register pages), <code>throttle:60,1</code> (rate-limit to 60 requests/minute), and <code>verified</code> (email must be verified). Laravel's CSRF protection is also implemented as middleware (<code>VerifyCsrfToken</code>), applied automatically to the <code>web</code> middleware group.
  </div>

  <h2>Custom validation rules</h2>
  <p>For validation logic beyond the built-in rules (e.g. "this code must match a specific format and not already be used this month"), create a custom rule class:</p>
  <pre><code class="language-bash">php artisan make:rule StrongPassword</code></pre>
  <pre><code class="language-php">&lt;?php
namespace App\Rules;

use Illuminate\Contracts\Validation\ValidationRule;
use Closure;

class StrongPassword implements ValidationRule
{
    public function validate(string $attribute, mixed $value, Closure $fail): void
    {
        if (strlen($value) < 8) {
            $fail('The :attribute must be at least 8 characters.');
        }
        if (!preg_match('/[A-Z]/', $value)) {
            $fail('The :attribute must contain an uppercase letter.');
        }
        if (!preg_match('/[0-9]/', $value)) {
            $fail('The :attribute must contain a number.');
        }
    }
}
</code></pre>
  <pre><code class="language-php">&lt;?php
$request->validate([
    'password' => ['required', new StrongPassword()],
]);
</code></pre>

  <h2>Conditional validation</h2>
  <pre><code class="language-php">&lt;?php
$request->validate([
    'discount_code' => 'nullable|string',
    // required only if 'has_discount' is true
    'discount_amount' => 'required_if:has_discount,true|numeric|min:0',
    // must be one of these specific values
    'status' => 'required|in:draft,published,archived',
    // array validation -- each tag must be a string, max 5 tags
    'tags' => 'array|max:5',
    'tags.*' => 'string|max:20',
]);
</code></pre>

  <h2>Rate limiting middleware</h2>
  <p>Remember the hand-rolled file-based rate limiter from the plain-PHP API chapter? Laravel's <code>throttle</code> middleware does the same job using the cache (Redis in production), with near-zero code:</p>
  <pre><code class="language-php">&lt;?php
// routes/api.php
Route::middleware('throttle:60,1')->group(function () {
    // max 60 requests per minute per user/IP
    Route::apiResource('posts', PostController::class);
});

// Different limits for different routes
Route::post('/login', [AuthController::class, 'login'])
    ->middleware('throttle:5,1'); // stricter limit on login attempts
</code></pre>
  <p>When the limit is exceeded, Laravel automatically returns a <code>429 Too Many Requests</code> response with <code>Retry-After</code> headers -- exactly the response shape we built by hand earlier.</p>

  <h2>Middleware execution order & terminable middleware</h2>
  <p>Middleware runs in the order it's registered, wrapping the request like layers of an onion: each middleware's code <em>before</em> <code>$next($request)</code> runs on the way in, and code <em>after</em> runs on the way out (in reverse order). Some middleware implement a <code>terminate()</code> method that runs <em>after</em> the response has been sent to the browser -- useful for logging or cleanup that shouldn't delay the response.</p>
  `
},

{
  id: "laravel-auth",
  track: "laravel",
  title: "Authentication & Authorization",
  html: `
  <h2>From scratch to Breeze</h2>
  <p>In plain PHP, we built login by hand: hashing passwords with <code>password_hash()</code>, verifying with <code>password_verify()</code>, storing a user ID in <code>$_SESSION</code>, and regenerating the session ID on login. Laravel formalizes this entirely, and starter kits like <strong>Laravel Breeze</strong> scaffold a complete, secure auth system in minutes.</p>
  <pre><code class="language-bash">composer require laravel/breeze --dev
php artisan breeze:install
npm install && npm run dev
php artisan migrate</code></pre>
  <div class="callout">
    <b>What is npm?</b>
    Breeze's login/register pages need some CSS and JavaScript building (Tailwind CSS, Alpine.js). <strong>npm</strong> (Node Package Manager) is to JavaScript what Composer is to PHP — it installs front-end packages listed in <code>package.json</code> and runs build scripts. <code>npm install</code> downloads those packages, and <code>npm run dev</code> starts <strong>Vite</strong>, a build tool that compiles your CSS/JS and serves it during development. This requires <a href="https://nodejs.org" target="_blank">Node.js</a> to be installed alongside PHP.
  </div>
  <p>This generates login, registration, password reset, and email verification — all routes, controllers, and Blade views — wired up to a <code>users</code> table migration that already exists in fresh Laravel projects.</p>

  <h2>The users table & User model</h2>
  <pre><code class="language-php">&lt;?php
// database/migrations/xxxx_create_users_table.php (default, comes with Laravel)
Schema::create('users', function (Blueprint $table) {
    $table->id();
    $table->string('name');
    $table->string('email')->unique();
    $table->timestamp('email_verified_at')->nullable();
    $table->string('password'); // already hashed -- Laravel casts this automatically
    $table->rememberToken();
    $table->timestamps();
});
</code></pre>
  <pre><code class="language-php">&lt;?php
// app/Models/User.php (excerpt)
class User extends Authenticatable
{
    protected $fillable = ['name', 'email', 'password'];

    protected $hidden = ['password', 'remember_token']; // never include in JSON output

    protected function casts(): array {
        return [
            'email_verified_at' => 'datetime',
            'password' => 'hashed', // Laravel 10+ auto-hashes on assignment
        ];
    }
}
</code></pre>

  <h2>Logging in and out manually</h2>
  <pre><code class="language-php">&lt;?php
use Illuminate\\Support\\Facades\\Auth;

// Login
if (Auth::attempt(['email' => $email, 'password' => $password])) {
    request()->session()->regenerate(); // same security practice as plain PHP!
    return redirect()->intended('/dashboard');
}
return back()->withErrors(['email' => 'Invalid credentials']);

// Logout
Auth::logout();
request()->session()->invalidate();
request()->session()->regenerateToken();

// Current user, anywhere in the app
$user = Auth::user();
$id = Auth::id();
if (Auth::check()) { /* logged in */ }
</code></pre>

  <h2>Authorization: Gates and Policies</h2>
  <p>Authentication answers "who are you?". Authorization answers "what are you allowed to do?". A <strong>Policy</strong> is a class with methods describing what a user can do to a given model:</p>
  <pre><code class="language-bash">php artisan make:policy PostPolicy --model=Post</code></pre>
  <pre><code class="language-php">&lt;?php
namespace App\\Policies;

use App\\Models\\Post;
use App\\Models\\User;

class PostPolicy
{
    public function update(User $user, Post $post): bool
    {
        return $user->id === $post->user_id; // only the author can edit
    }

    public function delete(User $user, Post $post): bool
    {
        return $user->id === $post->user_id || $user->is_admin;
    }
}
</code></pre>
  <pre><code class="language-php">&lt;?php
// In a controller
public function update(Request $request, Post $post)
{
    $this->authorize('update', $post); // throws 403 automatically if it fails
    // ...
}
</code></pre>
  <pre><code class="language-blade">{{-- In a Blade view --}}
@can('update', $post)
  &lt;a href="{{ route('posts.edit', $post) }}"&gt;Edit&lt;/a&gt;
@endcan</code></pre>

  <h2>API authentication with Sanctum</h2>
  <p>For APIs (especially ones consumed by a separate frontend, like a React or Vue SPA, or mobile app), session cookies don't always make sense. <strong>Laravel Sanctum</strong> issues lightweight API tokens.</p>
  <pre><code class="language-bash">composer require laravel/sanctum
php artisan vendor:publish --provider="Laravel\\Sanctum\\SanctumServiceProvider"
php artisan migrate</code></pre>
  <pre><code class="language-php">&lt;?php
// Issue a token (e.g. in a login endpoint)
$token = $user->createToken('api-token')->plainTextToken;
return response()->json(['token' => $token]);

// Protect routes
Route::middleware('auth:sanctum')->get('/user', function (Request $request) {
    return $request->user();
});
</code></pre>
  <pre><code class="language-bash"># Client sends the token in the Authorization header
curl http://localhost:8000/api/user \\
  -H "Authorization: Bearer 1|abcdef123456..."</code></pre>

  <h2>Password reset flow</h2>
  <p>Breeze scaffolds this, but understanding the flow helps when customizing it. It mirrors the email-verification pattern: generate a signed, time-limited token, email a link containing it, and verify the token before allowing a password change.</p>
  <pre><code class="language-php">&lt;?php
use Illuminate\Support\Facades\Password;

// Step 1: user requests a reset -- send them an email with a token link
Password::sendResetLink(['email' => $request->email]);

// Step 2: user clicks the link, submits new password + token
$status = Password::reset(
    $request->only('email', 'password', 'password_confirmation', 'token'),
    function ($user, $password) {
        $user->forceFill(['password' => $password])->save();
    }
);
</code></pre>

  <h2>Roles and permissions</h2>
  <p>For anything beyond a simple <code>is_admin</code> boolean, a roles/permissions system lets you express "editors can publish posts but not delete users". You can build this yourself with a few tables (<code>roles</code>, <code>permissions</code>, pivot tables), or use a well-tested package like <strong>spatie/laravel-permission</strong>:</p>
  <pre><code class="language-bash">composer require spatie/laravel-permission
php artisan vendor:publish --provider="Spatie\Permission\PermissionServiceProvider"
php artisan migrate</code></pre>
  <pre><code class="language-php">&lt;?php
$user->assignRole('editor');
$user->givePermissionTo('publish posts');

if ($user->can('publish posts')) { /* ... */ }
if ($user->hasRole('admin')) { /* ... */ }
</code></pre>
  <pre><code class="language-php">&lt;?php
// In routes
Route::middleware(['auth', 'role:admin'])->group(function () {
    Route::get('/admin/dashboard', ...);
});
</code></pre>
  <pre><code class="language-blade">@role('admin')
  &lt;a href="/admin"&gt;Admin panel&lt;/a&gt;
@endrole</code></pre>

  <h2>Logging in with social providers (Socialite)</h2>
  <p>For "Sign in with Google/GitHub" style auth, Laravel Socialite handles the <strong>OAuth</strong> handshake — a standard protocol where, instead of typing a password into your app, the user logs in directly on Google/GitHub's site and that provider redirects back to your app with a token confirming who they are (and which permissions they granted). Socialite wraps the redirect-and-callback dance into two method calls:</p>
  <pre><code class="language-bash">composer require laravel/socialite</code></pre>
  <pre><code class="language-php">&lt;?php
// Redirect to provider
return Socialite::driver('github')->redirect();

// Handle callback
$githubUser = Socialite::driver('github')->user();
$user = User::firstOrCreate(
    ['email' => $githubUser->getEmail()],
    ['name' => $githubUser->getName(), 'password' => bcrypt(Str::random(24))]
);
Auth::login($user);
</code></pre>

  <h2>Protecting routes vs protecting data</h2>
  <div class="callout warn">
    <b>Two different problems</b>
    Middleware (<code>auth</code>, <code>role:admin</code>) controls <em>which routes</em> a user can access. Policies (<code>$this->authorize('update', $post)</code>) control whether a user can act on a <em>specific record</em>. Forgetting the second is a common real-world bug: a route might require login, but without a policy check, any logged-in user could edit <em>anyone's</em> post just by guessing IDs in the URL.
  </div>
  `
},

  id: "laravel-api",
  track: "laravel",
  title: "Building REST APIs with Laravel",
  html: `
  <h2>API routes vs web routes</h2>
  <p><code>routes/api.php</code> is for JSON endpoints. All routes here are automatically prefixed with <code>/api</code> and excluded from CSRF protection (since API clients typically authenticate with tokens, not session cookies).</p>
  <pre><code class="language-php">&lt;?php
// routes/api.php
use App\\Http\\Controllers\\Api\\PostController;

Route::apiResource('posts', PostController::class);
// Generates: index, store, show, update, destroy (NOT create/edit -- those return HTML forms,
// which an API has no use for)</code></pre>

  <h2>API Controllers</h2>
  <pre><code class="language-bash">php artisan make:controller Api/PostController --api --model=Post</code></pre>
  <pre><code class="language-php">&lt;?php
namespace App\\Http\\Controllers\\Api;

use App\\Http\\Controllers\\Controller;
use App\\Models\\Post;
use Illuminate\\Http\\Request;

class PostController extends Controller
{
    public function index(Request $request)
    {
        $posts = Post::with('user')
            ->when($request->query('published'), fn($q) => $q->where('published', true))
            ->latest()
            ->paginate(15);

        return PostResource::collection($posts);
    }

    public function store(Request $request)
    {
        $validated = $request->validate([
            'title' => 'required|string|max:255',
            'body' => 'required|string',
        ]);

        $post = $request->user()->posts()->create($validated);

        return new PostResource($post->load('user'));
    }

    public function show(Post $post) // Laravel resolves this automatically via route-model binding!
    {
        return new PostResource($post->load('user'));
    }

    public function update(Request $request, Post $post)
    {
        $this->authorize('update', $post);

        $validated = $request->validate([
            'title' => 'sometimes|string|max:255',
            'body' => 'sometimes|string',
        ]);

        $post->update($validated);

        return new PostResource($post);
    }

    public function destroy(Post $post)
    {
        $this->authorize('delete', $post);
        $post->delete();
        return response()->json(null, 204);
    }
}
</code></pre>
  <div class="callout">
    <b>Route-model binding</b>
    Notice <code>show(Post $post)</code> — type-hinting a model in a controller method tells Laravel: "take the <code>{post}</code> route parameter, look up <code>Post::findOrFail($id)</code>, and inject the resulting model directly." This is the framework-level version of <code>$repo->find((int)$id)</code> plus the 404-if-missing check we wrote by hand.
  </div>

  <h2>API Resources: controlling JSON shape</h2>
  <p>You almost never want to dump a raw Eloquent model as JSON — it might expose internal columns (password hashes, timestamps you don't need) or need reshaping. <strong>API Resources</strong> are the transformation layer.</p>
  <pre><code class="language-bash">php artisan make:resource PostResource</code></pre>
  <pre><code class="language-php">&lt;?php
namespace App\\Http\\Resources;

use Illuminate\\Http\\Request;
use Illuminate\\Http\\Resources\\Json\\JsonResource;

class PostResource extends JsonResource
{
    public function toArray(Request $request): array
    {
        return [
            'id' => $this->id,
            'title' => $this->title,
            'body' => $this->body,
            'published' => $this->published,
            'author' => [
                'id' => $this->user->id,
                'name' => $this->user->name,
            ],
            'created_at' => $this->created_at->toIso8601String(),
        ];
    }
}
</code></pre>
  <p>This is your <code>jsonResponse()</code> helper from the plain-PHP API, but type-safe, reusable, and able to conditionally include fields (e.g. only show <code>email</code> if the requester is the resource owner via <code>$this->when(...)</code>).</p>

  <h2>Pagination</h2>
  <p><code>paginate(15)</code> automatically wraps results in metadata your frontend needs:</p>
  <pre><code class="language-json">{
  "data": [ ... ],
  "links": { "first": "...", "last": "...", "prev": null, "next": "..." },
  "meta": { "current_page": 1, "last_page": 5, "per_page": 15, "total": 68 }
}</code></pre>

  <h2>Error handling for APIs</h2>
  <p>Laravel's exception handler automatically returns JSON for API requests (detected via the <code>Accept: application/json</code> header). A <code>ModelNotFoundException</code> → 404 JSON, a <code>ValidationException</code> → 422 JSON with field-specific error messages, automatically — no manual <code>jsonResponse(['error' => ...], 404)</code> calls needed.</p>
  <pre><code class="language-json">{
  "message": "The title field is required.",
  "errors": {
    "title": ["The title field is required."]
  }
}</code></pre>

  <h2>Filtering, sorting, and including relations via query params</h2>
  <p>A flexible API lets clients shape the response without new endpoints for every variation:</p>
  <pre><code class="language-php">&lt;?php
public function index(Request $request)
{
    $query = Post::query();

    // Filtering: /api/posts?published=1
    if ($request->has('published')) {
        $query->where('published', $request->boolean('published'));
    }

    // Searching: /api/posts?search=laravel
    if ($search = $request->query('search')) {
        $query->where('title', 'like', "%{$search}%");
    }

    // Sorting: /api/posts?sort=-created_at (- prefix = descending)
    $sort = $request->query('sort', '-created_at');
    $direction = str_starts_with($sort, '-') ? 'desc' : 'asc';
    $column = ltrim($sort, '-');
    $query->orderBy($column, $direction);

    // Including relations: /api/posts?include=user,tags
    if ($includes = $request->query('include')) {
        $query->with(explode(',', $includes));
    }

    return PostResource::collection($query->paginate(15));
}
</code></pre>

  <h2>API versioning in Laravel</h2>
  <pre><code class="language-php">&lt;?php
// routes/api.php
Route::prefix('v1')->group(function () {
    Route::apiResource('posts', V1\PostController::class);
});

Route::prefix('v2')->group(function () {
    Route::apiResource('posts', V2\PostController::class);
});
</code></pre>
  <p>Each version gets its own controller (and often its own Resource class), so <code>/api/v1/posts</code> and <code>/api/v2/posts</code> can return different shapes while both remain functional.</p>

  <h2>Throwing API exceptions deliberately</h2>
  <p>For business-logic errors (not validation), throw an <code>HttpException</code> with the right status code -- Laravel converts it to JSON automatically for API requests:</p>
  <pre><code class="language-php">&lt;?php
use Symfony\Component\HttpKernel\Exception\HttpException;

if ($post->user_id !== $request->user()->id) {
    throw new HttpException(403, 'You do not own this post.');
}

if ($post->published) {
    abort(409, 'Cannot edit a published post.'); // 'abort' is a shortcut for throwing HttpException
}
</code></pre>

  <h2>Testing API endpoints end-to-end</h2>
  <pre><code class="language-php">&lt;?php
public function test_can_filter_published_posts(): void
{
    Post::factory()->create(['published' => true, 'title' => 'Visible']);
    Post::factory()->create(['published' => false, 'title' => 'Hidden']);

    $response = $this->getJson('/api/v1/posts?published=1');

    $response->assertStatus(200)
             ->assertJsonCount(1, 'data')
             ->assertJsonPath('data.0.title', 'Visible');
}
</code></pre>

  <h2>Queues and Jobs: deferring slow work</h2>
  <p>Some operations — sending an email, processing an image, calling a slow third-party API — shouldn't block the HTTP response. A <strong>Job</strong> is a class representing "a unit of work to do later", pushed onto a <strong>queue</strong> and processed by a separate background worker process.</p>
  <pre><code class="language-bash">php artisan make:job SendWelcomeEmail</code></pre>
  <pre><code class="language-php">&lt;?php
namespace App\\Jobs;

use App\\Models\\User;
use Illuminate\\Bus\\Queueable;
use Illuminate\\Contracts\\Queue\\ShouldQueue;
use Illuminate\\Foundation\\Bus\\Dispatchable;

class SendWelcomeEmail implements ShouldQueue
{
    use Dispatchable, Queueable;

    public function __construct(public User $user) {}

    public function handle(): void
    {
        // This runs in the background worker, not the web request
        Mail::to($this->user)->send(new WelcomeMail($this->user));
    }
}
</code></pre>
  <pre><code class="language-php">&lt;?php
// Dispatch from a controller -- returns to the user instantly

  <pre><code class="language-bash"># Run a worker to process queued jobs (in production, run via Supervisor)
php artisan queue:work</code></pre>
  <div class="callout">
    <b>What is Supervisor?</b>
    <code>php artisan queue:work</code> is a long-running process — if it crashes or the server reboots, queued jobs stop being processed. <strong>Supervisor</strong> is a Linux process manager that keeps a command running, automatically restarting it if it dies. In production, you'd configure Supervisor to run <code>queue:work</code> (and restart it after deployments), rather than running the command manually in a terminal.
  </div>
  <p>By default, the <code>QUEUE_CONNECTION</code> in <code>.env</code> is <code>sync</code> (jobs run immediately, in the request) — fine for local dev, but switch to <code>database</code> or <code>redis</code> for real deferred processing.</p>

  <h2>Events & Listeners</h2>
  <p>Events let different parts of your app react to something happening without tightly coupling the code that triggers it to the code that responds. "A user registered" might need to: send a welcome email, notify an admin, and create a default workspace — three unrelated concerns.</p>
  <pre><code class="language-bash">php artisan make:event UserRegistered
php artisan make:listener SendWelcomeEmail --event=UserRegistered</code></pre>
  <pre><code class="language-php">&lt;?php
// Dispatching
event(new UserRegistered($user));

// Or, on the model, fired automatically:
class User extends Authenticatable {
    protected static function booted(): void {
        static::created(function (User $user) {
            event(new UserRegistered($user));
        });
    }
}
</code></pre>
  <p>Listeners can implement <code>ShouldQueue</code> too — so "send welcome email" runs in the background while "create default workspace" might run synchronously.</p>

  <h2>Testing</h2>
  <p>Laravel ships with PHPUnit (or Pest) configured out of the box, plus a fluent HTTP testing API and an in-memory SQLite option for fast tests.</p>
  <pre><code class="language-bash">php artisan make:test PostApiTest</code></pre>

namespace Tests\\Feature;

use App\\Models\\User;
use App\\Models\\Post;
use Illuminate\\Foundation\\Testing\\RefreshDatabase;
use Tests\\TestCase;

{

    public function test_authenticated_user_can_create_post(): void
    {

        $response = $this->actingAs($user)->postJson('/api/posts', [
            'title' => 'Test Post',

    }
}
</code></pre>

  <p><strong>Cron</strong> is the standard Unix tool for running a command on a fixed schedule (e.g. "every day at 1am"), configured via a list of cron entries ("crontab") on the server — one line per scheduled command, each with its own timing syntax. Laravel's scheduler replaces a server full of individual cron entries with a single, version-controlled schedule defined in code:</p>

Schedule::command('reports:generate-daily')->dailyAt('01:00');
Schedule::job(new CleanupOldNotifications())->weekly();

const STORAGE_PROGRESS = "php-laravel-progress";
function getProgress(){
  try { return new Set(JSON.parse(localStorage.getItem(STORAGE_PROGRESS)) || []); }
  catch(e){ return new Set(); }
}
function saveProgress(set){
  localStorage.setItem(STORAGE_PROGRESS, JSON.stringify([...set]));
}
function toggleProgress(id){
  const set = getProgress();
  set.has(id) ? set.delete(id) : set.add(id);
  saveProgress(set);
  updateProgressUI();
}
function updateProgressUI(){
  const done = getProgress();
