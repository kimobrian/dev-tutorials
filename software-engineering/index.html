t;unordered_map&gt;\n\nstd::unordered_map&lt;int, long long&gt; memo;\n\nlong long fibonacci(int n) {\n    if (n &lt;= 1) return n;\n    if (memo.count(n)) return memo[n];        // already computed -- reuse it!\n\n    long long result = fibonacci(n - 1) + fibonacci(n - 2);\n    memo[n] = result;                          // store for next time\n    return result;\n}<\/code><\/pre>\n<p>This single change &mdash; caching subproblem results &mdash; brings Fibonacci down from exponential <code>O(2&#8319;)<\/code> to linear <code>O(n)<\/code>, without altering the overall logic at all. This general technique, called <strong>memoization<\/strong>, is one of the highest-leverage ideas in this entire tutorial: recognizing repeated work and eliminating it.<\/p>\n<div class=\"callout callout-tip\"><span class=\"callout-label\">TIP<\/span><p>There's no single strategy that solves every problem &mdash; part of developing algorithmic skill is building the judgment to recognize which pattern (divide and conquer, greedy, dynamic programming, or something else entirely) fits the problem in front of you. That judgment mostly comes from practice: solving many varied problems over time.<\/p><\/div>"}, {"id": "concurrency", "title": "Intro to Concurrency", "category": "Beyond the Basics", "body": "<p>Every program we've discussed so far runs one instruction at a time, in a single, predictable sequence &mdash; this is called <strong>sequential<\/strong> execution. <strong>Concurrency<\/strong> is the broader idea of a program making progress on more than one task in an overlapping timeframe, and <strong>parallelism<\/strong> specifically means multiple tasks literally running at the same physical instant, typically on multiple CPU cores.<\/p>\n<p>A <strong>thread<\/strong> is an independent sequence of execution within a program. A program can spawn multiple threads that run concurrently, letting it, for example, keep a user interface responsive while a large calculation runs in the background, or handle many network requests without one slow request blocking all the others.<\/p>\n<pre><code class=\"language-cpp\">#include &lt;thread&gt;\n#include &lt;iostream&gt;\n\nvoid printNumbers() {\n    for (int i = 0; i &lt; 5; i++) std::cout &lt;&lt; i &lt;&lt; &quot; &quot;;\n}\n\nint main() {\n    std::thread t(printNumbers);   // starts running concurrently\n    t.join();                       // wait for the thread to finish\n    std::cout &lt;&lt; std::endl &lt;&lt; &quot;Done!&quot; &lt;&lt; std::endl;\n}<\/code><\/pre>\n<p>Concurrency introduces a genuinely new category of bug that doesn't exist in sequential code: a <strong>race condition<\/strong>, where the outcome of a program depends on the unpredictable timing of multiple threads accessing the same data. If two threads both read, modify, and write the same variable without coordination, updates can be silently lost.<\/p>\n<pre><code class=\"language-cpp\">int counter = 0;\n\nvoid increment() {\n    for (int i = 0; i &lt; 100000; i++) {\n        counter++;   // NOT safe if multiple threads run this concurrently!\n    }\n}\n// two threads both running increment() concurrently will very likely\n// produce a final counter LESS than 200000, because &quot;counter++&quot; is not\n// a single atomic step -- it reads, adds one, then writes back, and two\n// threads can interleave those steps and stomp on each other&#x27;s update.<\/code><\/pre>\n<p>The standard tool for preventing this is a <strong>mutex<\/strong> (mutual exclusion lock): a mechanism that ensures only one thread can execute a particular section of code (a &quot;critical section&quot;) at a time, forcing other threads to wait their turn.<\/p>\n<pre><code class=\"language-cpp\">#include &lt;mutex&gt;\n\nint counter = 0;\nstd::mutex counterMutex;\n\nvoid safeIncrement() {\n    for (int i = 0; i &lt; 100000; i++) {\n        std::lock_guard&lt;std::mutex&gt; lock(counterMutex);   // acquired here\n        counter++;\n    }   // automatically released when &#x27;lock&#x27; goes out of scope\n}<\/code><\/pre>\n<div class=\"callout callout-warning\"><span class=\"callout-label\">WARNING<\/span><p>Concurrency is a deep topic on its own, but the core idea to internalize now is this: any time multiple threads can touch the same piece of shared, mutable data, you need an explicit strategy to coordinate them, or you risk subtle, hard-to-reproduce bugs that may only appear under specific timing conditions.<\/p><\/div>"}, {"id": "error-handling", "title": "Error Handling & File I/O", "category": "Beyond the Basics", "body": "<p>Real programs deal with the world outside their own logic: files that might not exist, user input that might be malformed, network connections that might fail. <strong>Error handling<\/strong> is how a program detects these situations and responds gracefully instead of crashing or silently producing wrong results.<\/p>\n<p>C++'s primary mechanism for this is <strong>exceptions<\/strong>. Code that might fail is wrapped in a <code>try<\/code> block; if something goes wrong, it <code>throw<\/code>s an exception, which transfers control to a matching <code>catch<\/code> block instead of continuing normally.<\/p>\n<pre><code class=\"language-cpp\">#include &lt;stdexcept&gt;\n\ndouble divide(double a, double b) {\n    if (b == 0) {\n        throw std::runtime_error(&quot;Cannot divide by zero&quot;);\n    }\n    return a / b;\n}\n\nint main() {\n    try {\n        double result = divide(10, 0);\n        std::cout &lt;&lt; result &lt;&lt; std::endl;   // never reached\n    } catch (const std::runtime_error&amp; e) {\n        std::cout &lt;&lt; &quot;Error: &quot; &lt;&lt; e.what() &lt;&lt; std::endl;\n    }\n    std::cout &lt;&lt; &quot;Program continues normally.&quot; &lt;&lt; std::endl;\n}<\/code><\/pre>\n<p>This separates the &quot;happy path&quot; logic from error-handling logic, and &mdash; crucially &mdash; an exception thrown deep inside several nested function calls can be caught far up the call stack, without every intermediate function needing to explicitly check for and pass along an error.<\/p>\n<p><strong>File I/O<\/strong> (input/output) follows a similar pattern of things that can fail. Reading from and writing to files uses stream objects, similar in spirit to <code>std::cout<\/code>:<\/p>\n<pre><code class=\"language-cpp\">#include &lt;fstream&gt;\n#include &lt;string&gt;\n\nint main() {\n    std::ofstream outFile(&quot;notes.txt&quot;);   // open for writing\n    if (outFile.is_open()) {\n        outFile &lt;&lt; &quot;Learning C++ is going well.&quot; &lt;&lt; std::endl;\n        outFile.close();\n    }\n\n    std::ifstream inFile(&quot;notes.txt&quot;);    // open for reading\n    std::string line;\n    if (inFile.is_open()) {\n        while (std::getline(inFile, line)) {\n            std::cout &lt;&lt; line &lt;&lt; std::endl;\n        }\n        inFile.close();\n    }\n}<\/code><\/pre>\n<div class=\"callout callout-warning\"><span class=\"callout-label\">WARNING<\/span><p>Always check whether a file actually opened successfully (<code>is_open()<\/code>) before trying to read or write to it. Assuming an external resource &mdash; a file, a network connection, user input &mdash; will always behave as expected is one of the most common sources of bugs in real-world software.<\/p><\/div>"}, {"id": "next-steps", "title": "Where to Go Next", "category": "Beyond the Basics", "body": "<p>You've now covered the conceptual core of software engineering: how computers represent and store data, how programs control flow and organize logic into functions, how memory works underneath the abstractions, how object-oriented design organizes larger systems, and how to reason about data structures and algorithmic efficiency. That's a genuinely complete foundation &mdash; not a shallow one.<\/p>\n<p>Here's the good news: none of this was C++ trivia. Every idea in this tutorial &mdash; variables and types, control flow, functions, memory and references, classes and objects, recursion, Big-O, data structures, sorting and searching, and coordinating concurrent work &mdash; exists in essentially every general-purpose programming language, just with different syntax and different defaults. Learning a new language from here mostly means learning new <em>notation<\/em> for ideas you already understand.<\/p>\n<p>A suggested path forward:<\/p>\n<ul><li><strong>Pick a language aligned with what you want to build<\/strong> &mdash; Python for data/scripting/general purpose, JavaScript/TypeScript for web, Java or C# for large enterprise systems, Rust or continued C++ for systems programming and performance-critical work, Swift or Kotlin for mobile.<\/li><li><strong>Rebuild small programs from this tutorial in that new language<\/strong> &mdash; a linked list, a binary search, a small class hierarchy. You'll be translating concepts you already understand into new syntax, which is a much easier task than learning both at once.<\/li><li><strong>Practice algorithmic problem solving<\/strong> on a site like LeetCode, HackerRank, or Codewars, applying the Big-O, data structure, and algorithm-design ideas from this tutorial directly.<\/li><li><strong>Build something real<\/strong>, even something small. Concepts solidify permanently once you've used them to solve an actual problem you care about, in a way reading alone never quite achieves.<\/li><\/ul>\n<div class=\"callout callout-tip\"><span class=\"callout-label\">TIP<\/span><p>Come back to this tutorial as a reference whenever a new language's documentation assumes you already know what a hash table is, or what Big-O notation means, or how pass-by-reference works. That's exactly the gap this was built to fill.<\/p><\/div>\n<p>Good luck &mdash; you're better prepared than you probably feel right now.<\/p>"}];
const CATEGORIES = ["Foundations", "C++ Basics", "Memory & Pointers", "Object-Oriented Programming", "Algorithmic Thinking", "Data Structures", "Algorithms", "Beyond the Basics"];
const ORDER = CHAPTERS.map(c => c.id);
const BY_ID = {};
CHAPTERS.forEach((c,i) => { c.index = i; BY_ID[c.id] = c; });

function escapeHtml(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

/* -----------------------------------------------------------------------
 * fuzzy.js (mattyork/fuzzy, MIT License, https://github.com/mattyork/fuzzy)
 * Inlined directly rather than loaded from a CDN so search keeps working
 * in offline / sandboxed preview environments with no network access.
 * --------------------------------------------------------------------- */
const fuzzy = (function () {
  var fuzzy = {};
  fuzzy.simpleFilter = function (pattern, array) {
    return array.filter(function (str) { return fuzzy.test(pattern, str); });
  };
  fuzzy.test = function (pattern, str) {
    return fuzzy.match(pattern, str) !== null;
  };
  fuzzy.match = function (pattern, str, opts) {
    opts = opts || {};
    var patternIdx = 0, result = [], len = str.length, totalScore = 0, currScore = 0,
        pre = opts.pre || "", post = opts.post || "",
        compareString = opts.caseSensitive ? str : str.toLowerCase(), ch;
    pattern = opts.caseSensitive ? pattern : pattern.toLowerCase();
    for (var idx = 0; idx < len; idx++) {
      ch = str[idx];
      if (compareString[idx] === pattern[patternIdx]) {
        ch = pre + ch + post;
        patternIdx += 1;
        currScore += 1 + currScore;
      } else {
        currScore = 0;
      }
      totalScore += currScore;
      result[result.length] = ch;
    }
    if (patternIdx === pattern.length) {
      totalScore = (compareString === pattern) ? Infinity : totalScore;
      return { rendered: result.join(""), score: totalScore };
    }
    return null;
  };
  fuzzy.filter = function (pattern, arr, opts) {
    if (!arr || arr.length === 0) return [];
    if (typeof pattern !== "string") return arr;
    opts = opts || {};
    return arr.reduce(function (prev, element, idx, arr) {
      var str = element;
      if (opts.extract) str = opts.extract(element);
      var rendered = fuzzy.match(pattern, str, opts);
      if (rendered != null) {
        prev[prev.length] = { string: rendered.rendered, score: rendered.score, index: idx, original: element };
      }
      return prev;
    }, []).sort(function (a, b) {
      var compare = b.score - a.score;
      if (compare) return compare;
      return a.index - b.index;
    });
  };
  return fuzzy;
})();

/* -----------------------------------------------------------------------
 * Tiny inline C++ syntax highlighter (no external library needed either).
 * --------------------------------------------------------------------- */
const CPP_KEYWORDS = new Set("int double float char bool void long short unsigned signed const static virtual override public private protected class struct namespace using template typename return if else for while do switch case default break continue new delete nullptr true false this sizeof auto typedef enum union friend inline explicit operator try catch throw".split(" "));
const CPP_TYPES = new Set("std string vector map unordered_map unordered_set set queue stack pair thread mutex lock_guard runtime_error ifstream ofstream cout cin endl size_t".split(" "));

function highlightCpp(code){
  const pattern = /(\/\/[^\n]*)|(\/\*[\s\S]*?\*\/)|(#[a-zA-Z_]\w*(?:[^\n\\]|\\.)*)|("(?:\\.|[^"\\\n])*")|('(?:\\.|[^'\\\n])*')|(\b\d+\.?\d*[fFuUlL]*\b)|(\b[a-zA-Z_]\w*\b)/g;
  let out = "", last = 0, m;
  while ((m = pattern.exec(code)) !== null){
    out += escapeHtml(code.slice(last, m.index));
    last = pattern.lastIndex;
    const text = m[0];
    if (m[1] || m[2]) out += '<span class="cpp-com">' + escapeHtml(text) + '</span>';
    else if (m[3]) out += '<span class="cpp-pre">' + escapeHtml(text) + '</span>';
    else if (m[4] || m[5]) out += '<span class="cpp-str">' + escapeHtml(text) + '</span>';
    else if (m[6]) out += '<span class="cpp-num">' + escapeHtml(text) + '</span>';
    else if (m[7]){
      const word = text;
      if (CPP_KEYWORDS.has(word)) out += '<span class="cpp-kw">' + escapeHtml(word) + '</span>';
      else if (CPP_TYPES.has(word)) out += '<span class="cpp-type">' + escapeHtml(word) + '</span>';
      else if (code[pattern.lastIndex] === "(") out += '<span class="cpp-fn">' + escapeHtml(word) + '</span>';
      else out += escapeHtml(word);
    }
  }
  out += escapeHtml(code.slice(last));
  return out;
}

const VISITED_KEY = "cs-foundations-visited";
function getVisited(){
  try { return JSON.parse(localStorage.getItem(VISITED_KEY) || "[]"); }
  catch(e){ return []; }
}
function markVisited(id){
  const v = new Set(getVisited());
  v.add(id);
  try { localStorage.setItem(VISITED_KEY, JSON.stringify([...v])); } catch(e){}
  updateProgress();
}
function updateProgress(){
  const v = getVisited();
  const pct = Math.round((v.length / CHAPTERS.length) * 100);
  document.getElementById("progress-fill").style.width = pct + "%";
  document.getElementById("progress-label").textContent = v.length + " of " + CHAPTERS.length + " chapters read";
}

// ---------------- sidebar ----------------
function buildSidebar(){
  const toc = document.getElementById("toc");
  toc.innerHTML = "";
  CATEGORIES.forEach(cat => {
    const wrap = document.createElement("div");
    wrap.className = "toc-category";
    const label = document.createElement("div");
    label.className = "toc-category-label";
    label.textContent = cat;
    wrap.appendChild(label);

    CHAPTERS.filter(c => c.category === cat).forEach(c => {
      const link = document.createElement("div");
      link.className = "toc-link";
      link.dataset.id = c.id;
      link.innerHTML = '<span class="toc-dot"></span><span>' + c.title + '</span>';
      link.addEventListener("click", () => { location.hash = c.id; closeSidebarMobile(); });
      wrap.appendChild(link);
    });
    toc.appendChild(wrap);
  });
  refreshSidebarState();
}

function refreshSidebarState(){
  const visited = new Set(getVisited());
  const current = currentChapterId();
  document.querySelectorAll(".toc-link").forEach(el => {
    const id = el.dataset.id;
    el.classList.toggle("active", id === current);
    el.classList.toggle("visited", visited.has(id) && id !== current);
  });
  const activeEl = document.querySelector(".toc-link.active");
  if (activeEl && activeEl.scrollIntoView) activeEl.scrollIntoView({block:"nearest"});
}

// ---------------- routing / rendering ----------------
function currentChapterId(){
  const hash = decodeURIComponent(location.hash.replace(/^#/, ""));
  return BY_ID[hash] ? hash : ORDER[0];
}

function renderChapter(){
  const id = currentChapterId();
  const c = BY_ID[id];
  const page = document.getElementById("page");

  const prev = CHAPTERS[c.index - 1];
  const next = CHAPTERS[c.index + 1];

  let nav = '<div class="pagenav">';
  if (prev){
    nav += '<div class="pagenav-btn prev" data-id="'+prev.id+'">' +
      '<span class="pagenav-dir">&larr; Previous</span>' +
      '<span class="pagenav-title">'+prev.title+'</span></div>';
  } else {
    nav += '<div class="pagenav-spacer"></div>';
  }
  if (next){
    nav += '<div class="pagenav-btn next" data-id="'+next.id+'">' +
      '<span class="pagenav-dir">Next &rarr;</span>' +
      '<span class="pagenav-title">'+next.title+'</span></div>';
  } else {
    nav += '<div class="pagenav-spacer"></div>';
  }
  nav += '</div>';

  page.innerHTML =
    '<div class="chapter-eyebrow">' + c.category + ' &middot; Chapter ' + (c.index+1) + ' of ' + CHAPTERS.length + '</div>' +
    '<h1 class="chapter-title">' + c.title + '</h1>' +
    '<div class="chapter-body">' + c.body + '</div>' +
    nav;

  page.querySelectorAll(".pagenav-btn[data-id]").forEach(el => {
    el.addEventListener("click", () => { location.hash = el.dataset.id; });
  });

  page.querySelectorAll("pre code").forEach(block => {
    const raw = block.textContent;
    block.innerHTML = highlightCpp(raw);
  });

  markVisited(id);
  refreshSidebarState();
  if (window.scrollTo) window.scrollTo({top:0, behavior:"instant"});
  document.title = c.title + " — CS Foundations";
}

window.addEventListener("hashchange", renderChapter);

// ---------------- search index (built from decoded plain text) ----------------
const searchIndex = CHAPTERS.map(c => {
  const tmp = document.createElement("div");
  tmp.innerHTML = c.body;
  const plainBody = (tmp.textContent || "").replace(/\s+/g, " ").trim();
  return { id: c.id, title: c.title, category: c.category, plainBody: plainBody };
});
const SEARCH_BY_ID = {};
searchIndex.forEach(s => { SEARCH_BY_ID[s.id] = s; });

// ---------------- search modal ----------------
let modalOpen = false;
let activeModalIndex = -1;
let currentModalResults = [];

// Body search uses a plain, literal substring match (not fuzzy subsequence
// matching) -- fuzzy-matching whole paragraphs against a short query finds
// scattered-letter "matches" almost everywhere and produces noisy results.
// Fuzzy matching is reserved for titles, which are short enough for it to
// behave intuitively (typo/abbreviation tolerant chapter-name matching).
function findBodySubstring(plainBody, query){
  const q = query.trim().toLowerCase();
  if (!q) return -1;
  return plainBody.toLowerCase().indexOf(q);
}

function snippetFor(plainBody, query, idx){
  const q = query.trim();
  const start = Math.max(0, idx - 40);
  const end = Math.min(plainBody.length, idx + q.length + 100);
  const prefix = start > 0 ? "…" : "";
  const suffix = end < plainBody.length ? "…" : "";
  return escapeHtml(prefix) +
    escapeHtml(plainBody.slice(start, idx)) +
    "<mark>" + escapeHtml(plainBody.slice(idx, idx + q.length)) + "</mark>" +
    escapeHtml(plainBody.slice(idx + q.length, end)) +
    escapeHtml(suffix);
}

function bodySubstringMatches(query){
  const matches = [];
  searchIndex.forEach(s => {
    const idx = findBodySubstring(s.plainBody, query);
    if (idx !== -1) matches.push({ original: s, idx: idx });
  });
  matches.sort((a, b) => a.idx - b.idx);   // earlier occurrence ranks higher
  return matches;
}

function resultItemHtml(c, titleHtml, idx, snippetHtml){
  return '<div class="result-item" data-idx="'+idx+'" data-id="'+c.id+'">' +
    '<div class="result-title">' + titleHtml + '</div>' +
    '<div class="result-meta">' + c.category + '</div>' +
    (snippetHtml || "") +
    '</div>';
}

function renderModalResults(query){
  const container = document.getElementById("modal-results");
  query = query.trim();
  activeModalIndex = -1;

  if (!query){
    const defaults = CHAPTERS.slice(0, 8);
    currentModalResults = defaults.map(c => ({ original: c }));
    container.innerHTML = '<div class="modal-section-label">Jump to a chapter</div>' +
      defaults.map((c, i) => resultItemHtml(c, escapeHtml(c.title), i)).join("");
    wireModalResultClicks();
    return;
  }

  const titleMatches = fuzzy.filter(query, searchIndex, { extract: el => el.title, pre: "<mark>", post: "</mark>" });
  const seen = new Set(titleMatches.map(m => m.original.id));
  const bodyMatches = bodySubstringMatches(query).filter(m => !seen.has(m.original.id));

  const combined = titleMatches.concat(bodyMatches).slice(0, 8);
  currentModalResults = combined;

  if (combined.length === 0){
    container.innerHTML = '<div class="modal-empty">No chapters match &ldquo;' + escapeHtml(query) + '&rdquo;</div>';
    return;
  }

  container.innerHTML = '<div class="modal-section-label">' + combined.length + ' result' + (combined.length === 1 ? "" : "s") + '</div>' +
    combined.map((m, i) => {
      const c = BY_ID[m.original.id];
      const isTitleMatch = titleMatches.indexOf(m) !== -1;
      const titleHtml = isTitleMatch ? m.string : escapeHtml(c.title);
      // only show a body snippet when the query literally occurs in the body --
      // avoids showing an unrelated, unhighlighted excerpt for title-only matches
      const bodyIdx = findBodySubstring(m.original.plainBody, query);
      const snippetHtml = bodyIdx !== -1
        ? '<div class="result-snippet">' + snippetFor(m.original.plainBody, query, bodyIdx) + '</div>'
        : "";
      return resultItemHtml(c, titleHtml, i, snippetHtml);
    }).join("");

  wireModalResultClicks();
}

function wireModalResultClicks(){
  document.querySelectorAll("#modal-results .result-item").forEach(el => {
    el.addEventListener("click", () => selectModalResult(el.dataset.id));
    el.addEventListener("mouseenter", () => {
      activeModalIndex = parseInt(el.dataset.idx, 10);
      highlightModalItem(document.querySelectorAll("#modal-results .result-item"));
    });
  });
}

function highlightModalItem(items){
  items.forEach(el => el.classList.remove("hi"));
  const el = items[activeModalIndex];
  if (el){
    el.classList.add("hi");
    if (el.scrollIntoView) el.scrollIntoView({block:"nearest"});
  }
}

function selectModalResult(id){
  location.hash = id;
  closeModal();
}

function openModal(){
  modalOpen = true;
  const overlay = document.getElementById("search-modal");
  overlay.classList.add("open");
  overlay.setAttribute("aria-hidden", "false");
  const input = document.getElementById("modal-search-input");
  input.value = "";
  renderModalResults("");
  setTimeout(() => input.focus(), 0);
}

function closeModal(){
  modalOpen = false;
  const overlay = document.getElementById("search-modal");
  overlay.classList.remove("open");
  overlay.setAttribute("aria-hidden", "true");
  const input = document.getElementById("modal-search-input");
  if (input) input.blur();   // release focus so "/" and other shortcuts work again
}

document.getElementById("search-trigger").addEventListener("click", openModal);

document.getElementById("search-modal").addEventListener("click", (e) => {
  if (e.target.id === "search-modal") closeModal();
});

const modalInput = document.getElementById("modal-search-input");
modalInput.addEventListener("input", (e) => renderModalResults(e.target.value));
modalInput.addEventListener("keydown", (e) => {
  const items = document.querySelectorAll("#modal-results .result-item");
  if (e.key === "ArrowDown"){
    e.preventDefault();
    if (!items.length) return;
    activeModalIndex = Math.min(activeModalIndex + 1, items.length - 1);
    highlightModalItem(items);
  } else if (e.key === "ArrowUp"){
    e.preventDefault();
    if (!items.length) return;
    activeModalIndex = Math.max(activeModalIndex - 1, 0);
    highlightModalItem(items);
  } else if (e.key === "Enter"){
    e.preventDefault();
    const idx = activeModalIndex >= 0 ? activeModalIndex : 0;
    if (currentModalResults[idx]) selectModalResult(currentModalResults[idx].original.id);
  } else if (e.key === "Escape"){
    closeModal();
  }
});

document.addEventListener("keydown", (e) => {
  if (modalOpen){
    if (e.key === "Escape") closeModal();
    return;
  }
  const tag = (document.activeElement && document.activeElement.tagName || "").toLowerCase();
  const typing = tag === "input" || tag === "textarea";
  if (e.key === "/" && !typing){
    e.preventDefault();
    openModal();
  } else if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){
    e.preventDefault();
    openModal();
  }
});

// ---------------- mobile sidebar ----------------
function closeSidebarMobile(){ document.body.classList.remove("sidebar-open"); }
document.getElementById("menu-toggle").addEventListener("click", () => {
  document.body.classList.toggle("sidebar-open");
});
document.body.addEventListener("click", (e) => {
  if (document.body.classList.contains("sidebar-open") &&
      !e.target.closest("#sidebar") && !e.target.closest("#menu-toggle")){
    closeSidebarMobile();
  }
});

// ---------------- init ----------------
buildSidebar();
updateProgress();
if (!location.hash) location.hash = ORDER[0];
renderChapter();
</script>
