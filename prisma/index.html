<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mastering Prisma — The Complete Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Playfair+Display:wght@700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
<style>
:root {
  --bg: #0d0f14;
  --bg2: #13161e;
  --bg3: #1a1e29;
  --surface: #1e2330;
  --surface2: #252b3b;
  --border: #2d3448;
  --border2: #3d4560;
  --accent: #6ee7b7;
  --accent2: #34d399;
  --accent3: #10b981;
  --blue: #60a5fa;
  --purple: #a78bfa;
  --orange: #fb923c;
  --yellow: #fbbf24;
  --red: #f87171;
  --text: #e2e8f0;
  --text2: #94a3b8;
  --text3: #64748b;
  --code-bg: #0a0c10;
  --sidebar-w: 280px;
  --header-h: 60px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.7;
  overflow-x: hidden;
}

/* SCROLLBAR */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg2); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent3); }

/* ── HEADER ───────────────────────────────────────── */
#header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 200;
  height: var(--header-h);
  background: rgba(13,15,20,0.92);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 16px; padding: 0 20px;
}

.logo {
  display: flex; align-items: center; gap: 10px;
  font-family: 'Playfair Display', serif;
  font-size: 18px; font-weight: 700;
  color: var(--accent); text-decoration: none;
  white-space: nowrap;
  cursor: pointer;
}

.logo-icon {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, var(--accent3), var(--blue));
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}

/* SEARCH */
/* ── SEARCH TRIGGER (header bar) ─────────────────────────── */
.search-trigger {
  flex: 1; max-width: 480px;
  display: flex; align-items: center; gap: 10px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 14px;
  cursor: pointer;
  color: var(--text3);
  font-size: 13px;
  font-family: 'DM Sans', sans-serif;
  transition: border-color .2s, box-shadow .2s;
}
.search-trigger:hover {
  border-color: var(--border2);
  color: var(--text2);
}
.search-trigger-icon { font-size: 15px; flex-shrink: 0; }
.search-trigger-text { flex: 1; }
.search-trigger-kbd {
  display: flex; gap: 3px;
}
.search-trigger-kbd kbd {
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: 4px;
  padding: 1px 6px;
  font-size: 11px;
  font-family: 'DM Mono', monospace;
  color: var(--text3);
  line-height: 1.6;
}

/* ── SEARCH DIALOG ────────────────────────────────────────── */
#searchOverlay {
  position: fixed; inset: 0; z-index: 500;
  background: rgba(0,0,0,.65);
  backdrop-filter: blur(4px);
  display: none;
  align-items: flex-start; justify-content: center;
  padding-top: 80px;
  animation: overlayIn .15s ease;
}
#searchOverlay.open { display: flex; }

@keyframes overlayIn {
  from { opacity: 0; }
  to   { opacity: 1; }
}

#searchDialog {
  width: 100%; max-width: 640px;
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: 14px;
  box-shadow: 0 32px 80px rgba(0,0,0,.6);
  overflow: hidden;
  animation: dialogIn .18s cubic-bezier(.4,0,.2,1);
  margin: 0 16px;
}

@keyframes dialogIn {
  from { opacity: 0; transform: translateY(-16px) scale(.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.search-dialog-header {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
}

.search-dialog-icon {
  color: var(--text3); font-size: 17px; flex-shrink: 0;
}

#dialogSearchInput {
  flex: 1;
  background: none; border: none; outline: none;
  color: var(--text);
  font-size: 16px;
  font-family: 'DM Sans', sans-serif;
  caret-color: var(--accent);
}
#dialogSearchInput::placeholder { color: var(--text3); }

.search-dialog-close {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text3);
  font-size: 11px;
  font-family: 'DM Mono', monospace;
  padding: 3px 8px;
  cursor: pointer;
  transition: all .15s;
  flex-shrink: 0;
}
.search-dialog-close:hover { color: var(--text); border-color: var(--border2); }

/* Results list */
#dialogResults {
  max-height: 440px;
  overflow-y: auto;
}

.dialog-result-item {
  display: flex; gap: 14px; align-items: flex-start;
  padding: 14px 18px;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
  transition: background .12s;
  outline: none;
}
.dialog-result-item:last-child { border-bottom: none; }
.dialog-result-item:hover,
.dialog-result-item.focused {
  background: var(--surface);
}
.dialog-result-item.focused { border-left: 3px solid var(--accent); padding-left: 15px; }

.dri-icon {
  width: 34px; height: 34px; flex-shrink: 0;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-family: 'DM Mono', monospace;
  font-size: 10px; color: var(--accent);
  font-weight: 600;
  margin-top: 1px;
}

.dri-body { flex: 1; min-width: 0; }

.dri-meta {
  font-size: 10px; color: var(--text3);
  text-transform: uppercase; letter-spacing: .07em;
  margin-bottom: 3px;
  font-family: 'DM Mono', monospace;
}

.dri-title {
  font-size: 14px; font-weight: 600; color: var(--text);
  margin-bottom: 5px; line-height: 1.35;
}

.dri-snippet {
  font-size: 12px; color: var(--text3);
  line-height: 1.55;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* Highlighted match text */
mark {
  background: rgba(110,231,183,.22);
  color: var(--accent);
  border-radius: 3px;
  padding: 0 2px;
  font-weight: 600;
}

.search-empty {
  padding: 40px 18px;
  text-align: center;
  color: var(--text3);
  font-size: 14px;
}
.search-empty-icon { font-size: 32px; margin-bottom: 10px; }

.search-dialog-footer {
  display: flex; align-items: center; gap: 16px;
  padding: 10px 18px;
  border-top: 1px solid var(--border);
  background: var(--bg3);
}
.sdf-hint {
  display: flex; align-items: center; gap: 5px;
  font-size: 11px; color: var(--text3);
  font-family: 'DM Mono', monospace;
}
.sdf-hint kbd {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 3px;
  padding: 1px 5px;
  font-size: 10px;
}

/* Hide old search stuff */
#searchResults { display: none !important; }

.hamburger {
  display: none;
  background: none; border: none; cursor: pointer;
  color: var(--text); font-size: 20px; padding: 6px;
}

/* ── SIDEBAR ──────────────────────────────────────── */
#sidebar {
  position: fixed; top: var(--header-h); left: 0; bottom: 0;
  width: var(--sidebar-w);
  background: var(--bg2);
  border-right: 1px solid var(--border);
  overflow-y: auto; z-index: 150;
  transition: transform .3s cubic-bezier(.4,0,.2,1);
}

.sidebar-inner { padding: 20px 0 40px; }

.sidebar-section {
  padding: 0 16px 6px;
  font-size: 10px; font-weight: 600;
  text-transform: uppercase; letter-spacing: .1em;
  color: var(--text3); margin-top: 20px;
}

.sidebar-section:first-child { margin-top: 0; }

.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 16px;
  cursor: pointer;
  color: var(--text2);
  font-size: 13.5px;
  border-left: 3px solid transparent;
  transition: all .15s;
  user-select: none;
}

.nav-item:hover { background: var(--surface); color: var(--text); }

.nav-item.active {
  color: var(--accent);
  border-left-color: var(--accent);
  background: rgba(16,185,129,.06);
  font-weight: 500;
}

.nav-num {
  font-family: 'DM Mono', monospace;
  font-size: 11px; color: var(--text3);
  min-width: 22px;
}

.nav-item.active .nav-num { color: var(--accent3); }

/* ── MAIN ─────────────────────────────────────────── */
#main {
  margin-left: var(--sidebar-w);
  margin-top: var(--header-h);
  min-height: calc(100vh - var(--header-h));
  padding: 0;
}

/* ── HOME PAGE ───────────────────────────────────── */
#homePage {
  min-height: calc(100vh - var(--header-h));
}

.hero {
  background: radial-gradient(ellipse at 30% 40%, rgba(16,185,129,.12) 0%, transparent 60%),
              radial-gradient(ellipse at 70% 80%, rgba(96,165,250,.08) 0%, transparent 50%);
  padding: 80px 60px 70px;
  border-bottom: 1px solid var(--border);
}

.hero-badge {
  display: inline-flex; align-items: center; gap: 8px;
  background: rgba(16,185,129,.1);
  border: 1px solid rgba(16,185,129,.25);
  border-radius: 20px;
  padding: 5px 14px;
  font-size: 12px; color: var(--accent); font-weight: 500;
  margin-bottom: 28px;
  font-family: 'DM Mono', monospace;
}

.hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(38px, 5vw, 62px);
  font-weight: 900;
  line-height: 1.1;
  margin-bottom: 20px;
  background: linear-gradient(135deg, #e2e8f0 0%, var(--accent) 60%, var(--blue) 100%);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
}

.hero-sub {
  font-size: 17px; color: var(--text2);
  max-width: 600px; line-height: 1.7;
  margin-bottom: 36px;
}

.hero-stats {
  display: flex; gap: 36px; flex-wrap: wrap;
}

.stat {
  text-align: center;
}

.stat-num {
  font-family: 'Playfair Display', serif;
  font-size: 28px; font-weight: 700;
  color: var(--accent);
}

.stat-label { font-size: 12px; color: var(--text3); margin-top: 2px; }

.hero-btn {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--accent3);
  color: #0d0f14; font-weight: 600;
  border: none; border-radius: 8px;
  padding: 12px 24px; font-size: 15px;
  cursor: pointer; transition: all .2s;
  font-family: 'DM Sans', sans-serif;
  margin-right: 12px;
}

.hero-btn:hover {
  background: var(--accent);
  transform: translateY(-1px);
  box-shadow: 0 8px 24px rgba(16,185,129,.3);
}

.hero-btn-ghost {
  display: inline-flex; align-items: center; gap: 8px;
  background: transparent;
  color: var(--text2); font-weight: 500;
  border: 1px solid var(--border2); border-radius: 8px;
  padding: 12px 24px; font-size: 15px;
  cursor: pointer; transition: all .2s;
  font-family: 'DM Sans', sans-serif;
}

.hero-btn-ghost:hover { color: var(--text); border-color: var(--text3); }

/* Chapter grid on home */
.chapters-section {
  padding: 50px 60px;
}

.chapters-section h2 {
  font-family: 'Playfair Display', serif;
  font-size: 26px; margin-bottom: 30px; color: var(--text);
}

.chapter-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}

.chapter-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  cursor: pointer;
  transition: all .2s;
}

.chapter-card:hover {
  border-color: var(--accent3);
  transform: translateY(-2px);
  box-shadow: 0 8px 28px rgba(0,0,0,.3);
}

.cc-num {
  font-family: 'DM Mono', monospace;
  font-size: 11px; color: var(--accent);
  margin-bottom: 8px;
}

.cc-title {
  font-size: 15px; font-weight: 600; color: var(--text);
  margin-bottom: 8px; line-height: 1.4;
}

.cc-desc { font-size: 12.5px; color: var(--text3); line-height: 1.5; }

.cc-tags {
  display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px;
}

.cc-tag {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 2px 8px;
  font-size: 11px; color: var(--text3);
  font-family: 'DM Mono', monospace;
}

/* ── CHAPTER PAGE ─────────────────────────────────── */
#chapterPage { display: none; }

.chapter-content {
  max-width: 820px;
  margin: 0 auto;
  padding: 48px 60px 60px;
}

.ch-header {
  margin-bottom: 40px;
  padding-bottom: 32px;
  border-bottom: 1px solid var(--border);
}

.ch-label {
  font-family: 'DM Mono', monospace;
  font-size: 11px; color: var(--accent);
  text-transform: uppercase; letter-spacing: .08em;
  margin-bottom: 10px;
}

.ch-title {
  font-family: 'Playfair Display', serif;
  font-size: clamp(26px, 4vw, 40px);
  font-weight: 900;
  line-height: 1.15;
  margin-bottom: 14px;
  color: var(--text);
}

.ch-desc {
  font-size: 16px; color: var(--text2);
  max-width: 620px; line-height: 1.65;
}

/* Content typography */
.chapter-content h2 {
  font-family: 'Playfair Display', serif;
  font-size: 24px; font-weight: 700;
  color: var(--text); margin: 44px 0 16px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}

.chapter-content h3 {
  font-size: 17px; font-weight: 600;
  color: var(--text); margin: 30px 0 12px;
}

.chapter-content h4 {
  font-size: 14px; font-weight: 600;
  color: var(--accent); margin: 20px 0 8px;
  text-transform: uppercase; letter-spacing: .05em;
  font-family: 'DM Mono', monospace;
}

.chapter-content p {
  margin-bottom: 16px; color: var(--text2); line-height: 1.75;
}

.chapter-content ul, .chapter-content ol {
  margin: 0 0 16px 20px; color: var(--text2);
}

.chapter-content li { margin-bottom: 6px; line-height: 1.65; }

.chapter-content strong { color: var(--text); font-weight: 600; }

.chapter-content em { color: var(--accent); font-style: italic; }

/* Inline code */
.chapter-content code {
  font-family: 'DM Mono', monospace;
  font-size: 12.5px;
  background: rgba(16,185,129,.1);
  color: var(--accent);
  padding: 2px 6px; border-radius: 4px;
  border: 1px solid rgba(16,185,129,.2);
}

/* Code blocks */
.code-block {
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin: 20px 0;
  overflow: hidden;
}

.code-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}

.code-lang {
  font-family: 'DM Mono', monospace;
  font-size: 11px; color: var(--text3);
  text-transform: uppercase; letter-spacing: .06em;
}

.code-file {
  font-family: 'DM Mono', monospace;
  font-size: 11px; color: var(--accent);
}

.copy-btn {
  background: none; border: none; cursor: pointer;
  color: var(--text3); font-size: 12px; padding: 4px 8px;
  border-radius: 4px; transition: all .15s;
  font-family: 'DM Sans', sans-serif;
}

.copy-btn:hover { background: var(--surface2); color: var(--text); }
.copy-btn.copied { color: var(--accent); }

.code-block pre {
  padding: 20px;
  overflow-x: auto;
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  line-height: 1.65;
  color: #c9d1d9;
}

/* Syntax highlighting classes */
kw { color: #ff7b72; }     /* keywords */
fn { color: #d2a8ff; }     /* functions */
str { color: #a5d6ff; }    /* strings */
cm { color: #8b949e; font-style: italic; } /* comments */
ty { color: #ffa657; }     /* types */
num { color: #79c0ff; }    /* numbers */
op { color: #ff7b72; }     /* operators */
prop { color: #e3b341; }   /* properties */
var { color: #c9d1d9; }    /* variables */
dec { color: #6ee7b7; }    /* decorators/special */

/* Callout boxes */
.callout {
  border-radius: 8px;
  padding: 16px 20px;
  margin: 20px 0;
  display: flex; gap: 14px; align-items: flex-start;
  font-size: 14px; line-height: 1.6;
}

.callout-info {
  background: rgba(96,165,250,.08);
  border: 1px solid rgba(96,165,250,.2);
}

.callout-warn {
  background: rgba(251,191,36,.07);
  border: 1px solid rgba(251,191,36,.2);
}

.callout-tip {
  background: rgba(16,185,129,.07);
  border: 1px solid rgba(16,185,129,.2);
}

.callout-error {
  background: rgba(248,113,113,.07);
  border: 1px solid rgba(248,113,113,.2);
}

.callout-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }

.callout-body { color: var(--text2); }
.callout-body strong { color: var(--text); display: block; margin-bottom: 4px; }

/* Schema diagram */
.schema-diagram {
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 28px;
  margin: 20px 0;
  overflow-x: auto;
}

.schema-table {
  display: inline-block;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 8px;
  min-width: 200px;
  vertical-align: top;
  margin: 8px;
}

.schema-table-header {
  background: var(--accent3);
  color: #0d0f14;
  padding: 10px 16px;
  border-radius: 8px 8px 0 0;
  font-weight: 700; font-size: 13px;
  font-family: 'DM Mono', monospace;
}

.schema-field {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 16px;
  border-bottom: 1px solid var(--border);
  font-family: 'DM Mono', monospace;
  font-size: 12px;
}

.schema-field:last-child { border-bottom: none; }
.field-name { color: var(--text); }
.field-type { color: var(--blue); margin-left: 12px; }
.field-pk { color: var(--yellow); font-size: 10px; margin-left: 6px; }
.field-fk { color: var(--purple); font-size: 10px; margin-left: 6px; }

.schema-rel {
  display: flex; align-items: center; justify-content: center;
  padding: 20px; font-size: 20px; color: var(--text3);
  vertical-align: middle;
}

/* Step indicators */
.step-list { margin: 20px 0; }

.step {
  display: flex; gap: 16px; margin-bottom: 24px;
}

.step-num {
  width: 30px; height: 30px; flex-shrink: 0;
  background: var(--accent3);
  color: #0d0f14;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 13px;
}

.step-body { padding-top: 4px; }

.step-title { font-weight: 600; color: var(--text); margin-bottom: 6px; }
.step-desc { font-size: 14px; color: var(--text2); }

/* File tree */
.file-tree {
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px 24px;
  font-family: 'DM Mono', monospace;
  font-size: 12.5px;
  color: var(--text2);
  margin: 20px 0;
  line-height: 2;
}

.ft-dir { color: var(--blue); }
.ft-file { color: var(--text2); }
.ft-comment { color: var(--text3); font-style: italic; }
.ft-accent { color: var(--accent); }

/* PREV/NEXT NAV */
.chapter-nav {
  display: flex; gap: 16px; margin-top: 60px;
  padding-top: 36px;
  border-top: 1px solid var(--border);
}

.nav-btn {
  display: flex; flex-direction: column; gap: 4px;
  flex: 1; background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 18px 22px;
  cursor: pointer;
  transition: all .2s;
  text-align: left;
}

.nav-btn:hover {
  border-color: var(--accent3);
  background: var(--surface2);
  transform: translateY(-1px);
}

.nav-btn.next { text-align: right; }

.nav-btn-label {
  font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
  color: var(--text3); font-family: 'DM Mono', monospace;
}

.nav-btn-title {
  font-size: 14px; font-weight: 600; color: var(--accent);
}

.nav-btn-sub { font-size: 12px; color: var(--text3); margin-top: 2px; }

.nav-btn-empty { opacity: 0; pointer-events: none; }

/* Responsive */
@media (max-width: 900px) {
  :root { --sidebar-w: 0px; }
  #sidebar {
    width: 260px;
    transform: translateX(-100%);
  }
  #sidebar.open { transform: translateX(0); }
  #main { margin-left: 0; }

<h2>What is an ORM?</h2>
<p>An <strong>Object-Relational Mapper (ORM)</strong> is a library that lets you interact with your database using your programming language's objects and classes — instead of writing SQL strings by hand. The ORM translates those object-level operations into the correct SQL queries behind the scenes.</p>

<p>Without an ORM, fetching a user from a PostgreSQL database looks like this:</p>

<div class="code-block">
  <div class="code-header"><span class="code-lang">JavaScript (raw SQL)</span></div>
  <pre><kw>const</kw> result = <kw>await</kw> pool.<fn>query</fn>(
  <str>'SELECT id, name, email FROM "User" WHERE id = $1'</str>,
  [userId]
);
<kw>const</kw> user = result.rows[<num>0</num>];</pre>
</div>

<p>With Prisma, the same operation is type-safe, readable, and autocompleted in your editor:</p>

<div class="code-block">
  <div class="code-header"><span class="code-lang">TypeScript (Prisma)</span></div>
  <pre><kw>const</kw> user = <kw>await</kw> prisma.user.<fn>findUnique</fn>({
  <prop>where</prop>: { <prop>id</prop>: userId }
});</pre>
</div>

<h2>Why Prisma? The Problems It Solves</h2>
<p>Traditional ORMs (Sequelize, TypeORM) were designed for JavaScript in an era before TypeScript was widespread. They work, but they have friction:</p>

<table class="comparison-table">

    <th>Problem</th>
    <th>Traditional ORMs</th>

  </tr>

    <td>Full end-to-end TypeScript types generated from your schema.</td>
  </tr>
  <tr>
    <td><strong>Schema source of truth</strong></td>
    <td>Schema lives in JS/TS class decorators — easy to drift from actual DB.</td>
    <td>Single <code>schema.prisma</code> file. DB is always in sync.</td>
  </tr>

    <td>Often manual or error-prone.</td>

  </tr>

    <td><strong>DX (Developer Experience)</strong></td>
    <td>Verbose configuration, confusing APIs.</td>
    <td>Intuitive API, Prisma Studio GUI, excellent autocomplete.</td>
  </tr>
</table>

<h2>Prisma's Three Core Components</h2>

<div class="step-list">
  <div class="step">

    </div>
  </div>

    </div>
  </div>
  <div class="step">
    <div class="step-num">3</div>
    <div class="step-body">
      <div class="step-title">Prisma Migrate</div>
      <div class="step-desc">A migration engine that diffs your schema changes and generates the exact SQL needed to evolve your database. You commit migration files to version control just like code.</div>
    </div>
  </div>

<div class="ch-header">
  <div class="ch-label">Chapter 03 — Foundations</div>
  <h1 class="ch-title">The Prisma Schema Language</h1>
  <p class="ch-desc">The <code>schema.prisma</code> file is the heart of Prisma. Learn every construct of the Prisma Schema Language so you can model any domain accurately.</p>
</div>

<h2>The Three Blocks</h2>
<p>Every <code>schema.prisma</code> file is composed of three kinds of blocks:</p>

<div class="code-block">
  <div class="code-header"><span class="code-lang">prisma</span><span class="code-file">prisma/schema.prisma</span></div>
  <pre><cm>// 1. Datasource — ONE per schema. Tells Prisma which database to use.</cm>
<kw>datasource</kw> <ty>db</ty> {
  <prop>provider</prop> = <str>"postgresql"</str>
  <prop>url</prop>      = <fn>env</fn>(<str>"DATABASE_URL"</str>)
}

<cm>// 2. Generator — how to generate Prisma Client</cm>
<kw>generator</kw> <ty>client</ty> {
  <prop>provider</prop> = <str>"prisma-client-js"</str>
}

<cm>// 3. Model — maps to a table in the database</cm>
<kw>model</kw> <ty>User</ty> {
  <prop>id</prop>    <ty>Int</ty>    <dec>@id</dec> <dec>@default</dec>(<fn>autoincrement</fn>())
  <prop>email</prop> <ty>String</ty> <dec>@unique</dec>
  <prop>name</prop>  <ty>String</ty>?
}</pre>
</div>

<h2>Field Types</h2>
<p>Prisma maps its scalar types to database-specific types automatically. You write clean, readable types in the schema and Prisma handles the SQL underneath.</p>

<table class="comparison-table">
  <tr><th>Prisma Type</th><th>PostgreSQL</th><th>Notes</th></tr>
  <tr><td><code>String</code></td><td><code>text</code></td><td>Default text. Use <code>@db.VarChar(n)</code> for VARCHAR.</td></tr>
  <tr><td><code>Int</code></td><td><code>integer</code></td><td>32-bit signed integer.</td></tr>
  <tr><td><code>BigInt</code></td><td><code>bigint</code></td><td>64-bit. Serializes as string in JS.</td></tr>
  <tr><td><code>Float</code></td><td><code>double precision</code></td><td>Floating-point number.</td></tr>
  <tr><td><code>Decimal</code></td><td><code>decimal</code></td><td>Exact. Use for money/finance.</td></tr>
  <tr><td><code>Boolean</code></td><td><code>boolean</code></td><td></td></tr>
  <tr><td><code>DateTime</code></td><td><code>timestamp(3)</code></td><td>ISO 8601 in JS. Always UTC.</td></tr>
  <tr><td><code>Json</code></td><td><code>jsonb</code></td><td>Arbitrary JSON. Use sparingly.</td></tr>
  <tr><td><code>Bytes</code></td><td><code>bytea</code></td><td>Binary data (files, hashes).</td></tr>
</table>

<h3>Optional Fields</h3>
<p>Append <code>?</code> to make a field nullable. Without it, the field is required and must have a value (NOT NULL in SQL).</p>

<div class="code-block">
  <div class="code-header"><span class="code-lang">prisma</span></div>
  <pre><prop>name</prop>     <ty>String</ty>   <cm>// required — cannot be null</cm>
<prop>bio</prop>      <ty>String</ty>?  <cm>// optional — can be null</cm>
<prop>avatarUrl</prop> <ty>String</ty>? <cm>// optional</cm></pre>
</div>

<h3>List Fields</h3>
<p>Append <code>[]</code> for a list. This is mainly used for relation fields (one-to-many). Scalar lists require special database support.</p>

<div class="code-block">
  <div class="code-header"><span class="code-lang">prisma</span></div>
  <pre><prop>posts</prop>  <ty>Post</ty>[]   <cm>// relation: one user has many posts</cm>
<prop>tags</prop>   <ty>String</ty>[] <cm>// scalar list (PostgreSQL array)</cm></pre>
</div>

<h2>Field Attributes</h2>
<p>Attributes modify field behavior. They start with <code>@</code> for field-level and <code>@@</code> for model-level.</p>

<div class="code-block">
  <div class="code-header"><span class="code-lang">prisma</span></div>
  <pre><kw>model</kw> <ty>User</ty> {
  <prop>id</prop>        <ty>Int</ty>      <dec>@id</dec> <dec>@default</dec>(<fn>autoincrement</fn>())  <cm>// Primary key, auto-increment</cm>
  <prop>email</prop>     <ty>String</ty>   <dec>@unique</dec>                        <cm>// Unique constraint</cm>
  <prop>name</prop>      <ty>String</ty>   <dec>@db.VarChar</dec>(<num>100</num>)               <cm>// Custom DB type</cm>
  <prop>role</prop>      <ty>Role</ty>     <dec>@default</dec>(<ty>USER</ty>)                   <cm>// Enum with default</cm>
  <prop>createdAt</prop> <ty>DateTime</ty> <dec>@default</dec>(<fn>now</fn>())                   <cm>// Set on create</cm>
  <prop>updatedAt</prop> <ty>DateTime</ty> <dec>@updatedAt</dec>                      <cm>// Auto-set on update</cm>
  <prop>deletedAt</prop> <ty>DateTime</ty>?                                <cm>// Soft delete timestamp</cm>

  <cm>// Model-level: composite unique constraint</cm>
  <dec>@@unique</dec>([<prop>name</prop>, <prop>email</prop>])
  <cm>// Model-level: add a database index</cm>
  <dec>@@index</dec>([<prop>createdAt</prop>])
}</pre>
</div>

<h4>Common @default() functions</h4>
<ul>
  <li><code>autoincrement()</code> — auto-incrementing integer PK</li>
  <li><code>uuid()</code> — generates a UUID (no guessable IDs)</li>
  <li><code>cuid()</code> — collision-resistant unique ID (URL-safe)</li>
  <li><code>now()</code> — current timestamp</li>
  <li><code>true</code> / <code>false</code> — boolean defaults</li>
</ul>

<h2>Enums</h2>
<p>Enums restrict a field to a fixed set of string values. They're enforced at both the Prisma and database levels.</p>

<div class="code-block">

  <pre><kw>enum</kw> <ty>Role</ty> {

}

<kw>enum</kw> <ty>TaskStatus</ty> {

  <ty>DONE</ty>
  <ty>CANCELLED</ty>
}

<kw>model</kw> <ty>User</ty> {
  <prop>id</prop>   <ty>Int</ty>  <dec>@id</dec> <dec>@default</dec>(<fn>autoincrement</fn>())
  <prop>role</prop> <ty>Role</ty> <dec>@default</dec>(<ty>USER</ty>)
}</pre>
</div>

<div class="ch-header">
  <div class="ch-label">Chapter 04 — Data Modeling</div>
  <h1 class="ch-title">Relations & Data Modeling</h1>
  <p class="ch-desc">Relationships are where most ORMs get complicated. Prisma's relation syntax is declarative and clear once you understand the pattern. Let's master it.</p>
</div>

<h2>How Relations Work in Prisma</h2>
<p>Every relation in Prisma has two sides. One model holds the <strong>foreign key</strong> (the "child"), and the other model has the <strong>virtual back-relation</strong> (the "parent"). Prisma uses the <code>@relation</code> attribute to link them together explicitly.</p>

<h2>One-to-Many (1:N)</h2>
<p>The most common relation. One <code>User</code> owns many <code>Projects</code>. The foreign key lives on the <em>many</em> side (<code>Project.ownerId</code>).</p>

<div class="code-block">
  <div class="code-header"><span class="code-lang">prisma</span></div>
  <pre><kw>model</kw> <ty>User</ty> {
  <prop>id</prop>       <ty>String</ty>    <dec>@id</dec> <dec>@default</dec>(<fn>cuid</fn>())
  <prop>projects</prop> <ty>Project</ty>[] <cm>// virtual — no column in DB</cm>
}

<kw>model</kw> <ty>Project</ty> {
  <prop>id</prop>      <ty>String</ty> <dec>@id</dec> <dec>@default</dec>(<fn>cuid</fn>())
  <prop>ownerId</prop> <ty>String</ty>             <cm>// the actual FK column</cm>
  <prop>owner</prop>   <ty>User</ty>   <dec>@relation</dec>(<prop>fields</prop>: [<prop>ownerId</prop>], <prop>references</prop>: [<prop>id</prop>])
}</pre>
</div>

<div class="schema-diagram">
  <div class="schema-table">
    <div class="schema-table-header">User</div>
    <div class="schema-field"><span class="field-name">id</span><span class="field-type">String<span class="field-pk">PK</span></span></div>
    <div class="schema-field"><span class="field-name">email</span><span class="field-type">String</span></div>
    <div class="schema-field"><span class="field-name">name</span><span class="field-type">String</span></div>
  </div>
  <div class="schema-rel">1 ──── N</div>
  <div class="schema-table">
    <div class="schema-table-header">Project</div>
    <div class="schema-field"><span class="field-name">id</span><span class="field-type">String<span class="field-pk">PK</span></span></div>
    <div class="schema-field"><span class="field-name">name</span><span class="field-type">String</span></div>
    <div class="schema-field"><span class="field-name">ownerId</span><span class="field-type">String<span class="field-fk">FK</span></span></div>
  </div>
</div>

<h2>Many-to-Many (M:N)</h2>
<p>When two models relate arbitrarily to each other — like <code>Task</code>s and <code>Label</code>s. Prisma supports both implicit (auto join table) and explicit (you control the join table) approaches.</p>

<h3>Implicit Many-to-Many (Prisma manages the join table)</h3>
<div class="code-block">
  <div class="code-header"><span class="code-lang">prisma</span></div>
  <pre><kw>model</kw> <ty>Task</ty> {
  <prop>id</prop>     <ty>String</ty>  <dec>@id</dec> <dec>@default</dec>(<fn>cuid</fn>())
  <prop>labels</prop> <ty>Label</ty>[] <cm>// Prisma auto-creates _LabelToTask join table</cm>
}

<kw>model</kw> <ty>Label</ty> {
  <prop>id</prop>    <ty>String</ty> <dec>@id</dec> <dec>@default</dec>(<fn>cuid</fn>())
  <prop>name</prop>  <ty>String</ty>
  <prop>tasks</prop> <ty>Task</ty>[]
}</pre>
</div>

<h3>Explicit Many-to-Many (you control the join table)</h3>
<p>Use this when you need additional fields on the relationship — like a <code>role</code> for project membership.</p>

<div class="code-block">
  <div class="code-header"><span class="code-lang">prisma</span></div>
  <pre><kw>model</kw> <ty>User</ty> {
  <prop>id</prop>          <ty>String</ty>            <dec>@id</dec> <dec>@default</dec>(<fn>cuid</fn>())
  <prop>memberships</prop> <ty>ProjectMember</ty>[]
}

<kw>model</kw> <ty>Project</ty> {
  <prop>id</prop>      <ty>String</ty>          <dec>@id</dec> <dec>@default</dec>(<fn>cuid</fn>())
  <prop>members</prop> <ty>ProjectMember</ty>[]
}

<cm>// Explicit join table with extra data</cm>
<kw>model</kw> <ty>ProjectMember</ty> {
  <prop>userId</prop>    <ty>String</ty>
  <prop>projectId</prop> <ty>String</ty>
  <prop>role</prop>      <ty>String</ty>   <dec>@default</dec>(<str>"MEMBER"</str>)
  <prop>joinedAt</prop>  <ty>DateTime</ty> <dec>@default</dec>(<fn>now</fn>())

  <prop>user</prop>    <ty>User</ty>    <dec>@relation</dec>(<prop>fields</prop>: [<prop>userId</prop>],    <prop>references</prop>: [<prop>id</prop>])
  <prop>project</prop> <ty>Project</ty> <dec>@relation</dec>(<prop>fields</prop>: [<prop>projectId</prop>], <prop>references</prop>: [<prop>id</prop>])

  <dec>@@id</dec>([<prop>userId</prop>, <prop>projectId</prop>]) <cm>// composite primary key</cm>
}</pre>
</div>

<h2>One-to-One (1:1)</h2>
<p>Each <code>User</code> has exactly one <code>Profile</code>. The <code>@unique</code> on the FK field is what makes it 1:1 (not 1:N).</p>

<div class="code-block">
  <div class="code-header"><span class="code-lang">prisma</span></div>
  <pre><kw>model</kw> <ty>User</ty> {
  <prop>id</prop>      <ty>String</ty>   <dec>@id</dec> <dec>@default</dec>(<fn>cuid</fn>())
  <prop>profile</prop> <ty>Profile</ty>?
}

<kw>model</kw> <ty>Profile</ty> {
  <prop>id</prop>     <ty>String</ty> <dec>@id</dec> <dec>@default</dec>(<fn>cuid</fn>())
  <prop>bio</prop>    <ty>String</ty>?
  <prop>userId</prop> <ty>String</ty> <dec>@unique</dec>  <cm>// @unique makes it 1:1, not 1:N</cm>
  <prop>user</prop>   <ty>User</ty>   <dec>@relation</dec>(<prop>fields</prop>: [<prop>userId</prop>], <prop>references</prop>: [<prop>id</prop>])
}</pre>
</div>

<h2>Referential Actions (onDelete, onUpdate)</h2>
<p>What should happen to child records when a parent is deleted? Prisma makes this explicit and enforceable.</p>

<table class="comparison-table">
  <tr><th>Action</th><th>Behavior</th></tr>
  <tr><td><code>Cascade</code></td><td>Delete children when parent is deleted. Use for tasks → comments.</td></tr>
  <tr><td><code>SetNull</code></td><td>Set FK to NULL when parent is deleted. Field must be optional.</td></tr>
  <tr><td><code>Restrict</code></td><td>Prevent parent deletion if children exist. Good for safety.</td></tr>
  <tr><td><code>NoAction</code></td><td>Let the database decide (typically Restrict). Default behavior.</td></tr>
</table>

<div class="code-block">
  <div class="code-header"><span class="code-lang">prisma</span></div>
  <pre><kw>model</kw> <ty>Task</ty> {
  <prop>projectId</prop> <ty>String</ty>
  <prop>project</prop>   <ty>Project</ty> <dec>@relation</dec>(
    <prop>fields</prop>:   [<prop>projectId</prop>],
    <prop>references</prop>: [<prop>id</prop>],
    <prop>onDelete</prop>: <ty>Cascade</ty>  <cm>// delete project → delete its tasks</cm>
  )

  <prop>assigneeId</prop> <ty>String</ty>?
  <prop>assignee</prop>   <ty>User</ty>? <dec>@relation</dec>(
    <prop>fields</prop>:   [<prop>assigneeId</prop>],
    <prop>references</prop>: [<prop>id</prop>],
    <prop>onDelete</prop>: <ty>SetNull</ty>  <cm>// delete user → unassign their tasks</cm>
  )
}</pre>
</div>

<div class="callout callout-warn">
  <span class="callout-icon">⚠️</span>
  <div class="callout-body">
    <strong>Referential integrity in Prisma</strong> — By default, Prisma enforces referential actions at the <em>application level</em> when using MongoDB or in some SQLite configs. For PostgreSQL, these map directly to database-level constraints (the safest option). Always use PostgreSQL or MySQL for production.
  </div>
</div>

<h2>Self-Referencing Relations</h2>
<p>A model that relates to itself. Classic example: a tree of comments with nested replies, or an organizational hierarchy.</p>

<div class="code-block">
  <div class="code-header"><span class="code-lang">prisma</span></div>
  <pre><kw>model</kw> <ty>Comment</ty> {
  <prop>id</prop>       <ty>String</ty>    <dec>@id</dec> <dec>@default</dec>(<fn>cuid</fn>())
  <prop>content</prop>  <ty>String</ty>
  <prop>taskId</prop>   <ty>String</ty>

  <cm>// Self-reference for replies</cm>
  <prop>parentId</prop> <ty>String</ty>?
  <prop>parent</prop>   <ty>Comment</ty>?   <dec>@relation</dec>(<str>"CommentReplies"</str>, <prop>fields</prop>: [<prop>parentId</prop>], <prop>references</prop>: [<prop>id</prop>])
  <prop>replies</prop>  <ty>Comment</ty>[]  <dec>@relation</dec>(<str>"CommentReplies"</str>)
}</pre>
</div>

<div class="callout callout-tip">
  <span class="callout-icon">💡</span>
  <div class="callout-body">
    <strong>Named relations</strong> — When a model has two relations to the same model (or a self-relation), you must name them with a string to disambiguate. Prisma will error if you don't.
  </div>
</div>
    `

<div class="ch-header">
  <div class="ch-label">Chapter 05 — Data Modeling</div>
  <h1 class="ch-title">Migrations with Prisma Migrate</h1>
  <p class="ch-desc">Database migrations are how you safely evolve your schema over time, in a way that's reproducible and version-controlled. Prisma's migration workflow is one of its strongest features.</p>

<h2>The Migration Workflow</h2>
<p>Prisma Migrate compares your <code>schema.prisma</code> to the actual database state, generates the SQL diff, and records it as a versioned migration file. You commit these files to Git so every team member and every deployment environment can replay the exact same changes.</p>

<div class="step-list">
  <div class="step">
    <div class="step-num">1</div>
    <div class="step-body">
      <div class="step-title">Edit schema.prisma</div>
      <div class="step-desc">Add a new model, field, or relation. Save the file.</div>
    </div>
  </div>
  <div class="step">
    <div class="step-num">2</div>
    <div class="step-body">
      <div class="step-title">Run prisma migrate dev</div>
      <div class="step-desc">Prisma computes the SQL diff, saves it to <code>prisma/migrations/</code>, and applies it to your dev database immediately.</div>
    </div>
  </div>
  <div class="step">
    <div class="step-num">3</div>
    <div class="step-body">
      <div class="step-title">Commit the migration file</div>
      <div class="step-desc">The migration SQL file is committed to version control alongside your schema change. Your teammates can apply it with <code>prisma migrate dev</code>.</div>
    </div>
  </div>
  <div class="step">
    <div class="step-num">4</div>
    <div class="step-body">
      <div class="step-title">Deploy to production</div>
      <div class="step-desc">Run <code>prisma migrate deploy</code> in CI/CD. It applies only unapplied migrations without prompting — safe for production.</div>
    </div>
  </div>
</div>

<h2>Creating the First Migration</h2>

<div class="code-block">
  <div class="code-header"><span class="code-lang">bash</span><span class="code-file">server/</span></div>
  <pre>npx prisma migrate dev --name init</pre>
</div>

<p>Prisma will prompt you to confirm and then generate output like this:</p>

<div class="code-block">
  <div class="code-header"><span class="code-lang">output</span></div>
  <pre>Prisma schema loaded from prisma/schema.prisma
Datasource "db": PostgreSQL database "taskflow"

Applying migration 20240115120000_init

The following migration(s) have been created and applied:

migrations/
  └─ 20240115120000_init/
       └─ migration.sql

Your database is now in sync with your schema.

Running generate... (Use --skip-generate to skip the generators)
✔ Generated Prisma Client (v5.x.x)</pre>
</div>

<h2>What the Generated SQL Looks Like</h2>
<p>Prisma writes the SQL for you. You can always inspect it:</p>

<div class="code-block">
  <div class="code-header"><span class="code-lang">SQL</span><span class="code-file">prisma/migrations/20240115120000_init/migration.sql</span></div>
  <pre><cm>-- CreateEnum</cm>
<kw>CREATE TYPE</kw> <ty>"Role"</ty> <kw>AS ENUM</kw> (<str>'USER'</str>, <str>'ADMIN'</str>);
<kw>CREATE TYPE</kw> <ty>"TaskStatus"</ty> <kw>AS ENUM</kw> (<str>'TODO'</str>, <str>'IN_PROGRESS'</str>, <str>'DONE'</str>, <str>'CANCELLED'</str>);

<cm>-- CreateTable</cm>
<kw>CREATE TABLE</kw> <ty>"User"</ty> (
    <str>"id"</str>        <ty>TEXT</ty> <kw>NOT NULL</kw>,
    <str>"email"</str>     <ty>TEXT</ty> <kw>NOT NULL</kw>,
    <str>"name"</str>      <ty>TEXT</ty> <kw>NOT NULL</kw>,
    <str>"password"</str>  <ty>TEXT</ty> <kw>NOT NULL</kw>,
    <str>"role"</str>      <ty>"Role"</ty> <kw>NOT NULL DEFAULT</kw> <str>'USER'</str>,
    <str>"createdAt"</str> <ty>TIMESTAMP(3)</ty> <kw>NOT NULL DEFAULT</kw> <fn>CURRENT_TIMESTAMP</fn>,
    <str>"updatedAt"</str> <ty>TIMESTAMP(3)</ty> <kw>NOT NULL</kw>,

    <kw>CONSTRAINT</kw> <str>"User_pkey"</str> <kw>PRIMARY KEY</kw> (<str>"id"</str>)
);

<kw>CREATE UNIQUE INDEX</kw> <str>"User_email_key"</str> <kw>ON</kw> <ty>"User"</ty>(<str>"email"</str>);</pre>

<h2>Evolving the Schema</h2>
<p>After your initial migration, adding new features is simple. Say we want to add a <code>completedAt</code> field to <code>Task</code>:</p>

<div class="code-block">
  <div class="code-header"><span class="code-lang">prisma</span><span class="code-file">schema.prisma (change)</span></div>
  <pre><kw>model</kw> <ty>Task</ty> {
  <cm>// ... existing fields ...</cm>

<div class="code-block">

<p>This generates a second migration file with just the <code>ALTER TABLE</code> needed — without touching anything else.</p>

<h2>Key Commands Reference</h2>

<table class="comparison-table">

  <tr><td><code>prisma migrate dev</code></td><td>Development: generate + apply + regenerate client</td></tr>

  <tr><td><code>prisma migrate reset</code></td><td>Drop DB, re-apply all migrations + run seed. Dev only!</td></tr>

  <tr><td><code>prisma db push</code></td><td>Push schema directly to DB without migration files. Good for rapid prototyping.</td></tr>
  <tr><td><code>prisma generate</code></td><td>Regenerate Prisma Client without running migrations</td></tr>
  <tr><td><code>prisma studio</code></td><td>Open visual database browser at localhost:5555</td></tr>
</table>

  </div>
</div>

<h2>Instantiating the Client</h2>
<p>Create a single Prisma Client instance and reuse it across your application. In Node.js/Express, module caching ensures only one instance is created.</p>

<div class="code-block">
  <div class="code-header"><span class="code-lang">TypeScript</span><span class="code-file">server/src/lib/prisma.ts</span></div>
  <pre><kw>import</kw> { PrismaClient } <kw>from</kw> <str>'@prisma/client'</str>;

<kw>const</kw> prisma = <kw>new</kw> <fn>PrismaClient</fn>({
  <prop>log</prop>: process.env.NODE_ENV === <str>'development'</str>
    ? [<str>'query'</str>, <str>'info'</str>, <str>'warn'</str>, <str>'error'</str>]
    : [<str>'error'</str>],
});

<kw>export default</kw> prisma;</pre>
</div>

<div class="callout callout-warn">
  <span class="callout-icon">⚠️</span>
  <div class="callout-body">
    <strong>One client per application.</strong> Creating multiple PrismaClient instances creates multiple database connection pools. Always export a singleton. In Next.js's hot-reload environment, add a global guard to prevent multiple instances during development.
  </div>
</div>

<h2>CREATE — Adding Records</h2>

<div class="code-block">
  <div class="code-header"><span class="code-lang">TypeScript</span></div>
  <pre><cm>// Create a single user</cm>
<kw>const</kw> user = <kw>await</kw> prisma.user.<fn>create</fn>({
  <prop>data</prop>: {
    <prop>email</prop>: <str>'alice@example.com'</str>,
    <prop>name</prop>: <str>'Alice Chen'</str>,
    <prop>password</prop>: <str>'hashed_password_here'</str>,
  }
});
<cm>// user.id, user.email, user.name are all typed!</cm>

<cm>// Create a project WITH nested task creation (transaction)</cm>
<kw>const</kw> project = <kw>await</kw> prisma.project.<fn>create</fn>({
  <prop>data</prop>: {
    <prop>name</prop>: <str>'TaskFlow MVP'</str>,
    <prop>description</prop>: <str>'Build the initial version'</str>,
    <prop>ownerId</prop>: user.id,
    <prop>tasks</prop>: {

        { <prop>title</prop>: <str>'Design API routes'</str>, <prop>priority</prop>: <str>'MEDIUM'</str> },
      ]
    }
  },
  <prop>include</prop>: { <prop>tasks</prop>: <kw>true</kw> } <cm>// return nested tasks in response</cm>
});</pre>
</div>

<h2>READ — Fetching Records</h2>

<div class="code-block">
  <div class="code-header"><span class="code-lang">TypeScript</span></div>
  <pre><cm>// Find a single record by unique field</cm>
<kw>const</kw> user = <kw>await</kw> prisma.user.<fn>findUnique</fn>({
  <prop>where</prop>: { <prop>email</prop>: <str>'alice@example.com'</str> }
});
<cm>// Returns null if not found — always check!</cm>

<cm>// Find the first match (not necessarily unique)</cm>
<kw>const</kw> latestTask = <kw>await</kw> prisma.task.<fn>findFirst</fn>({
  <prop>where</prop>: { <prop>status</prop>: <str>'IN_PROGRESS'</str> },
  <prop>orderBy</prop>: { <prop>createdAt</prop>: <str>'desc'</str> }
});

<cm>// Find all matching records</cm>
<kw>const</kw> tasks = <kw>await</kw> prisma.task.<fn>findMany</fn>({
  <prop>where</prop>: {
    <prop>projectId</prop>: <str>'clxx...'</str>,
    <prop>status</prop>: { <prop>not</prop>: <str>'CANCELLED'</str> }
  },
  <prop>orderBy</prop>: [
    { <prop>priority</prop>: <str>'desc'</str> },
    { <prop>createdAt</prop>: <str>'asc'</str> }
  ],
  <prop>include</prop>: {
    <prop>assignee</prop>: { <prop>select</prop>: { <prop>id</prop>: <kw>true</kw>, <prop>name</prop>: <kw>true</kw>, <prop>email</prop>: <kw>true</kw> } }
  }
});</pre>
</div>

<h3>select vs include</h3>
<p>These two are often confused. The difference is important:</p>

<ul>
  <li><strong><code>include</code></strong> — adds related models to the result. The main model's fields are always returned.</li>
  <li><strong><code>select</code></strong> — only returns the specific fields you list. The main model's other fields are omitted.</li>
</ul>

<div class="code-block">
  <div class="code-header"><span class="code-lang">TypeScript</span></div>
  <pre><cm>// select: only return id, name, and their tasks' titles</cm>
<kw>const</kw> users = <kw>await</kw> prisma.user.<fn>findMany</fn>({
  <prop>select</prop>: {
    <prop>id</prop>: <kw>true</kw>,
    <prop>name</prop>: <kw>true</kw>,
    <cm>// password is NOT included — safe to send to client</cm>
    <prop>tasks</prop>: {
      <prop>select</prop>: { <prop>id</prop>: <kw>true</kw>, <prop>title</prop>: <kw>true</kw>, <prop>status</prop>: <kw>true</kw> }
    }
  }
});</pre>
</div>

<h2>DELETE — Removing Records</h2>

<div class="code-block">

<h2>Atomic Number Operations</h2>
<p>Prisma has atomic field update operations for numbers — crucial for avoiding race conditions in concurrent environments.</p>

<div class="code-block">

  <prop>data</prop>: {

<div class="code-block">

<cm>// Aggregate numeric fields</cm>
<kw>const</kw> stats = <kw>await</kw> prisma.task.<fn>aggregate</fn>({

  <prop>_count</prop>: { <prop>_all</prop>: <kw>true</kw> }
});
<cm>// → [{ status: 'TODO', _count: { _all: 5 } }, ...]</cm></pre>
</div>

<h2>String Filters</h2>
<p>Prisma provides several string comparison operations that map to SQL <code>LIKE</code> and <code>ILIKE</code> queries.</p>

<div class="code-block">
  <div class="code-header"><span class="code-lang">TypeScript</span></div>
  <pre><cm>// Exact match (default)</cm>

<cm>// Contains (case-sensitive by default)</cm>

<cm>// Case-insensitive contains — the most useful search filter</cm>
{ <prop>where</prop>: { <prop>name</prop>: { <prop>contains</prop>: <str>'alice'</str>, <prop>mode</prop>: <str>'insensitive'</str> } } }

<cm>// Starts with / Ends with</cm>
{ <prop>where</prop>: { <prop>email</prop>: { <prop>startsWith</prop>: <str>'admin'</str> } } }
{ <prop>where</prop>: { <prop>email</prop>: { <prop>endsWith</prop>: <str>'@company.com'</str> } } }

<cm>// NOT a specific value</cm>
{ <prop>where</prop>: { <prop>status</prop>: { <prop>not</prop>: <str>'CANCELLED'</str> } } }</pre>
</div>

<h2>Numeric & Date Comparisons</h2>
<div class="code-block">

<kw>const</kw> overdueTasks = <kw>await</kw> prisma.task.<fn>findMany</fn>({

    <prop>dueDate</prop>: { <prop>lt</prop>: <kw>new</kw> <fn>Date</fn>() },      <cm>// due date is in the past</cm>
    <prop>status</prop>: { <prop>not</prop>: <str>'DONE'</str> }

});

<cm>// Date range</cm>

  <prop>where</prop>: {

<h2>Practical: A Flexible Search Endpoint</h2>
<p>Real APIs need flexible filtering. Here's how to build a composable query from URL parameters:</p>

<div class="code-block">

  <pre><cm>// GET /api/tasks?status=TODO&priority=HIGH&search=api&projectId=xxx</cm>

  <kw>const</kw> { status, priority, search, projectId, assigneeId } = req.query;

  <kw>const</kw> where: Prisma.TaskWhereInput = {};

  <kw>if</kw> (projectId) where.projectId = projectId <kw>as</kw> <ty>string</ty>;
  <kw>if</kw> (assigneeId) where.assigneeId = assigneeId <kw>as</kw> <ty>string</ty>;
  <kw>if</kw> (status) where.status = status <kw>as</kw> <ty>TaskStatus</ty>;
  <kw>if</kw> (priority) where.priority = priority <kw>as</kw> <ty>Priority</ty>;

<div class="ch-header">
  <div class="ch-label">Chapter 08 — Querying</div>
  <h1 class="ch-title">Pagination & Sorting</h1>
  <p class="ch-desc">Without pagination, a single query could return millions of rows and bring your server to its knees. Learn both offset and cursor-based pagination, plus efficient sorting.</p>

<h2>Offset Pagination (skip/take)</h2>
<p>The classic page-number approach. Simple to implement and understand, but becomes slow on large datasets because the database must scan and discard all rows before the offset.</p>

<div class="code-block">
  <div class="code-header"><span class="code-lang">TypeScript</span></div>
  <pre><cm>// Page 1: skip 0, take 10</cm>
<cm>// Page 2: skip 10, take 10</cm>
<cm>// Page N: skip (N-1) * pageSize, take pageSize</cm>

<kw>const</kw> page = <fn>parseInt</fn>(req.query.page <kw>as</kw> <ty>string</ty>) || <num>1</num>;
<kw>const</kw> pageSize = <fn>parseInt</fn>(req.query.pageSize <kw>as</kw> <ty>string</ty>) || <num>20</num>;

<kw>const</kw> [tasks, total] = <kw>await</kw> prisma.<fn>$transaction</fn>([
  prisma.task.<fn>findMany</fn>({
    <prop>where</prop>,
    <prop>skip</prop>: (page - <num>1</num>) * pageSize,
    <prop>take</prop>: pageSize,
    <prop>orderBy</prop>: { <prop>createdAt</prop>: <str>'desc'</str> }
  }),
  prisma.task.<fn>count</fn>({ where })
]);

res.<fn>json</fn>({
  <prop>data</prop>: tasks,
  <prop>meta</prop>: {
    <prop>total</prop>,
    <prop>page</prop>,
    <prop>pageSize</prop>,
    <prop>totalPages</prop>: <fn>Math</fn>.<fn>ceil</fn>(total / pageSize),
    <prop>hasNext</prop>: page * pageSize < total,
    <prop>hasPrev</prop>: page > <num>1</num>
  }
});</pre>
</div>

<h2>Cursor-Based Pagination</h2>
<p>The recommended approach for large datasets. Instead of "go to page 5", you say "give me 20 items after this specific ID". It's stable (no skipping records when items are added) and fast regardless of position.</p>

<div class="code-block">
  <div class="code-header"><span class="code-lang">TypeScript</span></div>
  <pre><cm>// First page: no cursor</cm>
<cm>// Subsequent pages: pass the ID of the last item you received</cm>
<cm>// GET /api/tasks?cursor=clxx123&take=20</cm>

<kw>const</kw> cursor = req.query.cursor <kw>as</kw> <ty>string</ty> | <kw>undefined</kw>;
<kw>const</kw> take = <num>20</num>;

<kw>const</kw> tasks = <kw>await</kw> prisma.task.<fn>findMany</fn>({
  <prop>take</prop>: take + <num>1</num>,  <cm>// take one extra to determine if there's a next page</cm>
  <prop>cursor</prop>: cursor ? { <prop>id</prop>: cursor } : <kw>undefined</kw>,
  <prop>skip</prop>: cursor ? <num>1</num> : <num>0</num>,  <cm>// skip the cursor itself</cm>
  <prop>orderBy</prop>: { <prop>createdAt</prop>: <str>'desc'</str> }
});

<kw>const</kw> hasNextPage = tasks.length > take;
<kw>const</kw> items = hasNextPage ? tasks.<fn>slice</fn>(<num>0</num>, -<num>1</num>) : tasks;
<kw>const</kw> nextCursor = hasNextPage ? items[items.length - <num>1</num>].id : <kw>null</kw>;

res.<fn>json</fn>({ <prop>data</prop>: items, <prop>nextCursor</prop>, <prop>hasNextPage</prop> });</pre>
</div>

<div class="callout callout-tip">
  <span class="callout-icon">💡</span>
  <div class="callout-body">
    <strong>When to use which?</strong> Use <strong>offset pagination</strong> when users need to jump to specific pages (search results, admin tables). Use <strong>cursor pagination</strong> for infinite scroll, feed-style UIs, and any large dataset where performance matters.
  </div>
</div>

<h2>Sorting</h2>
<p>Prisma's <code>orderBy</code> accepts single or multiple sort fields. Multiple fields are sorted left-to-right (first field takes priority).</p>

<div class="code-block">
  <div class="code-header"><span class="code-lang">TypeScript</span></div>
  <pre><cm>// Single field</cm>
<kw>await</kw> prisma.task.<fn>findMany</fn>({
  <prop>orderBy</prop>: { <prop>createdAt</prop>: <str>'desc'</str> }
});

<cm>// Multiple fields: priority first, then due date</cm>
<kw>await</kw> prisma.task.<fn>findMany</fn>({
  <prop>orderBy</prop>: [
    { <prop>priority</prop>: <str>'desc'</str> },
    { <prop>dueDate</prop>: <str>'asc'</str> }
  ]
});

<cm>// Sort by a related field</cm>
<kw>await</kw> prisma.task.<fn>findMany</fn>({
  <prop>orderBy</prop>: {
    <prop>project</prop>: { <prop>name</prop>: <str>'asc'</str> }  <cm>// sort tasks by their project name</cm>
  }
});

<cm>// Sort by _count of a relation (tasks with most comments first)</cm>
<kw>await</kw> prisma.project.<fn>findMany</fn>({
  <prop>orderBy</prop>: {
    <prop>tasks</prop>: { <prop>_count</prop>: <str>'desc'</str> }
  }
});</pre>
</div>

<h2>Handling Sort from URL Params</h2>

<div class="code-block">

<div class="ch-header">
  <div class="ch-label">Chapter 09 — Querying</div>
  <h1 class="ch-title">Transactions & the $transaction API</h1>
  <p class="ch-desc">Transactions guarantee that a group of database operations either all succeed or all fail. They're essential for maintaining data integrity in any real application.</p>
</div>

<h2>Why Transactions Matter</h2>
<p>Imagine moving a task from one project to another. This requires two writes: remove from project A, add to project B. If the server crashes between the two writes, you've lost the task. A transaction wraps both operations — if either fails, both are rolled back.</p>

<h2>Sequential Transactions (Array Style)</h2>
<p>The simplest form: pass an array of Prisma operations. They run sequentially, and if any fails, all are rolled back.</p>

<div class="code-block">
  <div class="code-header"><span class="code-lang">TypeScript</span></div>
  <pre><cm>// Transfer a task between projects atomically</cm>
<kw>const</kw> [updatedTask, fromProject, toProject] = <kw>await</kw> prisma.<fn>$transaction</fn>([
  prisma.task.<fn>update</fn>({
    <prop>where</prop>: { <prop>id</prop>: taskId },
    <prop>data</prop>: { <prop>projectId</prop>: targetProjectId }
  }),
  prisma.project.<fn>update</fn>({
    <prop>where</prop>: { <prop>id</prop>: sourceProjectId },
    <prop>data</prop>: { <prop>taskCount</prop>: { <prop>decrement</prop>: <num>1</num> } }
  }),
  prisma.project.<fn>update</fn>({
    <prop>where</prop>: { <prop>id</prop>: targetProjectId },
    <prop>data</prop>: { <prop>taskCount</prop>: { <prop>increment</prop>: <num>1</num> } }
  }),
]);</pre>
</div>

<h2>Interactive Transactions (Callback Style)</h2>
<p>More powerful: you get a transaction-scoped Prisma client (<code>tx</code>) and can make decisions based on earlier reads within the same transaction.</p>

<div class="code-block">
  <div class="code-header"><span class="code-lang">TypeScript</span></div>
  <pre><cm>// Register a user and create their default project</cm>
<kw>const</kw> result = <kw>await</kw> prisma.<fn>$transaction</fn>(<kw>async</kw> (tx) => {
  <cm>// Check email isn't taken (inside the transaction)</cm>
  <kw>const</kw> existing = <kw>await</kw> tx.user.<fn>findUnique</fn>({
    <prop>where</prop>: { <prop>email</prop> }
  });

  <kw>if</kw> (existing) {
    <kw>throw new</kw> <fn>Error</fn>(<str>'Email already in use'</str>); <cm>// auto-rollback!</cm>
  }

  <cm>// Create the user</cm>
  <kw>const</kw> user = <kw>await</kw> tx.user.<fn>create</fn>({
    <prop>data</prop>: { <prop>email</prop>, <prop>name</prop>, <prop>password</prop>: hashedPassword }
  });

  <cm>// Create their default "Inbox" project</cm>
  <kw>const</kw> project = <kw>await</kw> tx.project.<fn>create</fn>({
    <prop>data</prop>: {
      <prop>name</prop>: <str>'Inbox'</str>,
      <prop>description</prop>: <str>'Default project for uncategorized tasks'</str>,
      <prop>ownerId</prop>: user.id
    }
  });

  <kw>return</kw> { user, project };
});

<cm>// result = { user: {...}, project: {...} } — both created or neither</cm></pre>
</div>

<div class="callout callout-info">
  <span class="callout-icon">ℹ️</span>
  <div class="callout-body">
    <strong>Throwing inside a transaction triggers rollback.</strong> Prisma automatically rolls back all operations in the callback if an error is thrown. You don't need to manually call <code>ROLLBACK</code>. Just <code>throw</code> on any validation failure.
  </div>
</div>

<h2>Practical: Complete Task with Audit Log</h2>

<div class="code-block">

  <pre><kw>import</kw> { Request, Response, NextFunction } <kw>from</kw> <str>'express'</str>;

<h2>Query Hooks</h2>
<p>Wrap API calls in TanStack Query hooks for caching, loading states, and automatic background refetching.</p>

<div class="code-block">
  <div class="code-header"><span class="code-lang">TypeScript</span><span class="code-file">client/src/hooks/useTasks.ts</span></div>
  <pre><kw>import</kw> { useQuery, useMutation, useQueryClient } <kw>from</kw> <str>'@tanstack/react-query'</str>;
<kw>import</kw> { api } <kw>from</kw> <str>'../lib/api'</str>;
<kw>import</kw> { <ty>Task</ty> } <kw>from</kw> <str>'../types'</str>;

<kw>export const</kw> <fn>useTasks</fn> = (projectId?: <ty>string</ty>) => {
  <kw>return</kw> <fn>useQuery</fn>({
    <prop>queryKey</prop>: [<str>'tasks'</str>, projectId],
    <prop>queryFn</prop>: <kw>async</kw> () => {
      <kw>const</kw> params = projectId ? { projectId } : {};
      <kw>const</kw> { data } = <kw>await</kw> api.<fn>get</fn><<ty>Task</ty>[]>(<str>'/tasks'</str>, { params });
      <kw>return</kw> data;
    }
  });
};

<kw>export const</kw> <fn>useCreateTask</fn> = () => {
  <kw>const</kw> qc = <fn>useQueryClient</fn>();
  <kw>return</kw> <fn>useMutation</fn>({
    <prop>mutationFn</prop>: (data: <fn>Partial</fn><<ty>Task</ty>>) =>
      api.<fn>post</fn>(<str>'/tasks'</str>, data).<fn>then</fn>(r => r.data),
    <prop>onSuccess</prop>: () => {
      qc.<fn>invalidateQueries</fn>({ <prop>queryKey</prop>: [<str>'tasks'</str>] });
    }
  });
};

<kw>export const</kw> <fn>useUpdateTask</fn> = () => {
  <kw>const</kw> qc = <fn>useQueryClient</fn>();
  <kw>return</kw> <fn>useMutation</fn>({
    <prop>mutationFn</prop>: ({ id, ...data }: <fn>Partial</fn><<ty>Task</ty>> & { id: <ty>string</ty> }) =>
      api.<fn>patch</fn>(<str>\`/tasks/\${id}\`</str>, data).<fn>then</fn>(r => r.data),
    <prop>onSuccess</prop>: (_, { id }) => {
      qc.<fn>invalidateQueries</fn>({ <prop>queryKey</prop>: [<str>'tasks'</str>] });
      qc.<fn>invalidateQueries</fn>({ <prop>queryKey</prop>: [<str>'task'</str>, id] });
    }
  });
};</pre>
</div>

<div class="ch-header">
  <div class="ch-label">Chapter 14 — Advanced</div>
  <h1 class="ch-title">Prisma Middleware & Soft Deletes</h1>
  <p class="ch-desc">Prisma middleware lets you intercept and modify queries globally — perfect for soft deletes, audit logs, automatic field population, and query performance monitoring.</p>

<h2>What is Prisma Middleware?</h2>
<p>Middleware functions run before or after every query. They receive the query parameters, can modify them, call the underlying query, and post-process the result. They're similar to Express middleware but for database operations.</p>

<div class="code-block">
  <div class="code-header"><span class="code-lang">TypeScript</span></div>
  <pre>prisma.<fn>$use</fn>(<kw>async</kw> (params, next) => {
  <cm>// params.model  → 'Task', 'User', etc.</cm>
  <cm>// params.action → 'findMany', 'create', 'delete', etc.</cm>
  <cm>// params.args   → the query arguments (where, data, etc.)</cm>

  <cm>// Modify params before the query...</cm>
  <kw>const</kw> result = <kw>await</kw> <fn>next</fn>(params); <cm>// run the actual query</cm>
  <cm>// Post-process result...</cm>
  <kw>return</kw> result;
});</pre>
</div>

<h2>Soft Deletes</h2>
<p>Instead of truly deleting records, "soft delete" sets a <code>deletedAt</code> timestamp. The record remains in the database for audit purposes but is filtered out of normal queries. This is a classic enterprise pattern.</p>

<h3>Step 1: Add deletedAt to the Schema</h3>

<div class="code-block">
  <div class="code-header"><span class="code-lang">prisma</span><span class="code-file">schema.prisma</span></div>
  <pre><kw>model</kw> <ty>Task</ty> {
  <cm>// ... existing fields ...</cm>
  <prop>deletedAt</prop> <ty>DateTime</ty>? <cm>// null = active, set = soft-deleted</cm>
}</pre>
</div>

<div class="code-block">
  <div class="code-header"><span class="code-lang">bash</span></div>
  <pre>npx prisma migrate dev --name add_soft_delete</pre>
</div>

<h3>Step 2: Add the Middleware</h3>

<div class="code-block">
  <div class="code-header"><span class="code-lang">TypeScript</span><span class="code-file">src/lib/prisma.ts</span></div>
  <pre><kw>const</kw> SOFT_DELETE_MODELS = [<str>'Task'</str>]; <cm>// add more as needed</cm>

prisma.<fn>$use</fn>(<kw>async</kw> (params, next) => {
  <kw>if</kw> (!SOFT_DELETE_MODELS.<fn>includes</fn>(params.model!)) <kw>return</kw> <fn>next</fn>(params);

  <cm>// Redirect DELETE → UPDATE (set deletedAt)</cm>
  <kw>if</kw> (params.action === <str>'delete'</str>) {
    params.action = <str>'update'</str>;
    params.args.data = { <prop>deletedAt</prop>: <kw>new</kw> <fn>Date</fn>() };
  }

  <kw>if</kw> (params.action === <str>'deleteMany'</str>) {
    params.action = <str>'updateMany'</str>;
    params.args.data = { <prop>deletedAt</prop>: <kw>new</kw> <fn>Date</fn>() };
  }

  <cm>// Exclude soft-deleted records from all reads</cm>
  <kw>const</kw> readActions = [<str>'findUnique'</str>, <str>'findFirst'</str>, <str>'findMany'</str>, <str>'count'</str>];
  <kw>if</kw> (readActions.<fn>includes</fn>(params.action)) {
    params.args = params.args || {};
    params.args.where = {
      ...params.args.where,
      <prop>deletedAt</prop>: <kw>null</kw>  <cm>// automatically filter out deleted</cm>
    };
  }

  <kw>return</kw> <fn>next</fn>(params);
});</pre>
</div>

<p>Now <code>prisma.task.delete()</code> transparently becomes an <code>UPDATE SET deletedAt = now()</code>, and all reads automatically filter out soft-deleted tasks.</p>

<h2>When to Use Raw SQL</h2>
<p>Prisma covers 95% of typical application queries. Use raw SQL for:</p>
<ul>
  <li>Complex aggregations (window functions, CTEs)</li>
  <li>Database-specific features (PostgreSQL full-text search, PostGIS)</li>
  <li>Queries that Prisma doesn't yet support</li>

<h2>$queryRaw — Safe Parameterized Queries</h2>
<p>Always use the tagged template literal form. Prisma automatically parameterizes the values, preventing SQL injection.</p>

<div class="code-block">
  <div class="code-header"><span class="code-lang">TypeScript</span></div>
  <pre><cm>// ✅ SAFE: template literal — values are parameterized</cm>
<kw>const</kw> tasks = <kw>await</kw> prisma.<fn>$queryRaw</fn>&lt;<ty>Task</ty>[]&gt;<span class="str">&#96;
  SELECT t.*, u.name as "assigneeName"
  FROM "Task" t
  LEFT JOIN "User" u ON t."assigneeId" = u.id
  WHERE t."projectId" = &#36;{projectId}
    AND t."deletedAt" IS NULL
  ORDER BY t."createdAt" DESC
  LIMIT &#36;{limit}
&#96;</span>;

<cm>// ❌ NEVER do this — SQL injection vulnerability!</cm>
<cm>// prisma.$queryRawUnsafe(&#96;SELECT * FROM "Task" WHERE id = '&#36;{id}'&#96;);</cm></pre>
</div>

<h2>Full-Text Search with PostgreSQL</h2>
<p>Prisma's <code>contains</code> filter uses <code>LIKE</code>, which is slow on large datasets. For production search, use PostgreSQL's built-in full-text search:</p>

<div class="code-block">

  <pre><kw>async function</kw> <fn>fullTextSearch</fn>(query: <ty>string</ty>, projectId: <ty>string</ty>) {
  <kw>const</kw> results = <kw>await</kw> prisma.<fn>$queryRaw</fn>&lt;<ty>Task</ty>[]&gt;<span class="str">&#96;
    SELECT *,
      ts_rank(
        to_tsvector('english', title || ' ' || COALESCE(description, '')),
        plainto_tsquery('english', &#36;{query})
      ) as rank
    FROM "Task"
    WHERE
      "projectId" = &#36;{projectId}
      AND to_tsvector('english', title || ' ' || COALESCE(description, ''))
          @@ plainto_tsquery('english', &#36;{query})
    ORDER BY rank DESC
    LIMIT 20
  &#96;</span>;
  <kw>return</kw> results;
}</pre>
</div>

<h2>Indexing Strategy</h2>
<p>Indexes are the most impactful performance optimization available. An un-indexed query on a million-row table can take seconds; with an index, milliseconds.</p>

<h3>Always Index Foreign Keys</h3>
<div class="code-block">
  <div class="code-header"><span class="code-lang">prisma</span></div>
  <pre><kw>model</kw> <ty>Task</ty> {
  <prop>projectId</prop>  <ty>String</ty>
  <prop>assigneeId</prop> <ty>String</ty>?

  <dec>@@index</dec>([<prop>projectId</prop>])   <cm>// "give me all tasks for project X"</cm>
  <dec>@@index</dec>([<prop>assigneeId</prop>])  <cm>// "give me all tasks for user Y"</cm>
}</pre>
</div>

<h3>Index Frequently Filtered Columns</h3>
<div class="code-block">
  <div class="code-header"><span class="code-lang">prisma</span></div>
  <pre><kw>model</kw> <ty>Task</ty> {
  <prop>status</prop>    <ty>TaskStatus</ty>
  <prop>priority</prop>  <ty>Priority</ty>
  <prop>dueDate</prop>   <ty>DateTime</ty>?
  <prop>createdAt</prop> <ty>DateTime</ty>

  <cm>// Composite index for the most common query pattern</cm>
  <dec>@@index</dec>([<prop>projectId</prop>, <prop>status</prop>])       <cm>// "tasks in project X with status Y"</cm>
  <dec>@@index</dec>([<prop>projectId</prop>, <prop>createdAt</prop>])    <cm>// "tasks in project X sorted by date"</cm>
  <dec>@@index</dec>([<prop>dueDate</prop>])                 <cm>// "overdue tasks scan"</cm>
}</pre>
</div>

<h2>Avoiding N+1 Queries</h2>
<p>The classic N+1 problem: fetching 20 projects then fetching tasks for each one individually = 21 queries. Prisma's <code>include</code> solves this with a single JOIN.</p>

<div class="code-block">
  <div class="code-header"><span class="code-lang">TypeScript</span></div>
  <pre><cm>// ❌ N+1 — 1 query for projects, then N queries for tasks</cm>
<kw>const</kw> projects = <kw>await</kw> prisma.project.<fn>findMany</fn>();
<kw>for</kw> (<kw>const</kw> project <kw>of</kw> projects) {
  project.tasks = <kw>await</kw> prisma.task.<fn>findMany</fn>({ <prop>where</prop>: { <prop>projectId</prop>: project.id } });
}

<cm>// ✅ Single efficient query with include</cm>
<kw>const</kw> projects = <kw>await</kw> prisma.project.<fn>findMany</fn>({
  <prop>include</prop>: {
    <prop>tasks</prop>: {
      <prop>where</prop>: { <prop>status</prop>: { <prop>not</prop>: <str>'CANCELLED'</str> } },
      <prop>orderBy</prop>: { <prop>createdAt</prop>: <str>'desc'</str> }
    }
  }
});</pre>
</div>

  dialogResults.innerHTML = renderDefaultResults();
  searchFocusIdx = -1;
  requestAnimationFrame(() => dialogSearchInput.focus());
}

function closeSearch() {
  searchOverlay.classList.remove('open');
  searchFocusIdx = -1;
}

function renderDefaultResults() {
  // Show all chapters as browsable list when no query
  return CHAPTERS.map((ch, i) => buildResultItem(ch, i, '')).join('');
}

/* Highlight matching text inside a string */
function highlight(text, query) {
  if (!query) return escHtml(text);
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp('(' + escaped + ')', 'gi');
  return escHtml(text).replace(re, '<mark>$1</mark>');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function getSnippet(ch, query) {
  const plain = ch.content.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ');
  if (!query) return plain.slice(0, 130) + '…';
  // Find best matching window
  const lower = plain.toLowerCase();
  const qLower = query.toLowerCase();
  const pos = lower.indexOf(qLower);
  if (pos < 0) return plain.slice(0, 130) + '…';
  const start = Math.max(0, pos - 40);
  const end = Math.min(plain.length, pos + query.length + 90);
  const snippet = (start > 0 ? '…' : '') + plain.slice(start, end) + (end < plain.length ? '…' : '');
  return highlight(snippet, query);
}

function buildResultItem(ch, idx, query) {
  const title = highlight(ch.title, query);
  const snippet = getSnippet(ch, query);
  return `<div class="dialog-result-item" data-id="${ch.id}" data-idx="${idx}"
              onclick="selectDialogResult(${ch.id})"
              onmouseenter="setFocus(${idx})">
    <div class="dri-icon">${ch.num}</div>
    <div class="dri-body">
      <div class="dri-meta">${escHtml(ch.group)}</div>
      <div class="dri-title">${title}</div>
      <div class="dri-snippet">${snippet}</div>
    </div>
  </div>`;
}

function runSearch(q) {
  searchFocusIdx = -1;
  if (!q.trim()) {
    dialogResults.innerHTML = renderDefaultResults();
    return;
  }
  const results = fuse.search(q.trim(), { limit: 10 });
  if (!results.length) {
    dialogResults.innerHTML = `<div class="search-empty">
      <div class="search-empty-icon">⌕</div>
      No results for <strong>"${escHtml(q)}"</strong>
    </div>`;
    return;
  }
  dialogResults.innerHTML = results.map((r, i) => buildResultItem(CHAPTERS[r.item.id], i, q.trim())).join('');
}

function setFocus(idx) {
  searchFocusIdx = idx;
  document.querySelectorAll('.dialog-result-item').forEach((el, i) => {
    el.classList.toggle('focused', i === idx);
  });
}

function moveFocus(dir) {
  const items = document.querySelectorAll('.dialog-result-item');
  if (!items.length) return;
  searchFocusIdx = (searchFocusIdx + dir + items.length) % items.length;
  setFocus(searchFocusIdx);
  items[searchFocusIdx].scrollIntoView({ block: 'nearest' });
}

function selectDialogResult(id) {
  closeSearch();
  showChapter(id);
}

/* Events */
dialogSearchInput.addEventListener('input', (e) => runSearch(e.target.value));

dialogSearchInput.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { closeSearch(); return; }
  if (e.key === 'ArrowDown') { e.preventDefault(); moveFocus(1); return; }
  if (e.key === 'ArrowUp')   { e.preventDefault(); moveFocus(-1); return; }
  if (e.key === 'Enter') {
    const items = document.querySelectorAll('.dialog-result-item');
    const target = searchFocusIdx >= 0 ? items[searchFocusIdx] : items[0];
    if (target) target.click();
  }
});

/* Ctrl+K / Cmd+K global shortcut */
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    if (searchOverlay.classList.contains('open')) closeSearch();
    else openSearch();
  }
  if (e.key === 'Escape' && searchOverlay.classList.contains('open')) {
    closeSearch();
  }
});

/* Click backdrop to close */
searchOverlay.addEventListener('click', (e) => {
  if (e.target === searchOverlay) closeSearch();
});

/* ══════════════════════════════════════════════════════════
   SIDEBAR TOGGLE (MOBILE)
══════════════════════════════════════════════════════════ */
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
}

/* ══════════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════════ */
buildSidebar();
buildHome();
/* Set Ctrl/Cmd label based on platform */
(function() {
  const isMac = navigator.platform.toUpperCase().includes('MAC');
  const kbdEl = document.getElementById('searchKbd');
  if (kbdEl) kbdEl.innerHTML = isMac
    ? '<kbd>⌘</kbd><kbd>K</kbd>'
    : '<kbd>Ctrl</kbd><kbd>K</kbd>';
})();

</script>
