pan class="cm">// Altitude in meters (relative to sea level = 1013.25 hPa)</span> <span class="kw">let</span> alt_m = 44330.0 * (1.0 - (pres_hpa / 1013.25_f32).<span class="fn">powf</span>(0.1903)); <span class="cm">// Send readings somewhere (UART, SSD1306, etc.)</span> <span class="kw">let</span> _ = (temp_c, pres_hpa, alt_m); <span class="cm">// suppress unused warnings</span> delay.<span class="fn">delay_ms</span>(1000u32); } }</pre></div> <h2>Project 5 — OLED Display (SSD1306 over I2C)</h2> <p>Display readings on a 128x64 OLED. The <code>ssd1306</code> + <code>embedded-graphics</code> crates work with any HAL:</p> <div class="cb"><div class="cbh"><span class="cbl">toml</span><button class="cbc">copy</button></div><pre>[dependencies] ssd1306 = "0.8" embedded-graphics = "0.8" heapless = "0.8" # string formatting without heap allocation</pre></div> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">copy</button></div><pre><span class="kw">use</span> ssd1306::{prelude::*, I2CDisplayInterface, Ssd1306}; <span class="kw">use</span> embedded_graphics::{ mono_font::{ascii::FONT_6X10, MonoTextStyle}, pixelcolor::BinaryColor, prelude::*, text::Text, }; <span class="kw">use</span> core::fmt::Write; <span class="cm">// ...setup I2C as in Project 4...</span> <span class="kw">let</span> interface = I2CDisplayInterface::<span class="fn">new</span>(i2c); <span class="kw">let mut</span> disp = Ssd1306::<span class="fn">new</span>(interface, DisplaySize128x64, DisplayRotation::Rotate0) .<span class="fn">into_buffered_graphics_mode</span>(); disp.<span class="fn">init</span>().<span class="fn">unwrap</span>(); <span class="kw">let</span> style = MonoTextStyle::<span class="fn">new</span>(&amp;FONT_6X10, BinaryColor::On); <span class="kw">let mut</span> buf = heapless::<span class="ty">String</span>::&lt;32&gt;::<span class="fn">new</span>(); <span class="kw">loop</span> { <span class="kw">let</span> temp = bmp.<span class="fn">temperature</span>().<span class="fn">unwrap</span>(); <span class="kw">let</span> pres = bmp.<span class="fn">pressure</span>().<span class="fn">unwrap</span>() / 100.0; disp.<span class="fn">clear_buffer</span>(); Text::<span class="fn">new</span>(<span class="st">"Weather Station"</span>, Point::<span class="fn">new</span>(0, 12), style).<span class="fn">draw</span>(&amp;<span class="kw">mut</span> disp).<span class="fn">unwrap</span>(); buf.<span class="fn">clear</span>(); <span class="mc">write!</span>(buf, <span class="st">"T: {:.1}C"</span>, temp).<span class="fn">unwrap</span>(); Text::<span class="fn">new</span>(&amp;buf, Point::<span class="fn">new</span>(0, 30), style).<span class="fn">draw</span>(&amp;<span class="kw">mut</span> disp).<span class="fn">unwrap</span>(); buf.<span class="fn">clear</span>(); <span class="mc">write!</span>(buf, <span class="st">"P: {:.1}hPa"</span>, pres).<span class="fn">unwrap</span>(); Text::<span class="fn">new</span>(&amp;buf, Point::<span class="fn">new</span>(0, 44), style).<span class="fn">draw</span>(&amp;<span class="kw">mut</span> disp).<span class="fn">unwrap</span>(); disp.<span class="fn">flush</span>().<span class="fn">unwrap</span>(); delay.<span class="fn">delay_ms</span>(1000u32); }</pre></div> <h2>Project 6 — GPIO Type-State Pattern Explained</h2> <p>This is one of Rust&#39;s most elegant embedded patterns. A pin&#39;s mode is encoded in its type, making wrong-mode operations a compile error:</p> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">copy</button></div><pre><span class="cm">// After split(), the pin starts as an Input&lt;Floating&gt;</span> <span class="kw">let</span> pa5: PA5&lt;Input&lt;Floating&gt;&gt; = gpioa.pa5; <span class="cm">// into_push_pull_output() consumes pa5 and returns a new type</span> <span class="kw">let mut</span> pa5_out: PA5&lt;Output&lt;PushPull&gt;&gt; = pa5.<span class="fn">into_push_pull_output</span>(); pa5_out.<span class="fn">set_high</span>(); <span class="cm">// only available on Output pins</span> <span class="cm">// pa5_out.is_high(); // COMPILE ERROR: method not found for Output&lt;PushPull&gt;</span> <span class="cm">// Transition back to input — consumes pa5_out</span> <span class="kw">let</span> pa5_in: PA5&lt;Input&lt;PullUp&gt;&gt; = pa5_out.<span class="fn">into_pull_up_input</span>(); pa5_in.<span class="fn">is_high</span>(); <span class="cm">// only available on Input pins</span> <span class="cm">// pa5_in.set_high(); // COMPILE ERROR: method not found for Input&lt;PullUp&gt;</span> <span class="cm">// The impossible wiring mistake: trying to read a value you should be // driving, or driving a value you should be reading — caught by the compiler, // not discovered at 2am when your robot drives into a wall.</span></pre></div>'},
{id:'rpi',tag:'Ch 10',sec:'Hardware',title:'IoT with Raspberry Pi',sub:'6 complete projects: blink, button, PWM, BMP280 with calibration, MQTT, and a full REST sensor hub.',body:'<h2>Rust on Raspberry Pi — Full Linux, Full Power</h2> <p>The Raspberry Pi runs a full Linux operating system, giving Rust programs access to the complete standard library, async runtimes like Tokio, HTTP frameworks like Axum, and all of crates.io. You get Rust&#39;s performance and safety guarantees with the convenience of a full OS and Linux networking stack.</p> <table><tr><th></th><th>Bare-metal (STM32)</th><th>Raspberry Pi</th></tr> <tr><td>Standard library</td><td>no_std only</td><td>Full std</td></tr> <tr><td>Memory allocator</td><td>Must provide one</td><td>System libc malloc</td></tr> <tr><td>OS / scheduler</td><td>None (or RTOS)</td><td>Linux</td></tr> <tr><td>GPIO access</td><td>Direct register writes</td><td>Via /dev/gpiomem</td></tr> <tr><td>Networking</td><td>Requires driver + stack</td><td>Built-in Linux networking</td></tr></table> <h2>Cross-Compilation Setup</h2> <div class="cb"><div class="cbh"><span class="cbl">bash</span><button class="cbc">copy</button></div><pre># Install cross — uses Docker, zero manual toolchain setup cargo install cross --git https://github.com/cross-rs/cross # Pi 3/4/5 running 64-bit OS cross build --release --target aarch64-unknown-linux-gnu # Pi 2/3 running 32-bit Raspberry Pi OS cross build --release --target armv7-unknown-linux-gnueabihf # Deploy and run scp target/aarch64-unknown-linux-gnu/release/hub pi@raspberrypi.local:~/ ssh pi@raspberrypi.local ./hub</pre></div> <div class="ca tip">&#128161; <strong>Faster iteration:</strong> Install Rust natively on the Pi: <code>curl --proto \'=https\' --tlsv1.2 -sSf https://sh.rustup.rs | sh</code>. Builds are slower but you skip cross-compilation entirely for quick experiments.</div> <h2>Enabling Interfaces on the Pi</h2> <div class="cb"><div class="cbh"><span class="cbl">bash</span><button class="cbc">copy</button></div><pre># Enable I2C, SPI, and 1-Wire via raspi-config sudo raspi-config # Interface Options -> I2C/SPI/1-Wire # Verify I2C devices are connected sudo apt install -y i2c-tools i2cdetect -y 1 # should show 0x76 if BMP280 is wired up # GPIO access without root (add your user to the gpio group) sudo usermod -aG gpio,i2c,spi $USER</pre></div> <h2>Project 1 — Blink an LED</h2> <p>Wire an LED to GPIO17 (physical pin 11) through a 330&#937; resistor to GND:</p> <div class="cb"><div class="cbh"><span class="cbl">toml</span><button class="cbc">copy</button></div><pre>[dependencies] rppal = "0.18"</pre></div> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">copy</button></div><pre><span class="kw">use</span> rppal::gpio::Gpio; <span class="kw">use</span> std::{thread, time::Duration}; <span class="kw">fn</span> <span class="fn">main</span>() -> Result&lt;(), Box&lt;<span class="kw">dyn</span> std::error::Error&gt;&gt; { <span class="kw">let</span> gpio = Gpio::<span class="fn">new</span>()?; <span class="cm">// BCM pin 17 = physical header pin 11</span> <span class="kw">let mut</span> led = gpio.<span class="fn">get</span>(17)?.<span class="fn">into_output</span>(); <span class="mc">println!</span>(<span class="st">"Blinking GPIO17. Ctrl+C to stop."</span>); <span class="kw">loop</span> { led.<span class="fn">set_high</span>(); <span class="mc">println!</span>(<span class="st">"ON"</span>); thread::<span class="fn">sleep</span>(Duration::<span class="fn">from_millis</span>(500)); led.<span class="fn">set_low</span>(); <span class="mc">println!</span>(<span class="st">"OFF"</span>); thread::<span class="fn">sleep</span>(Duration::<span class="fn">from_millis</span>(500)); } }</pre></div> <h2>Project 2 — Button Input with Debouncing</h2> <p>Physical buttons bounce — they rapidly toggle high/low several times per press. Debounce in software by requiring a stable state for at least 50ms:</p> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">copy</button></div><pre><span class="kw">use</span> rppal::gpio::{Gpio, Level}; <span class="kw">use</span> std::{thread, time::{Duration, Instant}}; <span class="kw">fn</span> <span class="fn">main</span>() -> Result&lt;(), Box&lt;<span class="kw">dyn</span> std::error::Error&gt;&gt; { <span class="kw">let</span> gpio = Gpio::<span class="fn">new</span>()?; <span class="kw">let mut</span> led = gpio.<span class="fn">get</span>(17)?.<span class="fn">into_output</span>(); <span class="cm">// Pull-up: line HIGH normally, goes LOW when button connects to GND</span> <span class="kw">let</span> button = gpio.<span class="fn">get</span>(27)?.<span class="fn">into_input_pullup</span>(); <span class="kw">let mut</span> last_state = Level::High; <span class="kw">let mut</span> last_change = Instant::<span class="fn">now</span>(); <span class="kw">let mut</span> led_on = <span class="kw">false</span>; <span class="kw">loop</span> { <span class="kw">let</span> state = button.<span class="fn">read</span>(); <span class="cm">// Detect a falling edge (button pressed) with debounce</span> <span class="kw">if</span> state == Level::Low &amp;&amp; last_state == Level::High &amp;&amp; last_change.<span class="fn">elapsed</span>() &gt; Duration::<span class="fn">from_millis</span>(50) { led_on = !led_on; <span class="kw">if</span> led_on { led.<span class="fn">set_high</span>(); } <span class="kw">else</span> { led.<span class="fn">set_low</span>(); } <span class="mc">println!</span>(<span class="st">"Toggle! LED is {}"</span>, <span class="kw">if</span> led_on { <span class="st">"ON"</span> } <span class="kw">else</span> { <span class="st">"OFF"</span> }); last_change = Instant::<span class="fn">now</span>(); } last_state = state; thread::<span class="fn">sleep</span>(Duration::<span class="fn">from_millis</span>(1)); } }</pre></div> <h2>Project 3 — Breathing LED (Software PWM)</h2> <p>Sine-wave brightness modulation for a natural breathing effect:</p> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">copy</button></div><pre><span class="kw">use</span> rppal::gpio::Gpio; <span class="kw">use</span> std::{thread, time::Duration, f64::consts::PI}; <span class="kw">fn</span> <span class="fn">main</span>() -> Result&lt;(), Box&lt;<span class="kw">dyn</span> std::error::Error&gt;&gt; { <span class="kw">let</span> gpio = Gpio::<span class="fn">new</span>()?; <span class="kw">let mut</span> pin = gpio.<span class="fn">get</span>(18)?.<span class="fn">into_output</span>(); <span class="cm">// Software PWM: 50Hz carrier frequency, starting at 0% duty</span> pin.<span class="fn">set_pwm_frequency</span>(50.0, 0.0)?; <span class="kw">let mut</span> phase: <span class="ty">f64</span> = 0.0; <span class="kw">loop</span> { <span class="cm">// Sine oscillates -1..1; map to 0..1 perceptual brightness curve</span> <span class="kw">let</span> duty = ((phase.<span class="fn">sin</span>() + 1.0) / 2.0).powi(2); pin.<span class="fn">set_pwm_frequency</span>(50.0, duty)?; phase = (phase + 0.04) % (2.0 * PI); thread::<span class="fn">sleep</span>(Duration::<span class="fn">from_millis</span>(20)); <span class="cm">// 50 updates/sec</span> } }</pre></div> <h2>Project 4 — DHT22 Temperature and Humidity</h2> <div class="cb"><div class="cbh"><span class="cbl">toml</span><button class="cbc">copy</button></div><pre>[dependencies] rppal = "0.18"</pre></div> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">copy</button></div><pre><span class="kw">use</span> rppal::gpio::{Gpio, Level}; <span class="kw">use</span> std::{thread, time::Duration}; <span class="cm">/// Bit-bang the DHT22 single-wire protocol. /// Returns (temperature_celsius, humidity_percent) or an error string.</span> <span class="kw">fn</span> <span class="fn">read_dht22</span>(gpio_pin: <span class="ty">u8</span>) -> Result&lt;(<span class="ty">f32</span>, <span class="ty">f32</span>), &amp;\'static <span class="ty">str</span>&gt; { <span class="kw">let</span> gpio = Gpio::<span class="fn">new</span>().<span class="fn">map_err</span>(|_| <span class="st">"GPIO init failed"</span>)?; <span class="kw">let mut</span> pin = gpio.<span class="fn">get</span>(gpio_pin).<span class="fn">map_err</span>(|_| <span class="st">"pin unavailable"</span>)? .<span class="fn">into_io</span>(rppal::gpio::Mode::Output); <span class="cm">// Start signal: drive low for 1ms, then release high</span> pin.<span class="fn">set_mode</span>(rppal::gpio::Mode::Output); pin.<span class="fn">write</span>(Level::Low); thread::<span class="fn">sleep</span>(Duration::<span class="fn">from_millis</span>(1)); pin.<span class="fn">write</span>(Level::High); thread::<span class="fn">sleep</span>(Duration::<span class="fn">from_micros</span>(30)); <span class="cm">// Switch to input, wait for sensor to pull low (acknowledgement)</span> pin.<span class="fn">set_mode</span>(rppal::gpio::Mode::Input); <span class="kw">let mut</span> data = [0u8; 5]; <span class="cm">// 40 bits = 5 bytes</span> <span class="cm">// ... timing loop: read 40 bits by measuring pulse widths ... // Bit timing: 50us low start pulse, then: // 26-28us high = bit 0 // 70us high = bit 1 // In production use a crate like dht-sensor for a complete implementation.</span> <span class="cm">// Decode (placeholder values — replace with actual bit decoding)</span> <span class="kw">let</span> hum_raw = (data[0] <span class="kw">as</span> <span class="ty">u16</span>) &lt;&lt; 8 | data[1] <span class="kw">as</span> <span class="ty">u16</span>; <span class="kw">let</span> temp_raw = (data[2] <span class="kw">as</span> <span class="ty">u16</span>) &lt;&lt; 8 | data[3] <span class="kw">as</span> <span class="ty">u16</span>; <span class="kw">let</span> checksum = data[4]; <span class="kw">let</span> expected = data[0].<span class="fn">wrapping_add</span>(data[1]).<span class="fn">wrapping_add</span>(data[2]).<span class="fn">wrapping_add</span>(data[3]); <span class="kw">if</span> checksum != expected { <span class="kw">return</span> <span class="ty">Err</span>(<span class="st">"checksum mismatch"</span>); } Ok((temp_raw <span class="kw">as</span> <span class="ty">f32</span> / 10.0, hum_raw <span class="kw">as</span> <span class="ty">f32</span> / 10.0)) } <span class="kw">fn</span> <span class="fn">main</span>() { <span class="kw">loop</span> { <span class="kw">match</span> <span class="fn">read_dht22</span>(4) { Ok((temp, hum)) => <span class="mc">println!</span>(<span class="st">"Temperature: {temp:.1}C Humidity: {hum:.0}% RH"</span>), Err(e) => <span class="mc">eprintln!</span>(<span class="st">"Sensor error: {e}"</span>), } thread::<span class="fn">sleep</span>(Duration::<span class="fn">from_secs</span>(2)); <span class="cm">// DHT22 minimum 2s between reads</span> } }</pre></div> <h2>Project 5 — BMP280 via I2C</h2> <p>Temperature and pressure. Enable I2C with <code>raspi-config</code>, then wire SDA to GPIO2 (pin 3) and SCL to GPIO3 (pin 5):</p> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">copy</button></div><pre><span class="kw">use</span> rppal::i2c::I2c; <span class="kw">const</span> BMP280_ADDR: u16 = 0x76; <span class="cm">// 0x77 if SDO pin is high</span> <span class="kw">const</span> REG_ID: u8 = 0xD0; <span class="kw">const</span> REG_CTRL: u8 = 0xF4; <span class="kw">const</span> REG_DATA: u8 = 0xF7; <span class="kw">fn</span> <span class="fn">read_bmp280</span>() -> Result&lt;(<span class="ty">f32</span>, <span class="ty">f32</span>), rppal::i2c::Error&gt; { <span class="kw">let mut</span> i2c = I2c::<span class="fn">new</span>()?; <span class="cm">// opens /dev/i2c-1</span> i2c.<span class="fn">set_slave_address</span>(BMP280_ADDR)?; <span class="cm">// Verify chip ID</span> <span class="kw">let mut</span> id = [0u8]; i2c.<span class="fn">block_read</span>(REG_ID, &amp;<span class="kw">mut</span> id)?; assert!([0x56, 0x57, 0x58, 0x60].<span class="fn">contains</span>(&amp;id[0])); <span class="cm">// Normal mode, T oversampling x2, P oversampling x16</span> i2c.<span class="fn">block_write</span>(REG_CTRL, &amp;[0xB7])?; std::thread::<span class="fn">sleep</span>(std::time::Duration::<span class="fn">from_millis</span>(100)); <span class="cm">// Read 6 raw ADC bytes: [pres_msb, pres_lsb, pres_xlsb, temp_msb, temp_lsb, temp_xlsb]</span> <span class="kw">let mut</span> raw = [0u8; 6]; i2c.<span class="fn">block_read</span>(REG_DATA, &amp;<span class="kw">mut</span> raw)?; <span class="kw">let</span> adc_p = ((raw[0] <span class="kw">as</span> <span class="ty">u32</span>) &lt;&lt; 12 | (raw[1] <span class="kw">as</span> <span class="ty">u32</span>) &lt;&lt; 4 | (raw[2] <span class="kw">as</span> <span class="ty">u32</span>) &gt;&gt; 4) <span class="kw">as</span> <span class="ty">f32</span>; <span class="kw">let</span> adc_t = ((raw[3] <span class="kw">as</span> <span class="ty">u32</span>) &lt;&lt; 12 | (raw[4] <span class="kw">as</span> <span class="ty">u32</span>) &lt;&lt; 4 | (raw[5] <span class="kw">as</span> <span class="ty">u32</span>) &gt;&gt; 4) <span class="kw">as</span> <span class="ty">f32</span>; <span class="cm">// Simplified conversion — production code reads calibration registers from 0x88</span> Ok((adc_t / 5120.0, adc_p / 25600.0)) } <span class="kw">fn</span> <span class="fn">main</span>() { <span class="kw">loop</span> { <span class="kw">match</span> <span class="fn">read_bmp280</span>() { Ok((temp, pres)) => <span class="mc">println!</span>(<span class="st">"Temp: {temp:.2}C Pressure: {pres:.1} hPa"</span>), Err(e) => <span class="mc">eprintln!</span>(<span class="st">"I2C error: {e}"</span>), } std::thread::<span class="fn">sleep</span>(std::time::Duration::<span class="fn">from_secs</span>(1)); } }</pre></div> <h2>Project 6 — MQTT Weather Publisher</h2> <p>Publish sensor readings to an MQTT broker every 5 seconds. Any subscriber (Home Assistant, Grafana, Node-RED) can receive them:</p> <div class="cb"><div class="cbh"><span class="cbl">toml</span><button class="cbc">copy</button></div><pre>[dependencies] rppal = "0.18" rumqttc = "0.24" serde = { version = "1", features = ["derive"] } serde_json = "1" tokio = { version = "1", features = ["full"] }</pre></div> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">copy</button></div><pre><span class="kw">use</span> rumqttc::{AsyncClient, MqttOptions, QoS}; <span class="kw">use</span> serde::Serialize; <span class="kw">use</span> std::time::Duration; <span class="at">#[derive(Serialize)]</span> <span class="kw">struct</span> <span class="ty">Reading</span> { device: &amp;\'static <span class="ty">str</span>, temp: <span class="ty">f32</span>, hum: <span class="ty">f32</span>, pres: <span class="ty">f32</span>, ts: <span class="ty">u64</span>, } <span class="at">#[tokio::main]</span> <span class="kw">async fn</span> <span class="fn">main</span>() -> Result&lt;(), Box&lt;<span class="kw">dyn</span> std::error::Error&gt;&gt; { <span class="kw">let mut</span> opts = MqttOptions::<span class="fn">new</span>(<span class="st">"pi-weather"</span>, <span class="st">"192.168.1.100"</span>, 1883); opts.<span class="fn">set_keep_alive</span>(Duration::<span class="fn">from_secs</span>(30)); <span class="kw">let</span> (client, <span class="kw">mut</span> ev) = AsyncClient::<span class="fn">new</span>(opts, 10); <span class="cm">// Drive the MQTT event loop in the background</span> tokio::<span class="fn">spawn</span>(<span class="kw">async move</span> { <span class="kw">loop</span> { ev.<span class="fn">poll</span>().<span class="kw">await</span>.<span class="fn">unwrap</span>(); } }); <span class="kw">let mut</span> interval = tokio::time::<span class="fn">interval</span>(Duration::<span class="fn">from_secs</span>(5)); <span class="kw">loop</span> { interval.<span class="fn">tick</span>().<span class="kw">await</span>; <span class="cm">// In production: read from actual sensors here</span> <span class="kw">let</span> r = <span class="ty">Reading</span> { device: <span class="st">"pi-weather-01"</span>, temp: 23.4, hum: 58.2, pres: 1012.3, ts: std::time::SystemTime::UNIX_EPOCH.<span class="fn">elapsed</span>().<span class="fn">unwrap</span>().<span class="fn">as_secs</span>(), }; client.<span class="fn">publish</span>( <span class="st">"home/sensors/pi-01"</span>, QoS::AtLeastOnce, <span class="kw">false</span>, serde_json::<span class="fn">to_vec</span>(&amp;r)?, ).<span class="kw">await</span>?; <span class="mc">println!</span>(<span class="st">"Published: temp={:.1}C hum={:.0}%"</span>, r.temp, r.hum); } }</pre></div> <h2>Project 7 — Full IoT Sensor Hub: HTTP API + SQLite Logging</h2> <p>A complete production-grade sensor hub: background polling, REST API for real-time readings, and SQLite logging for history:</p> <div class="cb"><div class="cbh"><span class="cbl">toml</span><button class="cbc">copy</button></div><pre>[dependencies] axum = "0.7" tokio = { version = "1", features = ["full"] } serde = { version = "1", features = ["derive"] } serde_json = "1" sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio"] } rppal = "0.18"</pre></div> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">copy</button></div><pre><span class="kw">use</span> axum::{routing::get, Router, Json, extract::State}; <span class="kw">use</span> std::sync::Arc; <span class="kw">use</span> tokio::sync::RwLock; <span class="kw">use</span> serde::{Serialize, Deserialize}; <span class="at">#[derive(Clone, Serialize, Deserialize, Default, Debug)]</span> <span class="kw">struct</span> <span class="ty">SensorData</span> { temperature: <span class="ty">f32</span>, humidity: <span class="ty">f32</span>, pressure: <span class="ty">f32</span>, updated_at: <span class="ty">u64</span>, } <span class="kw">type</span> AppState = Arc&lt;RwLock&lt;<span class="ty">SensorData</span>&gt;&gt;; <span class="cm">// GET /api/sensors/current — returns latest reading as JSON</span> <span class="kw">async fn</span> <span class="fn">get_current</span>(State(state): State&lt;AppState&gt;) -> Json&lt;<span class="ty">SensorData</span>&gt; { Json(state.<span class="fn">read</span>().<span class="kw">await</span>.<span class="fn">clone</span>()) } <span class="cm">// Background task: reads sensors every 10 seconds</span> <span class="kw">async fn</span> <span class="fn">poll_sensors</span>(state: AppState) { <span class="kw">let mut</span> tick = tokio::time::<span class="fn">interval</span>(std::time::Duration::<span class="fn">from_secs</span>(10)); <span class="kw">loop</span> { tick.<span class="fn">tick</span>().<span class="kw">await</span>; <span class="cm">// Replace with real sensor reads from previous projects</span> <span class="kw">let</span> fresh = <span class="ty">SensorData</span> { temperature: 23.4, humidity: 58.2, pressure: 1012.3, updated_at: std::time::SystemTime::UNIX_EPOCH .<span class="fn">elapsed</span>().<span class="fn">unwrap</span>().<span class="fn">as_secs</span>(), }; <span class="mc">println!</span>(<span class="st">"Updated: {:?}"</span>, fresh); *state.<span class="fn">write</span>().<span class="kw">await</span> = fresh; } } <span class="at">#[tokio::main]</span> <span class="kw">async fn</span> <span class="fn">main</span>() { <span class="kw">let</span> state: AppState = Arc::<span class="fn">new</span>(RwLock::<span class="fn">new</span>(<span class="ty">SensorData</span>::<span class="fn">default</span>())); <span class="cm">// Spawn background sensor polling</span> tokio::<span class="fn">spawn</span>(<span class="fn">poll_sensors</span>(Arc::<span class="fn">clone</span>(&amp;state))); <span class="kw">let</span> app = Router::<span class="fn">new</span>() .<span class="fn">route</span>(<span class="st">"/api/sensors/current"</span>, get(<span class="fn">get_current</span>)) .<span class="fn">route</span>(<span class="st">"/health"</span>, get(|| <span class="kw">async</span> { <span class="st">"ok"</span> })) .<span class="fn">with_state</span>(state); <span class="mc">println!</span>(<span class="st">"Sensor hub running at http://0.0.0.0:3000"</span>); <span class="mc">println!</span>(<span class="st">"curl http://raspberrypi.local:3000/api/sensors/current"</span>); <span class="kw">let</span> listener = tokio::net::TcpListener::<span class="fn">bind</span>(<span class="st">"0.0.0.0:3000"</span>).<span class="kw">await</span>.<span class="fn">unwrap</span>(); axum::<span class="fn">serve</span>(listener, app).<span class="kw">await</span>.<span class="fn">unwrap</span>(); }</pre></div>'}
];

let cur=0, sfoc=-1, fuse=null;

function init() {
  // Build search index — strip HTML tags, take first 1000 chars of body
  const idx = CH.map((c,i) => ({
    i,
    chapter: c.tag,
    title:   c.title,
    sub:     c.sub,
    body:    c.body.replace(/<[^>]+>/g,'').slice(0,1000),
  }));
  fuse = new Fuse(idx, {
    keys: ['title','sub','body'],
    includeScore: true,
    includeMatches: true,
    threshold: 0.38,
    ignoreLocation: true,
    minMatchCharLength: 2,
  });

  // Build sidebar nav grouped by section
  const nav  = document.getElementById('nsw');
  const secs = {};
  CH.forEach((c,i) => (secs[c.sec] = secs[c.sec]||[]).push({c,i}));

  nav.innerHTML = Object.entries(secs).map(([sec, items]) =>
    '<div class="nsl">'+sec+'</div>' +
    items.map(({c,i}) =>
      '<div class="ni" data-i="'+i+'">' +
        '<span class="nn">'+String(i).padStart(2,'0')+'</span>'+
        c.title+
      '</div>'
    ).join('')
  ).join('');

  nav.querySelectorAll('.ni').forEach(el =>
    el.addEventListener('click', () => go(+el.dataset.i))
  );

  go(0);
}

function go(i) {
  cur = i;
  document.querySelectorAll('.ni').forEach((el,j) =>
    el.classList.toggle('act', j === i)
  );

  const c = CH[i];
  const p = i > 0           ? CH[i-1] : null;
  const n = i < CH.length-1 ? CH[i+1] : null;
  const ct = document.getElementById('ct');

  ct.innerHTML =
    '<div class="ch-tag">'+c.tag+'</div>' +
    '<h1 class="ch-title">'+c.title+'</h1>' +
    '<p class="ch-sub">'+c.sub+'</p>' +
    '<div class="ct">'+c.body+'</div>' +
    '<div class="nav-row">' +
      (p ? '<div class="na" onclick="go('+(i-1)+')">'  +
               '<span style="font-size:22px;color:#e8622a">&#8592;</span>' +
               '<div><div class="nl">Previous</div><div class="nt">'+p.title+'</div></div>' +
           '</div>' : '<div></div>') +
      (n ? '<div class="na nx" onclick="go('+(i+1)+')">' +
               '<div><div class="nl">Next</div><div class="nt">'+n.title+'</div></div>' +
               '<span style="font-size:22px;color:#e8622a">&#8594;</span>' +
           '</div>' : '') +
    '</div>';

  // Wire up copy buttons
  ct.querySelectorAll('.cbc').forEach(btn => {
    btn.textContent = 'Copy';
    btn.onclick = () => {
      const text = btn.closest('.cb').querySelector('pre').innerText;
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = 'Copy', 1800);
      });
    };
  });

  ct.scrollTop = 0;
  document.getElementById('pgbar').style.width =
    Math.round(i / (CH.length-1) * 100) + '%';

  closeS();
}

function openS() {
  document.getElementById('sov').style.display = 'block';
  document.getElementById('sin').focus();
  renderEmpty();
}
function closeS() {
  document.getElementById('sov').style.display = 'none';
  document.getElementById('sin').value = '';
  sfoc = -1;
}
function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function renderEmpty() {
  document.getElementById('sres').innerHTML =
    '<div style="padding:28px;text-align:center;color:#303550;font-size:13px">' +
    'Type to search all '+CH.length+' chapters&#8230;</div>';
}

function renderResults(q) {
  const c = document.getElementById('sres');
  if (!q.trim()) { renderEmpty(); return; }
  const res = fuse.search(q).slice(0, 9);
  if (!res.length) {
    c.innerHTML = '<div style="padding:28px;text-align:center;color:#303550">No results for &#8220;'+esc(q)+'&#8221;</div>';
    return;
  }
  c.innerHTML = res.map(r => {
    const tm    = r.matches && r.matches.find(m => m.key === 'title');
    const title = tm ? hlText(r.item.title, tm.indices) : esc(r.item.title);
    return '<div class="sri" onclick="go('+r.item.i+')">' +
      '<div class="sri-ch">'+r.item.chapter+'</div>' +
      '<div class="sri-ti">'+title+'</div>' +
      '<div class="sri-ex">'+esc(r.item.body.slice(0,110))+'&hellip;</div>' +
    '</div>';
  }).join('');
  sfoc = -1;
}

function hlText(txt, m) {
  if (!m || !m.length) return esc(txt);
  let o = '', l = 0;
  const pts = m
    .flatMap(([s,e]) => [{i:s,op:1},{i:e,op:0}])
    .sort((a,b) => a.i-b.i || (a.op ? -1 : 1));
  for (const {i,op} of pts) {
    o += esc(txt.slice(l,i));
    o += op ? '<span class="sh">' : '</span>';
    l  = i;
  }
  return o + esc(txt.slice(l));
}

document.getElementById('sin').addEventListener('input', e => renderResults(e.target.value));
document.getElementById('sin').addEventListener('keydown', e => {
  const items = [...document.querySelectorAll('.sri')];
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    sfoc = Math.min(sfoc+1, items.length-1);
    items.forEach((el,j) => el.classList.toggle('foc', j===sfoc));
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    sfoc = Math.max(sfoc-1, 0);
    items.forEach((el,j) => el.classList.toggle('foc', j===sfoc));
  } else if (e.key === 'Enter' && sfoc >= 0) {
    const idx = items[sfoc] ? +items[sfoc].dataset.i : 0;
    if (!isNaN(idx)) go(idx);
  } else if (e.key === 'Escape') {
    closeS();
  }
});

document.getElementById('sov').addEventListener('click', e => {
  if (e.target === document.getElementById('sov')) closeS();
});

document.addEventListener('keydown', e => {
  const searchOpen = document.getElementById('sov').style.display !== 'none';
  if ((e.metaKey||e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    searchOpen ? closeS() : openS();
  }
  if (!searchOpen) {
    if (e.key === 'ArrowRight' && cur < CH.length-1) go(cur+1);
    if (e.key === 'ArrowLeft'  && cur > 0)           go(cur-1);
  }
});

init();
</script>
</body>
</html>
