{id:'intro',tag:'Ch 00',sec:'Getting Started',title:'Introduction to Rust',sub:'Why Rust exists, who uses it, Cargo, and your first real programs — including a working guessing game.',body:'<h2>The Story Behind Rust</h2> <p>In 2006, a Mozilla engineer named Graydon Hoare came home to find his apartment building\'s elevator broken. The crash log pointed to a memory-safety bug in the elevator\'s control software — the kind of bug that C and C++ programs have been producing for decades. Hoare started Rust as a personal project that year, with a simple but ambitious goal: build a language where entire classes of bugs are <em>impossible by design</em>.</p> <p>Mozilla picked up the project in 2009. Rust 1.0 shipped in May 2015. Since then, it has been the <strong>most admired programming language</strong> in the Stack Overflow Developer Survey every single year from 2016 through 2024. It is now used inside the Linux kernel, Windows, macOS, Android, Firefox, AWS, Google, Meta, Cloudflare, Discord, Dropbox, and hundreds of other production systems.</p> <p>The central promise of Rust is this: <strong>you do not have to choose between safe code and fast code.</strong> In C, you get raw speed but you manage memory manually — and mistakes cause crashes, data corruption, and security vulnerabilities. In Java or Python, the garbage collector keeps you safe but adds overhead, pauses, and a runtime you cannot remove. Rust achieves both: no garbage collector, no runtime, no manual memory management, and no memory bugs — all enforced at compile time.</p> <h2>What Makes Rust Different</h2> <p>Every language makes tradeoffs. Here is where Rust stands:</p> <table> <tr><th>Language</th><th>Memory management</th><th>Runtime overhead</th><th>Memory safety</th></tr> <tr><td>C / C++</td><td>Manual malloc/free</td><td>None</td><td>None — you\'re on your own</td></tr> <tr><td>Java / C#</td><td>Garbage collector</td><td>GC pauses, JVM/CLR overhead</td><td>Yes (null still exists)</td></tr> <tr><td>Python / Ruby</td><td>Reference counting + GC</td><td>Significant interpreter overhead</td><td>Yes (at the cost of speed)</td></tr> <tr><td>Go</td><td>Garbage collector</td><td>Modest GC pauses</td><td>Yes (null still exists)</td></tr> <tr><td><strong>Rust</strong></td><td><strong>Ownership system (compile-time)</strong></td><td><strong>None — no runtime, no GC</strong></td><td><strong>Yes — guaranteed by the compiler</strong></td></tr> </table> <p>Rust achieves this through its <strong>ownership system</strong> — a set of rules that the compiler checks at compile time. If your code compiles, the compiler has proven it free of use-after-free bugs, double-free bugs, null pointer dereferences, buffer overflows, and data races. Not "probably free" — proven free.</p> <h2>Installing Rust</h2> <p>Rust is installed through <code>rustup</code>, the official toolchain manager. It handles installing the compiler, keeping it updated, and switching between stable/nightly/beta channels.</p> <h3>On macOS and Linux</h3> <div class="cb"><div class="cbh"><span class="cbl">bash</span><button class="cbc">Copy</button></div><pre>curl --proto \'=https\' --tlsv1.2 -sSf https://sh.rustup.rs | sh</pre></div> <p>Follow the prompts. Choose option 1 (default installation). When it\'s done, reload your shell:</p> <div class="cb"><div class="cbh"><span class="cbl">bash</span><button class="cbc">Copy</button></div><pre>source $HOME/.cargo/env</pre></div> <h3>On Windows</h3> <p>Download and run <code>rustup-init.exe</code> from <a href="https://rustup.rs" style="color:#61afef">rustup.rs</a>. You will also need the Visual Studio C++ Build Tools — the installer will prompt you if they\'re missing.</p> <h3>Verify the installation</h3> <div class="cb"><div class="cbh"><span class="cbl">bash</span><button class="cbc">Copy</button></div><pre>rustc --version # The Rust compiler — e.g. rustc 1.79.0 cargo --version # The package manager — e.g. cargo 1.79.0 rustup --version # The toolchain manager</pre></div> <h3>Install the language server (highly recommended)</h3> <p><code>rust-analyzer</code> gives you autocompletion, inline type hints, error highlighting, and refactoring in VS Code, Neovim, IntelliJ, Emacs, and most other editors.</p> <div class="cb"><div class="cbh"><span class="cbl">bash</span><button class="cbc">Copy</button></div><pre>rustup component add rust-analyzer # For VS Code: install the "rust-analyzer" extension from the marketplace # For Neovim: use mason.nvim or your LSP plugin of choice</pre></div> <h2>Creating Your First Project</h2> <p>Rust projects are managed by <strong>Cargo</strong>, the build system and package manager. You never call <code>rustc</code> directly in day-to-day work — Cargo handles compilation, dependency management, testing, documentation, and more.</p> <div class="cb"><div class="cbh"><span class="cbl">bash</span><button class="cbc">Copy</button></div><pre># Create a new project called "hello_rust" cargo new hello_rust # Cargo creates this directory structure: # hello_rust/ # ├── Cargo.toml &lt;-- project manifest (like package.json) # └── src/ # └── main.rs &lt;-- your source code cd hello_rust cargo run</pre></div> <p>You should see:</p> <div class="cb"><div class="cbh"><span class="cbl">text</span><button class="cbc">Copy</button></div><pre> Compiling hello_rust v0.1.0 Finished dev [unoptimized + debuginfo] target(s) in 0.54s Running `target/debug/hello_rust` Hello, world!</pre></div> <h2>Understanding the Generated Code</h2> <p>Open <code>src/main.rs</code>. Cargo generated this:</p> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">Copy</button></div><pre>fn main() { println!("Hello, world!"); }</pre></div> <p>Let\'s expand this into a program that actually teaches us the basics. Replace the contents of <code>src/main.rs</code> with this:</p> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">Copy</button></div><pre>fn main() { // ── 1. Printing ────────────────────────────────────────────────────── // println! is a MACRO (note the !), not a function. // Macros are expanded at compile time and can do things functions cannot, // like accept a variable number of arguments with type-checked format strings. println!("Hello, Rust!"); // Format strings use {} as placeholders. // Unlike C\'s printf, these are checked at compile time — // a wrong number of arguments is a compile error, not a runtime crash. let name = "ferris"; // ferris is Rust\'s mascot crab let year = 2015; println!("Hello, {}! Rust has been stable since {}.", name, year); // Rust 2021 edition shorthand: just use the variable name inside {} println!("Hello, {name}! Rust has been stable since {year}."); // Formatting options let pi = 3.14159265; println!("Pi is approximately {pi:.2}"); // 2 decimal places: 3.14 println!("Pi is approximately {pi:.5}"); // 5 decimal places: 3.14159 println!("42 in binary: {:b}", 42); // binary: 101010 println!("42 in hex: {:x}", 42); // lowercase hex: 2a println!("42 in hex: {:X}", 42); // uppercase hex: 2A println!("padded right: {:>10}", "hi"); // " hi" println!("padded left: {:<10}", "hi"); // "hi " // ── 2. Variables and Immutability ──────────────────────────────────── // Variables in Rust are IMMUTABLE by default. // This is a deliberate design choice — it forces you to be explicit // about what can change, making code easier to reason about. let x = 5; println!("x = {x}"); // x = 6; // COMPILE ERROR: cannot assign twice to immutable variable `x` // Add `mut` to allow mutation: let mut count = 0; println!("count starts at {count}"); count += 1; count += 1; println!("count is now {count}"); // ── 3. Constants ───────────────────────────────────────────────────── // Constants are always immutable, must have an explicit type, // and can be declared in any scope including global scope. // Their value must be known at compile time. const MAX_TEMPERATURE: f32 = 85.0; const MIN_TEMPERATURE: f32 = -40.0; println!("Valid range: {}°C to {}°C", MIN_TEMPERATURE, MAX_TEMPERATURE); // ── 4. Shadowing ───────────────────────────────────────────────────── // You can re-declare a variable with the same name. // This is called "shadowing" — the new variable shadows the old one. // Unlike mut, shadowing can even change the type. let spaces = " "; // spaces is a &str (string) let spaces = spaces.len(); // spaces is now a usize (number) println!("There were {spaces} spaces"); // This is different from mut: with mut you cannot change the type. // Shadowing is useful for transformations on a value without needing // to invent a new name like spaces_count or spaces_trimmed. // ── 5. Basic Types ─────────────────────────────────────────────────── // Rust is statically typed. The compiler infers types when possible. // Integers let a: i32 = -42; // signed 32-bit integer let b: u32 = 42; // unsigned 32-bit integer let c: i64 = 1_000_000_000_000; // underscores in numbers for readability let d: u8 = 255; // unsigned 8-bit: max is 255 // Floats (IEEE 754) let e: f64 = 3.14; // 64-bit float (default) let f: f32 = 3.14; // 32-bit float // Boolean let is_valid: bool = true; let is_done = false; // type inferred // Character — a full Unicode scalar value (4 bytes, NOT a byte) let letter: char = \'A\'; let emoji: char = \'🦀\'; // a crab! valid in Rust chars println!("The mascot is: {emoji}"); // ── 6. Arithmetic and Operators ────────────────────────────────────── let sum = 5 + 3; // 8 let difference = 10 - 4; // 6 let product = 4 * 7; // 28 let quotient = 10 / 3; // 3 (integer division — truncates!) let remainder = 10 % 3; // 1 let float_div = 10.0 / 3.0; // 3.3333... // Rust does NOT do implicit type coercion. // You cannot add an i32 and an f64 directly: // let bad = 5 + 3.14; // COMPILE ERROR: cannot add `{float}` to `{integer}` // You must be explicit: let i = 5i32; let f = 3.14f64; let result = i as f64 + f; // cast i to f64 first println!("5 + 3.14 = {result}"); // ── 7. Functions ───────────────────────────────────────────────────── // Functions are declared with fn, parameters require explicit types, // and return types are declared with -> println!("5 + 3 = {}", add(5, 3)); println!("Is 7 prime? {}", is_prime(7)); println!("Celsius to Fahrenheit: 100°C = {}°F", celsius_to_fahrenheit(100.0)); // ── 8. Control Flow ────────────────────────────────────────────────── // if/else let temperature = 72; if temperature > 100 { println!("Too hot!"); } else if temperature < 0 { println!("Too cold!"); } else { println!("Just right: {temperature}°"); } // if is an EXPRESSION — it returns a value // (both branches must return the same type) let description = if temperature > 30 { "hot" } else { "comfortable" }; println!("It is {description}"); // loop — runs forever until you break let mut n = 0; let result = loop { n += 1; if n == 5 { break n * 2; // loop can return a value via break } }; println!("loop result: {result}"); // 10 // while loop let mut i = 0; while i < 3 { println!("while: i = {i}"); i += 1; } // for loop over a range — this is the most common loop in Rust for i in 0..5 { // 0, 1, 2, 3, 4 (exclusive upper bound) print!("{i} "); } println!(); for i in 0..=5 { // 0, 1, 2, 3, 4, 5 (inclusive upper bound) print!("{i} "); } println!(); // for loop over a collection let sensors = ["DHT22", "BMP280", "SSD1306"]; for sensor in &sensors { println!("Found sensor: {sensor}"); } // for loop with index for (i, sensor) in sensors.iter().enumerate() { println!("[{i}] {sensor}"); } } // ── Function definitions ────────────────────────────────────────────────── // The last expression in a function body is the return value. // No semicolon on the last line = return that value. // (You can also use `return value;` explicitly.) fn add(a: i32, b: i32) -> i32 { a + b // no semicolon = this is the return value } // Functions can return bool fn is_prime(n: u64) -> bool { if n < 2 { return false; } for i in 2..=(n as f64).sqrt() as u64 { if n % i == 0 { return false; // early return with `return` } } true // implicit return of the last expression } fn celsius_to_fahrenheit(c: f64) -> f64 { c * 9.0 / 5.0 + 32.0 }</pre></div> <p>Run it with <code>cargo run</code> and study each output. Don\'t just read — actually run the code and see the results. Change the values. Try making a compile error on purpose by uncommenting the lines marked <code>// COMPILE ERROR</code> — read what the compiler tells you. Rust\'s error messages are famously helpful.</p> <h2>The Cargo.toml Manifest</h2> <p>Every Rust project has a <code>Cargo.toml</code> file. Open it — it currently looks like this:</p> <div class="cb"><div class="cbh"><span class="cbl">toml</span><button class="cbc">Copy</button></div><pre>[package] name = "hello_rust" version = "0.1.0" edition = "2021" [dependencies]</pre></div> <p>Here\'s a more complete example showing what Cargo.toml can express:</p> <div class="cb"><div class="cbh"><span class="cbl">toml</span><button class="cbc">Copy</button></div><pre>[package] name = "my_app" version = "0.1.0" edition = "2021" # Use the 2021 language edition (recommended) description = "A Rust IoT sensor application" authors = ["Your Name &lt;you@example.com&gt;"] [dependencies] # Add crates from crates.io here. Format: name = "version" serde = { version = "1", features = ["derive"] } # serialization serde_json = "1" # JSON support tokio = { version = "1", features = ["full"] } # async runtime [dev-dependencies] # Only used during tests and benchmarks criterion = "0.5" # benchmarking framework [profile.dev] opt-level = 0 # no optimization (fast builds, slow binary — used by `cargo build`) debug = true # include debug symbols [profile.release] opt-level = 3 # maximum optimization (slow build, fast binary — `cargo build --release`) lto = true # link-time optimization — further reduces binary size and improves speed strip = true # strip debug symbols from the binary</pre></div> <h2>Essential Cargo Commands</h2> <p>You will use these every day. Memorize them:</p> <table> <tr><th>Command</th><th>What it does</th><th>When to use it</th></tr> <tr><td><code>cargo new &lt;name&gt;</code></td><td>Creates a new binary project</td><td>Starting a new executable program</td></tr> <tr><td><code>cargo new --lib &lt;name&gt;</code></td><td>Creates a new library project</td><td>Building a library for others to use</td></tr> <tr><td><code>cargo build</code></td><td>Compiles the project in debug mode</td><td>During development</td></tr> <tr><td><code>cargo build --release</code></td><td>Compiles with full optimizations</td><td>When shipping or benchmarking</td></tr> <tr><td><code>cargo run</code></td><td>Compiles and runs the binary</td><td>The main command you\'ll use daily</td></tr> <tr><td><code>cargo run -- arg1 arg2</code></td><td>Runs with command-line arguments</td><td>Testing CLI programs</td></tr> <tr><td><code>cargo check</code></td><td>Type-checks without producing a binary</td><td>Fastest feedback loop while editing</td></tr> <tr><td><code>cargo test</code></td><td>Runs all tests</td><td>After making changes</td></tr> <tr><td><code>cargo test my_fn</code></td><td>Runs tests whose name contains "my_fn"</td><td>Running specific tests</td></tr> <tr><td><code>cargo add serde</code></td><td>Adds a dependency to Cargo.toml</td><td>Adding a library from crates.io</td></tr> <tr><td><code>cargo doc --open</code></td><td>Builds and opens documentation in a browser</td><td>Exploring your code\'s docs</td></tr> <tr><td><code>cargo fmt</code></td><td>Auto-formats all source code</td><td>Before committing code</td></tr> <tr><td><code>cargo clippy</code></td><td>Runs the linter — catches common mistakes</td><td>Code review, CI</td></tr> <tr><td><code>cargo update</code></td><td>Updates dependencies to latest compatible versions</td><td>Periodically</td></tr> </table> <div class="ca tip">💡 <strong>Workflow tip:</strong> Keep two terminal windows open. In one, run <code>cargo check</code> (or use your editor\'s rust-analyzer integration). In the other, run <code>cargo run</code> to see results. <code>cargo check</code> is dramatically faster than <code>cargo build</code> because it skips code generation — it just checks types and gives you errors.</div> <h2>Your First Real Program — A Number Guessing Game</h2> <p>The Rust Book tradition is to build a guessing game as your first real program. It touches on user input, random numbers, loops, match, and error handling — all concepts we\'ll explore deeply in coming chapters. Let\'s build it.</p> <p>First, add the <code>rand</code> crate (Rust\'s random number library):</p> <div class="cb"><div class="cbh"><span class="cbl">bash</span><button class="cbc">Copy</button></div><pre>cargo add rand</pre></div> <p>Now replace <code>src/main.rs</code> with:</p> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">Copy</button></div><pre>use std::io; // standard library: input/output use std::io::Write; // for flush() use std::cmp::Ordering; // Less, Greater, Equal use rand::Rng; // random number trait fn main() { println!("=== Number Guessing Game ==="); println!("I\'m thinking of a number between 1 and 100."); println!(); // Generate a random number in the range 1..=100 (inclusive both ends) let secret = rand::thread_rng().gen_range(1..=100); let mut attempts = 0; loop { // Print prompt without a newline, then flush stdout print!("Your guess: "); io::stdout().flush().unwrap(); // flush ensures the prompt appears before we wait for input // Read a line of input from the user let mut input = String::new(); // String::new() creates an empty, growable string io::stdin() .read_line(&mut input) // read_line appends into input, requires &mut .expect("Failed to read line"); // Parse the string into a u32. // .trim() removes the trailing newline character that read_line adds. // .parse() returns a Result — we handle the error case explicitly. let guess: u32 = match input.trim().parse() { Ok(num) => num, // successfully parsed: use the number Err(_) => { // parse failed (e.g. user typed "abc") println!("Please enter a valid number."); continue; // skip to next iteration of the loop } }; attempts += 1; println!("You guessed: {guess}"); // Compare the guess to the secret number // match on Ordering — an enum with three variants match guess.cmp(&secret) { Ordering::Less => println!("Too small! Try higher."), Ordering::Greater => println!("Too big! Try lower."), Ordering::Equal => { println!(); println!("🎉 Correct! The number was {secret}."); println!("You got it in {attempts} attempt{}!", if attempts == 1 { "" } else { "s" }); break; // exit the loop } } } } </pre></div> <p>Run it with <code>cargo run</code>. Play a round. Then read through every line carefully — each one introduces a concept we\'ll study in depth:</p> <ul> <li><code>use</code> — bringing items from modules into scope (like Python\'s <code>import</code>)</li> <li><code>String::new()</code> — calling an associated function (the <code>::</code> means it\'s on the type, not an instance)</li> <li><code>&amp;mut input</code> — a mutable reference; we\'ll spend all of Chapter 2 on this</li> <li><code>.expect()</code> — basic error handling; we\'ll cover this properly in Chapter 6</li> <li><code>match</code> — Rust\'s most powerful control flow construct; covered in Chapter 3</li> <li><code>Result</code> and <code>Ordering</code> — enums; covered in Chapter 3</li> </ul> <div class="ca info">ℹ️ <strong>Don\'t worry if some of this feels opaque right now.</strong> The guessing game is meant to give you a working program to run and a preview of what\'s coming. Each concept has its own chapter with full explanations and exercises.</div> <h2>How the Rust Compiler Helps You</h2> <p>One of Rust\'s most praised features is its error messages. Let\'s deliberately make an error and see what the compiler says. Add this to main.rs:</p> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">Copy</button></div><pre>fn main() { let x = 5; x = 6; // error: cannot assign twice to immutable variable } </pre></div> <div class="cb"><div class="cbh"><span class="cbl">text</span><button class="cbc">Copy</button></div><pre>error[E0384]: cannot assign twice to immutable variable `x` --&gt; src/main.rs:3:5 | 2 | let x = 5; | - | | | first assignment to `x` | help: consider making this binding mutable: `mut x` 3 | x = 6; | ^^^^^ cannot assign twice to immutable variable For more information about this error, try `rustc --explain E0384`. </pre></div> <p>The compiler tells you: exactly what the error is, exactly where it occurred (file, line, column), exactly which line caused the first assignment, and — crucially — <em>exactly what to do to fix it</em>: add <code>mut</code>. You can even run <code>rustc --explain E0384</code> for an extended explanation of the error with examples.</p> <p>This is what Rust development feels like: the compiler is strict, but it works <em>with</em> you, not against you.</p> <h2>Chapter Summary</h2> <p>You now have a working Rust environment and understand the basics: variables, types, functions, control flow, and how Cargo works. In the next chapter we dive into Rust\'s most important and unique concept — <strong>ownership</strong>. This is the foundation on which everything else in Rust is built. Take your time with it.</p> <div class="ca tip">💡 <strong>Exercise:</strong> Extend the guessing game. Add a difficulty mode: easy (1–10), medium (1–100), hard (1–1000). Track the fewest attempts across multiple rounds. Add a "hint" command that tells the user if the secret is odd or even. Each of these requires concepts from the first few chapters — try them as you work through the tutorial.</div>'},
{id:'ownership',tag:'Ch 01',sec:'Core Concepts',title:'Ownership & Borrowing',sub:'Stack vs heap, move semantics, references, borrow rules, lifetimes — with complete annotated programs.',body:'<h2>The Problem Rust Is Solving</h2> <p>Before we look at Rust\'s solution, let\'s understand exactly what problem exists. Consider this C program:</p> <div class="cb"><div class="cbh"><span class="cbl">c</span><button class="cbc">Copy</button></div><pre>// C code — DO NOT use as a model for Rust char* get_name() { char name[32] = "Alice"; return name; // BUG: returning a pointer to stack memory! } // The stack frame is gone after this return. // The pointer is now dangling. Using it is undefined behavior. int main() { char* name = get_name(); printf("%s\\n", name); // Might print "Alice", might crash, might print garbage. // Depends on the day, the compiler, the moon phase. return 0; } </pre></div> <p>This program has a <strong>use-after-free bug</strong>. The variable <code>name</code> lives on the stack inside <code>get_name</code>, and when that function returns, its stack frame is gone. The returned pointer points to memory that no longer belongs to <code>name</code>. Maybe the program runs fine in testing. Maybe it corrupts data in production. Maybe an attacker can exploit it. This is the class of bugs that has caused thousands of security vulnerabilities across decades of software.</p> <p>Garbage-collected languages (Java, Python, Go) solve this by never freeing memory until the GC proves nothing can reach it anymore. Safe — but you carry a runtime and accept pauses and overhead. Rust\'s answer is different: <strong>ownership</strong>.</p> <h2>Ownership: The Three Rules</h2> <p>Rust\'s ownership system is defined by three rules. Every piece of memory in a Rust program follows these rules at all times:</p> <ol> <li>Each value in Rust has exactly <strong>one owner</strong>.</li> <li>There can only be <strong>one owner at a time</strong>.</li> <li>When the owner goes <strong>out of scope</strong>, the value is dropped (memory freed).</li> </ol> <p>These rules are enforced by the compiler. If your code violates them, it does not compile — you get an error before any bug can occur at runtime.</p> <h2>Stack vs Heap — Why It Matters</h2> <p>To understand ownership, you need to understand where data lives in memory.</p> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">Copy</button></div><pre>fn main() { // STACK ALLOCATION // ───────────────────────────────────────────────────────────────────── // These values live entirely on the stack. // The stack is fast: allocating is just moving a pointer. // Stack memory is automatically reclaimed when the function returns. // The key requirement: the SIZE must be known at COMPILE TIME. let x: i32 = 42; // 4 bytes on the stack let y: f64 = 3.14; // 8 bytes on the stack let flag: bool = true; // 1 byte on the stack let arr: [i32; 4] = [1, 2, 3, 4]; // 16 bytes on the stack // HEAP ALLOCATION // ───────────────────────────────────────────────────────────────────── // String is a growable string — its size can change at runtime. // It must live on the heap because the stack can\'t hold variable-size data. // // Memory layout: // Stack: s [ ptr → 0x7f8c | len: 5 | cap: 5 ] // │ // Heap: 0x7f8c: [h][e][l][l][o] // // The stack part (the "fat pointer") is small and fixed-size. // The heap part holds the actual characters. let s = String::from("hello"); println!("Stack: x={x}, y={y}, flag={flag}"); println!("Heap: s={s}, len={}, capacity={}", s.len(), s.capacity()); // When s goes out of scope here (end of main), Rust calls drop(s) // which frees the heap allocation. Exactly once. No GC needed. } </pre></div> <h2>Move Semantics — Transferring Ownership</h2> <p>When you assign a heap-owning type from one variable to another, ownership <em>moves</em>. The old variable becomes invalid. This prevents double-free bugs at compile time:</p> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">Copy</button></div><pre>fn main() { let s1 = String::from("hello"); // s1 owns a heap allocation: Stack[ptr, len=5, cap=5] → Heap["hello"] let s2 = s1; // Ownership MOVES from s1 to s2. // The heap data is NOT copied — that would be expensive. // Only the "fat pointer" on the stack is copied, and s1 is invalidated. // Now: s2 owns Heap["hello"], s1 is gone. // println!("{s1}"); // COMPILE ERROR: value borrowed after move // // Rust caught the bug before it could happen! println!("{s2}"); // This works — s2 is the owner. // When s2 goes out of scope, drop(s2) is called. The heap is freed once. // If s1 were still valid, drop would be called twice → double-free bug. // Rust prevents this at compile time. } </pre></div> <h2>Clone — Explicit Deep Copying</h2> <p>If you really need two independent copies of heap data, use <code>.clone()</code>. It\'s explicit — you can see in the code that an allocation is happening:</p> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">Copy</button></div><pre>fn main() { let s1 = String::from("hello"); let s2 = s1.clone(); // explicitly create a new heap allocation with copied data // Now s1 and s2 each own their own "hello" on the heap — independent copies. println!("s1 = {s1}"); // both valid println!("s2 = {s2}"); // Both will be freed when they go out of scope — two separate drops. } </pre></div> <h2>Copy Types — When Assignment IS Copying</h2> <p>Simple types that live entirely on the stack don\'t move — they copy. These types implement the <code>Copy</code> trait. Assignment just does a cheap bitwise copy of the stack value:</p> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">Copy</button></div><pre>fn main() { // These types implement Copy: // i8, i16, i32, i64, i128, isize // u8, u16, u32, u64, u128, usize // f32, f64 // bool, char // Tuples of Copy types, e.g. (i32, bool) // Arrays of Copy types with fixed size, e.g. [i32; 4] let x: i32 = 5; let y = x; // x is COPIED into y, not moved println!("x = {x}"); // x is still valid — Copy types are duplicated on assignment println!("y = {y}"); let point = (3.0f64, 4.0f64); // tuple of two f64 — implements Copy let point2 = point; println!("point is still accessible: {:?}", point); // String does NOT implement Copy — it owns heap data let s1 = String::from("hello"); let s2 = s1; // MOVE — s1 is no longer valid // println!("{s1}"); // COMPILE ERROR // Why doesn\'t String implement Copy? // Because doing a bitwise copy would give two variables pointing to the SAME heap memory. // When either goes out of scope, it would free that memory. // When the other goes out of scope, it would try to free already-freed memory → crash. // The Copy trait is deliberately not implemented for types that own heap data. } </pre></div> <h2>Ownership and Functions</h2> <p>Passing a value to a function follows the same rules. The function either takes ownership (move) or borrows it (reference):</p> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">Copy</button></div><pre>fn takes_ownership(s: String) { // s comes into scope — this function now OWNS the String println!("Got: {s}"); } // s goes out of scope and drop(s) is called. The heap is freed here. fn makes_copy(n: i32) { // n is a COPY — the caller still owns their original println!("Got: {n}"); } fn gives_ownership() -> String { // This function creates a String and MOVES it to the caller let s = String::from("from the function"); s // move to the caller — no drop here } fn takes_and_gives_back(s: String) -> String { // Takes ownership, does something, returns ownership println!("Processing: {s}"); s // move back to caller } fn main() { let s1 = String::from("hello"); takes_ownership(s1); // s1 is MOVED into takes_ownership. It\'s no longer valid here. // println!("{s1}"); // COMPILE ERROR: value used after move let n = 5; makes_copy(n); println!("n is still {n}"); // Fine — i32 implements Copy let s2 = gives_ownership(); // s2 now owns the returned String println!("s2 = {s2}"); let s3 = String::from("world"); let s4 = takes_and_gives_back(s3); // s3 moved in, s4 gets ownership back // println!("{s3}"); // COMPILE ERROR — s3 was moved println!("s4 = {s4}"); } </pre></div> <h2>References and Borrowing</h2> <p>Moving ownership in and out of every function is tedious. Most of the time you just want to <em>use</em> a value without taking ownership. That\'s what <strong>references</strong> are for. A reference is like a pointer that is guaranteed to point to a valid value for its entire lifetime:</p> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">Copy</button></div><pre>// &String means "a reference to a String" // We borrow the String — we can use it but don\'t own it fn calculate_length(s: &String) -> usize { s.len() } // s goes out of scope, but because we don\'t own it, nothing is dropped. fn main() { let s1 = String::from("hello"); // &s1 creates a reference to s1 — we lend s1 to the function let len = calculate_length(&s1); // s1 is still valid! We only lent it, not gave it away. println!("The length of \'{s1}\' is {len}."); } </pre></div> <p>This act of creating a reference is called <strong>borrowing</strong>. Just like borrowing a book from a library — you can read it, but you return it when you\'re done.</p> <h2>Mutable References</h2> <p>By default, references are immutable — you can read through them but not modify the value. To modify a borrowed value, use a mutable reference:</p> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">Copy</button></div><pre>fn append_exclamation(s: &mut String) { s.push_str("!"); // We can mutate through a &mut reference } fn double_and_add(numbers: &mut Vec<i32>, extra: i32) { for n in numbers.iter_mut() { *n *= 2; // * dereferences the reference to access the underlying value } numbers.push(extra); } fn main() { // Variable must be mut to create a mutable reference to it let mut s = String::from("hello"); println!("Before: {s}"); append_exclamation(&mut s); // pass a mutable reference println!("After: {s}"); // "hello!" let mut nums = vec![1, 2, 3, 4, 5]; println!("Before: {:?}", nums); double_and_add(&mut nums, 99); println!("After: {:?}", nums); // [2, 4, 6, 8, 10, 99] } </pre></div> <h2>The Borrow Rules — The Heart of Rust Safety</h2> <p>Rust enforces exactly two rules about references. These rules together make data races <strong>impossible</strong> in safe Rust:</p> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">Copy</button></div><pre>fn main() { let mut s = String::from("hello"); // RULE 1: Any number of immutable (&T) references at the same time let r1 = &s; let r2 = &s; let r3 = &s; println!("{r1}, {r2}, {r3}"); // All fine — reading from multiple places is safe // r1, r2, r3 are last used here — their "lifetime" ends at this println! // RULE 2: OR exactly one mutable (&mut T) reference — never both simultaneously let r4 = &mut s; r4.push_str(", world"); println!("{r4}"); // Fine — r1,r2,r3 are gone, r4 is the only reference // WHY these rules? // A data race occurs when: // - Two or more accesses to the same memory happen concurrently // - At least one of them is a write // - There is no synchronization // // The borrow rules make data races STRUCTURALLY IMPOSSIBLE: // - If you can write (have &mut), nobody else can read or write (no other refs) // - If others can read (have &), you cannot write (no &mut allowed) // This applies even in single-threaded code — and transfers to threads via Send/Sync. // COMPILE ERROR examples: // let r5 = &s; // let r6 = &mut s; // ERROR: cannot borrow as mutable because it\'s already borrowed as immutable // println!("{r5} {r6}"); // let r7 = &mut s; // let r8 = &mut s; // ERROR: cannot borrow `s` as mutable more than once at a time // println!("{r7} {r8}"); } </pre></div> <h2>Dangling References — Caught at Compile Time</h2> <p>In C, returning a pointer to local stack memory (like the example at the start of this chapter) is a common bug. Rust\'s compiler catches this:</p> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">Copy</button></div><pre>// This does NOT compile: fn dangle() -> &String { let s = String::from("hello"); &s // We\'re trying to return a reference to s... } // ...but s is dropped here when the function returns! // COMPILE ERROR: cannot return reference to local variable `s` // The compiler saves you from the exact bug C has. // The fix: return the String itself (transfer ownership) fn no_dangle() -> String { let s = String::from("hello"); s // Move ownership to the caller — no reference needed } fn main() { // let ref_to_nothing = dangle(); // won\'t compile let s = no_dangle(); // works perfectly println!("{s}"); } </pre></div> <h2>Lifetimes — How Long is a Reference Valid?</h2> <p>Every reference has a <strong>lifetime</strong> — the scope for which that reference is valid. Most of the time the compiler infers lifetimes automatically (called "lifetime elision"). You only need to write explicit lifetime annotations when the compiler cannot infer on its own how the lifetimes of inputs relate to the lifetime of output references:</p> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">Copy</button></div><pre>// Without explicit lifetime annotations, the compiler asks: // "If I return a reference, how long is it valid? Does it come from x or y?" // It cannot know — so we must tell it. // \'a is a lifetime parameter — pronounced "tick a" // It means: "the returned reference lives at least as long as both x AND y" fn longest<\'a>(x: &\'a str, y: &\'a str) -> &\'a str { if x.len() >= y.len() { x // might return x... } else { y // ...or y. The compiler doesn\'t know which, so it takes the stricter bound. } } fn main() { let string1 = String::from("long string is long"); let result; { let string2 = String::from("xyz"); result = longest(string1.as_str(), string2.as_str()); println!("The longest string is: {result}"); // This works because result is only used while string2 is alive } // println!("{result}"); // This would NOT compile: // // string2 was dropped, result might reference it } // Lifetime annotation in a struct: // This struct cannot outlive the string slice it holds a reference to. struct Important<\'a> { content: &\'a str, } impl<\'a> Important<\'a> { fn summary(&self) -> &str { self.content // return type lifetime is inferred from &self } } fn main_struct() { let novel = String::from("Call me Ishmael. Some years ago..."); let first_sentence; { let i = novel.split(\'.\').next().expect("Could not find a \'.\'"); first_sentence = Important { content: i }; println!("Important: {}", first_sentence.summary()); } // first_sentence is still valid here because novel is still in scope println!("First sentence: {}", first_sentence.content); } </pre></div> <h2>Putting It All Together — A Complete Working Program</h2> <p>Let\'s build a small program that demonstrates ownership, borrowing, and lifetimes working together in a realistic context. We\'ll manage a collection of text documents:</p> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">Copy</button></div><pre>// A document in our collection struct Document { title: String, content: String, word_count: usize, } impl Document { // Associated function (constructor) — takes ownership of title and content fn new(title: &str, content: &str) -> Self { let content = content.to_string(); let word_count = content.split_whitespace().count(); Document { title: title.to_string(), content, word_count, } } // Method: borrows self immutably — can read, cannot modify fn summary(&self) -> String { let preview: String = self.content .split_whitespace() .take(10) .collect::<Vec<_>>() .join(" "); format!("[{}] ({} words) {}...", self.title, self.word_count, preview) } // Method: borrows self mutably — can modify fn append(&mut self, text: &str) { self.content.push(\' \'); self.content.push_str(text); self.word_count = self.content.split_whitespace().count(); } } // Function that borrows a slice of Document references — read-only fn find_longest<\'a>(docs: &\'a [Document]) -> &\'a Document { docs.iter() .max_by_key(|d| d.word_count) .expect("Empty document list") } // Function that takes ownership of a Vec of Documents fn word_count_total(docs: Vec<Document>) -> usize { // docs is moved in — we own it. It will be dropped when this function returns. docs.iter().map(|d| d.word_count).sum() } fn main() { // Create documents — Document::new takes &str and returns a Document by value let mut docs = vec![ Document::new( "Rust Introduction", "Rust is a systems programming language focused on safety speed and concurrency" ), Document::new( "Ownership Guide", "Ownership is Rust most unique feature and enables memory safety without a garbage collector" ), Document::new( "Quick Note", "Short document here" ), ]; // Iterate with immutable references — we borrow each document println!("=== All Documents ==="); for doc in &docs { // &docs creates &Document references println!("{}", doc.summary()); } // Mutate the first document through a mutable reference println!("\\n=== Appending to first document ==="); docs[0].append("It was created by Graydon Hoare at Mozilla."); println!("{}", docs[0].summary()); // Pass a slice reference to a function — no ownership transfer println!("\\n=== Longest document ==="); let longest = find_longest(&docs); // we lend docs to find_longest println!("Longest: {} ({} words)", longest.title, longest.word_count); // docs is still valid here — find_longest only borrowed it // Searching with a reference to a search term let query = "Ownership"; let found: Vec<&Document> = docs.iter() .filter(|d| d.title.contains(query)) .collect(); println!("\\n=== Search results for \'{query}\' ==="); for doc in found { println!(" - {}", doc.title); } // word_count_total TAKES OWNERSHIP of docs — docs is moved let total = word_count_total(docs); println!("\\nTotal words across all documents: {total}"); // println!("{}", docs[0].title); // COMPILE ERROR — docs was moved } </pre></div> <p>Create a new project, paste this in, and run it. Then experiment: try to use <code>docs</code> after calling <code>word_count_total</code>. Try to create two mutable references to the same document. Try to return a reference to a local variable from a function. Each compile error will teach you something the compiler is protecting you from.</p> <h2>Chapter Summary</h2> <p>Ownership is the foundation of Rust. Everything else in the language — traits, generics, concurrency, async — builds on top of these rules:</p> <ul> <li>Each value has exactly one owner. When the owner\'s scope ends, the value is dropped.</li> <li>You can <em>move</em> ownership by assigning to a new variable or passing to a function.</li> <li>You can <em>borrow</em> values as immutable references (<code>&amp;T</code>) or mutable references (<code>&amp;mut T</code>).</li> <li>The borrow rules: any number of <code>&amp;T</code> OR exactly one <code>&amp;mut T</code>, never both.</li> <li>References must always be valid — dangling references are caught at compile time.</li> <li>Lifetimes track how long references are valid — usually inferred, occasionally explicit.</li> </ul> <div class="ca tip">💡 <strong>Exercise 1:</strong> Write a function <code>first_word(s: &String) -> &str</code> that returns a reference to the first word of a string. What happens if you then try to call <code>s.clear()</code> while holding that reference? Why does the compiler stop you?</div> <div class="ca tip" style="margin-top:10px">💡 <strong>Exercise 2:</strong> Build a simple stack data structure (<code>struct Stack { items: Vec&lt;i32&gt; }</code>) with <code>push</code>, <code>pop</code>, and <code>peek</code> methods. Make <code>peek</code> return a reference — what lifetime annotation do you need?</div>'},
{id:'types',tag:'Ch 02',sec:'Core Concepts',title:'Types, Structs & Enums',sub:'Integers, floats, strings, structs, enums, Option and Result — with complete runnable examples.',body:'<h2>Rust\'s Type System Philosophy</h2> <p>Rust is statically and strongly typed. Every variable has a type known at compile time, and there are no implicit conversions — you must always be explicit. This feels strict at first but catches an enormous number of bugs before they reach production.</p> <h2>Integers in Depth</h2> <table> <tr><th>Type</th><th>Size</th><th>Signed range</th><th>Use case</th></tr> <tr><td><code>i8/u8</code></td><td>1 byte</td><td>-128–127 / 0–255</td><td>Raw bytes, GPIO pin values, pixel channels</td></tr> <tr><td><code>i16/u16</code></td><td>2 bytes</td><td>±32K / 0–65K</td><td>Audio samples, port numbers</td></tr> <tr><td><code>i32/u32</code></td><td>4 bytes</td><td>±2.1B / 0–4.3B</td><td>Default integer / IPv4 addresses, file sizes</td></tr> <tr><td><code>i64/u64</code></td><td>8 bytes</td><td>±9.2Q / 0–18.4Q</td><td>Timestamps, hash values, large counters</td></tr> <tr><td><code>isize/usize</code></td><td>pointer</td><td>platform-dependent</td><td>Array indices — required for indexing Vec/slice</td></tr> <tr><td><code>f32/f64</code></td><td>4/8 bytes</td><td>IEEE 754 single/double</td><td>f64 is the default float; f32 saves memory</td></tr> </table> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">Copy</button></div><pre>fn main() { // Literal syntax let a: i32 = 1_000_000; // underscores for readability let b: u8 = 0xFF; // hex let c: u8 = 0b1111_0000; // binary (0xF0 = 240) let d: u8 = b\'A\'; // byte literal (65) // Arithmetic — Rust does NOT implicit-convert between types let x: i32 = 5; let y: f64 = 3.14; // let bad = x + y; // COMPILE ERROR: mismatched types let good = x as f64 + y; // explicit cast with `as` println!("{good}"); // 8.14 // Integer overflow let max: u8 = 255; println!("{}", max.wrapping_add(1)); // 0 — wraps println!("{:?}", max.checked_add(1)); // None — returns Option println!("{}", max.saturating_add(1));// 255 — clamps to max // Float precision — never use == on floats let a = 0.1f64 + 0.2; let b = 0.3f64; println!("Equal? {}", a == b); // false! println!("Close? {}", (a - b).abs() < 1e-10); // true // Useful float methods println!("{}", 2.0f64.sqrt()); // 1.4142... println!("{}", (-5.0f64).abs()); // 5.0 println!("{}", 3.7f64.floor()); // 3.0 println!("{}", 3.2f64.ceil()); // 4.0 println!("{}", 3.5f64.round()); // 4.0 }</pre></div> <h2>Strings — Two Types, One UTF-8 Guarantee</h2> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">Copy</button></div><pre>fn main() { // &str — immutable string SLICE stored somewhere (literal = in binary) let greeting: &str = "Hello, world!"; let part = &greeting[0..5]; // "Hello" // String — owned, heap-allocated, growable let mut s = String::from("Hello"); s.push_str(", world"); s.push(\'!\'); println!("{s}"); // "Hello, world!" // Conversions let owned: String = greeting.to_string(); // &str → String let slice: &str = &s; // String → &str (free) let fmt = format!("{greeting} + {s}"); // format! = heap String // String operations let text = " Hello, World! "; println!("\'{}\'", text.trim()); // \'Hello, World!\' println!("{}", text.to_lowercase()); println!("{}", text.contains("World")); // true println!("{}", text.replace("World","Rust")); // Split and collect let csv = "alice,bob,charlie"; let names: Vec<&str> = csv.split(\',\').collect(); println!("{names:?}"); // ["alice", "bob", "charlie"] // Parsing let n: i32 = "42".parse().unwrap(); let f: f64 = "3.14".parse().expect("not a float"); println!("{n} {f}"); // Strings are UTF-8 — iterate by char, not by byte index for c in "naïve".chars() { print!("{c} "); } println!(); // n a ï v e }</pre></div> <h2>Structs</h2> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">Copy</button></div><pre>#[derive(Debug, Clone)] struct SensorReading { device_id: String, temperature: f32, humidity: f32, timestamp: u64, valid: bool, } impl SensorReading { // Constructor — associated function (no self) fn new(id: &str, temp: f32, hum: f32, ts: u64) -> Self { Self { device_id: id.to_string(), temperature: temp, humidity: hum, timestamp: ts, valid: temp > -40.0 && temp < 85.0 && hum <= 100.0, } } // Read-only method (&self) fn heat_index(&self) -> f32 { self.temperature + 0.33 * (self.humidity / 100.0 * 6.1) - 4.0 } // Mutating method (&mut self) fn mark_invalid(&mut self) { self.valid = false; } // Consuming method (self) — moves the struct fn into_csv(self) -> String { format!("{},{},{},{},{}", self.device_id, self.temperature, self.humidity, self.timestamp, self.valid) } } // Display trait — controls {} formatting impl std::fmt::Display for SensorReading { fn fmt(&self, f: &mut std::fmt::Formatter<\'_>) -> std::fmt::Result { write!(f, "[{}] {:.1}°C {:.0}%RH {}", self.device_id, self.temperature, self.humidity, if self.valid { "OK" } else { "INVALID" }) } } fn main() { let mut r = SensorReading::new("dht22-01", 23.4, 58.2, 1_700_000_000); println!("{r}"); // uses Display println!("{r:#?}"); // uses Debug — pretty-printed println!("heat index: {:.1}", r.heat_index()); // Struct update syntax — copy remaining fields from another instance let r2 = SensorReading { temperature: 25.0, device_id: "clone-01".into(), ..r.clone() }; println!("{r2}"); r.mark_invalid(); println!("{r}"); let csv = r.into_csv(); // r is MOVED here — cannot use r after this println!("{csv}"); }</pre></div> <h2>Enums — Algebraic Data Types</h2> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">Copy</button></div><pre>#[derive(Debug)] enum SensorEvent { Connected(String), // tuple variant TemperatureReading { device: String, temp: f32 },// struct variant Alert { level: u8, message: String }, Disconnected, // unit variant } fn handle(event: &SensorEvent) { match event { SensorEvent::Connected(id) => println!("+ {id} connected"), SensorEvent::TemperatureReading { device, temp } if *temp > 40.0 => println!("! HIGH TEMP on {device}: {temp:.1}°C"), SensorEvent::TemperatureReading { device, temp } => println!("{device}: {temp:.1}°C"), SensorEvent::Alert { level, message } => println!("[SEV {level}] {message}"), SensorEvent::Disconnected => println!("- disconnected"), } } fn main() { let events = vec![ SensorEvent::Connected("dht22-01".into()), SensorEvent::TemperatureReading { device: "dht22-01".into(), temp: 23.4 }, SensorEvent::TemperatureReading { device: "probe-02".into(), temp: 85.1 }, SensorEvent::Alert { level: 2, message: "Sensor drift detected".into() }, SensorEvent::Disconnected, ]; for e in &events { handle(e); } } </pre></div> <h2>Option&lt;T&gt; and Result&lt;T, E&gt;</h2> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">Copy</button></div><pre>fn find_pin(name: &str) -> Option<u8> { match name { "DHT22" => Some(4), "BMP280" => Some(21), _ => None, } } fn parse_pin(s: &str) -> Result<u8, String> { s.trim().parse::<u8>().map_err(|e| format!("bad pin \'{s}\': {e}")) } fn main() { // Option patterns match find_pin("DHT22") { Some(p) => println!("GPIO{p}"), None => println!("not found"), } // Concise alternatives let p = find_pin("BMP280").unwrap_or(0); let p = find_pin("DHT22").map(|p| format!("GPIO{p}")).unwrap_or_default(); println!("{p}"); if let Some(pin) = find_pin("DHT22") { println!("using GPIO{pin}"); } // Result patterns match parse_pin(" 17 ") { Ok(p) => println!("GPIO{p}"), Err(e) => eprintln!("Error: {e}"), } let p = parse_pin("4").unwrap(); // panic on Err let p = parse_pin("4").unwrap_or(0); // default on Err let p = parse_pin("abc").unwrap_or_else(|e| { eprintln!("{e}"); 0 }); // ? operator — propagate errors up the call stack fn setup() -> Result<u8, String> { let pin = parse_pin("17")?; // return Err if this fails Ok(pin * 2) } println!("{:?}", setup()); } </pre></div>'},
{id:'traits',tag:'Ch 03',sec:'Core Concepts',title:'Traits & Generics',sub:'Trait definition, default impls, generic functions, trait objects, standard library traits.',body:'<h2>Traits — Shared Behaviour</h2> <p>A trait defines a contract: a set of methods any implementing type must provide. They are Rust\'s mechanism for abstraction and polymorphism — replacing inheritance from OOP and type classes from FP.</p> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">Copy</button></div><pre>trait Sensor { fn name(&self) -> &str; fn read_raw(&self) -> f32; // required // Optional: has a default implementation fn read_celsius(&self) -> f32 { self.read_raw() * 0.02 - 40.0 } fn read_fahrenheit(&self) -> f32 { self.read_celsius() * 9.0 / 5.0 + 32.0 } fn summary(&self) -> String { format!("{}: {:.1}°C / {:.1}°F", self.name(), self.read_celsius(), self.read_fahrenheit()) } } struct DHT22 { pin: u8, raw: u16 } struct DS18B20 { raw: i16 } impl Sensor for DHT22 { fn name(&self) -> &str { "DHT22" } fn read_raw(&self) -> f32 { self.raw as f32 } // uses default celsius/fahrenheit/summary } impl Sensor for DS18B20 { fn name(&self) -> &str { "DS18B20" } fn read_raw(&self) -> f32 { self.raw as f32 } fn read_celsius(&self) -> f32 { self.raw as f32 / 16.0 } // override } fn main() { let dht = DHT22 { pin: 4, raw: 3170 }; let ds = DS18B20 { raw: 374 }; println!("{}", dht.summary()); // DHT22: 23.4°C / 74.1°F println!("{}", ds.summary()); // DS18B20: 23.4°C / ... } </pre></div> <h2>Generic Functions — Static Dispatch (Zero Cost)</h2> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">Copy</button></div><pre>// Compiler generates a separate, fully-optimised copy for each concrete type fn log<T: Sensor>(s: &T) { println!("{}", s.summary()); } // Multiple bounds with + fn log_debug<T: Sensor + std::fmt::Debug>(s: &T) { println!("{s:?} → {}", s.summary()); } // where clause — cleaner for complex bounds fn compare<A, B>(a: &A, b: &B) -> bool where A: Sensor, B: Sensor, { a.read_celsius() > b.read_celsius() } // impl Trait shorthand fn print_reading(s: &impl Sensor) { println!("Reading: {:.1}°C", s.read_celsius()); } </pre></div> <h2>Trait Objects — Dynamic Dispatch</h2> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">Copy</button></div><pre>fn main() { // Heterogeneous collection — only possible with trait objects (dyn Trait) // Box<dyn Sensor> is a fat pointer: [data ptr | vtable ptr] let sensors: Vec<Box<dyn Sensor>> = vec![ Box::new(DHT22 { pin: 4, raw: 3170 }), Box::new(DS18B20 { raw: 374 }), Box::new(DHT22 { pin: 17, raw: 3050 }), ]; for (i, s) in sensors.iter().enumerate() { println!("[{i}] {}", s.summary()); } let avg = sensors.iter().map(|s| s.read_celsius()).sum::<f32>() / sensors.len() as f32; println!("Average: {avg:.2}°C"); } </pre></div> <h2>Implementing Standard Library Traits</h2> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">Copy</button></div><pre>use std::fmt; use std::ops::Add; #[derive(Clone, PartialEq)] struct Celsius(f32); impl fmt::Display for Celsius { fn fmt(&self, f: &mut fmt::Formatter<\'_>) -> fmt::Result { write!(f, "{:.1}°C", self.0) } } impl fmt::Debug for Celsius { fn fmt(&self, f: &mut fmt::Formatter<\'_>) -> fmt::Result { write!(f, "Celsius({})", self.0) } } impl From<f32> for Celsius { fn from(v: f32) -> Self { Celsius(v) } } impl PartialOrd for Celsius { fn partial_cmp(&self, other: &Self) -> Option<std::cmp::Ordering> { self.0.partial_cmp(&other.0) } } impl Add for Celsius { type Output = Celsius; fn add(self, other: Celsius) -> Celsius { Celsius(self.0 + other.0) } } impl Default for Celsius { fn default() -> Self { Celsius(0.0) } } fn main() { let t: Celsius = 23.4f32.into(); // From<f32> println!("{t}"); // 23.4°C (Display) println!("{t:?}"); // Celsius(23.4) (Debug) let mut v = vec![Celsius(25.0), Celsius(18.5), Celsius(22.1)]; v.sort_by(|a,b| a.partial_cmp(b).unwrap()); println!("{v:?}"); } </pre></div>'},
{id:'collections',tag:'Ch 04',sec:'Core Concepts',title:'Collections & Iterators',sub:'Vec, HashMap, lazy iterator chains, partitioning, and custom iterators — with working programs.',body:'<h2>Vec&lt;T&gt; — The Dynamic Array</h2> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">Copy</button></div><pre>fn main() { // Creating let mut v: Vec<f32> = Vec::new(); let mut v = vec![21.3f32, 21.5, 22.1]; let pre = Vec::<f32>::with_capacity(1000); // pre-allocate // Adding / removing v.push(22.8); // O(1) amortised v.pop(); // removes last → Option<f32> v.insert(1, 21.9); // insert at index → O(n) v.remove(0); // remove at index → O(n) v.retain(|&x| x > 21.0); // keep elements matching predicate // Accessing let first = v[0]; // panics if OOB let safe = v.get(99); // Option<&f32> let slice = &v[1..3]; // &[f32] — a view, no copy // Iterating for &val in &v { println!("{val:.1}"); } for val in &mut v { *val += 1.0; } // mutate in-place // Useful transformations let sum: f32 = v.iter().sum(); let max: f32 = v.iter().cloned().fold(f32::NEG_INFINITY, f32::max); let above: Vec<f32> = v.iter().copied().filter(|&x| x > 22.0).collect(); v.sort_by(|a,b| a.partial_cmp(b).unwrap()); v.dedup(); // remove consecutive duplicates v.reverse(); // Drain and extend let drained: Vec<f32> = v.drain(0..2).collect(); v.extend([1.0, 2.0]); println!("{v:?}"); } </pre></div> <h2>HashMap&lt;K, V&gt;</h2> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">Copy</button></div><pre>use std::collections::HashMap; fn main() { let mut pins: HashMap<&str, u8> = HashMap::new(); pins.insert("DHT22", 4); pins.insert("BMP280", 21); // get() returns Option<&V> — never panics if let Some(&pin) = pins.get("DHT22") { println!("GPIO{pin}"); } // Entry API — the idiomatic HashMap pattern pins.entry("LED").or_insert(17); // insert only if absent *pins.entry("DHT22").or_insert(0) = 5; // update or default // Word frequency counter — canonical entry() pattern let text = "rust is fast rust is safe rust"; let mut freq: HashMap<&str, u32> = HashMap::new(); for word in text.split_whitespace() { *freq.entry(word).or_insert(0) += 1; } println!("{freq:?}"); // Iterate (random order — use BTreeMap for sorted) for (name, &pin) in &pins { println!("{name} → GPIO{pin}"); } // Build from iterator let names = ["A", "B", "C"]; let values = [10u8, 20, 30]; let map: HashMap<&str, u8> = names.into_iter().zip(values).collect(); } </pre></div> <h2>Iterators — Lazy, Zero-Cost Chains</h2> <p>Iterator adapters are lazy — nothing runs until you call a consumer like <code>collect()</code>, <code>sum()</code>, or <code>for_each()</code>. The compiler fuses chains into a single tight loop with no intermediate allocations.</p> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">Copy</button></div><pre>fn main() { let data = vec![3.1f32, 5.8, 2.4, 9.1, 4.7, 6.2, 1.9, 8.3]; // map + filter + collect — ONE PASS, zero intermediate Vec let high_f: Vec<String> = data.iter() .copied() .filter(|&x| x > 5.0) .map(|x| format!("{:.1}°F", x * 9.0/5.0 + 32.0)) .collect(); println!("{high_f:?}"); // fold — general accumulator let (sum, n) = data.iter().fold((0.0f32, 0u32), |(s,c), &v| (s+v, c+1)); println!("mean = {:.2}", sum / n as f32); // find, position, any, all let first_high = data.iter().find(|&&x| x > 8.0); let pos = data.iter().position(|&x| x > 8.0); let any_neg = data.iter().any(|&x| x < 0.0); let all_pos = data.iter().all(|&x| x > 0.0); // enumerate, zip for (i, &v) in data.iter().enumerate() { if v > 7.0 { println!("[{i}] = {v:.1} ← high"); } } let labels = ["A","B","C","D","E","F","G","H"]; let paired: Vec<_> = labels.iter().zip(data.iter()).collect(); // partition into two Vecs let (above, below): (Vec<f32>, Vec<f32>) = data.iter().copied().partition(|&x| x > 5.0); println!("above: {above:?}"); // flatten nested Vecs let batches = vec![vec![1.0f32, 2.0], vec![3.0, 4.0]]; let flat: Vec<f32> = batches.into_iter().flatten().collect(); // Custom iterator — implement Iterator trait struct Counter { n: u32 } impl Iterator for Counter { type Item = u32; fn next(&mut self) -> Option<u32> { self.n += 1; if self.n <= 5 { Some(self.n) } else { None } } } let squares: Vec<u32> = Counter { n: 0 }.map(|x| x*x).collect(); println!("{squares:?}"); // [1, 4, 9, 16, 25] } </pre></div>'},
{id:'errors',tag:'Ch 05',sec:'Core Concepts',title:'Error Handling',sub:'Result combinators, the ? operator, and custom error types with From conversions.',body:'<h2>Two Kinds of Failure</h2> <p><strong>Recoverable</strong> — file not found, bad input, network timeout: use <code>Result&lt;T, E&gt;</code>.<br> <strong>Unrecoverable</strong> — programming bugs (index OOB, unwrap on None): use <code>panic!</code>.</p> <h2>Result&lt;T, E&gt; — Every Tool You Need</h2> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">Copy</button></div><pre>use std::fs; use std::num::ParseIntError; fn read_file(path: &str) -> Result<String, std::io::Error> { fs::read_to_string(path) } fn parse_num(s: &str) -> Result<i32, ParseIntError> { s.trim().parse() } fn main() { // Full match — always handles both cases match read_file("config.txt") { Ok(c) => println!("{c}"), Err(e) => eprintln!("Error: {e}"), } // Concise variants let n = parse_num("42").unwrap(); // panic on Err let n = parse_num("42").expect("must be a number"); // panic with message let n = parse_num("abc").unwrap_or(0); // default on Err let n = parse_num("abc").unwrap_or_else(|e| { eprintln!("{e}"); -1 }); let n = parse_num("abc").unwrap_or_default(); // type\'s Default // Transforming Results let doubled = parse_num("21").map(|n| n * 2); // Ok(42) let as_str = parse_num("abc").map_err(|e| format!("oops: {e}")); println!("{doubled:?} {as_str:?}"); } </pre></div> <h2>The ? Operator</h2> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">Copy</button></div><pre>use std::io; // Without ?: deeply nested fn read_v1(path: &str) -> Result<i32, Box<dyn std::error::Error>> { let s = match fs::read_to_string(path) { Ok(s) => s, Err(e) => return Err(e.into()) }; let n = match s.trim().parse::<i32>() { Ok(n) => n, Err(e) => return Err(e.into()) }; Ok(n * 2) } // With ?: clean and linear — preferred style fn read_v2(path: &str) -> Result<i32, Box<dyn std::error::Error>> { let s = fs::read_to_string(path)?; // io::Error → Box<dyn Error> via From let n: i32 = s.trim().parse()?; // ParseIntError → Box<dyn Error> Ok(n * 2) } fn main() { match read_v2("number.txt") { Ok(v) => println!("Value: {v}"), Err(e) => eprintln!("Failed: {e}"), } } </pre></div> <h2>Custom Error Types</h2> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">Copy</button></div><pre>use std::fmt; use std::io; #[derive(Debug)] enum AppError { Io(io::Error), Parse(std::num::ParseIntError), Validation { field: String, msg: String }, NotFound(String), } impl fmt::Display for AppError { fn fmt(&self, f: &mut fmt::Formatter<\'_>) -> fmt::Result { match self { AppError::Io(e) => write!(f, "I/O: {e}"), AppError::Parse(e) => write!(f, "Parse: {e}"), AppError::Validation { field, msg } => write!(f, "{field}: {msg}"), AppError::NotFound(item) => write!(f, "not found: {item}"), } } } impl std::error::Error for AppError {} // From impls enable ? to auto-convert impl From<io::Error> for AppError { fn from(e: io::Error) -> Self { AppError::Io(e) } } impl From<std::num::ParseIntError> for AppError { fn from(e: std::num::ParseIntError) -> Self { AppError::Parse(e) } } // Type alias so you don\'t write AppError everywhere type Result<T> = std::result::Result<T, AppError>; fn load(path: &str) -> Result<i32> { let s = std::fs::read_to_string(path)?; // io::Error auto-converted let n: i32 = s.trim().parse()?; // ParseIntError auto-converted if n < 0 { return Err(AppError::Validation { field: "value".into(), msg: "must be non-negative".into(), }); } Ok(n) } fn main() { if let Err(e) = load("data.txt") { eprintln!("Application error: {e}"); } } </pre></div> <div class="ca tip">💡 In real projects: use <strong>thiserror</strong> (<code>cargo add thiserror</code>) to derive the boilerplate on your error enum, and <strong>anyhow</strong> (<code>cargo add anyhow</code>) for application-level errors where you just want <code>.context("what was happening")</code>.</div>'},
{id:'concurrency',tag:'Ch 06',sec:'Advanced',title:'Concurrency & Async',sub:'OS threads, Arc+Mutex, channels, and async/await with Tokio — data-race-free.',body:'<h2>Fearless Concurrency</h2> <p>Rust\'s ownership and type system make data races impossible in safe code. The two key marker traits: <code>Send</code> (safe to transfer to another thread) and <code>Sync</code> (safe to share a reference across threads) are automatically derived by the compiler based on a type\'s contents.</p> <h2>OS Threads</h2> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">Copy</button></div><pre>use std::thread; use std::time::Duration; fn main() { // move closure — captures variables by value so the thread owns them let data = vec![1, 2, 3, 4, 5]; let handle = thread::spawn(move || { let sum: i32 = data.iter().sum(); println!("Thread sum: {sum}"); sum // threads can return values }); let result = handle.join().unwrap(); // wait; returns Result<T, Box<dyn Any>> println!("Returned: {result}"); // Spawn many threads and collect results let handles: Vec<_> = (0..8) .map(|i| thread::spawn(move || i * i)) .collect(); let squares: Vec<i32> = handles.into_iter().map(|h| h.join().unwrap()).collect(); println!("{squares:?}"); } </pre></div> <h2>Arc + Mutex — Shared Mutable State</h2> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">Copy</button></div><pre>use std::sync::{Arc, Mutex, RwLock}; use std::thread; fn main() { // Arc<Mutex<T>>: shared ownership + interior mutability let counter = Arc::new(Mutex::new(0u64)); let handles: Vec<_> = (0..8).map(|_| { let c = Arc::clone(&counter); thread::spawn(move || { for _ in 0..1000 { *c.lock().unwrap() += 1; // MutexGuard auto-releases on drop } }) }).collect(); for h in handles { h.join().unwrap(); } println!("Total: {}", *counter.lock().unwrap()); // exactly 8000 // Arc<RwLock<T>>: many concurrent readers OR one exclusive writer let state = Arc::new(RwLock::new(vec!["init"])); { let r1 = state.read().unwrap(); // shared read — multiple allowed let r2 = state.read().unwrap(); println!("{r1:?} {r2:?}"); } // read locks released state.write().unwrap().push("updated"); // exclusive write println!("{:?}", *state.read().unwrap()); } </pre></div> <h2>Channels — Message Passing</h2> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">Copy</button></div><pre>use std::sync::mpsc; // multi-producer, single-consumer use std::thread; use std::time::Duration; fn main() { let (tx, rx) = mpsc::channel::<f32>(); // Multiple producer threads for device_id in 0..4u32 { let tx = tx.clone(); thread::spawn(move || { for i in 0..3 { let reading = 20.0 + device_id as f32 + i as f32 * 0.1; tx.send(reading).unwrap(); thread::sleep(Duration::from_millis(50)); } }); } drop(tx); // drop original sender; channel closes when all senders drop // Receive all messages let readings: Vec<f32> = rx.into_iter().collect(); println!("{} readings received", readings.len()); println!("Average: {:.2}", readings.iter().sum::<f32>() / readings.len() as f32); } </pre></div> <h2>Async/Await with Tokio</h2> <p>For I/O-bound concurrency: network, databases, files. Async tasks are lightweight (no OS thread per task) and cooperative.</p> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">Copy</button></div><pre>// Cargo.toml: tokio = { version = "1", features = ["full"] } use std::time::Duration; async fn poll_sensor(id: &str) -> f32 { tokio::time::sleep(Duration::from_millis(100)).await; 23.4 + id.len() as f32 * 0.1 } #[tokio::main] async fn main() { // Sequential: ~300ms let t1 = poll_sensor("a").await; let t2 = poll_sensor("b").await; let t3 = poll_sensor("c").await; println!("sequential: {t1:.1} {t2:.1} {t3:.1}"); // Concurrent: ~100ms — all run at the same time let (t1, t2, t3) = tokio::join!( poll_sensor("a"), poll_sensor("b"), poll_sensor("c"), ); println!("concurrent: {t1:.1} {t2:.1} {t3:.1}"); // Spawn a background task let handle = tokio::spawn(async { tokio::time::sleep(Duration::from_millis(50)).await; 42u32 }); println!("Main continues..."); println!("Task returned: {}", handle.await.unwrap()); } </pre></div> <div class="ca info">ℹ️ <strong>Threads vs async:</strong> Use OS threads for CPU-bound work (computation). Use async (Tokio) for I/O-bound work (network, files, timers). Mix them freely — Tokio provides <code>spawn_blocking()</code> to run synchronous code from async contexts without blocking the runtime.</div>'},
{id:'hardware',tag:'Ch 09',sec:'Hardware',title:'Embedded Hardware Programming',sub:'Full project setup, 6 complete projects: blink, button, PWM, BMP280, OLED, type-state GPIO.',body:'<h2>Why Rust for Embedded?</h2> <p>Embedded systems have traditionally been the domain of C and C++. Rust brings something new: <strong>compile-time memory safety with zero runtime overhead</strong>. No garbage collector, no runtime, no allocator required. Rust can target microcontrollers with as little as 16KB of flash and 4KB of RAM.</p> <p>Key advantages over C: no undefined behavior from memory misuse; the type-state pattern for GPIO and state machines; a package manager giving access to thousands of device drivers; and RTIC — a concurrency framework that proves interrupt safety at compile time.</p> <h2>The Embedded Rust Stack</h2> <p>The ecosystem is organized in layers, each building on the one below:</p> <div class="cb"><div class="cbh"><span class="cbl">text</span><button class="cbc">copy</button></div><pre>Your Application | v Board Support Package (BSP) e.g. microbit, feather-m0 Knows your board\'s specific pin assignments | v Hardware Abstraction Layer (HAL) e.g. stm32f4xx-hal, esp-hal, nrf-hal Safe typed wrappers around peripherals (GPIO, I2C, SPI, UART, ADC, PWM...) | v Peripheral Access Crate (PAC) generated by svd2rust from vendor SVD files Raw register-level access — unsafe, auto-generated | v Micro-architecture crate cortex-m, cortex-m-rt, riscv CPU-level: interrupts, SysTick, NVIC, vector table setup | v Your silicon (microcontroller)</pre></div> <div class="ca info">&#8505; <strong>embedded-hal:</strong> All HAL crates implement traits from the <code>embedded-hal</code> crate. This means a sensor driver like <code>bmp280-ehal</code> works identically on STM32, ESP32, nRF52, and any other chip that has a HAL — the driver only knows about traits, not about silicon.</div> <h2>Setting Up a Project (STM32F411 Nucleo)</h2> <div class="cb"><div class="cbh"><span class="cbl">bash</span><button class="cbc">copy</button></div><pre># Install the Cortex-M4F target (STM32F4 family) rustup target add thumbv7em-none-eabihf # Install the flashing and debugging tool cargo install probe-rs-tools</pre></div> <div class="cb"><div class="cbh"><span class="cbl">toml</span><button class="cbc">copy</button></div><pre># .cargo/config.toml [build] target = "thumbv7em-none-eabihf" [target.thumbv7em-none-eabihf] rustflags = ["-C", "link-arg=-Tlink.x"] runner = "probe-rs run --chip STM32F411RETx"</pre></div> <div class="cb"><div class="cbh"><span class="cbl">toml</span><button class="cbc">copy</button></div><pre># Cargo.toml [dependencies] cortex-m = "0.7" cortex-m-rt = "0.7" stm32f4xx-hal = { version = "0.21", features = ["stm32f411"] } panic-halt = "0.2"</pre></div> <div class="cb"><div class="cbh"><span class="cbl">text</span><button class="cbc">copy</button></div><pre># memory.x — linker script telling the linker where FLASH and RAM are MEMORY { FLASH : ORIGIN = 0x08000000, LENGTH = 512K RAM : ORIGIN = 0x20000000, LENGTH = 128K }</pre></div> <h2>Project 1 — Blink an LED</h2> <p>The "Hello World" of embedded systems. Toggle an LED on GPIO PA5 every 500ms:</p> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">copy</button></div><pre><span class="at">#![no_std]</span> <span class="cm">// no standard library — no OS, no heap allocator by default</span> <span class="at">#![no_main]</span> <span class="cm">// no Rust entry point — we define our own with #[entry]</span> <span class="kw">use</span> cortex_m_rt::entry; <span class="kw">use</span> panic_halt <span class="kw">as</span> _; <span class="cm">// on panic: halt the CPU (simplest strategy)</span> <span class="kw">use</span> stm32f4xx_hal::{pac, prelude::*}; <span class="at">#[entry]</span> <span class="kw">fn</span> <span class="fn">main</span>() -> ! { <span class="cm">// ! means this function NEVER returns</span> <span class="cm">// Take ownership of all peripherals. Can only be called once. // Calling it a second time returns None — prevents aliasing.</span> <span class="kw">let</span> dp = pac::Peripherals::<span class="fn">take</span>().<span class="fn">unwrap</span>(); <span class="cm">// Configure the system clock: 84 MHz from PLL</span> <span class="kw">let</span> rcc = dp.RCC.<span class="fn">constrain</span>(); <span class="kw">let</span> clocks = rcc.cfgr.<span class="fn">sysclk</span>(84.<span class="fn">MHz</span>()).<span class="fn">freeze</span>(); <span class="cm">// Blocking delay backed by TIM5</span> <span class="kw">let mut</span> delay = dp.TIM5.<span class="fn">delay_ms</span>(&amp;clocks); <span class="cm">// Split GPIOA into individual pins — consumes dp.GPIOA</span> <span class="kw">let</span> gpioa = dp.GPIOA.<span class="fn">split</span>(); <span class="cm">// Configure PA5 as push-pull output (Nucleo onboard LED) // Type: PA5&lt;Output&lt;PushPull&gt;&gt; // You CANNOT call is_high() on this — wrong type! Compile-time safety.</span> <span class="kw">let mut</span> led = gpioa.pa5.<span class="fn">into_push_pull_output</span>(); <span class="kw">loop</span> { led.<span class="fn">set_high</span>(); delay.<span class="fn">delay_ms</span>(500u32); led.<span class="fn">set_low</span>(); delay.<span class="fn">delay_ms</span>(500u32); } }</pre></div> <div class="ca tip">&#128161; <strong>Build and flash:</strong> With a debug probe connected, simply run <code>cargo run</code>. The <code>probe-rs</code> runner flashes the binary and connects RTT for debug output automatically.</div> <h2>Project 2 — Button-Controlled LED</h2> <p>Read a button on PA0. The LED follows the button state — on while pressed, off when released:</p> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">copy</button></div><pre><span class="at">#![no_std]</span> <span class="at">#![no_main]</span> <span class="kw">use</span> cortex_m_rt::entry; <span class="kw">use</span> panic_halt <span class="kw">as</span> _; <span class="kw">use</span> stm32f4xx_hal::{pac, prelude::*}; <span class="at">#[entry]</span> <span class="kw">fn</span> <span class="fn">main</span>() -> ! { <span class="kw">let</span> dp = pac::Peripherals::<span class="fn">take</span>().<span class="fn">unwrap</span>(); <span class="kw">let</span> gpioa = dp.GPIOA.<span class="fn">split</span>(); <span class="kw">let mut</span> led = gpioa.pa5.<span class="fn">into_push_pull_output</span>(); <span class="cm">// PA0 = blue button on Nucleo. Pull-down means: HIGH when pressed.</span> <span class="kw">let</span> button = gpioa.pa0.<span class="fn">into_pull_down_input</span>(); <span class="kw">loop</span> { <span class="cm">// Type system ensures we can only read from input pins and // only write to output pins — wrong operations don\'t compile.</span> <span class="kw">if</span> button.<span class="fn">is_high</span>() { led.<span class="fn">set_high</span>(); } <span class="kw">else</span> { led.<span class="fn">set_low</span>(); } } }</pre></div> <h2>Project 3 — PWM Breathing LED</h2> <p>Pulse-width modulation lets you control LED brightness digitally. We sweep the duty cycle from 0% to 100% and back, creating a smooth breathing effect. PA8 is TIM1_CH1 on the STM32F411:</p> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">copy</button></div><pre><span class="at">#![no_std]</span> <span class="at">#![no_main]</span> <span class="kw">use</span> cortex_m_rt::entry; <span class="kw">use</span> panic_halt <span class="kw">as</span> _; <span class="kw">use</span> stm32f4xx_hal::{pac, prelude::*, timer::pwm::PwmExt}; <span class="at">#[entry]</span> <span class="kw">fn</span> <span class="fn">main</span>() -> ! { <span class="kw">let</span> dp = pac::Peripherals::<span class="fn">take</span>().<span class="fn">unwrap</span>(); <span class="kw">let</span> rcc = dp.RCC.<span class="fn">constrain</span>(); <span class="kw">let</span> clocks = rcc.cfgr.<span class="fn">sysclk</span>(84.<span class="fn">MHz</span>()).<span class="fn">freeze</span>(); <span class="kw">let mut</span> delay = dp.TIM5.<span class="fn">delay_ms</span>(&amp;clocks); <span class="kw">let</span> gpioa = dp.GPIOA.<span class="fn">split</span>(); <span class="cm">// Reconfigure PA8 as alternate function for TIM1_CH1</span> <span class="kw">let</span> pa8 = gpioa.pa8.<span class="fn">into_alternate</span>(); <span class="kw">let mut</span> ch = dp.TIM1.<span class="fn">pwm_hz</span>((pa8,), 1.kHz(), &amp;clocks).<span class="fn">split</span>().0; ch.<span class="fn">enable</span>(); <span class="kw">let</span> max = ch.<span class="fn">get_max_duty</span>(); <span class="cm">// e.g. 65535 for 16-bit timer</span> <span class="kw">loop</span> { <span class="cm">// Fade in</span> <span class="kw">for</span> pct <span class="kw">in</span> 0u32..=100 { ch.<span class="fn">set_duty</span>((max <span class="kw">as</span> <span class="ty">u32</span> * pct / 100) <span class="kw">as</span> <span class="ty">u16</span>); delay.<span class="fn">delay_ms</span>(10u32); } <span class="cm">// Fade out</span> <span class="kw">for</span> pct <span class="kw">in</span> (0u32..=100).<span class="fn">rev</span>() { ch.<span class="fn">set_duty</span>((max <span class="kw">as</span> <span class="ty">u32</span> * pct / 100) <span class="kw">as</span> <span class="ty">u16</span>); delay.<span class="fn">delay_ms</span>(10u32); } } }</pre></div> <h2>Project 4 — I2C with BMP280 (Pressure + Temperature)</h2> <p>The BMP280 is a Bosch environmental sensor. PB8 = SCL (clock), PB9 = SDA (data). Enable the BMP280 driver crate and pass it your I2C peripheral — the driver handles all the register reads internally:</p> <div class="cb"><div class="cbh"><span class="cbl">toml</span><button class="cbc">copy</button></div><pre>[dependencies] stm32f4xx-hal = { version = "0.21", features = ["stm32f411"] } bmp280-ehal = "0.1"</pre></div> <div class="cb"><div class="cbh"><span class="cbl">rust</span><button class="cbc">copy</button></div><pre><span class="at">#![no_std]</span> <span class="at">#![no_main]</span> <span class="kw">use</span> cortex_m_rt::entry; <span class="kw">use</span> panic_halt <span class="kw">as</span> _; <span class="kw">use</span> stm32f4xx_hal::{pac, prelude::*, i2c::I2c}; <span class="at">#[entry]</span> <span class="kw">fn</span> <span class="fn">main</span>() -> ! { <span class="kw">let</span> dp = pac::Peripherals::<span class="fn">take</span>().<span class="fn">unwrap</span>(); <span class="kw">let</span> rcc = dp.RCC.<span class="fn">constrain</span>(); <span class="kw">let</span> clocks = rcc.cfgr.<span class="fn">sysclk</span>(84.<span class="fn">MHz</span>()).<span class="fn">freeze</span>(); <span class="kw">let mut</span> delay = dp.TIM5.<span class="fn">delay_ms</span>(&amp;clocks); <span class="kw">let</span> gpiob = dp.GPIOB.<span class="fn">split</span>(); <span class="cm">// I2C1 on PB8 (SCL) and PB9 (SDA), Fast mode 400kHz</span> <span class="kw">let</span> scl = gpiob.pb8.<span class="fn">into_alternate_open_drain</span>::&lt;4&gt;(); <span class="kw">let</span> sda = gpiob.pb9.<span class="fn">into_alternate_open_drain</span>::&lt;4&gt;(); <span class="kw">let</span> i2c = <span class="ty">I2c</span>::<span class="fn">new</span>(dp.I2C1, (scl, sda), 400.kHz(), &amp;clocks); <span class="cm">// Hand the I2C bus to the BMP280 driver at 7-bit address 0x76</span> <span class="kw">let mut</span> bmp = bmp280_ehal::<span class="ty">BMP280</span>::<span class="fn">new</span>(i2c, 0x76).<span class="fn">unwrap</span>(); bmp.<span class="fn">set_sampling</span>(bmp280_ehal::<span class="ty">SamplingConfig</span>::<span class="fn">standard</span>()).<span class="fn">unwrap</span>(); <span class="kw">loop</span> { <span class="kw">let</span> temp_c = bmp.<span class="fn">temperature</span>().<span class="fn">unwrap</span>(); <span class="kw">let</span> pres_hpa = bmp.<span class="fn">pressure</span>().<span class="fn">unwrap</span>() / 100.0; <s
