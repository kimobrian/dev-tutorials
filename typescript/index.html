<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TypeScript: Zero to Mastery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
<style>
  /* ============================================================
     DESIGN SYSTEM — TypeScript Blue × Amber accent × Deep Navy
  ============================================================ */
  :root {
    --bg:           #0b0f1a;
    --bg2:          #111827;
    --bg3:          #1a2235;
    --surface:      #1e2d45;
    --surface2:     #243452;
    --border:       rgba(99,179,237,0.12);
    --border2:      rgba(99,179,237,0.25);
    --text:         #e8edf5;
    --text2:        #94a8c4;
    --text3:        #5a7094;
    --ts-blue:      #3b82f6;
    --ts-light:     #63b3ed;
    --accent:       #f59e0b;
    --accent2:      #fbbf24;
    --green:        #34d399;
    --red:          #f87171;
    --purple:       #a78bfa;
    --font-display: 'Syne', sans-serif;
    --font-body:    'DM Sans', sans-serif;
    --font-mono:    'JetBrains Mono', monospace;
    --nav-w:        280px;
    --radius:       10px;
    --radius-lg:    16px;
    --shadow:       0 4px 24px rgba(0,0,0,0.4);
    --shadow-lg:    0 12px 48px rgba(0,0,0,0.6);
    --glow:         0 0 40px rgba(59,130,246,0.12);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.7;
    font-size: 15px;
    overflow-x: hidden;
  }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--surface); border-radius: 99px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--ts-blue); }

  /* ── LAYOUT ── */
  #app { display: flex; min-height: 100vh; }

  /* ── SIDEBAR NAV ── */
  #sidebar {
    width: var(--nav-w);
    min-width: var(--nav-w);
    background: var(--bg2);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; left: 0;
    height: 100vh;
    z-index: 100;
    transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
  }

  #sidebar-header {
    padding: 24px 20px 16px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    margin-bottom: 16px;
  }

  .logo-badge {
    background: var(--ts-blue);
    color: white;
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 13px;
    padding: 4px 8px;
    border-radius: 6px;
    letter-spacing: 0.5px;
  }

  .logo-text {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 15px;
    color: var(--text);
    letter-spacing: -0.3px;
  }

  /* ── SEARCH ── */
  #search-wrap {
    position: relative;
  }

  #search-input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-radius: var(--radius);
    padding: 8px 12px 8px 34px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }

  #search-input:focus { border-color: var(--ts-blue); }
  #search-input::placeholder { color: var(--text3); }

  .search-icon {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text3);
    font-size: 14px;
    pointer-events: none;
  }

  /* ── NAV TREE ── */
  #nav-tree {
    flex: 1;
    overflow-y: auto;
    padding: 12px 0 24px;
  }

  .nav-group { margin-bottom: 4px; }

  .nav-group-label {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--text3);
    padding: 10px 20px 4px;
    display: block;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 7px 20px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text2);
    border-left: 2px solid transparent;
    transition: all 0.15s;
    text-decoration: none;
    user-select: none;
  }

  .nav-item:hover {
    color: var(--text);
    background: rgba(59,130,246,0.06);
    border-left-color: rgba(59,130,246,0.3);
  }

  .nav-item.active {
    color: var(--ts-light);
    background: rgba(59,130,246,0.1);
    border-left-color: var(--ts-blue);
    font-weight: 500;
  }

  .nav-num {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text3);
    min-width: 20px;
  }

  .nav-item.active .nav-num { color: var(--ts-blue); }

  /* ── MAIN CONTENT ── */
  #main {
    margin-left: var(--nav-w);
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* ── TOP BAR ── */
  #topbar {
    position: sticky;
    top: 0;
    z-index: 90;
    background: rgba(11,15,26,0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    padding: 12px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  #breadcrumb {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text3);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  #breadcrumb .bc-active {
    color: var(--ts-light);
  }

  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--text3);
    font-family: var(--font-mono);
  }

  .progress-bar {
    width: 100px;
    height: 3px;
    background: var(--surface);
    border-radius: 99px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--ts-blue), var(--accent));
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  #hamburger {
    display: none;
    background: none;
    border: 1px solid var(--border2);
    color: var(--text2);
    padding: 6px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
  }

  /* ── CHAPTER CONTENT ── */
  #content {
    flex: 1;
    padding: 52px 64px 80px;
    max-width: 900px;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── TYPOGRAPHY ── */
  .chapter-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--ts-blue);
    background: rgba(59,130,246,0.1);
    border: 1px solid rgba(59,130,246,0.25);
    padding: 4px 10px;
    border-radius: 99px;
    margin-bottom: 20px;
  }

  .chapter-title {
    font-family: var(--font-display);
    font-size: clamp(28px, 4vw, 42px);
    font-weight: 800;
    line-height: 1.15;
    letter-spacing: -1px;
    color: var(--text);
    margin-bottom: 16px;
  }

  .chapter-title span { color: var(--ts-blue); }

  .chapter-intro {
    font-size: 16px;
    color: var(--text2);
    line-height: 1.8;
    margin-bottom: 40px;
    padding-bottom: 32px;
    border-bottom: 1px solid var(--border);
    max-width: 680px;
  }

  h2 {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    margin: 44px 0 16px;
    letter-spacing: -0.4px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  h2::before {
    content: '';
    display: inline-block;
    width: 4px;
    height: 20px;
    background: var(--ts-blue);
    border-radius: 2px;
    flex-shrink: 0;
  }

  h3 {
    font-family: var(--font-display);
    font-size: 17px;
    font-weight: 600;
    color: var(--text);
    margin: 30px 0 12px;
    letter-spacing: -0.2px;
  }

  p {
    color: var(--text2);
    margin-bottom: 16px;
    line-height: 1.8;
    max-width: 720px;
  }

  strong { color: var(--text); font-weight: 600; }

  a { color: var(--ts-light); text-decoration: none; }
  a:hover { text-decoration: underline; }

  code {
    font-family: var(--font-mono);
    font-size: 13px;
    background: var(--surface);
    color: var(--accent2);
    padding: 2px 7px;
    border-radius: 5px;
    border: 1px solid var(--border);
  }

  /* ── Reset code styles inside pre blocks ── */
  pre code {
    background: transparent;
    color: inherit;
    padding: 0;
    border-radius: 0;
    border: none;
    font-size: inherit;
  }

  ul, ol {
    color: var(--text2);
    padding-left: 20px;
    margin-bottom: 20px;
    max-width: 720px;
  }

  li {
    margin-bottom: 8px;
    line-height: 1.7;
  }

  li code { font-size: 12px; }

  /* ── CODE BLOCKS ── */
  .code-block {
    background: #0d1117;
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: var(--radius-lg);
    overflow: hidden;
    margin: 20px 0;
    box-shadow: 0 2px 16px rgba(0,0,0,0.5);
  }

  .code-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 14px;
    background: #161b22;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }

  .code-filename {
    font-family: var(--font-mono);
    font-size: 11px;
    color: #6e7681;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .code-lang {
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: #58a6ff;
    background: rgba(88,166,255,0.1);
    padding: 2px 8px;
    border-radius: 99px;
    border: 1px solid rgba(88,166,255,0.2);
  }

  .code-lang.bash { color: #3fb950; background: rgba(63,185,80,0.1); border-color: rgba(63,185,80,0.2); }
  .code-lang.json { color: #e3b341; background: rgba(227,179,65,0.1); border-color: rgba(227,179,65,0.2); }

  .copy-btn {
    background: none;
    border: 1px solid rgba(255,255,255,0.1);
    color: #6e7681;
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .copy-btn:hover { border-color: #58a6ff; color: #58a6ff; }
  .copy-btn.copied { border-color: #3fb950; color: #3fb950; }

  pre {
    padding: 20px;
    overflow-x: auto;
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1.8;
    color: #e6edf3;
    background: #0d1117;
  }

  /* ── SYNTAX HIGHLIGHT TOKENS — VS Code Dark+ palette ── */
  /* Keywords: const, let, function, class, return, if … */
  .kw  { color: #ff7b72; background: none; }
  /* Built-in types: string, number, boolean, Promise … */
  .ty  { color: #79c0ff; background: none; }
  /* String & template literals */
  .str { color: #a5d6ff; background: none; }
  /* Numeric literals */
  .num { color: #f2cc60; background: none; }
  /* Comments */
  .cm  { color: #6e7681; font-style: italic; background: none; }
  /* Function names */
  .fn  { color: #d2a8ff; background: none; }
  /* CLI flags (--watch, -d) */
  .pm  { color: #ffa657; background: none; }
  /* Object properties / JSON keys */
  .pr  { color: #79c0ff; background: none; }

  /* Reset any inherited backgrounds inside code blocks */
  pre, pre code, pre span, pre code span {
    background: transparent !important;
  }

  /* Clean selection color inside code */
  pre ::selection,
  pre code ::selection {
    background: rgba(88, 166, 255, 0.25);
    color: inherit;
  }

  /* ── CALLOUTS ── */
  .callout {
    display: flex;
    gap: 14px;
    padding: 16px 20px;
    border-radius: var(--radius);
    margin: 20px 0;
    border-left: 3px solid;
    max-width: 720px;
  }

  .callout-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }

  .callout-body { flex: 1; }
  .callout-body p { margin: 0; font-size: 14px; max-width: none; }
  .callout-title { font-weight: 600; font-size: 13px; margin-bottom: 4px; }

  .callout.info {
    background: rgba(59,130,246,0.07);
    border-color: var(--ts-blue);
  }
  .callout.info .callout-title { color: var(--ts-light); }

  .callout.tip {
    background: rgba(52,211,153,0.07);
    border-color: var(--green);
  }
  .callout.tip .callout-title { color: var(--green); }

  .callout.warn {
    background: rgba(245,158,11,0.07);
    border-color: var(--accent);
  }
  .callout.warn .callout-title { color: var(--accent2); }

  .callout.error {
    background: rgba(248,113,113,0.07);
    border-color: var(--red);
  }
  .callout.error .callout-title { color: var(--red); }

  /* ── TABLES ── */
  .table-wrap { overflow-x: auto; margin: 20px 0; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }

  th {
    background: var(--surface);
    color: var(--text);
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 10px 16px;
    text-align: left;
    border-bottom: 1px solid var(--border2);
  }

  td {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    color: var(--text2);
    vertical-align: top;
  }

  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(59,130,246,0.03); }

  td code { font-size: 12px; }

  /* ── COMPARISON GRID ── */
  .compare-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin: 20px 0;
  }

  .compare-card {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .compare-card-header {
    padding: 8px 14px;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .compare-card.js .compare-card-header { background: rgba(245,158,11,0.1); color: var(--accent2); }
  .compare-card.ts .compare-card-header { background: rgba(59,130,246,0.1); color: var(--ts-light); }

  .compare-card pre { font-size: 12px; padding: 14px; }

  /* ── CHAPTER NAV ── */
  #chapter-nav {
    display: flex;
    align-items: stretch;
    gap: 16px;
    padding: 40px 64px 60px;
    border-top: 1px solid var(--border);
    max-width: 900px;
  }

  .nav-btn {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 22px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    cursor: pointer;
    transition: all 0.2s;
    text-decoration: none;
    color: var(--text);
    max-width: 340px;
  }

  .nav-btn:hover {
    border-color: var(--ts-blue);
    background: rgba(59,130,246,0.06);
    transform: translateY(-2px);
    box-shadow: var(--glow);
    text-decoration: none;
  }

  .nav-btn.next { margin-left: auto; flex-direction: row-reverse; text-align: right; }

  .nav-btn.disabled {
    opacity: 0.3;
    pointer-events: none;
  }

  .nav-arrow { font-size: 20px; color: var(--ts-blue); flex-shrink: 0; }

  .nav-meta { display: flex; flex-direction: column; gap: 2px; }
  .nav-label { font-family: var(--font-mono); font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; }
  .nav-chapter-name { font-family: var(--font-display); font-size: 14px; font-weight: 600; color: var(--text); }

  /* ── TAGS ── */
  .tag {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 99px;
    border: 1px solid;
    margin: 3px 3px 3px 0;
  }

  .tag.beginner  { color: var(--green);  border-color: rgba(52,211,153,0.3);  background: rgba(52,211,153,0.07); }
  .tag.medium    { color: var(--accent2); border-color: rgba(251,191,36,0.3);  background: rgba(251,191,36,0.07); }
  .tag.advanced  { color: var(--red);    border-color: rgba(248,113,113,0.3); background: rgba(248,113,113,0.07); }

  /* ── SEARCH MODAL ── */
  #search-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    z-index: 1000;
    align-items: flex-start;
    justify-content: center;
    padding-top: 80px;
    animation: overlayIn 0.15s ease;
  }

  @keyframes overlayIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  #search-overlay.open { display: flex; }

  #search-modal {
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: var(--radius-lg);
    width: 90%;
    max-width: 640px;
    max-height: 70vh;
    display: flex;
    flex-direction: column;
    box-shadow: var(--shadow-lg), 0 0 60px rgba(59,130,246,0.15);
    animation: modalIn 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    overflow: hidden;
  }

  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.92) translateY(-10px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  #modal-search-wrap {
    position: relative;
    border-bottom: 1px solid var(--border);
  }

  #modal-search-icon {
    position: absolute;
    left: 18px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ts-blue);
    font-size: 16px;
  }

  #modal-search-input {
    width: 100%;
    background: transparent;
    border: none;
    padding: 18px 18px 18px 48px;
    font-family: var(--font-body);
    font-size: 16px;
    color: var(--text);
    outline: none;
  }

  #modal-search-input::placeholder { color: var(--text3); }

  #modal-close {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: var(--surface);
    border: 1px solid var(--border2);
    color: var(--text3);
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 5px;
    cursor: pointer;
  }

  #modal-close:hover { color: var(--text); }

  #search-results {
    overflow-y: auto;
    padding: 10px;
    flex: 1;
  }

  .search-empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--text3);
    font-size: 14px;
    font-family: var(--font-mono);
  }

  .search-result-item {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px 14px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: background 0.12s;
    border: 1px solid transparent;
  }

  .search-result-item:hover,
  .search-result-item.selected {
    background: rgba(59,130,246,0.08);
    border-color: rgba(59,130,246,0.2);
  }

  .sri-num {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ts-blue);
    background: rgba(59,130,246,0.12);
    padding: 3px 7px;
    border-radius: 5px;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .sri-body { flex: 1; min-width: 0; }

  .sri-title {
    font-weight: 600;
    font-size: 14px;
    color: var(--text);
    margin-bottom: 3px;
    font-family: var(--font-display);
  }

  .sri-snippet {
    font-size: 12.5px;
    color: var(--text3);
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .highlight-match {
    color: var(--accent2);
    background: rgba(245,158,11,0.15);

// ================================================================

function codeBlock(lang, filename, code) {
  const id = 'cb' + Math.random().toString(36).slice(2,8);
  const escapedCode = code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const highlighted = highlight(escapedCode, lang);
  const langClass = lang === 'bash' ? 'bash' : lang === 'json' ? 'json' : '';
  return `<div class="code-block" id="${id}">
  <div class="code-header">
    <span class="code-filename">${filename ? '📄 ' + filename : '&nbsp;'}</span>
    <div style="display:flex;gap:8px;align-items:center">
      <span class="code-lang ${langClass}">${lang}</span>
      <button class="copy-btn" onclick="copyCode('${id}')">copy</button>
    </div>
  </div>
  <pre><code>${highlighted}</code></pre>
</div>`;
}

function highlight(code, lang) {
  // ── Single-pass tokenizer ──────────────────────────────────────────────────
  // Processes code left-to-right, consuming one token at a time.
  // This avoids the cascading regex corruption of sequential replace() calls.

  if (lang === 'bash') return highlightBash(code);
  if (lang === 'json') return highlightJson(code);
  return highlightTS(code);
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function span(cls, text) {
  return `<span class="${cls}">${text}</span>`;
}

  'typeof','instanceof','in','of','keyof','infer','never','unknown','any',
  'void','null','undefined','true','false','as','is','satisfies','override'
]);

const TS_TYPES = new Set([
  'string','number','boolean','object','symbol','bigint','Array','Promise',
  'Record','Partial','Required','Readonly','Pick','Omit','Exclude','Extract',
  'ReturnType','Parameters','ConstructorParameters','InstanceType',
  'NonNullable','Awaited','Map','Set','Error','Date','RegExp','Function',
  'EventTarget','Request','Response','URL','Headers','FormData','ReadableStream'
]);

function highlightTS(code) {
  let out = '';
  let i = 0;
  const len = code.length;

  while (i < len) {
    // ── Line comment ──────────────────────────────────────────────
    if (code[i] === '/' && code[i+1] === '/') {
      let j = i;
      while (j < len && code[j] !== '\n') j++;
      out += span('cm', esc(code.slice(i, j)));
      i = j;
      continue;
    }

    // ── Block comment ─────────────────────────────────────────────
    if (code[i] === '/' && code[i+1] === '*') {
      let j = i + 2;
      while (j < len && !(code[j-1] === '*' && code[j] === '/')) j++;
      j++; // include closing /
      out += span('cm', esc(code.slice(i, j)));
      i = j;
      continue;
    }

    // ── Template literal ──────────────────────────────────────────
    if (code[i] === '`') {
      let j = i + 1;
      while (j < len) {
        if (code[j] === '\\') { j += 2; continue; }
        if (code[j] === '`') { j++; break; }
        j++;
      }
      // Render backtick strings simply — no nested interpolation coloring
      out += span('str', esc(code.slice(i, j)));
      i = j;
      continue;
    }

    // ── Double-quoted string ───────────────────────────────────────
    if (code[i] === '"') {
      let j = i + 1;
      while (j < len) {
        if (code[j] === '\\') { j += 2; continue; }
        if (code[j] === '"') { j++; break; }
        j++;
      }
      out += span('str', esc(code.slice(i, j)));
      i = j;
      continue;
    }

    // ── Single-quoted string ───────────────────────────────────────
    if (code[i] === "'") {
      let j = i + 1;
      while (j < len) {
        if (code[j] === '\\') { j += 2; continue; }
        if (code[j] === "'") { j++; break; }
        j++;
      }
      out += span('str', esc(code.slice(i, j)));
      i = j;
      continue;
    }

    // ── Number literal ─────────────────────────────────────────────
    if (/[0-9]/.test(code[i]) && (i === 0 || /\W/.test(code[i-1]))) {
      let j = i;
      while (j < len && /[0-9._xXbBoOnA-Fa-fn]/.test(code[j])) j++;
      out += span('num', esc(code.slice(i, j)));
      i = j;
      continue;
    }

    // ── Identifier or keyword ──────────────────────────────────────
    if (/[a-zA-Z_$]/.test(code[i])) {
      let j = i;
      while (j < len && /[a-zA-Z0-9_$]/.test(code[j])) j++;
      const word = code.slice(i, j);

      if (TS_KEYWORDS.has(word)) {
        out += span('kw', esc(word));
      } else if (TS_TYPES.has(word)) {
        out += span('ty', esc(word));
      } else if (j < len && code[j] === '(') {
        // Function call or declaration name
        out += span('fn', esc(word));
      } else if (i > 0 && code[i-1] === '.') {
        // Property access after dot
        out += span('pr', esc(word));
      } else {
        out += esc(word);
      }
      i = j;
      continue;
    }

    // ── Everything else ────────────────────────────────────────────
    out += esc(code[i]);
    i++;
  }

  return out;
}

function highlightBash(code) {
  let out = '';
  const lines = code.split('\n');
  const BASH_KW = new Set(['bun','npm','npx','node','mkdir','cd','touch','echo','cat','ls','curl','export','source','chmod','git','grep','sed','awk']);

  for (let li = 0; li < lines.length; li++) {
    const line = lines[li];

    // Full-line comment
    const trimmed = line.trimStart();
    if (trimmed.startsWith('#')) {
      out += span('cm', esc(line));
    } else {
      // Tokenize: strings, then keywords at word boundaries
      let i = 0;
      let lineOut = '';
      while (i < line.length) {
        // inline # comment
        if (line[i] === '#') {
          lineOut += span('cm', esc(line.slice(i)));
          i = line.length;
          continue;
        }
        // strings
        if (line[i] === '"' || line[i] === "'") {
          const q = line[i];
          let j = i + 1;
          while (j < line.length && line[j] !== q) { if (line[j] === '\\') j++; j++; }
          j++;
          lineOut += span('str', esc(line.slice(i, j)));
          i = j;
          continue;
        }
        // identifiers / keywords
        if (/[a-zA-Z_\-]/.test(line[i])) {
          let j = i;
          while (j < line.length && /[a-zA-Z0-9_\-]/.test(line[j])) j++;
          const word = line.slice(i, j);
          lineOut += BASH_KW.has(word) ? span('kw', esc(word)) : esc(word);
          i = j;
          continue;
        }
        // flags like --watch
        if (line[i] === '-') {
          let j = i;
          while (j < line.length && /[-a-zA-Z]/.test(line[j])) j++;
          lineOut += span('pm', esc(line.slice(i, j)));
          i = j;
          continue;
        }
        lineOut += esc(line[i++]);
      }
      out += lineOut;
    }
    if (li < lines.length - 1) out += '\n';
  }
  return out;
}

function highlightJson(code) {
  let out = '';
  let i = 0;
  const len = code.length;
  let expectKey = false; // after { or , we expect a key

  // Track brace/bracket depth for context
  while (i < len) {
    if (code[i] === '"') {
      let j = i + 1;
      while (j < len) {
        if (code[j] === '\\') { j += 2; continue; }
        if (code[j] === '"') { j++; break; }
        j++;
      }
      const str = code.slice(i, j);
      // Look ahead past whitespace for colon → it's a key
      let k = j;
      while (k < len && /\s/.test(code[k])) k++;
      const isKey = code[k] === ':';
      out += span(isKey ? 'pr' : 'str', esc(str));
      i = j;
      continue;
    }
    if (/[0-9\-]/.test(code[i])) {
      let j = i;
      if (code[j] === '-') j++;
      while (j < len && /[0-9.eE+\-]/.test(code[j])) j++;
      out += span('num', esc(code.slice(i, j)));
      i = j;
      continue;
    }
    // true / false / null
    if (code[i] === 't' || code[i] === 'f' || code[i] === 'n') {
      let matched = false;
      for (const kw of ['true','false','null']) {
        if (code.startsWith(kw, i)) {
          out += span('kw', kw);
          i += kw.length;
          matched = true;
          break;
        }
      }
      if (!matched) { out += esc(code[i++]); }
      continue;
    }
    out += esc(code[i++]);
  }
  return out;
}

function callout(type, title, body) {
  const icons = { info: 'ℹ', tip: '💡', warn: '⚠', error: '✖' };
  return `<div class="callout ${type}">
  <span class="callout-icon">${icons[type]}</span>
  <div class="callout-body">
    <div class="callout-title">${title}</div>
    <p>${body}</p>
  </div>
</div>`;
}

function tag(level) {
  return `<span class="tag ${level}">${level}</span>`;
}

  <p class="chapter-intro">
    TypeScript's type system is built on the same primitive types as JavaScript, but
    now every variable can carry an explicit declaration of what it holds.
    Understanding primitives is the foundation of everything else — generics, utility
    types, and advanced patterns all rely on this bedrock.
  </p>

  <h2>Type Annotations</h2>
  <p>
    A type annotation is written with a colon after the variable name: <code>let name: string</code>.
    It tells the TypeScript compiler: "this variable holds only this type of value."
    If you try to assign a different type, TypeScript reports an error immediately.
  </p>

  ${codeBlock('typescript', '', `// Annotating variable declarations
let firstName: string = "Alice";
let age: number = 28;
let isAdmin: boolean = false;
let nothing: null = null;
let missing: undefined = undefined;

// TypeScript immediately knows the type of each variable
firstName.toUpperCase();   // ✅ string method available
age.toFixed(2);            // ✅ number method available
age.toUpperCase();         // ❌ Property 'toUpperCase' does not exist on type 'number'`)}

  <h2>Type Inference — TypeScript Reads Your Code</h2>
  <p>
    You do not have to annotate every variable. TypeScript uses <strong>type inference</strong>:
    if you declare <code>const x = 42</code>, TypeScript infers the type is <code>number</code>
    automatically. A key rule of thumb: <strong>annotate function parameters and return types explicitly;
    let TypeScript infer variable types from initializers</strong>.
  </p>

  ${codeBlock('typescript', '', `// TypeScript infers the type from the value — no annotation needed
const greeting = "Hello, World!"; // inferred: string
const count = 0;                  // inferred: number
const active = true;              // inferred: boolean

// Hover over these in VS Code and you will see the inferred type.
// The type is just as strong as if you had written it explicitly.

// However, sometimes you need to declare without initializing:
let userId: string;                  // Declared but unassigned
userId = "user_42";                  // ✅
userId = 42;                         // ❌ Type 'number' is not assignable to type 'string'

// Without annotation, TypeScript infers 'any' — dangerous:
let value;                           // type: any — avoid this
value = "hello";
value = 42;                          // Both allowed, defeating the point`)}

  ${callout('warn', 'Avoid "any"', 'The <code>any</code> type disables all TypeScript checking for that value. With <code>strict: true</code>, TypeScript will warn you when it would infer <code>any</code>. Always provide explicit types when TypeScript cannot infer them.')}

  <h2>The number Type</h2>
  <p>
    Unlike languages with int, float, double — JavaScript (and TypeScript) uses a single
    <code>number</code> type for all numeric values. Both integers and floats are <code>number</code>.
    TypeScript also adds special numeric literals as their own narrow types.
  </p>

  ${codeBlock('typescript', '', `// All of these are 'number'
const price: number = 29.99;
const userCount: number = 1_000_000; // underscores allowed as separators
const hex: number = 0xFF;            // hexadecimal
const binary: number = 0b1010;       // binary
const octal: number = 0o17;          // octal

// Special values — these are still type 'number'
const inf = Infinity;
const notANumber = NaN;

// bigint — for integers larger than 2^53 - 1
const bigId: bigint = 9007199254740993n; // note the 'n' suffix
const alsoLarge = 100n;

// You cannot mix number and bigint:
const result = price + bigId; // ❌ Operator '+' cannot be applied to types 'number' and 'bigint'`)}

  <h2>The string Type</h2>
  <p>
    Strings in TypeScript are the same as JavaScript — single quotes, double quotes,
    or template literals. What TypeScript adds is knowing exactly which string methods
    are available and catching common errors like treating numbers as strings.
  </p>

  ${codeBlock('typescript', '', `const taskTitle: string = "Fix login bug";
const description: string = 'OAuth redirect is broken on mobile';

// Template literals — full TypeScript support
const userId = "user_42";
const message: string = \`Task assigned to \${userId}\`;

// TypeScript knows all string methods and their return types
const upper: string = taskTitle.toUpperCase();
const length: number = taskTitle.length;      // .length returns number
const parts: string[] = taskTitle.split(" "); // .split returns string[]

// Multiline strings with template literals
const longMessage = \`
  Dear \${userId},
  Your task "\${taskTitle}" has been updated.
  Please review it at your earliest convenience.
\`;`)}

  <h2>The boolean Type</h2>
  <p>
    Booleans in TypeScript are strictly <code>true</code> or <code>false</code>. One of
    TypeScript's most valuable features is <strong>strictNullChecks</strong>: it prevents
    you from using <code>null</code> or <code>undefined</code> where a boolean is expected,
    which is a frequent source of JavaScript bugs.
  </p>

  ${codeBlock('typescript', '', `const isCompleted: boolean = false;
const hasDeadline: boolean = true;

// Control flow with booleans — TypeScript narrows types inside branches
function describe(completed: boolean): string {
  if (completed) {
    return "Task is done"; // TypeScript knows completed is true here
  }
  return "Task is pending";
}

// Be careful: in JavaScript, many values are "truthy" or "falsy".
// TypeScript does NOT let you use them as booleans directly when strict:
function processTask(task: { title: string; completed: boolean }) {
  if (task.completed) {       // ✅ boolean used as condition
    console.log("Done!");
  }
}

// However, conditions still accept any type (for truthy/falsy checks):
const title = "";
if (title) {                  // Works — TypeScript allows this for non-boolean too
  console.log(title);
}`)}

  <h2>null and undefined</h2>
  <p>
    These are two distinct types in TypeScript, and with <code>strictNullChecks</code> enabled,
    they cannot be assigned to other types without explicit permission. This is one of
    TypeScript's most powerful features for preventing runtime errors.
  </p>

  ${codeBlock('typescript', '', `// With strict mode, null and undefined are their own narrow types
let name: string = "Alice";
name = null;              // ❌ Type 'null' is not assignable to type 'string'

// To allow null, use a union type (we cover unions in ch07)
let nullable: string | null = "Alice";
nullable = null;          // ✅ Explicitly allowed

// undefined typically means "not yet assigned"
let description: string | undefined;
// description is undefined here
description = "A great task";
// description is string here

// TypeScript forces you to check before using nullable values:
function getLength(s: string | null): number {
  if (s === null) {
    return 0;             // handle the null case
  }
  return s.length;        // TypeScript knows s is string here — safe
}

// Optional chaining (?.) — safe access on nullable values
const maybeString: string | null = null;
const len = maybeString?.length;  // type: number | undefined — never throws`)}

  <h2>symbol and unique symbol</h2>
  <p>
    Symbols are unique, immutable values used as object keys. They are commonly used for
    well-known symbol protocols and to create private-ish object members. TypeScript gives
    us the additional power of <code>unique symbol</code> — a type so narrow it represents
    exactly one specific symbol value.
  </p>

  ${codeBlock('typescript', '', `// symbol — a unique value, always distinct from all others
const sym1: symbol = Symbol("description");
const sym2: symbol = Symbol("description");
console.log(sym1 === sym2); // false — symbols are always unique

// unique symbol — TypeScript tracks the exact symbol
const TASK_KEY = Symbol("task") as const;
//    ^ type: typeof TASK_KEY — the unique symbol type

// Practical use: type-safe map keys
const taskMap = new Map<symbol, string>();
taskMap.set(TASK_KEY, "Fix login");

// Built-in symbols for protocol implementation
class TaskCollection {
  private tasks: string[] = ["Fix login", "Update API"];

  [Symbol.iterator]() {        // Makes the class iterable
    return this.tasks[Symbol.iterator]();
  }
}`)}

  <h2>Type Aliases</h2>
  <p>
    Often you want to give a meaningful name to a type — especially when the same type
    appears in multiple places. A <strong>type alias</strong> does exactly that:
  </p>

  ${codeBlock('typescript', '', `// Give types meaningful names
type UserId = string;
type TaskCount = number;
type IsActive = boolean;

// Now use them like any other type
const currentUser: UserId = "user_42";
const totalTasks: TaskCount = 7;

// Type aliases are especially useful for complex types
type Priority = "low" | "medium" | "high" | "critical";
//   ^ A union of string literals — more on this in chapter 7

const taskPriority: Priority = "high";    // ✅
const wrong: Priority = "urgent";         // ❌ Not a valid Priority

// In our TaskBoard project, we'll use type aliases extensively:
type TaskId = string;
type UserId2 = string;

interface Task {
  id: TaskId;
  assignedTo: UserId2;
  priority: Priority;
  title: string;
  completed: boolean;
}`)}

  ${callout('tip', 'TaskBoard Progress', 'We now have typed IDs and a Priority type alias. In the next chapter we will add typed arrays and enums to model task collections properly.')}

  <div class="chapter-complete">
    <span class="chapter-complete-icon">✦</span>
    <span class="chapter-complete-text">You now understand every primitive type TypeScript offers and how type inference keeps your code clean. Next: arrays, tuples, and enums for structured collections.</span>
  </div>
</div>`;
}

  return `<div>
  <div class="chapter-badge">▤ Chapter 04 · Core Types</div>
  <h1 class="chapter-title">Arrays, Tuples <span>&amp; Enums</span></h1>
  <div style="margin-bottom:12px">${tag('beginner')}</div>
  <p class="chapter-intro">
    Real applications work with collections — lists of users, arrays of tasks, coordinate pairs.
    TypeScript gives you typed arrays that know what they contain, tuples that know exactly how
    many elements and what type each is, and enums for modeling finite sets of named values.
  </p>

  <h2>Typed Arrays</h2>
  <p>
    In JavaScript, arrays can contain anything. TypeScript lets you declare that an array
    holds only one specific type. There are two equivalent syntaxes — use whichever feels clearer.
  </p>

  ${codeBlock('typescript', '', `// Syntax 1: Type followed by []
const titles: string[] = ["Fix login", "Update docs", "Add tests"];
const counts: number[] = [1, 5, 12, 8];
const flags: boolean[] = [true, false, true];

// Syntax 2: Generic Array<T> — identical meaning, different style
const titles2: Array<string> = ["Fix login", "Update docs"];

// TypeScript knows every array method and its types:
const firstTitle: string = titles[0];       // type: string
const allUpper: string[] = titles.map(t => t.toUpperCase()); // map returns string[]
const short: string[] = titles.filter(t => t.length < 10);   // filter returns string[]

// Adding wrong types is an error:
titles.push(42);       // ❌ Argument of type 'number' is not assignable to type 'string'
titles.push("Done");   // ✅

// Arrays of objects — very common in practice
interface Task {
  id: number;
  title: string;
  completed: boolean;
}

const tasks: Task[] = [
  { id: 1, title: "Fix login", completed: false },
  { id: 2, title: "Update docs", completed: true },
];

// TypeScript knows the shape of each element:
tasks.forEach(task => {
  console.log(task.title.toUpperCase()); // ✅ task.title is string
  console.log(task.missing);             // ❌ Property 'missing' does not exist
});`)}

  <h2>Read-Only Arrays</h2>
  <p>
    Sometimes you want an array that cannot be mutated — no push, pop, or splice.
    TypeScript gives you <code>readonly</code> arrays for exactly this:
  </p>

  ${codeBlock('typescript', '', `// ReadonlyArray<T> or readonly T[]
const PRIORITIES: readonly string[] = ["low", "medium", "high", "critical"];

PRIORITIES.push("urgent");     // ❌ Property 'push' does not exist on type 'readonly string[]'
PRIORITIES[0] = "minimal";     // ❌ Index signature in type 'readonly string[]' only permits reading
PRIORITIES.length;             // ✅ Reading is fine

// Useful for function parameters that should not be modified:
function printAll(items: readonly string[]): void {
  items.forEach(item => console.log(item)); // ✅ Reading is fine
  items.push("new item");                   // ❌ Prevents accidental mutation
}

// Regular arrays are assignable to readonly arrays (more permissive → less permissive)
const mutable: string[] = ["a", "b"];
const immutable: readonly string[] = mutable; // ✅
// const back: string[] = immutable;           // ❌ Can't go back`)}

  <h2>Tuples — Fixed-Length Typed Arrays</h2>
  <p>
    A tuple is an array with a <strong>fixed number of elements</strong> where the type of
    each position is known. Think of it as a lightweight alternative to an object — great
    for returning multiple values from a function.
  </p>

  ${codeBlock('typescript', '', `// A tuple of [id, title, isCompleted]
let taskEntry: [number, string, boolean];
taskEntry = [1, "Fix login", false];    // ✅ Correct order and types
taskEntry = ["Fix login", 1, false];    // ❌ Wrong order — type error at position 0

// Accessing elements — each position has its own type
const taskId: number = taskEntry[0];     // type: number
const taskTitle: string = taskEntry[1];  // type: string
const done: boolean = taskEntry[2];      // type: boolean

// Destructuring tuples — very clean and readable
const [id, title, completed] = taskEntry;
// id: number, title: string, completed: boolean — TypeScript infers each

// Tuples as function return values
function parseUserAgent(ua: string): [string, number] {
  const parts = ua.split("/");
  return [parts[0], parseFloat(parts[1])];
}

const [browser, version] = parseUserAgent("Chrome/120.0");
// browser: string, version: number — perfectly typed

// Named tuple elements (TypeScript 4.0+) — improves readability
type Point3D = [x: number, y: number, z: number];
const origin: Point3D = [0, 0, 0];

// Optional tuple elements
type OptPoint = [number, number, number?]; // z is optional
const p1: OptPoint = [1, 2];       // ✅
const p2: OptPoint = [1, 2, 3];    // ✅`)}

  ${callout('info', 'Tuple vs Object', 'Use tuples for small, positionally-meaningful data like <code>[lat, lng]</code> or <code>[error, result]</code>. For anything with 3+ fields or where names matter for clarity, use an object/interface — it reads better.')}

  <h2>Enums — Named Sets of Values</h2>
  <p>
    Enums let you define a named collection of related constants. Unlike a union of string literals
    (which we cover in chapter 7), enums create actual JavaScript objects at runtime, giving you
    both a type and a value.
  </p>

  <h3>Numeric Enums</h3>
  <p>
    The default enum flavor — each member gets an auto-incrementing number starting at 0,
    unless you specify a value.
  </p>

  ${codeBlock('typescript', '', `enum TaskStatus {
  Pending,     // 0
  InProgress,  // 1
  InReview,    // 2
  Completed,   // 3
  Archived     // 4
}

const status: TaskStatus = TaskStatus.InProgress; // value: 1
console.log(status);                               // 1

// Numeric enums have reverse mapping (string from number):
console.log(TaskStatus[1]); // "InProgress"

// Use in conditionals:
function isActive(s: TaskStatus): boolean {
  return s === TaskStatus.Pending || s === TaskStatus.InProgress;
}

// You can set starting values:
enum HttpStatus {
  OK = 200,
  Created = 201,
  BadRequest = 400,
  Unauthorized = 401,
  NotFound = 404,
  InternalError = 500
}`)}

  <h3>String Enums</h3>
  <p>
    String enums are more readable in practice and are preferred for user-facing values or API
    payloads, because the value you see in logs and JSON is a meaningful string, not a number.
  </p>

  ${codeBlock('typescript', '', `enum Priority {
  Low      = "LOW",
  Medium   = "MEDIUM",
  High     = "HIGH",
  Critical = "CRITICAL"
}

const taskPriority: Priority = Priority.High;
console.log(taskPriority);  // "HIGH" — readable in logs/JSON

// Use in function signatures — very clear intent
function escalate(current: Priority): Priority {
  switch (current) {
    case Priority.Low:      return Priority.Medium;
    case Priority.Medium:   return Priority.High;
    case Priority.High:     return Priority.Critical;
    case Priority.Critical: return Priority.Critical;
  }
}

const next = escalate(Priority.Low); // next: Priority = "MEDIUM"

// Exhaustive switch — TypeScript ensures every enum case is handled:
function describe(p: Priority): string {
  switch (p) {
    case Priority.Low:      return "Can wait";
    case Priority.Medium:   return "Do soon";
    case Priority.High:     return "Do today";
    case Priority.Critical: return "Drop everything";
    // If you add a new Priority variant and forget to handle it here,
    // TypeScript will show an error (with noImplicitReturns or exhaustive checks)
  }
}`)}

  <h3>Const Enums</h3>
  <p>
    Adding the <code>const</code> keyword before <code>enum</code> makes the compiler
    inline all enum values at use sites, producing no JavaScript object at runtime.
    This results in smaller output — but means you cannot use the reverse mapping.
  </p>

  ${codeBlock('typescript', '', `const enum Direction {
  Up    = "UP",
  Down  = "DOWN",
  Left  = "LEFT",
  Right = "RIGHT"
}

// Compiled output replaces Direction.Up with "UP" inline:
const move = Direction.Up; // compiles to: const move = "UP";

// No JavaScript object created — zero runtime cost
// But you cannot do Direction["UP"] — no reverse mapping`)}

  <h2>Applying This to Our TaskBoard</h2>

    Let's update our project types to use proper typed arrays and enums:

  ${codeBlock('typescript', 'src/types.ts', `// Centralize our domain types in one file

  Todo       = "TODO",
  InProgress = "IN_PROGRESS",
  InReview   = "IN_REVIEW",

}

export enum Priority {

  Medium   = "MEDIUM",
  High     = "HIGH",
  Critical = "CRITICAL"
}

export type TaskId = string;
export type UserId = string;

  status: TaskStatus;
  priority: Priority;
  assignedTo: UserId | null;
  tags: string[];               // typed array
  createdAt: Date;

}

export interface TaskBoard {
  id: string;
  name: string;
  tasks: Task[];                // array of Task objects
  members: UserId[];            // array of user IDs
  createdAt: Date;
}`)}

  <div class="chapter-complete">

    <span class="chapter-complete-text">You can now model collections with confidence using typed arrays, tuples for positional data, and enums for domain constants. Next: object types and interfaces — the heart of TypeScript's structural type system.</span>
  </div>
</div>`;

  <div class="chapter-badge">◻ Chapter 05 · Core Types</div>
  <h1 class="chapter-title">Object Types <span>&amp; Interfaces</span></h1>
  <div style="margin-bottom:12px">${tag('beginner')}</div>
  <p class="chapter-intro">
    Objects are the most common data structure in JavaScript applications. TypeScript lets
    you describe the exact <em>shape</em> of an object — which properties it has, what types
    they hold, and whether they are optional or required. This chapter covers object type literals,
    interfaces, and the powerful concept of structural typing.
  </p>

  <h2>Object Type Literals</h2>
  <p>
    The simplest way to type an object is inline, directly where you use it. You write
    a type that mirrors the object's structure using <code>{}</code> syntax:
  </p>

  ${codeBlock('typescript', '', `// Inline object type — describes the exact shape
function printTask(task: { id: number; title: string; completed: boolean }): void {
  console.log(\`[\${task.id}] \${task.title} — \${task.completed ? "Done" : "Pending"}\`);
}

printTask({ id: 1, title: "Fix bug", completed: false }); // ✅
printTask({ id: 1, title: "Fix bug" });                   // ❌ Missing 'completed'

// TypeScript uses STRUCTURAL typing: if an object has the required properties,
// it's considered compatible — even if it has extra ones.
const richTask = { id: 1, title: "Fix bug", completed: false, priority: "high" };
printTask(richTask); // ✅ Extra property is fine when passing a variable

// But object literals are checked MORE strictly (excess property checks):
printTask({ id: 1, title: "Fix bug", completed: false, priority: "high" });
// ❌ Object literal may only specify known properties — 'priority' is unexpected`)}

  ${callout('info', 'Structural Typing', 'TypeScript uses <strong>structural typing</strong> (also called duck typing): if it walks like a duck and quacks like a duck, it is a duck. A value is compatible with a type if it has all the required properties, regardless of how it was declared. This is fundamentally different from nominal typing (C#, Java) where you must explicitly state the type.')}

  <h2>Interfaces</h2>
  <p>
    When you use an object shape in more than one place, give it a name using
    <code>interface</code>. Interfaces are reusable, extendable contracts that describe
    the shape of any object:
  </p>

  ${codeBlock('typescript', '', `interface User {
  id: string;
  email: string;
  name: string;
  role: "admin" | "member" | "viewer"; // literal union — see ch07
  createdAt: Date;
}

// Use it as a type annotation:
const user: User = {
  id: "user_1",
  email: "alice@example.com",
  name: "Alice Chen",
  role: "admin",
  createdAt: new Date()
};

// TypeScript checks every usage:
function getUserEmail(user: User): string {
  return user.email;  // ✅ TypeScript knows User has an 'email' property
}

// Missing a required property:
const bad: User = {
  id: "user_2",
  email: "bob@example.com",
  // ❌ Missing: name, role, createdAt
};`)}

  <h2>Optional and Readonly Properties</h2>
  <p>
    Not every property on an object is required. Use <code>?</code> to mark a property
    as optional (can be present or absent). Use <code>readonly</code> to prevent a
    property from being reassigned after initialization.
  </p>

  ${codeBlock('typescript', '', `interface Task {
  readonly id: string;         // Can never be changed after creation
  title: string;               // Required
  description?: string;        // Optional — may be string or undefined
  dueDate?: Date;              // Optional Date
  readonly createdAt: Date;    // Immutable timestamp
}

const task: Task = {
  id: "task_001",
  title: "Write unit tests",
  createdAt: new Date()
  // description and dueDate are omitted — fine because they're optional
};

// readonly prevents reassignment:
task.id = "task_002"; // ❌ Cannot assign to 'id' because it is a read-only property
task.title = "Updated title"; // ✅ Not readonly

// Optional property access — TypeScript forces you to check:
function showDueDate(task: Task): string {
  // Without narrowing, description is string | undefined
  if (task.description) {
    return task.description; // TypeScript narrows to string here
  }
  return "No description";
}

// Nullish coalescing for clean defaults:
const desc = task.description ?? "No description provided";
//    ^ type: string — ?? provides a fallback for undefined/null`)}

  <h2>Interface Extension</h2>
  <p>
    Interfaces can extend other interfaces, inheriting all their properties and adding new ones.
    This is perfect for modeling inheritance hierarchies without duplicating property definitions.
  </p>

  ${codeBlock('typescript', '', `interface BaseEntity {
  readonly id: string;
  readonly createdAt: Date;
  updatedAt: Date;
}

// User extends BaseEntity — gets id, createdAt, updatedAt for free
interface User extends BaseEntity {
  email: string;
  name: string;
  role: "admin" | "member" | "viewer";
}

// Task also extends BaseEntity
interface Task extends BaseEntity {
  title: string;
  description?: string;
  status: "todo" | "in_progress" | "done";
  assignedTo?: string; // User ID
}

// A task with all BaseEntity fields:
const task: Task = {
  id: "task_001",
  createdAt: new Date(),
  updatedAt: new Date(),
  title: "Write tests",
  status: "todo"
};

// Extending multiple interfaces:
interface AdminUser extends User {
  permissions: string[];
  lastLogin: Date;
}

// Multi-extend:
interface AuditedTask extends Task, BaseEntity {
  // BaseEntity already in Task, but allowed — TypeScript merges them
  auditLog: string[];
}`)}

  <h2>Index Signatures</h2>
  <p>
    Sometimes you want an object with dynamic keys — a dictionary or map structure.
    Index signatures let you type objects where the keys are not known in advance.
  </p>

  ${codeBlock('typescript', '', `// An object with any number of string keys, all mapping to number
interface ScoreMap {
  [userId: string]: number;
}

const scores: ScoreMap = {
  "user_1": 95,
  "user_2": 87,
  "user_3": 100
};

// Access any key — type is number
const userScore: number = scores["user_1"];

// Add new keys dynamically:
scores["user_4"] = 72; // ✅

// More useful: metadata objects
interface TaskMetadata {
  [key: string]: string | number | boolean; // values can be multiple types
  title: string;   // Specific property still valid alongside index signature
                   // (must be compatible with the index signature type)
}

// Record<K, V> — a cleaner alternative to index signatures
type TaskTagMap = Record<string, string[]>; // key: tag name, value: task IDs

const tagMap: TaskTagMap = {
  "bug": ["task_1", "task_3"],
  "feature": ["task_2", "task_5"],
  "docs": ["task_4"]
};`)}

  <h2>Interface vs Type Alias — When to Use Which</h2>
  <p>
    Both <code>interface</code> and <code>type</code> can describe object shapes. In practice,
    the differences are subtle, but there are some guiding rules:
  </p>

  <div class="table-wrap">
  <table>
    <thead><tr><th>Feature</th><th>interface</th><th>type alias</th></tr></thead>
    <tbody>
      <tr><td>Object shapes</td><td>✅ Primary use case</td><td>✅ Equivalent</td></tr>

  type: "error";                      // discriminant

  code: number;

    TypeScript cannot always figure out from conditions alone what type a value is.

  id: string;
  title: string;
  status: string;
}

interface User {
  id: string;
  email: string;
  name: string;
}

// Type predicate: "if this returns true, item is a Task"
function isTask(item: unknown): item is Task {
  return (
    typeof item === "object" &&
    item !== null &&
    "title" in item &&
    "status" in item
  );
}

function isUser(item: unknown): item is User {
  return (
    typeof item === "object" &&
    item !== null &&
    "email" in item &&
    "name" in item
  );
}

function process(data: unknown): void {
  if (isTask(data)) {
    console.log(data.title);  // ✅ TypeScript knows data is Task
    console.log(data.email);  // ❌ 'email' doesn't exist on Task
  } else if (isUser(data)) {
    console.log(data.email);  // ✅ TypeScript knows data is User
  }

function parseApiResponse(json: unknown): Task[] {

  return json.filter(isTask); // Returns Task[] — TypeScript trusts the predicate

  </p>

function assert(condition: unknown, message: string): asserts condition {
  if (!condition) throw new Error(message);
}

// asserts value is T — narrow to specific type
function assertIsString(val: unknown): asserts val is string {
  if (typeof val !== "string") {
    throw new TypeError(\`Expected string, got \${typeof val}\`);
  }
}

function assertIsTask(val: unknown): asserts val is Task {
  if (!isTask(val)) throw new TypeError("Not a valid Task");
}

// Usage:
function processTask(data: unknown): void {
  assertIsTask(data);
  // After assertion, TypeScript knows data is Task
  console.log(data.title);    // ✅ No union checking needed
  console.log(data.status);   // ✅
}

async function getTask(req: Request): Promise<Response> {

  <h2>Exhaustive Checks with never</h2>
  <p>
    In a switch or if-else chain over a union type, after handling every possible case,
    the remaining type should be <code>never</code>. You can use this to write compile-time
    exhaustiveness checks — TypeScript will error if you add a new union variant and forget
    to handle it:
  </p>

  ${codeBlock('typescript', '', `type TaskStatus = "todo" | "in_progress" | "done" | "archived";

function getStatusLabel(status: TaskStatus): string {
  switch (status) {
    case "todo":        return "To Do";
    case "in_progress": return "In Progress";
    case "done":        return "Done";
    case "archived":    return "Archived";
    default: {
      // If all cases are handled, status is 'never' here
      // Assigning to never is always an error — catches missing cases
      const _exhaustive: never = status;
      throw new Error(\`Unhandled status: \${_exhaustive}\`);
    }
  }
}

// Now if someone adds "cancelled" to TaskStatus without updating this switch,
// TypeScript immediately reports an error at the 'default' case.`)}

  push(item: T): void {
    this.items.push(item);
  }

  pop(): T | undefined {
    return this.items.pop();
  }

  peek(): T | undefined {
    return this.items[this.items.length - 1];

  get size(): number {
    return this.items.length;

    return this.items.length === 0;

numberStack.push(2);
numberStack.push("three"); // ❌ string not assignable to number

const top = taskStack.peek(); // type: { id: string; title: string } | undefined

// Generic class implementing a generic interface:
class InMemoryRepository<T extends { id: string }> implements Repository<T> {
  protected store: Map<string, T> = new Map();

  async findById(id: string): Promise<T | null> {
    return this.store.get(id) ?? null;
  }

  async findAll(): Promise<T[]> {
    return Array.from(this.store.values());
  }

  async create(data: Omit<T, "id" | "createdAt" | "updatedAt">): Promise<T> {
    const entity = {
      ...data,
      id: \`id_\${Date.now()}\`,
      createdAt: new Date(),
      updatedAt: new Date()
    } as T;
    this.store.set(entity.id, entity);
    return entity;

    if (!existing) return null;
    const updated = { ...existing, ...data, updatedAt: new Date() };
    this.store.set(id, updated);
    return updated;
  }

  async delete(id: string): Promise<boolean> {
    return this.store.delete(id);
  }

class NotFoundError extends AppError {
  constructor(resource: string, id: string) {

  constructor(public readonly fields: Record<string, string>) {

  }

  if (err instanceof ValidationError) {
    return { message: \`Validation: \${JSON.stringify(err.fields)}\`, status: 422 };

export class Repository<T extends BaseEntity> {
  private store: Map<string, T> = new Map();

  findById(id: string): T | null {
    return this.store.get(id) ?? null;
  }

  findAll(): T[] {
    return Array.from(this.store.values());
  }

  findWhere(predicate: (item: T) => boolean): T[] {
    return this.findAll().filter(predicate);
  }

  save(item: T): T {
    this.store.set(item.id, item);
    return item;
  }

  update(id: string, updates: Partial<T>): T | null {
    const existing = this.findById(id);
    if (!existing) return null;
    const updated = { ...existing, ...updates, updatedAt: new Date() };
    this.store.set(id, updated);
    return updated;
  }

  delete(id: string): boolean {

  <h2>Mapped Types — Transform Every Property</h2>
  <p>
    A mapped type creates a new type by iterating over the keys of an existing type and
    transforming each property. This is how TypeScript's built-in utility types like
    <code>Partial</code> and <code>Readonly</code> are implemented:
  </p>

  ${codeBlock('typescript', '', `// How Partial<T> is actually implemented:
type MyPartial<T> = {
  [K in keyof T]?: T[K];  // For each key K in T, make it optional
};

// How Readonly<T> is implemented:
type MyReadonly<T> = {
  readonly [K in keyof T]: T[K]; // For each key, add readonly
};

// A mapped type that adds null to every value:
type Nullable<T> = {
  [K in keyof T]: T[K] | null;
};

interface Task {
  id: string;
  title: string;
  priority: "low" | "high";
}

type NullableTask = Nullable<Task>;
// { id: string | null; title: string | null; priority: "low" | "high" | null }

// Removing modifiers:
type Mutable<T> = {
  -readonly [K in keyof T]: T[K]; // '-' removes readonly
};

type Required2<T> = {
  [K in keyof T]-?: T[K]; // '-?' removes optional
};

// Key remapping — transform the key names (TypeScript 4.1+):
type Getters<T> = {
  [K in keyof T as \`get\${Capitalize<string & K>}\`]: () => T[K];
};

type TaskGetters = Getters<Task>;

  [K in keyof T as T[K] extends string ? K : never]: T[K];
};

  <h2>Conditional Types — Type-Level If-Else</h2>
  <p>
    Conditional types are the most powerful feature in TypeScript's type system.
    They let you express "if this type extends that type, use this type, otherwise use that type":
  </p>

  ${codeBlock('typescript', '', `// Basic conditional type: T extends U ? TypeIfTrue : TypeIfFalse
type IsString<T> = T extends string ? true : false;

type A = IsString<string>;    // true
type B = IsString<number>;    // false
type C = IsString<"hello">;   // true (string literal extends string)

// Distributing over union types:
type Flatten<T> = T extends Array<infer Item> ? Item : T;
// If T is an array, return the element type; otherwise return T

type NumArr = Flatten<number[]>;   // number
type StrArr = Flatten<string[]>;   // string
type NotArr = Flatten<string>;     // string (not an array, returned as-is)

// Practical: Unwrap a Promise:
type Awaited2<T> = T extends Promise<infer R> ? Awaited2<R> : T;
// Recursively unwraps nested Promises

type A2 = Awaited2<Promise<string>>;            // string
type B2 = Awaited2<Promise<Promise<number>>>;   // number

// Filter a union type:
type NonNullable2<T> = T extends null | undefined ? never : T;

type MaybeString = string | null | undefined;
type DefiniteString = NonNullable2<MaybeString>; // string`)}

  <h2>The infer Keyword — Extract Types from Other Types</h2>
  <p>
    The <code>infer</code> keyword works inside conditional types to <strong>extract</strong>
    a type from another type. It's how you "ask" TypeScript: "if this type matches this
    pattern, what is the type at this position?"
  </p>

  ${codeBlock('typescript', '', `// Extract the return type of any function:
type MyReturnType<F> = F extends (...args: any[]) => infer R ? R : never;

type R1 = MyReturnType<() => string>;          // string
type R2 = MyReturnType<(n: number) => boolean>; // boolean
type R3 = MyReturnType<string>;                 // never (not a function)

// Extract parameter types:
type FirstParam<F> = F extends (first: infer P, ...rest: any[]) => any ? P : never;

type P1 = FirstParam<(x: string) => void>;    // string
type P2 = FirstParam<(n: number) => boolean>; // number

// Extract the element type of a Promise:
type PromiseType<T> = T extends Promise<infer U> ? U : T;

// Extract the element type of an array:
type ArrayElement<T> = T extends (infer E)[] ? E : T;
type TaskType = ArrayElement<Task[]>; // Task

// Deep: extract nested object properties with infer
type DeepGet<T, K extends string> =
  K extends \`\${infer Head}.\${infer Tail}\`
    ? Head extends keyof T
      ? DeepGet<T[Head], Tail>
      : never
    : K extends keyof T
      ? T[K]
      : never;

interface Config { server: { port: number; host: string }; db: { url: string } }

type Port = DeepGet<Config, "server.port">;  // number
type Host = DeepGet<Config, "server.host">;  // string`)}

// Define all possible events and their payloads
interface TaskBoardEvents {
  "task:created":  { task: Task; userId: string };
  "task:updated":  { task: Task; userId: string; changes: Partial<Task> };
  "task:deleted":  { taskId: string; userId: string };
  "user:joined":   { userId: string; boardId: string };
  "user:left":     { userId: string; boardId: string };
}

type EventName = keyof TaskBoardEvents;
type EventPayload<E extends EventName> = TaskBoardEvents[E];

type Handler<E extends EventName> = (payload: EventPayload<E>) => void | Promise<void>;

interface Task { id: string; title: string; status: string; }
interface User { id: string; name: string; }

class TypedEventBus {
  private handlers = new Map<EventName, Handler<any>[]>();

  // Type-safe subscribe — handler receives the correct payload type
  on<E extends EventName>(event: E, handler: Handler<E>): () => void {
    const existing = this.handlers.get(event) ?? [];
    this.handlers.set(event, [...existing, handler]);

    // Return unsubscribe function
    return () => {
      const handlers = this.handlers.get(event) ?? [];
      this.handlers.set(event, handlers.filter(h => h !== handler));
    };
  }

  // Type-safe emit — payload must match the event's type
  async emit<E extends EventName>(event: E, payload: EventPayload<E>): Promise<void> {
    const handlers = this.handlers.get(event) ?? [];
    await Promise.all(handlers.map(h => h(payload)));
  }
}

const bus = new TypedEventBus();

// TypeScript ensures the handler receives the correct payload:
bus.on("task:created", ({ task, userId }) => {
  // task is Task, userId is string — TypeScript knows!
  console.log(\`User \${userId} created task: \${task.title}\`);
});

// TypeScript catches wrong event payloads:
bus.emit("task:created", {
  task: { id: "1", title: "Fix bug", status: "todo" },
  userId: "user_1"
}); // ✅

bus.emit("task:created", { userId: "user_1" }); // ❌ Missing 'task' field`)}

// You could accidentally pass a userId where a taskId is expected

// Solution: Branded types — nominal typing on top of structural typing
type Brand<T, B extends string> = T & { readonly __brand: B };

type TaskId = Brand<string, "TaskId">;
type UserId = Brand<string, "UserId">;
type BoardId = Brand<string, "BoardId">;

// Factory functions to create branded values:
function taskId(id: string): TaskId {
  return id as TaskId;
}
function userId(id: string): UserId {
  return id as UserId;

assignTask("task_001", "user_001"); // ❌ Raw strings don't satisfy branded type`)}

// Approximate reading time from rendered HTML
function readingTime(htmlStr) {
  const text = htmlStr.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ');
  const words = text.trim().split(' ').length;
  const mins = Math.max(1, Math.ceil(words / 220));
  return mins;
}

function buildChapter(chapter) {

  const next = idx < VISIBLE.length - 1 ? VISIBLE[idx + 1] : null;
  const isDone = completedChapters.has(chapter.id);
  const chapterHtml = chapter.content();
  const mins = readingTime(chapterHtml);

  return `

    <div class="nav-group">
      <span class="nav-group-label">${group}</span>
      ${chapters.map(ch => {
        const isDone = completedChapters.has(ch.id);
        return `<div class="nav-item ${currentChapterId === ch.id ? 'active' : ''} ${isDone ? 'completed' : ''}"
          id="nav-${ch.id}" onclick="navigate('${ch.id}')">
          <span class="nav-num">${String(ch.index).padStart(2,'0')}</span>
          <span>${ch.title}</span>
          <span class="nav-check"></span>
        </div>`;
      }).join('')}
    </div>
  `).join('');
}

function syncNav() {
  // Update active + completed state on all nav items
  document.querySelectorAll('.nav-item').forEach(el => {
    const id = el.id.replace('nav-', '');
    el.classList.toggle('active', id === currentChapterId);
    el.classList.toggle('completed', completedChapters.has(id));
  });
}

// ================================================================
//  COPY CODE
// ================================================================
function copyCode(blockId) {
  const block = document.getElementById(blockId);
  const code = block.querySelector('pre code').textContent;
  navigator.clipboard.writeText(code).then(() => {
    const btn = block.querySelector('.copy-btn');
    btn.textContent = 'copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'copy'; btn.classList.remove('copied'); }, 2000);
  });
}

// ================================================================
//  TABLE OF CONTENTS MODAL
// ================================================================
function openToc() {
  buildToc();
  document.getElementById('toc-overlay').classList.add('open');
}

function closeToc() {
  document.getElementById('toc-overlay').classList.remove('open');
}

function buildToc() {
  const body = document.getElementById('toc-body');
  body.innerHTML = VISIBLE.map((ch, i) => {
    const isDone = completedChapters.has(ch.id);
    return `<div class="toc-item ${isDone ? 'done-item' : ''}" onclick="navigate('${ch.id}');closeToc()">
      <span class="toc-num">CH${String(i+1).padStart(2,'0')}</span>
      <div class="toc-info">
        <div class="toc-name">${ch.title}</div>
        <div class="toc-group">${ch.group} · ${ch.level}</div>
      </div>
      ${isDone ? '<span class="toc-done-badge">✓</span>' : ''}
    </div>`;
  }).join('');
}

document.getElementById('toc-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('toc-overlay')) closeToc();
});

// ================================================================
//  FUSE.JS SEARCH
// ================================================================
const searchIndex = VISIBLE.map(ch => ({
  id: ch.id,
  title: ch.title,
  group: ch.group,
  level: ch.level,
  snippet: ch.snippet,
  // Strip HTML and code for searchable text
  body: ch.content ? ch.content().replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').slice(0, 2000) : ''
}));

const fuse = new Fuse(searchIndex, {
  keys: [
    { name: 'title',   weight: 0.4 },
    { name: 'snippet', weight: 0.3 },
    { name: 'body',    weight: 0.2 },
    { name: 'group',   weight: 0.1 }
  ],
  includeMatches: true,
  includeScore: true,
  threshold: 0.45,
  minMatchCharLength: 2
});

let searchSelectedIndex = -1;
let searchResults = [];

function openSearch() {
  document.getElementById('search-overlay').classList.add('open');
  setTimeout(() => document.getElementById('modal-search-input').focus(), 50);
  searchSelectedIndex = -1;
}

function closeSearch() {
  document.getElementById('search-overlay').classList.remove('open');
  document.getElementById('modal-search-input').value = '';
  renderSearchResults([]);
}

function highlightMatch(text, match) {
  if (!match) return escapeHtml(text);
  let result = '';
  let lastIdx = 0;
  const indices = match.indices || [];
  for (const [start, end] of indices) {
    result += escapeHtml(text.slice(lastIdx, start));
    result += `<span class="highlight-match">${escapeHtml(text.slice(start, end + 1))}</span>`;
    lastIdx = end + 1;
  }
  result += escapeHtml(text.slice(lastIdx));
  return result;
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderSearchResults(results) {
  const container = document.getElementById('search-results');
  searchResults = results;

  if (results.length === 0) {
    const q = document.getElementById('modal-search-input').value;
    container.innerHTML = `<div class="search-empty">${q ? 'No results found — try a different keyword' : 'Type to search across all chapters…'}</div>`;
    return;
  }

  container.innerHTML = results.map((r, i) => {
    const item = r.item;
    const titleMatch = r.matches?.find(m => m.key === 'title');
    const snippetMatch = r.matches?.find(m => m.key === 'snippet') || r.matches?.find(m => m.key === 'body');
    const isDone = completedChapters.has(item.id);
    const chNum = searchIndex.findIndex(x => x.id === item.id) + 1;

    return `<div class="search-result-item ${i === searchSelectedIndex ? 'selected' : ''}"
      onclick="goToSearchResult(${i})">
      <span class="sri-num" style="${isDone ? 'background:rgba(52,211,153,0.15);color:var(--green)' : ''}">CH${String(chNum).padStart(2,'0')}</span>
      <div class="sri-body">
        <div class="sri-title">${highlightMatch(item.title, titleMatch)}${isDone ? ' <span style="color:var(--green);font-size:11px">✓</span>' : ''}</div>
        <div class="sri-snippet">${highlightMatch(item.snippet, snippetMatch)}</div>
      </div>
      <span style="font-family:var(--font-mono);font-size:10px;color:var(--text3);margin-left:8px">${item.level}</span>
    </div>`;
  }).join('');
}

function goToSearchResult(index) {
  const result = searchResults[index];
  if (!result) return;
  navigate(result.item.id);
  closeSearch();
}

document.getElementById('modal-search-input').addEventListener('input', (e) => {
  const q = e.target.value.trim();
  if (!q) { renderSearchResults([]); return; }
  const results = fuse.search(q).slice(0, 8);
  searchSelectedIndex = -1;
  renderSearchResults(results);
});

document.getElementById('modal-search-input').addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    searchSelectedIndex = Math.min(searchSelectedIndex + 1, searchResults.length - 1);
    renderSearchResults(searchResults);
    // Scroll selected into view
    const items = document.querySelectorAll('.search-result-item');
    items[searchSelectedIndex]?.scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    searchSelectedIndex = Math.max(searchSelectedIndex - 1, -1);
    renderSearchResults(searchResults);
  } else if (e.key === 'Enter' && searchSelectedIndex >= 0) {
    goToSearchResult(searchSelectedIndex);
  } else if (e.key === 'Escape') {
    closeSearch();
  }
});

document.getElementById('modal-close').addEventListener('click', closeSearch);

document.getElementById('search-overlay').addEventListener('click', (e) => {
  if (e.target === document.getElementById('search-overlay')) closeSearch();
});

document.getElementById('search-input').addEventListener('click', openSearch);

// ================================================================
//  GLOBAL KEYBOARD SHORTCUTS
// ================================================================
document.addEventListener('keydown', (e) => {
  const focused = document.activeElement;
  const isTyping = focused.tagName === 'INPUT' || focused.tagName === 'TEXTAREA';

  // Search: / or Cmd/Ctrl+K
  if (!isTyping && (e.key === '/' || (e.key === 'k' && (e.ctrlKey || e.metaKey)))) {
    e.preventDefault();
    openSearch();
    return;
  }

  // TOC: T
  if (!isTyping && e.key === 't') {
    openToc();
    return;
  }

  // Close modals: Escape
  if (e.key === 'Escape') {
    closeSearch();
    closeToc();
    return;
  }

  // Chapter navigation: Arrow keys (when not typing)
  if (!isTyping && currentChapterId !== 'home') {
    const idx = getChapterIndex(currentChapterId);
    if (e.key === 'ArrowRight' && idx < VISIBLE.length - 1) {
      navigate(VISIBLE[idx + 1].id);
    } else if (e.key === 'ArrowLeft') {
      if (idx > 0) navigate(VISIBLE[idx - 1].id);
      else showHome();
    }
  }

  // Home: H
  if (!isTyping && e.key === 'h') {
    showHome();
  }
});

// ================================================================
//  MOBILE NAV
// ================================================================
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebar-overlay');
  sidebar.classList.toggle('open');
  overlay.classList.toggle('open');
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('open');
}

document.getElementById('sidebar-overlay').addEventListener('click', closeSidebar);

// ================================================================
//  SCROLL TO TOP BUTTON
// ================================================================
window.addEventListener('scroll', () => {
  const btn = document.getElementById('scroll-top');
  if (window.scrollY > 400) btn.classList.add('visible');
  else btn.classList.remove('visible');
});

// ================================================================
//  INIT
// ================================================================
buildNav();
updateProgress();
showHome();

</script>
</body>
</html>
