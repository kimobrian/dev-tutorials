<template id="tpl-file-uploads"><div class="chapter-header"><div class="ch-eyebrow">Chapter 14 · Advanced Features</div><h1 class="ch-title">File Uploads</h1><p class="ch-subtitle">File uploads require more careful handling than any other input — wrong file types, missing size limits, or insecure storage can create serious vulnerabilities. Let's do it properly.</p></div>

<h2>How Multipart Uploads Work</h2>
<p>When a browser or client uploads a file, it uses <code>multipart/form-data</code> encoding — a special HTTP body format that can carry both binary file data and regular form fields in the same request. Node's built-in body parsers don't handle this. That's exactly what <strong>Multer</strong> does: it parses multipart requests, handles temporary storage, and makes files available on <code>req.file</code> (single) or <code>req.files</code> (multiple) alongside any non-file fields on <code>req.body</code>.</p>

<div class="callout warning"><div class="callout-title">⚠️ Disable JSON body parser for upload routes</div><p>Applying both <code>express.json()</code> and <code>multer</code> to the same route is fine — Multer detects the Content-Type and handles multipart; JSON middleware ignores it. But never attempt to send JSON body AND a file in the same request — they use incompatible encodings.</p></div>

<h2>Setting Up Multer</h2>

<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/middleware/upload.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> multer = <span class="fn">require</span>(<span class="str">'multer'</span>);
<span class="kw">const</span> path   = <span class="fn">require</span>(<span class="str">'path'</span>);
<span class="kw">const</span> fs     = <span class="fn">require</span>(<span class="str">'fs'</span>);
<span class="kw">const</span> { v4: uuidv4 } = <span class="fn">require</span>(<span class="str">'uuid'</span>);
<span class="kw">const</span> config = <span class="fn">require</span>(<span class="str">'../config'</span>);

<span class="cmt">// ─── Storage Engine ──────────────────────────────────────</span>
<span class="kw">const</span> storage = multer.<span class="fn">diskStorage</span>({
  destination: (req, file, cb) => {
    <span class="cmt">// Store files in a per-user directory to avoid name collisions</span>
    <span class="kw">const</span> dir = path.<span class="fn">join</span>(config.upload.dir, req.<span class="prop">user</span>.<span class="prop">id</span>);

    <span class="cmt">// Create the directory if it doesn't exist yet</span>
    fs.<span class="fn">mkdirSync</span>(dir, { recursive: <span class="kw">true</span> });
    cb(<span class="kw">null</span>, dir);
  },
  filename: (req, file, cb) => {
    <span class="cmt">// UUID + original extension: prevents path traversal and collisions</span>
    <span class="cmt">// NEVER trust the original filename from the client — it can contain</span>
    <span class="cmt">// characters like ../ that could escape your upload directory</span>
    <span class="kw">const</span> ext = path.<span class="fn">extname</span>(file.<span class="prop">originalname</span>).<span class="fn">toLowerCase</span>();
    cb(<span class="kw">null</span>, <span class="str">`${uuidv4()}${ext}`</span>);
  },
});

<span class="cmt">// ─── MIME Type Allowlist ─────────────────────────────────</span>
<span class="cmt">// Restrict file types at the MIME level — don't rely on extension alone</span>
<span class="kw">const</span> ALLOWED_MIME_TYPES = <span class="kw">new</span> <span class="cls">Set</span>([
  <span class="str">'image/jpeg'</span>, <span class="str">'image/png'</span>, <span class="str">'image/gif'</span>, <span class="str">'image/webp'</span>,
  <span class="str">'application/pdf'</span>,
  <span class="str">'text/plain'</span>,
  <span class="str">'application/vnd.openxmlformats-officedocument.wordprocessingml.document'</span>,   <span class="cmt">// .docx</span>
  <span class="str">'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'</span>,         <span class="cmt">// .xlsx</span>
]);

<span class="kw">const</span> <span class="fn">fileFilter</span> = (req, file, cb) => {
  <span class="kw">if</span> (ALLOWED_MIME_TYPES.<span class="fn">has</span>(file.<span class="prop">mimetype</span>)) {
    cb(<span class="kw">null</span>, <span class="kw">true</span>);   <span class="cmt">// accept</span>
  } <span class="kw">else</span> {
    <span class="cmt">// Pass error to cb — Multer surfaces this in req</span>
    cb(<span class="kw">new</span> <span class="cls">Error</span>(<span class="str">`File type '${file.mimetype}' is not allowed`</span>), <span class="kw">false</span>);
  }
};

<span class="cmt">// ─── Multer Instance ─────────────────────────────────────</span>
<span class="kw">const</span> upload = <span class="fn">multer</span>({
  storage,
  fileFilter,
  limits: {
    fileSize: config.upload.maxSize,  <span class="cmt">// default 5MB (set in .env)</span>
    files:    <span class="num">5</span>,                      <span class="cmt">// max 5 files per request</span>
    fields:   <span class="num">10</span>,                     <span class="cmt">// max 10 non-file form fields</span>
  },
});

module.exports = upload;</code></pre></div>

<h2>Handling Multer Errors</h2>
<p>Multer throws specific error types when limits are exceeded or file types are rejected. These won't be caught by your global error handler automatically — you need to handle them explicitly:</p>

<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/middleware/handleUploadError.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> multer = <span class="fn">require</span>(<span class="str">'multer'</span>);

<span class="cmt">/**
 * Wrap a multer middleware and convert its errors into standard API responses.
 * Usage: router.post('/', handleUpload(upload.single('file')), controller)
 */</span>
<span class="kw">const</span> <span class="fn">handleUpload</span> = (multerMiddleware) => (req, res, next) => {
  <span class="fn">multerMiddleware</span>(req, res, (err) => {
    <span class="kw">if</span> (!err) <span class="kw">return</span> <span class="fn">next</span>();   <span class="cmt">// no error → continue</span>

    <span class="kw">if</span> (err <span class="kw">instanceof</span> multer.<span class="cls">MulterError</span>) {
      <span class="cmt">// Multer-specific errors (size limit, file count, etc.)</span>
      <span class="kw">const</span> messages = {
        LIMIT_FILE_SIZE:      <span class="str">'File is too large. Maximum size is 5MB.'</span>,
        LIMIT_FILE_COUNT:     <span class="str">'Too many files. Maximum is 5 per upload.'</span>,
        LIMIT_UNEXPECTED_FILE: <span class="str">'Unexpected field name in upload.'</span>,
      };
      <span class="kw">return</span> res.<span class="fn">status</span>(<span class="num">400</span>).<span class="fn">json</span>({
        success: <span class="kw">false</span>,
        error:   messages[err.<span class="prop">code</span>] || <span class="str">`Upload error: ${err.message}`</span>,
      });
    }

    <span class="cmt">// Our custom fileFilter errors</span>
    <span class="kw">if</span> (err.<span class="prop">message</span>.<span class="fn">includes</span>(<span class="str">'not allowed'</span>)) {
      <span class="kw">return</span> res.<span class="fn">status</span>(<span class="num">400</span>).<span class="fn">json</span>({ success: <span class="kw">false</span>, error: err.<span class="prop">message</span> });
    }

    <span class="fn">next</span>(err);   <span class="cmt">// unexpected error → global error handler</span>
  });
};

module.exports = <span class="fn">handleUpload</span>;</code></pre></div>

<h2>The Attachment Model</h2>

<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/models/Attachment.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> { <span class="cls">DataTypes</span>, <span class="cls">Model</span> } = <span class="fn">require</span>(<span class="str">'sequelize'</span>);

module.exports = (sequelize) => {
  <span class="kw">class</span> <span class="cls">Attachment</span> <span class="kw">extends</span> <span class="cls">Model</span> {}

  <span class="cls">Attachment</span>.<span class="fn">init</span>({
    id:           { type: <span class="cls">DataTypes</span>.<span class="cls">UUID</span>, defaultValue: <span class="cls">DataTypes</span>.<span class="cls">UUIDV4</span>, primaryKey: <span class="kw">true</span> },
    taskId:       { type: <span class="cls">DataTypes</span>.<span class="cls">UUID</span>, allowNull: <span class="kw">false</span> },
    userId:       { type: <span class="cls">DataTypes</span>.<span class="cls">UUID</span>, allowNull: <span class="kw">false</span> },
    filename:     { type: <span class="cls">DataTypes</span>.<span class="cls">STRING</span>, allowNull: <span class="kw">false</span> },     <span class="cmt">// UUID name on disk</span>
    originalName: { type: <span class="cls">DataTypes</span>.<span class="cls">STRING</span>, allowNull: <span class="kw">false</span> },     <span class="cmt">// what the user uploaded</span>
    mimetype:     { type: <span class="cls">DataTypes</span>.<span class="cls">STRING</span>, allowNull: <span class="kw">false</span> },
    size:         { type: <span class="cls">DataTypes</span>.<span class="cls">BIGINT</span>, allowNull: <span class="kw">false</span> },     <span class="cmt">// bytes</span>
    path:         { type: <span class="cls">DataTypes</span>.<span class="cls">TEXT</span>,   allowNull: <span class="kw">false</span> },     <span class="cmt">// absolute disk path</span>
  }, {
    sequelize,
    modelName: <span class="str">'Attachment'</span>,
    tableName: <span class="str">'attachments'</span>,
    indexes:   [{ fields: [<span class="str">'taskId'</span>] }, { fields: [<span class="str">'userId'</span>] }],
  });

  <span class="kw">return</span> <span class="cls">Attachment</span>;
};</code></pre></div>

<h2>Attachment Controller</h2>

<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/controllers/attachmentController.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> path = <span class="fn">require</span>(<span class="str">'path'</span>);
<span class="kw">const</span> fs   = <span class="fn">require</span>(<span class="str">'fs/promises'</span>);
<span class="kw">const</span> { <span class="cls">Attachment</span> } = <span class="fn">require</span>(<span class="str">'../models'</span>);

<span class="cmt">// POST /api/tasks/:id/attachments</span>
<span class="kw">const</span> <span class="fn">uploadAttachment</span> = <span class="kw">async</span> (req, res, next) => {
  <span class="kw">try</span> {
    <span class="kw">if</span> (!req.<span class="prop">file</span>) {
      <span class="kw">return</span> res.<span class="fn">status</span>(<span class="num">400</span>).<span class="fn">json</span>({ error: <span class="str">'No file was provided'</span> });
    }

    <span class="kw">const</span> attachment = <span class="kw">await</span> <span class="cls">Attachment</span>.<span class="fn">create</span>({
      taskId:       req.<span class="prop">task</span>.<span class="prop">id</span>,
      userId:       req.<span class="prop">user</span>.<span class="prop">id</span>,
      filename:     req.<span class="prop">file</span>.<span class="prop">filename</span>,
      originalName: req.<span class="prop">file</span>.<span class="prop">originalname</span>,
      mimetype:     req.<span class="prop">file</span>.<span class="prop">mimetype</span>,
      size:         req.<span class="prop">file</span>.<span class="prop">size</span>,
      path:         req.<span class="prop">file</span>.<span class="prop">path</span>,
    });

    res.<span class="fn">status</span>(<span class="num">201</span>).<span class="fn">json</span>({ success: <span class="kw">true</span>, data: attachment });
  } <span class="kw">catch</span> (err) { <span class="fn">next</span>(err); }
};

<span class="cmt">// GET /api/tasks/:id/attachments/:attachmentId/download</span>
<span class="kw">const</span> <span class="fn">downloadAttachment</span> = <span class="kw">async</span> (req, res, next) => {
  <span class="kw">try</span> {
    <span class="kw">const</span> attachment = <span class="kw">await</span> <span class="cls">Attachment</span>.<span class="fn">findOne</span>({
      where: { id: req.<span class="prop">params</span>.<span class="prop">attachmentId</span>, taskId: req.<span class="prop">task</span>.<span class="prop">id</span> }
    });
    <span class="kw">if</span> (!attachment) <span class="kw">return</span> res.<span class="fn">status</span>(<span class="num">404</span>).<span class="fn">json</span>({ error: <span class="str">'Attachment not found'</span> });

    <span class="cmt">// Verify file still exists on disk before trying to send it</span>
    <span class="kw">try</span> { <span class="kw">await</span> fs.<span class="fn">access</span>(attachment.<span class="prop">path</span>); } <span class="kw">catch</span> {
      <span class="kw">return</span> res.<span class="fn">status</span>(<span class="num">410</span>).<span class="fn">json</span>({ error: <span class="str">'File no longer available'</span> });
    }

    <span class="cmt">// Set the original filename as the download name</span>
    res.<span class="fn">download</span>(attachment.<span class="prop">path</span>, attachment.<span class="prop">originalName</span>);
  } <span class="kw">catch</span> (err) { <span class="fn">next</span>(err); }
};

<span class="cmt">// DELETE /api/tasks/:id/attachments/:attachmentId</span>
<span class="kw">const</span> <span class="fn">deleteAttachment</span> = <span class="kw">async</span> (req, res, next) => {
  <span class="kw">try</span> {
    <span class="kw">const</span> attachment = <span class="kw">await</span> <span class="cls">Attachment</span>.<span class="fn">findOne</span>({
      where: { id: req.<span class="prop">params</span>.<span class="prop">attachmentId</span>, userId: req.<span class="prop">user</span>.<span class="prop">id</span> }
    });
    <span class="kw">if</span> (!attachment) <span class="kw">return</span> res.<span class="fn">status</span>(<span class="num">404</span>).<span class="fn">json</span>({ error: <span class="str">'Attachment not found'</span> });

    <span class="cmt">// Delete from disk BEFORE deleting the DB record</span>
    <span class="cmt">// If the DB delete fails, the file is still gone — acceptable.</span>
    <span class="cmt">// If you reversed the order and DB delete succeeded but file delete failed,</span>
    <span class="cmt">// you'd have a dangling DB record pointing to a non-existent file.</span>
    <span class="kw">await</span> fs.<span class="fn">unlink</span>(attachment.<span class="prop">path</span>).<span class="fn">catch</span>(() => {}); <span class="cmt">// ignore if already gone</span>
    <span class="kw">await</span> attachment.<span class="fn">destroy</span>();
    res.<span class="fn">status</span>(<span class="num">204</span>).<span class="fn">send</span>();
  } <span class="kw">catch</span> (err) { <span class="fn">next</span>(err); }
};

module.exports = { uploadAttachment, downloadAttachment, deleteAttachment };</code></pre></div>

<h2>Upload Routes</h2>

<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/routes/attachments.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> router = <span class="fn">require</span>(<span class="str">'express'</span>).<span class="fn">Router</span>({ mergeParams: <span class="kw">true</span> }); <span class="cmt">// inherit :id from parent</span>
<span class="kw">const</span> upload        = <span class="fn">require</span>(<span class="str">'../middleware/upload'</span>);
<span class="kw">const</span> handleUpload  = <span class="fn">require</span>(<span class="str">'../middleware/handleUploadError'</span>);
<span class="kw">const</span> authenticate  = <span class="fn">require</span>(<span class="str">'../middleware/authenticate'</span>);
<span class="kw">const</span> { taskOwner } = <span class="fn">require</span>(<span class="str">'../middleware/ownershipGuard'</span>);
<span class="kw">const</span> ctrl = <span class="fn">require</span>(<span class="str">'../controllers/attachmentController'</span>);

router.<span class="fn">use</span>(authenticate, taskOwner); <span class="cmt">// auth + ownership on all routes</span>

<span class="cmt">// 'file' must match the field name the client sends</span>
router.<span class="fn">post</span>(<span class="str">'/'</span>,                          <span class="fn">handleUpload</span>(upload.<span class="fn">single</span>(<span class="str">'file'</span>)),  ctrl.uploadAttachment);
router.<span class="fn">get</span>(<span class="str">'/:attachmentId/download'</span>,    ctrl.downloadAttachment);
router.<span class="fn">delete</span>(<span class="str">'/:attachmentId'</span>,          ctrl.deleteAttachment);

module.exports = router;

<span class="cmt">// Mount in app.js:</span>
<span class="cmt">// app.use('/api/tasks/:id/attachments', attachmentRoutes);</span></code></pre></div>

<h2>Testing With curl</h2>

<div class="code-block"><div class="code-header"><span class="code-lang">bash</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="cmt"># Upload a file (-F sends multipart/form-data)</span>
curl -X POST http://localhost:3000/api/tasks/TASK_ID/attachments \
  -H "Authorization: Bearer TOKEN" \
  -F "file=@/path/to/document.pdf"

<span class="cmt"># Download a file</span>
curl -O -J http://localhost:3000/api/tasks/TASK_ID/attachments/ATTACHMENT_ID/download \
  -H "Authorization: Bearer TOKEN"

<span class="cmt"># Delete an attachment</span>
curl -X DELETE http://localhost:3000/api/tasks/TASK_ID/attachments/ATTACHMENT_ID \
  -H "Authorization: Bearer TOKEN"</code></pre></div>

<h2>Usability Notes</h2>
<ul>
  <li><strong>Create upload directories on startup.</strong> Add a boot-time check that creates <code>./uploads</code> if it doesn't exist — Multer won't create it for you and will throw a cryptic ENOENT error if it's missing.</li>
  <li><strong>Store the original filename.</strong> Users expect to download a file called <code>Q3-report.pdf</code>, not <code>3f8a1b2c-uuid.pdf</code>. Store the original name in the DB and use it in <code>res.download(path, originalName)</code>.</li>
  <li><strong>Consider cloud storage for production.</strong> Local disk storage doesn't work with multiple servers or container deployments. In production, use <code>multer-s3</code> or <code>@google-cloud/storage</code> to upload directly to S3/GCS. The code structure stays the same — only the storage engine changes.</li>
  <li><strong>Set a Content-Security-Policy.</strong> If you serve uploaded files via your domain, add a strict CSP header to prevent any uploaded HTML/SVG files from executing JavaScript in the browser.</li>
  <li><strong>Virus scanning for sensitive apps.</strong> For enterprise or file-sharing apps, integrate ClamAV or a cloud scanning API on the upload path before persisting the file.</li>
</ul>

<div class="callout success"><div class="callout-title">✅ File Uploads Secured</div><p>You now have file uploads with type allowlisting, size limits, UUID-safe filenames, proper error handling, download and delete endpoints, and a clear path to cloud storage. Every edge case is handled explicitly.</p></div></template>
<template id="tpl-fuzzy-search">
<div class="chapter-header"><div class="ch-eyebrow">Chapter 15 · Advanced Features</div><h1 class="ch-title">Fuzzy Search with Fuse.js</h1><p class="ch-subtitle">Real-world search tolerates typos, partial matches, and out-of-order words. Fuse.js brings lightweight, zero-dependency fuzzy searching to your API.</p></div>
<h2>Why Fuzzy Search?</h2>
<p>Exact-match search (SQL <code>LIKE '%term%'</code>) breaks the moment a user types "Compay report" instead of "Company report". Fuzzy search uses algorithms like Bitap to find results that are <em>approximately</em> equal to the query, ranked by relevance score. Users get results even when they mistype — which is almost always.</p>
<div class="concept-box"><h4>🔍 How Fuse.js Works</h4><p>Fuse.js uses the Bitap algorithm (also known as the shift-or/shift-and algorithm) to perform approximate string matching. It assigns each result a score between 0 (perfect match) and 1 (no match) and sorts by relevance. You control the threshold, which fields to search, how much each field is weighted, and whether to search the whole string or word-by-word.</p></div>
<h2>Setting Up the Search Service</h2>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/services/searchService.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> Fuse = <span class="fn">require</span>(<span class="str">'fuse.js'</span>);
<span class="kw">const</span> { <span class="cls">Task</span>, <span class="cls">Project</span> } = <span class="fn">require</span>(<span class="str">'../models'</span>);

<span class="cmt">// Fuse options define how search behaves</span>
<span class="kw">const</span> TASK_FUSE_OPTIONS = {
  <span class="prop">keys</span>: [
    { <span class="prop">name</span>: <span class="str">'title'</span>,       <span class="prop">weight</span>: <span class="num">0.6</span> }, <span class="cmt">// title matches count most</span>
    { <span class="prop">name</span>: <span class="str">'description'</span>, <span class="prop">weight</span>: <span class="num">0.3</span> },
    { <span class="prop">name</span>: <span class="str">'tags'</span>,        <span class="prop">weight</span>: <span class="num">0.1</span> },
  ],
  <span class="prop">threshold</span>: <span class="num">0.4</span>,   <span class="cmt">// 0 = exact match only, 1 = match anything</span>
  <span class="prop">distance</span>: <span class="num">100</span>,    <span class="cmt">// how far apart characters can be and still match</span>
  <span class="prop">includeScore</span>: <span class="kw">true</span>,   <span class="cmt">// include relevance score in results</span>
  <span class="prop">includeMatches</span>: <span class="kw">true</span>,  <span class="cmt">// highlight which characters matched</span>
  <span class="prop">minMatchCharLength</span>: <span class="num">2</span>,  <span class="cmt">// ignore single-char matches</span>
  <span class="prop">useExtendedSearch</span>: <span class="kw">true</span>, <span class="cmt">// enables prefix (^), exact (""), negation (!)</span>
};

<span class="cmt">/**
 * Search a user's tasks with fuzzy matching
 * Returns results sorted by relevance, with match highlights
 */</span>
<span class="kw">const</span> <span class="fn">searchTasks</span> = <span class="kw">async</span> (userId, query, options = {}) => {
  <span class="kw">const</span> { status, priority, limit = <span class="num">20</span> } = options;

  <span class="cmt">// 1. Fetch all tasks for this user (we search in-memory)</span>
  <span class="cmt">// For large datasets, pre-filter in DB first</span>
  <span class="kw">const</span> where = { userId };
  <span class="kw">if</span> (status)   where.<span class="prop">status</span>   = status;
  <span class="kw">if</span> (priority) where.<span class="prop">priority</span> = priority;

  <span class="kw">const</span> tasks = <span class="kw">await</span> <span class="cls">Task</span>.<span class="fn">findAll</span>({
    where,
    include: [{ model: <span class="cls">Project</span>, as: <span class="str">'project'</span>, attributes: [<span class="str">'id'</span>, <span class="str">'name'</span>] }],
    limit: <span class="num">500</span>, <span class="cmt">// cap in-memory set for performance</span>
  });

  <span class="cmt">// 2. Convert to plain objects for Fuse (Sequelize instances are fine too)</span>
  <span class="kw">const</span> taskData = tasks.<span class="fn">map</span>(t => ({
    ...t.<span class="fn">toJSON</span>(),
    <span class="prop">tagsString</span>: (t.<span class="prop">tags</span> || []).<span class="fn">join</span>(<span class="str">' '</span>), <span class="cmt">// flatten array for search</span>
  }));

  <span class="cmt">// 3. Create Fuse index and search</span>
  <span class="kw">const</span> fuse = <span class="kw">new</span> <span class="cls">Fuse</span>(taskData, TASK_FUSE_OPTIONS);
  <span class="kw">const</span> results = fuse.<span class="fn">search</span>(query);

  <span class="cmt">// 4. Format results — include score and match highlights</span>
  <span class="kw">return</span> results
    .<span class="fn">slice</span>(<span class="num">0</span>, limit)
    .<span class="fn">map</span>(({ item, score, matches }) => ({
      ...item,
      <span class="prop">_score</span>: (<span class="num">1</span> - score).<span class="fn">toFixed</span>(<span class="num">3</span>),    <span class="cmt">// invert: 1 = perfect, 0 = poor</span>
      <span class="prop">_matches</span>: <span class="fn">formatMatches</span>(matches), <span class="cmt">// highlight positions</span>
    }));
};

<span class="cmt">// Helper: extract which characters matched for client-side highlighting</span>
<span class="kw">const</span> <span class="fn">formatMatches</span> = (matches = []) =>
  matches.<span class="fn">map</span>(m => ({
    <span class="prop">key</span>: m.<span class="prop">key</span>,
    <span class="prop">indices</span>: m.<span class="prop">indices</span>, <span class="cmt">// [[start, end], [start, end]] positions that matched</span>
  }));

module.exports = { searchTasks };</code></pre></div>
<h2>Search Controller & Route</h2>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/controllers/searchController.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> { searchTasks } = <span class="fn">require</span>(<span class="str">'../services/searchService'</span>);

<span class="kw">const</span> <span class="fn">search</span> = <span class="kw">async</span> (req, res, next) => {
  <span class="kw">try</span> {
    <span class="kw">const</span> { q, status, priority, limit } = req.query;

    <span class="kw">if</span> (!q || q.<span class="fn">trim</span>().<span class="prop">length</span> < <span class="num">2</span>) {
      <span class="kw">return</span> res.<span class="fn">status</span>(<span class="num">400</span>).<span class="fn">json</span>({ error: <span class="str">'Search query must be at least 2 characters'</span> });
    }

    <span class="kw">const</span> results = <span class="kw">await</span> <span class="fn">searchTasks</span>(req.user.<span class="prop">id</span>, q.<span class="fn">trim</span>(), { status, priority, limit: <span class="cls">parseInt</span>(limit) });

    res.<span class="fn">json</span>({
      success: <span class="kw">true</span>,
      query: q,
      count: results.<span class="prop">length</span>,
      data: results,
    });
  } <span class="kw">catch</span> (err) { <span class="fn">next</span>(err); }
};
module.exports = { search };</code></pre></div>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/routes/search.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> router = <span class="fn">require</span>(<span class="str">'express'</span>).<span class="fn">Router</span>();
<span class="kw">const</span> authenticate = <span class="fn">require</span>(<span class="str">'../middleware/authenticate'</span>);
<span class="kw">const</span> { search } = <span class="fn">require</span>(<span class="str">'../controllers/searchController'</span>);

router.<span class="fn">get</span>(<span class="str">'/tasks'</span>, authenticate, search);
module.exports = router;

<span class="cmt">// Mount in app.js:  app.use('/api/search', searchRoutes);</span></code></pre></div>
<h2>Testing Fuzzy Search</h2>
<div class="code-block"><div class="code-header"><span class="code-lang">bash</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="cmt"># Finds tasks with "report" even with typo</span>
curl "http://localhost:3000/api/search/tasks?q=reprot" \\
  -H "Authorization: Bearer TOKEN"

<span class="cmt"># Extended search: exact phrase</span>
curl "http://localhost:3000/api/search/tasks?q='company+report'" \\
  -H "Authorization: Bearer TOKEN"

<span class="cmt"># With filters</span>
curl "http://localhost:3000/api/search/tasks?q=meeting&status=todo&priority=high" \\
  -H "Authorization: Bearer TOKEN"</code></pre></div>
<h2>Caching the Fuse Index</h2>
<p>Creating a new Fuse instance on every request is fine for small datasets, but for thousands of tasks you'll want to cache the index and invalidate it when tasks change:</p>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">Caching pattern</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> indexCache = <span class="kw">new</span> <span class="cls">Map</span>(); <span class="cmt">// userId → { fuse, builtAt }</span>

<span class="kw">const</span> <span class="fn">getFuseIndex</span> = <span class="kw">async</span> (userId) => {
  <span class="kw">const</span> cached = indexCache.<span class="fn">get</span>(userId);
  <span class="kw">const</span> CACHE_TTL = <span class="num">5</span> * <span class="num">60</span> * <span class="num">1000</span>; <span class="cmt">// 5 minutes</span>

  <span class="kw">if</span> (cached && (<span class="cls">Date</span>.<span class="fn">now</span>() - cached.<span class="prop">builtAt</span>) < CACHE_TTL) {
    <span class="kw">return</span> cached.<span class="prop">fuse</span>;
  }

  <span class="kw">const</span> tasks = <span class="kw">await</span> <span class="cls">Task</span>.<span class="fn">findAll</span>({ where: { userId }, limit: <span class="num">500</span> });
  <span class="kw">const</span> fuse = <span class="kw">new</span> <span class="cls">Fuse</span>(tasks.<span class="fn">map</span>(t => t.<span class="fn">toJSON</span>()), TASK_FUSE_OPTIONS);

  indexCache.<span class="fn">set</span>(userId, { fuse, builtAt: <span class="cls">Date</span>.<span class="fn">now</span>() });
  <span class="kw">return</span> fuse;
};

<span class="cmt">// Invalidate cache when a task is created/updated/deleted</span>
<span class="cmt">// In Task hooks:</span>
afterCreate:  (task) => indexCache.<span class="fn">delete</span>(task.<span class="prop">userId</span>),
afterUpdate:  (task) => indexCache.<span class="fn">delete</span>(task.<span class="prop">userId</span>),
afterDestroy: (task) => indexCache.<span class="fn">delete</span>(task.<span class="prop">userId</span>),</code></pre></div>
<div class="callout success"><div class="callout-title">✅ Fuzzy Search Live</div><p>Users can now find tasks even with typos, partial words, and misremembered titles. Results are ranked by relevance score and include match positions for client-side highlighting.</p></div>

<h2>PostgreSQL Full-Text Search — Server-Side Option</h2>
<p>Fuse.js is excellent for small to medium datasets (up to ~10,000 items). For larger datasets, consider PostgreSQL's built-in full-text search, which runs entirely in the database and scales much better.</p>
<div class="code-block"><div class="code-header"><span class="code-lang">SQL</span><span class="code-filename">PostgreSQL full-text search</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
<pre><code><span class="cmt">-- Create a tsvector column for fast full-text search</span>
<span class="kw">ALTER TABLE</span> tasks <span class="kw">ADD COLUMN</span> search_vector tsvector;

<span class="cmt">-- Populate it with a weighted combination of title + description</span>
<span class="kw">UPDATE</span> tasks <span class="kw">SET</span> search_vector =
  setweight(to_tsvector(<span class="str">'english'</span>, coalesce(title, <span class="str">''</span>)), <span class="str">'A'</span>) ||
  setweight(to_tsvector(<span class="str">'english'</span>, coalesce(description, <span class="str">''</span>)), <span class="str">'B'</span>);

<span class="cmt">-- GIN index for fast searches</span>
<span class="kw">CREATE INDEX</span> idx_tasks_search <span class="kw">ON</span> tasks <span class="kw">USING</span> GIN(search_vector);

<span class="cmt">-- Trigger to keep search_vector up to date on changes</span>
<span class="kw">CREATE</span> <span class="kw">FUNCTION</span> update_task_search_vector() <span class="kw">RETURNS TRIGGER AS</span> $$
<span class="kw">BEGIN</span>
  NEW.search_vector :=
    setweight(to_tsvector(<span class="str">'english'</span>, coalesce(NEW.title, <span class="str">''</span>)), <span class="str">'A'</span>) ||
    setweight(to_tsvector(<span class="str">'english'</span>, coalesce(NEW.description, <span class="str">''</span>)), <span class="str">'B'</span>);
  RETURN NEW;
END; $$ <span class="kw">LANGUAGE</span> plpgsql;

<span class="kw">CREATE TRIGGER</span> task_search_update
  <span class="kw">BEFORE INSERT OR UPDATE ON</span> tasks
  <span class="kw">FOR EACH ROW EXECUTE FUNCTION</span> update_task_search_vector();

<span class="cmt">-- Search query (ranks by relevance)</span>
<span class="kw">SELECT</span> id, title, description,
  ts_rank(search_vector, query) <span class="kw">AS</span> rank
<span class="kw">FROM</span> tasks, to_tsquery(<span class="str">'english'</span>, <span class="str">'report & monthly'</span>) query
<span class="kw">WHERE</span> search_vector @@ query
  <span class="kw">AND</span> user_id = $1
<span class="kw">ORDER BY</span> rank <span class="kw">DESC</span>
<span class="kw">LIMIT</span> 20;</code></pre></div>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/services/pgSearchService.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
<pre><code><span class="kw">const</span> db = <span class="fn">require</span>(<span class="str">'../config/knex'</span>);

<span class="cmt">// Server-side PG search — scales to millions of rows</span>
<span class="kw">const</span> <span class="fn">pgSearchTasks</span> = <span class="kw">async</span> (userId, query, limit = <span class="num">20</span>) => {
  <span class="cmt">// Convert user query to tsquery (handle multiple words)</span>
  <span class="kw">const</span> tsQuery = query.<span class="fn">trim</span>().<span class="fn">split</span>(<span class="str">/\s+/</span>).<span class="fn">join</span>(<span class="str">' & '</span>);

  <span class="kw">const</span> results = <span class="kw">await</span> db.<span class="fn">raw</span>(<span class="str">`
    SELECT
      t.id, t.title, t.description, t.status, t.priority, t.due_date,
      ts_rank(t.search_vector, to_tsquery('english', :tsQuery)) AS rank,
      ts_headline('english', t.title, to_tsquery('english', :tsQuery),
        'StartSel=<mark>, StopSel=</mark>, MaxWords=10') AS title_highlight
    FROM tasks t
    WHERE t.user_id = :userId
      AND t.search_vector @@ to_tsquery('english', :tsQuery)
    ORDER BY rank DESC
    LIMIT :limit
  `</span>, { userId, tsQuery, limit });

  <span class="kw">return</span> results.<span class="prop">rows</span>;
};</code></pre></div>
<div class="callout info"><div class="callout-title">💡 Fuse.js vs PostgreSQL FTS</div><p>Use <strong>Fuse.js</strong> when: dataset is small (&lt;10k items), you need fuzzy/typo-tolerant matching, or you're already fetching data into Node anyway. Use <strong>PostgreSQL FTS</strong> when: dataset is large, you need linguistic stemming (searching "running" finds "run"), or you want search to stay close to the data.</p></div>
</template>
<template id="tpl-caching">
<div class="chapter-header"><div class="ch-eyebrow">Chapter 16 · Advanced Features</div><h1 class="ch-title">Caching & Performance</h1><p class="ch-subtitle">The fastest code is code that doesn't run. Caching stores the result of expensive operations so repeated requests return instantly from memory instead of hitting the database.</p></div>
<h2>Why Cache?</h2>
<p>Database queries, even fast ones, add 2–50ms of latency each. For routes that are hit hundreds of times per second with the same parameters — like fetching a user's task summary, a project list, or frequently accessed configuration — caching those results in memory makes the difference between a 50ms response and a 1ms response.</p>
<h2>In-Memory Cache (No Redis Required)</h2>
<p>For single-server deployments, a simple in-memory cache is extremely effective. It's zero setup and millisecond access times.</p>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/utils/cache.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">class</span> <span class="cls">SimpleCache</span> {
  constructor(defaultTTL = <span class="num">5</span> * <span class="num">60</span> * <span class="num">1000</span>) { <span class="cmt">// default 5 min TTL</span>
    <span class="kw">this</span>.<span class="prop">store</span> = <span class="kw">new</span> <span class="cls">Map</span>();
    <span class="kw">this</span>.<span class="prop">defaultTTL</span> = defaultTTL;
  }

  <span class="fn">set</span>(key, value, ttl = <span class="kw">this</span>.<span class="prop">defaultTTL</span>) {
    <span class="kw">this</span>.<span class="prop">store</span>.<span class="fn">set</span>(key, { value, expiresAt: <span class="cls">Date</span>.<span class="fn">now</span>() + ttl });
  }

  <span class="fn">get</span>(key) {
    <span class="kw">const</span> entry = <span class="kw">this</span>.<span class="prop">store</span>.<span class="fn">get</span>(key);
    <span class="kw">if</span> (!entry) <span class="kw">return</span> <span class="kw">null</span>;
    <span class="kw">if</span> (<span class="cls">Date</span>.<span class="fn">now</span>() > entry.<span class="prop">expiresAt</span>) {
      <span class="kw">this</span>.<span class="prop">store</span>.<span class="fn">delete</span>(key); <span class="cmt">// expired — evict and return null</span>
      <span class="kw">return</span> <span class="kw">null</span>;
    }
    <span class="kw">return</span> entry.<span class="prop">value</span>;
  }

  <span class="fn">del</span>(key)   { <span class="kw">this</span>.<span class="prop">store</span>.<span class="fn">delete</span>(key); }
  <span class="fn">flush</span>()   { <span class="kw">this</span>.<span class="prop">store</span>.<span class="fn">clear</span>(); }

  <span class="cmt">// Delete all keys starting with a prefix</span>
  <span class="fn">delByPattern</span>(prefix) {
    <span class="kw">for</span> (<span class="kw">const</span> key <span class="kw">of</span> <span class="kw">this</span>.<span class="prop">store</span>.<span class="fn">keys</span>()) {
      <span class="kw">if</span> (key.<span class="fn">startsWith</span>(prefix)) <span class="kw">this</span>.<span class="prop">store</span>.<span class="fn">delete</span>(key);
    }
  }

  <span class="fn">size</span>() { <span class="kw">return</span> <span class="kw">this</span>.<span class="prop">store</span>.<span class="prop">size</span>; }
}

module.exports = <span class="kw">new</span> <span class="cls">SimpleCache</span>(); <span class="cmt">// singleton — shared across all requests</span></code></pre></div>
<h2>Cache Middleware</h2>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/middleware/cacheMiddleware.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> cache = <span class="fn">require</span>(<span class="str">'../utils/cache'</span>);

<span class="cmt">/**
 * Cache middleware factory
 * Usage: router.get('/', cacheFor(60), handler)
 */</span>
<span class="kw">const</span> <span class="fn">cacheFor</span> = (seconds) => (req, res, next) => {
  <span class="cmt">// Build a cache key from user + method + URL</span>
  <span class="kw">const</span> key = <span class="str">`${req.user?.id}:${req.method}:${req.originalUrl}`</span>;
  <span class="kw">const</span> hit = cache.<span class="fn">get</span>(key);

  <span class="kw">if</span> (hit) {
    res.<span class="fn">set</span>(<span class="str">'X-Cache'</span>, <span class="str">'HIT'</span>);
    <span class="kw">return</span> res.<span class="fn">json</span>(hit);
  }

  <span class="cmt">// Intercept res.json to cache the response before sending</span>
  <span class="kw">const</span> originalJson = res.<span class="prop">json</span>.<span class="fn">bind</span>(res);
  res.<span class="prop">json</span> = (body) => {
    <span class="kw">if</span> (res.<span class="prop">statusCode</span> === <span class="num">200</span>) {
      cache.<span class="fn">set</span>(key, body, seconds * <span class="num">1000</span>);
    }
    res.<span class="fn">set</span>(<span class="str">'X-Cache'</span>, <span class="str">'MISS'</span>);
    <span class="kw">return</span> <span class="fn">originalJson</span>(body);
  };
  <span class="fn">next</span>();
};

module.exports = { cacheFor };</code></pre></div>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">Using cache in routes</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> { cacheFor } = <span class="fn">require</span>(<span class="str">'../middleware/cacheMiddleware'</span>);

<span class="cmt">// Cache task list for 30 seconds</span>
router.<span class="fn">get</span>(<span class="str">'/'</span>, authenticate, <span class="fn">cacheFor</span>(<span class="num">30</span>), getAllTasks);

<span class="cmt">// Cache individual tasks for 2 minutes</span>
router.<span class="fn">get</span>(<span class="str">'/:id'</span>, authenticate, taskOwner, <span class="fn">cacheFor</span>(<span class="num">120</span>), getTaskById);</code></pre></div>
<h2>Cache Invalidation</h2>
<p>Caching creates a new problem: stale data. When a task is updated or deleted, we must invalidate any cached results that include it. This is done in the service layer or Sequelize hooks.</p>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">Cache invalidation strategy</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> cache = <span class="fn">require</span>(<span class="str">'../utils/cache'</span>);

<span class="cmt">// In task controller — invalidate after mutations</span>
<span class="kw">const</span> <span class="fn">updateTask</span> = <span class="kw">async</span> (req, res, next) => {
  <span class="kw">try</span> {
    <span class="kw">await</span> req.task.<span class="fn">update</span>(updates);

    <span class="cmt">// Bust all cached task routes for this user</span>
    cache.<span class="fn">delByPattern</span>(<span class="str">`${req.user.id}:GET:`</span>);

    res.<span class="fn">json</span>({ success: <span class="kw">true</span>, data: req.task });
  } <span class="kw">catch</span> (err) { <span class="fn">next</span>(err); }
};</code></pre></div>
<h2>Redis — For Multi-Server Deployments</h2>
<p>In-memory cache only works for single-server deployments. When you scale to multiple Node.js instances (behind a load balancer), each instance has its own separate cache — they can't share data. Redis solves this by acting as a centralized cache store all instances can share.</p>
<div class="code-block"><div class="code-header"><span class="code-lang">bash</span><span class="code-filename">Redis quick setup</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code>npm install ioredis

<span class="cmt"># Add to .env</span>
REDIS_URL=redis://localhost:6379</code></pre></div>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/config/redis.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> Redis = <span class="fn">require</span>(<span class="str">'ioredis'</span>);
<span class="kw">const</span> redis = <span class="kw">new</span> <span class="cls">Redis</span>(process.env.<span class="prop">REDIS_URL</span>);

redis.<span class="fn">on</span>(<span class="str">'connect'</span>, () => console.<span class="fn">log</span>(<span class="str">'✅ Redis connected'</span>));
redis.<span class="fn">on</span>(<span class="str">'error'</span>, (err) => console.<span class="fn">error</span>(<span class="str">'❌ Redis error:'</span>, err.<span class="prop">message</span>));

<span class="cmt">// Helper wrappers with JSON serialization</span>
<span class="kw">const</span> <span class="fn">getCache</span> = <span class="kw">async</span> (key) => {
  <span class="kw">const</span> val = <span class="kw">await</span> redis.<span class="fn">get</span>(key);
  <span class="kw">return</span> val ? <span class="cls">JSON</span>.<span class="fn">parse</span>(val) : <span class="kw">null</span>;
};
<span class="kw">const</span> <span class="fn">setCache</span> = (key, value, ttlSec = <span class="num">300</span>) =>
  redis.<span class="fn">setex</span>(key, ttlSec, <span class="cls">JSON</span>.<span class="fn">stringify</span>(value));
<span class="kw">const</span> <span class="fn">delCache</span> = (key) => redis.<span class="fn">del</span>(key);

module.exports = { redis, getCache, setCache, delCache };</code></pre></div>
<div class="callout success"><div class="callout-title">✅ Performance Layer Added</div><p>Caching makes repeated reads essentially free. The key discipline: always invalidate caches when their underlying data changes, and always measure before and after to confirm the improvement.</p></div>

<h2>HTTP Compression</h2>
<p>Enabling gzip/brotli compression reduces response sizes by 60–80% for JSON payloads. The <code>compression</code> middleware handles this automatically:</p>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">Compression middleware</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
<pre><code><span class="cmt">// npm install compression</span>
<span class="kw">const</span> compression = <span class="fn">require</span>(<span class="str">'compression'</span>);

app.<span class="fn">use</span>(<span class="fn">compression</span>({
  filter: (req, res) => {
    <span class="cmt">// Don't compress already-compressed assets or small responses</span>
    <span class="kw">if</span> (req.headers[<span class="str">'x-no-compression'</span>]) <span class="kw">return</span> <span class="kw">false</span>;
    <span class="kw">return</span> compression.<span class="fn">filter</span>(req, res);
  },
  threshold: <span class="num">1024</span>, <span class="cmt">// Only compress responses > 1KB</span>
  level: <span class="num">6</span>,         <span class="cmt">// Compression level 1-9 (6 = good balance)</span>
}));</code></pre></div>
<h2>Database Connection Pool Tuning</h2>
<p>Your PostgreSQL connection pool size directly affects performance under load. Too small: requests wait for connections. Too large: you overwhelm the database.</p>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">Pool configuration</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
<pre><code><span class="cmt">// Rule of thumb: max connections = (2 × num_cores) + num_disks</span>
<span class="cmt">// For a typical 2-core server: (2×2)+1 = 5 per Node process</span>
<span class="cmt">// With PM2 cluster mode (4 workers): 4 × 5 = 20 total connections</span>

<span class="kw">const</span> sequelize = <span class="kw">new</span> <span class="cls">Sequelize</span>(url, {
  dialect: <span class="str">'postgres'</span>,
  pool: {
    max: <span class="num">5</span>,                   <span class="cmt">// max connections per process</span>
    min: <span class="num">1</span>,                   <span class="cmt">// always keep 1 warm</span>
    acquire: <span class="num">30000</span>,           <span class="cmt">// wait 30s before giving up</span>
    idle: <span class="num">10000</span>,              <span class="cmt">// close idle connections after 10s</span>
    evict: <span class="num">1000</span>,              <span class="cmt">// check for idle connections every 1s</span>
  },
});

<span class="cmt">// Monitor pool health in production</span>
<span class="kw">setInterval</span>(() => {
  <span class="kw">const</span> pool = sequelize.<span class="prop">connectionManager</span>.<span class="prop">pool</span>;
  logger.<span class="fn">debug</span>(<span class="str">'DB Pool stats'</span>, {
    size:    pool.<span class="prop">_availableObjects</span>.<span class="prop">length</span> + pool.<span class="prop">_inUseObjects</span>.<span class="prop">size</span>,
    inUse:   pool.<span class="prop">_inUseObjects</span>.<span class="prop">size</span>,
    waiting: pool.<span class="prop">_waitingClients</span>.<span class="prop">length</span>,
  });
}, <span class="num">30000</span>);</code></pre></div>
<h2>N+1 Detection in Development</h2>
<p>Sequelize's SQL logging helps catch N+1 queries — but it's noisy. A better approach is to count queries per request in development:</p>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">Query counter middleware (dev only)</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
<pre><code><span class="kw">if</span> (config.env === <span class="str">'development'</span>) {
  <span class="kw">let</span> queryCount = <span class="num">0</span>;
  sequelize.<span class="fn">addHook</span>(<span class="str">'beforeQuery'</span>, () => { queryCount++; });

  app.<span class="fn">use</span>((req, res, next) => {
    queryCount = <span class="num">0</span>;
    res.<span class="fn">on</span>(<span class="str">'finish'</span>, () => {
      <span class="kw">if</span> (queryCount > <span class="num">10</span>) {
        console.<span class="fn">warn</span>(<span class="str">`⚠️  N+1 suspected: ${req.method} ${req.path} ran ${queryCount} queries`</span>);
      }
    });
    <span class="fn">next</span>();
  });
}</code></pre></div>
</template>
<template id="tpl-error-handling">
<div class="chapter-header"><div class="ch-eyebrow">Chapter 17 · Production Ready</div><h1 class="ch-title">Error Handling</h1><p class="ch-subtitle">Production applications fail gracefully. Every unhandled error is an opportunity to improve your system — but first you have to catch it, log it, and respond meaningfully.</p></div>
<h2>Custom Error Classes</h2>
<p>Instead of creating error objects with loose <code>statusCode</code> properties scattered everywhere, define a proper error hierarchy. This makes error handling consistent and self-documenting.</p>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/utils/AppError.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">class</span> <span class="cls">AppError</span> <span class="kw">extends</span> <span class="cls">Error</span> {
  constructor(message, statusCode = <span class="num">500</span>, details = <span class="kw">null</span>) {
    <span class="kw">super</span>(message);
    <span class="kw">this</span>.<span class="prop">name</span>       = <span class="kw">this</span>.<span class="prop">constructor</span>.<span class="prop">name</span>;
    <span class="kw">this</span>.<span class="prop">statusCode</span>  = statusCode;
    <span class="kw">this</span>.<span class="prop">details</span>     = details;
    <span class="kw">this</span>.<span class="prop">isOperational</span> = <span class="kw">true</span>; <span class="cmt">// distinguish from programming errors</span>
    <span class="cls">Error</span>.<span class="fn">captureStackTrace</span>(<span class="kw">this</span>, <span class="kw">this</span>.<span class="prop">constructor</span>);
  }
}

<span class="kw">class</span> <span class="cls">NotFoundError</span>    <span class="kw">extends</span> <span class="cls">AppError</span> { constructor(r) { <span class="kw">super</span>(<span class="str">`${r} not found`</span>, <span class="num">404</span>); } }
<span class="kw">class</span> <span class="cls">UnauthorizedError</span> <span class="kw">extends</span> <span class="cls">AppError</span> { constructor(m = <span class="str">'Unauthorized'</span>) { <span class="kw">super</span>(m, <span class="num">401</span>); } }
<span class="kw">class</span> <span class="cls">ForbiddenError</span>    <span class="kw">extends</span> <span class="cls">AppError</span> { constructor(m = <span class="str">'Forbidden'</span>) { <span class="kw">super</span>(m, <span class="num">403</span>); } }
<span class="kw">class</span> <span class="cls">ConflictError</span>     <span class="kw">extends</span> <span class="cls">AppError</span> { constructor(m) { <span class="kw">super</span>(m, <span class="num">409</span>); } }
<span class="kw">class</span> <span class="cls">ValidationError</span>   <span class="kw">extends</span> <span class="cls">AppError</span> { constructor(m, d) { <span class="kw">super</span>(m, <span class="num">422</span>, d); } }

module.exports = { AppError, NotFoundError, UnauthorizedError, ForbiddenError, ConflictError, ValidationError };</code></pre></div>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">Using custom errors in services</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> { NotFoundError, ConflictError } = <span class="fn">require</span>(<span class="str">'../utils/AppError'</span>);

<span class="kw">const</span> <span class="fn">register</span> = <span class="kw">async</span> ({ name, email, password }) => {
  <span class="kw">const</span> existing = <span class="kw">await</span> <span class="cls">User</span>.<span class="fn">findOne</span>({ where: { email } });
  <span class="kw">if</span> (existing) <span class="kw">throw new</span> <span class="cls">ConflictError</span>(<span class="str">'Email already registered'</span>);
  <span class="cmt">// ...</span>
};

<span class="kw">const</span> <span class="fn">getTaskById</span> = <span class="kw">async</span> (id, userId) => {
  <span class="kw">const</span> task = <span class="kw">await</span> <span class="cls">Task</span>.<span class="fn">findOne</span>({ where: { id, userId } });
  <span class="kw">if</span> (!task) <span class="kw">throw new</span> <span class="cls">NotFoundError</span>(<span class="str">'Task'</span>); <span class="cmt">// "Task not found"</span>
  <span class="kw">return</span> task;
};</code></pre></div>
<h2>Structured Logging with Winston</h2>
<p>In production, <code>console.log</code> is not enough. You need structured, leveled, persisted logs that can be queried and monitored.</p>
<div class="code-block"><div class="code-header"><span class="code-lang">bash</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code>npm install winston</code></pre></div>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/utils/logger.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> winston = <span class="fn">require</span>(<span class="str">'winston'</span>);

<span class="kw">const</span> logger = winston.<span class="fn">createLogger</span>({
  level: process.env.<span class="prop">LOG_LEVEL</span> || <span class="str">'info'</span>,
  format: winston.format.<span class="fn">combine</span>(
    winston.format.<span class="fn">timestamp</span>(),
    winston.format.<span class="fn">errors</span>({ stack: <span class="kw">true</span> }),
    process.env.<span class="prop">NODE_ENV</span> === <span class="str">'development'</span>
      ? winston.format.<span class="fn">colorize</span>()
      : winston.format.<span class="fn">json</span>(), <span class="cmt">// JSON in production for log aggregators</span>
  ),
  transports: [
    <span class="kw">new</span> winston.transports.<span class="cls">Console</span>(),
    <span class="kw">new</span> winston.transports.<span class="cls">File</span>({ filename: <span class="str">'logs/error.log'</span>, level: <span class="str">'error'</span> }),
    <span class="kw">new</span> winston.transports.<span class="cls">File</span>({ filename: <span class="str">'logs/combined.log'</span> }),
  ],
});

module.exports = logger;</code></pre></div>
<h2>Unhandled Rejection & Exception Handlers</h2>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/server.js (with process handlers)</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> logger = <span class="fn">require</span>(<span class="str">'./utils/logger'</span>);

<span class="cmt">// Catch unhandled promise rejections (forgotten try/catch)</span>
process.<span class="fn">on</span>(<span class="str">'unhandledRejection'</span>, (reason, promise) => {
  logger.<span class="fn">error</span>(<span class="str">'Unhandled Rejection'</span>, { reason, promise });
  <span class="cmt">// In production: log, alert on-call, then gracefully shut down</span>
  process.<span class="fn">exit</span>(<span class="num">1</span>);
});

<span class="cmt">// Catch synchronous throws that escaped all catch blocks</span>
process.<span class="fn">on</span>(<span class="str">'uncaughtException'</span>, (err) => {
  logger.<span class="fn">error</span>(<span class="str">'Uncaught Exception'</span>, { error: err });
  process.<span class="fn">exit</span>(<span class="num">1</span>);
});

<span class="cmt">// Graceful shutdown on SIGTERM (sent by Docker/PM2 during deploys)</span>
process.<span class="fn">on</span>(<span class="str">'SIGTERM'</span>, () => {
  logger.<span class="fn">info</span>(<span class="str">'SIGTERM received. Closing server gracefully...'</span>);
  server.<span class="fn">close</span>(() => {
    logger.<span class="fn">info</span>(<span class="str">'Server closed'</span>);
    process.<span class="fn">exit</span>(<span class="num">0</span>);
  });
});</code></pre></div>
<div class="callout success"><div class="callout-title">✅ Production-Grade Error Handling</div><p>Custom error classes, structured logging, global unhandled rejection handlers, and graceful shutdown — your application now fails safely and leaves a clear audit trail.</p></div>

<h2>Async Handler Wrapper — Eliminate Try/Catch Boilerplate</h2>
<p>Every async controller function has the same <code>try { ... } catch (err) { next(err); }</code> pattern. We can eliminate this boilerplate entirely with a wrapper:</p>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/utils/asyncHandler.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
<pre><code><span class="cmt">/**
 * Wraps an async route handler and automatically calls next(err) on rejection.
 * Usage: router.get('/', asyncHandler(async (req, res) => { ... }))
 */</span>
<span class="kw">const</span> <span class="fn">asyncHandler</span> = (fn) => (req, res, next) =>
  <span class="cls">Promise</span>.<span class="fn">resolve</span>(<span class="fn">fn</span>(req, res, next)).<span class="fn">catch</span>(next);

module.exports = <span class="fn">asyncHandler</span>;</code></pre></div>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">Before vs After</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
<pre><code><span class="cmt">// BEFORE — boilerplate on every handler</span>
<span class="kw">const</span> <span class="fn">getTaskById</span> = <span class="kw">async</span> (req, res, next) => {
  <span class="kw">try</span> {
    <span class="kw">const</span> task = <span class="kw">await</span> <span class="cls">Task</span>.<span class="fn">findByPk</span>(req.params.<span class="prop">id</span>);
    <span class="kw">if</span> (!task) <span class="kw">throw new</span> <span class="cls">NotFoundError</span>(<span class="str">'Task'</span>);
    res.<span class="fn">json</span>({ data: task });
  } <span class="kw">catch</span> (err) { <span class="fn">next</span>(err); } <span class="cmt">// repeated everywhere</span>
};

<span class="cmt">// AFTER — clean, focused on the actual logic</span>
<span class="kw">const</span> <span class="fn">getTaskById</span> = <span class="fn">asyncHandler</span>(<span class="kw">async</span> (req, res) => {
  <span class="kw">const</span> task = <span class="kw">await</span> <span class="cls">Task</span>.<span class="fn">findByPk</span>(req.params.<span class="prop">id</span>);
  <span class="kw">if</span> (!task) <span class="kw">throw new</span> <span class="cls">NotFoundError</span>(<span class="str">'Task'</span>); <span class="cmt">// auto-caught by wrapper</span>
  res.<span class="fn">json</span>({ data: task });
});</code></pre></div>
<h2>Health Check Endpoint</h2>
<p>A good health check endpoint verifies not just that the server is running, but that its critical dependencies (database, Redis) are also reachable. Load balancers use this to route traffic away from unhealthy instances.</p>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">Health check route</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
<pre><code>app.<span class="fn">get</span>(<span class="str">'/health'</span>, <span class="kw">async</span> (req, res) => {
  <span class="kw">const</span> checks = {};
  <span class="kw">let</span> healthy = <span class="kw">true</span>;

  <span class="cmt">// Check database</span>
  <span class="kw">try</span> {
    <span class="kw">await</span> sequelize.<span class="fn">authenticate</span>();
    checks.<span class="prop">database</span> = <span class="str">'ok'</span>;
  } <span class="kw">catch</span> (e) {
    checks.<span class="prop">database</span> = <span class="str">'error'</span>;
    healthy = <span class="kw">false</span>;
  }

  <span class="cmt">// Check Redis (if used)</span>
  <span class="kw">try</span> {
    <span class="kw">await</span> redis.<span class="fn">ping</span>();
    checks.<span class="prop">redis</span> = <span class="str">'ok'</span>;
  } <span class="kw">catch</span> (e) {
    checks.<span class="prop">redis</span> = <span class="str">'error'</span>;
    <span class="cmt">// Don't fail health check for Redis — it's not critical</span>
  }

  res.<span class="fn">status</span>(healthy ? <span class="num">200</span> : <span class="num">503</span>).<span class="fn">json</span>({
    status: healthy ? <span class="str">'healthy'</span> : <span class="str">'degraded'</span>,
    uptime: process.<span class="fn">uptime</span>(),
    timestamp: <span class="kw">new</span> <span class="cls">Date</span>().<span class="fn">toISOString</span>(),
    version: process.env.<span class="prop">npm_package_version</span>,
    checks,
  });
});</code></pre></div>

<template id="tpl-testing">
<div class="chapter-header"><div class="ch-eyebrow">Chapter 18 · Production Ready</div><h1 class="ch-title">Testing with Jest</h1><p class="ch-subtitle">Tests are the safety net that lets you refactor confidently, merge PRs quickly, and ship features without lying awake worrying. Let's build a proper test suite.</p></div>
<h2>Testing Strategy</h2>
<p>We use two levels of testing for TaskFlow:</p>
<ul>
  <li><strong>Unit tests</strong> — Test a single function in isolation. Fast, no database, no HTTP. Test your service logic, utility functions, validators.</li>
  <li><strong>Integration tests</strong> — Test a full HTTP request through the actual Express app to the test database. Slow but comprehensive — catches routing bugs, middleware issues, database errors.</li>
</ul>
<div class="code-block"><div class="code-header"><span class="code-lang">bash</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code>npm install --save-dev jest supertest
<span class="cmt"># Add to package.json</span>
<span class="cmt"># "jest": { "testEnvironment": "node", "testMatch": ["**/tests/**/*.test.js"] }</span></code></pre></div>
<h2>Unit Test — Auth Service</h2>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">tests/unit/authService.test.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> authService = <span class="fn">require</span>(<span class="str">'../../src/services/authService'</span>);
<span class="kw">const</span> { <span class="cls">User</span> } = <span class="fn">require</span>(<span class="str">'../../src/models'</span>);

<span class="cmt">// Mock Sequelize — we don't want real DB calls in unit tests</span>
jest.<span class="fn">mock</span>(<span class="str">'../../src/models'</span>, () => ({
  <span class="cls">User</span>: { findOne: jest.<span class="fn">fn</span>(), create: jest.<span class="fn">fn</span>() },
}));

<span class="fn">describe</span>(<span class="str">'authService.register'</span>, () => {
  <span class="fn">beforeEach</span>(() => jest.<span class="fn">clearAllMocks</span>());

  <span class="fn">it</span>(<span class="str">'should create a user and return a token'</span>, <span class="kw">async</span> () => {
    <span class="cls">User</span>.<span class="prop">findOne</span>.<span class="fn">mockResolvedValue</span>(<span class="kw">null</span>); <span class="cmt">// no existing user</span>
    <span class="cls">User</span>.<span class="prop">create</span>.<span class="fn">mockResolvedValue</span>({ id: <span class="str">'abc-123'</span>, email: <span class="str">'test@test.com'</span>, role: <span class="str">'user'</span>, toJSON: () => ({}) });

    <span class="kw">const</span> result = <span class="kw">await</span> authService.<span class="fn">register</span>({ name: <span class="str">'Test'</span>, email: <span class="str">'test@test.com'</span>, password: <span class="str">'pass123'</span> });

    <span class="fn">expect</span>(result.token).<span class="fn">toBeDefined</span>();
    <span class="fn">expect</span>(result.user).<span class="fn">toBeDefined</span>();
    <span class="fn">expect</span>(<span class="cls">User</span>.create).<span class="fn">toHaveBeenCalledWith</span>(
      <span class="fn">expect</span>.<span class="fn">objectContaining</span>({ email: <span class="str">'test@test.com'</span> })
    );
  });

  <span class="fn">it</span>(<span class="str">'should throw 409 if email already exists'</span>, <span class="kw">async</span> () => {
    <span class="cls">User</span>.<span class="prop">findOne</span>.<span class="fn">mockResolvedValue</span>({ id: <span class="str">'existing-user'</span> });

    <span class="kw">await</span> <span class="fn">expect</span>(
      authService.<span class="fn">register</span>({ name: <span class="str">'Test'</span>, email: <span class="str">'exists@test.com'</span>, password: <span class="str">'pass'</span> })
    ).<span class="fn">rejects</span>.<span class="fn">toMatchObject</span>({ statusCode: <span class="num">409</span> });

<h2>Integration Test — Task API</h2>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">tests/integration/tasks.test.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> request = <span class="fn">require</span>(<span class="str">'supertest'</span>);
<span class="kw">const</span> app     = <span class="fn">require</span>(<span class="str">'../../src/app'</span>);
<span class="kw">const</span> { sequelize, <span class="cls">User</span>, <span class="cls">Task</span> } = <span class="fn">require</span>(<span class="str">'../../src/models'</span>);
<span class="kw">const</span> authService = <span class="fn">require</span>(<span class="str">'../../src/services/authService'</span>);

<span class="kw">let</span> token, userId;

<span class="fn">beforeAll</span>(<span class="kw">async</span> () => {

  <span class="cmt">// Create a test user and get a token</span>
  <span class="kw">const</span> { user, token: t } = <span class="kw">await</span> authService.<span class="fn">register</span>({ name: <span class="str">'Test User'</span>, email: <span class="str">'test@test.com'</span>, password: <span class="str">'password123'</span> });
  token = t;
  userId = user.<span class="prop">id</span>;
});

<span class="fn">afterAll</span>(<span class="kw">async</span> () => {
  <span class="kw">await</span> sequelize.<span class="fn">close</span>();
});

<span class="fn">describe</span>(<span class="str">'POST /api/tasks'</span>, () => {
  <span class="fn">it</span>(<span class="str">'should create a task for authenticated user'</span>, <span class="kw">async</span> () => {
    <span class="kw">const</span> res = <span class="kw">await</span> <span class="fn">request</span>(app)
      .<span class="fn">post</span>(<span class="str">'/api/tasks'</span>)
      .<span class="fn">set</span>(<span class="str">'Authorization'</span>, <span class="str">`Bearer ${token}`</span>)
      .<span class="fn">send</span>({ title: <span class="str">'My Test Task'</span>, priority: <span class="str">'high'</span> });

    <span class="fn">expect</span>(res.<span class="prop">status</span>).<span class="fn">toBe</span>(<span class="num">201</span>);
    <span class="fn">expect</span>(res.<span class="prop">body</span>.<span class="prop">data</span>.<span class="prop">title</span>).<span class="fn">toBe</span>(<span class="str">'My Test Task'</span>);
    <span class="fn">expect</span>(res.<span class="prop">body</span>.<span class="prop">data</span>.<span class="prop">userId</span>).<span class="fn">toBe</span>(userId);
  });

  <span class="fn">it</span>(<span class="str">'should return 422 when title is missing'</span>, <span class="kw">async</span> () => {
    <span class="kw">const</span> res = <span class="kw">await</span> <span class="fn">request</span>(app)
      .<span class="fn">post</span>(<span class="str">'/api/tasks'</span>)
      .<span class="fn">set</span>(<span class="str">'Authorization'</span>, <span class="str">`Bearer ${token}`</span>)
      .<span class="fn">send</span>({ priority: <span class="str">'high'</span> }); <span class="cmt">// missing title</span>

    <span class="fn">expect</span>(res.<span class="prop">status</span>).<span class="fn">toBe</span>(<span class="num">422</span>);
    <span class="fn">expect</span>(res.<span class="prop">body</span>.<span class="prop">details</span>).<span class="fn">toEqual</span>(
      <span class="fn">expect</span>.<span class="fn">arrayContaining</span>([<span class="fn">expect</span>.<span class="fn">objectContaining</span>({ field: <span class="str">'title'</span> })])
    );
  });

  <span class="fn">it</span>(<span class="str">'should return 401 without a token'</span>, <span class="kw">async</span> () => {
    <span class="kw">const</span> res = <span class="kw">await</span> <span class="fn">request</span>(app)
      .<span class="fn">post</span>(<span class="str">'/api/tasks'</span>)

    <span class="fn">expect</span>(res.<span class="prop">status</span>).<span class="fn">toBe</span>(<span class="num">401</span>);

});

<span class="fn">describe</span>(<span class="str">'DELETE /api/tasks/:id'</span>, () => {
