<template id="tpl-modules"><div class="chapter-header"><div class="ch-eyebrow">Chapter 03 · Foundation</div><h1 class="ch-title">Modules &amp; npm</h1><p class="ch-subtitle">Understanding Node's module system is the difference between code that scales and a spaghetti ball. Every file you write is a module — let's get this completely right.</p></div>

<h2>Why Modules Exist</h2>
<p>Without modules, every variable and function in your application shares the same global scope. A <code>config</code> variable in one file can silently overwrite a <code>config</code> variable in another. Debugging that is genuinely painful. Node's module system gives every file a <strong>private scope by default</strong> — nothing leaks out unless you explicitly export it, and nothing leaks in unless you explicitly import it.</p>

<h2>CommonJS (CJS) — Node's Original System</h2>
<p>Node.js shipped with CommonJS in 2009. It's synchronous, simple, and you'll find it in nearly every existing Node.js codebase. Two concepts run everything: <code>module.exports</code> (what you share) and <code>require()</code> (what you consume).</p>

<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/utils/math.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="cmt">// Private — not exported, invisible to other files</span>
<span class="kw">function</span> <span class="fn">validate</span>(n) { <span class="kw">return</span> typeof n === <span class="str">'number'</span>; }

<span class="cmt">// Public — attached to module.exports</span>
<span class="kw">function</span> <span class="fn">add</span>(a, b) {
  <span class="kw">if</span> (!<span class="fn">validate</span>(a) || !<span class="fn">validate</span>(b)) <span class="kw">throw new</span> <span class="cls">TypeError</span>(<span class="str">'Expected numbers'</span>);
  <span class="kw">return</span> a + b;
}

<span class="kw">function</span> <span class="fn">multiply</span>(a, b) { <span class="kw">return</span> a * b; }

<span class="cmt">// Export as a plain object — consumers destructure what they need</span>
module.exports = { add, multiply };</code></pre></div>

<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/app.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="cmt">// Relative path (starts with ./ or ../) → your own file</span>
<span class="kw">const</span> { add, multiply } = <span class="fn">require</span>(<span class="str">'./utils/math'</span>);

<span class="cmt">// No path prefix → built-in Node module</span>
<span class="kw">const</span> path = <span class="fn">require</span>(<span class="str">'path'</span>);
<span class="kw">const</span> fs   = <span class="fn">require</span>(<span class="str">'fs'</span>);

<span class="cmt">// No path prefix, not built-in → npm package (node_modules/)</span>
<span class="kw">const</span> express = <span class="fn">require</span>(<span class="str">'express'</span>);

console.<span class="fn">log</span>(<span class="fn">add</span>(<span class="num">2</span>, <span class="num">3</span>));        <span class="cmt">// 5</span>
console.<span class="fn">log</span>(<span class="fn">multiply</span>(<span class="num">4</span>, <span class="num">5</span>));  <span class="cmt">// 20</span>
<span class="cmt">// validate is NOT accessible here — it was never exported</span></code></pre></div>

<div class="concept-box"><h4>📦 Module Caching</h4><p>Node.js caches every module after its first <code>require()</code> call. If ten files all <code>require('./config')</code>, the config module only runs <strong>once</strong> — every caller gets back the exact same exported object. This is how a database connection pool stays shared across your entire app without passing it around manually.</p></div>

<h2>CommonJS Export Patterns</h2>
<p>There are several ways to structure exports. Choose based on what makes the API most intuitive for the consumer:</p>

<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">Export patterns</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="cmt">// 1. Named exports (object) — consumer picks what they need</span>
module.exports = { add, subtract, multiply, divide };

<span class="cmt">// 2. Default export (single value) — clean for classes or one-purpose files</span>
module.exports = <span class="kw">class</span> <span class="cls">UserService</span> { <span class="cmt">/* ... */</span> };

<span class="cmt">// 3. Singleton — module runs once, exports a shared instance</span>
<span class="kw">const</span> pool = <span class="kw">new</span> <span class="cls">Pool</span>(dbConfig);
module.exports = pool; <span class="cmt">// same pool object everywhere</span>

<span class="cmt">// 4. Factory — returns a fresh instance each time it's called</span>
module.exports = <span class="kw">function</span> <span class="fn">createLogger</span>(name) {
  <span class="kw">return</span> { <span class="fn">info</span>: (msg) => console.<span class="fn">log</span>(<span class="str">`[${name}] ${msg}`</span>) };
};
<span class="cmt">// Usage: const log = require('./logger')('AuthService');</span>

<span class="cmt">// 5. Middleware (function as default export)</span>
module.exports = <span class="kw">function</span> <span class="fn">authenticate</span>(req, res, next) { <span class="cmt">/* ... */</span> };</code></pre></div>

<h2>ES Modules (ESM) — The Modern Standard</h2>
<p>ES Modules are the official JavaScript module system, standardised in ES2015 and fully supported in Node.js 12+. They're statically analysable (tools can understand your dependency graph at build time without running code), support tree-shaking in bundlers, and are the default in browser environments. To use ESM in Node, either name your files <code>.mjs</code> or add <code>"type": "module"</code> to <code>package.json</code>.</p>

<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/utils/format.mjs</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="cmt">// Named exports — importers pick what they need</span>
<span class="kw">export function</span> <span class="fn">formatDate</span>(date) {
  <span class="kw">return</span> <span class="kw">new</span> <span class="cls">Date</span>(date).<span class="fn">toLocaleDateString</span>(<span class="str">'en-US'</span>, {
    year: <span class="str">'numeric'</span>, month: <span class="str">'long'</span>, day: <span class="str">'numeric'</span>
  });
}

<span class="kw">export const</span> VERSION = <span class="str">'1.0.0'</span>;

<span class="cmt">// Default export — the "main thing" this module provides</span>
<span class="kw">export default function</span> <span class="fn">slugify</span>(str) {
  <span class="kw">return</span> str.<span class="fn">toLowerCase</span>().<span class="fn">replace</span>(<span class="str">/\s+/g</span>, <span class="str">'-'</span>).<span class="fn">replace</span>(<span class="str">/[^\w-]/g</span>, <span class="str">''</span>);
}</code></pre></div>

<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/app.mjs</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="cmt">// Named import</span>
<span class="kw">import</span> { formatDate, VERSION } <span class="kw">from</span> <span class="str">'./utils/format.mjs'</span>;

<span class="cmt">// Default import (name it whatever makes sense)</span>
<span class="kw">import</span> slugify <span class="kw">from</span> <span class="str">'./utils/format.mjs'</span>;

<span class="cmt">// Both at once</span>
<span class="kw">import</span> slugify, { formatDate } <span class="kw">from</span> <span class="str">'./utils/format.mjs'</span>;

<span class="cmt">// Namespace import — get everything as one object</span>
<span class="kw">import</span> * <span class="kw">as</span> Fmt <span class="kw">from</span> <span class="str">'./utils/format.mjs'</span>;
console.<span class="fn">log</span>(Fmt.<span class="fn">formatDate</span>(<span class="kw">new</span> <span class="cls">Date</span>()));

<span class="cmt">// Dynamic import — load a module on demand (lazy loading)</span>
<span class="kw">const</span> { heavyModule } = <span class="kw">await</span> <span class="fn">import</span>(<span class="str">'./utils/heavy.mjs'</span>);</code></pre></div>

<div class="callout warning"><div class="callout-title">⚠️ CJS vs ESM Interop</div><p>In a CJS project you can <code>require()</code> a CJS module but cannot <code>require()</code> an ESM module — you must use dynamic <code>import()</code> instead. ESM can import CJS modules with the default import syntax. Mixing them adds complexity. For this course we use <strong>CommonJS throughout</strong> for maximum compatibility with CLI tooling like Sequelize CLI.</p></div>

<h2>The require() Resolution Algorithm</h2>
<p>When Node.js sees <code>require('something')</code> it follows a precise lookup order. Understanding this prevents confusing "Cannot find module" errors:</p>

<div class="code-block"><div class="code-header"><span class="code-lang">text</span><span class="code-filename">How Node resolves require()</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code>require('./utils/math')    // starts with ./ or ../
  → try ./utils/math.js
  → try ./utils/math.json
  → try ./utils/math/index.js   ← directory with index.js

require('express')         // no path prefix
  → Is it a core module? (fs, path, http…) → use it immediately
  → look in ./node_modules/express/
  → look in ../node_modules/express/      ← traverses up
  → look in ../../node_modules/express/
  → …until filesystem root

require('./models')        // pointing at a directory
  → reads models/package.json "main" field
  → falls back to models/index.js         ← the standard pattern</code></pre></div>

<p>The <code>index.js</code> convention is why <code>src/models/index.js</code> wires up all Sequelize models in our project — <code>require('./models')</code> from anywhere in <code>src/</code> loads that single entry point.</p>

<h2>npm — Dependency Management in Depth</h2>
<p>npm is the world's largest software registry with over 2 million packages. It ships bundled with Node and is the primary tool for managing your project's dependencies.</p>

<div class="code-block"><div class="code-header"><span class="code-lang">bash</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="cmt"># Install runtime dependency (saved to "dependencies")</span>
npm install express

<span class="cmt"># Install dev-only dependency (saved to "devDependencies")</span>
<span class="cmt"># These are NOT installed in production (npm ci --only=production)</span>
npm install --save-dev nodemon jest

<span class="cmt"># Install exact version</span>
npm install express@4.18.2

<span class="cmt"># Install globally — available as a CLI command system-wide</span>
npm install -g sequelize-cli pm2

<span class="cmt"># Install all deps from package.json (what teammates/CI run)</span>
npm install

<span class="cmt"># Clean install — uses package-lock.json exactly (faster, more reliable)</span>
npm ci

<span class="cmt"># See what's outdated</span>
npm outdated

<span class="cmt"># Check for security vulnerabilities</span>
npm audit

<span class="cmt"># Auto-fix safe vulnerabilities</span>
npm audit fix</code></pre></div>

<h2>Understanding package.json Scripts</h2>
<p>The <code>scripts</code> section is your project's command palette. Any script you define can be run with <code>npm run &lt;name&gt;</code>. The special names <code>start</code>, <code>test</code>, and a few others can be run without the <code>run</code> keyword:</p>

<div class="code-block"><div class="code-header"><span class="code-lang">JSON</span><span class="code-filename">package.json scripts section</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code>{
  "scripts": {
    "start":       "node src/server.js",
    "dev":         "nodemon src/server.js",
    "test":        "jest --runInBand",
    "test:watch":  "jest --watch",
    "test:cov":    "jest --coverage",
    "lint":        "eslint src/",
    "lint:fix":    "eslint src/ --fix",
    "db:migrate":  "sequelize-cli db:migrate",
    "db:seed":     "sequelize-cli db:seed:all",
    "db:reset":    "sequelize-cli db:migrate:undo:all && sequelize-cli db:migrate && sequelize-cli db:seed:all",
    "build:check": "node --check src/server.js"
  }
}</code></pre></div>

<div class="callout info"><div class="callout-title">💡 npm scripts run in PATH context</div><p>When npm runs a script, it temporarily adds <code>./node_modules/.bin</code> to your PATH. This is why you can write <code>"jest"</code> instead of <code>"./node_modules/.bin/jest"</code> in scripts — npm finds the local binary automatically.</p></div>

<h2>Version Ranges in package.json</h2>
<p>The version strings in <code>dependencies</code> aren't exact version locks — they're <em>ranges</em>. Understanding them prevents "works on my machine" surprises:</p>

<div class="code-block"><div class="code-header"><span class="code-lang">JSON</span><span class="code-filename">Version range syntax</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code>{
  "dependencies": {
    "express":    "^4.18.2",   // ^ = compatible: >=4.18.2 <5.0.0
    "lodash":     "~4.17.21",  // ~ = patch only: >=4.17.21 <4.18.0
    "uuid":       "9.0.0",     // exact version — no wiggle room
    "sequelize":  ">=6.0.0",   // minimum version
    "knex":       "*"          // any version (avoid this)
  }
}</code></pre></div>

<p>The <code>package-lock.json</code> file records the <em>exact</em> version installed regardless of the range. Commit it always — it's what makes your builds reproducible across environments.</p>

<h2>Our Config Module (TaskFlow)</h2>
<p>Let's put these concepts to work. The config module is the first real module in TaskFlow — it reads environment variables, provides typed defaults, and validates critical settings at startup.</p>

<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/config/index.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="fn">require</span>(<span class="str">'dotenv'</span>).<span class="fn">config</span>(); <span class="cmt">// loads .env into process.env</span>

<span class="kw">const</span> config = {
  env:  process.env.<span class="prop">NODE_ENV</span> || <span class="str">'development'</span>,
  port: <span class="cls">parseInt</span>(process.env.<span class="prop">PORT</span>, <span class="num">10</span>) || <span class="num">3000</span>,
  isDev: process.env.<span class="prop">NODE_ENV</span> !== <span class="str">'production'</span>,

  db: {
    host:     process.env.<span class="prop">DB_HOST</span>     || <span class="str">'localhost'</span>,
    port:     <span class="cls">parseInt</span>(process.env.<span class="prop">DB_PORT</span>, <span class="num">10</span>) || <span class="num">5432</span>,
    name:     process.env.<span class="prop">DB_NAME</span>     || <span class="str">'taskflow_dev'</span>,
    user:     process.env.<span class="prop">DB_USER</span>     || <span class="str">'postgres'</span>,
    password: process.env.<span class="prop">DB_PASSWORD</span> || <span class="str">''</span>,
  },

  jwt: {
    secret:    process.env.<span class="prop">JWT_SECRET</span>    || <span class="str">'change-me-in-production'</span>,
    expiresIn: process.env.<span class="prop">JWT_EXPIRES_IN</span> || <span class="str">'7d'</span>,
  },

  upload: {
    dir:     process.env.<span class="prop">UPLOAD_DIR</span>    || <span class="str">'./uploads'</span>,
    maxSize: <span class="cls">parseInt</span>(process.env.<span class="prop">MAX_FILE_SIZE</span>, <span class="num">10</span>) || <span class="num">5242880</span>,
  },
};

<span class="cmt">// Fail fast — don't silently run with insecure defaults in production</span>
<span class="kw">if</span> (config.env === <span class="str">'production'</span>) {
  <span class="kw">const</span> required = [<span class="str">'JWT_SECRET'</span>, <span class="str">'DB_PASSWORD'</span>];
  <span class="kw">const</span> missing = required.<span class="fn">filter</span>(k => !process.env[k]);
  <span class="kw">if</span> (missing.<span class="prop">length</span>) <span class="kw">throw new</span> <span class="cls">Error</span>(<span class="str">`Missing env vars: ${missing.join(', ')}`</span>);
}

module.exports = config; <span class="cmt">// singleton — same object everywhere it's required</span></code></pre></div>

<div class="callout success"><div class="callout-title">✅ Module System Mastered</div><p>You now understand CJS vs ESM, every export pattern, how require() resolves paths, npm dependency management, and how to build a proper singleton config module. Everything in subsequent chapters uses these foundations.</p></div></template>
<template id="tpl-express-intro">
<div class="chapter-header"><div class="ch-eyebrow">Chapter 04 · Building the API</div><h1 class="ch-title">Intro to Express</h1><p class="ch-subtitle">Express is the minimal, unopinionated web framework for Node.js. It gives you routing, middleware, and request/response handling without dictating how you structure everything else.</p></div>
<h2>Why Express?</h2>
<p>Node.js has a built-in <code>http</code> module, but it's very low-level. You'd manually parse URLs, handle HTTP methods, parse bodies, and manage routing — all from scratch. Express wraps that complexity in a clean, chainable API. Think of it as Node's http module with superpowers: it gives you the essentials and gets out of your way.</p>
<h2>Your First Express Server</h2>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/app.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> express = <span class="fn">require</span>(<span class="str">'express'</span>);
<span class="kw">const</span> app = <span class="fn">express</span>(); <span class="cmt">// Create an Express application instance</span>

<span class="cmt">// Built-in middleware: parse incoming JSON request bodies</span>
<span class="cmt">// Without this, req.body would be undefined for JSON requests</span>
app.<span class="fn">use</span>(express.<span class="fn">json</span>());

<span class="cmt">// Route: GET /  →  responds with JSON</span>
app.<span class="fn">get</span>(<span class="str">'/'</span>, (req, res) => {
  res.<span class="fn">json</span>({ message: <span class="str">'Welcome to TaskFlow API'</span>, version: <span class="str">'1.0.0'</span> });
});

module.exports = app; <span class="cmt">// Export so server.js can start it (and tests can import it)</span></code></pre></div>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/server.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> app = <span class="fn">require</span>(<span class="str">'./app'</span>);
<span class="kw">const</span> config = <span class="fn">require</span>(<span class="str">'./config'</span>);

app.<span class="fn">listen</span>(config.port, () => {
  console.<span class="fn">log</span>(<span class="str">`🚀 TaskFlow API running on port ${config.port}`</span>);
  console.<span class="fn">log</span>(<span class="str">`   Environment: ${config.env}`</span>);
});</code></pre></div>
<p>Why split <code>app.js</code> and <code>server.js</code>? When writing tests, you want to import the app without actually binding to a port. This separation is a fundamental pattern in production Node.js applications.</p>
<div class="code-block"><div class="code-header"><span class="code-lang">bash</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code>npm run dev
<span class="cmt"># 🚀 TaskFlow API running on port 3000</span>
curl http://localhost:3000/
<span class="cmt"># {"message":"Welcome to TaskFlow API","version":"1.0.0"}</span></code></pre></div>
<h2>Routing</h2>
<p>A <strong>route</strong> maps an HTTP method + URL path to a handler function. The handler receives <code>req</code> (request) and <code>res</code> (response) objects, which are the entire interface to the HTTP layer.</p>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">Routing basics</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code>app.<span class="fn">get</span>(<span class="str">'/tasks'</span>, (req, res) => { <span class="cmt">/* fetch data */</span> });
app.<span class="fn">post</span>(<span class="str">'/tasks'</span>, (req, res) => { <span class="cmt">/* create */</span> });
app.<span class="fn">put</span>(<span class="str">'/tasks/:id'</span>, (req, res) => { <span class="cmt">/* full replace */</span> });
app.<span class="fn">patch</span>(<span class="str">'/tasks/:id'</span>, (req, res) => { <span class="cmt">/* partial update */</span> });
app.<span class="fn">delete</span>(<span class="str">'/tasks/:id'</span>, (req, res) => { <span class="cmt">/* delete */</span> });</code></pre></div>
<h3>Route Parameters, Query Strings & Body</h3>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">request-data.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="cmt">// 1. Route params  →  GET /tasks/42  →  req.params.id = "42"</span>
app.<span class="fn">get</span>(<span class="str">'/tasks/:id'</span>, (req, res) => {
  <span class="kw">const</span> { id } = req.params; <span class="cmt">// always a string</span>
  res.<span class="fn">json</span>({ id });
});

<span class="cmt">// 2. Query string  →  GET /tasks?status=open&page=2</span>
app.<span class="fn">get</span>(<span class="str">'/tasks'</span>, (req, res) => {
  <span class="kw">const</span> { status, page = <span class="num">1</span>, limit = <span class="num">20</span> } = req.query;
  res.<span class="fn">json</span>({ status, page, limit });
});

<span class="cmt">// 3. Request body  →  for POST/PATCH  →  requires express.json()</span>
app.<span class="fn">post</span>(<span class="str">'/tasks'</span>, (req, res) => {
  <span class="kw">const</span> { title, description, priority } = req.body;
  res.<span class="fn">status</span>(<span class="num">201</span>).<span class="fn">json</span>({ message: <span class="str">'Task created'</span>, title });
});</code></pre></div>
<h2>Express Router — Organizing Routes</h2>
<p>As your app grows, putting all routes in <code>app.js</code> becomes unmanageable. <code>express.Router()</code> creates a mini-application with its own routes and middleware that you mount at a prefix.</p>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/routes/tasks.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> express = <span class="fn">require</span>(<span class="str">'express'</span>);
<span class="kw">const</span> router = express.<span class="fn">Router</span>();
<span class="kw">const</span> { getAllTasks, getTaskById, createTask, updateTask, deleteTask }
  = <span class="fn">require</span>(<span class="str">'../controllers/taskController'</span>);

<span class="cmt">// Paths here are relative to wherever this router is mounted</span>
router.<span class="fn">get</span>(<span class="str">'/'</span>, getAllTasks);          <span class="cmt">// GET  /api/tasks</span>
router.<span class="fn">post</span>(<span class="str">'/'</span>, createTask);         <span class="cmt">// POST /api/tasks</span>
router.<span class="fn">get</span>(<span class="str">'/:id'</span>, getTaskById);    <span class="cmt">// GET  /api/tasks/:id</span>
router.<span class="fn">patch</span>(<span class="str">'/:id'</span>, updateTask);   <span class="cmt">// PATCH /api/tasks/:id</span>
router.<span class="fn">delete</span>(<span class="str">'/:id'</span>, deleteTask);  <span class="cmt">// DELETE /api/tasks/:id</span>

module.exports = router;</code></pre></div>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/app.js (updated)</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> express = <span class="fn">require</span>(<span class="str">'express'</span>);
<span class="kw">const</span> cors = <span class="fn">require</span>(<span class="str">'cors'</span>);
<span class="kw">const</span> helmet = <span class="fn">require</span>(<span class="str">'helmet'</span>);
<span class="kw">const</span> morgan = <span class="fn">require</span>(<span class="str">'morgan'</span>);
<span class="kw">const</span> taskRoutes = <span class="fn">require</span>(<span class="str">'./routes/tasks'</span>);
<span class="kw">const</span> app = <span class="fn">express</span>();

app.<span class="fn">use</span>(<span class="fn">helmet</span>());        <span class="cmt">// Security headers</span>
app.<span class="fn">use</span>(<span class="fn">cors</span>());          <span class="cmt">// Cross-origin requests</span>
app.<span class="fn">use</span>(express.<span class="fn">json</span>()); <span class="cmt">// Parse JSON bodies</span>
app.<span class="fn">use</span>(<span class="fn">morgan</span>(<span class="str">'dev'</span>));  <span class="cmt">// HTTP request logger</span>

app.<span class="fn">use</span>(<span class="str">'/api/tasks'</span>, taskRoutes);

app.<span class="fn">get</span>(<span class="str">'/health'</span>, (req, res) => {
  res.<span class="fn">json</span>({ status: <span class="str">'ok'</span>, timestamp: <span class="kw">new</span> <span class="cls">Date</span>().<span class="fn">toISOString</span>() });
});

module.exports = app;</code></pre></div>
<h2>The req and res Objects</h2>
<table><thead><tr><th>Object</th><th>Property/Method</th><th>Description</th></tr></thead><tbody>
<tr><td><code>req</code></td><td><code>.params</code></td><td>Route parameters like <code>:id</code></td></tr>
<tr><td><code>req</code></td><td><code>.query</code></td><td>Query string values</td></tr>
<tr><td><code>req</code></td><td><code>.body</code></td><td>Parsed request body (needs <code>express.json()</code>)</td></tr>
<tr><td><code>req</code></td><td><code>.headers</code></td><td>HTTP request headers</td></tr>
<tr><td><code>req</code></td><td><code>.user</code></td><td>Custom — attached by auth middleware</td></tr>
<tr><td><code>res</code></td><td><code>.json(data)</code></td><td>Send JSON, sets Content-Type automatically</td></tr>
<tr><td><code>res</code></td><td><code>.status(code)</code></td><td>Set HTTP status code (chainable)</td></tr>
<tr><td><code>res</code></td><td><code>.send(data)</code></td><td>Send a string or buffer</td></tr>
<tr><td><code>res</code></td><td><code>.redirect(url)</code></td><td>HTTP redirect response</td></tr>
</tbody></table>
<div class="callout success"><div class="callout-title">✅ Express Running</div><p>We have a server with organized routing, security headers, CORS, and logging. In the next chapter we'll design the full REST API with proper controllers and consistent response shapes.</p></div>
</template>
<template id="tpl-rest-api">
<div class="chapter-header"><div class="ch-eyebrow">Chapter 05 · Building the API</div><h1 class="ch-title">RESTful API Design</h1><p class="ch-subtitle">REST is an architectural style, not a protocol. Understanding its constraints leads to APIs that are predictable, scalable, and pleasant to work with.</p></div>
<h2>REST Principles</h2>
<p>REST (Representational State Transfer) was defined by Roy Fielding in 2000. An API is "RESTful" when it follows these constraints:</p>
<ul>
  <li><strong>Client-Server separation</strong> — UI and data storage are decoupled. The server never knows or cares about the client.</li>
  <li><strong>Statelessness</strong> — Every request must contain all information needed to process it. The server stores no client session state between requests.</li>
  <li><strong>Uniform Interface</strong> — Resources identified by URIs, interacted with via standard HTTP methods.</li>
  <li><strong>Layered System</strong> — Clients don't need to know if they're talking to the origin server or a load balancer.</li>
</ul>
<h2>Resource-Based URLs</h2>
<p>URLs identify <em>resources</em> (nouns), not actions (verbs). The HTTP method expresses the action.</p>
<table><thead><tr><th>❌ Action-based (wrong)</th><th>✅ Resource-based (right)</th></tr></thead><tbody>
<tr><td><code>POST /createTask</code></td><td><code>POST /tasks</code></td></tr>
<tr><td><code>GET /getTask?id=5</code></td><td><code>GET /tasks/5</code></td></tr>
<tr><td><code>POST /deleteTask</code></td><td><code>DELETE /tasks/5</code></td></tr>
<tr><td><code>GET /allUsers</code></td><td><code>GET /users</code></td></tr>
</tbody></table>
<div class="code-block"><div class="code-header"><span class="code-lang">text</span><span class="code-filename">Nested resource URLs</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code>GET    /projects/:projectId/tasks          <span class="cmt"># All tasks in a project</span>
POST   /projects/:projectId/tasks          <span class="cmt"># Create task in project</span>
GET    /projects/:projectId/tasks/:taskId  <span class="cmt"># One specific task</span>
PATCH  /projects/:projectId/tasks/:taskId  <span class="cmt"># Update that task</span>
DELETE /projects/:projectId/tasks/:taskId  <span class="cmt"># Delete that task</span></code></pre></div>
<h2>HTTP Status Codes — Use Them Correctly</h2>
<table><thead><tr><th>Code</th><th>Meaning</th><th>When to use</th></tr></thead><tbody>
<tr><td><code>200 OK</code></td><td>Success</td><td>Successful GET, PATCH, PUT</td></tr>
<tr><td><code>201 Created</code></td><td>Resource created</td><td>Successful POST that creates a record</td></tr>
<tr><td><code>204 No Content</code></td><td>Success, no body</td><td>Successful DELETE</td></tr>
<tr><td><code>400 Bad Request</code></td><td>Client error</td><td>Malformed JSON, missing required fields</td></tr>
<tr><td><code>401 Unauthorized</code></td><td>Not authenticated</td><td>Missing or invalid JWT token</td></tr>
<tr><td><code>403 Forbidden</code></td><td>Not authorized</td><td>Authenticated but lacks permission</td></tr>
<tr><td><code>404 Not Found</code></td><td>Resource missing</td><td>Task with given ID doesn't exist</td></tr>
<tr><td><code>409 Conflict</code></td><td>State conflict</td><td>Email already registered</td></tr>
<tr><td><code>422 Unprocessable</code></td><td>Validation error</td><td>Valid JSON but fails business rules</td></tr>
<tr><td><code>500 Server Error</code></td><td>Unexpected failure</td><td>Unhandled exceptions — never intentional</td></tr>
</tbody></table>
<h2>Building the Task Controller</h2>
<p>Controllers handle request/response. They should be <em>thin</em> — delegating real work to services. The controller's job is: receive the request, call the right service, send the response.</p>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/controllers/taskController.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> { <span class="cls">Task</span> } = <span class="fn">require</span>(<span class="str">'../models'</span>);

<span class="cmt">/** GET /api/tasks — paginated task list */</span>
<span class="kw">const</span> <span class="fn">getAllTasks</span> = <span class="kw">async</span> (req, res, next) => {
  <span class="kw">try</span> {
    <span class="kw">const</span> { page = <span class="num">1</span>, limit = <span class="num">20</span>, status, priority, sortBy = <span class="str">'createdAt'</span>, sortOrder = <span class="str">'DESC'</span> } = req.query;
    <span class="kw">const</span> offset = (page - <span class="num">1</span>) * limit;
    <span class="kw">const</span> where = { userId: req.user.<span class="prop">id</span> };
    <span class="kw">if</span> (status) where.<span class="prop">status</span> = status;
    <span class="kw">if</span> (priority) where.<span class="prop">priority</span> = priority;

    <span class="kw">const</span> { count, rows: tasks } = <span class="kw">await</span> <span class="cls">Task</span>.<span class="fn">findAndCountAll</span>({
      where, limit: <span class="cls">parseInt</span>(limit), offset,
      order: [[sortBy, sortOrder.<span class="fn">toUpperCase</span>()]],
    });

    res.<span class="fn">json</span>({
      <span class="prop">success</span>: <span class="kw">true</span>, <span class="prop">data</span>: tasks,
      <span class="prop">pagination</span>: { page: <span class="cls">parseInt</span>(page), limit: <span class="cls">parseInt</span>(limit), total: count, pages: <span class="cls">Math</span>.<span class="fn">ceil</span>(count / limit) },
    });
  } <span class="kw">catch</span> (err) { <span class="fn">next</span>(err); }
};

<span class="cmt">/** GET /api/tasks/:id */</span>
<span class="kw">const</span> <span class="fn">getTaskById</span> = <span class="kw">async</span> (req, res, next) => {
  <span class="kw">try</span> {
    <span class="kw">const</span> task = <span class="kw">await</span> <span class="cls">Task</span>.<span class="fn">findOne</span>({ where: { id: req.params.<span class="prop">id</span>, userId: req.user.<span class="prop">id</span> } });
    <span class="kw">if</span> (!task) <span class="kw">return</span> res.<span class="fn">status</span>(<span class="num">404</span>).<span class="fn">json</span>({ <span class="prop">success</span>: <span class="kw">false</span>, <span class="prop">error</span>: <span class="str">'Task not found'</span> });
    res.<span class="fn">json</span>({ <span class="prop">success</span>: <span class="kw">true</span>, <span class="prop">data</span>: task });
  } <span class="kw">catch</span> (err) { <span class="fn">next</span>(err); }
};

<span class="cmt">/** POST /api/tasks */</span>
<span class="kw">const</span> <span class="fn">createTask</span> = <span class="kw">async</span> (req, res, next) => {
  <span class="kw">try</span> {
    <span class="kw">const</span> { title, description, priority, dueDate, projectId } = req.body;
    <span class="kw">const</span> task = <span class="kw">await</span> <span class="cls">Task</span>.<span class="fn">create</span>({ title, description, priority: priority || <span class="str">'medium'</span>, dueDate, projectId, userId: req.user.<span class="prop">id</span>, status: <span class="str">'todo'</span> });
    res.<span class="fn">status</span>(<span class="num">201</span>).<span class="fn">json</span>({ <span class="prop">success</span>: <span class="kw">true</span>, <span class="prop">data</span>: task });
  } <span class="kw">catch</span> (err) { <span class="fn">next</span>(err); }
};

<span class="cmt">/** PATCH /api/tasks/:id — whitelist allowed fields */</span>
<span class="kw">const</span> <span class="fn">updateTask</span> = <span class="kw">async</span> (req, res, next) => {
  <span class="kw">try</span> {
    <span class="kw">const</span> task = <span class="kw">await</span> <span class="cls">Task</span>.<span class="fn">findOne</span>({ where: { id: req.params.<span class="prop">id</span>, userId: req.user.<span class="prop">id</span> } });
    <span class="kw">if</span> (!task) <span class="kw">return</span> res.<span class="fn">status</span>(<span class="num">404</span>).<span class="fn">json</span>({ <span class="prop">error</span>: <span class="str">'Task not found'</span> });

    <span class="kw">const</span> allowed = [<span class="str">'title'</span>, <span class="str">'description'</span>, <span class="str">'status'</span>, <span class="str">'priority'</span>, <span class="str">'dueDate'</span>, <span class="str">'tags'</span>];
    <span class="kw">const</span> updates = {};
    allowed.<span class="fn">forEach</span>(f => { <span class="kw">if</span> (req.body[f] !== <span class="kw">undefined</span>) updates[f] = req.body[f]; });

    <span class="kw">await</span> task.<span class="fn">update</span>(updates);
    res.<span class="fn">json</span>({ <span class="prop">success</span>: <span class="kw">true</span>, <span class="prop">data</span>: task });
  } <span class="kw">catch</span> (err) { <span class="fn">next</span>(err); }
};

<span class="cmt">/** DELETE /api/tasks/:id */</span>
<span class="kw">const</span> <span class="fn">deleteTask</span> = <span class="kw">async</span> (req, res, next) => {
  <span class="kw">try</span> {
    <span class="kw">const</span> task = <span class="kw">await</span> <span class="cls">Task</span>.<span class="fn">findOne</span>({ where: { id: req.params.<span class="prop">id</span>, userId: req.user.<span class="prop">id</span> } });
    <span class="kw">if</span> (!task) <span class="kw">return</span> res.<span class="fn">status</span>(<span class="num">404</span>).<span class="fn">json</span>({ <span class="prop">error</span>: <span class="str">'Task not found'</span> });
    <span class="kw">await</span> task.<span class="fn">destroy</span>();
    res.<span class="fn">status</span>(<span class="num">204</span>).<span class="fn">send</span>(); <span class="cmt">// 204 = success with no body</span>
  } <span class="kw">catch</span> (err) { <span class="fn">next</span>(err); }
};

module.exports = { getAllTasks, getTaskById, createTask, updateTask, deleteTask };</code></pre></div>
<h2>Consistent Response Shape</h2>
<p>A consistent response envelope makes your API self-documenting and easy for clients to parse. Define it once, use it everywhere.</p>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/utils/response.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="cmt">// { success: true, data: {...}, meta: {...} }</span>
<span class="kw">const</span> <span class="fn">success</span> = (res, data, statusCode = <span class="num">200</span>, meta = {}) => {
  res.<span class="fn">status</span>(statusCode).<span class="fn">json</span>({
    <span class="prop">success</span>: <span class="kw">true</span>, <span class="prop">data</span>: data,
    ...(<span class="cls">Object</span>.<span class="fn">keys</span>(meta).<span class="prop">length</span> && { meta }),
  });
};
<span class="cmt">// { success: false, error: "message", details: [...] }</span>
<span class="kw">const</span> <span class="fn">error</span> = (res, message, statusCode = <span class="num">500</span>, details = <span class="kw">null</span>) => {
  res.<span class="fn">status</span>(statusCode).<span class="fn">json</span>({
    <span class="prop">success</span>: <span class="kw">false</span>, <span class="prop">error</span>: message,
    ...(details && { details }),
  });
};
module.exports = { success, error };</code></pre></div>

<h2>Pagination Deep Dive</h2>
<p>Pagination is one of those things every API needs and almost everyone implements slightly differently. Here are the two main approaches and when to use each:</p>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">pagination-strategies.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
<pre><code><span class="cmt">// OFFSET PAGINATION — simple, works well for most use cases</span>
<span class="cmt">// GET /tasks?page=2&limit=20</span>
<span class="kw">const</span> <span class="fn">offsetPaginate</span> = (page, limit) => ({
  limit: <span class="cls">parseInt</span>(limit) || <span class="num">20</span>,
  offset: ((<span class="cls">parseInt</span>(page) || <span class="num">1</span>) - <span class="num">1</span>) * (<span class="cls">parseInt</span>(limit) || <span class="num">20</span>),
});

<span class="cmt">// Usage in controller:</span>
<span class="kw">const</span> { limit, offset } = <span class="fn">offsetPaginate</span>(req.query.page, req.query.limit);
<span class="kw">const</span> { count, rows } = <span class="kw">await</span> <span class="cls">Task</span>.<span class="fn">findAndCountAll</span>({ where, limit, offset, order });

<span class="cmt">// Response envelope with pagination metadata:</span>
res.<span class="fn">json</span>({
  success: <span class="kw">true</span>,
  data: rows,
  pagination: {
    page: <span class="cls">parseInt</span>(req.query.page) || <span class="num">1</span>,
    limit,
    total: count,
    pages: <span class="cls">Math</span>.<span class="fn">ceil</span>(count / limit),
    hasNext: offset + limit < count,
    hasPrev: offset > <span class="num">0</span>,
  },
});

<span class="cmt">// CURSOR PAGINATION — better for real-time feeds, avoids "drift"</span>
<span class="cmt">// GET /tasks?cursor=abc123&limit=20</span>
<span class="cmt">// cursor = the ID of the last item seen</span>
<span class="kw">const</span> <span class="fn">cursorPaginate</span> = <span class="kw">async</span> (cursor, limit) => {
  <span class="kw">const</span> where = cursor
    ? { createdAt: { [<span class="cls">Op</span>.<span class="prop">lt</span>]: (await <span class="cls">Task</span>.<span class="fn">findByPk</span>(cursor))?.createdAt } }
    : {};
  <span class="kw">const</span> rows = <span class="kw">await</span> <span class="cls">Task</span>.<span class="fn">findAll</span>({ where, limit: limit + <span class="num">1</span>, order: [[<span class="str">'createdAt'</span>, <span class="str">'DESC'</span>]] });
  <span class="kw">const</span> hasNext = rows.<span class="prop">length</span> > limit;
  <span class="kw">return</span> { items: rows.<span class="fn">slice</span>(<span class="num">0</span>, limit), nextCursor: hasNext ? rows[limit - <span class="num">1</span>].<span class="prop">id</span> : <span class="kw">null</span> };
};</code></pre></div>
<h2>API Versioning</h2>
<p>APIs change over time. Without versioning, every breaking change breaks every client simultaneously. Common strategies:</p>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">API versioning</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
<pre><code><span class="cmt">// Option 1: URL versioning (most common, most explicit)</span>
app.<span class="fn">use</span>(<span class="str">'/api/v1/tasks'</span>, v1TaskRoutes);
app.<span class="fn">use</span>(<span class="str">'/api/v2/tasks'</span>, v2TaskRoutes); <span class="cmt">// new schema, different response shape</span>

<span class="cmt">// Option 2: Header versioning (clean URLs, but less discoverable)</span>
<span class="kw">const</span> <span class="fn">apiVersion</span> = (req, res, next) => {
  req.<span class="prop">apiVersion</span> = req.headers[<span class="str">'accept-version'</span>] || <span class="str">'1'</span>;
  <span class="fn">next</span>();
};

<span class="cmt">// In app.js — we'll use URL versioning for TaskFlow:</span>
app.<span class="fn">use</span>(<span class="str">'/api/v1'</span>, v1Router);
<span class="cmt">// v1Router.use('/tasks', taskRoutes);</span>
<span class="cmt">// v1Router.use('/auth', authRoutes);</span>
<span class="cmt">// v1Router.use('/search', searchRoutes);</span></code></pre></div>
</template>
<template id="tpl-middleware">
<div class="chapter-header"><div class="ch-eyebrow">Chapter 06 · Building the API</div><h1 class="ch-title">Middleware Deep Dive</h1><p class="ch-subtitle">Middleware is the backbone of Express. Understanding the pipeline unlocks clean auth, validation, logging, and error handling without polluting your controllers.</p></div>
<h2>What is Middleware?</h2>
<p>A middleware function has the signature <code>(req, res, next)</code>. It has access to the request and response objects, and <code>next</code>. When done, it either calls <code>next()</code> to pass control forward, calls <code>next(error)</code> to skip to the error handler, or sends a response itself (ending the chain). Every request flows through middleware in the order it was registered with <code>app.use()</code>.</p>
<div class="app-diagram"><pre>
  Request → helmet() → cors() → express.json() → morgan()
         → authenticate() → validate() → controller → errorHandler() → Response</pre></div>
<h2>Writing Custom Middleware</h2>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/middleware/requestTimer.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> <span class="fn">requestTimer</span> = (req, res, next) => {
  <span class="kw">const</span> start = process.<span class="fn">hrtime</span>.<span class="fn">bigint</span>();
  res.<span class="fn">on</span>(<span class="str">'finish'</span>, () => {
    <span class="kw">const</span> ms = (<span class="cls">Number</span>(process.<span class="fn">hrtime</span>.<span class="fn">bigint</span>() - start) / <span class="num">1e6</span>).<span class="fn">toFixed</span>(<span class="num">2</span>);
    console.<span class="fn">log</span>(<span class="str">`${req.method} ${req.path} → ${res.statusCode} [${ms}ms]`</span>);
  });
  <span class="fn">next</span>(); <span class="cmt">// ALWAYS call next() or the request hangs forever</span>
};
module.exports = <span class="fn">requestTimer</span>;</code></pre></div>
<h2>Authentication Middleware</h2>
<p>The most important middleware in our app. It intercepts requests to protected routes, verifies the JWT, and attaches the user to <code>req.user</code> so downstream controllers know who is making the request.</p>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/middleware/authenticate.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> jwt = <span class="fn">require</span>(<span class="str">'jsonwebtoken'</span>);
<span class="kw">const</span> config = <span class="fn">require</span>(<span class="str">'../config'</span>);
<span class="kw">const</span> { <span class="cls">User</span> } = <span class="fn">require</span>(<span class="str">'../models'</span>);

<span class="kw">const</span> <span class="fn">authenticate</span> = <span class="kw">async</span> (req, res, next) => {
  <span class="kw">try</span> {
    <span class="kw">const</span> authHeader = req.headers[<span class="str">'authorization'</span>];
    <span class="kw">if</span> (!authHeader?.<span class="fn">startsWith</span>(<span class="str">'Bearer '</span>)) {
      <span class="kw">return</span> res.<span class="fn">status</span>(<span class="num">401</span>).<span class="fn">json</span>({ <span class="prop">success</span>: <span class="kw">false</span>, <span class="prop">error</span>: <span class="str">'No token provided'</span> });
    }

    <span class="kw">const</span> token = authHeader.<span class="fn">split</span>(<span class="str">' '</span>)[<span class="num">1</span>];
    <span class="kw">const</span> decoded = jwt.<span class="fn">verify</span>(token, config.jwt.secret); <span class="cmt">// throws if invalid/expired</span>

    <span class="kw">const</span> user = <span class="kw">await</span> <span class="cls">User</span>.<span class="fn">findByPk</span>(decoded.<span class="prop">userId</span>, {
      attributes: { exclude: [<span class="str">'password'</span>] } <span class="cmt">// never expose hash</span>
    });

    <span class="kw">if</span> (!user) <span class="kw">return</span> res.<span class="fn">status</span>(<span class="num">401</span>).<span class="fn">json</span>({ <span class="prop">error</span>: <span class="str">'User no longer exists'</span> });

    req.<span class="prop">user</span> = user; <span class="cmt">// attach for downstream use</span>
    <span class="fn">next</span>();
  } <span class="kw">catch</span> (err) {
    <span class="kw">if</span> (err.<span class="prop">name</span> === <span class="str">'JsonWebTokenError'</span>) <span class="kw">return</span> res.<span class="fn">status</span>(<span class="num">401</span>).<span class="fn">json</span>({ <span class="prop">error</span>: <span class="str">'Invalid token'</span> });
    <span class="kw">if</span> (err.<span class="prop">name</span> === <span class="str">'TokenExpiredError'</span>) <span class="kw">return</span> res.<span class="fn">status</span>(<span class="num">401</span>).<span class="fn">json</span>({ <span class="prop">error</span>: <span class="str">'Token expired'</span> });
    <span class="fn">next</span>(err);
  }
};
module.exports = <span class="fn">authenticate</span>;</code></pre></div>
<h2>Global Error Handling Middleware</h2>
<p>Error middleware has a special four-parameter signature <code>(err, req, res, next)</code>. It must be registered <em>last</em>, after all routes. Any <code>next(err)</code> call anywhere in the chain lands here.</p>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/middleware/errorHandler.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> config = <span class="fn">require</span>(<span class="str">'../config'</span>);

<span class="kw">const</span> <span class="fn">errorHandler</span> = (err, req, res, next) => {
  console.<span class="fn">error</span>(<span class="str">`ERROR [${new Date().toISOString()}]`</span>, err.<span class="prop">message</span>);

  <span class="cmt">// Sequelize validation errors</span>
  <span class="kw">if</span> (err.<span class="prop">name</span> === <span class="str">'SequelizeValidationError'</span>) {
    <span class="kw">const</span> details = err.<span class="prop">errors</span>.<span class="fn">map</span>(e => ({ <span class="prop">field</span>: e.<span class="prop">path</span>, <span class="prop">message</span>: e.<span class="prop">message</span> }));
    <span class="kw">return</span> res.<span class="fn">status</span>(<span class="num">422</span>).<span class="fn">json</span>({ <span class="prop">success</span>: <span class="kw">false</span>, <span class="prop">error</span>: <span class="str">'Validation failed'</span>, details });
  }
  <span class="cmt">// Sequelize unique constraint</span>
  <span class="kw">if</span> (err.<span class="prop">name</span> === <span class="str">'SequelizeUniqueConstraintError'</span>) {
    <span class="kw">return</span> res.<span class="fn">status</span>(<span class="num">409</span>).<span class="fn">json</span>({ <span class="prop">success</span>: <span class="kw">false</span>, <span class="prop">error</span>: <span class="str">'Resource already exists'</span> });
  }
  <span class="cmt">// Custom app errors with explicit statusCode</span>
  <span class="kw">if</span> (err.<span class="prop">statusCode</span>) {
    <span class="kw">return</span> res.<span class="fn">status</span>(err.<span class="prop">statusCode</span>).<span class="fn">json</span>({ <span class="prop">success</span>: <span class="kw">false</span>, <span class="prop">error</span>: err.<span class="prop">message</span> });
  }
  <span class="cmt">// Generic 500 — never expose internals in production</span>
  res.<span class="fn">status</span>(<span class="num">500</span>).<span class="fn">json</span>({
    <span class="prop">success</span>: <span class="kw">false</span>, <span class="prop">error</span>: <span class="str">'Internal server error'</span>,
    ...(config.env === <span class="str">'development'</span> && { <span class="prop">details</span>: err.<span class="prop">message</span> }),
  });
};
module.exports = <span class="fn">errorHandler</span>;</code></pre></div>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/app.js (final)</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> express = <span class="fn">require</span>(<span class="str">'express'</span>);
<span class="kw">const</span> cors = <span class="fn">require</span>(<span class="str">'cors'</span>), helmet = <span class="fn">require</span>(<span class="str">'helmet'</span>), morgan = <span class="fn">require</span>(<span class="str">'morgan'</span>);
<span class="kw">const</span> errorHandler = <span class="fn">require</span>(<span class="str">'./middleware/errorHandler'</span>);
<span class="kw">const</span> authRoutes = <span class="fn">require</span>(<span class="str">'./routes/auth'</span>);
<span class="kw">const</span> taskRoutes = <span class="fn">require</span>(<span class="str">'./routes/tasks'</span>);
<span class="kw">const</span> app = <span class="fn">express</span>();

app.<span class="fn">use</span>(<span class="fn">helmet</span>()); app.<span class="fn">use</span>(<span class="fn">cors</span>()); app.<span class="fn">use</span>(express.<span class="fn">json</span>()); app.<span class="fn">use</span>(<span class="fn">morgan</span>(<span class="str">'dev'</span>));
app.<span class="fn">use</span>(<span class="str">'/api/auth'</span>, authRoutes);
app.<span class="fn">use</span>(<span class="str">'/api/tasks'</span>, taskRoutes);
app.<span class="fn">use</span>((req, res) => res.<span class="fn">status</span>(<span class="num">404</span>).<span class="fn">json</span>({ <span class="prop">error</span>: <span class="str">`Route ${req.method} ${req.path} not found`</span> }));
app.<span class="fn">use</span>(errorHandler); <span class="cmt">// MUST be last</span>
module.exports = app;</code></pre></div>
<div class="callout success"><div class="callout-title">✅ Middleware Pipeline Complete</div><p>Security headers, CORS, body parsing, logging, JWT authentication, and centralized error handling — all wired in the correct order. Every request flows cleanly through this pipeline.</p></div>

<h2>Rate Limiting</h2>
<p>Rate limiting protects your API from abuse — brute-force attacks on auth endpoints, scrapers hammering your data, or accidental infinite loops in client code. It should be applied selectively: tighter limits on auth, more generous on read endpoints.</p>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/middleware/rateLimiter.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
<pre><code><span class="kw">const</span> rateLimit = <span class="fn">require</span>(<span class="str">'express-rate-limit'</span>);

<span class="cmt">// Strict limit for auth — prevents brute-force password attacks</span>
<span class="kw">const</span> authLimiter = <span class="fn">rateLimit</span>({
  windowMs: <span class="num">15</span> * <span class="num">60</span> * <span class="num">1000</span>, <span class="cmt">// 15 minutes</span>
  max: <span class="num">10</span>,                   <span class="cmt">// 10 attempts per window</span>
  message: { success: <span class="kw">false</span>, error: <span class="str">'Too many login attempts. Try again in 15 minutes.'</span> },
  standardHeaders: <span class="kw">true</span>,     <span class="cmt">// Return X-RateLimit-* headers</span>
  legacyHeaders: <span class="kw">false</span>,
});

<span class="cmt">// General API limit — prevents hammering data endpoints</span>
<span class="kw">const</span> apiLimiter = <span class="fn">rateLimit</span>({
  windowMs: <span class="num">60</span> * <span class="num">1000</span>, <span class="cmt">// 1 minute</span>
  max: <span class="num">200</span>,            <span class="cmt">// 200 requests per minute per IP</span>
  message: { success: <span class="kw">false</span>, error: <span class="str">'Rate limit exceeded. Slow down.'</span> },
  standardHeaders: <span class="kw">true</span>,
  legacyHeaders: <span class="kw">false</span>,
  <span class="cmt">// Skip rate limiting for trusted internal IPs</span>
  skip: (req) => req.ip === <span class="str">'127.0.0.1'</span>,
});

module.exports = { authLimiter, apiLimiter };</code></pre></div>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">Applying rate limits in routes</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
<pre><code><span class="kw">const</span> { authLimiter, apiLimiter } = <span class="fn">require</span>(<span class="str">'./middleware/rateLimiter'</span>);

<span class="cmt">// Global API limit</span>
app.<span class="fn">use</span>(<span class="str">'/api'</span>, apiLimiter);

<span class="cmt">// Stricter limit on auth routes only</span>
app.<span class="fn">use</span>(<span class="str">'/api/v1/auth/login'</span>, authLimiter);
app.<span class="fn">use</span>(<span class="str">'/api/v1/auth/register'</span>, authLimiter);</code></pre></div>
<h2>CORS Configuration</h2>
<p>CORS (Cross-Origin Resource Sharing) controls which domains can call your API from a browser. In development you might allow everything, but in production you should restrict it to your actual frontend domains.</p>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">CORS configuration</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
<pre><code><span class="kw">const</span> cors = <span class="fn">require</span>(<span class="str">'cors'</span>);
<span class="kw">const</span> config = <span class="fn">require</span>(<span class="str">'./config'</span>);

<span class="kw">const</span> ALLOWED_ORIGINS = {
  development: [<span class="str">'http://localhost:3000'</span>, <span class="str">'http://localhost:5173'</span>],
  production:  [<span class="str">'https://taskflow.app'</span>, <span class="str">'https://www.taskflow.app'</span>],
};

<span class="kw">const</span> corsOptions = {
  origin: (origin, callback) => {
    <span class="kw">const</span> allowed = ALLOWED_ORIGINS[config.env] || ALLOWED_ORIGINS.development;
    <span class="cmt">// Allow requests with no origin (mobile apps, Postman, curl)</span>
    <span class="kw">if</span> (!origin || allowed.<span class="fn">includes</span>(origin)) {
      callback(<span class="kw">null</span>, <span class="kw">true</span>);
    } <span class="kw">else</span> {
      callback(<span class="kw">new</span> <span class="cls">Error</span>(<span class="str">`Origin ${origin} not allowed by CORS`</span>));
    }
  },
  credentials: <span class="kw">true</span>,        <span class="cmt">// Allow cookies + auth headers</span>
  methods: [<span class="str">'GET'</span>, <span class="str">'POST'</span>, <span class="str">'PATCH'</span>, <span class="str">'PUT'</span>, <span class="str">'DELETE'</span>, <span class="str">'OPTIONS'</span>],
  allowedHeaders: [<span class="str">'Content-Type'</span>, <span class="str">'Authorization'</span>],
  maxAge: <span class="num">86400</span>,             <span class="cmt">// Cache preflight for 24 hours</span>
};

app.<span class="fn">use</span>(<span class="fn">cors</span>(corsOptions));</code></pre></div>
<h2>Request ID Middleware</h2>
<p>In distributed systems, you need a way to trace a request across all logs and services. Adding a unique request ID to every request makes debugging production issues dramatically easier.</p>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/middleware/requestId.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
<pre><code><span class="kw">const</span> { v4: uuidv4 } = <span class="fn">require</span>(<span class="str">'uuid'</span>);

<span class="kw">const</span> <span class="fn">requestId</span> = (req, res, next) => {
  <span class="cmt">// Use client-provided ID or generate a new one</span>
  req.<span class="prop">id</span> = req.headers[<span class="str">'x-request-id'</span>] || <span class="fn">uuidv4</span>();

  <span class="cmt">// Echo it back so clients can correlate their logs with yours</span>
  res.<span class="fn">set</span>(<span class="str">'X-Request-ID'</span>, req.<span class="prop">id</span>);
  <span class="fn">next</span>();
};

module.exports = <span class="fn">requestId</span>;

<span class="cmt">// In your logger, always include req.id:</span>
<span class="cmt">// logger.info('Task created', { requestId: req.id, taskId: task.id, userId: req.user.id });</span></code></pre></div>
</template>
<template id="tpl-postgres-setup"><div class="chapter-header"><div class="ch-eyebrow">Chapter 07 · Database</div><h1 class="ch-title">PostgreSQL Setup</h1><p class="ch-subtitle">PostgreSQL is the most capable open-source relational database. Before reaching for an ORM, you need to understand what's happening underneath — the data model, the SQL, and how Node talks to Postgres directly.</p></div>

<h2>Why PostgreSQL?</h2>
<p>PostgreSQL has been in continuous active development since 1986. It's ACID-compliant, meaning every transaction is Atomic, Consistent, Isolated, and Durable — your data is safe even if the server crashes mid-write. Beyond correctness, Postgres supports features most databases don't: native arrays, JSONB documents with indexing, full-text search, geometric types, and sophisticated window functions.</p>
<p>Compared to MySQL, Postgres is more standards-compliant, handles concurrent writes more reliably (MVCC with no read locks), and has better support for complex types. For a production API, it's an excellent default choice and the one we use throughout this course.</p>

<div class="concept-box"><h4>🔑 Key Terms</h4><p><strong>Database</strong> — a named collection of schemas, tables, and objects. You run many databases on one Postgres server.<br><strong>Schema</strong> — a namespace inside a database. The default is <code>public</code>. Think of it like a folder.<br><strong>Table</strong> — structured rows and columns, like a spreadsheet with enforced types.<br><strong>Index</strong> — a separate data structure that makes certain queries fast at the cost of storage and slower writes.<br><strong>Transaction</strong> — a group of SQL statements that either all succeed or all fail together (ACID atomicity).<br><strong>Migration</strong> — a versioned script that applies or reverts a schema change. Your database schema under version control.</p></div>

<h2>Installing and Connecting</h2>

<div class="code-block"><div class="code-header"><span class="code-lang">bash</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="cmt"># macOS (Homebrew)</span>
brew install postgresql@16
brew services start postgresql@16

<span class="cmt"># Ubuntu / Debian</span>
sudo apt update && sudo apt install postgresql postgresql-contrib
sudo systemctl start postgresql
sudo systemctl enable postgresql   <span class="cmt"># start on boot</span>

<span class="cmt"># Verify</span>
psql --version    <span class="cmt"># psql (PostgreSQL) 16.x</span>

<span class="cmt"># Connect as the default superuser</span>
psql -U postgres

<span class="cmt"># Create our databases</span>
CREATE DATABASE taskflow_dev;
CREATE DATABASE taskflow_test;
\q</code></pre></div>

<h2>Connecting from Node.js — the pg Pool</h2>
<p>The <code>pg</code> package (node-postgres) is the low-level Postgres driver for Node. Both Sequelize and Knex use it under the hood. The critical concept is using a <strong>connection pool</strong> rather than creating a new connection per query. Establishing a TCP connection + TLS handshake + Postgres authentication takes 20–100ms. A pool keeps connections alive and reuses them, making each query overhead essentially zero.</p>

<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/config/database.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> { <span class="cls">Pool</span> } = <span class="fn">require</span>(<span class="str">'pg'</span>);
<span class="kw">const</span> config = <span class="fn">require</span>(<span class="str">'.'</span>);

<span class="kw">const</span> pool = <span class="kw">new</span> <span class="cls">Pool</span>({
  host:     config.db.host,
  port:     config.db.port,
  database: config.db.name,
  user:     config.db.user,
  password: config.db.password,

  <span class="cmt">// Pool sizing: aim for (2 × CPU cores) + disk count per process</span>
  <span class="cmt">// With PM2 cluster (4 workers) × 5 = 20 total PG connections</span>
  max: <span class="num">5</span>,
  min: <span class="num">1</span>,                    <span class="cmt">// always keep 1 connection warm</span>
  idleTimeoutMillis: <span class="num">30000</span>, <span class="cmt">// release idle connections after 30s</span>
  connectionTimeoutMillis: <span class="num">3000</span>, <span class="cmt">// throw if can't connect in 3s</span>
});

<span class="cmt">// Confirm connectivity on startup — fail fast if DB is unreachable</span>
pool.<span class="fn">connect</span>()
  .<span class="fn">then</span>(client => {
    console.<span class="fn">log</span>(<span class="str">'✅ PostgreSQL connected'</span>);
    client.<span class="fn">release</span>();  <span class="cmt">// return the connection to the pool immediately</span>
  })
  .<span class="fn">catch</span>(err => {
    console.<span class="fn">error</span>(<span class="str">'❌ PostgreSQL connection failed:'</span>, err.<span class="prop">message</span>);
    process.<span class="fn">exit</span>(<span class="num">1</span>);   <span class="cmt">// no point starting without a database</span>
  });

module.exports = pool;</code></pre></div>

<h2>Raw Queries with pg</h2>
<p>Before Sequelize or Knex, let's see what direct queries look like. This is the foundation everything else builds on:</p>

<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">Raw pg queries</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> pool = <span class="fn">require</span>(<span class="str">'./config/database'</span>);

<span class="cmt">// ALWAYS use parameterized queries — never string concatenation</span>
<span class="cmt">// $1, $2 etc. are placeholders — pg escapes the values for you</span>
<span class="kw">async function</span> <span class="fn">getUserTasks</span>(userId, status) {
  <span class="kw">const</span> { rows } = <span class="kw">await</span> pool.<span class="fn">query</span>(
    <span class="str">`SELECT id, title, priority, due_date
     FROM tasks
     WHERE user_id = $1 AND status = $2
     ORDER BY due_date ASC NULLS LAST`</span>,
    [userId, status]   <span class="cmt">// values go here, never in the query string</span>
  );
  <span class="kw">return</span> rows;
}

<span class="cmt">// Multiple queries? Use a transaction to keep them atomic</span>
<span class="kw">async function</span> <span class="fn">transferTask</span>(taskId, fromUserId, toUserId) {
  <span class="kw">const</span> client = <span class="kw">await</span> pool.<span class="fn">connect</span>();
  <span class="kw">try</span> {
    <span class="kw">await</span> client.<span class="fn">query</span>(<span class="str">'BEGIN'</span>);
    <span class="kw">await</span> client.<span class="fn">query</span>(<span class="str">'UPDATE tasks SET user_id=$1 WHERE id=$2 AND user_id=$3'</span>, [toUserId, taskId, fromUserId]);
    <span class="kw">await</span> client.<span class="fn">query</span>(<span class="str">'INSERT INTO task_history(task_id,action,detail) VALUES($1,$2,$3)'</span>, [taskId, <span class="str">'transferred'</span>, <span class="str">`to ${toUserId}`</span>]);
    <span class="kw">await</span> client.<span class="fn">query</span>(<span class="str">'COMMIT'</span>);
  } <span class="kw">catch</span> (err) {
    <span class="kw">await</span> client.<span class="fn">query</span>(<span class="str">'ROLLBACK'</span>);  <span class="cmt">// undo everything if anything fails</span>
    <span class="kw">throw</span> err;
  } <span class="kw">finally</span> {
    client.<span class="fn">release</span>();  <span class="cmt">// always release back to pool, even on error</span>
  }
}</code></pre></div>

<div class="callout danger"><div class="callout-title">🚨 SQL Injection — Never Concatenate</div><p>This is critically important: <strong>never</strong> build queries with string concatenation like <code>`WHERE id = '${req.params.id}'`</code>. A malicious user sends <code>'; DROP TABLE users; --</code> as their ID and your database is gone. Parameterized queries (<code>$1, $2</code>) pass values separately — the driver ensures they can never be interpreted as SQL.</p></div>

<h2>Essential SQL You Must Know</h2>

<div class="code-block"><div class="code-header"><span class="code-lang">SQL</span><span class="code-filename">CRUD patterns</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="cmt">-- INSERT with RETURNING (Postgres-specific — gets the created row back)</span>
INSERT INTO tasks (id, title, status, priority, user_id, created_at, updated_at)
VALUES (gen_random_uuid(), 'Write tests', 'todo', 'high', $1, NOW(), NOW())
RETURNING *;

<span class="cmt">-- SELECT with JOIN — get tasks AND their project name in one query</span>
SELECT
  t.id, t.title, t.status, t.priority, t.due_date,
  p.name AS project_name,
  u.email AS owner_email
FROM tasks t
LEFT JOIN projects p ON p.id = t.project_id
JOIN users u ON u.id = t.user_id
WHERE t.user_id = $1
  AND t.status != 'archived'
ORDER BY t.due_date ASC NULLS LAST  -- NULLs go to the end
LIMIT $2 OFFSET $3;

<span class="cmt">-- UPDATE with RETURNING</span>
UPDATE tasks
SET status = 'done', completed_at = NOW(), updated_at = NOW()
WHERE id = $1 AND user_id = $2
RETURNING id, status, completed_at;

<span class="cmt">-- Aggregation — task counts grouped by status for a dashboard</span>
SELECT
  status,
  COUNT(*)                                    AS total,
  COUNT(*) FILTER (WHERE priority = 'urgent') AS urgent_count
FROM tasks
WHERE user_id = $1
GROUP BY status
ORDER BY status;</code></pre></div>

<h2>Indexes — Making Queries Fast</h2>
<p>An index is a separate data structure (usually a B-tree) that trades storage space and write speed for dramatically faster reads. Without an index on <code>user_id</code>, fetching a user's tasks requires a full table scan — reading every row to find the matching ones. With an index, Postgres jumps directly to the matching rows.</p>

<div class="code-block"><div class="code-header"><span class="code-lang">SQL</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="cmt">-- B-tree (default) — equality checks and range queries</span>
CREATE INDEX idx_tasks_user_id   ON tasks(user_id);
CREATE INDEX idx_tasks_status    ON tasks(status);
CREATE INDEX idx_tasks_due_date  ON tasks(due_date);

<span class="cmt">-- Composite — when you always filter on both columns together</span>
<span class="cmt">-- Column order matters: put the higher-cardinality one first</span>
CREATE INDEX idx_tasks_user_status ON tasks(user_id, status);

<span class="cmt">-- Unique — enforces uniqueness AND acts as an index</span>
CREATE UNIQUE INDEX idx_users_email ON users(email);

<span class="cmt">-- Partial — only indexes rows matching a condition (smaller &amp; faster)</span>
<span class="cmt">-- Great for queries that always exclude archived tasks</span>
CREATE INDEX idx_active_tasks ON tasks(user_id, priority)
  WHERE status NOT IN ('done', 'archived');

<span class="cmt">-- Check if your index is being used</span>
EXPLAIN ANALYZE
  SELECT * FROM tasks WHERE user_id = 'some-uuid' AND status = 'todo';
<span class="cmt">-- Look for "Index Scan" (good) vs "Seq Scan" (potentially slow)</span></code></pre></div>

<div class="callout info"><div class="callout-title">💡 Index Rule of Thumb</div><p>Add indexes to columns that appear in <code>WHERE</code>, <code>ORDER BY</code>, or <code>JOIN ON</code> clauses that you query frequently. Don't over-index — every index makes <code>INSERT</code>/<code>UPDATE</code>/<code>DELETE</code> slightly slower because Postgres must update the index too. For TaskFlow, start with indexes on all foreign keys and the <code>email</code> unique constraint, then add more as you identify slow queries with <code>EXPLAIN ANALYZE</code>.</p></div>

<h2>PostgreSQL Data Types Worth Knowing</h2>
<table>
<thead><tr><th>Type</th><th>Use for</th><th>Example</th></tr></thead>
<tbody>
<tr><td><code>UUID</code></td><td>Primary keys — no collision risk, safe to expose publicly</td><td><code>gen_random_uuid()</code></td></tr>
<tr><td><code>VARCHAR(n)</code></td><td>Short text with a max length</td><td>name, email, title</td></tr>
<tr><td><code>TEXT</code></td><td>Unbounded text — no length limit</td><td>description, body</td></tr>
<tr><td><code>TIMESTAMPTZ</code></td><td>Timestamps with timezone (always use this, not TIMESTAMP)</td><td>created_at, due_date</td></tr>
<tr><td><code>BOOLEAN</code></td><td>True/false flags</td><td>is_active, is_verified</td></tr>
<tr><td><code>INTEGER / BIGINT</code></td><td>Whole numbers</td><td>file size, counts</td></tr>
<tr><td><code>NUMERIC(p,s)</code></td><td>Exact decimals — use for money, never FLOAT</td><td>price, percentage</td></tr>
<tr><td><code>TEXT[]</code></td><td>Array of strings — Postgres native!</td><td>tags, permissions</td></tr>
<tr><td><code>JSONB</code></td><td>JSON with indexing support — faster than JSON</td><td>metadata, settings</td></tr>
<tr><td><code>ENUM</code></td><td>Fixed set of values — enforced at DB level</td><td>status, priority, role</td></tr>
</tbody></table>

<h2>What is an ORM?</h2>
<p>An ORM (Object-Relational Mapper) maps database tables to JavaScript classes. Instead of writing <code>SELECT * FROM tasks WHERE id = $1</code>, you write <code>Task.findByPk(id)</code>. The ORM translates method calls to SQL, handles type conversion, and adds abstraction. The tradeoff: common operations are fast to write, but complex queries can be harder to express than raw SQL.</p>

<h2>Wiring Models & Associations</h2>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/models/index.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> { <span class="cls">Sequelize</span> } = <span class="fn">require</span>(<span class="str">'sequelize'</span>);
<span class="kw">const</span> cfg = <span class="fn">require</span>(<span class="str">'../config/sequelize'</span>)[process.env.NODE_ENV || <span class="str">'development'</span>];
<span class="kw">const</span> sequelize = <span class="kw">new</span> <span class="cls">Sequelize</span>(cfg.database, cfg.username, cfg.password, cfg);

<span class="kw">const</span> <span class="cls">User</span>    = <span class="fn">require</span>(<span class="str">'./User'</span>)(sequelize);
<span class="kw">const</span> <span class="cls">Task</span>    = <span class="fn">require</span>(<span class="str">'./Task'</span>)(sequelize);
<span class="kw">const</span> <span class="cls">Project</span> = <span class="fn">require</span>(<span class="str">'./Project'</span>)(sequelize);

<span class="cmt">// Associations — these add foreign-key columns and helper methods</span>
<span class="cls">User</span>.<span class="fn">hasMany</span>(<span class="cls">Task</span>,    { foreignKey: <span class="str">'userId'</span>,   as: <span class="str">'tasks'</span> });
<span class="cls">Task</span>.<span class="fn">belongsTo</span>(<span class="cls">User</span>, { foreignKey: <span class="str">'userId'</span>,   as: <span class="str">'owner'</span> });

<span class="cls">User</span>.<span class="fn">hasMany</span>(<span class="cls">Project</span>,    { foreignKey: <span class="str">'ownerId'</span>, as: <span class="str">'projects'</span> });
<span class="cls">Project</span>.<span class="fn">belongsTo</span>(<span class="cls">User</span>, { foreignKey: <span class="str">'ownerId'</span>, as: <span class="str">'owner'</span> });

<span class="cls">Project</span>.<span class="fn">hasMany</span>(<span class="cls">Task</span>,    { foreignKey: <span class="str">'projectId'</span>, as: <span class="str">'tasks'</span> });
<span class="cls">Task</span>.<span class="fn">belongsTo</span>(<span class="cls">Project</span>, { foreignKey: <span class="str">'projectId'</span>, as: <span class="str">'project'</span> });

module.exports = { sequelize, <span class="cls">Sequelize</span>, <span class="cls">User</span>, <span class="cls">Task</span>, <span class="cls">Project</span> };</code></pre></div>
<h2>Migrations</h2>
<p>Migrations are versioned scripts that describe exactly how to change your schema — and how to reverse those changes. This puts your database schema under version control alongside your code.</p>
<div class="code-block"><div class="code-header"><span class="code-lang">bash</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code>npx sequelize-cli migration:generate --name create-users-table
npx sequelize-cli db:migrate          <span class="cmt"># run all pending</span>
npx sequelize-cli db:migrate:undo     <span class="cmt"># undo last batch</span></code></pre></div>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/migrations/20240101-create-users.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="str">'use strict'</span>;
module.exports = {
  <span class="kw">async</span> <span class="fn">up</span>(queryInterface, <span class="cls">Sequelize</span>) {
    <span class="kw">await</span> queryInterface.<span class="fn">createTable</span>(<span class="str">'users'</span>, {
      id:        { type: <span class="cls">Sequelize</span>.<span class="cls">UUID</span>, defaultValue: <span class="cls">Sequelize</span>.<span class="cls">UUIDV4</span>, primaryKey: <span class="kw">true</span> },
      name:      { type: <span class="cls">Sequelize</span>.<span class="cls">STRING</span>, allowNull: <span class="kw">false</span> },
      email:     { type: <span class="cls">Sequelize</span>.<span class="cls">STRING</span>, allowNull: <span class="kw">false</span>, unique: <span class="kw">true</span> },
      password:  { type: <span class="cls">Sequelize</span>.<span class="cls">STRING</span>, allowNull: <span class="kw">false</span> },
      role:      { type: <span class="cls">Sequelize</span>.<span class="cls">ENUM</span>(<span class="str">'user'</span>,<span class="str">'admin'</span>), defaultValue: <span class="str">'user'</span> },
      avatarUrl: { type: <span class="cls">Sequelize</span>.<span class="cls">STRING</span>, allowNull: <span class="kw">true</span> },
      createdAt: { type: <span class="cls">Sequelize</span>.<span class="cls">DATE</span>, allowNull: <span class="kw">false</span> },
