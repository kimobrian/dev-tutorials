<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Node.js Mastery — From Zero to Production</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
<style>

:root{--bg:#0c0e14;--surface:#13161f;--surface2:#1a1d28;--border:#252836;--accent:#f0c14b;--accent2:#4bf0a0;--accent3:#4baef0;--text:#e8e6f0;--text-muted:#7a7a99;--text-dim:#4a4a66;--danger:#f05a4b;--code-bg:#0a0c12;--sidebar-w:300px;--header-h:64px;--radius:10px;--font-display:'Syne',sans-serif;--font-body:'Lora',serif;--font-mono:'JetBrains Mono',monospace}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:16px;line-height:1.8;min-height:100vh}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-dim)}
#app{display:flex;min-height:100vh}
#sidebar{width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);position:fixed;top:0;left:0;height:100vh;display:flex;flex-direction:column;z-index:100;transition:transform 0.3s ease}
#sidebar-header{padding:24px 20px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.logo-mark{display:flex;align-items:center;gap:10px;margin-bottom:14px;cursor:pointer}
.logo-icon{width:36px;height:36px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:700;font-size:14px;color:#0c0e14;flex-shrink:0}
.logo-text{font-family:var(--font-display);font-weight:700;font-size:15px;color:var(--text);line-height:1.3}
.logo-sub{font-family:var(--font-display);font-size:10px;font-weight:500;color:var(--text-muted);letter-spacing:.1em;text-transform:uppercase}
.search-wrap{position:relative}
#search-input{width:100%;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-family:var(--font-mono);font-size:12px;padding:8px 12px 8px 34px;border-radius:6px;outline:none;transition:border-color .2s}
#search-input:focus{border-color:var(--accent)}
#search-input::placeholder{color:var(--text-dim)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-dim);font-size:13px;pointer-events:none}
#search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);max-height:300px;overflow-y:auto;z-index:200;display:none}
#search-results.active{display:block}
.search-result-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .15s}
.search-result-item:last-child{border-bottom:none}
.search-result-item:hover{background:var(--border)}
.sri-title{font-family:var(--font-display);font-size:12px;font-weight:600;color:var(--accent);margin-bottom:2px}
.sri-excerpt{font-size:11px;color:var(--text-muted);line-height:1.4;font-family:var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#nav-scroll{flex:1;overflow-y:auto;padding:12px 0 24px}
.nav-group-label{font-family:var(--font-mono);font-size:9px;font-weight:500;letter-spacing:.15em;text-transform:uppercase;color:var(--text-dim);padding:10px 20px 4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 20px;cursor:pointer;transition:all .15s;border-left:2px solid transparent;font-family:var(--font-display);font-size:13px;font-weight:500;color:var(--text-muted);text-decoration:none}
.nav-item:hover{color:var(--text);background:rgba(240,193,75,.05);border-left-color:var(--text-dim)}
.nav-item.active{color:var(--accent);background:rgba(240,193,75,.08);border-left-color:var(--accent)}
.nav-num{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);width:20px;flex-shrink:0}
.nav-item.active .nav-num{color:var(--accent)}
.progress-bar-wrap{padding:16px 20px;border-top:1px solid var(--border);flex-shrink:0}
.progress-label{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10px;color:var(--text-dim);margin-bottom:6px}
.progress-track{height:3px;background:var(--border);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;transition:width .4s ease}
#main{margin-left:var(--sidebar-w);flex:1;min-height:100vh;display:flex;flex-direction:column}
#topbar{height:var(--header-h);background:rgba(12,14,20,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:50;display:flex;align-items:center;padding:0 40px;gap:16px}
#menu-toggle{display:none;background:none;border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;cursor:pointer;font-size:14px}
.breadcrumb{font-family:var(--font-mono);font-size:12px;color:var(--text-muted);flex:1}
.breadcrumb span{color:var(--accent)}
.chapter-badge{background:var(--surface2);border:1px solid var(--border);padding:4px 12px;border-radius:20px;font-family:var(--font-mono);font-size:11px;color:var(--text-muted)}
#content-area{padding:60px 64px 40px;max-width:860px;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.home-hero{padding:40px 0 60px}
.home-eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:20px}
.home-title{font-family:var(--font-display);font-size:clamp(36px,5vw,60px);font-weight:800;line-height:1.1;margin-bottom:20px;letter-spacing:-.02em}
.home-title em{font-style:normal;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.home-desc{font-size:18px;color:var(--text-muted);max-width:560px;margin-bottom:40px;line-height:1.7}
.tech-stack{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:50px}
.tech-pill{background:var(--surface2);border:1px solid var(--border);padding:6px 14px;border-radius:20px;font-family:var(--font-mono);font-size:12px;color:var(--text-muted);transition:all .2s}
.tech-pill.highlight{background:rgba(240,193,75,.1);border-color:rgba(240,193,75,.3);color:var(--accent)}
.chapter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin-top:20px}
.chapter-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.chapter-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));opacity:0;transition:opacity .2s}
.chapter-card:hover{border-color:rgba(240,193,75,.3);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.3)}
.chapter-card:hover::before{opacity:1}
.cc-num{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);margin-bottom:6px}
.cc-title{font-family:var(--font-display);font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px;line-height:1.3}
.cc-desc{font-size:12px;color:var(--text-muted);line-height:1.5;font-family:var(--font-mono)}
.chapter-header{margin-bottom:48px;padding-bottom:32px;border-bottom:1px solid var(--border)}
.ch-eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.ch-title{font-family:var(--font-display);font-size:clamp(28px,4vw,44px);font-weight:800;letter-spacing:-.02em;line-height:1.15;margin-bottom:16px;color:var(--text)}
.ch-subtitle{font-size:17px;color:var(--text-muted);max-width:600px;line-height:1.7}
.section{margin-bottom:48px}
h2{font-family:var(--font-display);font-size:24px;font-weight:700;color:var(--text);margin-bottom:16px;margin-top:48px;letter-spacing:-.01em}
h2:first-child{margin-top:0}
h3{font-family:var(--font-display);font-size:18px;font-weight:600;color:var(--text);margin-bottom:12px;margin-top:32px}
p{margin-bottom:18px;color:var(--text-muted);line-height:1.8}
p strong{color:var(--text);font-weight:600}
p em{color:var(--accent2);font-style:normal}
.code-block{background:var(--code-bg);border:1px solid var(--border);border-radius:var(--radius);margin:24px 0;overflow:hidden}
.code-header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(255,255,255,.03);border-bottom:1px solid var(--border)}
.code-lang{font-family:var(--font-mono);font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:.1em}
.code-filename{font-family:var(--font-mono);font-size:11px;color:var(--text-dim)}
.copy-btn{background:none;border:1px solid var(--border);color:var(--text-dim);font-family:var(--font-mono);font-size:10px;padding:3px 10px;border-radius:4px;cursor:pointer;transition:all .2s;text-transform:uppercase;letter-spacing:.05em}
.copy-btn:hover{color:var(--text);border-color:var(--text-muted)}
.copy-btn.copied{color:var(--accent2);border-color:var(--accent2)}
pre{padding:20px;overflow-x:auto;font-family:var(--font-mono);font-size:13.5px;line-height:1.7;color:#c9d1d9}
code{font-family:var(--font-mono);font-size:13px;background:rgba(240,193,75,.1);color:var(--accent);padding:2px 6px;border-radius:4px}
pre code{background:none;color:inherit;padding:0;font-size:inherit}
.kw{color:#ff7b72}.fn{color:#d2a8ff}.str{color:#a5d6ff}.num{color:#79c0ff}.cmt{color:#8b949e;font-style:italic}.cls{color:#ffa657}.prop{color:#79c0ff}.op{color:#ff7b72}
.callout{padding:18px 20px;border-radius:var(--radius);margin:24px 0;border-left:3px solid;font-size:15px;line-height:1.7}
.callout-title{font-family:var(--font-display);font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:6px}
.callout p{margin-bottom:0}
.callout.info{background:rgba(75,174,240,.08);border-color:var(--accent3)}
.callout.info .callout-title{color:var(--accent3)}
.callout.info p{color:#9bc8f0}
.callout.warning{background:rgba(240,193,75,.08);border-color:var(--accent)}
.callout.warning .callout-title{color:var(--accent)}
.callout.warning p{color:#c9a84a}
.callout.success{background:rgba(75,240,160,.08);border-color:var(--accent2)}
.callout.success .callout-title{color:var(--accent2)}
.callout.success p{color:#7ddbb0}
.callout.danger{background:rgba(240,90,75,.08);border-color:var(--danger)}
.callout.danger .callout-title{color:var(--danger)}
.callout.danger p{color:#e08080}
ul,ol{margin:16px 0 20px 0;padding-left:24px;color:var(--text-muted)}
li{margin-bottom:8px;line-height:1.7}
li::marker{color:var(--accent)}
.concept-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:24px 28px;margin:28px 0}
.concept-box h4{font-family:var(--font-display);font-size:13px;font-weight:600;color:var(--accent2);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}
.steps{margin:28px 0}
.step{display:flex;gap:18px;margin-bottom:28px;align-items:flex-start}
.step-num{width:32px;height:32px;background:rgba(240,193,75,.1);border:1px solid rgba(240,193,75,.3);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--accent);flex-shrink:0;margin-top:3px}
.step-body h4{font-family:var(--font-display);font-size:16px;font-weight:600;color:var(--text);margin-bottom:6px}
.step-body p{margin-bottom:8px}
table{width:100%;border-collapse:collapse;margin:24px 0;font-size:14px}
th{background:var(--surface2);font-family:var(--font-display);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);padding:12px 16px;text-align:left;border-bottom:2px solid var(--border)}
td{padding:12px 16px;border-bottom:1px solid var(--border);color:var(--text-muted);font-family:var(--font-mono);font-size:13px}
tr:hover td{background:rgba(255,255,255,.02)}
.chapter-nav{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:64px;padding-top:40px;border-top:1px solid var(--border)}
.nav-btn{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;text-decoration:none;color:inherit}
.nav-btn:hover{border-color:rgba(240,193,75,.4);background:rgba(240,193,75,.04);transform:translateY(-2px)}
.nav-btn.prev{align-items:flex-start}
.nav-btn.next{align-items:flex-end}
.nav-btn.placeholder{pointer-events:none;opacity:.3}
.nav-btn-direction{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:var(--text-dim);margin-bottom:6px}
.nav-btn.prev .nav-btn-direction::before{content:'← '}
.nav-btn.next .nav-btn-direction::after{content:' →'}
.nav-btn-title{font-family:var(--font-display);font-size:14px;font-weight:600;color:var(--text);line-height:1.3;text-align:inherit}
.nav-btn-num{font-family:var(--font-mono);font-size:11px;color:var(--accent);margin-bottom:4px}
#footer{margin-top:auto;padding:32px 64px;border-top:1px solid var(--border);font-family:var(--font-mono);font-size:11px;color:var(--text-dim);display:flex;justify-content:space-between;align-items:center}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:99}
.app-diagram{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:28px;margin:24px 0;font-family:var(--font-mono);font-size:13px}
.app-diagram pre{padding:0;color:var(--text-muted);font-size:13px}
.divider{height:1px;background:var(--border);margin:40px 0}
hr{display:none}
@media(max-width:900px){#sidebar{transform:translateX(-100%)}#sidebar.open{transform:translateX(0)}#overlay.active{display:block}#main{margin-left:0}#menu-toggle{display:block}#content-area{padding:40px 24px 32px}#footer{padding:24px;flex-direction:column;gap:8px;text-align:center}.chapter-nav{grid-template-columns:1fr}#topbar{padding:0 20px}}
@media(max-width:600px){.chapter-grid{grid-template-columns:1fr}}


/* ═══════════════════════════════════════
   SEARCH TRIGGER BUTTON
═══════════════════════════════════════ */
.search-trigger {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 10px;
  cursor: pointer;
  transition: all 0.2s;
  color: var(--text-dim);
  font-family: var(--font-mono);
  font-size: 12px;
  text-align: left;
}
.search-trigger:hover {
  border-color: rgba(240,193,75,.4);
  color: var(--text-muted);
  background: rgba(240,193,75,.04);
}
.search-icon-btn {
  font-size: 14px;
  color: var(--text-dim);
  flex-shrink: 0;
}
.search-trigger-text {
  flex: 1;
}
.search-kbd {
  background: var(--border);
  border: 1px solid var(--text-dim);
  border-radius: 3px;
  padding: 1px 5px;
  font-size: 10px;
  color: var(--text-dim);
  flex-shrink: 0;
}

/* ═══════════════════════════════════════
   SEARCH MODAL OVERLAY
═══════════════════════════════════════ */
.search-modal {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding-top: clamp(60px, 12vh, 140px);
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.2s ease, visibility 0.2s ease;
}
.search-modal.open {
  opacity: 1;
  visibility: visible;
}
.search-modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(6, 8, 12, 0.75);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.search-modal-box {
  position: relative;
  width: min(680px, calc(100vw - 32px));
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: 0 24px 64px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.04);
  overflow: hidden;
  transform: translateY(-12px) scale(0.98);
  transition: transform 0.22s cubic-bezier(0.34,1.56,0.64,1);
  max-height: calc(100vh - 160px);
  display: flex;
  flex-direction: column;
}
.search-modal.open .search-modal-box {
  transform: translateY(0) scale(1);
}

/* ── Header ── */
.search-modal-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  background: rgba(255,255,255,.02);
  flex-shrink: 0;
}
.search-modal-icon {
  font-size: 18px;
  color: var(--accent);
  flex-shrink: 0;
}
.search-modal-input {
  flex: 1;
  background: none;
  border: none;
  outline: none;
  color: var(--text);
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 500;
  caret-color: var(--accent);
}
.search-modal-input::placeholder {
  color: var(--text-dim);
  font-weight: 400;
}
.search-modal-close {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 3px 8px;
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
  cursor: pointer;
  flex-shrink: 0;
  transition: all 0.15s;
}
.search-modal-close:hover {
  color: var(--text);
  border-color: var(--text-muted);
}

/* ── Results list ── */
.search-modal-results {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
  min-height: 160px;
  max-height: 460px;
}

/* ── Empty / initial state ── */
.search-modal-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 24px;
  text-align: center;
}
.search-empty-icon {
  font-size: 36px;
  color: var(--text-dim);
  margin-bottom: 12px;
  opacity: 0.5;
}
.search-empty-title {
  font-family: var(--font-display);
  font-size: 16px;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 6px;
}
.search-empty-sub {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-dim);
  max-width: 280px;
  line-height: 1.6;
}

/* ── No results ── */
.search-no-results {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
  text-align: center;
}
.search-no-results-title {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 4px;
}
.search-no-results-sub {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-dim);
}

/* ── Result items ── */
.search-result-row {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 12px 14px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.12s, transform 0.1s;
  outline: none;
  border: 1px solid transparent;
  margin-bottom: 2px;
}
.search-result-row:hover,
.search-result-row.selected {
  background: rgba(240, 193, 75, 0.07);
  border-color: rgba(240, 193, 75, 0.18);
  transform: translateX(2px);
}
.search-result-row.selected {
  background: rgba(240, 193, 75, 0.10);
}
.search-result-num {
  font-family: var(--font-mono);
  font-size: 10px;
  color: var(--text-dim);
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 3px 7px;
  flex-shrink: 0;
  margin-top: 2px;
  min-width: 42px;
  text-align: center;
}
.search-result-row.selected .search-result-num {
  background: rgba(240,193,75,.15);
  border-color: rgba(240,193,75,.35);
  color: var(--accent);
}
.search-result-body {
  flex: 1;
  min-width: 0;
}
.search-result-title {
  font-family: var(--font-display);
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 3px;
  line-height: 1.3;
}

<template id="tpl-what-is-nodejs">
<div class="chapter-header"><div class="ch-eyebrow">Chapter 01 · Foundation</div><h1 class="ch-title">What is Node.js?</h1><p class="ch-subtitle">Before writing a single line of code, you need to understand what makes Node.js different — and why that difference matters enormously for building fast servers.</p></div>
<h2>The Traditional Problem</h2>
<p>Before Node.js, building high-performance server-side JavaScript was impossible. Browsers had JavaScript engines, but there was no way to run JS outside a browser. Most web servers used a <strong>thread-per-request model</strong>: every incoming HTTP request got its own dedicated OS thread. With ten users, fine. With ten thousand concurrent users, those threads consume memory like crazy while sitting idle waiting for I/O — disk reads, database queries, network calls.</p>
<div class="concept-box"><h4>🧵 What's a thread?</h4><p>A thread is an independent sequence of execution. Each thread has its own stack memory. Spawning thousands of threads is expensive — each consumes ~1–8MB of stack memory, and the OS overhead of switching between them (context switching) adds up fast.</p></div>
<h2>Enter Node.js (2009)</h2>
<p>Ryan Dahl's insight was elegant: <strong>take Chrome's V8 JavaScript engine — the fastest JS engine ever built — and run it server-side.</strong> Instead of threads for concurrency, use an <em>event loop</em>. Node.js was released in 2009 and changed server-side development forever. Not because JavaScript was perfect, but because its architecture allowed a single process to handle thousands of concurrent connections with very low memory overhead.</p>
<h2>The V8 Engine</h2>
<p>V8 is Google's open-source JavaScript engine, written in C++. It compiles JavaScript directly to native machine code instead of interpreting it, making it extraordinarily fast. When you install Node.js, you're installing V8 plus C++ bindings that give JavaScript access to the operating system — file system, network, processes.</p>
<div class="callout info"><div class="callout-title">💡 Fun Fact</div><p>The same V8 engine that powers Chrome also powers Node.js. When Google improves V8 for Chrome, Node.js gets those performance benefits for free.</p></div>
<h2>The Event Loop — The Heart of Node.js</h2>
<p>Node.js runs in a <strong>single thread</strong>. This sounds like a weakness, but it's paired with a superpower: <strong>non-blocking I/O</strong>. When Node needs to do something slow — read a file, query a database, call an API — it doesn't stop and wait. It says: <em>"Hey OS, start this I/O and call me back when done."</em> Then it moves on. When the OS signals completion, the event loop picks up the callback and runs it.</p>
<div class="app-diagram"><pre>
  Incoming Requests
        │
        ▼
  ┌─────────────────────────────────┐
  │         Event Loop              │
  │  ┌─────────┐   ┌─────────────┐ │
  │  │  Call   │   │  Callback   │ │
  │  │  Stack  │   │  Queue      │ │
  │  └────┬────┘   └──────┬──────┘ │
  │       └───────────────┘        │
  └─────────────────────────────────┘
        │
        ▼
  ┌─────────────────────────────────┐
  │     libuv Thread Pool           │
  │  (File I/O, DNS, Crypto, etc.)  │
  └─────────────────────────────────┘</pre></div>
<h3>Blocking vs Non-Blocking</h3>
<p>Imagine a coffee shop. In the <strong>blocking model</strong>, one barista handles each customer start-to-finish before moving on. In the <strong>non-blocking model</strong> (Node's model), the barista takes your order, starts the machine, then immediately takes the next order. When your coffee is ready, a notification goes off. One thread, many customers served.</p>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">blocking-vs-nonblocking.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="cmt">// BLOCKING — pauses everything until file is read</span>
<span class="kw">const</span> fs = <span class="fn">require</span>(<span class="str">'fs'</span>);
<span class="kw">const</span> data = fs.<span class="fn">readFileSync</span>(<span class="str">'/large-file.txt'</span>, <span class="str">'utf8'</span>);
console.<span class="fn">log</span>(data);          <span class="cmt">// Nothing else runs until this finishes</span>
console.<span class="fn">log</span>(<span class="str">'After file'</span>); <span class="cmt">// Only runs after file is fully read</span>

<span class="cmt">// NON-BLOCKING — keeps the loop free</span>
fs.<span class="fn">readFile</span>(<span class="str">'/large-file.txt'</span>, <span class="str">'utf8'</span>, (err, data) => {
  <span class="kw">if</span> (err) <span class="kw">throw</span> err;
  console.<span class="fn">log</span>(data); <span class="cmt">// Runs when OS signals the file is ready</span>
});
console.<span class="fn">log</span>(<span class="str">'Registers callback & continues IMMEDIATELY'</span>);
<span class="cmt">// ↑ This prints BEFORE the file is even read!</span></code></pre></div>
<h2>Async/Await — Modern Non-Blocking Code</h2>
<p>Modern Node.js uses <code>async/await</code> which reads like synchronous code but is fully non-blocking. The <code>await</code> keyword pauses execution <em>within the async function</em>, but crucially does <strong>not</strong> block the event loop — other callbacks can still run while awaiting.</p>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">async-patterns.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> fs = <span class="fn">require</span>(<span class="str">'fs/promises'</span>); <span class="cmt">// Promise-based fs</span>

<span class="cmt">// Old callback style (avoid)</span>
fs.<span class="fn">readFile</span>(<span class="str">'file.txt'</span>, <span class="str">'utf8'</span>, (err, data) => { <span class="cmt">/* ... */</span> });

<span class="cmt">// Async/await (preferred)</span>
<span class="kw">async function</span> <span class="fn">readMyFile</span>() {
  <span class="kw">try</span> {
    <span class="kw">const</span> data = <span class="kw">await</span> fs.<span class="fn">readFile</span>(<span class="str">'file.txt'</span>, <span class="str">'utf8'</span>);
    console.<span class="fn">log</span>(data);
  } <span class="kw">catch</span> (err) {
    console.<span class="fn">error</span>(<span class="str">'Failed:'</span>, err.<span class="prop">message</span>);
  }
}
<span class="fn">readMyFile</span>();</code></pre></div>
<h2>Event Loop Phases</h2>
<table><thead><tr><th>Phase</th><th>What it processes</th></tr></thead><tbody>
<tr><td>timers</td><td>Callbacks from <code>setTimeout</code> and <code>setInterval</code></td></tr>
<tr><td>pending callbacks</td><td>I/O callbacks deferred to next loop</td></tr>
<tr><td>poll</td><td>Retrieve new I/O events; execute I/O callbacks</td></tr>
<tr><td>check</td><td>Callbacks from <code>setImmediate</code></td></tr>
<tr><td>close callbacks</td><td>Close events (e.g., <code>socket.on('close')</code>)</td></tr>
</tbody></table>
<div class="callout warning"><div class="callout-title">⚠️ Don't Block the Event Loop</div><p>Any synchronous CPU-heavy operation — complex calculations, synchronous file reads, large JSON parsing — blocks the entire event loop and makes your server unresponsive. Keep synchronous work fast, or offload heavy computation to worker threads.</p></div>
<div class="callout success"><div class="callout-title">✅ What We're Building</div><p>Throughout this course we build <strong>TaskFlow</strong> — a full-featured task management API. By chapter 19, it handles authentication, projects, file uploads, fuzzy search, and is production-ready. Let's start.</p></div>

<h2>Streams — Node's Hidden Superpower</h2>
<p>One concept that separates senior Node.js developers from beginners is understanding <strong>streams</strong>. A stream is an abstract interface for working with streaming data — data that arrives or is processed piece by piece rather than all at once.</p>
<p>Imagine reading a 2GB log file. Loading it entirely into memory before processing would consume 2GB of RAM. With streams, you process it in small chunks — using perhaps 64KB of memory regardless of file size.</p>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">streams-intro.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
<pre><code><span class="kw">const</span> fs = <span class="fn">require</span>(<span class="str">'fs'</span>);
<span class="kw">const</span> readline = <span class="fn">require</span>(<span class="str">'readline'</span>);

<span class="cmt">// Without streams: loads entire file into memory — dangerous for large files</span>
<span class="kw">const</span> data = fs.<span class="fn">readFileSync</span>(<span class="str">'huge-log.txt'</span>, <span class="str">'utf8'</span>); <span class="cmt">// ❌ 2GB in RAM</span>

<span class="cmt">// With streams: process line-by-line, tiny memory footprint</span>
<span class="kw">const</span> rl = readline.<span class="fn">createInterface</span>({
  input: fs.<span class="fn">createReadStream</span>(<span class="str">'huge-log.txt'</span>),
  crlfDelay: <span class="cls">Infinity</span>,
});

<span class="kw">let</span> errorCount = <span class="num">0</span>;
rl.<span class="fn">on</span>(<span class="str">'line'</span>, (line) => {
  <span class="kw">if</span> (line.<span class="fn">includes</span>(<span class="str">'ERROR'</span>)) errorCount++;
});
rl.<span class="fn">on</span>(<span class="str">'close'</span>, () => {
  console.<span class="fn">log</span>(<span class="str">`Found ${errorCount} errors`</span>); <span class="cmt">// ✅ uses ~64KB of RAM</span>
});

<span class="cmt">// Piping — chain streams elegantly</span>
<span class="cmt">// Read a file, compress it, write the result — all streamed</span>
<span class="kw">const</span> zlib = <span class="fn">require</span>(<span class="str">'zlib'</span>);
fs.<span class="fn">createReadStream</span>(<span class="str">'input.txt'</span>)
  .<span class="fn">pipe</span>(zlib.<span class="fn">createGzip</span>())
  .<span class="fn">pipe</span>(fs.<span class="fn">createWriteStream</span>(<span class="str">'input.txt.gz'</span>))
  .<span class="fn">on</span>(<span class="str">'finish'</span>, () => console.<span class="fn">log</span>(<span class="str">'Compressed!'</span>));</code></pre></div>
<h2>Worker Threads — Escaping the Single Thread</h2>
<p>The event loop is single-threaded, which means CPU-heavy work blocks everything. For intensive tasks — image resizing, heavy JSON parsing, cryptographic operations, machine learning inference — you can offload work to <strong>Worker Threads</strong>, which run in their own threads and communicate via messages.</p>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">worker-example.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
<pre><code><span class="kw">const</span> { Worker, isMainThread, parentPort, workerData } = <span class="fn">require</span>(<span class="str">'worker_threads'</span>);

<span class="kw">if</span> (isMainThread) {
  <span class="cmt">// Main thread: spawn a worker for heavy computation</span>
  <span class="kw">const</span> worker = <span class="kw">new</span> <span class="cls">Worker</span>(__filename, {
    workerData: { numbers: [<span class="num">1</span>, <span class="num">2</span>, <span class="num">3</span>, <span class="num">4</span>, <span class="num">5</span>, <span class="num">6</span>, <span class="num">7</span>, <span class="num">8</span>] }
  });

  worker.<span class="fn">on</span>(<span class="str">'message'</span>, (result) => {
    console.<span class="fn">log</span>(<span class="str">'Result from worker:'</span>, result); <span class="cmt">// event loop never blocked</span>
  });

  worker.<span class="fn">on</span>(<span class="str">'error'</span>, console.<span class="prop">error</span>);

  <span class="cmt">// The main thread is still free to handle other requests</span>
  console.<span class="fn">log</span>(<span class="str">'Main thread free while worker runs...'</span>);

} <span class="kw">else</span> {
  <span class="cmt">// Worker thread: runs independently, won't block the event loop</span>
  <span class="kw">const</span> { numbers } = workerData;
  <span class="kw">const</span> sum = numbers.<span class="fn">reduce</span>((a, b) => a + b, <span class="num">0</span>);
  parentPort.<span class="fn">postMessage</span>({ sum, count: numbers.<span class="prop">length</span> });
}</code></pre></div>
<div class="callout info"><div class="callout-title">💡 When to use Worker Threads</div><p>Use Worker Threads for CPU-bound work that takes >10ms: image/video processing, PDF generation, complex data transformations, encryption of large payloads. For I/O-bound work (database, network), the event loop handles it natively — no workers needed.</p></div>
</template>
