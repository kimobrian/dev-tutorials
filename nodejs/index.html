<h3>fork() for Node-to-Node IPC</h3>
<p><code>fork()</code> is the cleanest API for spawning a second Node.js process. Both the parent and child can send and receive structured JavaScript objects — no manual serialization needed.</p>

<div class="code-block">
  <div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">workers/pdfGenerator.js  (child process)</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
  <pre><code><span class="cmt">// This file runs as a separate process spawned by fork()</span>
<span class="kw">const</span> PDFLib = <span class="fn">require</span>(<span class="str">'pdf-lib'</span>); <span class="cmt">// heavy dependency, loaded once per worker</span>

process.<span class="fn">on</span>(<span class="str">'message'</span>, <span class="kw">async</span> (job) => {
  <span class="kw">try</span> {
    console.<span class="fn">log</span>(<span class="str">`Worker ${process.pid}: generating PDF for task ${job.taskId}`</span>);
    <span class="kw">const</span> pdfBytes = <span class="kw">await</span> <span class="fn">generatePDF</span>(job);  <span class="cmt">// CPU-intensive</span>

    <span class="cmt">// Send result back to parent — objects are automatically serialized</span>
    process.<span class="fn">send</span>({ status: <span class="str">'done'</span>, taskId: job.<span class="prop">taskId</span>, bytes: pdfBytes.<span class="prop">length</span> });
  } <span class="kw">catch</span> (err) {
    process.<span class="fn">send</span>({ status: <span class="str">'error'</span>, taskId: job.<span class="prop">taskId</span>, error: err.<span class="prop">message</span> });
  }
});

<span class="cmt">// Tell parent we're ready to receive jobs</span>
process.<span class="fn">send</span>({ status: <span class="str">'ready'</span> });</code></pre>
</div>

<div class="code-block">
  <div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/services/pdfService.js  (parent)</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
  <pre><code><span class="kw">const</span> { fork } = <span class="fn">require</span>(<span class="str">'child_process'</span>);
<span class="kw">const</span> path = <span class="fn">require</span>(<span class="str">'path'</span>);

<span class="cmt">// Create one persistent worker process on startup — not one per request!</span>
<span class="kw">const</span> pdfWorker = <span class="fn">fork</span>(path.<span class="fn">join</span>(__dirname, <span class="str">'../../workers/pdfGenerator.js'</span>));

<span class="cmt">// Track pending jobs to match responses to their resolve/reject</span>
<span class="kw">const</span> pending = <span class="kw">new</span> <span class="cls">Map</span>();

pdfWorker.<span class="fn">on</span>(<span class="str">'message'</span>, ({ status, taskId, error }) => {
  <span class="kw">const</span> { resolve, reject } = pending.<span class="fn">get</span>(taskId) || {};
  <span class="kw">if</span> (!resolve) <span class="kw">return</span>; <span class="cmt">// unknown job</span>
  pending.<span class="fn">delete</span>(taskId);
  <span class="kw">if</span> (status === <span class="str">'done'</span>) <span class="fn">resolve</span>();
  <span class="kw">else</span> <span class="fn">reject</span>(<span class="kw">new</span> <span class="cls">Error</span>(error));
});

pdfWorker.<span class="fn">on</span>(<span class="str">'exit'</span>, (code) => {
  console.<span class="fn">error</span>(<span class="str">`PDF worker exited with code ${code}. Restarting...`</span>);
  <span class="cmt">// In production: respawn the worker process here</span>
});

<span class="kw">function</span> <span class="fn">generateTaskPDF</span>(taskId, data) {
  <span class="kw">return new</span> <span class="cls">Promise</span>((resolve, reject) => {
    pending.<span class="fn">set</span>(taskId, { resolve, reject });
    pdfWorker.<span class="fn">send</span>({ taskId, data });
  });
}

module.exports = { generateTaskPDF };</code></pre>
</div>

<h2>The Cluster Module</h2>
<p>The <code>cluster</code> module is built directly into Node.js and solves a specific problem: how do you run multiple instances of your HTTP server on the same port to use all CPU cores? PM2's cluster mode is built on top of this exact API.</p>

<h3>How Cluster Works</h3>
<p>When you call <code>cluster.fork()</code>, Node creates a child process that runs the same script from the top. The child process has <code>cluster.isWorker === true</code>. The master uses an OS trick — passing a shared server socket to all workers — so they all receive connections on the same port without any of them knowing about the others.</p>

<div class="app-diagram"><pre>
  ┌──────────────────────────────────────────┐
  │           Master Process                  │
  │  cluster.isMaster === true                │
  │  - Forks N workers                        │
  │  - Monitors worker health                 │
  │  - Restarts dead workers                  │
  │  - Distributes connections (round-robin)  │
  └──────────────┬───────────────────────────┘
                 │  shared server socket (OS)
     ┌───────────┼────────────┬────────────┐
     │           │            │            │
┌────▼───┐  ┌───▼────┐  ┌───▼────┐  ┌───▼────┐
│Worker 1│  │Worker 2│  │Worker 3│  │Worker 4│
│ PID 101│  │ PID 102│  │ PID 103│  │ PID 104│
│ :3000  │  │ :3000  │  │ :3000  │  │ :3000  │
│ Express│  │ Express│  │ Express│  │ Express│
└────────┘  └────────┘  └────────┘  └────────┘
   Each worker is a full Node.js process with its own memory</pre>
</div>

<div class="code-block">
  <div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/server-cluster.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
  <pre><code><span class="kw">const</span> cluster = <span class="fn">require</span>(<span class="str">'cluster'</span>);
<span class="kw">const</span> os      = <span class="fn">require</span>(<span class="str">'os'</span>);
<span class="kw">const</span> config  = <span class="fn">require</span>(<span class="str">'./config'</span>);

<span class="kw">const</span> NUM_WORKERS = os.<span class="fn">cpus</span>().<span class="prop">length</span>; <span class="cmt">// one per logical CPU core</span>

<span class="kw">if</span> (cluster.<span class="prop">isPrimary</span>) {    <span class="cmt">// cluster.isMaster in older Node versions</span>
  console.<span class="fn">log</span>(<span class="str">`Master ${process.pid}: forking ${NUM_WORKERS} workers`</span>);

  <span class="cmt">// Spawn one worker per CPU core</span>
  <span class="kw">for</span> (<span class="kw">let</span> i = <span class="num">0</span>; i < NUM_WORKERS; i++) {
    cluster.<span class="fn">fork</span>();
  }

  <span class="cmt">// Restart any worker that crashes</span>
  cluster.<span class="fn">on</span>(<span class="str">'exit'</span>, (worker, code, signal) => {
    console.<span class="fn">warn</span>(<span class="str">`Worker ${worker.process.pid} died (code=${code} signal=${signal}). Restarting...`</span>);
    cluster.<span class="fn">fork</span>(); <span class="cmt">// immediately spawn a replacement</span>
  });

  <span class="cmt">// Listen for messages from workers (health reports, metrics, etc.)</span>
  cluster.<span class="fn">on</span>(<span class="str">'message'</span>, (worker, msg) => {
    <span class="kw">if</span> (msg.type === <span class="str">'HEALTH'</span>) {
      console.<span class="fn">log</span>(<span class="str">`Worker ${worker.id}: ${msg.requests} requests served`</span>);
    }
  });

} <span class="kw">else</span> {
  <span class="cmt">// Worker code — exactly the same as your normal server.js</span>
  <span class="kw">const</span> app = <span class="fn">require</span>(<span class="str">'./app'</span>);
  app.<span class="fn">listen</span>(config.port, () => {
    console.<span class="fn">log</span>(<span class="str">`Worker ${process.pid}: listening on port ${config.port}`</span>);
  });

  <span class="cmt">// Send periodic health stats to master</span>
  <span class="kw">let</span> requestCount = <span class="num">0</span>;
  app.<span class="fn">use</span>((req, res, next) => { requestCount++; <span class="fn">next</span>(); });
  <span class="fn">setInterval</span>(() => {
    process.<span class="fn">send</span>({ type: <span class="str">'HEALTH'</span>, requests: requestCount });
  }, <span class="num">30000</span>);
}</code></pre>
</div>

<h3>Inter-Worker Communication</h3>
<p>Workers are isolated processes — they can't share variables directly. To communicate between workers (e.g., broadcasting a cache invalidation), messages must route through the master:</p>

<div class="code-block">
  <div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">Broadcasting between workers</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
  <pre><code><span class="cmt">// In the master process — receives from one worker, fans out to all</span>
cluster.<span class="fn">on</span>(<span class="str">'message'</span>, (sender, msg) => {
  <span class="kw">if</span> (msg.type === <span class="str">'BROADCAST'</span>) {
    <span class="kw">for</span> (<span class="kw">const</span> [id, worker] <span class="kw">of</span> <span class="cls">Object</span>.<span class="fn">entries</span>(cluster.<span class="prop">workers</span>)) {
      <span class="kw">if</span> (worker !== sender) {   <span class="cmt">// don't echo back to sender</span>
        worker.<span class="fn">send</span>(msg);
      }
    }
  }
});

<span class="cmt">// In any worker — sends to master, which fans out to others</span>
process.<span class="fn">send</span>({ type: <span class="str">'BROADCAST'</span>, event: <span class="str">'CACHE_INVALIDATE'</span>, key: <span class="str">'user:123'</span> });

<span class="cmt">// All workers listen for broadcasts from master</span>
process.<span class="fn">on</span>(<span class="str">'message'</span>, (msg) => {
  <span class="kw">if</span> (msg.event === <span class="str">'CACHE_INVALIDATE'</span>) {
    localCache.<span class="fn">del</span>(msg.<span class="prop">key</span>);
  }
});</code></pre>
</div>

<h2>Worker Threads</h2>
<p>Added in Node.js 10 and stable since Node 12, Worker Threads run JavaScript in true OS threads <em>within the same process</em>. Unlike <code>cluster</code> and <code>fork()</code>, threads share memory with the parent — which makes them much faster for passing large data, but requires careful synchronization.</p>

<h3>Creating a Worker Thread</h3>

<div class="code-block">
  <div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">workers/hashWorker.js  (the thread code)</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
  <pre><code><span class="kw">const</span> { parentPort, workerData } = <span class="fn">require</span>(<span class="str">'worker_threads'</span>);
<span class="kw">const</span> bcrypt = <span class="fn">require</span>(<span class="str">'bcryptjs'</span>);

<span class="cmt">// workerData is the initial data passed when the thread was created</span>
<span class="cmt">// It's a deep copy — changing it here doesn't affect the parent</span>
<span class="kw">const</span> { password, rounds } = workerData;

<span class="cmt">// bcrypt.hash is CPU-intensive — safe to run in a worker thread</span>
bcrypt.<span class="fn">hash</span>(password, rounds)
  .<span class="fn">then</span>(hash => {
    parentPort.<span class="fn">postMessage</span>({ success: <span class="kw">true</span>, hash });
  })
  .<span class="fn">catch</span>(err => {
    parentPort.<span class="fn">postMessage</span>({ success: <span class="kw">false</span>, error: err.<span class="prop">message</span> });
  });</code></pre>
</div>

<div class="code-block">
  <div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/services/cryptoService.js  (using the thread)</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
  <pre><code><span class="kw">const</span> { Worker } = <span class="fn">require</span>(<span class="str">'worker_threads'</span>);
<span class="kw">const</span> path = <span class="fn">require</span>(<span class="str">'path'</span>);

<span class="kw">function</span> <span class="fn">hashPasswordInThread</span>(password, rounds = <span class="num">12</span>) {
  <span class="kw">return new</span> <span class="cls">Promise</span>((resolve, reject) => {
    <span class="kw">const</span> worker = <span class="kw">new</span> <span class="cls">Worker</span>(
      path.<span class="fn">join</span>(__dirname, <span class="str">'../../workers/hashWorker.js'</span>),
      { workerData: { password, rounds } }  <span class="cmt">// deep-copied into thread</span>
    );

    worker.<span class="fn">on</span>(<span class="str">'message'</span>, ({ success, hash, error }) => {
      <span class="kw">if</span> (success) <span class="fn">resolve</span>(hash);
      <span class="kw">else</span> <span class="fn">reject</span>(<span class="kw">new</span> <span class="cls">Error</span>(error));
    });

    worker.<span class="fn">on</span>(<span class="str">'error'</span>, reject);

    worker.<span class="fn">on</span>(<span class="str">'exit'</span>, (code) => {
      <span class="kw">if</span> (code !== <span class="num">0</span>) <span class="fn">reject</span>(<span class="kw">new</span> <span class="cls">Error</span>(<span class="str">`Thread exited with code ${code}`</span>));
    });
  });
}</code></pre>
</div>

<h3>Shared Memory — The Key Advantage</h3>
<p>The most powerful (and most dangerous) feature of Worker Threads is <strong>shared memory</strong> via <code>SharedArrayBuffer</code>. Unlike processes, threads can read and write the same memory directly, with no serialization overhead. This is essential for large datasets:</p>

<div class="code-block">
  <div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">SharedArrayBuffer example</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
  <pre><code><span class="kw">const</span> { Worker, isMainThread, parentPort, workerData } = <span class="fn">require</span>(<span class="str">'worker_threads'</span>);

<span class="kw">if</span> (isMainThread) {
  <span class="cmt">// Allocate a shared buffer — 4 bytes per element × 1 million elements = 4MB</span>
  <span class="kw">const</span> sharedBuffer = <span class="kw">new</span> <span class="cls">SharedArrayBuffer</span>(<span class="num">4</span> * <span class="num">1_000_000</span>);
  <span class="kw">const</span> sharedArray  = <span class="kw">new</span> <span class="cls">Int32Array</span>(sharedBuffer);

  <span class="cmt">// Fill with initial data in the main thread</span>
  <span class="kw">for</span> (<span class="kw">let</span> i = <span class="num">0</span>; i < sharedArray.<span class="prop">length</span>; i++) sharedArray[i] = i;

  <span class="cmt">// Pass the BUFFER (not a copy) to the worker thread</span>
  <span class="cmt">// Worker shares the exact same memory — zero copy cost</span>
  <span class="kw">const</span> worker = <span class="kw">new</span> <span class="cls">Worker</span>(__filename, { workerData: { sharedBuffer } });

  worker.<span class="fn">on</span>(<span class="str">'message'</span>, (result) => {
    <span class="cmt">// The worker modified sharedArray in place — we see the changes immediately</span>
    console.<span class="fn">log</span>(<span class="str">'Sum computed by worker:'</span>, result.<span class="prop">sum</span>);
    console.<span class="fn">log</span>(<span class="str">'First element now:'</span>, sharedArray[<span class="num">0</span>]); <span class="cmt">// modified by worker</span>
  });

} <span class="kw">else</span> {
  <span class="kw">const</span> sharedArray = <span class="kw">new</span> <span class="cls">Int32Array</span>(workerData.<span class="prop">sharedBuffer</span>);

  <span class="cmt">// Compute sum + modify the first element — visible in parent immediately</span>
  <span class="kw">let</span> sum = <span class="num">0</span>;
  <span class="kw">for</span> (<span class="kw">let</span> i = <span class="num">0</span>; i < sharedArray.<span class="prop">length</span>; i++) sum += sharedArray[i];
  sharedArray[<span class="num">0</span>] = <span class="num">999</span>; <span class="cmt">// write directly to shared memory</span>

  parentPort.<span class="fn">postMessage</span>({ sum });
}</code></pre>
</div>

<div class="callout danger">
  <div class="callout-title">🚨 Race Conditions in Shared Memory</div>
  <p>If two threads write to the same memory location simultaneously, the result is undefined — you get data corruption. Use <code>Atomics</code> operations for thread-safe reads and writes: <code>Atomics.add(sharedArray, index, value)</code>, <code>Atomics.load(sharedArray, index)</code>. For complex synchronization, use <code>Atomics.wait()</code> and <code>Atomics.notify()</code>. If you're not sure whether you need atomics, use a thread pool pattern instead (below).</p>
</div>

<h2>Building a Thread Pool</h2>
<p>Creating a new Worker for every request is expensive — thread startup takes ~50–100ms. A thread pool keeps N threads alive and queues work to them:</p>

<div class="code-block">
  <div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/utils/threadPool.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
  <pre><code><span class="kw">const</span> { Worker } = <span class="fn">require</span>(<span class="str">'worker_threads'</span>);
<span class="kw">const</span> os = <span class="fn">require</span>(<span class="str">'os'</span>);

<span class="kw">class</span> <span class="cls">ThreadPool</span> {
  constructor(workerScript, poolSize = os.<span class="fn">cpus</span>().<span class="prop">length</span>) {
    <span class="kw">this</span>.<span class="prop">workerScript</span> = workerScript;
    <span class="kw">this</span>.<span class="prop">workers</span>      = [];      <span class="cmt">// all worker instances</span>
    <span class="kw">this</span>.<span class="prop">freeWorkers</span>  = [];      <span class="cmt">// workers currently idle</span>
    <span class="kw">this</span>.<span class="prop">queue</span>         = [];      <span class="cmt">// pending jobs waiting for a free worker</span>

    <span class="kw">for</span> (<span class="kw">let</span> i = <span class="num">0</span>; i < poolSize; i++) {
      <span class="kw">this</span>.<span class="fn">_addWorker</span>();
    }
  }

  <span class="fn">_addWorker</span>() {
    <span class="kw">const</span> worker = <span class="kw">new</span> <span class="cls">Worker</span>(<span class="kw">this</span>.<span class="prop">workerScript</span>);
    worker.<span class="prop">_currentJob</span> = <span class="kw">null</span>;

    worker.<span class="fn">on</span>(<span class="str">'message'</span>, (result) => {
      worker.<span class="prop">_currentJob</span>?.resolve(result);
      worker.<span class="prop">_currentJob</span> = <span class="kw">null</span>;
      <span class="kw">this</span>.<span class="fn">_dispatch</span>(worker);   <span class="cmt">// give it the next queued job</span>
    });

    worker.<span class="fn">on</span>(<span class="str">'error'</span>, (err) => {
      worker.<span class="prop">_currentJob</span>?.reject(err);
      worker.<span class="prop">_currentJob</span> = <span class="kw">null</span>;
      <span class="kw">this</span>.<span class="fn">_addWorker</span>();          <span class="cmt">// replace crashed worker</span>
    });

    <span class="kw">this</span>.<span class="prop">workers</span>.<span class="fn">push</span>(worker);
    <span class="kw">this</span>.<span class="prop">freeWorkers</span>.<span class="fn">push</span>(worker);
    <span class="kw">this</span>.<span class="fn">_dispatch</span>(worker);
  }

  <span class="fn">_dispatch</span>(worker) {
    <span class="kw">if</span> (<span class="kw">this</span>.<span class="prop">queue</span>.<span class="prop">length</span> === <span class="num">0</span>) {
      <span class="kw">this</span>.<span class="prop">freeWorkers</span>.<span class="fn">push</span>(worker);  <span class="cmt">// nothing to do — park it</span>
      <span class="kw">return</span>;
    }
    <span class="kw">const</span> { data, resolve, reject } = <span class="kw">this</span>.<span class="prop">queue</span>.<span class="fn">shift</span>();
    worker.<span class="prop">_currentJob</span> = { resolve, reject };
    worker.<span class="fn">postMessage</span>(data);
  }

  <span class="fn">run</span>(data) {
    <span class="kw">return new</span> <span class="cls">Promise</span>((resolve, reject) => {
      <span class="kw">const</span> freeWorker = <span class="kw">this</span>.<span class="prop">freeWorkers</span>.<span class="fn">pop</span>();
      <span class="kw">if</span> (freeWorker) {
        <span class="cmt">// Worker available — dispatch immediately</span>
        freeWorker.<span class="prop">_currentJob</span> = { resolve, reject };
        freeWorker.<span class="fn">postMessage</span>(data);
      } <span class="kw">else</span> {
        <span class="cmt">// All workers busy — queue the job</span>
        <span class="kw">this</span>.<span class="prop">queue</span>.<span class="fn">push</span>({ data, resolve, reject });
      }
    });
  }

  <span class="fn">destroy</span>() {
    <span class="kw">this</span>.<span class="prop">workers</span>.<span class="fn">forEach</span>(w => w.<span class="fn">terminate</span>());
  }
}

<span class="cmt">// Create a shared pool for image processing — 4 threads</span>
<span class="kw">const</span> imagePool = <span class="kw">new</span> <span class="cls">ThreadPool</span>(<span class="str">'./workers/imageWorker.js'</span>, <span class="num">4</span>);

<span class="cmt">// Usage — returns a Promise, doesn't block the event loop</span>
<span class="kw">const</span> result = <span class="kw">await</span> imagePool.<span class="fn">run</span>({ inputPath: <span class="str">'/uploads/photo.jpg'</span>, width: <span class="num">800</span> });

module.exports = { ThreadPool, imagePool };</code></pre>
</div>

<h2>The Full Comparison</h2>
<p>Knowing the APIs is only half the battle — knowing <em>when</em> to choose each one is what matters in practice:</p>

<table>
  <thead>
    <tr><th></th><th>child_process.fork()</th><th>cluster</th><th>Worker Threads</th></tr>
  </thead>
  <tbody>
    <tr>
      <td><strong>Memory isolation</strong></td>
      <td>✅ Fully isolated</td>
      <td>✅ Fully isolated</td>
      <td>⚠️ Shared heap (SharedArrayBuffer)</td>
    </tr>
    <tr>
      <td><strong>Startup time</strong></td>
      <td>~100–300ms (V8 init)</td>
      <td>~100–300ms (V8 init)</td>
      <td>~10–50ms (shares V8)</td>
    </tr>
    <tr>
      <td><strong>Memory per unit</strong></td>
      <td>~30–60MB base</td>
      <td>~30–60MB base</td>
      <td>~1–5MB extra</td>
    </tr>
    <tr>
      <td><strong>Communication</strong></td>
      <td>Serialized IPC (JSON)</td>
      <td>Serialized IPC (JSON)</td>
      <td>postMessage (copy) or SharedArrayBuffer (zero-copy)</td>
    </tr>
    <tr>
      <td><strong>Crash isolation</strong></td>
      <td>✅ Parent unaffected</td>
      <td>✅ Workers independent</td>
      <td>❌ Thread crash can crash process</td>
    </tr>
    <tr>
      <td><strong>Language</strong></td>
      <td>Any (Python, Rust, bash…)</td>
      <td>Node.js only</td>
      <td>Node.js only</td>
    </tr>
    <tr>
      <td><strong>Best for</strong></td>
      <td>External tools, scripts, language bridges</td>
      <td>HTTP server scaling across all CPU cores</td>
      <td>JS-heavy CPU work: parsing, compression, ML</td>
    </tr>
  </tbody>
</table>

<h2>Decision Guide — Which One Do I Use?</h2>

<div class="code-block">
  <div class="code-header"><span class="code-lang">text</span><span class="code-filename">Decision tree</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
  <pre><code>Is the work I/O-bound? (DB query, API call, file read)
  └─► No concurrency tool needed — the event loop handles this natively.

Is it CPU-bound JavaScript? (image resize, JSON parse, crypto, compression)
  └─► Worker Threads — fast startup, can share large buffers.
        Have 10+ long-lived jobs? → Thread Pool pattern.
        Single occasional job? → New Worker per job is fine.

Do I need to run an external program? (Python ML, ffmpeg, ImageMagick, shell cmd)
  └─► child_process.execFile() for one-shot commands with small output.
       child_process.spawn() for long-running processes or large output.
       child_process.fork() for persistent Node.js worker subprocesses.

Do I want to use all CPU cores for HTTP traffic?
  └─► Cluster module (or PM2 cluster mode — same thing, easier to use).
       In-process state won't be shared — use Redis for shared cache/sessions.

Do I need zero-copy shared memory between threads?
  └─► SharedArrayBuffer + Worker Threads.
       Add Atomics operations if multiple threads write the same locations.</code></pre>
</div>

<h2>Practical Integration in TaskFlow</h2>
<p>Here's how these tools slot into a real production app like TaskFlow:</p>
<ul>
  <li><strong>HTTP server scaling</strong> → PM2 cluster mode (Chapter 21) — no manual cluster code needed</li>
  <li><strong>PDF generation from task data</strong> → <code>fork()</code> to a persistent PDF worker process, one persistent process per server instance</li>
  <li><strong>Image thumbnail generation for attachments</strong> → Worker Thread pool with 4 threads, reused across requests</li>
  <li><strong>Virus scanning uploaded files</strong> → <code>execFile()</code> calling ClamAV CLI, one-shot per upload</li>
  <li><strong>Database queries, API calls, file I/O</strong> → Plain async/await — the event loop handles all of this natively</li>
</ul>

<div class="callout success">
  <div class="callout-title">✅ Node.js Concurrency Mastered</div>
  <p>You now understand all three concurrency primitives at a deep level: child_process for external programs and Node-to-Node IPC, cluster for HTTP server scaling across all CPU cores, and Worker Threads for CPU-intensive JavaScript with optional shared memory. Most Node.js applications only ever need cluster (via PM2) and the occasional worker thread — but knowing all three lets you pick the right tool confidently.</p>
</div></template>

<template id="tpl-deno"><div class="chapter-header">
  <div class="ch-eyebrow">Chapter 23 · Bonus · JavaScript Runtimes</div>
  <h1 class="ch-title">Deno — The Secure Runtime</h1>
  <p class="ch-subtitle">Deno was created by Ryan Dahl — the same person who built Node.js — after publicly listing the things he regretted about Node's design. It fixes them all: permissions, TypeScript, ESM, a modern standard library. Understanding Deno makes you a sharper Node developer too.</p>
</div>

<h2>Why Ryan Dahl Built Deno</h2>
<p>In 2018, Ryan Dahl gave a talk titled "10 Things I Regret About Node.js." He had already sold his interest in Joyent (Node's steward) and had spent years thinking about what he'd do differently. His regrets became Deno's design goals:</p>

<table>
  <thead><tr><th>Node.js (2009)</th><th>What Dahl regretted</th><th>Deno's solution</th></tr></thead>
  <tbody>
    <tr><td><code>require()</code> + npm + node_modules</td><td>Complex module resolution, massive local folders</td><td>ESM-only, import by URL, no node_modules</td></tr>
    <tr><td>All code runs with full OS access</td><td>Installed packages can read your disk, call home</td><td>Explicit permission flags required</td></tr>
    <tr><td>TypeScript requires build step</td><td>TS is the defacto standard but Node ignores it</td><td>TypeScript runs natively, no config needed</td></tr>
    <tr><td>callback-based APIs</td><td>Promises arrived years later, APIs split</td><td>All APIs are Promise-based from day one</td></tr>
    <tr><td>No browser-compatible globals</td><td><code>fetch</code>, <code>Request</code>, <code>FormData</code> didn't exist</td><td>Web-standard APIs built in</td></tr>
    <tr><td>Security was an afterthought</td><td>Any <code>npm install</code> could compromise your system</td><td>Sandbox-first with explicit opt-in</td></tr>
  </tbody>
</table>

<div class="concept-box">
  <h4>⚙️ What Deno Is Under the Hood</h4>
  <p>Like Node.js, Deno uses V8 for JavaScript execution. Unlike Node, it's written in <strong>Rust</strong> rather than C++, and uses <strong>Tokio</strong> (Rust's async runtime) instead of libuv for the event loop. The result is a runtime that feels familiar but is architecturally cleaner, with security and TypeScript baked in at the binary level.</p>
</div>

<h2>Installing Deno</h2>

<div class="code-block">
  <div class="code-header"><span class="code-lang">bash</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
  <pre><code><span class="cmt"># macOS / Linux</span>
curl -fsSL https://deno.land/install.sh | sh

<span class="cmt"># macOS with Homebrew</span>
brew install deno

<span class="cmt"># Windows (PowerShell)</span>
irm https://deno.land/install.ps1 | iex

<span class="cmt"># Verify</span>
deno --version
<span class="cmt"># deno 1.x.x (release, x86_64-apple-darwin)</span>
<span class="cmt"># v8 12.x.x</span>
<span class="cmt"># typescript 5.x.x</span>

<span class="cmt"># Run a script directly — no npm install, no package.json</span>
deno run https://deno.land/std/examples/welcome.ts</code></pre>
</div>

<h2>The Permission System — Security First</h2>
<p>This is Deno's most distinctive feature and one of its best ideas. By default, a Deno program cannot access the file system, network, environment variables, or spawn subprocesses. Each capability requires an explicit flag. This means that even if a dependency is compromised, it can't do anything the operator didn't explicitly allow.</p>

<div class="code-block">
  <div class="code-header"><span class="code-lang">bash</span><span class="code-filename">Permission flags</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
  <pre><code><span class="cmt"># No flags — script runs completely sandboxed</span>
deno run script.ts

<span class="cmt"># Grant specific permissions</span>
deno run --allow-read script.ts           <span class="cmt"># read any file</span>
deno run --allow-read=/uploads script.ts  <span class="cmt"># read only /uploads directory</span>
deno run --allow-write=/tmp script.ts     <span class="cmt"># write only to /tmp</span>
deno run --allow-net script.ts            <span class="cmt"># any network access</span>
deno run --allow-net=api.github.com script.ts  <span class="cmt"># only this host</span>
deno run --allow-env script.ts            <span class="cmt"># read env vars</span>
deno run --allow-env=DATABASE_URL script.ts    <span class="cmt"># only this variable</span>
deno run --allow-run script.ts            <span class="cmt"># spawn subprocesses</span>
deno run --allow-sys script.ts            <span class="cmt"># system info (hostname, CPU, etc.)</span>

<span class="cmt"># Combine flags</span>
deno run --allow-net --allow-read=/uploads --allow-env=DATABASE_URL server.ts

<span class="cmt"># --allow-all for development (equivalent to Node's unrestricted access)</span>
deno run --allow-all server.ts

<span class="cmt"># Interactive permission prompts (asks you at runtime instead)</span>
deno run --prompt script.ts</code></pre>
</div>

<div class="callout info">
  <div class="callout-title">💡 Permissions in Production</div>
  <p>The right approach for a production Deno API is to be as specific as possible: <code>--allow-net=0.0.0.0</code> for listening, specific database host for DB connections, exact directory paths for uploads. This way a compromised dependency can't exfiltrate your entire filesystem or make arbitrary network calls.</p>
</div>

<h2>TypeScript — Native, No Config</h2>
<p>In Node.js, running TypeScript requires installing <code>ts-node</code> or <code>tsx</code>, creating a <code>tsconfig.json</code>, and often configuring module resolution. In Deno, you just name your file <code>.ts</code> and run it. That's it.</p>

<div class="code-block">
  <div class="code-header"><span class="code-lang">TypeScript</span><span class="code-filename">server.ts</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
  <pre><code><span class="cmt">// No imports from npm. No tsconfig.json. Just TypeScript.</span>
<span class="kw">interface</span> <span class="cls">Task</span> {
  id:       string;
  title:    string;
  status:   <span class="str">'todo'</span> | <span class="str">'in_progress'</span> | <span class="str">'done'</span>;
  priority: <span class="str">'low'</span> | <span class="str">'medium'</span> | <span class="str">'high'</span> | <span class="str">'urgent'</span>;
  dueDate?: <span class="cls">Date</span>;
}

<span class="kw">function</span> <span class="fn">createTask</span>(title: string, priority: <span class="cls">Task</span>[<span class="str">'priority'</span>] = <span class="str">'medium'</span>): <span class="cls">Task</span> {
  <span class="kw">return</span> {
    id:       crypto.<span class="fn">randomUUID</span>(),   <span class="cmt">// built-in Web Crypto API</span>
    title,
    status:   <span class="str">'todo'</span>,
    priority,
  };
}

<span class="kw">const</span> task = <span class="fn">createTask</span>(<span class="str">'Write documentation'</span>, <span class="str">'high'</span>);
console.<span class="fn">log</span>(task);

<span class="cmt">// Run: deno run --allow-none server.ts</span>
<span class="cmt">// TypeScript errors are caught at runtime — no separate tsc step needed</span></code></pre>
</div>

<h2>The Module System — Import by URL</h2>
<p>This is the most visible difference in day-to-day Deno development. Instead of npm packages in <code>node_modules</code>, you import directly from URLs. Deno downloads and caches modules on first use, then never fetches them again unless you explicitly reload.</p>

<div class="code-block">
  <div class="code-header"><span class="code-lang">TypeScript</span><span class="code-filename">URL imports</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
  <pre><code><span class="cmt">// Import from deno.land/std — the official standard library</span>

<span class="kw">import</span> { join }  <span class="kw">from</span> <span class="str">"https://deno.land/std@0.220.0/path/mod.ts"</span>;
<span class="kw">import</span> { format } <span class="kw">from</span> <span class="str">"https://deno.land/std@0.220.0/datetime/mod.ts"</span>;

<span class="cmt">// Import from deno.land/x — community packages</span>
<span class="kw">import</span> { Application, Router } <span class="kw">from</span> <span class="str">"https://deno.land/x/oak@v13.2.5/mod.ts"</span>;

<span class="cmt">// Import npm packages directly (Deno 1.28+)</span>
<span class="cmt">// npm: prefix makes Deno resolve from npm registry</span>
<span class="kw">import</span> express <span class="kw">from</span> <span class="str">"npm:express@4"</span>;
<span class="kw">import</span> { z }   <span class="kw">from</span> <span class="str">"npm:zod@3"</span>;

<span class="cmt">// Import from JSR — the new registry built for ESM + TypeScript</span>
<span class="kw">import</span> { Hono } <span class="kw">from</span> <span class="str">"jsr:@hono/hono"</span>;</code></pre>
</div>

<p>Typing full versioned URLs everywhere would be unmaintainable. Deno's solution is an <strong>import map</strong> that aliases short names to full URLs — defined in <code>deno.json</code>:</p>

</div>

<div class="code-block">

<h2>Building an HTTP Server — Three Ways</h2>

<h3>1. Native Deno.serve (Deno 1.35+, recommended)</h3>
<div class="code-block">
  <div class="code-header"><span class="code-lang">TypeScript</span><span class="code-filename">native-server.ts</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
  <pre><code><span class="cmt">// Built-in HTTP server — no imports needed</span>
<span class="cmt">// Uses the Fetch API's Request/Response objects — browser-compatible!</span>

<span class="kw">const</span> tasks: <span class="cls">Map</span>&lt;string, <span class="cls">Task</span>&gt; = <span class="kw">new</span> <span class="cls">Map</span>();

Deno.<span class="fn">serve</span>({ port: <span class="num">3000</span> }, <span class="kw">async</span> (req: <span class="cls">Request</span>): <span class="cls">Promise</span>&lt;<span class="cls">Response</span>&gt; => {

    <span class="kw">const</span> task: <span class="cls">Task</span> = {

<h2>Deno KV — Built-In Database</h2>
<p>Deno 1.32 introduced <strong>Deno KV</strong> — a key-value database built directly into the runtime. Locally it uses SQLite under the hood. In Deno Deploy it becomes a globally distributed database. No connection strings, no external dependency:</p>

<div class="code-block">
  <div class="code-header"><span class="code-lang">TypeScript</span><span class="code-filename">Deno KV for TaskFlow</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
  <pre><code><span class="cmt">// Open the database (no setup, no config)</span>
<span class="kw">const</span> kv = <span class="kw">await</span> Deno.<span class="fn">openKv</span>();

<span class="cmt">// Store a task — key is an array (hierarchical)</span>
<span class="kw">await</span> kv.<span class="fn">set</span>([<span class="str">"tasks"</span>, task.<span class="prop">id</span>], task);

<span class="cmt">// Get by key</span>
<span class="kw">const</span> entry = <span class="kw">await</span> kv.<span class="fn">get</span>&lt;<span class="cls">Task</span>&gt;([<span class="str">"tasks"</span>, taskId]);
<span class="kw">const</span> task = entry.<span class="prop">value</span>;  <span class="cmt">// null if not found</span>

<span class="cmt">// List all tasks for a user (prefix scan)</span>
<span class="kw">const</span> entries = kv.<span class="fn">list</span>&lt;<span class="cls">Task</span>&gt;({ prefix: [<span class="str">"tasks"</span>, <span class="str">"user"</span>, userId] });
<span class="kw">const</span> tasks: <span class="cls">Task</span>[] = [];
<span class="kw">for await</span> (<span class="kw">const</span> entry <span class="kw">of</span> entries) {
  tasks.<span class="fn">push</span>(entry.<span class="prop">value</span>);
}

<span class="cmt">// Atomic transactions</span>
<span class="kw">const</span> result = <span class="kw">await</span> kv.<span class="fn">atomic</span>()
  .<span class="fn">check</span>({ key: [<span class="str">"tasks"</span>, taskId], versionstamp: existingVersionstamp })
  .<span class="fn">set</span>([<span class="str">"tasks"</span>, taskId], updatedTask)
  .<span class="fn">set</span>([<span class="str">"audit"</span>, Date.<span class="fn">now</span>().<span class="fn">toString</span>()], { action: <span class="str">"updated"</span>, taskId })
  .<span class="fn">commit</span>();

<span class="kw">if</span> (!result.<span class="prop">ok</span>) {
  <span class="cmt">// versionstamp mismatch — someone else updated it first</span>
  <span class="kw">throw new</span> <span class="cls">Error</span>(<span class="str">"Optimistic lock failed — retry"</span>);

  <p>Deno shines for greenfield TypeScript projects, security-sensitive environments where you want explicit capability control, scripts and CLI tools (the built-in toolchain is excellent), and edge/serverless deployments on Deno Deploy. For existing Node.js codebases or when you need a specific npm ecosystem package that hasn't been ported, Node.js remains the more practical choice.</p>

<template id="tpl-bun"><div class="chapter-header">
  <div class="ch-eyebrow">Chapter 24 · Bonus · JavaScript Runtimes</div>
  <h1 class="ch-title">Bun — The Fast Runtime</h1>
  <p class="ch-subtitle">Bun is built from scratch in Zig, uses JavaScriptCore instead of V8, and is obsessively focused on one thing: speed. It's not just a runtime — it's an all-in-one toolkit that replaces Node, npm, webpack, Jest, and Babel simultaneously.</p>
</div>

<h2>What Bun Is and Why It Exists</h2>
<p>Bun was created by Jarred Sumner and released in 2023. His starting point was a simple observation: the JavaScript toolchain had become absurdly slow and complex. A typical React or Node project involves Node.js as the runtime, npm as the package manager, webpack/vite as a bundler, Babel/swc as a transpiler, Jest as a test runner, and ESLint as a linter — six separate tools, each with their own config files.</p>
<p>Bun replaces all of them with one binary. It's also substantially faster at almost every benchmark. The performance comes from three choices:</p>

<ul>
  <li><strong>JavaScriptCore instead of V8</strong> — Apple's JS engine, used in Safari. Has faster startup time than V8 and often faster raw execution for server workloads.</li>
  <li><strong>Zig as the implementation language</strong> — Zig gives very fine-grained control over memory layout and syscall patterns, allowing Bun to batch and optimize I/O in ways that Node's libuv layer makes difficult.</li>
  <li><strong>Native TypeScript and JSX</strong> — Bun transpiles TypeScript and JSX in the same pass as parsing, with zero overhead vs plain JavaScript. No separate transpilation step.</li>
</ul>

<div class="concept-box">
  <h4>📊 Bun vs Node.js — Benchmark Reality</h4>
  <p>Bun's own benchmarks show it as 3–4× faster than Node for HTTP throughput and significantly faster for file I/O. Independent benchmarks typically show 1.5–2× for real-world HTTP workloads. Startup time is dramatically faster — important for Lambda/edge functions and CLI tools. For long-running servers, the difference narrows but remains meaningful.</p>
</div>

<h2>Installing Bun</h2>

  <div class="code-header"><span class="code-lang">bash</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>

curl -fsSL https://bun.sh/install | bash

<span class="cmt"># macOS with Homebrew</span>
brew install oven-sh/bun/bun

<span class="cmt"># npm (if Node is already installed)</span>
npm install -g bun

<span class="cmt"># Verify</span>

<span class="cmt"># Upgrade</span>

</div>

<h2>Bun as a Drop-In Node Replacement</h2>
<p>The fastest way to try Bun is on an existing Node.js project. In most cases you change nothing — just swap <code>node</code> for <code>bun</code>:</p>

<h2>Bun as a Package Manager</h2>
<p>Bun's package manager is the fastest available — up to 30× faster than npm on cold installs, and significantly faster than pnpm and yarn too. It's fully compatible with <code>package.json</code> and the npm registry:</p>

<div class="code-block">
  <div class="code-header"><span class="code-lang">bash</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
  <pre><code><span class="cmt"># Install all dependencies from package.json</span>

<div class="callout info">
  <div class="callout-title">💡 bun.lockb — Binary Lockfile</div>
  <p>Bun uses a binary lockfile format (<code>bun.lockb</code>) instead of the large JSON <code>package-lock.json</code>. It's much smaller and faster to parse. Commit it to version control just like <code>package-lock.json</code>. To see its contents in text form: <code>bun install --frozen-lockfile --dry-run</code> or <code>git diff bun.lockb</code> (Bun adds a git diff driver automatically).</p>
</div>

<h2>Bun's Native HTTP Server</h2>
<p>Bun has its own high-performance HTTP server API — <code>Bun.serve()</code>. It uses the same Fetch API Request/Response objects as Deno and the browser, but is architecturally optimized for Bun's runtime:</p>

<div class="code-block">
  <div class="code-header"><span class="code-lang">TypeScript</span><span class="code-filename">server.ts</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
  <pre><code><span class="kw">interface</span> <span class="cls">Task</span> {
  id: string;
  title: string;
  status: <span class="str">'todo'</span> | <span class="str">'in_progress'</span> | <span class="str">'done'</span>;
  priority: <span class="str">'low'</span> | <span class="str">'medium'</span> | <span class="str">'high'</span> | <span class="str">'urgent'</span>;
}

<span class="kw">const</span> tasks = <span class="kw">new</span> <span class="cls">Map</span>&lt;string, <span class="cls">Task</span>&gt;();

<span class="kw">const</span> server = Bun.<span class="fn">serve</span>({
  port: <span class="num">3000</span>,

  <span class="cmt">// All requests go through this single handler</span>
  <span class="kw">async</span> <span class="fn">fetch</span>(req: <span class="cls">Request</span>): <span class="cls">Promise</span>&lt;<span class="cls">Response</span>&gt; {
    <span class="kw">const</span> url = <span class="kw">new</span> <span class="cls">URL</span>(req.<span class="prop">url</span>);

    <span class="kw">if</span> (url.<span class="prop">pathname</span> === <span class="str">"/tasks"</span>) {
      <span class="kw">if</span> (req.<span class="prop">method</span> === <span class="str">"GET"</span>) {
        <span class="kw">return</span> <span class="cls">Response</span>.<span class="fn">json</span>([...tasks.<span class="fn">values</span>()]);
      }
      <span class="kw">if</span> (req.<span class="prop">method</span> === <span class="str">"POST"</span>) {
        <span class="kw">const</span> body = <span class="kw">await</span> req.<span class="fn">json</span>() <span class="kw">as</span> <span class="cls">Partial</span>&lt;<span class="cls">Task</span>&gt;;
        <span class="kw">const</span> task: <span class="cls">Task</span> = {
          id:       crypto.<span class="fn">randomUUID</span>(),
          title:    body.<span class="prop">title</span> ?? <span class="str">"Untitled"</span>,
          status:   <span class="str">"todo"</span>,
          priority: body.<span class="prop">priority</span> ?? <span class="str">"medium"</span>,
        };
        tasks.<span class="fn">set</span>(task.<span class="prop">id</span>, task);
        <span class="kw">return</span> <span class="cls">Response</span>.<span class="fn">json</span>(task, { status: <span class="num">201</span> });
      }
    }

    <span class="kw">const</span> taskIdMatch = url.<span class="prop">pathname</span>.<span class="fn">match</span>(<span class="str">/^\/tasks\/([^/]+)$/</span>);
    <span class="kw">if</span> (taskIdMatch && req.<span class="prop">method</span> === <span class="str">"GET"</span>) {
      <span class="kw">const</span> task = tasks.<span class="fn">get</span>(taskIdMatch[<span class="num">1</span>]);
      <span class="kw">return</span> task
        ? <span class="cls">Response</span>.<span class="fn">json</span>(task)
        : <span class="cls">Response</span>.<span class="fn">json</span>({ error: <span class="str">"Not found"</span> }, { status: <span class="num">404</span> });
    }

    <span class="kw">return</span> <span class="cls">Response</span>.<span class="fn">json</span>({ error: <span class="str">"Not found"</span> }, { status: <span class="num">404</span> });
  },

  <span class="cmt">// Error handler — called for unhandled throws</span>
  <span class="fn">error</span>(err: <span class="cls">Error</span>): <span class="cls">Response</span> {
    console.<span class="fn">error</span>(err);
    <span class="kw">return</span> <span class="cls">Response</span>.<span class="fn">json</span>({ error: <span class="str">"Internal server error"</span> }, { status: <span class="num">500</span> });
  },
});

console.<span class="fn">log</span>(<span class="str">`TaskFlow running at http://localhost:${server.port}`</span>);</code></pre>
</div>

<h2>Elysia — The Bun-Native Framework</h2>
<p>Elysia is to Bun what Express is to Node.js — the dominant web framework. But unlike Express, Elysia was designed specifically for Bun. It uses TypeScript generics deeply to provide end-to-end type safety with zero runtime overhead:</p>

<div class="code-block">
  <div class="code-header"><span class="code-lang">TypeScript</span><span class="code-filename">elysia-server.ts</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
  <pre><code><span class="kw">import</span> { Elysia, t } <span class="kw">from</span> <span class="str">"elysia"</span>;
<span class="kw">import</span> { cors }    <span class="kw">from</span> <span class="str">"@elysiajs/cors"</span>;
<span class="kw">import</span> { swagger } <span class="kw">from</span> <span class="str">"@elysiajs/swagger"</span>;
<span class="kw">import</span> { jwt }     <span class="kw">from</span> <span class="str">"@elysiajs/jwt"</span>;
<span class="kw">import</span> { bearer }  <span class="kw">from</span> <span class="str">"@elysiajs/bearer"</span>;

<span class="cmt">// t is Elysia's built-in schema type system (based on TypeBox)</span>
<span class="cmt">// It provides BOTH TypeScript types AND runtime validation — no Joi/Zod needed</span>
<span class="kw">const</span> TaskSchema = t.<span class="fn">Object</span>({
  title:    t.<span class="fn">String</span>({ minLength: <span class="num">1</span>, maxLength: <span class="num">255</span> }),
  priority: t.<span class="fn">Union</span>([t.<span class="fn">Literal</span>(<span class="str">'low'</span>), t.<span class="fn">Literal</span>(<span class="str">'medium'</span>), t.<span class="fn">Literal</span>(<span class="str">'high'</span>), t.<span class="fn">Literal</span>(<span class="str">'urgent'</span>)]),
  dueDate:  t.<span class="fn">Optional</span>(t.<span class="fn">String</span>({ format: <span class="str">'date'</span> })),
});

<span class="kw">const</span> tasks = <span class="kw">new</span> <span class="cls">Map</span>&lt;string, <span class="kw">any</span>&gt;();

<span class="kw">const</span> app = <span class="kw">new</span> <span class="cls">Elysia</span>()
  .<span class="fn">use</span>(<span class="fn">cors</span>())
  .<span class="fn">use</span>(<span class="fn">swagger</span>())   <span class="cmt">// auto-generates OpenAPI docs at /swagger</span>
  .<span class="fn">use</span>(<span class="fn">jwt</span>({ name: <span class="str">'jwt'</span>, secret: process.env.<span class="prop">JWT_SECRET</span>! }))
  .<span class="fn">use</span>(<span class="fn">bearer</span>())

  <span class="cmt">// Derive authenticated user once, available in all guarded routes</span>
  .<span class="fn">derive</span>(<span class="kw">async</span> ({ jwt, bearer }) => {
    <span class="kw">const</span> user = <span class="kw">await</span> jwt.<span class="fn">verify</span>(bearer);
    <span class="kw">return</span> { user };
  })

  <span class="cmt">// GET /tasks</span>
  .<span class="fn">get</span>(<span class="str">'/tasks'</span>, ({ user }) => {
    <span class="kw">if</span> (!user) <span class="kw">throw new</span> <span class="cls">Error</span>(<span class="str">'Unauthorized'</span>);
    <span class="kw">return</span> [...tasks.<span class="fn">values</span>()].<span class="fn">filter</span>(t => t.<span class="prop">userId</span> === user.<span class="prop">id</span>);
  })

  <span class="cmt">// POST /tasks — body is automatically validated against TaskSchema</span>
  <span class="cmt">// TypeScript knows the exact shape of body without any cast!</span>
  .<span class="fn">post</span>(<span class="str">'/tasks'</span>, ({ body, user }) => {
    <span class="kw">if</span> (!user) <span class="kw">throw new</span> <span class="cls">Error</span>(<span class="str">'Unauthorized'</span>);
    <span class="kw">const</span> task = { id: crypto.<span class="fn">randomUUID</span>(), ...body, status: <span class="str">'todo'</span>, userId: user.<span class="prop">id</span> };
    tasks.<span class="fn">set</span>(task.<span class="prop">id</span>, task);
    <span class="kw">return</span> task;
  }, {
    body:   TaskSchema,
    status: <span class="num">201</span>,    <span class="cmt">// response status for success</span>
  })

  .<span class="fn">get</span>(<span class="str">'/tasks/:id'</span>, ({ params: { id }, user }) => {
    <span class="kw">if</span> (!user) <span class="kw">throw new</span> <span class="cls">Error</span>(<span class="str">'Unauthorized'</span>);
    <span class="kw">const</span> task = tasks.<span class="fn">get</span>(id);
    <span class="kw">if</span> (!task || task.<span class="prop">userId</span> !== user.<span class="prop">id</span>) <span class="kw">throw new</span> <span class="cls">Error</span>(<span class="str">'Not found'</span>);
    <span class="kw">return</span> task;
  })

  .<span class="fn">listen</span>(<span class="num">3000</span>);

console.<span class="fn">log</span>(<span class="str">`TaskFlow Elysia running at http://localhost:${app.server?.port}`</span>);</code></pre>
</div>

<h2>Bun's Native APIs — What's Different</h2>
<p>Bun extends the JavaScript standard library with fast native APIs that replace popular npm packages:</p>

<div class="code-block">
  <div class="code-header"><span class="code-lang">TypeScript</span><span class="code-filename">Bun native APIs</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
  <pre><code><span class="cmt">// ── File I/O — much simpler than Node's fs ────────────────</span>
<span class="kw">const</span> file = Bun.<span class="fn">file</span>(<span class="str">"./data.json"</span>);            <span class="cmt">// lazy file reference</span>
<span class="kw">const</span> data = <span class="kw">await</span> file.<span class="fn">json</span>();                   <span class="cmt">// read + parse</span>
<span class="kw">const</span> text = <span class="kw">await</span> file.<span class="fn">text</span>();                   <span class="cmt">// read as string</span>
console.<span class="fn">log</span>(file.<span class="prop">size</span>, file.<span class="prop">type</span>);               <span class="cmt">// size in bytes, MIME type</span>
<span class="kw">await</span> Bun.<span class="fn">write</span>(<span class="str">"./output.json"</span>, <span class="cls">JSON</span>.<span class="fn">stringify</span>(data));  <span class="cmt">// write</span>

<span class="cmt">// ── Hashing — no crypto module needed ────────────────────</span>
<span class="kw">const</span> hash = Bun.<span class="fn">hash</span>(<span class="str">"hello world"</span>);             <span class="cmt">// fast non-cryptographic hash</span>
<span class="kw">const</span> md5  = <span class="kw">new</span> Bun.<span class="cls">CryptoHasher</span>(<span class="str">"md5"</span>).<span class="fn">update</span>(<span class="str">"data"</span>).<span class="fn">digest</span>(<span class="str">"hex"</span>);
<span class="kw">const</span> sha  = <span class="kw">new</span> Bun.<span class="cls">CryptoHasher</span>(<span class="str">"sha256"</span>).<span class="fn">update</span>(buffer).<span class="fn">digest</span>(<span class="str">"base64"</span>);

<span class="cmt">// ── Password hashing — bcrypt built-in ───────────────────</span>
<span class="kw">const</span> hashed   = <span class="kw">await</span> Bun.password.<span class="fn">hash</span>(<span class="str">"user_password"</span>);
<span class="kw">const</span> isValid  = <span class="kw">await</span> Bun.password.<span class="fn">verify</span>(<span class="str">"user_password"</span>, hashed);
<span class="cmt">// Uses argon2id by default (more secure than bcrypt) or bcrypt if specified:</span>
<span class="kw">const</span> bcryptHash = <span class="kw">await</span> Bun.password.<span class="fn">hash</span>(<span class="str">"pass"</span>, { algorithm: <span class="str">"bcrypt"</span>, cost: <span class="num">12</span> });

<span class="cmt">// ── SQLite — built directly into Bun ─────────────────────</span>
<span class="kw">import</span> { Database } <span class="kw">from</span> <span class="str">"bun:sqlite"</span>;

<span class="kw">const</span> db = <span class="kw">new</span> <span class="cls">Database</span>(<span class="str">"taskflow.db"</span>);
db.<span class="fn">exec</span>(<span class="str">`CREATE TABLE IF NOT EXISTS tasks (
  id TEXT PRIMARY KEY,
  title TEXT NOT NULL,
  status TEXT DEFAULT 'todo',
  priority TEXT DEFAULT 'medium',
  created_at INTEGER DEFAULT (unixepoch())
)`</span>);

<span class="kw">const</span> insertTask = db.<span class="fn">prepare</span>(<span class="str">`
  INSERT INTO tasks (id, title, priority) VALUES ($id, $title, $priority)
  RETURNING *
`</span>);

<span class="kw">const</span> newTask = insertTask.<span class="fn">get</span>({ $id: crypto.<span class="fn">randomUUID</span>(), $title: <span class="str">"Write tests"</span>, $priority: <span class="str">"high"</span> });

<span class="kw">const</span> getAllTasks = db.<span class="fn">prepare</span>(<span class="str">"SELECT * FROM tasks ORDER BY created_at DESC"</span>);
<span class="kw">const</span> allTasks = getAllTasks.<span class="fn">all</span>();   <span class="cmt">// synchronous — SQLite doesn't need async</span>

<span class="cmt">// ── Environment variables ─────────────────────────────────</span>
<span class="kw">const</span> port = Bun.<span class="prop">env</span>.<span class="prop">PORT</span> ?? <span class="str">"3000"</span>;   <span class="cmt">// typed shorthand for process.env</span>
<span class="kw">const</span> secret = Bun.<span class="prop">env</span>.<span class="prop">JWT_SECRET</span>!;

<span class="cmt">// ── Spawn subprocesses ────────────────────────────────────</span>
<span class="kw">const</span> proc = Bun.<span class="fn">spawn</span>([<span class="str">"ffmpeg"</span>, <span class="str">"-i"</span>, <span class="str">"input.mp4"</span>, <span class="str">"output.mp4"</span>]);
<span class="kw">await</span> proc.<span class="prop">exited</span>;   <span class="cmt">// Promise that resolves when process exits</span>
console.<span class="fn">log</span>(<span class="str">"Exit code:"</span>, proc.<span class="prop">exitCode</span>);</code></pre>
</div>

<h2>When to Choose What</h2>

<div class="code-block">
  <div class="code-header"><span class="code-lang">text</span><span class="code-filename">Decision guide</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
  <pre><code>Choose Node.js when:
  ✅ Existing codebase you're maintaining
  ✅ Maximum npm ecosystem compatibility needed
  ✅ Team already knows Node deeply
  ✅ Deploying to environments where only Node is supported
  ✅ Using packages with native C++ addons (some don't work on Bun/Deno)
  ✅ Production stability is the #1 priority

Choose Bun when:
  ✅ New project where raw performance matters
  ✅ You want the Node ecosystem but faster (npm compat is excellent)
  ✅ Building CLI tools (startup time is dramatically better)
  ✅ Lambda/serverless where cold starts matter
  ✅ You want TypeScript without any tooling overhead
  ✅ Building a new API and want SQLite without dependencies

Choose Deno when:
  ✅ Security is paramount (supply-chain attack prevention)
  ✅ Greenfield TypeScript project with modern practices
  ✅ Deploying to Deno Deploy (global edge, excellent DX)
  ✅ Scripts and automation tools that access sensitive systems
  ✅ You want a fully integrated toolchain (fmt, lint, test, compile)
  ✅ Team wants to avoid node_modules entirely</code></pre>
</div>

<div class="callout success">
  <div class="callout-title">✅ The Takeaway</div>
  <p>None of these runtimes is universally better. Node.js remains the safe default for production work and the largest ecosystem. Bun is the best choice for performance-critical new projects that want Node compatibility. Deno is the best choice for security-first TypeScript projects and edge deployment. Knowing all three makes you a more versatile and informed engineer — and most importantly, the Express, Sequelize, Knex, JWT, and testing patterns you've learned in this course transfer directly to all of them.</p>
</div></template>
