      updatedAt: { type: <span class="cls">Sequelize</span>.<span class="cls">DATE</span>, allowNull: <span class="kw">false</span> },
    });
    <span class="kw">await</span> queryInterface.<span class="fn">addIndex</span>(<span class="str">'users'</span>, [<span class="str">'email'</span>], { unique: <span class="kw">true</span> });
  },
  <span class="kw">async</span> <span class="fn">down</span>(queryInterface) {
    <span class="kw">await</span> queryInterface.<span class="fn">dropTable</span>(<span class="str">'users'</span>);
  },
};</code></pre></div>
<div class="callout success"><div class="callout-title">✅ Database Layer Live</div><p>Sequelize configured, models with validation and hooks, associations wired, and migrations in place. The app can now read and write to PostgreSQL.</p></div>

<h2>Seeders — Populating Test Data</h2>
<p>Seeders are scripts that insert sample data into your database. They're invaluable for development (get a working app state instantly) and for setting up a staging environment that mirrors production data shape.</p>
<div class="code-block"><div class="code-header"><span class="code-lang">bash</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
<pre><code>npx sequelize-cli seed:generate --name demo-users
npx sequelize-cli db:seed:all       <span class="cmt"># run all seeders</span>
npx sequelize-cli db:seed:undo:all  <span class="cmt"># undo all seeders</span></code></pre></div>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/seeders/20240101-demo-users.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
<pre><code><span class="str">'use strict'</span>;
<span class="kw">const</span> bcrypt = <span class="fn">require</span>(<span class="str">'bcryptjs'</span>);
<span class="kw">const</span> { v4: uuidv4 } = <span class="fn">require</span>(<span class="str">'uuid'</span>);

module.exports = {
  <span class="kw">async</span> <span class="fn">up</span>(queryInterface) {
    <span class="kw">const</span> hashedPassword = <span class="kw">await</span> bcrypt.<span class="fn">hash</span>(<span class="str">'password123'</span>, <span class="num">12</span>);
    <span class="kw">const</span> now = <span class="kw">new</span> <span class="cls">Date</span>();

    <span class="kw">await</span> queryInterface.<span class="fn">bulkInsert</span>(<span class="str">'users'</span>, [
      { id: <span class="fn">uuidv4</span>(), name: <span class="str">'Alice Admin'</span>,  email: <span class="str">'alice@demo.com'</span>, password: hashedPassword, role: <span class="str">'admin'</span>,  createdAt: now, updatedAt: now },
      { id: <span class="fn">uuidv4</span>(), name: <span class="str">'Bob Builder'</span>,  email: <span class="str">'bob@demo.com'</span>,   password: hashedPassword, role: <span class="str">'user'</span>,   createdAt: now, updatedAt: now },
      { id: <span class="fn">uuidv4</span>(), name: <span class="str">'Carol Coder'</span>,  email: <span class="str">'carol@demo.com'</span>, password: hashedPassword, role: <span class="str">'user'</span>,   createdAt: now, updatedAt: now },
    ]);
  },

  <span class="kw">async</span> <span class="fn">down</span>(queryInterface) {
    <span class="kw">await</span> queryInterface.<span class="fn">bulkDelete</span>(<span class="str">'users'</span>, {
      email: { [<span class="kw">require</span>(<span class="str">'sequelize'</span>).<span class="cls">Op</span>.<span class="prop">in</span>]: [<span class="str">'alice@demo.com'</span>, <span class="str">'bob@demo.com'</span>, <span class="str">'carol@demo.com'</span>] }
    });
  },
};</code></pre></div>
<h2>Sequelize Transactions</h2>
<p>Sequelize also supports transactions natively, making it easy to use alongside your model methods:</p>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">Sequelize transactions</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
<pre><code><span class="kw">const</span> { sequelize, Task, Project } = <span class="fn">require</span>(<span class="str">'../models'</span>);

<span class="kw">const</span> <span class="fn">moveTaskToProject</span> = <span class="kw">async</span> (taskId, newProjectId, userId) => {
  <span class="kw">return</span> sequelize.<span class="fn">transaction</span>(<span class="kw">async</span> (t) => {
    <span class="cmt">// All queries inside use the same transaction</span>
    <span class="kw">const</span> task = <span class="kw">await</span> Task.<span class="fn">findOne</span>({ where: { id: taskId, userId }, transaction: t });
    <span class="kw">if</span> (!task) <span class="kw">throw new</span> <span class="cls">Error</span>(<span class="str">'Task not found'</span>);

    <span class="kw">const</span> project = <span class="kw">await</span> Project.<span class="fn">findOne</span>({ where: { id: newProjectId, ownerId: userId }, transaction: t });
    <span class="kw">if</span> (!project) <span class="kw">throw new</span> <span class="cls">Error</span>(<span class="str">'Project not found'</span>);

    <span class="kw">await</span> task.<span class="fn">update</span>({ projectId: newProjectId }, { transaction: t });
    <span class="cmt">// If anything above throws, the whole transaction rolls back</span>
    <span class="kw">return</span> { task, project };
  });
};</code></pre></div>
</template>
<template id="tpl-sequelize-advanced">
<div class="chapter-header"><div class="ch-eyebrow">Chapter 09 · Database</div><h1 class="ch-title">Sequelize Advanced</h1><p class="ch-subtitle">Hooks, scopes, eager loading, and virtual fields — the features that separate a basic Sequelize setup from a production-quality one.</p></div>
<h2>Lifecycle Hooks</h2>
<p>Hooks run code automatically at specific points in a model's lifecycle. We already used <code>beforeSave</code> to hash passwords. Here are more powerful patterns:</p>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">Task hooks</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="cls">Task</span>.<span class="fn">init</span>({ <span class="cmt">/* fields */</span> }, {
  sequelize, modelName: <span class="str">'Task'</span>,
  hooks: {
    <span class="cmt">// Auto-set completedAt when status changes to 'done'</span>
    beforeUpdate: (task) => {
      <span class="kw">if</span> (task.<span class="fn">changed</span>(<span class="str">'status'</span>)) {
        task.<span class="prop">completedAt</span> = task.<span class="prop">status</span> === <span class="str">'done'</span> ? <span class="kw">new</span> <span class="cls">Date</span>() : <span class="kw">null</span>;
      }
    },
    <span class="cmt">// Audit log every deletion</span>
    afterDestroy: <span class="kw">async</span> (task) => {
      <span class="kw">await</span> <span class="cls">AuditLog</span>.<span class="fn">create</span>({ action: <span class="str">'TASK_DELETED'</span>, resourceId: task.<span class="prop">id</span>, userId: task.<span class="prop">userId</span> });
    },
  },
});</code></pre></div>
<h2>Scopes — Reusable Query Conditions</h2>
<p>Scopes let you define named query conditions on the model. Instead of repeating <code>where: { status: 'todo' }</code> everywhere, define it once and chain it by name. This keeps your query logic DRY and centralised.</p>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">Task scopes</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="cls">Task</span>.<span class="fn">init</span>({ <span class="cmt">/* fields */</span> }, {
  sequelize, modelName: <span class="str">'Task'</span>,
  scopes: {
    <span class="cmt">// Default scope — exclude archived from all queries</span>
    defaultScope: { where: { status: { [<span class="cls">Op</span>.<span class="prop">ne</span>]: <span class="str">'archived'</span> } } },

    active:  { where: { status: [<span class="str">'todo'</span>, <span class="str">'in_progress'</span>] } },
    overdue: { where: { dueDate: { [<span class="cls">Op</span>.<span class="prop">lt</span>]: <span class="kw">new</span> <span class="cls">Date</span>() }, status: { [<span class="cls">Op</span>.<span class="prop">notIn</span>]: [<span class="str">'done'</span>,<span class="str">'archived'</span>] } } },

    <span class="cmt">// Dynamic scopes — functions that return a query object</span>
    forUser(userId) { <span class="kw">return</span> { where: { userId } }; },
    withPriority(p) { <span class="kw">return</span> { where: { priority: p } }; },
  },
});

<span class="cmt">// Usage:</span>
<span class="kw">const</span> tasks = <span class="kw">await</span> <span class="cls">Task</span>.<span class="fn">scope</span>([{ method: [<span class="str">'forUser'</span>, userId] }, <span class="str">'overdue'</span>]).<span class="fn">findAll</span>();
<span class="kw">const</span> all   = <span class="kw">await</span> <span class="cls">Task</span>.<span class="fn">unscoped</span>().<span class="fn">findAll</span>(); <span class="cmt">// bypass defaultScope</span></code></pre></div>
<h2>Eager Loading — Avoiding N+1 Queries</h2>
<p>The N+1 problem: you fetch 20 tasks (1 query), then for each task you fetch its project (20 more queries = 21 total). Eager loading fetches everything in a single JOIN query.</p>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">Eager loading</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> { <span class="cls">Task</span>, <span class="cls">User</span>, <span class="cls">Project</span> } = <span class="fn">require</span>(<span class="str">'../models'</span>);

<span class="cmt">// Single query with JOINs — much faster than N+1</span>
<span class="kw">const</span> tasks = <span class="kw">await</span> <span class="cls">Task</span>.<span class="fn">findAll</span>({
  where: { userId },
  include: [
    { model: <span class="cls">User</span>,    as: <span class="str">'owner'</span>,   attributes: [<span class="str">'id'</span>,<span class="str">'name'</span>,<span class="str">'email'</span>] },
    { model: <span class="cls">Project</span>, as: <span class="str">'project'</span>, attributes: [<span class="str">'id'</span>,<span class="str">'name'</span>], required: <span class="kw">false</span> }, <span class="cmt">// LEFT JOIN</span>
  ],
  order: [[<span class="str">'createdAt'</span>, <span class="str">'DESC'</span>]], limit: <span class="num">20</span>,
});</code></pre></div>
<h2>Operators for Complex Queries</h2>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">Sequelize operators</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> { <span class="cls">Op</span> } = <span class="fn">require</span>(<span class="str">'sequelize'</span>);

<span class="kw">await</span> <span class="cls">Task</span>.<span class="fn">findAll</span>({
  where: {
    userId,
    status:   { [<span class="cls">Op</span>.<span class="prop">in</span>]:  [<span class="str">'todo'</span>, <span class="str">'in_progress'</span>] },
    dueDate:  { [<span class="cls">Op</span>.<span class="prop">gte</span>]: <span class="kw">new</span> <span class="cls">Date</span>(<span class="str">'2024-01-01'</span>), [<span class="cls">Op</span>.<span class="prop">lte</span>]: <span class="kw">new</span> <span class="cls">Date</span>(<span class="str">'2024-12-31'</span>) },
    [<span class="cls">Op</span>.<span class="prop">or</span>]: [
      { priority: <span class="str">'urgent'</span> },
      { priority: <span class="str">'high'</span>, dueDate: { [<span class="cls">Op</span>.<span class="prop">lt</span>]: <span class="kw">new</span> <span class="cls">Date</span>() } },
    ],
    title: { [<span class="cls">Op</span>.<span class="prop">iLike</span>]: <span class="str">`%${searchTerm}%`</span> }, <span class="cmt">// case-insensitive LIKE</span>
  },
});</code></pre></div>
<h2>Virtual Fields</h2>
<p>Virtual fields are computed properties that don't map to a database column — they're calculated on the fly from other fields.</p>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">Virtual field definition</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code>isOverdue: {
  type: <span class="cls">DataTypes</span>.<span class="cls">VIRTUAL</span>,
  get() {
    <span class="kw">return</span> <span class="kw">this</span>.<span class="prop">dueDate</span>
      && <span class="kw">this</span>.<span class="prop">dueDate</span> < <span class="kw">new</span> <span class="cls">Date</span>()
      && ![<span class="str">'done'</span>,<span class="str">'archived'</span>].<span class="fn">includes</span>(<span class="kw">this</span>.<span class="prop">status</span>);
  }
},
daysUntilDue: {
  type: <span class="cls">DataTypes</span>.<span class="cls">VIRTUAL</span>,
  get() {
    <span class="kw">if</span> (!<span class="kw">this</span>.<span class="prop">dueDate</span>) <span class="kw">return</span> <span class="kw">null</span>;
    <span class="kw">return</span> <span class="cls">Math</span>.<span class="fn">ceil</span>((<span class="kw">new</span> <span class="cls">Date</span>(<span class="kw">this</span>.<span class="prop">dueDate</span>) - <span class="kw">new</span> <span class="cls">Date</span>()) / <span class="num">86400000</span>);
  }
},</code></pre></div>
<div class="callout success"><div class="callout-title">✅ Advanced Sequelize Mastered</div><p>Hooks automate lifecycle behaviors, scopes keep queries DRY, eager loading eliminates N+1 problems, and virtual fields add computed properties — all without a database column.</p></div>
</template>
<template id="tpl-knex"><div class="chapter-header"><div class="ch-eyebrow">Chapter 10 · Database</div><h1 class="ch-title">Knex.js Query Builder</h1><p class="ch-subtitle">Sometimes you need the raw expressiveness of SQL but with a JavaScript API that handles parameterization, dialect differences, and migrations. Knex.js hits that sweet spot — not an ORM, not raw SQL, but the best of both.</p></div>

<h2>Knex vs Sequelize — When to Use Which</h2>
<p>These tools are not competitors — they solve different problems and work beautifully together in the same project:</p>
<table>
<thead><tr><th>Scenario</th><th>Better Tool</th><th>Why</th></tr></thead>
<tbody>
<tr><td>Standard CRUD on well-defined models</td><td>Sequelize</td><td>Model instances, hooks, associations</td></tr>
<tr><td>Complex analytics reports with many JOINs</td><td>Knex</td><td>SQL expressiveness without string building</td></tr>
<tr><td>Aggregations, GROUP BY, FILTER clauses</td><td>Knex</td><td>Maps naturally to SQL intent</td></tr>
<tr><td>Raw SQL Sequelize struggles to express</td><td>Knex</td><td>Escape hatch to full SQL power</td></tr>
<tr><td>Multi-table transactions</td><td>Knex</td><td>Explicit transaction control</td></tr>
<tr><td>Lightweight scripts without model overhead</td><td>Knex</td><td>Minimal setup, just queries</td></tr>
</tbody>
</table>

<div class="callout info"><div class="callout-title">💡 Using Both in TaskFlow</div><p>In TaskFlow, Sequelize handles all day-to-day CRUD (creating tasks, fetching users, updating projects). Knex handles the analytics dashboard and any report that would require multiple subqueries or complex aggregations. They share the same PostgreSQL database — no conflict, no duplication.</p></div>

<h2>Setting Up Knex</h2>

<div class="code-block"><div class="code-header"><span class="code-lang">bash</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code>npm install knex pg
npx knex init   <span class="cmt"># creates knexfile.js in project root</span></code></pre></div>

<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">knexfile.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code>require(<span class="str">'dotenv'</span>).config();

module.exports = {
  development: {
    client: <span class="str">'pg'</span>,
    connection: {
      host:     process.env.<span class="prop">DB_HOST</span>     || <span class="str">'localhost'</span>,
      port:     process.env.<span class="prop">DB_PORT</span>     || <span class="num">5432</span>,
      user:     process.env.<span class="prop">DB_USER</span>     || <span class="str">'postgres'</span>,
      password: process.env.<span class="prop">DB_PASSWORD</span> || <span class="str">''</span>,
      database: process.env.<span class="prop">DB_NAME</span>     || <span class="str">'taskflow_dev'</span>,
    },
    migrations: { directory: <span class="str">'./src/knex-migrations'</span> },
    seeds:      { directory: <span class="str">'./src/knex-seeds'</span> },
    <span class="cmt">// Log every query in development — great for debugging</span>
    debug: process.env.<span class="prop">KNEX_DEBUG</span> === <span class="str">'true'</span>,
  },
  test: {
    client: <span class="str">'pg'</span>,
    connection: { <span class="cmt">/* same structure, different DB_NAME */</span> },
    migrations: { directory: <span class="str">'./src/knex-migrations'</span> },
  },
  production: {
    client: <span class="str">'pg'</span>,
    connection: process.env.<span class="prop">DATABASE_URL</span>,
    pool: { min: <span class="num">2</span>, max: <span class="num">10</span> },
    migrations: { directory: <span class="str">'./src/knex-migrations'</span> },
  },
};</code></pre></div>

<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/config/knex.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> knex = <span class="fn">require</span>(<span class="str">'knex'</span>);
<span class="kw">const</span> knexConfig = <span class="fn">require</span>(<span class="str">'../../knexfile'</span>);

<span class="kw">const</span> env = process.env.<span class="prop">NODE_ENV</span> || <span class="str">'development'</span>;
<span class="kw">const</span> db = <span class="fn">knex</span>(knexConfig[env]);

db.<span class="fn">raw</span>(<span class="str">'SELECT 1+1 AS result'</span>)
  .<span class="fn">then</span>(() => console.<span class="fn">log</span>(<span class="str">'✅ Knex connected'</span>))
  .<span class="fn">catch</span>(err => console.<span class="fn">error</span>(<span class="str">'❌ Knex error:'</span>, err.<span class="prop">message</span>));

module.exports = db;</code></pre></div>

<h2>The Knex Query API — Complete Reference</h2>
<p>Knex has a fluent chainable API that closely mirrors SQL. Each method call adds a SQL clause. The query doesn't execute until you <code>await</code> it:</p>

<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">SELECT queries</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> db = <span class="fn">require</span>(<span class="str">'../config/knex'</span>);

<span class="cmt">// Basic SELECT with filtering and sorting</span>
<span class="kw">const</span> tasks = <span class="kw">await</span> db(<span class="str">'tasks'</span>)
  .<span class="fn">select</span>(<span class="str">'id'</span>, <span class="str">'title'</span>, <span class="str">'status'</span>, <span class="str">'priority'</span>, <span class="str">'due_date'</span>)
  .<span class="fn">where</span>({ user_id: userId, status: <span class="str">'todo'</span> })
  .<span class="fn">whereNotNull</span>(<span class="str">'due_date'</span>)
  .<span class="fn">orderBy</span>(<span class="str">'due_date'</span>, <span class="str">'asc'</span>)
  .<span class="fn">limit</span>(<span class="num">20</span>)
  .<span class="fn">offset</span>((page - <span class="num">1</span>) * <span class="num">20</span>);

<span class="cmt">// whereIn — multiple statuses</span>
<span class="kw">const</span> active = <span class="kw">await</span> db(<span class="str">'tasks'</span>)
  .<span class="fn">select</span>(<span class="str">'*'</span>)
  .<span class="fn">where</span>(<span class="str">'user_id'</span>, userId)
  .<span class="fn">whereIn</span>(<span class="str">'status'</span>, [<span class="str">'todo'</span>, <span class="str">'in_progress'</span>, <span class="str">'review'</span>])
  .<span class="fn">whereNull</span>(<span class="str">'deleted_at'</span>);

<span class="cmt">// whereBetween — date range</span>
<span class="kw">const</span> thisWeek = <span class="kw">await</span> db(<span class="str">'tasks'</span>)
  .<span class="fn">where</span>(<span class="str">'user_id'</span>, userId)
  .<span class="fn">whereBetween</span>(<span class="str">'due_date'</span>, [startOfWeek, endOfWeek]);

<span class="cmt">// orWhere — combine conditions</span>
<span class="kw">const</span> urgent = <span class="kw">await</span> db(<span class="str">'tasks'</span>)
  .<span class="fn">where</span>(<span class="str">'user_id'</span>, userId)
  .<span class="fn">where</span>(function() {
    <span class="kw">this</span>.<span class="fn">where</span>(<span class="str">'priority'</span>, <span class="str">'urgent'</span>)
        .<span class="fn">orWhere</span>(<span class="str">'priority'</span>, <span class="str">'high'</span>);
  });</code></pre></div>

<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">JOINs and aggregations</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="cmt">// JOIN across tables — tasks with project and owner info</span>
<span class="kw">const</span> richTasks = <span class="kw">await</span> db(<span class="str">'tasks'</span>)
  .<span class="fn">select</span>(
    <span class="str">'tasks.id'</span>, <span class="str">'tasks.title'</span>, <span class="str">'tasks.status'</span>, <span class="str">'tasks.priority'</span>,
    <span class="str">'projects.name as project_name'</span>,
    <span class="str">'users.email as owner_email'</span>,
    <span class="str">'users.name as owner_name'</span>
  )
  .<span class="fn">join</span>(<span class="str">'users'</span>,    <span class="str">'users.id'</span>,    <span class="str">'tasks.user_id'</span>)    <span class="cmt">// INNER JOIN</span>
  .<span class="fn">leftJoin</span>(<span class="str">'projects'</span>, <span class="str">'projects.id'</span>, <span class="str">'tasks.project_id'</span>) <span class="cmt">// LEFT JOIN — include tasks without projects</span>
  .<span class="fn">where</span>(<span class="str">'tasks.user_id'</span>, userId)
  .<span class="fn">orderBy</span>(<span class="str">'tasks.created_at'</span>, <span class="str">'desc'</span>);

<span class="cmt">// Aggregation — task counts grouped by status</span>
<span class="kw">const</span> statusStats = <span class="kw">await</span> db(<span class="str">'tasks'</span>)
  .<span class="fn">select</span>(<span class="str">'status'</span>)
  .<span class="fn">count</span>(<span class="str">'* as total'</span>)
  .<span class="fn">where</span>({ user_id: userId })
  .<span class="fn">groupBy</span>(<span class="str">'status'</span>)
  .<span class="fn">orderBy</span>(<span class="str">'total'</span>, <span class="str">'desc'</span>);
<span class="cmt">// Returns: [{status:'todo',total:'8'},{status:'done',total:'23'}]</span>
<span class="cmt">// Note: count values come back as strings from pg — parseInt() them</span></code></pre></div>

<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">INSERT, UPDATE, DELETE</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="cmt">// INSERT — .returning('*') gives back the created row (Postgres only)</span>
<span class="kw">const</span> [newTask] = <span class="kw">await</span> db(<span class="str">'tasks'</span>)
  .<span class="fn">insert</span>({
    id:         db.<span class="fn">raw</span>(<span class="str">'gen_random_uuid()'</span>),
    title:      <span class="str">'Implement caching'</span>,
    status:     <span class="str">'todo'</span>,
    priority:   <span class="str">'high'</span>,
    user_id:    userId,
    created_at: db.<span class="prop">fn</span>.<span class="fn">now</span>(),
    updated_at: db.<span class="prop">fn</span>.<span class="fn">now</span>(),
  })
  .<span class="fn">returning</span>(<span class="str">'*'</span>);

<span class="cmt">// UPDATE with .returning()</span>
<span class="kw">const</span> [updated] = <span class="kw">await</span> db(<span class="str">'tasks'</span>)
  .<span class="fn">where</span>({ id: taskId, user_id: userId })  <span class="cmt">// ownership check in the query itself</span>
  .<span class="fn">update</span>({ status: <span class="str">'done'</span>, completed_at: db.<span class="prop">fn</span>.<span class="fn">now</span>(), updated_at: db.<span class="prop">fn</span>.<span class="fn">now</span>() })
  .<span class="fn">returning</span>([<span class="str">'id'</span>, <span class="str">'status'</span>, <span class="str">'completed_at'</span>]);

<span class="cmt">// DELETE — returns number of rows deleted</span>
<span class="kw">const</span> deleted = <span class="kw">await</span> db(<span class="str">'tasks'</span>)
  .<span class="fn">where</span>({ id: taskId, user_id: userId })
  .<span class="fn">delete</span>();
<span class="kw">if</span> (deleted === <span class="num">0</span>) <span class="kw">throw new</span> <span class="cls">NotFoundError</span>(<span class="str">'Task'</span>); <span class="cmt">// didn't exist or wrong owner</span></code></pre></div>

<h2>Transactions — Atomic Multi-Step Operations</h2>
<p>A transaction wraps multiple queries so they either all commit or all roll back. This is essential any time you need two or more database changes to be inseparable — if one fails, the others must be undone too.</p>

<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">Knex transactions</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="cmt">// Pattern 1: callback-style (auto-commit or auto-rollback)</span>
<span class="kw">const</span> <span class="fn">createProjectWithTask</span> = <span class="kw">async</span> (projectData, taskData, userId) => {
  <span class="kw">return</span> db.<span class="fn">transaction</span>(<span class="kw">async</span> (trx) => {

    <span class="cmt">// Every query inside uses 'trx' instead of 'db'</span>
    <span class="kw">const</span> [project] = <span class="kw">await</span> trx(<span class="str">'projects'</span>)
      .<span class="fn">insert</span>({ id: trx.<span class="fn">raw</span>(<span class="str">'gen_random_uuid()'</span>), ...projectData, owner_id: userId })
      .<span class="fn">returning</span>(<span class="str">'*'</span>);

    <span class="kw">const</span> [task] = <span class="kw">await</span> trx(<span class="str">'tasks'</span>)
      .<span class="fn">insert</span>({ id: trx.<span class="fn">raw</span>(<span class="str">'gen_random_uuid()'</span>), ...taskData, project_id: project.<span class="prop">id</span>, user_id: userId })
      .<span class="fn">returning</span>(<span class="str">'*'</span>);

    <span class="cmt">// Returning from the callback = commit</span>
    <span class="cmt">// Throwing from the callback = rollback</span>
    <span class="kw">return</span> { project, task };
  });
};

<span class="cmt">// Pattern 2: manual commit/rollback (more control)</span>
<span class="kw">const</span> <span class="fn">batchUpdateTasks</span> = <span class="kw">async</span> (taskIds, updates, userId) => {
  <span class="kw">const</span> trx = <span class="kw">await</span> db.<span class="fn">transaction</span>();
  <span class="kw">try</span> {
    <span class="kw">for</span> (<span class="kw">const</span> id <span class="kw">of</span> taskIds) {
      <span class="kw">await</span> trx(<span class="str">'tasks'</span>).<span class="fn">where</span>({ id, user_id: userId }).<span class="fn">update</span>(updates);
    }
    <span class="kw">await</span> trx.<span class="fn">commit</span>();
    <span class="kw">return</span> taskIds.<span class="prop">length</span>;
  } <span class="kw">catch</span> (err) {
    <span class="kw">await</span> trx.<span class="fn">rollback</span>();
    <span class="kw">throw</span> err;
  }
};</code></pre></div>

<h2>Knex Migrations</h2>
<p>Migrations are versioned schema change scripts. Each migration has an <code>up()</code> function (apply the change) and a <code>down()</code> function (undo it). Knex tracks which migrations have run in a <code>knex_migrations</code> table it manages automatically.</p>

<div class="code-block"><div class="code-header"><span class="code-lang">bash</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="cmt"># Create a new migration file (timestamped automatically)</span>
npx knex migrate:make create_tasks_table

<span class="cmt"># Run all pending migrations</span>
npx knex migrate:latest

<span class="cmt"># Roll back the most recent batch</span>
npx knex migrate:rollback

<span class="cmt"># Roll back ALL migrations</span>
npx knex migrate:rollback --all

<span class="cmt"># See what's been run and what's pending</span>
npx knex migrate:status</code></pre></div>

<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/knex-migrations/20240201_create_tasks.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code>exports.<span class="fn">up</span> = <span class="kw">async function</span>(knex) {
  <span class="kw">await</span> knex.<span class="prop">schema</span>.<span class="fn">createTable</span>(<span class="str">'tasks'</span>, (t) => {
    t.<span class="fn">uuid</span>(<span class="str">'id'</span>).<span class="fn">primary</span>().<span class="fn">defaultTo</span>(knex.<span class="fn">raw</span>(<span class="str">'gen_random_uuid()'</span>));
    t.<span class="fn">uuid</span>(<span class="str">'user_id'</span>).<span class="fn">notNullable</span>()
      .<span class="fn">references</span>(<span class="str">'id'</span>).<span class="fn">inTable</span>(<span class="str">'users'</span>).<span class="fn">onDelete</span>(<span class="str">'CASCADE'</span>);
    t.<span class="fn">uuid</span>(<span class="str">'project_id'</span>).<span class="fn">nullable</span>()
      .<span class="fn">references</span>(<span class="str">'id'</span>).<span class="fn">inTable</span>(<span class="str">'projects'</span>).<span class="fn">onDelete</span>(<span class="str">'SET NULL'</span>);
    t.<span class="fn">string</span>(<span class="str">'title'</span>, <span class="num">255</span>).<span class="fn">notNullable</span>();
    t.<span class="fn">text</span>(<span class="str">'description'</span>).<span class="fn">nullable</span>();
    t.<span class="fn">enu</span>(<span class="str">'status'</span>, [<span class="str">'todo'</span>, <span class="str">'in_progress'</span>, <span class="str">'review'</span>, <span class="str">'done'</span>, <span class="str">'archived'</span>])
      .<span class="fn">notNullable</span>().<span class="fn">defaultTo</span>(<span class="str">'todo'</span>);
    t.<span class="fn">enu</span>(<span class="str">'priority'</span>, [<span class="str">'low'</span>, <span class="str">'medium'</span>, <span class="str">'high'</span>, <span class="str">'urgent'</span>])
      .<span class="fn">notNullable</span>().<span class="fn">defaultTo</span>(<span class="str">'medium'</span>);
    t.<span class="fn">timestamp</span>(<span class="str">'due_date'</span>).<span class="fn">nullable</span>();
    t.<span class="fn">timestamp</span>(<span class="str">'completed_at'</span>).<span class="fn">nullable</span>();
    t.<span class="fn">specificType</span>(<span class="str">'tags'</span>, <span class="str">'TEXT[]'</span>).<span class="fn">defaultTo</span>(knex.<span class="fn">raw</span>(<span class="str">"'{}'"</span>));
    t.<span class="fn">timestamps</span>(<span class="kw">true</span>, <span class="kw">true</span>); <span class="cmt">// created_at and updated_at, auto-managed</span>

    <span class="cmt">// Indexes for common query patterns</span>
    t.<span class="fn">index</span>([<span class="str">'user_id'</span>]);
    t.<span class="fn">index</span>([<span class="str">'project_id'</span>]);
    t.<span class="fn">index</span>([<span class="str">'user_id'</span>, <span class="str">'status'</span>]);
    t.<span class="fn">index</span>([<span class="str">'due_date'</span>]);
  });
};

exports.<span class="fn">down</span> = <span class="kw">async function</span>(knex) {
  <span class="kw">await</span> knex.<span class="prop">schema</span>.<span class="fn">dropTable</span>(<span class="str">'tasks'</span>);
};</code></pre></div>

<h2>Real-World Analytics Query</h2>
<p>This is where Knex truly shines — a productivity report that would be awkward to express through Sequelize but reads clearly as Knex:</p>

<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/services/analyticsService.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> db = <span class="fn">require</span>(<span class="str">'../config/knex'</span>);

<span class="kw">const</span> <span class="fn">getUserProductivityReport</span> = <span class="kw">async</span> (userId, days = <span class="num">30</span>) => {
  <span class="kw">const</span> since = <span class="kw">new</span> <span class="cls">Date</span>();
  since.<span class="fn">setDate</span>(since.<span class="fn">getDate</span>() - days);

  <span class="cmt">// Complex aggregation — use raw SQL for FILTER clauses</span>
  <span class="kw">const</span> summaryResult = <span class="kw">await</span> db.<span class="fn">raw</span>(<span class="str">`
    SELECT
      COUNT(*)                                               AS total_tasks,
      COUNT(*) FILTER (WHERE status = 'done')               AS completed,
      COUNT(*) FILTER (WHERE status NOT IN ('done','archived')) AS active,
      COUNT(*) FILTER (WHERE due_date < NOW() AND status NOT IN ('done','archived')) AS overdue,
      ROUND(
        AVG(EXTRACT(EPOCH FROM (completed_at - created_at)) / 3600)
        FILTER (WHERE status = 'done'), 1
      )                                                      AS avg_hours_to_complete
    FROM tasks
    WHERE user_id = ? AND created_at >= ?
  `</span>, [userId, since]);

  <span class="cmt">// Per-priority breakdown using the chainable API</span>
  <span class="kw">const</span> byPriority = <span class="kw">await</span> db(<span class="str">'tasks'</span>)
    .<span class="fn">select</span>(<span class="str">'priority'</span>)
    .<span class="fn">count</span>(<span class="str">'* as total'</span>)
    .<span class="fn">sum</span>(db.<span class="fn">raw</span>(<span class="str">"CASE WHEN status = 'done' THEN 1 ELSE 0 END as completed"</span>))
    .<span class="fn">where</span>({ user_id: userId })
    .<span class="fn">where</span>(<span class="str">'created_at'</span>, <span class="str">'>='</span>, since)
    .<span class="fn">groupBy</span>(<span class="str">'priority'</span>)
    .<span class="fn">orderByRaw</span>(<span class="str">"CASE priority WHEN 'urgent' THEN 1 WHEN 'high' THEN 2 WHEN 'medium' THEN 3 ELSE 4 END"</span>);

  <span class="kw">return</span> {
    summary:    summaryResult.<span class="prop">rows</span>[<span class="num">0</span>],
    byPriority,
    period:     { days, since },
  };
};

module.exports = { getUserProductivityReport };</code></pre></div>

<div class="callout success"><div class="callout-title">✅ Knex Mastered</div><p>You can now write any SQL query as clean JavaScript, run multi-step transactions safely, and manage schema changes with versioned migrations. Chapter 11 moves to authentication — we'll use Sequelize models for that layer.</p></div></template>
<template id="tpl-auth-jwt"><div class="chapter-header"><div class="ch-eyebrow">Chapter 11 · Auth &amp; Security</div><h1 class="ch-title">Authentication &amp; JWT</h1><p class="ch-subtitle">Authentication answers one question: <em>who is making this request?</em> Getting it right from the start prevents an entire class of vulnerabilities. Getting it wrong means account takeovers, data breaches, and 3am incidents.</p></div>

<h2>Sessions vs JWT — Choose Your Strategy</h2>
<p>There are two dominant authentication strategies for REST APIs. Understanding both helps you make an informed choice for your project:</p>
<table>
<thead><tr><th></th><th>Session-Based</th><th>JWT (Stateless)</th></tr></thead>
<tbody>
<tr><td><strong>How it works</strong></td><td>Server stores session; client sends a session ID cookie</td><td>All state encoded in a signed token; server stores nothing</td></tr>
<tr><td><strong>Revocation</strong></td><td>Easy — delete session from store</td><td>Hard — token is valid until it expires</td></tr>
<tr><td><strong>Scalability</strong></td><td>Needs shared session store (Redis) across servers</td><td>Stateless — any server can verify any token</td></tr>
<tr><td><strong>Best for</strong></td><td>Web apps with cookies, single-server setups</td><td>REST APIs, mobile clients, microservices</td></tr>
</tbody>
</table>
<p>For TaskFlow (a REST API), we use <strong>JWT</strong>. It's stateless, works perfectly with mobile and SPA clients, and scales horizontally without a shared session store.</p>

<div class="concept-box"><h4>📋 JWT Structure</h4><p>A JWT is three Base64-encoded parts joined by dots: <strong>Header.Payload.Signature</strong><br><br>
<code>eyJhbGciOiJIUzI1NiJ9</code>.<code>eyJ1c2VySWQiOiJhYmMtMTIzIn0</code>.<code>SflKxwRJSMeKKF...</code><br><br>
The <strong>header</strong> declares the algorithm (HS256). The <strong>payload</strong> contains claims — <code>userId</code>, <code>role</code>, <code>exp</code> (expiry). The <strong>signature</strong> is computed from header+payload+secret using HMAC-SHA256 — if anyone tampers with the payload, the signature won't match and verification fails. The server verifies any token without a database lookup, which is the whole point.</p></div>

<h2>Building the Auth Service</h2>

<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/services/authService.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> jwt    = <span class="fn">require</span>(<span class="str">'jsonwebtoken'</span>);
<span class="kw">const</span> bcrypt = <span class="fn">require</span>(<span class="str">'bcryptjs'</span>);
<span class="kw">const</span> { <span class="cls">User</span> } = <span class="fn">require</span>(<span class="str">'../models'</span>);
<span class="kw">const</span> config  = <span class="fn">require</span>(<span class="str">'../config'</span>);

<span class="kw">const</span> <span class="fn">generateToken</span> = (user) =>
  jwt.<span class="fn">sign</span>(
    { userId: user.<span class="prop">id</span>, email: user.<span class="prop">email</span>, role: user.<span class="prop">role</span> },
    config.jwt.secret,
    { expiresIn: config.jwt.expiresIn }
  );

<span class="kw">const</span> <span class="fn">register</span> = <span class="kw">async</span> ({ name, email, password }) => {
  <span class="kw">const</span> existing = <span class="kw">await</span> <span class="cls">User</span>.<span class="fn">findOne</span>({ where: { email } });
  <span class="kw">if</span> (existing) {
    <span class="kw">const</span> e = <span class="kw">new</span> <span class="cls">Error</span>(<span class="str">'Email already registered'</span>); e.<span class="prop">statusCode</span> = <span class="num">409</span>; <span class="kw">throw</span> e;
  }
  <span class="cmt">// password gets hashed by the User model's beforeSave hook</span>
  <span class="kw">const</span> user  = <span class="kw">await</span> <span class="cls">User</span>.<span class="fn">create</span>({ name, email, password });
  <span class="kw">const</span> token = <span class="fn">generateToken</span>(user);
  <span class="kw">return</span> { user, token };
};

<span class="kw">const</span> <span class="fn">login</span> = <span class="kw">async</span> ({ email, password }) => {
  <span class="cmt">// Fetch with password field (normally excluded by toJSON hook)</span>
  <span class="kw">const</span> user = <span class="kw">await</span> <span class="cls">User</span>.<span class="fn">findOne</span>({
    where: { email },
    attributes: { include: [<span class="str">'password'</span>] },
  });

  <span class="cmt">// IMPORTANT: always give the same vague error for wrong email OR wrong password.</span>
  <span class="cmt">// Separate errors ("no account with that email" vs "wrong password") let attackers</span>
  <span class="cmt">// enumerate which emails are registered — a real privacy and security risk.</span>
  <span class="kw">if</span> (!user || !(await user.<span class="fn">comparePassword</span>(password))) {
    <span class="kw">const</span> e = <span class="kw">new</span> <span class="cls">Error</span>(<span class="str">'Invalid email or password'</span>); e.<span class="prop">statusCode</span> = <span class="num">401</span>; <span class="kw">throw</span> e;
  }

  <span class="kw">const</span> token = <span class="fn">generateToken</span>(user);
  <span class="kw">return</span> { user, token };
};

module.exports = { register, login, generateToken };</code></pre></div>

<h2>The authenticate Middleware</h2>
<p>Every protected route uses this middleware. It extracts the token, verifies its signature, checks the user still exists in the database, and attaches the user to <code>req.user</code>:</p>

<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/middleware/authenticate.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> jwt = <span class="fn">require</span>(<span class="str">'jsonwebtoken'</span>);
<span class="kw">const</span> config = <span class="fn">require</span>(<span class="str">'../config'</span>);
<span class="kw">const</span> { <span class="cls">User</span> } = <span class="fn">require</span>(<span class="str">'../models'</span>);

<span class="kw">const</span> <span class="fn">authenticate</span> = <span class="kw">async</span> (req, res, next) => {
  <span class="kw">try</span> {
    <span class="kw">const</span> header = req.headers[<span class="str">'authorization'</span>];
    <span class="kw">if</span> (!header?.startsWith(<span class="str">'Bearer '</span>)) {
      <span class="kw">return</span> res.<span class="fn">status</span>(<span class="num">401</span>).<span class="fn">json</span>({ success: <span class="kw">false</span>, error: <span class="str">'No bearer token provided'</span> });
    }

    <span class="kw">const</span> token   = header.<span class="fn">slice</span>(<span class="num">7</span>);                 <span class="cmt">// strip "Bearer "</span>
    <span class="kw">const</span> decoded = jwt.<span class="fn">verify</span>(token, config.jwt.secret); <span class="cmt">// throws on invalid/expired</span>

    <span class="cmt">// Fetch fresh user — catches deactivated accounts even with a valid token</span>
    <span class="kw">const</span> user = <span class="kw">await</span> <span class="cls">User</span>.<span class="fn">findByPk</span>(decoded.<span class="prop">userId</span>, {
      attributes: { exclude: [<span class="str">'password'</span>] },
    });

    <span class="kw">if</span> (!user) <span class="kw">return</span> res.<span class="fn">status</span>(<span class="num">401</span>).<span class="fn">json</span>({ error: <span class="str">'Account no longer exists'</span> });

    req.<span class="prop">user</span> = user;  <span class="cmt">// available to all downstream middleware and controllers</span>
    <span class="fn">next</span>();
  } <span class="kw">catch</span> (err) {
    <span class="kw">if</span> (err.<span class="prop">name</span> === <span class="str">'TokenExpiredError'</span>)  <span class="kw">return</span> res.<span class="fn">status</span>(<span class="num">401</span>).<span class="fn">json</span>({ error: <span class="str">'Token has expired'</span> });
    <span class="kw">if</span> (err.<span class="prop">name</span> === <span class="str">'JsonWebTokenError'</span>)  <span class="kw">return</span> res.<span class="fn">status</span>(<span class="num">401</span>).<span class="fn">json</span>({ error: <span class="str">'Invalid token'</span> });
    <span class="fn">next</span>(err);  <span class="cmt">// unexpected error — pass to global error handler</span>
  }
};

module.exports = <span class="fn">authenticate</span>;</code></pre></div>

<h2>Auth Routes and Controller</h2>

<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/controllers/authController.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> authService = <span class="fn">require</span>(<span class="str">'../services/authService'</span>);

<span class="kw">const</span> <span class="fn">register</span> = <span class="kw">async</span> (req, res, next) => {
  <span class="kw">try</span> {
    <span class="kw">const</span> { user, token } = <span class="kw">await</span> authService.<span class="fn">register</span>(req.body);
    res.<span class="fn">status</span>(<span class="num">201</span>).<span class="fn">json</span>({ success: <span class="kw">true</span>, data: { user, token } });
  } <span class="kw">catch</span> (err) { <span class="fn">next</span>(err); }
};

<span class="kw">const</span> <span class="fn">login</span> = <span class="kw">async</span> (req, res, next) => {
  <span class="kw">try</span> {
    <span class="kw">const</span> { user, token } = <span class="kw">await</span> authService.<span class="fn">login</span>(req.body);
    res.<span class="fn">json</span>({ success: <span class="kw">true</span>, data: { user, token } });
  } <span class="kw">catch</span> (err) { <span class="fn">next</span>(err); }
};

<span class="kw">const</span> <span class="fn">getMe</span> = (req, res) =>
  res.<span class="fn">json</span>({ success: <span class="kw">true</span>, data: { user: req.<span class="prop">user</span> } });

module.exports = { register, login, getMe };</code></pre></div>

<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/routes/auth.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> router       = <span class="fn">require</span>(<span class="str">'express'</span>).<span class="fn">Router</span>();
<span class="kw">const</span> authenticate = <span class="fn">require</span>(<span class="str">'../middleware/authenticate'</span>);
<span class="kw">const</span> { register, login, getMe } = <span class="fn">require</span>(<span class="str">'../controllers/authController'</span>);

router.<span class="fn">post</span>(<span class="str">'/register'</span>, register);         <span class="cmt">// public</span>
router.<span class="fn">post</span>(<span class="str">'/login'</span>, login);              <span class="cmt">// public</span>
router.<span class="fn">get</span>(<span class="str">'/me'</span>, authenticate, getMe);   <span class="cmt">// protected — requires valid JWT</span>

module.exports = router;</code></pre></div>

<h2>Testing the Flow</h2>

<div class="code-block"><div class="code-header"><span class="code-lang">bash</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="cmt"># 1. Register a new user</span>
curl -X POST http://localhost:3000/api/auth/register \
  -H "Content-Type: application/json" \
  -d '{"name":"Jane Doe","email":"jane@example.com","password":"SecurePass1"}'
<span class="cmt"># → 201 { success: true, data: { user: {...}, token: "eyJ..." } }</span>

<span class="cmt"># 2. Log in to get a token</span>
curl -X POST http://localhost:3000/api/auth/login \
  -H "Content-Type: application/json" \
  -d '{"email":"jane@example.com","password":"SecurePass1"}'
<span class="cmt"># → 200 { data: { token: "eyJ..." } }</span>

<span class="cmt"># 3. Use the token on protected routes</span>
curl http://localhost:3000/api/auth/me \
  -H "Authorization: Bearer eyJhbGci..."
<span class="cmt"># → 200 { data: { user: { id, name, email, role } } }</span>

<span class="cmt"># 4. What happens with a bad token?</span>
curl http://localhost:3000/api/auth/me \
  -H "Authorization: Bearer BADTOKEN"
<span class="cmt"># → 401 { error: "Invalid token" }</span></code></pre></div>

<h2>Refresh Token Strategy</h2>
<p>Short-lived access tokens (15 min) are more secure but mean users get logged out frequently. Refresh tokens solve this: a long-lived token stored securely that can mint new short-lived access tokens without re-entering credentials.</p>

<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">Refresh token implementation</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="cmt">// 1. On login, issue BOTH tokens</span>
<span class="kw">const</span> <span class="fn">loginWithRefresh</span> = <span class="kw">async</span> ({ email, password }) => {
  <span class="kw">const</span> user = <span class="kw">await</span> <span class="fn">verifyCredentials</span>(email, password);

  <span class="kw">const</span> accessToken = jwt.<span class="fn">sign</span>(
    { userId: user.<span class="prop">id</span>, role: user.<span class="prop">role</span> }, config.jwt.secret, { expiresIn: <span class="str">'15m'</span> }
  );
  <span class="kw">const</span> refreshToken = jwt.<span class="fn">sign</span>(
    { userId: user.<span class="prop">id</span> }, config.jwt.refreshSecret, { expiresIn: <span class="str">'30d'</span> }
  );

  <span class="cmt">// Store hashed refresh token in DB so we can invalidate it on logout</span>
  <span class="kw">await</span> <span class="cls">RefreshToken</span>.<span class="fn">create</span>({
    userId:    user.<span class="prop">id</span>,
    tokenHash: <span class="kw">await</span> bcrypt.<span class="fn">hash</span>(refreshToken, <span class="num">10</span>),
    expiresAt: <span class="kw">new</span> <span class="cls">Date</span>(Date.now() + <span class="num">30</span> * <span class="num">24</span> * <span class="num">60</span> * <span class="num">60</span> * <span class="num">1000</span>),
  });

  <span class="kw">return</span> { accessToken, refreshToken };
};

<span class="cmt">// 2. Refresh endpoint — exchange refresh token for a new access token</span>
<span class="kw">const</span> <span class="fn">refreshAccessToken</span> = <span class="kw">async</span> (refreshToken) => {
  <span class="kw">const</span> decoded = jwt.<span class="fn">verify</span>(refreshToken, config.jwt.refreshSecret);

  <span class="kw">const</span> stored = <span class="kw">await</span> <span class="cls">RefreshToken</span>.<span class="fn">findOne</span>({
    where: { userId: decoded.<span class="prop">userId</span>, expiresAt: { [Op.gt]: <span class="kw">new</span> <span class="cls">Date</span>() } }
  });
  <span class="kw">if</span> (!stored || !(await bcrypt.<span class="fn">compare</span>(refreshToken, stored.<span class="prop">tokenHash</span>))) {
    <span class="kw">throw new</span> <span class="cls">Error</span>(<span class="str">'Invalid or expired refresh token'</span>);
  }

  <span class="kw">return</span> jwt.<span class="fn">sign</span>({ userId: decoded.<span class="prop">userId</span> }, config.jwt.secret, { expiresIn: <span class="str">'15m'</span> });
};

<span class="cmt">// 3. Logout — delete refresh token from DB to fully invalidate the session</span>
<span class="kw">const</span> <span class="fn">logout</span> = (userId) => <span class="cls">RefreshToken</span>.<span class="fn">destroy</span>({ where: { userId } });</code></pre></div>

<h2>Password Reset</h2>

<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">Password reset flow</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> crypto = <span class="fn">require</span>(<span class="str">'crypto'</span>);

<span class="cmt">// Step 1: User requests a reset link</span>
<span class="kw">const</span> <span class="fn">requestReset</span> = <span class="kw">async</span> (email) => {
  <span class="kw">const</span> user = <span class="kw">await</span> <span class="cls">User</span>.<span class="fn">findOne</span>({ where: { email } });
  <span class="cmt">// Always respond with success — don't reveal whether email exists</span>
  <span class="kw">if</span> (!user) <span class="kw">return</span>;

  <span class="kw">const</span> token = crypto.<span class="fn">randomBytes</span>(<span class="num">32</span>).<span class="fn">toString</span>(<span class="str">'hex'</span>);  <span class="cmt">// 256 bits of randomness</span>
  <span class="kw">await</span> user.<span class="fn">update</span>({
    resetToken:       token,
    resetTokenExpiry: <span class="kw">new</span> <span class="cls">Date</span>(Date.now() + <span class="num">3600000</span>),  <span class="cmt">// 1 hour</span>
  });
  <span class="kw">await</span> <span class="fn">sendEmail</span>(email, <span class="str">'Password Reset'</span>, <span class="str">`https://app.taskflow.com/reset?token=${token}`</span>);
};

<span class="cmt">// Step 2: User submits new password with the token from the email</span>
<span class="kw">const</span> <span class="fn">resetPassword</span> = <span class="kw">async</span> (token, newPassword) => {
  <span class="kw">const</span> user = <span class="kw">await</span> <span class="cls">User</span>.<span class="fn">findOne</span>({
    where: { resetToken: token, resetTokenExpiry: { [Op.gt]: <span class="kw">new</span> <span class="cls">Date</span>() } }
  });
  <span class="kw">if</span> (!user) <span class="kw">throw new</span> <span class="cls">Error</span>(<span class="str">'Invalid or expired reset link'</span>);

  <span class="cmt">// beforeSave hook hashes the password automatically</span>
  <span class="kw">await</span> user.<span class="fn">update</span>({ password: newPassword, resetToken: <span class="kw">null</span>, resetTokenExpiry: <span class="kw">null</span> });
};</code></pre></div>

<div class="callout danger"><div class="callout-title">🔒 Non-Negotiable Security Rules</div><p>Use bcrypt with ≥10 rounds (we use 12). Never store plaintext passwords — ever. Use a long, random JWT secret generated with <code>openssl rand -hex 64</code>. Keep access tokens short-lived (15min–1hr). Always use HTTPS in production — tokens sent over HTTP can be stolen by network observers. Never log tokens or passwords.</p></div></template>
<template id="tpl-authorization"><div class="chapter-header"><div class="ch-eyebrow">Chapter 12 · Auth &amp; Security</div><h1 class="ch-title">Authorization &amp; RBAC</h1><p class="ch-subtitle">Authentication answers <em>who are you?</em> Authorization answers <em>what are you allowed to do?</em> These are completely separate concerns — and confusing them is one of the most common security mistakes in web APIs.</p></div>

<h2>Authentication vs Authorization — Clearly Defined</h2>
<p>Think of a hotel. Authentication is showing your ID at check-in to prove who you are. Authorization is the key card that only opens your room, not every room. An authenticated guest (valid key card) still can't walk into someone else's room — that's authorization enforced at the door.</p>
<p>In TaskFlow: JWT authentication confirms your identity on every request. Authorization then decides whether that identity is allowed to read, modify, or delete a specific resource.</p>

<h2>Role-Based Access Control (RBAC)</h2>
<p>RBAC assigns permissions to <em>roles</em> rather than directly to individual users. A user gets a role, and the role comes with a set of permissions. This scales much better than per-user permission tables — when you add a new admin capability, you update the <code>admin</code> role definition, not 50 individual user records.</p>

<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/middleware/authorize.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="cmt">/**
 * Role guard middleware factory.
 *
 * Usage in routes:
 *   router.delete('/users/:id', authenticate, authorize('admin'), deleteUser);
 *   router.get('/reports',      authenticate, authorize('admin', 'manager'), getReports);
 *
 * Must run AFTER authenticate — it reads req.user which authenticate sets.
 */</span>
<span class="kw">const</span> <span class="fn">authorize</span> = (...allowedRoles) => (req, res, next) => {
  <span class="kw">if</span> (!req.<span class="prop">user</span>) {
    <span class="cmt">// This shouldn't happen if authenticate runs first, but be defensive</span>
    <span class="kw">return</span> res.<span class="fn">status</span>(<span class="num">401</span>).<span class="fn">json</span>({ success: <span class="kw">false</span>, error: <span class="str">'Not authenticated'</span> });
  }

  <span class="kw">if</span> (!allowedRoles.<span class="fn">includes</span>(req.<span class="prop">user</span>.<span class="prop">role</span>)) {
    <span class="kw">return</span> res.<span class="fn">status</span>(<span class="num">403</span>).<span class="fn">json</span>({
      success: <span class="kw">false</span>,
      error: <span class="str">'Access denied'</span>,
      required: allowedRoles,
      yourRole: req.<span class="prop">user</span>.<span class="prop">role</span>,
    });
  }

  <span class="fn">next</span>();
};

module.exports = <span class="fn">authorize</span>;</code></pre></div>

<h2>Resource Ownership Guards</h2>
<p>Role checks aren't enough on their own. A regular user can't access <em>another user's</em> tasks even though both have the same <code>user</code> role. We handle this with ownership guards — middleware that fetches the resource, checks if the current user owns it, and attaches it to the request to avoid fetching it again in the controller.</p>

<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/middleware/ownershipGuard.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> { <span class="cls">Task</span>, <span class="cls">Project</span> } = <span class="fn">require</span>(<span class="str">'../models'</span>);

<span class="cmt">/**
 * Confirms the authenticated user owns the requested task.
 * Admins bypass ownership — they can access any task.
 * Attaches task as req.task so controllers don't re-fetch it.
 */</span>
<span class="kw">const</span> <span class="fn">taskOwner</span> = <span class="kw">async</span> (req, res, next) => {
  <span class="kw">try</span> {
    <span class="kw">const</span> task = <span class="kw">await</span> <span class="cls">Task</span>.<span class="fn">findByPk</span>(req.<span class="prop">params</span>.<span class="prop">id</span>);

    <span class="kw">if</span> (!task) {
      <span class="kw">return</span> res.<span class="fn">status</span>(<span class="num">404</span>).<span class="fn">json</span>({ success: <span class="kw">false</span>, error: <span class="str">'Task not found'</span> });
    }

    <span class="kw">if</span> (task.<span class="prop">userId</span> !== req.<span class="prop">user</span>.<span class="prop">id</span> && req.<span class="prop">user</span>.<span class="prop">role</span> !== <span class="str">'admin'</span>) {
      <span class="kw">return</span> res.<span class="fn">status</span>(<span class="num">403</span>).<span class="fn">json</span>({ success: <span class="kw">false</span>, error: <span class="str">'You do not own this task'</span> });
    }

    req.<span class="prop">task</span> = task;  <span class="cmt">// attach for downstream handlers</span>
    <span class="fn">next</span>();
  } <span class="kw">catch</span> (err) { <span class="fn">next</span>(err); }
};

<span class="cmt">// Same pattern for projects</span>
<span class="kw">const</span> <span class="fn">projectOwner</span> = <span class="kw">async</span> (req, res, next) => {
  <span class="kw">try</span> {
    <span class="kw">const</span> project = <span class="kw">await</span> <span class="cls">Project</span>.<span class="fn">findByPk</span>(req.<span class="prop">params</span>.<span class="prop">projectId</span> || req.<span class="prop">params</span>.<span class="prop">id</span>);
    <span class="kw">if</span> (!project) <span class="kw">return</span> res.<span class="fn">status</span>(<span class="num">404</span>).<span class="fn">json</span>({ error: <span class="str">'Project not found'</span> });
    <span class="kw">if</span> (project.<span class="prop">ownerId</span> !== req.<span class="prop">user</span>.<span class="prop">id</span> && req.<span class="prop">user</span>.<span class="prop">role</span> !== <span class="str">'admin'</span>) {
      <span class="kw">return</span> res.<span class="fn">status</span>(<span class="num">403</span>).<span class="fn">json</span>({ error: <span class="str">'You do not own this project'</span> });
    }
    req.<span class="prop">project</span> = project;
    <span class="fn">next</span>();
  } <span class="kw">catch</span> (err) { <span class="fn">next</span>(err); }
};

module.exports = { taskOwner, projectOwner };</code></pre></div>

<h2>Composing Middleware — The Full Security Stack</h2>
<p>The power of Express middleware is that you compose these guards declaratively on each route:</p>

<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/routes/tasks.js — full security stack</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> authenticate = <span class="fn">require</span>(<span class="str">'../middleware/authenticate'</span>);
<span class="kw">const</span> authorize    = <span class="fn">require</span>(<span class="str">'../middleware/authorize'</span>);
<span class="kw">const</span> { taskOwner } = <span class="fn">require</span>(<span class="str">'../middleware/ownershipGuard'</span>);
<span class="kw">const</span> validate     = <span class="fn">require</span>(<span class="str">'../middleware/validate'</span>);
<span class="kw">const</span> { createTaskSchema, updateTaskSchema } = <span class="fn">require</span>(<span class="str">'../validation/taskSchemas'</span>);

<span class="cmt">// All task routes require a valid JWT</span>
router.<span class="fn">use</span>(authenticate);

<span class="cmt">// List and create — any authenticated user can do these</span>
router.<span class="fn">get</span>(<span class="str">'/'</span>,    getAllTasks);
router.<span class="fn">post</span>(<span class="str">'/'</span>,   <span class="fn">validate</span>(createTaskSchema), createTask);

<span class="cmt">// Single resource routes — must own the task (or be admin)</span>
router.<span class="fn">get</span>(<span class="str">'/:id'</span>,    taskOwner,                               getTaskById);
router.<span class="fn">patch</span>(<span class="str">'/:id'</span>,  taskOwner, <span class="fn">validate</span>(updateTaskSchema),  updateTask);
router.<span class="fn">delete</span>(<span class="str">'/:id'</span>, taskOwner,                               deleteTask);

<span class="cmt">// Admin-only endpoint — role check AFTER authenticate</span>
router.<span class="fn">get</span>(<span class="str">'/admin/all'</span>, <span class="fn">authorize</span>(<span class="str">'admin'</span>), getAllTasksAdmin);
router.<span class="fn">delete</span>(<span class="str">/admin\/purge</span>, <span class="fn">authorize</span>(<span class="str">'admin'</span>), purgeArchived);</code></pre></div>

<h2>Common Authorization Mistakes</h2>
<p>Understanding what <em>not</em> to do is as important as knowing the right patterns:</p>
<ul>
  <li><strong>Trusting client-provided IDs blindly.</strong> Always filter by <code>userId: req.user.id</code> in WHERE clauses, not just by the resource ID. Otherwise user A can guess user B's task ID and access it.</li>
  <li><strong>Checking role only, not ownership.</strong> A role check says "is this a user?" — not "is this user the owner of THIS resource?" You need both.</li>
  <li><strong>Returning different 404 vs 403 errors without care.</strong> If your API returns 404 when a resource exists but you don't own it, you prevent information leakage. If it returns 403, you've confirmed the resource exists. Decide your policy and be consistent.</li>
  <li><strong>Skipping auth middleware on one route.</strong> In Express, middleware order matters absolutely. If you accidentally mount a route before <code>router.use(authenticate)</code>, it's publicly accessible.</li>
</ul>

<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">Always scope queries to the authenticated user</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="cmt">// ❌ WRONG — any authenticated user can read any task by guessing the ID</span>
<span class="kw">const</span> task = <span class="kw">await</span> <span class="cls">Task</span>.<span class="fn">findByPk</span>(req.<span class="prop">params</span>.<span class="prop">id</span>);

<span class="cmt">// ✅ CORRECT — scoped to the current user, returns null if they don't own it</span>
<span class="kw">const</span> task = <span class="kw">await</span> <span class="cls">Task</span>.<span class="fn">findOne</span>({
  where: { id: req.<span class="prop">params</span>.<span class="prop">id</span>, userId: req.<span class="prop">user</span>.<span class="prop">id</span> }
});
<span class="kw">if</span> (!task) <span class="kw">return</span> res.<span class="fn">status</span>(<span class="num">404</span>).<span class="fn">json</span>({ error: <span class="str">'Task not found'</span> });
<span class="cmt">// Returns 404 whether it doesn't exist OR you don't own it (no info leakage)</span></code></pre></div>

<div class="callout success"><div class="callout-title">✅ Authorization Complete</div><p>With role-based guards and ownership checks layered together, TaskFlow enforces proper access control at every level. Each route declares exactly what it requires — readable, auditable, hard to accidentally bypass.</p></div></template>
<template id="tpl-validation">
<div class="chapter-header"><div class="ch-eyebrow">Chapter 13 · Advanced Features</div><h1 class="ch-title">Input Validation</h1><p class="ch-subtitle">Never trust client input. Validation is the first line of defense against malformed data, injection attacks, and mysterious production bugs.</p></div>
<h2>Why Dedicated Validation?</h2>
<p>Sequelize model-level validation is a last resort. We want to validate input <em>before</em> it hits the database, giving clear, friendly error messages explaining exactly what went wrong. We use <strong>Joi</strong> — the most widely-used Node.js validation library, with a beautiful chainable schema API.</p>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/validation/taskSchemas.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> Joi = <span class="fn">require</span>(<span class="str">'joi'</span>);

<span class="kw">const</span> createTaskSchema = Joi.<span class="fn">object</span>({
  title: Joi.<span class="fn">string</span>().<span class="fn">min</span>(<span class="num">1</span>).<span class="fn">max</span>(<span class="num">255</span>).<span class="fn">required</span>()
    .<span class="fn">messages</span>({ <span class="str">'string.min'</span>: <span class="str">'Title cannot be empty'</span>, <span class="str">'any.required'</span>: <span class="str">'Title is required'</span> }),

  description: Joi.<span class="fn">string</span>().<span class="fn">max</span>(<span class="num">5000</span>).<span class="fn">optional</span>().<span class="fn">allow</span>(<span class="str">''</span>),

  priority: Joi.<span class="fn">string</span>().<span class="fn">valid</span>(<span class="str">'low'</span>,<span class="str">'medium'</span>,<span class="str">'high'</span>,<span class="str">'urgent'</span>).<span class="fn">default</span>(<span class="str">'medium'</span>),

  dueDate: Joi.<span class="fn">date</span>().<span class="fn">iso</span>().<span class="fn">min</span>(<span class="str">'now'</span>).<span class="fn">optional</span>()
    .<span class="fn">messages</span>({ <span class="str">'date.min'</span>: <span class="str">'Due date cannot be in the past'</span> }),

  projectId: Joi.<span class="fn">string</span>().<span class="fn">uuid</span>().<span class="fn">optional</span>(),

  tags: Joi.<span class="fn">array</span>().<span class="fn">items</span>(Joi.<span class="fn">string</span>().<span class="fn">max</span>(<span class="num">50</span>)).<span class="fn">max</span>(<span class="num">10</span>).<span class="fn">default</span>([]),
});

<span class="kw">const</span> updateTaskSchema = Joi.<span class="fn">object</span>({
  title:       Joi.<span class="fn">string</span>().<span class="fn">min</span>(<span class="num">1</span>).<span class="fn">max</span>(<span class="num">255</span>),
  description: Joi.<span class="fn">string</span>().<span class="fn">max</span>(<span class="num">5000</span>).<span class="fn">allow</span>(<span class="str">''</span>),
  status:      Joi.<span class="fn">string</span>().<span class="fn">valid</span>(<span class="str">'todo'</span>,<span class="str">'in_progress'</span>,<span class="str">'review'</span>,<span class="str">'done'</span>,<span class="str">'archived'</span>),
  priority:    Joi.<span class="fn">string</span>().<span class="fn">valid</span>(<span class="str">'low'</span>,<span class="str">'medium'</span>,<span class="str">'high'</span>,<span class="str">'urgent'</span>),
  dueDate:     Joi.<span class="fn">date</span>().<span class="fn">iso</span>().<span class="fn">allow</span>(<span class="kw">null</span>),
  tags:        Joi.<span class="fn">array</span>().<span class="fn">items</span>(Joi.<span class="fn">string</span>().<span class="fn">max</span>(<span class="num">50</span>)).<span class="fn">max</span>(<span class="num">10</span>),
}).<span class="fn">min</span>(<span class="num">1</span>); <span class="cmt">// at least one field required</span>

module.exports = { createTaskSchema, updateTaskSchema };</code></pre></div>
<h2>The Validation Middleware Factory</h2>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/middleware/validate.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> <span class="fn">validate</span> = (schema, property = <span class="str">'body'</span>) => (req, res, next) => {
  <span class="kw">const</span> { error, value } = schema.<span class="fn">validate</span>(req[property], {
    abortEarly: <span class="kw">false</span>,   <span class="cmt">// collect ALL errors, not just the first</span>
    stripUnknown: <span class="kw">true</span>,  <span class="cmt">// remove fields not in schema (security!)</span>
    convert: <span class="kw">true</span>,        <span class="cmt">// auto-convert types ("2024-01-01" → Date)</span>
  });

  <span class="kw">if</span> (error) {
    <span class="kw">const</span> details = error.<span class="prop">details</span>.<span class="fn">map</span>(d => ({ field: d.<span class="prop">path</span>.<span class="fn">join</span>(<span class="str">'.'</span>), message: d.<span class="prop">message</span> }));
    <span class="kw">return</span> res.<span class="fn">status</span>(<span class="num">422</span>).<span class="fn">json</span>({ success: <span class="kw">false</span>, error: <span class="str">'Validation failed'</span>, details });
  }

  req[property] = value; <span class="cmt">// replace with validated+sanitized value</span>
  <span class="fn">next</span>();
};
module.exports = <span class="fn">validate</span>;</code></pre></div>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">Using validation in routes</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> validate = <span class="fn">require</span>(<span class="str">'../middleware/validate'</span>);
<span class="kw">const</span> { createTaskSchema, updateTaskSchema } = <span class="fn">require</span>(<span class="str">'../validation/taskSchemas'</span>);

router.<span class="fn">post</span>(<span class="str">'/'</span>,    authenticate, <span class="fn">validate</span>(createTaskSchema), createTask);
router.<span class="fn">patch</span>(<span class="str">'/:id'</span>, authenticate, taskOwner, <span class="fn">validate</span>(updateTaskSchema), updateTask);</code></pre></div>
<p>When a client sends invalid data, they get a clear, actionable response:</p>
<div class="code-block"><div class="code-header"><span class="code-lang">JSON</span><span class="code-filename">Validation error response</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code>{
  <span class="str">"success"</span>: <span class="kw">false</span>,
  <span class="str">"error"</span>: <span class="str">"Validation failed"</span>,
  <span class="str">"details"</span>: [
    { <span class="str">"field"</span>: <span class="str">"title"</span>,    <span class="str">"message"</span>: <span class="str">"Title is required"</span> },
    { <span class="str">"field"</span>: <span class="str">"priority"</span>, <span class="str">"message"</span>: <span class="str">"must be one of [low, medium, high, urgent]"</span> },
    { <span class="str">"field"</span>: <span class="str">"dueDate"</span>,  <span class="str">"message"</span>: <span class="str">"Due date cannot be in the past"</span> }
  ]
}</code></pre></div>

<pre><code><span class="kw">const</span> Joi = <span class="fn">require</span>(<span class="str">'joi'</span>);

<span class="kw">const</span> loginSchema = Joi.<span class="fn">object</span>({

<span class="kw">const</span> projectSchema = Joi.<span class="fn">object</span>({

module.exports = { registerSchema, loginSchema, projectSchema };</code></pre></div>
<h2>Sanitization — Removing Dangerous Input</h2>
<p>Validation rejects bad data. Sanitization cleans data before it enters your system, removing potential XSS vectors even if the input passes validation.</p>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">Sanitization patterns</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
<pre><code><span class="cmt">// Install: npm install xss</span>
<span class="kw">const</span> xss = <span class="fn">require</span>(<span class="str">'xss'</span>);

<span class="cmt">// Sanitize HTML content before storing rich text fields</span>
<span class="kw">const</span> <span class="fn">sanitizeDescription</span> = (desc) => {
  <span class="kw">if</span> (!desc) <span class="kw">return</span> desc;
  <span class="kw">return</span> <span class="fn">xss</span>(desc, {
    whiteList: { b: [], i: [], p: [], br: [], ul: [], ol: [], li: [] },
    stripIgnoreTag: <span class="kw">true</span>,
  });
};

<span class="cmt">// Trim whitespace from all string fields in Joi — add .trim() to schemas</span>
name: Joi.<span class="fn">string</span>().<span class="fn">trim</span>().<span class="fn">min</span>(<span class="num">2</span>).<span class="fn">max</span>(<span class="num">100</span>).<span class="fn">required</span>()

<span class="cmt">// In Sequelize setter — normalize email on the way in</span>
<span class="fn">set</span>(value) {
  <span class="kw">this</span>.<span class="fn">setDataValue</span>(<span class="str">'email'</span>, value.<span class="fn">toLowerCase</span>().<span class="fn">trim</span>());
}</code></pre></div>
