<div class="callout success"><div class="callout-title">✅ Test Suite Ready</div><p>Unit tests mock dependencies and run in milliseconds. Integration tests hit the real Express app against a test database. Together they give you confidence that every layer of the system works correctly.</p></div>

<h2>Test Factories — Creating Test Data</h2>
<p>Repeating <code>User.create({ name: 'Test', email: 'test@...' })</code> in every test is noisy. Test factories centralize test data creation and give you sensible defaults with easy overrides:</p>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">tests/factories.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
<pre><code><span class="kw">const</span> { v4: uuid } = <span class="fn">require</span>(<span class="str">'uuid'</span>);
<span class="kw">const</span> { User, Task, Project } = <span class="fn">require</span>(<span class="str">'../src/models'</span>);
<span class="kw">const</span> authService = <span class="fn">require</span>(<span class="str">'../src/services/authService'</span>);

<span class="kw">let</span> counter = <span class="num">0</span>;

<span class="kw">const</span> <span class="fn">createUser</span> = <span class="kw">async</span> (overrides = {}) => {
  counter++;
  <span class="kw">const</span> defaults = {
    name: <span class="str">`User ${counter}`</span>,
    email: <span class="str">`user${counter}@test.com`</span>,
    password: <span class="str">'Password1'</span>,
  };
  <span class="kw">const</span> { user, token } = <span class="kw">await</span> authService.<span class="fn">register</span>({ ...defaults, ...overrides });
  <span class="kw">return</span> { user, token };
};

<span class="kw">const</span> <span class="fn">createTask</span> = <span class="kw">async</span> (userId, overrides = {}) => {
  counter++;
  <span class="kw">return</span> Task.<span class="fn">create</span>({
    title: <span class="str">`Task ${counter}`</span>,
    status: <span class="str">'todo'</span>,
    priority: <span class="str">'medium'</span>,
    userId,
    ...overrides,
  });
};

<span class="kw">const</span> <span class="fn">createProject</span> = <span class="kw">async</span> (ownerId, overrides = {}) => {
  counter++;
  <span class="kw">return</span> Project.<span class="fn">create</span>({ name: <span class="str">`Project ${counter}`</span>, ownerId, ...overrides });
};

module.exports = { createUser, createTask, createProject };</code></pre></div>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">Using factories in tests</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
<pre><code><span class="kw">const</span> { createUser, createTask } = <span class="fn">require</span>(<span class="str">'../factories'</span>);

<span class="fn">describe</span>(<span class="str">'Task ownership'</span>, () => {
  <span class="fn">it</span>(<span class="str">'user cannot see another user's tasks'</span>, <span class="kw">async</span> () => {
    <span class="kw">const</span> { user: alice, token: aliceToken } = <span class="kw">await</span> <span class="fn">createUser</span>();
    <span class="kw">const</span> { user: bob }                       = <span class="kw">await</span> <span class="fn">createUser</span>();
    <span class="kw">const</span> bobTask = <span class="kw">await</span> <span class="fn">createTask</span>(bob.<span class="prop">id</span>, { title: <span class="str">'Bob's secret'</span> });

    <span class="kw">const</span> res = <span class="kw">await</span> <span class="fn">request</span>(app)
      .<span class="fn">get</span>(<span class="str">`/api/tasks/${bobTask.id}`</span>)
      .<span class="fn">set</span>(<span class="str">'Authorization'</span>, <span class="str">`Bearer ${aliceToken}`</span>);

    <span class="fn">expect</span>(res.<span class="prop">status</span>).<span class="fn">toBe</span>(<span class="num">403</span>);
  });
});</code></pre></div>
<h2>Testing with Mocks vs Real DB</h2>
<table><thead><tr><th>Approach</th><th>Pros</th><th>Cons</th></tr></thead>
<tbody>
<tr><td>Mock everything (jest.mock)</td><td>Fast, no DB needed, isolated</td><td>Can miss integration bugs, mocks drift</td></tr>
<tr><td>Real test DB</td><td>Catches real bugs, tests full stack</td><td>Slower, needs DB setup in CI</td></tr>
<tr><td>In-memory SQLite</td><td>Fast, no setup</td><td>Doesn't support PG-specific features</td></tr>
</tbody></table>
<p><strong>Our recommendation:</strong> Unit tests mock the DB for pure business logic. Integration tests use a real PostgreSQL test database (<code>taskflow_test</code>) and run migrations before the suite with <code>sequelize.sync({ force: true })</code>.</p>
</template>
<template id="tpl-deployment">
<div class="chapter-header"><div class="ch-eyebrow">Chapter 19 · Production Ready</div><h1 class="ch-title">Deployment</h1><p class="ch-subtitle">The final chapter. We'll containerize the app with Docker, manage it with PM2, and wire up environment-based configuration for production.</p></div>
<h2>Environment-Based Configuration</h2>
<p>A production deployment differs from development in several ways: it uses a managed database URL, has <code>NODE_ENV=production</code>, disables SQL logging, uses HTTPS, and has strict secrets. All of this is controlled by environment variables — never hardcoded.</p>
<div class="code-block"><div class="code-header"><span class="code-lang">bash</span><span class="code-filename">.env.production (template — never commit real values)</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code>NODE_ENV=production
PORT=3000
DATABASE_URL=postgresql://user:password@db-host:5432/taskflow_prod
JWT_SECRET=very-long-random-secret-generated-with-openssl-rand
JWT_EXPIRES_IN=7d
LOG_LEVEL=warn
REDIS_URL=redis://redis-host:6379</code></pre></div>
<h2>Dockerizing the Application</h2>
<div class="code-block"><div class="code-header"><span class="code-lang">dockerfile</span><span class="code-filename">Dockerfile</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="cmt"># Stage 1: Dependencies</span>
FROM node:20-alpine AS deps
WORKDIR /app
COPY package*.json ./
RUN npm ci --only=production   <span class="cmt"># clean install, no devDeps</span>

<span class="cmt"># Stage 2: Final image</span>
FROM node:20-alpine
WORKDIR /app

<span class="cmt"># Create non-root user for security</span>
RUN addgroup -S appgroup && adduser -S appuser -G appgroup

COPY --from=deps /app/node_modules ./node_modules
COPY --chown=appuser:appgroup . .

USER appuser

EXPOSE 3000
HEALTHCHECK --interval=30s --timeout=3s \\
  CMD wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1

CMD ["node", "src/server.js"]</code></pre></div>
<div class="code-block"><div class="code-header"><span class="code-lang">yaml</span><span class="code-filename">docker-compose.yml</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code>version: '3.9'
services:
  api:
    build: .
    ports: ['3000:3000']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://taskflow:secret@db:5432/taskflow
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  postgres_data:</code></pre></div>
<div class="code-block"><div class="code-header"><span class="code-lang">bash</span><span class="code-filename">Docker commands</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="cmt"># Build and start</span>
docker compose up -d --build

<span class="cmt"># View logs</span>
docker compose logs -f api

<span class="cmt"># Run migrations inside the container</span>
docker compose exec api npx sequelize-cli db:migrate

<span class="cmt"># Stop everything</span>

<h2>PM2 — Process Manager</h2>
<p>PM2 keeps your Node.js app alive, restarts it if it crashes, and manages multiple instances for clustering across CPU cores.</p>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">ecosystem.config.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code>module.exports = {

    name: <span class="str">'taskflow-api'</span>,
    script: <span class="str">'src/server.js'</span>,
    instances: <span class="str">'max'</span>,         <span class="cmt">// one process per CPU core</span>
    exec_mode: <span class="str">'cluster'</span>,     <span class="cmt">// share port across instances</span>
    watch: <span class="kw">false</span>,
    max_memory_restart: <span class="str">'500M'</span>,
    env: { NODE_ENV: <span class="str">'development'</span> },
    env_production: {
      NODE_ENV: <span class="str">'production'</span>,
      PORT: <span class="num">3000</span>,
    },
    log_file: <span class="str">'./logs/combined.log'</span>,
    error_file: <span class="str">'./logs/error.log'</span>,
    log_date_format: <span class="str">'YYYY-MM-DD HH:mm:ss Z'</span>,
  }],
};</code></pre></div>
<div class="code-block"><div class="code-header"><span class="code-lang">bash</span><span class="code-filename">PM2 commands</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code>npm install -g pm2

pm2 logs taskflow-api    <span class="cmt"># tail logs</span>

pm2 stop taskflow-api    <span class="cmt"># stop</span>
pm2 save && pm2 startup  <span class="cmt"># survive server reboots</span></code></pre></div>

<h2>Nginx as Reverse Proxy</h2>
<p>In production, you never expose Node.js directly to the internet. Nginx sits in front as a reverse proxy, handling SSL termination, serving static files, adding security headers, and load-balancing across Node instances.</p>
<div class="code-block"><div class="code-header"><span class="code-lang">nginx</span><span class="code-filename">/etc/nginx/sites-available/taskflow</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
<pre><code>upstream taskflow {
    server 127.0.0.1:3000;
    server 127.0.0.1:3001;  # multiple PM2 cluster workers
    keepalive 64;
}

server {
    listen 80;
    server_name api.taskflow.app;
    return 301 https://$server_name$request_uri;  # force HTTPS
}

server {
    listen 443 ssl http2;
    server_name api.taskflow.app;

    ssl_certificate     /etc/letsencrypt/live/api.taskflow.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.taskflow.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Increase limits for file uploads
    client_max_body_size 10M;

    # Proxy to Node.js
    location /api {
        proxy_pass http://taskflow;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Serve uploaded files directly from Nginx (faster than proxying)
    location /uploads/ {
        alias /var/www/taskflow/uploads/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}</code></pre></div>

<div class="chapter-header"><div class="ch-eyebrow">Bonus · Going Further</div><h1 class="ch-title">WebSockets & Real-Time</h1><p class="ch-subtitle">REST APIs are great for request/response. But for live notifications, collaborative editing, or real-time dashboards, you need WebSockets — a persistent two-way connection between client and server.</p></div>
<h2>Why WebSockets?</h2>
<p>HTTP is stateless and one-directional — the client asks, the server answers. To show a user that a teammate just completed a task, you'd need to poll the API every few seconds (wasteful) or use WebSockets, which maintain an open connection allowing the server to <em>push</em> data to clients instantly.</p>
<h2>Socket.io Setup</h2>
<div class="code-block"><div class="code-header"><span class="code-lang">bash</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code>npm install socket.io</code></pre></div>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/socket.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> { <span class="cls">Server</span> } = <span class="fn">require</span>(<span class="str">'socket.io'</span>);
<span class="kw">const</span> jwt = <span class="fn">require</span>(<span class="str">'jsonwebtoken'</span>);
<span class="kw">const</span> config = <span class="fn">require</span>(<span class="str">'./config'</span>);

<span class="kw">function</span> <span class="fn">initSocket</span>(httpServer) {
  <span class="kw">const</span> io = <span class="kw">new</span> <span class="cls">Server</span>(httpServer, {
    cors: { origin: <span class="str">'*'</span>, methods: [<span class="str">'GET'</span>, <span class="str">'POST'</span>] },
    transports: [<span class="str">'websocket'</span>, <span class="str">'polling'</span>],
  });

  <span class="cmt">// Authentication middleware for WebSocket connections</span>
  io.<span class="fn">use</span>((socket, next) => {
    <span class="kw">const</span> token = socket.handshake.auth.<span class="prop">token</span>;
    <span class="kw">if</span> (!token) <span class="kw">return</span> <span class="fn">next</span>(<span class="kw">new</span> <span class="cls">Error</span>(<span class="str">'No token'</span>));
    <span class="kw">try</span> {
      socket.<span class="prop">user</span> = jwt.<span class="fn">verify</span>(token, config.jwt.secret);
      <span class="fn">next</span>();
    } <span class="kw">catch</span> (e) { <span class="fn">next</span>(<span class="kw">new</span> <span class="cls">Error</span>(<span class="str">'Invalid token'</span>)); }
  });

  io.<span class="fn">on</span>(<span class="str">'connection'</span>, (socket) => {
    console.<span class="fn">log</span>(<span class="str">`⚡ User ${socket.user.userId} connected`</span>);

    <span class="cmt">// Join a room for each project — scoped notifications</span>
    socket.<span class="fn">on</span>(<span class="str">'join_project'</span>, (projectId) => {
      socket.<span class="fn">join</span>(<span class="str">`project:${projectId}`</span>);
      console.<span class="fn">log</span>(<span class="str">`User joined project room: ${projectId}`</span>);
    });

    socket.<span class="fn">on</span>(<span class="str">'leave_project'</span>, (projectId) => {
      socket.<span class="fn">leave</span>(<span class="str">`project:${projectId}`</span>);
    });

    socket.<span class="fn">on</span>(<span class="str">'disconnect'</span>, () => {
      console.<span class="fn">log</span>(<span class="str">`User ${socket.user.userId} disconnected`</span>);
    });
  });

  <span class="kw">return</span> io;
}

module.exports = { initSocket };</code></pre></div>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/server.js (with Socket.io)</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> http = <span class="fn">require</span>(<span class="str">'http'</span>);
<span class="kw">const</span> app = <span class="fn">require</span>(<span class="str">'./app'</span>);
<span class="kw">const</span> { initSocket } = <span class="fn">require</span>(<span class="str">'./socket'</span>);
<span class="kw">const</span> config = <span class="fn">require</span>(<span class="str">'./config'</span>);

<span class="kw">const</span> httpServer = http.<span class="fn">createServer</span>(app);
<span class="kw">const</span> io = <span class="fn">initSocket</span>(httpServer);

<span class="cmt">// Make io accessible to controllers via app.set/get</span>
app.<span class="fn">set</span>(<span class="str">'io'</span>, io);

httpServer.<span class="fn">listen</span>(config.port, () => {
  console.<span class="fn">log</span>(<span class="str">`🚀 TaskFlow running on port ${config.port}`</span>);
});</code></pre></div>
<h2>Emitting Real-Time Events from Controllers</h2>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">Emit from task controller</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="cmt">// When a task is updated, notify everyone in the project room</span>
<span class="kw">const</span> <span class="fn">updateTask</span> = <span class="fn">asyncHandler</span>(<span class="kw">async</span> (req, res) => {
  <span class="kw">const</span> task = <span class="kw">await</span> req.task.<span class="fn">update</span>(req.body);

  <span class="cmt">// Emit to all clients in the project room (except the sender)</span>
  <span class="kw">if</span> (task.<span class="prop">projectId</span>) {
    req.<span class="prop">app</span>.<span class="fn">get</span>(<span class="str">'io'</span>)
      .<span class="fn">to</span>(<span class="str">`project:${task.projectId}`</span>)
      .<span class="fn">emit</span>(<span class="str">'task:updated'</span>, { taskId: task.<span class="prop">id</span>, changes: req.body, updatedBy: req.user.<span class="prop">id</span> });
  }

  res.<span class="fn">json</span>({ success: <span class="kw">true</span>, data: task });
});</code></pre></div>
<h2>Client-Side Usage (JavaScript)</h2>
<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">Browser client</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">import</span> { io } <span class="kw">from</span> <span class="str">'socket.io-client'</span>;

<span class="kw">const</span> socket = <span class="fn">io</span>(<span class="str">'https://api.taskflow.app'</span>, {
  auth: { token: localStorage.<span class="fn">getItem</span>(<span class="str">'accessToken'</span>) },
});

<span class="cmt">// Join the project you're currently viewing</span>
socket.<span class="fn">emit</span>(<span class="str">'join_project'</span>, currentProjectId);

<span class="cmt">// Listen for task updates from other users</span>
socket.<span class="fn">on</span>(<span class="str">'task:updated'</span>, ({ taskId, changes }) => {
  console.<span class="fn">log</span>(<span class="str">`Task ${taskId} was updated:`</span>, changes);
  <span class="cmt">// Re-fetch that task or update local state</span>
  <span class="fn">refreshTask</span>(taskId);
});

socket.<span class="fn">on</span>(<span class="str">'connect_error'</span>, (err) => {
  console.<span class="fn">error</span>(<span class="str">'Socket error:'</span>, err.<span class="prop">message</span>);
});</code></pre></div>
<div class="callout success"><div class="callout-title">🎉 You're Production-Ready</div><p>With WebSockets, your TaskFlow API now supports real-time collaboration. When Alice updates a task, Bob sees it instantly — no polling, no page refresh. This is the foundation of modern collaborative tools like Notion, Linear, and Figma.</p></div>

function chapterNav(num) {
  const chapters = CHAPTERS.filter(c => c.num);
  const idx = chapters.findIndex(c => c.num === num);
  const prev = idx > 0 ? chapters[idx - 1] : null;

    html += '<div class="nav-btn placeholder prev"><div class="nav-btn-direction">Previous</div><div class="nav-btn-title">Start of course</div></div>';

  if (next) {
    html += '<div class="nav-btn next" onclick="navigateTo(\'' + next.id + '\')">' +
      '<div class="nav-btn-direction">Next</div>' +
      '<div class="nav-btn-num">Chapter ' + next.num + '</div>' +
      '<div class="nav-btn-title">' + next.title + '</div></div>';
  } else {
    html += '<div class="nav-btn placeholder next"><div class="nav-btn-direction">Next</div><div class="nav-btn-title">End of course</div></div>';

  html += '</div>';

// ── STATE ─────────────────────────────────────────────────
const visited = new Set(JSON.parse(localStorage.getItem('visited') || '[]'));
let currentChapter = 'home';
let fuse;

// ── NAV BUILD ─────────────────────────────────────────────
function buildNav() {
  const groups = {};
  CHAPTERS.filter(c => c.group).forEach(c => {
    if (!groups[c.group]) groups[c.group] = [];
    groups[c.group].push(c);
  });
  const nav = document.getElementById('nav-scroll');
  let html = '';
  for (const [group, chs] of Object.entries(groups)) {
    html += '<div class="nav-group"><div class="nav-group-label">' + group + '</div>';
    chs.forEach(ch => {
      html += '<div class="nav-item" id="nav-' + ch.id + '" onclick="navigateTo(\'' + ch.id + '\')">' +

  ca.innerHTML = html;

  const navEl = document.getElementById('nav-' + id);
  if (navEl) { navEl.classList.add('active'); navEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }

  // Track visited chapters
  if (ch && ch.num) {
    visited.add(id);
    localStorage.setItem('visited', JSON.stringify([...visited]));

  // Close sidebar on mobile

let searchIndex = null;
let modalOpen   = false;

function initSearch() {
  // Build search data — include all text fields for richer matching
  const searchData = CHAPTERS.filter(c => c.num).map(c => ({
    id:    c.id,

    title: c.title,

      { name: 'title', weight: 0.7 },

    ignoreLocation:     false,  // location of match matters
    includeScore:       true,
    includeMatches:     true,

  });
  // DOM wiring happens in openSearchModal() — called on user action, DOM guaranteed ready
}

// Track if modal DOM listeners are wired (do it once)
let modalListenersWired = false;

function wireModalListeners() {
  if (modalListenersWired) return;
  const input = document.getElementById('search-modal-input');

  input.addEventListener('input', () => renderSearchResults(input.value.trim()));

// ── Highlight helper ─────────────────────────────────────
// Takes a string and an array of [start,end] index pairs from Fuse
// Returns HTML with <mark> spans around matched characters
function highlightMatches(text, indices) {
  if (!indices || !indices.length) return escapeHtml(text);

  // Flatten and sort ranges
  const ranges = [...indices].sort((a, b) => a[0] - b[0]);
  let result = '';
  let cursor = 0;

  for (const [start, end] of ranges) {
    if (start > cursor) {
      result += escapeHtml(text.slice(cursor, start));
    }
    result += '<span class="search-highlight">' + escapeHtml(text.slice(start, end + 1)) + '</span>';
    cursor = end + 1;
  }
  if (cursor < text.length) {
    result += escapeHtml(text.slice(cursor));
  }
  return result;
}

function escapeHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

    container.innerHTML = `
      <div class="search-modal-empty" id="search-empty-state">
        <div class="search-empty-icon">⌕</div>
        <div class="search-empty-title">Search the course</div>
        <div class="search-empty-sub">Topics, chapters, concepts — anything you're looking for</div>
      </div>`;
    return;
  }

  const q    = query.toLowerCase();
  const data = CHAPTERS.filter(c => c.num).map(c => ({
    id: c.id, num: c.num, title: c.title,
    desc: c.desc || '', group: c.group || '',
  }));

  // ── Pass 1: exact substring match on whole words in title ──────────────
  // "sca" must appear as a contiguous run inside a word, not scattered chars
  const exactMatches = [];
  const exactIds = new Set();

  for (const item of data) {
    const titleLow = item.title.toLowerCase();
    const descLow  = item.desc.toLowerCase();
    const groupLow = item.group.toLowerCase();

    // Check if query is a contiguous substring of the title, desc, or group
    const inTitle = titleLow.includes(q);
    const inDesc  = descLow.includes(q);
    const inGroup = groupLow.includes(q);

    if (inTitle || inDesc || inGroup) {
      exactMatches.push({
        item,
        score: inTitle ? 0 : (inDesc ? 0.1 : 0.18),
        inTitle, inDesc, inGroup,
        _isExact: true,
      });
      exactIds.add(item.id);
    }
  }

  // Sort exact matches: title hits first, then desc, then group
  exactMatches.sort((a, b) => {
    // Earlier position in title = higher rank
    const posA = a.item.title.toLowerCase().indexOf(q);
    const posB = b.item.title.toLowerCase().indexOf(q);
    if (a.inTitle && b.inTitle) return posA - posB;
    if (a.inTitle) return -1;
    if (b.inTitle) return 1;
    return a.score - b.score;
  });

  // ── Pass 2: Fuse fuzzy, but only high-quality results ──────────────────
  // Strict score threshold + verify the matched characters form a contiguous run
  const fuseRaw = searchIndex.search(query);

  const fuseFiltered = fuseRaw
    .filter(r => {
      // Hard threshold — discard anything too fuzzy
      if ((r.score || 1) > 0.22) return false;
      // Already in exact matches
      if (exactIds.has(r.item.id)) return false;
      // Verify: at least one matched field has a contiguous span >= 60% of query length
      const minSpan = Math.max(1, Math.floor(q.length * 0.6));
      const matches = r.matches || [];
      const hasGoodSpan = matches.some(m =>
        m.indices.some(([s, e]) => (e - s + 1) >= minSpan)
      );
      return hasGoodSpan;
    })
    .slice(0, 5)
    .map(r => ({ ...r, _isExact: false }));

  // ── Combine: exact first, fuzzy appended ────────────────────────────────
  const combined = [
    ...exactMatches.slice(0, 6),
    ...fuseFiltered,
  ].slice(0, 8);

  if (!combined.length) {
    lastResults = [];
    selectedIdx = -1;
    container.innerHTML = `
      <div class="search-no-results">
        <div class="search-no-results-title">No results for "${escapeHtml(query)}"</div>
        <div class="search-no-results-sub">Try different keywords or browse chapters in the sidebar</div>
      </div>`;
    return;
  }

  lastResults = combined;
  if (selectedIdx >= lastResults.length) selectedIdx = lastResults.length - 1;

  // ── Render ───────────────────────────────────────────────────────────────
  const hasExact = combined.some(r => r._isExact);
  const hasFuzzy = combined.some(r => !r._isExact);

  let html = '';

  const exactItems = combined.filter(r => r._isExact);
  const fuzzyItems = combined.filter(r => !r._isExact);

  if (exactItems.length) {
    html += `<div class="search-section-label">Chapters — ${exactItems.length} match${exactItems.length !== 1 ? 'es' : ''}</div>`;
    html += exactItems.map((r, i) => renderRow(r, i, q, r.matches || [])).join('');
  }

  if (fuzzyItems.length) {
    const offset = exactItems.length;
    html += `<div class="search-section-label" style="margin-top:8px;">Also relevant</div>`;
    html += fuzzyItems.map((r, i) => renderRow(r, i + offset, q, r.matches || [])).join('');
  }

  container.innerHTML = html;
  scrollSelectedIntoView();
}

function renderRow(r, i, query, fuseMatches) {
  const item       = r.item;
  const isSelected = i === selectedIdx;
  const score      = r.score || 0;
  const quality    = Math.max(0, Math.min(1, 1 - score * 4));

  // For exact results use simple substring highlight
  // For fuse results use the index-based highlight
  let titleHtml, descHtml;

  if (r._isExact) {
    titleHtml = highlightSubstring(item.title, query);
    descHtml  = highlightSubstring(item.desc,  query);
  } else {
    const titleMatch = fuseMatches.find(m => m.key === 'title');
    const descMatch  = fuseMatches.find(m => m.key === 'desc');
    titleHtml = highlightMatches(item.title, titleMatch ? titleMatch.indices : []);
    descHtml  = highlightMatches(item.desc,  descMatch  ? descMatch.indices  : []);
  }

  return `<div
    class="search-result-row${isSelected ? ' selected' : ''}"
    data-idx="${i}"
    onclick="selectAndNavigate(${i})"
    onmouseenter="hoverResult(${i})"
    role="option"
    aria-selected="${isSelected}"
  >
    <div class="search-result-num">Ch.${item.num}</div>
    <div class="search-result-body">
      <div class="search-result-group">${escapeHtml(item.group)}</div>
      <div class="search-result-title">${titleHtml}</div>
      <div class="search-result-desc">${descHtml}</div>
    </div>
    <div class="search-result-arrow">→</div>
    <div class="search-score-bar" style="opacity:${(0.3 + quality * 0.7).toFixed(2)}"></div>
  </div>`;
}

// Highlight a contiguous substring (for exact matches)
function highlightSubstring(text, query) {
  if (!query) return escapeHtml(text);
  const idx = text.toLowerCase().indexOf(query.toLowerCase());
  if (idx === -1) return escapeHtml(text);
  return (
    escapeHtml(text.slice(0, idx)) +
    '<span class="search-highlight">' +
    escapeHtml(text.slice(idx, idx + query.length)) +
    '</span>' +
    escapeHtml(text.slice(idx + query.length))
  );
}

// ── Keyboard navigation
// ── Keyboard navigation ───────────────────────────────────
function handleSearchKeydown(e) {
  if (!lastResults.length) return;

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    selectedIdx = Math.min(selectedIdx + 1, lastResults.length - 1);
    refreshSelectedClass();
    scrollSelectedIntoView();

  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    selectedIdx = Math.max(selectedIdx - 1, 0);
    refreshSelectedClass();
    scrollSelectedIntoView();

  } else if (e.key === 'Enter') {
    e.preventDefault();
    const idx = selectedIdx >= 0 ? selectedIdx : 0;
    selectAndNavigate(idx);
  }
}

function hoverResult(idx) {
  selectedIdx = idx;
  refreshSelectedClass();
}

function refreshSelectedClass() {
  const rows = document.querySelectorAll('.search-result-row');
  rows.forEach((row, i) => {
    row.classList.toggle('selected', i === selectedIdx);
    row.setAttribute('aria-selected', i === selectedIdx ? 'true' : 'false');
  });
}

function scrollSelectedIntoView() {
  const selected = document.querySelector('.search-result-row.selected');
  if (selected) {
    selected.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

function selectAndNavigate(idx) {
  const result = lastResults[idx];
  if (!result) return;
  closeSearchModal();
  navigateTo(result.item.id);
}

// ── KEYBOARD SHORTCUTS

// ── KEYBOARD SHORTCUTS ────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === '/' && !e.target.closest('input, textarea')) {
    e.preventDefault();
    openSearchModal();
  }
  if (e.key === 'Escape') {
    if (modalOpen) closeSearchModal();
  }
  if (e.altKey && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) {
    e.preventDefault();
    const ch = CHAPTERS.find(c => c.id === currentChapter);
    if (!ch || !ch.num) return;
    const all = CHAPTERS.filter(c => c.num);
    const idx = all.findIndex(c => c.num === ch.num);
    if (e.key === 'ArrowRight' && idx < all.length - 1) navigateTo(all[idx + 1].id);
    if (e.key === 'ArrowLeft' && idx > 0) navigateTo(all[idx - 1].id);
  }
});

// ── INIT ──────────────────────────────────────────────────
buildNav();
initSearch();
updateProgress();

const hash = window.location.hash.replace('#', '');
navigateTo(hash && CHAPTERS.find(c => c.id === hash) ? hash : 'home');
</script>

<template id="tpl-pm2"><div class="chapter-header"><div class="ch-eyebrow">Chapter 20 · Production Ready</div><h1 class="ch-title">PM2 — Process Management</h1><p class="ch-subtitle">PM2 is the production process manager for Node.js. It keeps your app alive after crashes, leverages all CPU cores through clustering, provides structured logging, and integrates with your OS startup system.</p></div>

<h2>Why You Need a Process Manager</h2>
<p>Running your app with <code>node src/server.js</code> works perfectly in development. In production, it has a fatal problem: when the process crashes — and eventually every process does — it stays dead. No automatic restart, no logging, no alert. Users see a blank screen.</p>
<p>PM2 wraps your Node.js process with:</p>
<ul>
  <li><strong>Automatic restart</strong> on crash with configurable backoff</li>
  <li><strong>Cluster mode</strong> — spawn one process per CPU core, all sharing the same port</li>
  <li><strong>Zero-downtime reloads</strong> — deploy new code without any requests being dropped</li>
  <li><strong>Log aggregation</strong> — unified logs from all cluster workers</li>
  <li><strong>Startup integration</strong> — survive server reboots</li>
  <li><strong>Monitoring dashboard</strong> — memory, CPU, request rate per process</li>
</ul>

<h2>Installing PM2</h2>

<div class="code-block"><div class="code-header"><span class="code-lang">bash</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="cmt"># Install globally — PM2 is a system tool, not a project dependency</span>
npm install -g pm2

<span class="cmt"># Verify</span>
pm2 --version    <span class="cmt"># e.g. 5.3.1</span></code></pre></div>

<h2>The Ecosystem File</h2>
<p>The <code>ecosystem.config.js</code> file is PM2's configuration format. It lives in your project root and is committed to version control. This replaces ad-hoc pm2 command arguments and makes deployments reproducible:</p>

<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">ecosystem.config.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code>module.exports = {
  apps: [{
    name:          <span class="str">'taskflow-api'</span>,
    script:        <span class="str">'src/server.js'</span>,

    <span class="cmt">// ── Clustering ────────────────────────────────────────</span>
    <span class="cmt">// 'max' spawns one process per logical CPU core</span>
    <span class="cmt">// On a 4-core server: 4 workers, all sharing port 3000</span>
    instances:     <span class="str">'max'</span>,
    exec_mode:     <span class="str">'cluster'</span>,    <span class="cmt">// required for multi-instance port sharing</span>

    <span class="cmt">// ── Restart Behaviour ─────────────────────────────────</span>
    watch:              <span class="kw">false</span>,  <span class="cmt">// don't restart on file change (use nodemon in dev)</span>
    max_memory_restart: <span class="str">'512M'</span>, <span class="cmt">// restart if a worker exceeds 512MB RAM</span>
    restart_delay:      <span class="num">3000</span>,   <span class="cmt">// wait 3s before restarting after a crash</span>
    max_restarts:       <span class="num">10</span>,     <span class="cmt">// if it crashes 10 times rapidly, stop trying</span>
    min_uptime:         <span class="str">'10s'</span>, <span class="cmt">// must stay up 10s to count as "successful start"</span>

    <span class="cmt">// ── Logging ───────────────────────────────────────────</span>
    output:         <span class="str">'./logs/pm2-out.log'</span>,    <span class="cmt">// stdout from all workers</span>
    error:          <span class="str">'./logs/pm2-error.log'</span>,  <span class="cmt">// stderr from all workers</span>
    merge_logs:     <span class="kw">true</span>,    <span class="cmt">// combine logs from all cluster workers into one file</span>
    log_date_format: <span class="str">'YYYY-MM-DD HH:mm:ss Z'</span>,

    <span class="cmt">// ── Environment ───────────────────────────────────────</span>
    <span class="cmt">// 'env' = defaults,  'env_production' = overrides when --env production</span>
    env: {
      NODE_ENV: <span class="str">'development'</span>,
      PORT:     <span class="num">3000</span>,
    },
    env_production: {
      NODE_ENV: <span class="str">'production'</span>,
      PORT:     <span class="num">3000</span>,
    },
  }],
};</code></pre></div>

<h2>Core PM2 Commands</h2>

<div class="code-block"><div class="code-header"><span class="code-lang">bash</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="cmt"># ── Starting ─────────────────────────────────────────────</span>
pm2 start ecosystem.config.js                    <span class="cmt"># start in development mode</span>
pm2 start ecosystem.config.js --env production   <span class="cmt"># start in production mode</span>

<span class="cmt"># ── Status & Monitoring ───────────────────────────────────</span>
pm2 status                  <span class="cmt"># table: name, status, CPU, memory, restarts</span>
pm2 monit                   <span class="cmt"># live dashboard: real-time CPU/memory graphs</span>
pm2 info taskflow-api       <span class="cmt"># detailed info: PID, uptime, restart count</span>

<span class="cmt"># ── Logs ─────────────────────────────────────────────────</span>
pm2 logs                    <span class="cmt"># tail ALL process logs</span>
pm2 logs taskflow-api       <span class="cmt"># tail logs for a specific app</span>
pm2 logs taskflow-api --lines 200   <span class="cmt"># last 200 lines</span>
pm2 flush                   <span class="cmt"># clear all log files</span>

<span class="cmt"># ── Lifecycle ─────────────────────────────────────────────</span>
pm2 reload taskflow-api     <span class="cmt"># zero-downtime reload (rolling restart)</span>
pm2 restart taskflow-api    <span class="cmt"># hard restart (brief downtime)</span>
pm2 stop taskflow-api       <span class="cmt"># stop without removing from PM2's list</span>
pm2 delete taskflow-api     <span class="cmt"># stop and remove from list</span>

<span class="cmt"># ── Deployment ───────────────────────────────────────────</span>
<span class="cmt"># After deploying new code:</span>
git pull origin main
npm ci --only=production
npx sequelize-cli db:migrate
pm2 reload ecosystem.config.js --env production   <span class="cmt"># zero-downtime</span></code></pre></div>

<h2>Zero-Downtime Reloads — How They Work</h2>
<p>This is one of PM2's killer features. A <code>pm2 reload</code> in cluster mode doesn't restart all workers simultaneously — it uses a <em>rolling restart</em>:</p>
<ol>
  <li>PM2 sends SIGINT to <strong>worker 1</strong>. The worker finishes any in-flight requests, then shuts down gracefully.</li>
  <li>PM2 starts a <strong>new worker 1</strong> with the new code. Traffic from the load balancer routes to workers 2, 3, 4 while worker 1 boots.</li>
  <li>Once worker 1 is healthy, PM2 repeats for worker 2, and so on.</li>
</ol>
<p>The result: zero dropped requests during deployment. For this to work properly, your app must handle <code>SIGINT</code> gracefully by stopping the HTTP server:</p>

<div class="code-block"><div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/server.js — graceful shutdown</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="kw">const</span> http = <span class="fn">require</span>(<span class="str">'http'</span>);
<span class="kw">const</span> app  = <span class="fn">require</span>(<span class="str">'./app'</span>);
<span class="kw">const</span> { sequelize } = <span class="fn">require</span>(<span class="str">'./models'</span>);

<span class="kw">const</span> server = http.<span class="fn">createServer</span>(app);

server.<span class="fn">listen</span>(<span class="fn">require</span>(<span class="str">'./config'</span>).port, () => {
  console.<span class="fn">log</span>(<span class="str">`Worker ${process.pid}: listening on port ${require('./config').port}`</span>);
});

<span class="cmt">// Graceful shutdown handler — called by PM2 before killing the process</span>
<span class="kw">const</span> <span class="fn">gracefulShutdown</span> = (signal) => {
  console.<span class="fn">log</span>(<span class="str">`Worker ${process.pid}: received ${signal}, shutting down...`</span>);

  server.<span class="fn">close</span>(<span class="kw">async</span> () => {
    console.<span class="fn">log</span>(<span class="str">'HTTP server closed. Closing DB connections...'</span>);
    <span class="kw">await</span> sequelize.<span class="fn">close</span>();  <span class="cmt">// drain connection pool</span>
    console.<span class="fn">log</span>(<span class="str">'All connections closed. Exiting.'</span>);
    process.<span class="fn">exit</span>(<span class="num">0</span>);
  });

  <span class="cmt">// Force-kill if graceful shutdown takes too long</span>
  <span class="fn">setTimeout</span>(() => {
    console.<span class="fn">error</span>(<span class="str">'Graceful shutdown timed out. Force-exiting.'</span>);
    process.<span class="fn">exit</span>(<span class="num">1</span>);
  }, <span class="num">10000</span>); <span class="cmt">// 10 second hard timeout</span>
};

process.<span class="fn">on</span>(<span class="str">'SIGTERM'</span>, () => <span class="fn">gracefulShutdown</span>(<span class="str">'SIGTERM'</span>));
process.<span class="fn">on</span>(<span class="str">'SIGINT'</span>,  () => <span class="fn">gracefulShutdown</span>(<span class="str">'SIGINT'</span>));</code></pre></div>

<h2>Surviving Server Reboots</h2>
<p>If your server reboots (security patch, power cycle), PM2 must restart automatically. The <code>pm2 startup</code> command generates and installs a system service for this:</p>

<div class="code-block"><div class="code-header"><span class="code-lang">bash</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="cmt"># Generate and install startup script for your OS (systemd, launchd, etc.)</span>
pm2 startup
<span class="cmt"># PM2 prints a sudo command — run it exactly as shown</span>

<span class="cmt"># Save the current process list so PM2 restores it on boot</span>
pm2 save

<span class="cmt"># Verify: simulate a reboot</span>
sudo reboot
<span class="cmt"># After reconnecting, your app should already be running:</span>
pm2 status</code></pre></div>

<h2>Environment Variables with PM2</h2>
<p>PM2 does <strong>not</strong> automatically load your <code>.env</code> file. In production, set environment variables through your OS, your cloud provider's config panel, or pass them directly to PM2:</p>

<div class="code-block"><div class="code-header"><span class="code-lang">bash</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="cmt"># Option 1: Set in ecosystem.config.js env_production block (Chapter 19 pattern)</span>
<span class="cmt"># Good for non-secret config. Secrets should NOT be in the committed config file.</span>

<span class="cmt"># Option 2: Export to your shell before starting PM2</span>
export DATABASE_URL="postgresql://..."
export JWT_SECRET="..."
pm2 start ecosystem.config.js --env production

<span class="cmt"># Option 3: Use a .env file but load it manually (requires dotenv-cli)</span>
npx dotenv -e /etc/taskflow/.env -- pm2 start ecosystem.config.js --env production

<span class="cmt"># Option 4: Use PM2's built-in env option at start time</span>
pm2 start ecosystem.config.js --env production \
  --update-env \
  --set-env JWT_SECRET=your-secret-here</code></pre></div>

<h2>PM2 Cluster Mode — Understanding the Topology</h2>
<p>In cluster mode, PM2 uses Node's built-in <code>cluster</code> module. One PM2 master process acts as a load balancer. It distributes incoming connections across N worker processes in round-robin order:</p>

<div class="app-diagram"><pre>
         Incoming requests
                │
         ┌──────▼──────┐
         │  PM2 Master  │  (load balancer — round robin)
         └──────┬──────┘
    ┌───────────┼───────────┐
    │           │           │
┌───▼──┐  ┌────▼─┐  ┌──────▼┐
│Worker│  │Worker│  │Worker │
│  1   │  │  2   │  │   3   │   ← each = a full Node.js process
│:3000 │  │:3000 │  │ :3000 │   ← all share the same port
└──────┘  └──────┘  └───────┘</pre></div>

<p>Each worker is a completely independent Node.js process with its own memory. This means any in-process state (the Fuse.js index cache, in-memory caches, etc.) is NOT shared between workers. For shared state, you need an external store like Redis.</p>

<div class="callout info"><div class="callout-title">💡 How many instances?</div><p>Set <code>instances: 'max'</code> for production. In development, use <code>instances: 1</code> — it's much easier to debug a single process. For a 2-core server, max = 2 workers. For an 8-core server, max = 8. Each worker can handle thousands of concurrent connections thanks to Node's event loop, so you rarely need more workers than CPU cores.</p></div>

<h2>PM2 Web Dashboard</h2>

<div class="code-block"><div class="code-header"><span class="code-lang">bash</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div><pre><code><span class="cmt"># PM2 Plus — cloud monitoring dashboard (free tier available)</span>
pm2 link SECRET_KEY PUBLIC_KEY   <span class="cmt"># get keys from app.pm2.io</span>
<span class="cmt"># Now monitor all your servers at app.pm2.io</span>

<span class="cmt"># Local terminal dashboard</span>
pm2 monit
<span class="cmt"># Shows: CPU %, memory, requests/min, error rate — live updating</span></code></pre></div>

<div class="callout success"><div class="callout-title">✅ PM2 Production-Ready</div><p>Your Node.js app now has automatic crash recovery, zero-downtime deployments, full CPU utilisation via clustering, structured logging, and OS-level startup integration. Combined with the Nginx reverse proxy from Chapter 19, this is a solid production foundation.</p></div></template>

<template id="tpl-concurrency"><div class="chapter-header">
  <div class="ch-eyebrow">Chapter 22 · Bonus · Advanced Node.js</div>
  <h1 class="ch-title">Clusters, Child Processes &amp; Worker Threads</h1>
  <p class="ch-subtitle">Node.js is single-threaded — but modern servers have 8, 16, or 32 CPU cores sitting idle. These three APIs let you use every one of them. Understanding when to reach for each one is the mark of a senior Node.js developer.</p>
</div>

<h2>The Problem: One Core, Many Cores</h2>
<p>Node.js's single-threaded event loop is excellent at handling thousands of concurrent I/O operations — waiting for database responses, network calls, file reads. It handles all of this in a single thread because waiting doesn't consume CPU.</p>
<p>But <strong>CPU-bound work is a different story entirely</strong>. If you need to resize an image, parse a 50MB JSON file, run a machine learning inference, or compute a complex report — that work consumes CPU continuously. While it runs, the event loop is blocked. No other requests can be handled. Your server is frozen.</p>
<p>Node gives you three different tools to escape this constraint, each suited to different problems:</p>

<table>
  <thead><tr><th>API</th><th>What it is</th><th>Communication</th><th>Best for</th></tr></thead>
  <tbody>
    <tr>
      <td><code>child_process</code></td>
      <td>Spawns a completely separate OS process (any language)</td>
      <td>stdin/stdout streams, IPC channel</td>
      <td>Running shell commands, calling Python/Rust scripts, isolation</td>
    </tr>
    <tr>
      <td><code>cluster</code></td>
      <td>Forks multiple identical Node.js processes sharing one port</td>
      <td>IPC messages, shared server socket</td>
      <td>Scaling HTTP servers across CPU cores (PM2 uses this)</td>
    </tr>
    <tr>
      <td><code>worker_threads</code></td>
      <td>True OS threads inside the same Node.js process</td>
      <td>SharedArrayBuffer, MessageChannel, postMessage</td>
      <td>CPU-intensive JS work that needs to share memory</td>
    </tr>
  </tbody>
</table>

<div class="concept-box">
  <h4>🧵 Processes vs Threads</h4>
  <p>A <strong>process</strong> is an independent program with its own memory space. A <strong>thread</strong> runs inside a process and shares its memory. Processes are isolated (a crash in one can't corrupt another's memory), but communication between them requires serialization. Threads share memory directly, making communication instant but requiring synchronization to avoid data races.</p>
</div>

<h2>Child Processes</h2>
<p>The <code>child_process</code> module lets you spawn any external program — a shell command, a Python script, a compiled Rust binary — from inside Node.js. The child runs in a completely separate OS process with its own memory space. Node communicates with it through standard streams (<code>stdin</code>, <code>stdout</code>, <code>stderr</code>) or a built-in IPC (inter-process communication) channel when the child is also Node.js.</p>

<h3>The Four child_process Methods</h3>

<div class="code-block">
  <div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">child-process-methods.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
  <pre><code><span class="kw">const</span> { exec, execFile, spawn, fork } = <span class="fn">require</span>(<span class="str">'child_process'</span>);

<span class="cmt">// ── exec() ───────────────────────────────────────────────
// Runs a shell command string. Buffers ALL output in memory.
// Good for: simple commands with small output.
// Risk: shell injection if you interpolate user input!</span>
<span class="fn">exec</span>(<span class="str">'ls -la /uploads'</span>, (err, stdout, stderr) => {
  <span class="kw">if</span> (err) { console.<span class="fn">error</span>(<span class="str">'Failed:'</span>, stderr); <span class="kw">return</span>; }
  console.<span class="fn">log</span>(stdout);
});

<span class="cmt">// Promise version (util.promisify or the built-in promises API)</span>
<span class="kw">const</span> { exec: execAsync } = <span class="fn">require</span>(<span class="str">'child_process'</span>).<span class="prop">promises</span>;
<span class="kw">const</span> { stdout } = <span class="kw">await</span> <span class="fn">execAsync</span>(<span class="str">'git log --oneline -5'</span>);

<span class="cmt">// ── execFile() ───────────────────────────────────────────
// Like exec() but takes a file path + args array — no shell involved.
// SAFE from shell injection because args are never shell-interpreted.</span>
<span class="fn">execFile</span>(<span class="str">'/usr/bin/ffprobe'</span>, [<span class="str">'-v'</span>, <span class="str">'quiet'</span>, <span class="str">'-print_format'</span>, <span class="str">'json'</span>, <span class="str">'/uploads/video.mp4'</span>],
  (err, stdout) => {
    <span class="kw">const</span> meta = <span class="cls">JSON</span>.<span class="fn">parse</span>(stdout);
    console.<span class="fn">log</span>(<span class="str">'Duration:'</span>, meta.<span class="prop">format</span>.<span class="prop">duration</span>);
  }
);

<span class="cmt">// ── spawn() ──────────────────────────────────────────────
// Launches a program and gives you streaming stdin/stdout/stderr.
// Good for: long-running processes, large output, piping data.
// Doesn't buffer output — processes it as it arrives.</span>
<span class="kw">const</span> ls = <span class="fn">spawn</span>(<span class="str">'ls'</span>, [<span class="str">'-la'</span>]);
ls.<span class="prop">stdout</span>.<span class="fn">on</span>(<span class="str">'data'</span>, (chunk) => process.<span class="prop">stdout</span>.<span class="fn">write</span>(chunk));
ls.<span class="prop">stderr</span>.<span class="fn">on</span>(<span class="str">'data'</span>, (chunk) => console.<span class="fn">error</span>(chunk.<span class="fn">toString</span>()));
ls.<span class="fn">on</span>(<span class="str">'close'</span>, (code) => console.<span class="fn">log</span>(<span class="str">`Exited with code ${code}`</span>));

<span class="cmt">// ── fork() ───────────────────────────────────────────────
// Spawns a new NODE.JS process specifically, with a built-in
// two-way IPC channel. The cleanest API for Node-to-Node communication.
// child.send() / process.on('message') work automatically.</span>
<span class="kw">const</span> child = <span class="fn">fork</span>(<span class="str">'./workers/imageProcessor.js'</span>);
child.<span class="fn">send</span>({ filePath: <span class="str">'/uploads/photo.jpg'</span>, width: <span class="num">800</span> });
child.<span class="fn">on</span>(<span class="str">'message'</span>, (result) => console.<span class="fn">log</span>(<span class="str">'Processed:'</span>, result.<span class="prop">outputPath</span>));
child.<span class="fn">on</span>(<span class="str">'error'</span>, (err) => console.<span class="fn">error</span>(<span class="str">'Child crashed:'</span>, err));</code></pre>
</div>

<h3>Real-World Example: Calling a Python Script</h3>
<p>A common pattern is having Node.js handle the HTTP API while delegating ML inference or data science tasks to Python:</p>

<div class="code-block">
  <div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/services/mlService.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>
  <pre><code><span class="kw">const</span> { execFile } = <span class="fn">require</span>(<span class="str">'child_process'</span>);
<span class="kw">const</span> path = <span class="fn">require</span>(<span class="str">'path'</span>);

<span class="cmt">/**
 * Calls a Python script for NLP task classification.
 * The Python script reads JSON from stdin and writes JSON to stdout.
 */</span>
<span class="kw">function</span> <span class="fn">classifyTask</span>(taskText) {
  <span class="kw">return new</span> <span class="cls">Promise</span>((resolve, reject) => {
    <span class="kw">const</span> script = path.<span class="fn">join</span>(__dirname, <span class="str">'../../ml/classify.py'</span>);
    <span class="kw">const</span> child = <span class="fn">execFile</span>(
      <span class="str">'python3'</span>,
      [script],
      { timeout: <span class="num">10000</span> },  <span class="cmt">// kill if takes longer than 10s</span>
      (err, stdout, stderr) => {
        <span class="kw">if</span> (err) <span class="kw">return</span> <span class="fn">reject</span>(<span class="kw">new</span> <span class="cls">Error</span>(<span class="str">`Python error: ${stderr}`</span>));
        <span class="kw">try</span> {
          <span class="fn">resolve</span>(<span class="cls">JSON</span>.<span class="fn">parse</span>(stdout));
        } <span class="kw">catch</span> {
          <span class="fn">reject</span>(<span class="kw">new</span> <span class="cls">Error</span>(<span class="str">`Invalid JSON from Python: ${stdout}`</span>));
        }
      }
    );
    <span class="cmt">// Send input to Python via stdin</span>
    child.<span class="prop">stdin</span>.<span class="fn">write</span>(<span class="cls">JSON</span>.<span class="fn">stringify</span>({ text: taskText }));
    child.<span class="prop">stdin</span>.<span class="fn">end</span>();
  });
}

module.exports = { classifyTask };</code></pre>
</div>

<div class="callout warning">
  <div class="callout-title">⚠️ Never interpolate user input into exec() strings</div>
  <p>This is a shell injection vulnerability: <code>exec(`ls ${userInput}`)</code> — if <code>userInput</code> is <code>; rm -rf /</code>, your server is gone. Always use <code>execFile()</code> or <code>spawn()</code> with separate args arrays when user data is involved. Args in arrays are never interpreted by the shell.</p>
</div>

<h3>spawn() for Large Outputs — Video Processing Example</h3>
<div class="code-block">
  <div class="code-header"><span class="code-lang">JavaScript</span><span class="code-filename">src/services/videoService.js</span><button class="copy-btn" onclick="copyCode(this)">Copy</button></div>

<span class="kw">function</span> <span class="fn">convertTo720p</span>(inputPath, outputPath) {

      <span class="str">'-y'</span>,        <span class="cmt">// overwrite output if exists</span>
      outputPath

      <span class="cmt">// ffmpeg writes progress to stderr (not stdout)</span>
      progressLine = data.<span class="fn">toString</span>();
      <span class="kw">if</span> (progressLine.<span class="fn">includes</span>(<span class="str">'time='</span>)) {
        <span class="cmt">// parse and emit progress event...</span>
      }
    });

    ffmpeg.<span class="fn">on</span>(<span class="str">'close'</span>, (code) => {
      <span class="kw">if</span> (code === <span class="num">0</span>) <span class="fn">resolve</span>(outputPath);
      <span class="kw">else</span> <span class="fn">reject</span>(<span class="kw">new</span> <span class="cls">Error</span>(<span class="str">`ffmpeg exited with code ${code}`</span>));

    ffmpeg.<span class="fn">on</span>(<span class="str">'error'</span>, (err) => {
