<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AdonisJS + Inertia + React — Build Kazi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;600&family=Lora:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0c0d14;
  --surface:#12141e;
  --surface2:#191c29;
  --surface3:#212538;
  --border:#262a3d;
  --border2:#33384f;
  --text:#d9dcea;
  --muted:#8a90ab;
  --subtle:#5f6582;
  --head:#f2f3fa;
  --accent:#8b7bff;
  --accent2:#b19bff;
  --accent-bg:rgba(139,123,255,.12);
  --accent-line:rgba(139,123,255,.35);
  --inertia:#c77dff;
  --green:#4ade80;
  --green-bg:rgba(74,222,128,.09);
  --amber:#fbbf24;
  --amber-bg:rgba(251,191,36,.09);
  --red:#f87171;
  --red-bg:rgba(248,113,113,.09);
  --blue:#60a5fa;
  --blue-bg:rgba(96,165,250,.09);
  --code-bg:#0e1019;
  --code-head:#151827;
  --sidebar-w:292px;
  --rail-w:220px;
  --hdr-h:58px;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'DM Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --serif:'Lora',Georgia,serif;
}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:15.5px;line-height:1.75;min-height:100vh}
a{color:var(--accent2);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit}
::selection{background:rgba(139,123,255,.35)}

/* ---------- header ---------- */
.hdr{position:fixed;top:0;left:0;right:0;height:var(--hdr-h);background:rgba(18,20,30,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 20px;z-index:300}
.menu-btn{display:none;background:none;border:1px solid var(--border);color:var(--text);width:38px;height:38px;border-radius:9px;cursor:pointer;align-items:center;justify-content:center;flex-shrink:0}
.brand{display:flex;align-items:center;gap:11px;white-space:nowrap;color:var(--head);text-decoration:none!important;min-width:0}
.brand-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--inertia));display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 18px rgba(139,123,255,.3)}
.brand-t{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.1px}
.brand-t span{color:var(--accent2)}
.brand-s{font-size:11.5px;color:var(--muted);display:block;line-height:1.2;font-family:var(--sans);font-weight:500;letter-spacing:.3px}
.search-trigger{margin-left:auto;display:flex;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--border);color:var(--muted);padding:0 10px 0 13px;height:38px;border-radius:10px;cursor:pointer;min-width:300px;font-size:14px;transition:border-color .15s,background .15s}
.search-trigger:hover{border-color:var(--accent-line);background:var(--surface3)}
.search-trigger .st-label{flex:1;text-align:left}
kbd,.kbd{font-family:var(--mono);font-size:11px;background:var(--surface3);border:1px solid var(--border2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--muted);line-height:1.5}
.hdr-progress{position:absolute;left:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--accent),var(--inertia));width:0;transition:width .35s ease}

/* ---------- layout ---------- */
.layout{display:flex;padding-top:var(--hdr-h)}
.sidebar{position:fixed;top:var(--hdr-h);bottom:0;left:0;width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:18px 12px 40px;z-index:200;scrollbar-width:thin;scrollbar-color:var(--border2) transparent}
.sb-progress{margin:0 8px 18px;padding:12px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:11px}
.sb-progress-top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:8px}
.sb-progress-top b{color:var(--head);font-weight:600}
.sb-bar{height:5px;background:var(--surface3);border-radius:99px;overflow:hidden}
.sb-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--inertia));border-radius:99px;transition:width .35s}
.sb-group{margin-bottom:14px}
.sb-group-h{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.3px;color:var(--subtle);padding:6px 10px 6px}
.sb-link{display:flex;align-items:flex-start;gap:10px;padding:7px 10px;border-radius:8px;color:var(--muted);font-size:13.8px;line-height:1.4;cursor:pointer;text-decoration:none!important;border:1px solid transparent;transition:background .12s,color .12s}
.sb-link:hover{background:var(--surface2);color:var(--text)}
.sb-link.active{background:var(--accent-bg);color:var(--head);border-color:var(--accent-line)}
.sb-num{font-family:var(--mono);font-size:10.5px;color:var(--subtle);min-width:20px;padding-top:2px}
.sb-link.active .sb-num{color:var(--accent2)}
.sb-link.visited .sb-num::after{content:'';display:inline-block;width:5px;height:5px;background:var(--green);border-radius:50%;margin-left:4px;vertical-align:middle;opacity:.8}
.main{flex:1;margin-left:var(--sidebar-w);min-width:0}
.content-wrap{display:flex;gap:40px;max-width:1180px;margin:0 auto;padding:44px 48px 80px}
.content{flex:1;min-width:0;max-width:820px}
.rail{width:var(--rail-w);flex-shrink:0;position:sticky;top:calc(var(--hdr-h) + 40px);align-self:flex-start;max-height:calc(100vh - var(--hdr-h) - 60px);overflow-y:auto;font-size:13px}
.rail-h{font-size:10.5px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--subtle);margin-bottom:10px}
.rail a{display:block;color:var(--muted);padding:5px 0 5px 12px;border-left:2px solid var(--border);line-height:1.4;text-decoration:none!important}
.rail a:hover{color:var(--text)}
.rail a.on{color:var(--accent2);border-left-color:var(--accent)}
.rail a.lvl3{padding-left:24px;font-size:12.5px}
.scrim{display:none}

/* ---------- chapter typography ---------- */
.ch-kicker{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;color:var(--accent2);margin-bottom:12px}
.ch-kicker .dot{width:4px;height:4px;border-radius:50%;background:var(--subtle)}
.ch-kicker .grp{color:var(--muted)}
.ch-title{font-family:var(--serif);font-size:40px;line-height:1.18;color:var(--head);font-weight:600;letter-spacing:-.3px;margin-bottom:14px}
.ch-sub{font-size:17.5px;color:var(--muted);line-height:1.6;margin-bottom:26px;max-width:700px}
.ch-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:34px;padding-bottom:26px;border-bottom:1px solid var(--border)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:99px;background:var(--surface2);border:1px solid var(--border);color:var(--muted)}
.pill b{color:var(--text);font-weight:600}
.content h2{font-family:var(--serif);font-size:27px;color:var(--head);font-weight:600;margin:52px 0 16px;line-height:1.3;scroll-margin-top:calc(var(--hdr-h) + 20px);letter-spacing:-.1px}
.content h3{font-size:19px;color:var(--head);font-weight:600;margin:34px 0 12px;scroll-margin-top:calc(var(--hdr-h) + 20px)}
.content h4.step-h{display:flex;align-items:center;gap:12px;font-size:16.5px;color:var(--head);font-weight:600;margin:32px 0 12px}
.step-badge{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;border-radius:8px;background:var(--accent-bg);border:1px solid var(--accent-line);color:var(--accent2);font-family:var(--mono);font-size:12.5px;font-weight:600;flex-shrink:0}
.content p{margin:0 0 16px}
.content ul,.content ol{margin:0 0 18px 22px}
.content li{margin-bottom:7px}
.content li::marker{color:var(--subtle)}
.content strong{color:var(--head);font-weight:600}
.content em{color:var(--text)}
.content hr{border:none;border-top:1px solid var(--border);margin:40px 0}
.content :not(pre)>code{font-family:var(--mono);font-size:.84em;background:var(--surface3);border:1px solid var(--border);color:#e4d9ff;padding:1.5px 6px;border-radius:5px;white-space:nowrap}
.content li :not(pre)>code,.content p :not(pre)>code{white-space:normal;word-break:break-word}
.content table{width:100%;border-collapse:collapse;margin:8px 0 24px;font-size:14px;display:block;overflow-x:auto}
.content th{text-align:left;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--border2);background:var(--surface);white-space:nowrap}
.content td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:top}
.content tr:last-child td{border-bottom:none}
.lead{font-size:17px;color:var(--text)}

/* ---------- code blocks ---------- */
.code{margin:18px 0 24px;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--code-bg)}
.code-head{display:flex;align-items:center;gap:10px;padding:0 8px 0 14px;height:40px;background:var(--code-head);border-bottom:1px solid var(--border)}
.code-dots{display:flex;gap:6px;margin-right:4px}
.code-dots i{width:9px;height:9px;border-radius:50%;background:var(--border2)}
.code-file{font-family:var(--mono);font-size:12.5px;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code-file.dim{color:var(--muted)}
.code-lang{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--subtle);padding:2px 7px;border:1px solid var(--border);border-radius:5px}
.copy-btn{background:none;border:1px solid transparent;color:var(--muted);height:28px;padding:0 9px;border-radius:7px;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:6px}
.copy-btn:hover{background:var(--surface3);color:var(--text);border-color:var(--border2)}
.copy-btn.ok{color:var(--green)}
.code pre{margin:0;padding:16px 18px;overflow-x:auto;font-family:var(--mono);font-size:13.3px;line-height:1.7;color:#cdd3ea;tab-size:2;background:transparent;border:none;scrollbar-width:thin;scrollbar-color:var(--border2) transparent}
.code pre code{font-family:inherit;background:none;border:none;padding:0;color:inherit;font-size:inherit;white-space:pre}
.code.term .code-head{background:#10121b}
.code.term pre{color:#d6dbee}
.code.tree pre{color:var(--muted)}
.t-kw{color:#c792ea}
.t-str{color:#a5e075}
.t-com{color:#5f6a8f;font-style:italic}
.t-num{color:#f5a97f}
.t-fn{color:#82aaff}
.t-type{color:#ffcb6b}
.t-tag{color:#ff7a93}
.t-attr{color:#f7c77e}
.t-deco{color:#89ddff}
.t-lit{color:#ff9e64}
.t-op{color:#89ddff}
.t-prompt{color:var(--accent2);user-select:none}
.t-out{color:#7e87a8}

/* ---------- callouts ---------- */
.callout{display:flex;gap:14px;margin:22px 0 26px;padding:16px 18px;border-radius:12px;border:1px solid var(--border);background:var(--surface);position:relative}
.callout::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.callout-ic{flex-shrink:0;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--accent-bg);color:var(--accent2)}
.callout-body{flex:1;min-width:0;font-size:14.8px}
.callout-t{font-weight:700;color:var(--head);font-size:14.5px;margin-bottom:4px}
.callout-body p:last-child,.callout-body ul:last-child,.callout-body ol:last-child,.callout-body .code:last-child{margin-bottom:0}
.callout-body .code{margin:12px 0}
.callout.tip::before{background:var(--green)}.callout.tip .callout-ic{background:var(--green-bg);color:var(--green)}
.callout.warn::before{background:var(--amber)}.callout.warn .callout-ic{background:var(--amber-bg);color:var(--amber)}
.callout.danger::before{background:var(--red)}.callout.danger .callout-ic{background:var(--red-bg);color:var(--red)}
.callout.tool::before{background:var(--blue)}.callout.tool .callout-ic{background:var(--blue-bg);color:var(--blue)}
.callout.recap{background:linear-gradient(135deg,rgba(139,123,255,.08),rgba(199,125,255,.05));border-color:var(--accent-line)}
.callout.recap::before{background:linear-gradient(var(--accent),var(--inertia))}
.callout.recap ul{list-style:none;margin-left:0}
.callout.recap li{position:relative;padding-left:24px}
.callout.recap li::before{content:'';position:absolute;left:2px;top:7px;width:12px;height:7px;border-left:2px solid var(--green);border-bottom:2px solid var(--green);transform:rotate(-45deg)}

/* ---------- figures, cards, grids ---------- */
.figure{margin:24px 0 30px;padding:22px;border:1px solid var(--border);border-radius:14px;background:var(--surface);overflow-x:auto}
.figure svg{display:block;max-width:100%;height:auto;margin:0 auto}
.figure figcaption{font-size:13px;color:var(--muted);text-align:center;margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:18px 0 26px}
.grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:640px){.grid.g2{grid-template-columns:1fr}}
.card{padding:16px 18px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
.card h5{font-size:14.5px;color:var(--head);margin-bottom:6px;font-weight:600;display:flex;align-items:center;gap:8px}
.card p{font-size:13.8px;color:var(--muted);margin:0;line-height:1.6}
.card .tag{font-family:var(--mono);font-size:10.5px;color:var(--accent2);background:var(--accent-bg);padding:1px 7px;border-radius:5px}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0 26px}
.compare>div{border:1px solid var(--border);border-radius:12px;padding:16px 18px;background:var(--surface)}
.compare h5{font-size:13px;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;color:var(--muted)}
.compare .good h5{color:var(--green)}.compare .bad h5{color:var(--red)}
.compare ul{margin:0 0 0 18px;font-size:14px}

/* ---------- chapter nav ---------- */
.pager{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:64px;padding-top:28px;border-top:1px solid var(--border)}
.pager a{display:block;padding:16px 18px;border:1px solid var(--border);border-radius:12px;background:var(--surface);text-decoration:none!important;transition:border-color .15s,transform .15s}
.pager a:hover{border-color:var(--accent-line);transform:translateY(-1px)}
.pager .pg-l{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:4px}
.pager .pg-t{color:var(--head);font-weight:600;font-size:15px;line-height:1.35}
.pager .next{text-align:right}
.pager .next .pg-l{justify-content:flex-end}
.pager .empty{visibility:hidden}
.kbd-hint{text-align:center;font-size:12px;color:var(--subtle);margin-top:18px}

/* ---------- search modal ---------- */
.sm-backdrop{position:fixed;inset:0;background:rgba(5,6,12,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:1000;display:none;align-items:flex-start;justify-content:center;padding-top:11vh}
.sm-backdrop.open{display:flex}
.sm{width:640px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--border2);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden;display:flex;flex-direction:column;max-height:74vh}
.sm-input-row{display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--border);height:58px;flex-shrink:0}
.sm-input-row svg{color:var(--accent2);flex-shrink:0}
.sm-input{flex:1;background:none;border:none;outline:none;color:var(--head);font-size:16.5px;font-family:var(--sans);min-width:0}
.sm-input::placeholder{color:var(--subtle)}
.sm-close{background:none;border:none;cursor:pointer;padding:0}
.sm-results{overflow-y:auto;padding:8px;flex:1}
.sm-sec{font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--subtle);padding:10px 10px 6px}
.sm-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;border:1px solid transparent}
.sm-item.sel{background:var(--accent-bg);border-color:var(--accent-line)}
.sm-ic{width:30px;height:30px;border-radius:8px;background:var(--surface2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0}
.sm-item.sel .sm-ic{color:var(--accent2);border-color:var(--accent-line)}
.sm-txt{flex:1;min-width:0}
.sm-title{color:var(--head);font-size:14.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm-title mark{background:none;color:var(--accent2);font-weight:700;text-decoration:underline;text-decoration-color:var(--accent-line);text-underline-offset:3px}
.sm-crumb{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm-go{color:var(--subtle);font-size:12px;opacity:0}
.sm-item.sel .sm-go{opacity:1}
.sm-empty{padding:36px 20px;text-align:center;color:var(--muted);font-size:14px}
.sm-empty b{color:var(--head)}
.sm-foot{display:flex;gap:16px;padding:10px 16px;border-top:1px solid var(--border);font-size:12px;color:var(--subtle);flex-shrink:0}
.sm-foot span{display:flex;align-items:center;gap:6px}
.sm-handle{display:none}
.flash-target{animation:flashbg 1.6s ease}
@keyframes flashbg{0%,30%{background:rgba(139,123,255,.18)}100%{background:transparent}}

/* ---------- responsive ---------- */
@media (max-width:1240px){.rail{display:none}.content-wrap{padding:40px 40px 80px}}
@media (max-width:960px){
  .menu-btn{display:flex}
  .sidebar{transform:translateX(-100%);transition:transform .25s ease;box-shadow:none}
  body.nav-open .sidebar{transform:none;box-shadow:20px 0 60px rgba(0,0,0,.5)}
  body.nav-open .scrim{display:block;position:fixed;inset:0;top:var(--hdr-h);background:rgba(0,0,0,.5);z-index:150}
  .main{margin-left:0}
  .search-trigger{min-width:0;width:40px;padding:0;justify-content:center}
  .search-trigger .st-label,.search-trigger kbd{display:none}
}
@media (max-width:640px){
  body{font-size:15px}
  .hdr{padding:0 12px;gap:10px}
  .brand-s{display:none}
  .content-wrap{padding:28px 16px 64px}
  .ch-title{font-size:30px}
  .ch-sub{font-size:16px}
  .content h2{font-size:23px;margin-top:42px}
  .code pre{font-size:12.3px;padding:14px}
  .compare{grid-template-columns:1fr}
  .pager{grid-template-columns:1fr}
  .callout{padding:14px;gap:10px}
  .callout-ic{display:none}
  .figure{padding:14px}
  .sm-backdrop{align-items:flex-end;padding-top:0}
  .sm{max-width:100vw;width:100vw;border-radius:18px 18px 0 0;max-height:86vh;border-bottom:none}
  .sm-handle{display:block;width:38px;height:4px;border-radius:99px;background:var(--border2);margin:8px auto 0}
  .sm-foot{display:none}
  .kbd-hint{display:none}
}

  /* ── HOME LINK (back to all tutorials) ── */
  .home-link {
    display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0;
    padding: 5px 10px;
    border: 1px solid rgba(128,128,128,0.35);
    border-radius: 8px;
    color: inherit; opacity: 0.7;
    font-size: 13px; line-height: 1.2;
    text-decoration: none; white-space: nowrap;
    transition: opacity 0.18s, border-color 0.18s;
  }
  .home-link:hover { opacity: 1; border-color: currentColor; }
  .home-link .hl-label { display: none; }
  @media (min-width: 600px) {
    .home-link .hl-label { display: inline; }
  }
  .home-link.hl-block { margin-bottom: 0.75rem; }
  .home-link.hl-block .hl-label { display: inline; }
</style>
</head>
<body>

<header class="hdr">
  <button class="menu-btn" id="menuBtn" aria-label="Toggle chapters">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>

<template id="tpl-welcome">
<p>This tutorial teaches <strong>AdonisJS</strong> and <strong>Inertia</strong> by building one real application from start to finish. You will not read a list of features and then try to remember them later. Every concept arrives exactly when the app needs it: you learn migrations when Kazi needs tables, transformers when React needs data, policies when a teammate should not be able to delete your project.</p>
<p>The app is called <strong>Kazi</strong> (Swahili for <em>work</em>). It is a small but complete task tracker for teams:</p>
<div class="grid g2">
<div class="card"><h5>Projects <span class="tag">CRUD</span></h5><p>Create, edit, archive and delete projects. Each project has an owner and a colour.</p></div>
<div class="card"><h5>Task board <span class="tag">Forms</span></h5><p>A three-column board (To do, Doing, Done). Quick-add tasks, change status, assign teammates.</p></div>
<div class="card"><h5>Teams <span class="tag">Auth</span></h5><p>Invite members by email. Owners manage the project, members work on tasks.</p></div>
<div class="card"><h5>Dashboard <span class="tag">Advanced</span></h5><p>Deferred stats, a searchable and paginated project list, and an infinite activity feed.</p></div>
</div>
<h2 id="welcome-why-adonisjs-inertia">Why AdonisJS + Inertia?</h2>
<p>Most Node.js stacks make you choose between two unsatisfying options. You can build a <strong>server-rendered app</strong> with templates, which is simple but feels dated once you need rich interactivity. Or you can build a <strong>separate SPA and a JSON API</strong>, which gives you React everywhere but doubles your work: two routers, API endpoints for every screen, client-side data fetching, loading states, auth tokens, CORS, and duplicated validation.</p>
<p>Inertia removes that choice. You write a classic server-side app — routes, controllers, sessions, redirects — but instead of returning HTML, each controller returns the <strong>name of a React component and its props</strong>. Inertia's client library then renders that component and turns every link click and form submission into a background <code>fetch</code> request. The result feels like a SPA while being built like a monolith.</p>
<div class="compare">
<div class="bad"><h5>Separate SPA + API</h5><ul><li>Client router and server router</li><li>An endpoint for every screen</li><li>Data fetching and loading states everywhere</li><li>Token auth, CORS, refresh logic</li></ul></div>
<div class="good"><h5>AdonisJS + Inertia</h5><ul><li>One router, on the server</li><li>Controllers pass props straight to pages</li><li>Session auth and CSRF work out of the box</li><li>Validation errors appear on the form automatically</li></ul></div>
</div>
<p><strong>AdonisJS</strong> is the backend half. It is a batteries-included, TypeScript-first framework in the spirit of Laravel and Rails: an ORM with migrations (Lucid), a validator (VineJS), authentication, authorization (Bouncer), sessions, a CLI (Ace), and a test runner (Japa) are all official packages that are designed to work together. Version 7 adds <strong>end-to-end type safety</strong>: the framework scans your code and generates TypeScript types so that React knows the exact shape of every prop and the name of every route.</p>

<p>Read the arrows as a conversation. The browser asks for a URL. AdonisJS runs the matching route through middleware, into a controller, which loads data with <strong>models</strong>, shapes it with <strong>transformers</strong>, and answers with a <em>page object</em>: the component to render and the props to give it. React renders that component. That is the whole loop — you will see it in every feature you build.</p>

<h2 id="welcome-what-you-need">What you need</h2>
<ul><li><strong>Node.js 24 or newer</strong> and <strong>npm 11 or newer</strong>. AdonisJS v7 relies on native Node 24 APIs and will refuse to install on older versions.</li><li>Comfortable <strong>TypeScript and React</strong> basics: components, props, hooks, <code>async/await</code>.</li><li>A code editor. VS Code with the official AdonisJS, Edge and Japa extensions gives you route and command autocompletion.</li></ul>
<p>You do <strong>not</strong> need prior AdonisJS experience, and you do not need to know Inertia. If you have used Laravel or Rails, many ideas will feel familiar; the tutorial points out the parallels as they come up.</p>
<div class="callout info"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/></svg></div><div class="callout-body"><div class="callout-t">The versions used here</div><p>This tutorial targets <strong>AdonisJS 7</strong> with <strong>Inertia 3</strong>, <strong>React 19</strong>, <strong>Lucid 22</strong> and <strong>VineJS 4</strong> — the stack the official React starter kit installs today. If you are maintaining an AdonisJS 6 app, most concepts carry over, but v7 changed how models declare columns, how Inertia shares data, and how routes are typed, so follow the v7 code here rather than older blog posts.</p></div></div>

<h2 id="setup-scaffold-kazi">Scaffold Kazi</h2>
<h4 class="step-h"><span class="step-badge">1</span><span>Run the initializer with the React kit</span></h4>
<pre data-lang="bash"><code>$ npm create adonisjs@latest kazi -- --kit=react</code></pre>
<div class="callout tool"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg></div><div class="callout-body"><div class="callout-t">npm create</div><p><code>npm create &lt;name&gt;</code> downloads and runs a package called <code>create-&lt;name&gt;</code> — here, <code>create-adonisjs</code>. The first <code>--</code> tells npm that the flags after it belong to the initializer, not to npm itself. <code>--kit=react</code> skips the interactive menu and picks the Inertia + React starter kit.</p></div></div>
<p>The initializer copies the kit, installs dependencies, generates an <code>APP_KEY</code> in <code>.env</code>, and runs the first migration so the <code>users</code> table already exists.</p>
<h4 class="step-h"><span class="step-badge">2</span><span>Start the development server</span></h4>
<pre data-lang="bash"><code>$ cd kazi
$ node ace serve --hmr</code></pre>
<p>Open <strong>http://localhost:3333</strong>. You should see the starter kit's welcome page. Visit <code>/signup</code>, create an account, and you will land on an empty dashboard. That is a complete auth flow you did not have to write.</p>
<div class="callout tool"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg></div><div class="callout-body"><div class="callout-t">node ace</div><p><code>ace</code> is AdonisJS's command-line tool. The <code>ace.js</code> file at the project root boots the framework in "console" mode, so <code>node ace &lt;command&gt;</code> can run framework commands such as starting the server, running migrations, or generating files. Run <code>node ace</code> on its own to list every available command.</p></div></div>
<p>The <code>--hmr</code> flag enables <strong>hot module replacement</strong>: when you save a server file, AdonisJS swaps the changed module in without restarting the process, and when you save a React file, Vite updates the browser without a full reload. The alternative, <code>--watch</code>, restarts the whole server on every change, which is slower but gives you a guaranteed clean state.</p>
<h2 id="setup-tour-the-project">Tour the project</h2>
<p>Here is the part of the tree you will actually touch while building Kazi.</p>
<pre data-lang="tree"><code>kazi/
├── adonisrc.ts               # framework manifest: providers, preloads, codegen hooks
├── ace.js                    # entrypoint for `node ace`
├── .env                      # secrets and environment-specific settings
├── .adonisjs/                # GENERATED types and barrels (never edit)
├── app/

│   ├── middleware/           # auth, guest, inertia (shared props) …
│   ├── models/               # Lucid models (user.ts to start)
│   ├── transformers/         # shape models into props for React

│   ├── migrations/           # table changes over time

│   ├── app.tsx               # client entrypoint (boots Inertia + React)
│   ├── ssr.tsx               # server-side rendering entrypoint

<p>A few files deserve a closer look now, because you will meet them again and again.</p>
<h3 id="setup-start-routes-ts">start/routes.ts</h3>
<p>This is the front door. Open it and you will find the starter kit's routes:</p>
<pre data-lang="ts" data-file="start/routes.ts"><code>import { middleware } from '#start/kernel'
import { controllers } from '#generated/controllers'
import router from '@adonisjs/core/services/router'

router.on('/').renderInertia('home', {}).as('home')

router
  .group(() =&gt; {
    router.get('signup', [controllers.NewAccount, 'create'])
    router.post('signup', [controllers.NewAccount, 'store'])

    router.get('login', [controllers.Session, 'create'])
    router.post('login', [controllers.Session, 'store'])
  })
  .use(middleware.guest())

router
  .group(() =&gt; {
    router.on('/dashboard').renderInertia('dashboard', {}).as('dashboard')
    router.post('logout', [controllers.Session, 'destroy'])
  })
  .use(middleware.auth())</code></pre>
<p>Already you can see the style of the whole framework: routes point at controller methods, groups apply middleware, and <code>renderInertia</code> renders a page without needing a controller at all. Chapter 8 covers all of this in depth.</p>
<h3 id="setup-import-aliases">Import aliases</h3>
<p>Notice imports like <code>#start/kernel</code> and <code>#generated/controllers</code>. These are <strong>Node.js subpath imports</strong>, declared in <code>package.json</code>. They replace fragile relative paths such as <code>../../app/models/user.js</code>.</p>
<pre data-lang="json" data-file="package.json (excerpt)"><code>{
  "imports": {
    "#controllers/*": "./app/controllers/*.js",
    "#models/*": "./app/models/*.js",
    "#transformers/*": "./app/transformers/*.js",
    "#validators/*": "./app/validators/*.js",
    "#policies/*": "./app/policies/*.js",
    "#middleware/*": "./app/middleware/*.js",
    "#generated/*": "./.adonisjs/server/*.js",
    "#database/*": "./database/*.js",
    "#start/*": "./start/*.js"
  }
}</code></pre>
<div class="callout info"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg></div><div class="callout-body"><div class="callout-t">Why <code>.js</code> when the files are <code>.ts</code>?</div><p>AdonisJS runs in native ES module mode. In ESM, import specifiers refer to the <em>output</em> file, so the alias maps to <code>.js</code> even while you write TypeScript. The dev server's TypeScript loader resolves it for you.</p></div></div>
<p>The React side has its own two aliases, defined in <code>vite.config.ts</code>: <code>~/</code> points at <code>inertia/</code>, and <code>@generated</code> points at <code>.adonisjs/client/</code> where the frontend types live.</p>
<pre data-lang="ts" data-file="vite.config.ts"><code>import { defineConfig } from 'vite'
import react from '@vitejs/plugin-react'
import adonisjs from '@adonisjs/vite/client'

export default defineConfig({
  plugins: [
    react(),
    adonisjs({ entryPoints: ['inertia/app.tsx'], reload: ['resources/views/**/*.edge'] }),
  ],
  resolve: {
    alias: {
      '~/': `${import.meta.dirname}/inertia/`,
      '@generated': `${import.meta.dirname}/.adonisjs/client/`,
    },
  },
})</code></pre>
<h3 id="setup-env-and-start-env-ts">.env and start/env.ts</h3>
<p>Environment variables live in <code>.env</code>. AdonisJS validates them at boot in <code>start/env.ts</code>, so a missing <code>APP_KEY</code> fails loudly at startup instead of mysteriously in production.</p>
<pre data-lang="env" data-file=".env"><code>TZ=UTC
PORT=3333
HOST=localhost
NODE_ENV=development
LOG_LEVEL=info
APP_KEY=generated-by-the-initializer
APP_URL=http://${HOST}:${PORT}
SESSION_DRIVER=cookie</code></pre>
<div class="callout warn"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg></div><div class="callout-body"><div class="callout-t">Never commit .env</div><p><code>APP_KEY</code> signs your session cookies and encrypts data. Anyone with it can forge sessions. The kit's <code>.gitignore</code> already excludes <code>.env</code>; commit <code>.env.example</code> instead, with placeholder values.</p></div></div>

<template id="tpl-lifecycle">
<p>Before writing features, it is worth understanding what happens between a click and a rendered page. When something goes wrong later — a prop is missing, a redirect loops, a page renders twice — this chapter is the map you debug with.</p>
<h2 id="lifecycle-the-http-context">The HTTP context</h2>
<p>Every request in AdonisJS gets one object: the <strong>HTTP context</strong>, usually destructured in controller signatures. It carries everything about the current request and the services bound to it.</p>
<pre data-lang="ts" data-file="app/controllers/example_controller.ts"><code>import type { HttpContext } from '@adonisjs/core/http'

export default class ExampleController {
  async show({ request, response, params, session, auth, inertia, logger }: HttpContext) {
    request.input('page', 1)        // body or query-string value, with a default
    params.id                       // route parameter from /things/:id
    auth.user                       // logged-in user (or undefined)
    session.flash('success', 'Hi')  // one-time message for the next request
    logger.info('rendering show')   // request-scoped logger
    return inertia.render('things/show', {})
  }
}</code></pre>
<p>Middleware and packages add properties to it: the session middleware adds <code>session</code>, the auth package adds <code>auth</code>, the Inertia package adds <code>inertia</code>, and later in this tutorial Bouncer will add <code>bouncer</code>. That is why the kit's middleware order matters.</p>
<h2 id="lifecycle-middleware-two-stacks">Middleware: two stacks</h2>
<p>Open <code>start/kernel.ts</code>. AdonisJS registers middleware in two places.</p>
<pre data-lang="ts" data-file="start/kernel.ts"><code>server.use([
  () =&gt; import('#middleware/container_bindings_middleware'),
  () =&gt; import('@adonisjs/static/static_middleware'),
  () =&gt; import('@adonisjs/cors/cors_middleware'),
  () =&gt; import('@adonisjs/vite/vite_middleware'),
  () =&gt; import('#middleware/inertia_middleware'),
])

router.use([
  () =&gt; import('@adonisjs/core/bodyparser_middleware'),
  () =&gt; import('@adonisjs/session/session_middleware'),
  () =&gt; import('@adonisjs/shield/shield_middleware'),
  () =&gt; import('@adonisjs/auth/initialize_auth_middleware'),
  () =&gt; import('#middleware/silent_auth_middleware'),
])

export const middleware = router.named({
  guest: () =&gt; import('#middleware/guest_middleware'),
  auth: () =&gt; import('#middleware/auth_middleware'),
})</code></pre>
<ul><li><strong>Server middleware</strong> runs on <em>every</em> request, even for URLs with no route (a 404). Static files, Vite and Inertia live here because a 404 page is still rendered through Inertia.</li><li><strong>Router middleware</strong> runs only when a route matched: body parsing, sessions, CSRF protection (Shield), and auth initialization.</li><li><strong>Named middleware</strong> runs only where you attach it, like <code>.use(middleware.auth())</code> on a route group.</li></ul>
<p>Each middleware entry is a lazy <code>import()</code>. AdonisJS only loads a middleware file the first time it is needed, which keeps boot fast.</p>
<div class="callout info"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/></svg></div><div class="callout-body"><div class="callout-t">silent_auth vs auth</div><p><code>silent_auth_middleware</code> runs on every routed request and calls <code>auth.check()</code>. It never blocks anyone; it just figures out <em>whether</em> someone is logged in, so <code>auth.user</code> is available on public pages too. The named <code>auth</code> middleware, by contrast, redirects guests to <code>/login</code>.</p></div></div>
<h2 id="lifecycle-two-kinds-of-visit">Two kinds of visit</h2>
<p>Inertia answers the same URL in two different ways, depending on who is asking.</p>

<h3 id="lifecycle-the-first-visit">The first visit</h3>
<p>When you type a URL or refresh, the browser makes a normal document request. There is no React app yet, so AdonisJS must send HTML. It renders the root Edge template configured in <code>config/inertia.ts</code> — <code>resources/views/inertia_layout.edge</code>:</p>
<pre data-lang="edge" data-file="resources/views/inertia_layout.edge"><code>&lt;!DOCTYPE html&gt;
&lt;html&gt;
  &lt;head&gt;
    &lt;meta charset="utf-8" /&gt;
    &lt;meta name="viewport" content="width=device-width, initial-scale=1" /&gt;
    &lt;title data-inertia&gt;AdonisJS&lt;/title&gt;

    @viteReactRefresh()
    @vite(['inertia/app.tsx'])
    @inertiaHead()
  &lt;/head&gt;
  &lt;body&gt;
    @inertia()
  &lt;/body&gt;
&lt;/html&gt;</code></pre>
<p>The <code>@inertia()</code> tag prints two things: a <code>&lt;script type="application/json"&gt;</code> holding the <strong>page object</strong>, and an empty <code>&lt;div id="app"&gt;</code> for React to mount into. <code>@vite</code> injects your bundle. When the bundle loads, <code>inertia/app.tsx</code> reads the page object and boots React:</p>
<pre data-lang="tsx" data-file="inertia/app.tsx"><code>import './css/app.css'
import { client } from './client'
import { createRoot } from 'react-dom/client'
import { TuyauProvider } from '@adonisjs/inertia/react'
import { resolvePageComponent } from '@adonisjs/inertia/helpers'
import { createInertiaApp, type ResolvedComponent } from '@inertiajs/react'

const appName = import.meta.env.VITE_APP_NAME || 'AdonisJS'

createInertiaApp({
  title: (title) =&gt; (title ? `${title} - ${appName}` : appName),
  resolve: async (name) =&gt; {
    const page = await resolvePageComponent(
      `./pages/${name}.tsx`,
      import.meta.glob&lt;{ default: ResolvedComponent }&gt;('./pages/**/*.tsx')
    )
    return page.default
  },
  setup({ el, App, props }) {
    createRoot(el).render(
      &lt;TuyauProvider client={client}&gt;
        &lt;App {...props} /&gt;
      &lt;/TuyauProvider&gt;
    )
  },
  progress: { color: '#4B5563' },
})</code></pre>
<p>The <code>resolve</code> function is the bridge between the server's string <code>'projects/index'</code> and the file <code>inertia/pages/projects/index.tsx</code>. <code>import.meta.glob</code> tells Vite to code-split every page into its own chunk, loaded on demand.</p>
<h3 id="lifecycle-every-visit-after-that">Every visit after that</h3>
<p>Once React is running, Inertia intercepts clicks on its <code>Link</code> component and submissions of its <code>Form</code> component. Instead of letting the browser navigate, it sends a <code>fetch</code> request with the header <code>X-Inertia: true</code>. AdonisJS runs the <strong>same route, middleware and controller</strong>, sees the header, and skips the Edge template entirely. It answers with JSON:</p>
<pre data-lang="json" data-file="Response to GET /projects (X-Inertia: true)"><code>{
  "component": "projects/index",
  "props": {
    "user": { "id": 1, "fullName": "Jane Wanjiku", "initials": "JW" },
    "errors": {},
    "projects": [
      { "id": 3, "name": "Website relaunch", "color": "violet" }
    ]
  },
  "url": "/projects",
  "version": "b7a2c1e0"
}</code></pre>
<p>The client swaps the rendered component, pushes <code>/projects</code> onto the browser history, and restores or resets scroll. No full reload, no API to design.</p>
<div class="callout tip"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></div><div class="callout-body"><div class="callout-t">See it for yourself</div><p>Open your browser's DevTools Network tab, filter by <em>Fetch/XHR</em>, and click between pages once Kazi has a few. Each click is one request whose response is exactly this page object.</p></div></div>
<h2 id="lifecycle-where-version-fits">Where <code>version</code> fits</h2>
<p>The <code>version</code> field is a hash of your built assets. If you deploy new JavaScript while someone has the app open, their next Inertia request carries the old version. AdonisJS notices the mismatch and tells the client to do a full reload, so users never run stale code against a new server. You get this for free.</p>
<div class="callout recap"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div><div class="callout-body"><div class="callout-t">What you built in this chapter</div><ul><li>Know what the HTTP context is and what each property gives you.</li><li>Understand server middleware, router middleware and named middleware.</li><li>Can explain the difference between the first visit (HTML) and later visits (JSON page object).</li><li>Know how <code>inertia/app.tsx</code> maps a component name to a page file.</li></ul></div></div>
</template>
<template id="tpl-ace-codegen">
<p>AdonisJS leans on its CLI far more than most Node frameworks. Almost every file you create in this tutorial starts with a <code>node ace make:*</code> command, and the dev server continuously generates TypeScript types behind the scenes. Understanding both will save you a lot of confusion.</p>
<h2 id="ace-codegen-generators">Generators</h2>
<p>Ace generators create files in the right folder, with the right naming convention and a working skeleton. These are the ones you will use:</p>
<table><thead><tr><th>Command</th><th>Creates</th></tr></thead><tbody><tr><td><code>node ace make:model Project -m</code></td><td><code>app/models/project.ts</code> + a migration</td></tr><tr><td><code>node ace make:migration add_color_to_projects</code></td><td>a standalone migration</td></tr><tr><td><code>node ace make:controller projects</code></td><td><code>app/controllers/projects_controller.ts</code></td></tr><tr><td><code>node ace make:transformer project</code></td><td><code>app/transformers/project_transformer.ts</code></td></tr><tr><td><code>node ace make:validator project</code></td><td><code>app/validators/project.ts</code></td></tr><tr><td><code>node ace make:page projects/index</code></td><td><code>inertia/pages/projects/index.tsx</code></td></tr><tr><td><code>node ace make:policy project</code></td><td><code>app/policies/project_policy.ts</code></td></tr><tr><td><code>node ace make:factory Project</code></td><td><code>database/factories/project_factory.ts</code></td></tr><tr><td><code>node ace make:seeder MainSeeder</code></td><td><code>database/seeders/main_seeder.ts</code></td></tr><tr><td><code>node ace make:test projects --suite=browser</code></td><td><code>tests/browser/projects.spec.ts</code></td></tr></tbody></table>
<p>Conventions matter: file names are <code>snake_case</code>, class names are <code>PascalCase</code>, and controllers are plural. You can pass a name in any case and Ace normalizes it.</p>
<p>Other commands you will run often:</p>
<pre data-lang="bash"><code>$ node ace list:routes          # every route, its name, handler and middleware
$ node ace migration:run        # apply pending migrations
$ node ace migration:rollback   # undo the last batch
$ node ace migration:fresh --seed  # drop everything, migrate, then seed
$ node ace db:seed              # run seeders
$ node ace repl                 # interactive shell inside your app</code></pre>
<h2 id="ace-codegen-the-repl">The REPL</h2>
<p>The REPL is a Node.js shell with your application booted inside it. It is the fastest way to try a query or check what a model returns.</p>
<pre data-lang="bash"><code>$ node ace repl
&gt; await loadModels()
&gt; await models.user.all()
&gt; const jane = await models.user.findBy('email', 'jane@kazi.test')
&gt; jane.initials
'JW'
&gt; .exit</code></pre>
<p><code>loadModels()</code> imports every file in <code>app/models</code> and exposes them as <code>models.&lt;camelCaseName&gt;</code>. You will use this in chapter 7 to explore Kazi's data.</p>
<h2 id="ace-codegen-code-generation-where-the-types-come-from">Code generation: where the types come from</h2>
<p>AdonisJS 7's headline feature is end-to-end type safety. You write a transformer on the server, and React immediately knows the exact shape of the props. You rename a route, and every <code>Link</code> pointing to it turns red in your editor. None of this is magic — the dev server <strong>scans your code and writes TypeScript files</strong> into <code>.adonisjs/</code>.</p>
<p>The scanners are registered as hooks in <code>adonisrc.ts</code>:</p>
<pre data-lang="ts" data-file="adonisrc.ts (excerpt)"><code>import { indexPages } from '@adonisjs/inertia'
import { indexEntities } from '@adonisjs/core/generators'
import { defineConfig } from '@adonisjs/core/app'
import { generateRegistry } from '@tuyau/core/hooks'

export default defineConfig({
  hooks: {
    init: [
      indexEntities({
        transformers: { enabled: true, withSharedProps: true },
      }),
      indexPages({ framework: 'react' }),
      generateRegistry(),
    ],
    buildStarting: [() =&gt; import('@adonisjs/vite/build_hook')],
  },
})</code></pre>
<p>Each hook produces a different kind of generated file:</p>
<div class="grid">
<div class="card"><h5><code>indexEntities</code></h5><p>Writes <code>.adonisjs/server/controllers.ts</code> (the <code>controllers</code> barrel used in routes) and <code>.adonisjs/client/data.d.ts</code> (the <code>Data.*</code> types generated from transformers).</p></div>
<div class="card"><h5><code>indexPages</code></h5><p>Lists every file in <code>inertia/pages</code> so <code>inertia.render('...')</code> only accepts real page names, and checks the props you pass.</p></div>
<div class="card"><h5><code>generateRegistry</code></h5><p>Tuyau's route registry. It powers type-safe <code>route</code> props on <code>Link</code> and <code>Form</code>, and the <code>urlFor</code> helper in <code>inertia/client.ts</code>.</p></div>
</div>
<div class="callout warn"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg></div><div class="callout-body"><div class="callout-t">Keep the dev server running</div><p>The generated files are refreshed by the running dev server. If you create a controller while the server is stopped, <code>controllers.Projects</code> will not exist yet and TypeScript will complain. Start <code>node ace serve --hmr</code> and the error disappears within a second. When in doubt about stale types, restart the dev server.</p></div></div>
<div class="callout info"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg></div><div class="callout-body"><div class="callout-t">Should .adonisjs be in git?</div><p>No. It is regenerated on every start and build, and the starter kit's <code>.gitignore</code> already excludes it. Treat it like <code>node_modules</code>.</p></div></div>
<h2 id="ace-codegen-barrel-files-in-practice">Barrel files in practice</h2>
<p>In routes you never import controllers directly. You use the generated barrel:</p>
<pre data-lang="ts" data-file="start/routes.ts"><code>import { controllers } from '#generated/controllers'

router.get('/projects', [controllers.Projects, 'index'])</code></pre>
<p><code>controllers.Projects</code> is a lazy reference to <code>app/controllers/projects_controller.ts</code>. It gives you two things at once: the controller file is only loaded when the route is first hit (fast boot, fast HMR), and TypeScript checks that <code>'index'</code> is a real method on that controller.</p>
<div class="callout recap"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div><div class="callout-body"><div class="callout-t">What you built in this chapter</div><ul><li>Know the <code>make:*</code> generators and the everyday Ace commands.</li><li>Can open the REPL and query models with <code>loadModels()</code>.</li><li>Understand the three codegen hooks and which types each produces.</li><li>Know why the dev server must be running while you add controllers, transformers and pages.</li></ul></div></div>
</template>
<template id="tpl-migrations">
<p>Kazi needs somewhere to store projects, tasks, team members and comments. In AdonisJS, the database structure is described by <strong>migrations</strong> — small, versioned TypeScript files that create and change tables. Lucid, the official ORM, runs them in order and records which ones have already run.</p>
<h2 id="migrations-the-data-model">The data model</h2>
<p>Before touching code, sketch the tables. Kazi has five.</p>
