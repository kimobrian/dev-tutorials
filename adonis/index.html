<h3 id="search-pagination-why-these-visit-options">Why these visit options?</h3>
<p>The search uses Inertia's plain <code>router.get(url, data, options)</code>: for <code>GET</code> visits, the <code>data</code> object becomes the query string. The options matter:</p>
<ul><li><strong><code>preserveState: true</code></strong> — keep the page component mounted, so the input keeps focus and the cursor position while results update. Without it, the component would remount and the user would lose their place mid-word.</li><li><strong><code>replace: true</code></strong> — replace the current history entry instead of pushing a new one. Otherwise typing "website" would leave seven history entries, and Back would step through "w", "we", "web"…</li><li><strong><code>only: ['projects', 'filters']</code></strong> — a partial reload: the server only resolves these two props. The next chapter explains this in depth.</li></ul>
<p>Passing <code>q: undefined</code> when the box is empty drops the key from the URL entirely, which keeps URLs clean.</p>
<div class="callout tip"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></div><div class="callout-body"><div class="callout-t">Reset the page when filters change</div><p>Notice the search visit does not send <code>page</code>. If you are on page 4 and type a new query, you land on page 1 of the new results — anything else would show an empty page. Tabs do the same. Only the pagination links carry <code>page</code>.</p></div></div>
<div class="callout warn"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg></div><div class="callout-body"><div class="callout-t">Keep useRef's first-render guard</div><p>The effect runs once on mount with the initial <code>q</code>. Without the <code>firstRender</code> guard, every visit to <code>/projects</code> would immediately fire a second, redundant request. Small details like this are the difference between a snappy app and a chatty one.</p></div></div>
<div class="callout recap"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div><div class="callout-body"><div class="callout-t">What you built in this chapter</div><ul><li>Validated query-string filters and got type-checked <code>qs</code> props for free.</li><li>Paginated with <code>.paginate()</code> and serialized with <code>Transformer.paginate()</code>.</li><li>Built a debounced search using <code>router.get</code> with <code>preserveState</code>, <code>replace</code> and <code>only</code>.</li><li>Built tabs and pagination links that keep filters in the URL.</li></ul></div></div>
</template>
<template id="tpl-partial-reloads">
<p>Every Inertia visit re-runs the controller and returns <em>all</em> of the page's props. Usually that is fine — it is what keeps the architecture simple. But a board with many tasks, members and counts does not need to rebuild everything when one card moves. <strong>Partial reloads</strong> let the client ask for just the props it needs, and the server skip the rest.</p>
<h2 id="partial-reloads-how-a-partial-reload-works">How a partial reload works</h2>
<p>When a visit includes <code>only: ['tasks']</code>, Inertia adds two headers to the request: the current component name and the list of requested props. The server runs the same controller, but when it builds the response it <strong>only resolves the requested props</strong> (plus any marked <code>always</code>). Props defined as plain values are still computed in your controller code; props wrapped in a function are skipped entirely — which is where the savings come from.</p>
<div class="compare">
<div class="bad"><h5>Full reload after a status change</h5><ul><li>Re-query project, owner, members</li><li>Re-run 3 permission checks</li><li>Re-query and serialize every task</li><li>Recompute shared data</li></ul></div>
<div class="good"><h5>Partial reload with only: ['tasks']</h5><ul><li>Resolve <code>tasks</code></li><li>Resolve <code>always</code> props (errors, user, badge)</li><li>Skip everything else</li></ul></div>
</div>
<p>To get the full benefit, wrap expensive props in functions so they are lazy. Here is the <code>show</code> action restructured for that:</p>
<pre data-lang="ts" data-file="app/controllers/projects_controller.ts (show, replace)"><code>  async show({ inertia, params, auth, request }: HttpContext) {
    const user = auth.getUserOrFail()
    const onlyMine = request.input('assignee') === 'me'

    const project = await Project.findVisibleOrFail(params.id, user)

    return inertia.render('projects/show', {
      project: async () =&gt; {
        await project.load('owner')
        await project.load('members')
        return ProjectTransformer.transform(project).useVariant('forBoard')
      },

      tasks: async () =&gt; {
        const tasks = await project
          .related('tasks')
          .query()
          .if(onlyMine, (query) =&gt; query.where('assignee_id', user.id))
          .preload('assignee')
          .orderBy('created_at', 'desc')
        return TaskTransformer.transform(tasks)
      },

      filters: { assignee: onlyMine ? 'me' : 'all' },
    })
  }</code></pre>
<p>Each prop is now a function. On a normal visit Inertia calls them all. On <code>only: ['tasks']</code>, it calls only <code>tasks</code> — the project, owner, members and policy checks are skipped. The project itself is still loaded once up front, because every prop depends on it and it doubles as the access check.</p>
<h2 id="partial-reloads-moving-tasks-between-columns">Moving tasks between columns</h2>
<h4 class="step-h"><span class="step-badge">1</span><span>A dedicated controller</span></h4>
<p>Changing status is its own action with its own validator, so it gets its own small controller:</p>
<pre data-lang="bash"><code>$ node ace make:controller task_status</code></pre>
<pre data-lang="ts" data-file="app/controllers/task_status_controller.ts"><code>import Task from '#models/task'
import Project from '#models/project'
import type { HttpContext } from '@adonisjs/core/http'
import { taskStatusValidator } from '#validators/task'

export default class TaskStatusController {
  /**
   * PATCH /tasks/:id/status
   */
  async update({ params, request, response, auth }: HttpContext) {
    const task = await Task.findOrFail(params.id)
    await Project.findVisibleOrFail(task.projectId, auth.getUserOrFail())

    const { status } = await request.validateUsing(taskStatusValidator)
    await task.moveTo(status).save()

    return response.redirect().back()
  }
}</code></pre>
<pre data-lang="ts" data-file="start/routes.ts (inside the auth group)"><code>router
  .patch('/tasks/:id/status', [controllers.TaskStatus, 'update'])
  .where('id', router.matchers.number())</code></pre>
<p>The route name is <code>task_status.update</code>. <code>moveTo()</code> from chapter 6 keeps <code>completedAt</code> correct — the controller does not need to know that rule exists.</p>
<div class="callout info"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/></svg></div><div class="callout-body"><div class="callout-t">Resource thinking</div><p>Rather than adding a <code>changeStatus</code> method to <code>TasksController</code>, we treated "a task's status" as a small resource with its own <code>update</code>. That keeps each controller to the standard verbs (<code>index</code>, <code>show</code>, <code>create</code>, <code>store</code>, <code>edit</code>, <code>update</code>, <code>destroy</code>) and gives the route a predictable name. When a controller starts growing custom verbs, this is usually the fix.</p></div></div>
<h4 class="step-h"><span class="step-badge">2</span><span>Move buttons on the card</span></h4>
<pre data-lang="tsx" data-file="inertia/components/task_card.tsx"><code>import type { MouseEvent } from 'react'
import { Link, useRouter } from '@adonisjs/inertia/react'
import type { Data } from '@generated/data'

const NEXT: Record&lt;Data.Task['status'], Data.Task['status'] | null&gt; = {
  todo: 'doing',
  doing: 'done',
  done: null,
}
const PREV: Record&lt;Data.Task['status'], Data.Task['status'] | null&gt; = {
  todo: null,
  doing: 'todo',
  done: 'doing',
}

export function formatDate(iso: string | null) {
  if (!iso) return null
  return new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })
}

export default function TaskCard({ task }: { task: Data.Task }) {
  const router = useRouter()

  function move(event: MouseEvent, status: Data.Task['status'] | null) {
    event.preventDefault() // don't also follow the card's Link
    if (!status) return
    router.patch(
      { route: 'task_status.update', routeParams: { id: task.id } },
      { status },
      { preserveScroll: true, only: ['tasks'] }
    )
  }

  return (
    &lt;Link route="tasks.show" routeParams={{ id: task.id }} className="task-card"&gt;
      &lt;div&gt;{task.title}&lt;/div&gt;
      &lt;div className="task-card__meta"&gt;
        {task.priority === 'high' &amp;&amp; &lt;span className="badge badge--high"&gt;High&lt;/span&gt;}
        {task.isOverdue &amp;&amp; &lt;span className="badge badge--overdue"&gt;Overdue&lt;/span&gt;}
        {task.dueOn &amp;&amp; &lt;span&gt;Due {formatDate(task.dueOn)}&lt;/span&gt;}
        {task.assignee &amp;&amp; &lt;span className="avatar"&gt;{task.assignee.initials}&lt;/span&gt;}

        &lt;span style={{ marginLeft: 'auto', display: 'flex', gap: 4 }}&gt;
          {PREV[task.status] &amp;&amp; (
            &lt;button type="button" className="btn btn--ghost btn--sm" aria-label="Move back"
              onClick={(event) =&gt; move(event, PREV[task.status])}&gt;
              ←
            &lt;/button&gt;
          )}
          {NEXT[task.status] &amp;&amp; (
            &lt;button type="button" className="btn btn--ghost btn--sm" aria-label="Move forward"
              onClick={(event) =&gt; move(event, NEXT[task.status])}&gt;
              →
            &lt;/button&gt;
          )}
        &lt;/span&gt;
      &lt;/div&gt;
    &lt;/Link&gt;
  )
}</code></pre>
<p><code>useRouter().patch(target, data, options)</code> is the AdonisJS router from chapter 11: the target is a route name plus params, so the URL and the <code>PATCH</code> verb both come from the route registry, and TypeScript checks that <code>task_status.update</code> really is a <code>PATCH</code> route whose body accepts <code>status</code>. The third argument is passed straight to Inertia.</p>
<p>The controller redirects back to the board. Because the visit carries <code>only: ['tasks']</code>, the redirected <code>GET</code> is a partial reload of the same page component: the server resolves just the task list, and React re-renders the columns. The <code>openTaskCount</code> badge updates too, because you shared it with <code>always()</code> in chapter 15. The <code>event.preventDefault()</code> in <code>move</code> stops the button click from also following the card's <code>Link</code>.</p>
<h2 id="partial-reloads-filtering-the-board">Filtering the board</h2>
<p>The <code>show</code> action already understands <code>?assignee=me</code>. Add a toggle to the board that asks for just the tasks:</p>
<pre data-lang="tsx" data-file="inertia/pages/projects/show.tsx (additions)"><code>import { useRouter } from '@adonisjs/inertia/react'

<p>The URL updates to <code>/projects/3?assignee=me</code>, so the filtered board is bookmarkable, but only the task list and filter state travel over the wire.</p>
<h2 id="partial-reloads-optional-props-data-that-loads-on-demand">Optional props: data that loads on demand</h2>
<p>Some data is expensive and rarely needed. Kazi's board gets an <strong>Insights</strong> panel — per-person workload and overdue counts — that most visitors never open. An <strong>optional</strong> prop is never computed on a normal visit; it is only resolved when a partial reload explicitly asks for it.</p>

<p>On the client, request it when the panel opens:</p>
<pre data-lang="tsx" data-file="inertia/components/insights_panel.tsx"><code>import { useState } from 'react'
import { router } from '@inertiajs/react'

type Insights = { workload: { name: string; open: number }[]; overdue: number }

export default function InsightsPanel({ insights }: { insights?: Insights }) {
  const [loading, setLoading] = useState(false)

  function load() {
    router.reload({
      only: ['insights'],
      onStart: () =&gt; setLoading(true),
      onFinish: () =&gt; setLoading(false),
    })
  }

  if (!insights) {
    return (
      &lt;button className="btn btn--secondary btn--sm" onClick={load} disabled={loading}&gt;
        {loading ? 'Crunching numbers…' : 'Show insights'}
      &lt;/button&gt;
    )
  }

  return (
    &lt;aside className="board__col"&gt;
      &lt;header&gt;&lt;span&gt;Insights&lt;/span&gt;&lt;span&gt;{insights.overdue} overdue&lt;/span&gt;&lt;/header&gt;
      {insights.workload.map((row) =&gt; (
        &lt;div key={row.name} className="task-card__meta"&gt;
          {row.name}: {row.open} open
        &lt;/div&gt;
      ))}
    &lt;/aside&gt;
  )
}</code></pre>
<p>Add <code>insights?: Insights</code> to the page's prop type and render <code>&lt;InsightsPanel insights={insights} /&gt;</code>. <code>router.reload()</code> re-visits the current URL (keeping the query string) with the given options; <code>onStart</code> and <code>onFinish</code> are visit callbacks, perfect for a local loading state.</p>
<h2 id="partial-reloads-always-props">Always props</h2>
<p><code>always()</code> is the opposite of <code>optional()</code>: the prop is included in <strong>every</strong> response, even partial reloads that did not ask for it. You already use it in the Inertia middleware for <code>errors</code>, <code>user</code> and <code>openTaskCount</code>. Use it on a page prop when a value must stay in sync with any change on the page — for example, the board's permission flags if they could change after a mutation:</p>
<pre data-lang="ts"><code>canAddTasks: inertia.always(project.status === 'active'),</code></pre>
<h2 id="partial-reloads-choosing-a-prop-helper">Choosing a prop helper</h2>
<table><thead><tr><th>Helper</th><th>Normal visit</th><th>Partial reload that asks for it</th><th>Partial reload that doesn't</th></tr></thead><tbody><tr><td>plain value / function</td><td>✅ resolved</td><td>✅ resolved</td><td>❌ skipped</td></tr><tr><td><code>inertia.optional(fn)</code></td><td>❌ skipped</td><td>✅ resolved</td><td>❌ skipped</td></tr><tr><td><code>inertia.always(value)</code></td><td>✅ resolved</td><td>✅ resolved</td><td>✅ resolved</td></tr></tbody></table>
<p>The client side has one more option: <code>except: ['members']</code> is the inverse of <code>only</code>, resolving everything <em>but</em> the listed props.</p>
<div class="callout warn"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg></div><div class="callout-body"><div class="callout-t">Helpers only work at the top level</div><p>Prop helpers like <code>optional</code>, <code>always</code> and <code>defer</code> are detected only on top-level keys. <code>{ stats: { views: inertia.optional(...) } }</code> will not work; give each wrapped value its own top-level key.</p></div></div>
<div class="callout recap"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div><div class="callout-body"><div class="callout-t">What you built in this chapter</div><ul><li>Understand what a partial reload sends and what the server skips.</li><li>Made board props lazy with functions so partial reloads are genuinely cheaper.</li><li>Moved tasks with <code>useRouter().patch</code> + <code>only: ['tasks']</code> through a <code>TaskStatusController</code>.</li><li>Filtered the board with a bookmarkable partial <code>GET</code>.</li><li>Loaded an insights panel on demand with <code>inertia.optional</code> and <code>router.reload</code>.</li><li>Know when to use <code>always</code>, <code>optional</code> and <code>except</code>.</li></ul></div></div>
</template>
<template id="tpl-deferred">
<p>The dashboard is the first thing people see after logging in, and it has two kinds of data. <em>My open tasks</em> is quick to fetch and is what people came for. <em>Statistics across every project</em> is slower and nice-to-have. Making the whole page wait for the slow part would be a poor trade. <strong>Deferred props</strong> let the page render immediately with the fast data, then fetch the slow data in a follow-up request automatically.</p>
<h2 id="deferred-a-stats-service">A stats service</h2>
<p>Put the statistics logic in a service class so the controller stays thin and the logic is testable on its own.</p>
<pre data-lang="ts" data-file="app/services/stats_service.ts"><code>import db from '@adonisjs/lucid/services/db'
import Project from '#models/project'
import User from '#models/user'

export default class StatsService {
  async visibleProjectIds(user: User) {
    const projects = await Project.query()
      .withScopes((scopes) =&gt; scopes.visibleTo(user))
      .select('id')
    return projects.map((project) =&gt; project.id)
  }

  async forUser(user: User) {
    const ids = await this.visibleProjectIds(user)
    if (ids.length === 0) {
      return { total: 0, todo: 0, doing: 0, done: 0, overdue: 0, completion: 0 }
    }

    const byStatus = await db
      .from('tasks')
      .whereIn('project_id', ids)
      .groupBy('status')
      .select('status')
      .count('* as total')

    const counts = { todo: 0, doing: 0, done: 0 }
    for (const row of byStatus) counts[row.status as keyof typeof counts] = Number(row.total)

    const today = new Date().toISOString().slice(0, 10)
    const overdue = await db
      .from('tasks')
      .whereIn('project_id', ids)
      .whereNot('status', 'done')
      .where('due_on', '&lt;', today)
      .count('* as total')
      .first()

    const total = counts.todo + counts.doing + counts.done
    return {
      total,
      ...counts,
      overdue: Number(overdue?.total ?? 0),
      completion: total ? Math.round((counts.done / total) * 100) : 0,
    }
  }

  async teammates(user: User) {
    const ids = await this.visibleProjectIds(user)
    return User.query()
      .whereNot('id', user.id)
      .where((query) =&gt; {
        query
          .whereIn('id', (sub) =&gt; sub.from('project_members').whereIn('project_id', ids).select('user_id'))
          .orWhereIn('id', (sub) =&gt; sub.from('projects').whereIn('id', ids).select('user_id'))
      })
      .orderBy('full_name')
  }
}</code></pre>
<p><code>due_on</code> is a <code>date</code> column, and dates compare correctly as <code>YYYY-MM-DD</code> strings in both SQLite and PostgreSQL. The <code>teammates</code> query uses callback subqueries: anyone who is a member of, or owns, a project you can see.</p>
<h2 id="deferred-the-controller">The controller</h2>
<pre data-lang="bash"><code>$ node ace make:controller dashboard</code></pre>
<pre data-lang="ts" data-file="app/controllers/dashboard_controller.ts"><code>import Task from '#models/task'
import { inject } from '@adonisjs/core'
import type { HttpContext } from '@adonisjs/core/http'
import StatsService from '#services/stats_service'
import TaskTransformer from '#transformers/task_transformer'
import UserTransformer from '#transformers/user_transformer'

@inject()
export default class DashboardController {
  constructor(private stats: StatsService) {}

  async index({ inertia, auth }: HttpContext) {
    const user = auth.getUserOrFail()

    const myTasks = await Task.query()
      .where('assignee_id', user.id)
      .whereNot('status', 'done')
      .orderByRaw('due_on IS NULL, due_on ASC')
      .limit(8)

    return inertia.render('dashboard', {
      /**
       * Fast and essential: part of the first response.
       */
      myTasks: TaskTransformer.transform(myTasks),

      /**
       * Slow and optional: fetched right after the page renders.
       * rescue: if it throws, the page shows a fallback instead of spinning forever.
       */
      stats: inertia.defer(() =&gt; this.stats.forUser(user), { rescue: true }),

      /**
       * Rarely changes: computed once, then cached by the client for 30 minutes.
       */
      teammates: inertia.once(
        async () =&gt; UserTransformer.transform(await this.stats.teammates(user)),
        { expiresIn: '30m' }
      ),
    })
  }
}</code></pre>
<div class="callout info"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/></svg></div><div class="callout-body"><div class="callout-t">Dependency injection</div><p><code>@inject()</code> on the class tells AdonisJS's container to construct the controller with a <code>StatsService</code> instance. You never call <code>new StatsService()</code>. In tests you can swap the service for a fake without touching the controller — chapter 24 relies on this idea. The <code>#services/*</code> alias is already declared in the kit's <code>package.json</code>.</p></div></div>
<p>Replace the kit's placeholder dashboard route with the controller, keeping the <code>dashboard</code> name the login flow redirects to:</p>
<pre data-lang="ts" data-file="start/routes.ts (inside the auth group, replace)"><code>router.get('/dashboard', [controllers.Dashboard, 'index']).as('dashboard')</code></pre>
<p><code>.as('dashboard')</code> overrides the generated name <code>dashboard.index</code>, so <code>response.redirect().toRoute('dashboard')</code> in the session controller keeps working.</p>
<h2 id="deferred-the-page">The page</h2>
<pre data-lang="tsx" data-file="inertia/pages/dashboard.tsx"><code>import { Deferred } from '@inertiajs/react'
import Page from '~/components/page'
import AppLayout from '~/layouts/app'
import TaskCard from '~/components/task_card'
import type { InertiaProps } from '~/types'
import type { Data } from '@generated/data'

type Stats = {
  total: number
  todo: number
  doing: number
  done: number
  overdue: number
  completion: number
}

type PageProps = InertiaProps&lt;{
  myTasks: Data.Task[]
  stats?: Stats
  teammates: Data.User[]
}&gt;

function StatTiles({ stats }: { stats: Stats }) {
  const tiles = [
    ['Open', stats.todo + stats.doing],
    ['In progress', stats.doing],
    ['Overdue', stats.overdue],
    ['Complete', `${stats.completion}%`],
  ] as const

  return (
    &lt;div className="project-grid" style={{ marginBottom: 24 }}&gt;
      {tiles.map(([label, value]) =&gt; (
        &lt;div key={label} className="project-card"&gt;
          &lt;p&gt;{label}&lt;/p&gt;
          &lt;h2 style={{ fontSize: 28 }}&gt;{value}&lt;/h2&gt;
        &lt;/div&gt;
      ))}
    &lt;/div&gt;
  )
}

function StatSkeleton() {
  return (
    &lt;div className="project-grid" style={{ marginBottom: 24 }}&gt;
      {[1, 2, 3, 4].map((i) =&gt; (
        &lt;div key={i} className="project-card" style={{ height: 96, opacity: 0.5 }} /&gt;
      ))}
    &lt;/div&gt;
  )
}

export default function Dashboard({ user, myTasks, stats, teammates }: PageProps) {
  return (
    &lt;Page title="Dashboard" description={`Welcome back, ${user?.fullName ?? 'friend'}.`}&gt;
      &lt;Deferred
        data="stats"
        fallback={&lt;StatSkeleton /&gt;}
        rescue={&lt;p className="field__hint"&gt;Statistics are unavailable right now.&lt;/p&gt;}
      &gt;
        {stats &amp;&amp; &lt;StatTiles stats={stats} /&gt;}
      &lt;/Deferred&gt;

      &lt;h2&gt;Assigned to you&lt;/h2&gt;
      {myTasks.length === 0 ? (
        &lt;p className="field__hint"&gt;Nothing on your plate. Enjoy it.&lt;/p&gt;
      ) : (
        &lt;div className="board__col"&gt;
          {myTasks.map((task) =&gt; (
            &lt;TaskCard key={task.id} task={task} /&gt;
          ))}
        &lt;/div&gt;
      )}

      &lt;h2 style={{ marginTop: 32 }}&gt;Your teammates&lt;/h2&gt;
      &lt;div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}&gt;
        {teammates.map((mate) =&gt; (
          &lt;span key={mate.id} className="avatar" title={mate.fullName ?? mate.email}&gt;
            {mate.initials}
          &lt;/span&gt;
        ))}
      &lt;/div&gt;
    &lt;/Page&gt;
  )
}

Dashboard.layout = [AppLayout]</code></pre>
<p>What happens on load:</p>
<ol><li>The first response contains <code>myTasks</code> and <code>teammates</code>, and lists <code>stats</code> as deferred. The page renders immediately, with the skeleton in place of the tiles.</li><li>Inertia automatically fires a partial reload for <code>stats</code> as soon as the page mounts.</li><li>When it arrives, <code>&lt;Deferred&gt;</code> swaps the fallback for its children. If <code>forUser()</code> threw, <code>rescue: true</code> on the server omits the prop and <code>&lt;Deferred&gt;</code> shows the <code>rescue</code> content, rather than spinning forever. The error is still logged.</li></ol>
<p>Deferred props are typed as optional (<code>stats?: Stats</code>) because they are genuinely absent on the first render.</p>
<h3 id="deferred-grouping-deferred-props">Grouping deferred props</h3>
<p>Each deferred group becomes one follow-up request. By default all deferred props share one group. When some are much slower than others, split them so the fast ones are not held back:</p>
<pre data-lang="ts"><code>stats: inertia.defer(() =&gt; this.stats.forUser(user), 'summary'),
leaderboard: inertia.defer(() =&gt; this.stats.leaderboard(), 'slow'),</code></pre>
<p>The second argument can be a group name, or an options object like <code>{ group: 'slow', rescue: true }</code>.</p>
<h2 id="deferred-once-props">Once props</h2>
<p><code>teammates</code> changes rarely — only when someone joins or leaves a project. Recomputing it on every dashboard visit is waste. <code>inertia.once()</code> computes it on the first visit, and the <strong>client keeps the value</strong>: on later visits, Inertia tells the server it already has it, and the server skips the callback.</p>
<ul><li><code>expiresIn: '30m'</code> forces a refresh after 30 minutes. You can also pass <code>expiresAt</code> with an absolute date.</li><li><code>key: 'teammates'</code> shares one cached value across pages that use the same data.</li><li>A partial reload that explicitly asks for a once prop always recomputes it, so <code>router.reload({ only: ['teammates'] })</code> is a reliable manual refresh.</li></ul>
<p>Once behaviour also chains onto other helpers. A deferred prop that should be cached after its first load:</p>
<pre data-lang="ts"><code>stats: inertia.defer(() =&gt; this.stats.forUser(user)).once({ expiresIn: '5m' }),</code></pre>
<div class="callout tip"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></div><div class="callout-body"><div class="callout-t">Pick the right tool</div><p>Essential and fast → plain prop. Slow but always needed → <code>defer</code>. Only needed on demand → <code>optional</code>. Rarely changes → <code>once</code>. Must survive partial reloads → <code>always</code>. Most Kazi pages use nothing but plain props; reach for the helpers when a real performance problem shows up.</p></div></div>
<div class="callout recap"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div><div class="callout-body"><div class="callout-t">What you built in this chapter</div><ul><li>Extracted statistics into an injectable <code>StatsService</code>.</li><li>Rendered the dashboard instantly and loaded stats with <code>inertia.defer</code> and <code>&lt;Deferred&gt;</code>, including a rescue fallback.</li><li>Grouped deferred props and learned their options.</li><li>Cached teammates on the client with <code>inertia.once</code> and <code>expiresIn</code>.</li></ul></div></div>
</template>
<template id="tpl-infinite-scroll">
<p>Pagination links suit a project list, but a feed of activity reads better as an endless stream. Kazi's dashboard gets a <strong>Recent activity</strong> section: the latest comments across every project you can see, loading more as you scroll. Inertia supports this with <strong>scroll props</strong> on the server and the <code>InfiniteScroll</code> component on the client.</p>
<h2 id="infinite-scroll-a-transformer-for-feed-items">A transformer for feed items</h2>
<p>Each item needs the comment, its author, and which task it belongs to. That is a different shape from a comment on the task page, so it gets its own transformer:</p>
<pre data-lang="bash"><code>$ node ace make:transformer activity</code></pre>
<pre data-lang="ts" data-file="app/transformers/activity_transformer.ts"><code>import type Comment from '#models/comment'
import { BaseTransformer } from '@adonisjs/core/transformers'
import UserTransformer from '#transformers/user_transformer'

export default class ActivityTransformer extends BaseTransformer&lt;Comment&gt; {
  toObject() {
    return {
      ...this.pick(this.resource, ['id', 'body', 'createdAt']),
      author: UserTransformer.transform(this.whenLoaded(this.resource.author)),
      task: this.pick(this.resource.task, ['id', 'title', 'projectId']),
    }
  }
}</code></pre>
<p>This generates a <code>Data.Activity</code> type for the frontend. Naming transformers after what the frontend <em>uses</em> rather than the underlying model is perfectly fine — several transformers can serialize the same model.</p>
<h2 id="infinite-scroll-the-scroll-prop">The scroll prop</h2>
<pre data-lang="ts" data-file="app/controllers/dashboard_controller.ts (additions)"><code>import Comment from '#models/comment'
import ActivityTransformer from '#transformers/activity_transformer'

  async index({ inertia, auth, request }: HttpContext) {
    const user = auth.getUserOrFail()
    // … myTasks as before

    return inertia.render('dashboard', {
      // … myTasks, stats, teammates

      activity: inertia
        .scroll(async () =&gt; {
          const ids = await this.stats.visibleProjectIds(user)
          const page = await Comment.query()
            .whereHas('task', (task) =&gt; task.whereIn('project_id', ids))
            .preload('author')
            .preload('task')
            .orderBy('created_at', 'desc')
            .orderBy('id', 'desc')
            .paginate(request.input('page', 1), 15)

          return ActivityTransformer.paginate(page.all(), page.getMeta())
        })
        .matchOn('id'),
    })
  }</code></pre>
<p><code>inertia.scroll(callback)</code> expects a transformer's <code>paginate()</code> output. It reads the pagination metadata to tell the client what the next page is, and marks the prop as <strong>mergeable</strong>: when the next page arrives, its items are <em>appended</em> to the existing list instead of replacing it.</p>
<p><code>.matchOn('id')</code> handles a subtle problem. Someone might comment while you are scrolling, shifting every row down by one. Page 2 would then start with an item you already have. With <code>matchOn('id')</code>, an incoming item with an existing id replaces the old one instead of being duplicated.</p>
<p>The second <code>orderBy('id', 'desc')</code> is a tie-breaker. Two comments created in the same second would otherwise have an undefined order, which can make items jump between pages.</p>
<h2 id="infinite-scroll-the-feed-component">The feed component</h2>
<pre data-lang="tsx" data-file="inertia/components/activity_feed.tsx"><code>import { InfiniteScroll } from '@inertiajs/react'
import { Link } from '@adonisjs/inertia/react'
import type { Scroll } from '@adonisjs/inertia/types'
import type { Data } from '@generated/data'

export default function ActivityFeed({ activity }: { activity: Scroll&lt;Data.Activity&gt; }) {
  return (
    &lt;section style={{ marginTop: 32 }}&gt;
      &lt;h2&gt;Recent activity&lt;/h2&gt;
      &lt;InfiniteScroll data="activity"&gt;
        {activity.data.map((item) =&gt; (
          &lt;article key={item.id} className="task-card"&gt;
            &lt;div className="task-card__meta" style={{ marginTop: 0 }}&gt;
              &lt;span className="avatar"&gt;{item.author?.initials}&lt;/span&gt;
              &lt;strong&gt;{item.author?.fullName}&lt;/strong&gt; commented on{' '}
              &lt;Link route="tasks.show" routeParams={{ id: item.task.id }}&gt;
                {item.task.title}
              &lt;/Link&gt;
            &lt;/div&gt;
            &lt;p style={{ margin: '8px 0 0' }}&gt;{item.body}&lt;/p&gt;
          &lt;/article&gt;
        ))}
      &lt;/InfiniteScroll&gt;
    &lt;/section&gt;
  )
}</code></pre>
<pre data-lang="tsx" data-file="inertia/pages/dashboard.tsx (changes)"><code>import type { Scroll } from '@adonisjs/inertia/types'
import ActivityFeed from '~/components/activity_feed'

type PageProps = InertiaProps&lt;{
  myTasks: Data.Task[]
  stats?: Stats
  teammates: Data.User[]
  activity: Scroll&lt;Data.Activity&gt;
}&gt;

// at the end of the page body
&lt;ActivityFeed activity={activity} /&gt;</code></pre>
<p>The <code>Scroll&lt;Data.Activity&gt;</code> marker type pairs with <code>inertia.scroll()</code> on the server: declaring a prop as <code>Scroll&lt;…&gt;</code> only type-checks when the server produces it with <code>inertia.scroll()</code>, so the two sides cannot drift apart.</p>
<p><code>InfiniteScroll</code> watches the end of the list. When it scrolls into view, it performs a partial reload for <code>activity</code> with the next <code>page</code> value, and Inertia merges the result. It also keeps the URL's <code>page</code> parameter in sync, so refreshing mid-feed does not lose your place.</p>
<h2 id="infinite-scroll-other-merge-strategies">Other merge strategies</h2>
<p>Scroll props are built on Inertia's general <strong>merge</strong> mechanism, which you can use directly for other patterns:</p>
<pre data-lang="ts"><code>// Newest first: new items go to the front of the list
notifications: inertia.merge(await latestNotifications()).prepend(),

// Merge nested objects recursively rather than replacing them
preferences: inertia.deepMerge(await loadPreferences()),

// Load after render, then append
suggestions: inertia.defer(() =&gt; loadSuggestions()).merge(),</code></pre>
<p>A partial reload with <code>reset: ['activity']</code> tells the server to send the prop as a plain replacement, discarding what the client had merged — useful for a "Refresh feed" button.</p>
<div class="callout tip"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></div><div class="callout-body"><div class="callout-t">Deferred first page</div><p>Chain <code>.deferred()</code> onto a scroll prop to skip the first page on the initial render and load it right after the page mounts, exactly like deferred props. Declare the prop optional (<code>activity?: Scroll&lt;Data.Activity&gt;</code>) if you do.</p></div></div>
<div class="callout recap"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div><div class="callout-body"><div class="callout-t">What you built in this chapter</div><ul><li>Wrote a feed-specific <code>ActivityTransformer</code>, generating <code>Data.Activity</code>.</li><li>Produced an infinite, mergeable list with <code>inertia.scroll()</code> and <code>.matchOn('id')</code>.</li><li>Rendered it with <code>InfiniteScroll</code> and the <code>Scroll&lt;&gt;</code> marker type.</li><li>Know <code>merge</code>, <code>prepend</code>, <code>deepMerge</code> and <code>reset</code> for other feed-like data.</li></ul></div></div>
</template>
<template id="tpl-http-requests">
<p>Everything so far has been an Inertia <em>visit</em>: a request that produces a page. Sometimes you need data without changing the page, the URL, or the browser history — an autocomplete, a live availability check, a "load preview" button. For those, AdonisJS offers the <code>useHttp</code> hook: a typed wrapper around a plain JSON request to a named route.</p>
<p>Kazi's invite form will show who you are about to invite as you type their email, before you submit.</p>
<h2 id="http-requests-the-endpoint">The endpoint</h2>
<h4 class="step-h"><span class="step-badge">1</span><span>Validator</span></h4>
<pre data-lang="ts" data-file="app/validators/project_member.ts (addition)"><code>export const userLookupValidator = vine.create({
  email: vine.string().trim().toLowerCase().email(),
})</code></pre>
<h4 class="step-h"><span class="step-badge">2</span><span>Controller</span></h4>
<pre data-lang="bash"><code>$ node ace make:controller user_lookup</code></pre>
<pre data-lang="ts" data-file="app/controllers/user_lookup_controller.ts"><code>import User from '#models/user'
import type { HttpContext } from '@adonisjs/core/http'
import UserTransformer from '#transformers/user_transformer'
import { userLookupValidator } from '#validators/project_member'

export default class UserLookupController {
  /**
   * POST /api/users/lookup — returns JSON, not a page.
   */
  async store({ request, serialize }: HttpContext) {
    const { email } = await request.validateUsing(userLookupValidator)
    const user = await User.findBy('email', email)

    return serialize({
      user: user ? UserTransformer.transform(user) : null,
    })
  }
}</code></pre>
<p><code>serialize()</code> resolves transformers into plain JSON and — importantly — gives the route a <strong>response type</strong> in the generated registry. The client will know that the response has a <code>user</code> that is either <code>Data.User</code> or <code>null</code>.</p>
<pre data-lang="ts" data-file="start/routes.ts (inside the auth group)"><code>router.post('/api/users/lookup', [controllers.UserLookup, 'store'])</code></pre>
<p>Its name is <code>user_lookup.store</code>. It sits inside the <code>auth</code> group, so only logged-in users can call it, and Shield's CSRF protection applies just like any other <code>POST</code>.</p>
<div class="callout warn"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg></div><div class="callout-body"><div class="callout-t">Think about enumeration</div><p>An endpoint that answers "does this email have an account?" can be abused to discover who uses your product. Kazi accepts that for logged-in users because the invite form already reveals it, but in a public-facing app you would rate-limit it with <code>@adonisjs/limiter</code> or return less information.</p></div></div>
<h2 id="http-requests-the-hook">The hook</h2>
<pre data-lang="tsx" data-file="inertia/components/invite_lookup.tsx"><code>import { useEffect } from 'react'
import { useHttp } from '@adonisjs/inertia/react'

const looksLikeEmail = (value: string) =&gt; /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)

export default function InviteLookup() {
  const lookup = useHttp({ route: 'user_lookup.store' }, { email: '' })

  useEffect(() =&gt; {
    if (!looksLikeEmail(lookup.data.email)) return
    const timer = setTimeout(() =&gt; lookup.submit(), 350)
    return () =&gt; clearTimeout(timer)
  }, [lookup.data.email])

  const found = lookup.response?.user

  return (
    &lt;div className="field"&gt;
      &lt;input
        name="email"
        type="email"
        className="field__input"
        placeholder="teammate@company.com"
        value={lookup.data.email}
        onChange={(event) =&gt; lookup.setData('email', event.target.value)}
      /&gt;
      {lookup.processing &amp;&amp; &lt;span className="field__hint"&gt;Looking up…&lt;/span&gt;}
      {!lookup.processing &amp;&amp; found &amp;&amp; (
        &lt;span className="field__hint"&gt;
          &lt;span className="avatar"&gt;{found.initials}&lt;/span&gt; {found.fullName} will be invited
        &lt;/span&gt;
      )}
      {!lookup.processing &amp;&amp; lookup.response &amp;&amp; !found &amp;&amp; (
        &lt;span className="field__error"&gt;Nobody with that email uses Kazi yet.&lt;/span&gt;
      )}
      {lookup.errors.email &amp;&amp; &lt;span className="field__error"&gt;{lookup.errors.email}&lt;/span&gt;}
    &lt;/div&gt;
  )
}</code></pre>
<p><code>useHttp</code> mirrors <code>useForm</code>'s API, bound to a route name:</p>
<ul><li><code>useHttp({ route }, initialData)</code> — the route determines URL and method, and its validator determines the type of <code>data</code>.</li><li><code>lookup.data</code> / <code>lookup.setData(key, value)</code> — the request payload.</li><li><code>lookup.submit()</code> — sends the request. It resolves with the parsed JSON.</li><li><code>lookup.processing</code>, <code>lookup.errors</code> — request state and validation errors from a <code>422</code> response.</li><li><code>lookup.response</code> — the last successful response, typed from <code>serialize()</code>.</li></ul>
<p>Crucially, nothing navigates: no URL change, no history entry, no props replaced.</p>
<h2 id="http-requests-plug-it-into-the-invite-form">Plug it into the invite form</h2>
<p>In <code>MembersPanel</code>, replace the plain email input inside the invite <code>Form</code> with <code>&lt;InviteLookup /&gt;</code>. The input keeps <code>name="email"</code>, so when the user presses <strong>Invite</strong>, the surrounding <code>Form</code> still reads the value from the DOM and submits it as a normal Inertia visit. One field, two jobs: a live lookup while typing, and a regular form submission at the end.</p>
<div class="callout info"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/></svg></div><div class="callout-body"><div class="callout-t">When to use which</div><p><strong>Visit</strong> (<code>Link</code>, <code>Form</code>, <code>useForm</code>, <code>router</code>) when the result should become the page: new props, a redirect, history. <strong><code>useHttp</code></strong> when you want data <em>for</em> the current page without replacing it. If you find yourself building many <code>useHttp</code> endpoints for one screen, consider whether a prop (maybe <code>optional</code> or <code>defer</code>) would be simpler.</p></div></div>
<div class="callout recap"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div><div class="callout-body"><div class="callout-t">What you built in this chapter</div><ul><li>Built a JSON endpoint that returns transformer output with <code>serialize()</code>.</li><li>Used <code>useHttp</code> to call it by route name with typed data, errors and response.</li><li>Combined a live lookup with a regular <code>Form</code> submission.</li><li>Know when to prefer <code>useHttp</code> over an Inertia visit, and the enumeration trade-off.</li></ul></div></div>
</template>
<template id="tpl-errors-history">
<p>A polished app handles the unhappy paths well. This chapter covers what users see when something goes wrong, how to turn domain errors into friendly messages, and a few Inertia features for redirects and history that matter for security.</p>
<h2 id="errors-history-status-pages">Status pages</h2>
<p>The exception handler in <code>app/exceptions/handler.ts</code> turns thrown errors into responses. The kit configures <strong>status pages</strong>: Inertia pages rendered for particular HTTP status codes.</p>
<pre data-lang="ts" data-file="app/exceptions/handler.ts"><code>import app from '@adonisjs/core/services/app'
import { type HttpContext, ExceptionHandler } from '@adonisjs/core/http'
import type { StatusPageRange, StatusPageRenderer } from '@adonisjs/core/types/http'

export default class HttpExceptionHandler extends ExceptionHandler {
  protected debug = !app.inProduction

  protected renderStatusPages = app.inProduction

  protected statusPages: Record&lt;StatusPageRange, StatusPageRenderer&gt; = {
    '403': (_, { inertia }) =&gt; inertia.render('errors/forbidden', {}),
    '404': (_, { inertia }) =&gt; inertia.render('errors/not_found', {}),
    '500..599': (_, { inertia }) =&gt; inertia.render('errors/server_error', {}),
  }

  async handle(error: unknown, ctx: HttpContext) {
    return super.handle(error, ctx)
  }

  async report(error: unknown, ctx: HttpContext) {
    return super.report(error, ctx)
  }
}</code></pre>
<p>We added the <code>403</code> entry so Bouncer's authorization failures get a proper page. Create it:</p>
<pre data-lang="bash"><code>$ node ace make:page errors/forbidden</code></pre>
<pre data-lang="tsx" data-file="inertia/pages/errors/forbidden.tsx"><code>import { Link } from '@adonisjs/inertia/react'

export default function Forbidden() {
  return (
    &lt;div className="empty" style={{ marginTop: '15vh' }}&gt;
      &lt;h1&gt;You don't have access to that&lt;/h1&gt;
      &lt;p&gt;Ask the project owner if you think you should.&lt;/p&gt;
      &lt;Link route="dashboard" className="btn btn--primary"&gt;
        Back to your dashboard
      &lt;/Link&gt;
    &lt;/div&gt;
  )
}</code></pre>
<p>Two switches control what you see:</p>
<ul><li><code>debug</code> — in development, errors render a detailed page with the stack trace (the <strong>Youch</strong> error page). For an Inertia request, Inertia shows that HTML in a modal over your app, so you can debug without losing your place.</li><li><code>renderStatusPages</code> — whether the friendly pages above are used. The kit enables them only in production. To check your error pages locally, temporarily set it to <code>true</code>.</li></ul>
<h2 id="errors-history-a-self-handling-exception">A self-handling exception</h2>
<p>Kazi has a rule: archived projects are read-only. When someone tries to add a task to one, a 500 or a raw 409 would be unhelpful. A <strong>self-handling exception</strong> carries its own response logic.</p>
<pre data-lang="bash"><code>$ node ace make:exception project_archived</code></pre>
<pre data-lang="ts" data-file="app/exceptions/project_archived_exception.ts"><code>import { Exception } from '@adonisjs/core/exceptions'
import type { HttpContext } from '@adonisjs/core/http'

export default class ProjectArchivedException extends Exception {
  static status = 409
  static code = 'E_PROJECT_ARCHIVED'
  static message = 'This project is archived. Reactivate it to make changes.'

  /**
   * Called by the exception handler instead of its default rendering.
   */
  async handle(error: this, ctx: HttpContext) {
    ctx.session.flash('error', error.message)
    return ctx.response.redirect().back()
  }
}</code></pre>
<p>Guard the rule on the model, so every code path gets it:</p>
<pre data-lang="ts" data-file="app/models/project.ts (addition)"><code>import ProjectArchivedException from '#exceptions/project_archived_exception'

  assertWritable() {
    if (this.status === 'archived') throw new ProjectArchivedException()
  }</code></pre>
<pre data-lang="ts" data-file="app/controllers/tasks_controller.ts (store, change)"><code>const project = await Project.findVisibleOrFail(params.id, user)
project.assertWritable()</code></pre>
<p>Now adding a task to an archived project shows an error toast and leaves the user on the board. Controllers stay clean — no <code>if</code>/<code>flash</code>/<code>redirect</code> boilerplate — and the same exception can be thrown from a background job, where there is no session, and still be reported properly.</p>
<h2 id="errors-history-redirects-that-leave-the-app">Redirects that leave the app</h2>
<p>Inertia visits use <code>fetch</code>, and <code>fetch</code> cannot follow a redirect to another origin. A plain <code>response.redirect('https://…')</code> from an Inertia request would fail. For external destinations — a payment page, an OAuth provider, a file on a CDN — use <code>inertia.location()</code>:</p>
<pre data-lang="ts"><code>async billing({ inertia }: HttpContext) {
  const session = await payments.createCheckoutSession()
  return inertia.location(session.url)
}</code></pre>
<p>This sends a <code>409</code> with an <code>X-Inertia-Location</code> header, and the client performs a full browser navigation to the URL. The same trick forces a full page load on your own URLs when you want one.</p>
<div class="callout info"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg></div><div class="callout-body"><div class="callout-t">You don't need 303s</div><p>When a <code>PUT</code>, <code>PATCH</code> or <code>DELETE</code> redirects, browsers would normally replay the same method at the new URL. The Inertia middleware upgrades those redirects to <code>303 See Other</code> automatically so the follow-up is always a <code>GET</code>. You never set the status yourself.</p></div></div>
<h2 id="errors-history-history-and-privacy">History and privacy</h2>
<p>Inertia keeps each page's props in the browser's history state so Back and Forward are instant. That has a privacy side effect: after someone logs out on a shared computer, pressing Back could redisplay a page from history with its data.</p>
<p>Fix it in the logout action:</p>
<pre data-lang="ts" data-file="app/controllers/session_controller.ts (destroy, change)"><code>async destroy({ auth, inertia }: HttpContext) {
  await auth.use('web').logout()

  inertia.clearHistory()
  return inertia.location('/login')
}</code></pre>
<ul><li><code>inertia.clearHistory()</code> tells the client to wipe the history state it has stored.</li><li><code>inertia.location('/login')</code> does a full page load, discarding all in-memory React state too.</li></ul>
<p>For pages with sensitive data, you can also <strong>encrypt</strong> history state, so it is unreadable even while it is there:</p>
<pre data-lang="ts"><code>async edit({ inertia }: HttpContext) {
  inertia.encryptHistory()
  return inertia.render('account/settings', { /* … */ })
}</code></pre>
<p>Or turn it on for the whole app with <code>encryptHistory: true</code> in <code>config/inertia.ts</code>. Encryption uses a key held in session storage; <code>clearHistory()</code> rotates it, which makes old entries undecryptable.</p>
<div class="callout recap"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div><div class="callout-body"><div class="callout-t">What you built in this chapter</div><ul><li>Configured status pages for 403, 404 and 5xx and built a forbidden page.</li><li>Wrote a self-handling <code>ProjectArchivedException</code> and enforced it from the model.</li><li>Redirected off-site with <code>inertia.location()</code>.</li><li>Protected history on logout with <code>clearHistory()</code> and learned <code>encryptHistory()</code>.</li></ul></div></div>
</template>
<template id="tpl-testing">
<p>Kazi has rules that must never break: Jane must not see Otieno's private project, members must not edit projects they don't own, archived projects are read-only. Clicking through the app after every change doesn't scale. AdonisJS ships with <strong>Japa</strong>, a test runner built for it, and the Inertia package adds assertions made for exactly this kind of app.</p>
<h2 id="testing-suites-and-setup">Suites and setup</h2>
<p>The kit defines three suites in <code>adonisrc.ts</code>: <strong>unit</strong> (<code>tests/unit</code>), <strong>functional</strong> (<code>tests/functional</code>) and <strong>browser</strong> (<code>tests/browser</code>). Run them with:</p>
<pre data-lang="bash"><code>$ node ace test                # every suite
$ node ace test functional     # one suite
$ node ace test --watch        # re-run on file changes</code></pre>
<h4 class="step-h"><span class="step-badge">1</span><span>A separate test database</span></h4>
<p>By default the SQLite file lives in <code>tmp/db.sqlite3</code> — your development data. Tests truncate tables, so give them their own file:</p>
<pre data-lang="ts" data-file="config/database.ts (change)"><code>connection: {
  filename: app.tmpPath(app.inTest ? 'test.sqlite3' : 'db.sqlite3'),
},</code></pre>
<h4 class="step-h"><span class="step-badge">2</span><span>Migrate before the run</span></h4>
<pre data-lang="ts" data-file="tests/bootstrap.ts (change)"><code>export const runnerHooks: Required&lt;Pick&lt;Config, 'setup' | 'teardown'&gt;&gt; = {
  setup: [() =&gt; testUtils.db().migrate()],
  teardown: [],
}</code></pre>
<p><code>testUtils.db().migrate()</code> runs migrations before the first test and rolls them back when the run ends. The kit's <code>.env.test</code> already sets <code>SESSION_DRIVER=memory</code>, which the auth test helpers need.</p>
<h2 id="testing-functional-tests-assert-on-the-page-object">Functional tests: assert on the page object</h2>
<p>Functional tests make HTTP requests to a real running server and inspect the response — no browser involved, so they are fast. Install the API client and register it together with the Inertia, session and auth plugins:</p>
<pre data-lang="bash"><code>$ npm i -D @japa/api-client</code></pre>
<pre data-lang="ts" data-file="tests/bootstrap.ts (plugins)"><code>import { apiClient } from '@japa/api-client'
import { inertiaApiClient } from '@adonisjs/inertia/plugins/api_client'
import { sessionApiClient } from '@adonisjs/session/plugins/api_client'
import { authApiClient } from '@adonisjs/auth/plugins/api_client'
import { shieldApiClient } from '@adonisjs/shield/plugins/api_client'

export const plugins: Config['plugins'] = [
  assert(),
  apiClient(),
  pluginAdonisJS(app),
  dbAssertions(app),
  inertiaApiClient(app),
  sessionApiClient(app),
  shieldApiClient(),
  authApiClient(app),
  browserClient({ runInSuites: ['browser'] }),
  sessionBrowserClient(app),
  authBrowserClient(app),
]</code></pre>
<p>Now write the most important test in the app: visibility.</p>
<pre data-lang="bash"><code>$ node ace make:test projects --suite=functional</code></pre>
<pre data-lang="ts" data-file="tests/functional/projects.spec.ts"><code>import { test } from '@japa/runner'
import testUtils from '@adonisjs/core/services/test_utils'
import User from '#models/user'
import { ProjectFactory } from '#database/factories/project_factory'

async function makeUser(name: string) {
  return User.create({
    fullName: name,
    email: `${name.toLowerCase()}@kazi.test`,
    password: 'password123',
  })
}

test.group('Projects', (group) =&gt; {
  group.each.setup(() =&gt; testUtils.db().truncate())

  test('lists only projects the user owns or belongs to', async ({ client, route, assert }) =&gt; {
    const jane = await makeUser('Jane')
    const otieno = await makeUser('Otieno')

    await ProjectFactory.merge({ userId: jane.id, name: 'Website relaunch' }).create()
    const shared = await ProjectFactory.merge({ userId: otieno.id, name: 'Shared roadmap' }).create()
    await ProjectFactory.merge({ userId: otieno.id, name: 'Private research' }).create()
    await shared.related('members').attach([jane.id])

    const response = await client.get(route('projects.index')).withInertia().loginAs(jane)

    response.assertStatus(200)
    response.assertInertiaComponent('projects/index')

    const names = response.body().props.projects.data.map((p: { name: string }) =&gt; p.name).sort()
    assert.deepEqual(names, ['Shared roadmap', 'Website relaunch'])
  })

  test('returns 404 for a project the user cannot see', async ({ client, route }) =&gt; {
    const jane = await makeUser('Jane')
    const otieno = await makeUser('Otieno')
    const secret = await ProjectFactory.merge({ userId: otieno.id }).create()

    const response = await client
      .get(route('projects.show', { id: secret.id }))
      .withInertia()
      .loginAs(jane)

    response.assertStatus(404)
  })

  test('members cannot edit a project they do not own', async ({ client, route, assert }) =&gt; {
    const jane = await makeUser('Jane')
    const amina = await makeUser('Amina')
    const project = await ProjectFactory.merge({ userId: jane.id }).create()
    await project.related('members').attach([amina.id])

    const response = await client
      .put(route('projects.update', { id: project.id }))
      .form({ name: 'Hijacked', color: 'rose', status: 'active' })
      .withInertia()
      .withCsrfToken()
      .loginAs(amina)

    response.assertStatus(403)
    await project.refresh()
    assert.notEqual(project.name, 'Hijacked')
  })
})</code></pre>
<p>The helpers doing the heavy lifting:</p>
<ul><li><code>route('projects.index')</code> builds URLs from route names, just like the frontend.</li><li><code>.withInertia()</code> sends the <code>X-Inertia</code> header, so the response is the JSON page object instead of HTML.</li><li><code>.loginAs(user)</code> logs the user in for that request through the session plugin — no login form needed.</li><li><code>.withCsrfToken()</code> (from the Shield plugin) attaches a valid CSRF token. Without it, Shield would reject the <code>PUT</code> with its own 403 and the test would pass for the wrong reason.</li><li><code>assertInertiaComponent()</code> and <code>response.body().props</code> let you check exactly what React would receive.</li><li><code>project.refresh()</code> re-reads the row from the database, proving the update really did not happen.</li></ul>
<div class="callout tip"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></div><div class="callout-body"><div class="callout-t">Test the rule, not the markup</div><p>These tests check <em>which data</em> reaches the page and <em>which status</em> comes back. They keep passing when you redesign the UI, and they fail the moment someone removes a <code>visibleTo</code> scope or an <code>authorize()</code> call. That is exactly the kind of test worth having.</p></div></div>
<h2 id="testing-browser-tests-click-through-the-real-thing">Browser tests: click through the real thing</h2>
<p>Some behaviour only exists in the browser: a form that resets after success, a toast, a debounced search. Browser tests drive a real Chromium through <strong>Playwright</strong>. Install the browser binary once:</p>
<pre data-lang="bash"><code>$ npx playwright install chromium</code></pre>
<div class="callout tool"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg></div><div class="callout-body"><div class="callout-t">npx</div><p><code>npx</code> runs a command from a package without installing it globally. Here it runs Playwright's CLI (already installed as a dependency of <code>@japa/browser-client</code>) to download the Chromium build that tests will drive.</p></div></div>
<pre data-lang="bash"><code>$ node ace make:test task_board --suite=browser</code></pre>
<pre data-lang="ts" data-file="tests/browser/task_board.spec.ts"><code>import { test } from '@japa/runner'
import testUtils from '@adonisjs/core/services/test_utils'
import User from '#models/user'
import { ProjectFactory } from '#database/factories/project_factory'

test.group('Task board', (group) =&gt; {
  group.each.setup(() =&gt; testUtils.db().truncate())

  test('quick-add puts a new task in the To do column', async ({ visit, browserContext, route }) =&gt; {
    const jane = await User.create({ fullName: 'Jane W', email: 'jane@kazi.test', password: 'password123' })
    const project = await ProjectFactory.merge({ userId: jane.id, name: 'Launch' }).create()

    await browserContext.loginAs(jane)
    const page = await visit(route('projects.show', { id: project.id }))

    await page.getByPlaceholder('Add a task and press Enter…').fill('Write release notes')
    await page.keyboard.press('Enter')

    await page.assertTextContains('.board__col:first-child', 'Write release notes')
    await page.assertPath(`/projects/${project.id}`)
  })

  test('shows validation errors on the new-project form', async ({ visit, browserContext, route }) =&gt; {
    const jane = await User.create({ fullName: 'Jane W', email: 'jane@kazi.test', password: 'password123' })

    await browserContext.loginAs(jane)
    const page = await visit(route('projects.create'))

    await page.getByRole('button', { name: 'Create project' }).click()
    await page.assertTextContains('.field__error', 'project name')
  })
})</code></pre>
<p><code>visit()</code> returns a Playwright page extended with Japa assertions. <code>assertTextContains</code> waits up to a few seconds for the text to appear, which absorbs the time Inertia needs to submit and re-render — no manual sleeps. Everything else is standard Playwright: <code>getByPlaceholder</code>, <code>getByRole</code>, <code>keyboard.press</code>.</p>
<pre data-lang="bash"><code>$ node ace test browser --headed    # watch the browser do it</code></pre>

<template id="tpl-ssr-deploy">
<p>Kazi works on your machine. This chapter gets it onto a server: optional server-side rendering, a production build, a real database, and the handful of settings that matter in production.</p>
<h2 id="ssr-deploy-server-side-rendering-optional">Server-side rendering (optional)</h2>
<p>Without SSR, the first response contains an empty <code>&lt;div id="app"&gt;</code> and React renders everything in the browser. That is fine for an app behind a login. For public pages — Kazi's home page, say — <strong>SSR</strong> renders the React tree on the server, so the HTML arrives filled in. Search engines index it and users see content before JavaScript loads.</p>
<p>The kit already contains the SSR entrypoint, <code>inertia/ssr.tsx</code>, which mirrors <code>app.tsx</code> but renders to a string:</p>
<pre data-lang="tsx" data-file="inertia/ssr.tsx"><code>import { client } from '~/client'
import ReactDOMServer from 'react-dom/server'
import { TuyauProvider } from '@adonisjs/inertia/react'
import { resolvePageComponent } from '@adonisjs/inertia/helpers'
import { createInertiaApp, type ResolvedComponent } from '@inertiajs/react'

export default function render(page: any) {
  return createInertiaApp({
    page,
    render: ReactDOMServer.renderToString,
    resolve: async (name) =&gt; {
      const resolvedPage = await resolvePageComponent(
        `./pages/${name}.tsx`,
        import.meta.glob&lt;{ default: ResolvedComponent }&gt;('./pages/**/*.tsx', { eager: true })
      )
      return resolvedPage.default
    },
    setup: ({ App, props }) =&gt; (
      &lt;TuyauProvider client={client}&gt;
        &lt;App {...props} /&gt;
      &lt;/TuyauProvider&gt;
    ),
  })
}</code></pre>
<p>Enable it, and tell Vite to build it:</p>
<pre data-lang="ts" data-file="config/inertia.ts"><code>import { defineConfig } from '@adonisjs/inertia'

const inertiaConfig = defineConfig({
  ssr: {
    enabled: true,
    entrypoint: 'inertia/ssr.tsx',
    /**
     * Only the public marketing page needs SSR in Kazi.
     */
    pages: ['home'],
  },
})

export default inertiaConfig</code></pre>
<pre data-lang="ts" data-file="vite.config.ts (plugin options)"><code>adonisjs({
  entryPoints: ['inertia/app.tsx'],
  serverEntryPoints: ['inertia/ssr.tsx'],
  reload: ['resources/views/**/*.edge'],
}),</code></pre>
<p><code>pages: ['home']</code> limits SSR to the pages that benefit. Everything behind the login keeps rendering on the client, which saves server CPU.</p>
<div class="callout warn"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg></div><div class="callout-body"><div class="callout-t">SSR-safe components</div><p>During SSR there is no <code>window</code>, <code>document</code> or <code>localStorage</code>. Code that touches them must run inside <code>useEffect</code> (which only runs in the browser), never at the top level of a component or module. The <code>useShortcut</code> hook from chapter 11 is already safe for that reason.</p></div></div>
<h2 id="ssr-deploy-switch-to-postgresql">Switch to PostgreSQL</h2>
<p>SQLite is a single file on one disk, which does not suit most hosting. The kit's <code>config/database.ts</code> contains a commented-out PostgreSQL connection. Install the driver:</p>
<pre data-lang="bash"><code>$ npm i pg</code></pre>
<p>Uncomment the <code>pg</code> block, and choose the connection from an environment variable:</p>
<pre data-lang="ts" data-file="config/database.ts (changes)"><code>import env from '#start/env'

const dbConfig = defineConfig({
  connection: env.get('DB_CONNECTION', 'sqlite'),

  connections: {
    sqlite: { /* … unchanged … */ },

    pg: {
      client: 'pg',
      connection: {
        host: env.get('DB_HOST'),
        port: env.get('DB_PORT'),
        user: env.get('DB_USER'),
        password: env.get('DB_PASSWORD'),
        database: env.get('DB_DATABASE'),
      },
      migrations: { naturalSort: true, paths: ['database/migrations'] },
      schemaGeneration: { enabled: true, rulesPaths: ['./database/schema_rules.js'] },
      debug: app.inDev,
    },
  },
})</code></pre>
<p>And declare the variables so AdonisJS validates them at boot:</p>
<pre data-lang="ts" data-file="start/env.ts (additions)"><code>DB_CONNECTION: Env.schema.enum.optional(['sqlite', 'pg'] as const),
DB_HOST: Env.schema.string.optional({ format: 'host' }),
DB_PORT: Env.schema.number.optional(),
DB_USER: Env.schema.string.optional(),
DB_PASSWORD: Env.schema.string.optional(),
DB_DATABASE: Env.schema.string.optional(),</code></pre>
<p>Your migrations, models and queries don't change. That portability is why chapter 18 used <code>LOWER(name) LIKE ?</code> rather than a dialect-specific operator.</p>
<h2 id="ssr-deploy-build-for-production">Build for production</h2>
<pre data-lang="bash"><code>$ node ace build</code></pre>
<p>The build compiles TypeScript to JavaScript, runs Vite to produce hashed, minified assets (and the SSR bundle), and writes everything to <code>build/</code>, including <code>package.json</code> and your lockfile. The <code>build/</code> folder is the thing you deploy.</p>
<p>On the server:</p>
<pre data-lang="bash"><code>$ cd build
$ npm ci --omit=dev
$ node ace migration:run --force
$ node bin/server.js</code></pre>
<ul><li><code>npm ci --omit=dev</code> installs exactly the locked production dependencies.</li><li><code>migration:run --force</code> applies pending migrations. <code>--force</code> is required because AdonisJS refuses to run migrations in production without explicit confirmation.</li><li><code>node bin/server.js</code> starts the HTTP server. Run it under a process manager (systemd, PM2, or your platform's equivalent) so it restarts on crashes and reboots.</li></ul>
<h2 id="ssr-deploy-production-environment">Production environment</h2>
<pre data-lang="env" data-file=".env (production)"><code>NODE_ENV=production
HOST=0.0.0.0
PORT=3333
APP_URL=https://kazi.example.com
APP_KEY=generate-a-new-one
LOG_LEVEL=info
SESSION_DRIVER=cookie
VITE_APP_NAME=Kazi

DB_CONNECTION=pg
DB_HOST=127.0.0.1
DB_PORT=5432
DB_USER=kazi
DB_PASSWORD=a-long-random-password
DB_DATABASE=kazi</code></pre>
<ul><li>Generate a fresh key for each environment with <code>node ace generate:key</code>. Never reuse the development key.</li><li><code>HOST=0.0.0.0</code> makes the server reachable from outside its container or VM.</li><li><code>NODE_ENV=production</code> switches off debug error pages and turns on the status pages from chapter 23.</li><li>Most platforms let you set these as real environment variables instead of shipping a <code>.env</code> file, which is preferable.</li></ul>
<h2 id="ssr-deploy-a-dockerfile">A Dockerfile</h2>
<p>If your platform runs containers, this multi-stage image builds once and ships only what is needed:</p>
<pre data-lang="docker" data-file="Dockerfile"><code>FROM node:24-alpine AS build
WORKDIR /app
COPY package*.json ./
RUN npm ci
COPY . .
RUN node ace build

FROM node:24-alpine
ENV NODE_ENV=production
WORKDIR /app
COPY --from=build /app/build ./
RUN npm ci --omit=dev
EXPOSE 3333
CMD ["sh", "-c", "node ace migration:run --force &amp;&amp; node bin/server.js"]</code></pre>
<div class="callout info"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg></div><div class="callout-body"><div class="callout-t">Deploys and open tabs</div><p>When you deploy new frontend assets, users with Kazi already open are still running the old JavaScript. Their next Inertia visit carries the old asset version; the server notices the mismatch and the client does a full reload — the mechanism from chapter 3. You don't need to do anything, but it is why deploys feel seamless.</p></div></div>

<p>You built a complete, deployable application: authentication, projects, a task board, teams with permissions, search and pagination, a dashboard with streamed statistics, an infinite feed, error pages, and tests for the rules that matter. More importantly, every feature used the same small set of ideas.</p>
<h2 id="wrap-up-the-final-routes-file">The final routes file</h2>
<p>Seen together, Kazi's routes read like a table of contents for the app. Grouping the <code>:id</code> routes lets one <code>.where()</code> apply the number matcher to all of them.</p>
<pre data-lang="ts" data-file="start/routes.ts"><code>import { middleware } from '#start/kernel'
import { controllers } from '#generated/controllers'
import router from '@adonisjs/core/services/router'

router
  .get('/', async ({ auth, response, inertia }) =&gt; {
    if (auth.isAuthenticated) return response.redirect().toRoute('dashboard')
    return inertia.render('home', {})
  })
  .as('home')

router
  .group(() =&gt; {
    router.get('signup', [controllers.NewAccount, 'create'])
    router.post('signup', [controllers.NewAccount, 'store'])
    router.get('login', [controllers.Session, 'create'])
    router.post('login', [controllers.Session, 'store'])
  })
  .use(middleware.guest())

router
  .group(() =&gt; {
    router.get('/dashboard', [controllers.Dashboard, 'index']).as('dashboard')

    router.get('/projects', [controllers.Projects, 'index'])
    router.get('/projects/create', [controllers.Projects, 'create'])
    router.post('/projects', [controllers.Projects, 'store'])

    router
      .group(() =&gt; {
        router.get('/projects/:id', [controllers.Projects, 'show'])
        router.get('/projects/:id/edit', [controllers.Projects, 'edit'])
        router.put('/projects/:id', [controllers.Projects, 'update'])
        router.delete('/projects/:id', [controllers.Projects, 'destroy'])

        router.post('/projects/:id/tasks', [controllers.Tasks, 'store'])
        router.post('/projects/:id/members', [controllers.ProjectMembers, 'store'])
        router
          .delete('/projects/:id/members/:userId', [controllers.ProjectMembers, 'destroy'])
          .where('userId', router.matchers.number())

        router.get('/tasks/:id', [controllers.Tasks, 'show'])
        router.put('/tasks/:id', [controllers.Tasks, 'update'])
        router.delete('/tasks/:id', [controllers.Tasks, 'destroy'])
        router.patch('/tasks/:id/status', [controllers.TaskStatus, 'update'])
        router.post('/tasks/:id/comments', [controllers.Comments, 'store'])
      })
      .where('id', router.matchers.number())

    router.post('/api/users/lookup', [controllers.UserLookup, 'store'])
    router.post('logout', [controllers.Session, 'destroy'])
  })
  .use(middleware.auth())</code></pre>
<h2 id="wrap-up-the-patterns-you-now-own">The patterns you now own</h2>
<div class="grid">
<div class="card"><h5>Server owns routing</h5><p>URLs, access and redirects live in AdonisJS. React never guesses a URL: it uses route names through <code>Link</code>, <code>Form</code>, <code>useRouter</code> and <code>urlFor</code>.</p></div>
<div class="card"><h5>Transformers are the contract</h5><p>What React receives is an explicit allow-list, and its types are generated. Change a transformer and TypeScript tells you which pages to update.</p></div>
<div class="card"><h5>Mutations redirect</h5><p>Validate, act, flash, redirect. Errors and messages flow back through the session and shared props — no client-side error plumbing.</p></div>
<div class="card"><h5>Scopes filter, policies decide</h5><p>Lists are filtered in SQL with <code>visibleTo</code>; actions are guarded with Bouncer. A hidden record is a 404, a forbidden action is a 403.</p></div>
<div class="card"><h5>Rules live on models</h5><p><code>moveTo()</code>, <code>isOverdue</code>, <code>assertWritable()</code>, <code>findVisibleOrFail()</code>: controllers coordinate, models know the domain.</p></div>
<div class="card"><h5>Load only what's needed</h5><p>Lazy props, partial reloads, <code>optional</code>, <code>defer</code>, <code>once</code> and <code>scroll</code> — reached for when a real cost shows up, not before.</p></div>
</div>
<h2 id="wrap-up-where-to-go-next">Where to go next</h2>
<p>Kazi is a solid base to keep experimenting on. Each of these is an official AdonisJS package that plugs into what you already know:</p>

<script>
(function () {
  'use strict';

  /* ================================================================
     Data
     ================================================================ */
  var TOC = JSON.parse(document.getElementById('toc-data').textContent);
  var ORDER = [];
  var BY_ID = {};
  var i, j;
  for (i = 0; i < TOC.groups.length; i++) {
    for (j = 0; j < TOC.groups[i].chapters.length; j++) {
      var c = TOC.groups[i].chapters[j];
      c.group = TOC.groups[i].title;
      c.num = ORDER.length + 1;
      ORDER.push(c.id);
      BY_ID[c.id] = c;
    }
  }

  var contentEl = document.getElementById('content');
  var railEl = document.getElementById('rail');
  var currentId = null;

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  var visited = {};
  try { visited = JSON.parse(localStorage.getItem('adonis-tut-visited') || '{}') || {}; } catch (e) { visited = {}; }
  function saveVisited() {
    try { localStorage.setItem('adonis-tut-visited', JSON.stringify(visited)); } catch (e) {}
  }

  /* ================================================================
     Sidebar
     ================================================================ */
  function buildSidebar() {
    var html = '';
    for (var g = 0; g < TOC.groups.length; g++) {
      var grp = TOC.groups[g];
      html += '<div class="sb-group"><div class="sb-group-h">' + esc(grp.title) + '</div>';
      for (var k = 0; k < grp.chapters.length; k++) {
        var ch = grp.chapters[k];
        html += '<a class="sb-link" href="#' + ch.id + '" data-id="' + ch.id + '">' +
          '<span class="sb-num">' + pad(ch.num) + '</span><span>' + esc(ch.title) + '</span></a>';
      }
      html += '</div>';
    }
    document.getElementById('sbGroups').innerHTML = html;
  }

  function updateSidebar() {
    var links = document.querySelectorAll('.sb-link');
    var count = 0;
    for (var k = 0; k < links.length; k++) {
      var id = links[k].getAttribute('data-id');
      links[k].className = 'sb-link' + (id === currentId ? ' active' : '') + (visited[id] ? ' visited' : '');
    }
    for (var key in visited) { if (visited.hasOwnProperty(key) && BY_ID[key]) count++; }
    document.getElementById('progTxt').textContent = count + ' / ' + ORDER.length;
    document.getElementById('progBar').style.width = Math.round(count / ORDER.length * 100) + '%';
    var active = document.querySelector('.sb-link.active');
    if (active) {
      var sb = document.getElementById('sidebar');
      var r = active.getBoundingClientRect();
      var sr = sb.getBoundingClientRect();
      if (r.top < sr.top + 60 || r.bottom > sr.bottom - 40) {
        sb.scrollTop += (r.top - sr.top) - sr.height / 3;
      }
    }
  }

  /* ================================================================
     Syntax highlighter — single pass, character by character
     ================================================================ */
  var KW = {};
  ('import export default from as class extends implements interface type enum const let var function return ' +

  function isId(ch) { return /[A-Za-z0-9_$]/.test(ch); }
  function span(cls, txt) { return '<span class="' + cls + '">' + esc(txt) + '</span>'; }

        var e1 = src.indexOf('\n', p);
        if (e1 === -1) e1 = n;
        out += span('t-com', src.slice(p, e1)); p = e1; continue;
      }
      if (ch === '/' && nx === '*') {
        var e2 = src.indexOf('*/', p + 2);
        e2 = e2 === -1 ? n : e2 + 2;
        out += span('t-com', src.slice(p, e2)); p = e2; continue;
      }
      if (jsx && ch === '{' && nx === '/' && src.charAt(p + 2) === '*') {
        var e3 = src.indexOf('*/}', p);
        e3 = e3 === -1 ? n : e3 + 3;
        out += span('t-com', src.slice(p, e3)); p = e3; continue;
      }

        p += tm[0].length;

    }
