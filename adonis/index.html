  }

  function hlBash(src) {
    var lines = src.split('\n');
    var res = [];
    for (var L = 0; L < lines.length; L++) {
      var line = lines[L];
      if (/^\s*#/.test(line)) { res.push(span('t-com', line)); continue; }
      if (/^(❯|>>|DONE:|CREATE:|UPDATE:|✔|✓|\[)/.test(line)) { res.push(span('t-out', line)); continue; }
      var out = '';
      var p = 0;
      var first = true;
      if (/^\$ /.test(line)) { out += '<span class="t-prompt">$ </span>'; p = 2; }
      var n = line.length;
      while (p < n) {
        var ch = line.charAt(p);
        if (ch === '#' && (p === 0 || /\s/.test(line.charAt(p - 1)))) { out += span('t-com', line.slice(p)); p = n; break; }
        if (ch === '"' || ch === "'") {
          var k = line.indexOf(ch, p + 1); k = k === -1 ? n : k + 1;
          out += span('t-str', line.slice(p, k)); p = k; first = false; continue;
        }
        if (ch === '$' && /[A-Za-z_{]/.test(line.charAt(p + 1))) {
          var v = /^\$\{?[A-Za-z_][\w]*\}?/.exec(line.slice(p))[0];
          out += span('t-deco', v); p += v.length; continue;
        }
        if (/\s/.test(ch)) { out += ch; p++; continue; }
        var tok = /^[^\s"']+/.exec(line.slice(p))[0];
        if (first) { out += span('t-fn', tok); first = false; }
        else if (/^--?[A-Za-z]/.test(tok)) out += span('t-attr', tok);
        else if (tok === '&&' || tok === '|' || tok === '||' || tok === '\\') { out += span('t-op', tok); if (tok !== '\\') first = true; }
        else out += esc(tok);
        p += tok.length;
      }
      res.push(out);
    }
    return res.join('\n');
  }

  function hlEdge(src) {

        out += span('t-com', src.slice(p, e)); p = e; continue;

            }
            if (src.substr(p, 2) === '{{') {

            }

        }

    }

  }

  function hlJSON(src) {
    var out = '', p = 0, n = src.length;
    while (p < n) {

      var m = /^([A-Za-z_][A-Za-z0-9_]*)(=)(.*)$/.exec(line);
      if (!m) return esc(line);
      var val = esc(m[3]).replace(/\$\{[A-Za-z_]+\}/g, function (v) { return '<span class="t-deco">' + v + '</span>'; });
      return span('t-attr', m[1]) + '<span class="t-op">=</span><span class="t-str">' + val + '</span>';
    }).join('\n');
  }

  function hlDocker(src) {
    return src.split('\n').map(function (line) {
      if (/^\s*#/.test(line)) return span('t-com', line);
      var m = /^(\s*)([A-Z]+)(\s.*)?$/.exec(line);
      if (!m) return esc(line);
      var rest = (m[3] || '').split(/("[^"]*")/).map(function (part, k) {
        if (k % 2) return span('t-str', part);
        return esc(part).replace(/(--[a-z-]+)/g, '<span class="t-attr">$1</span>');
      }).join('');
      return m[1] + span('t-kw', m[2]) + rest;
    }).join('\n');
  }

  function hlCSS(src) {
    var out = '', p = 0, n = src.length, depth = 0, inValue = false;
    while (p < n) {
      var ch = src.charAt(p);
      if (ch === '/' && src.charAt(p + 1) === '*') {
        var e = src.indexOf('*/', p + 2); e = e === -1 ? n : e + 2;
        out += span('t-com', src.slice(p, e)); p = e; continue;
      }
      if (ch === '{') { depth++; inValue = false; out += esc(ch); p++; continue; }
      if (ch === '}') { depth = Math.max(0, depth - 1); inValue = false; out += esc(ch); p++; continue; }
      if (ch === ';') { inValue = false; out += esc(ch); p++; continue; }
      if (depth === 0) {
        var sel = /^[^{\/]+/.exec(src.slice(p));
        if (sel) {
          out += sel[0].split(/([.#]?[A-Za-z_][\w-]*)/).map(function (part, k) {
            return k % 2 ? span('t-tag', part) : esc(part);
          }).join('');
          p += sel[0].length; continue;
        }
      } else if (!inValue) {
        var prop = /^(\s*)(-{0,2}[A-Za-z][\w-]*)(\s*:)/.exec(src.slice(p));
        if (prop) {
          out += prop[1] + span('t-attr', prop[2]) + esc(prop[3]);
          p += prop[0].length; inValue = true; continue;
        }
      } else {
        var num = /^-?[0-9.]+(px|rem|em|%|vh|vw|s|ms|fr)?/.exec(src.slice(p));
        if (num && !/[\w-]/.test(src.charAt(p - 1))) { out += span('t-num', num[0]); p += num[0].length; continue; }
        var hex = /^#[0-9a-fA-F]{3,8}/.exec(src.slice(p));
        if (hex) { out += span('t-num', hex[0]); p += hex[0].length; continue; }
        var fn = /^([a-z-]+)\(/.exec(src.slice(p));
        if (fn) { out += span('t-fn', fn[1]) + '('; p += fn[0].length; continue; }
        if (ch === "'" || ch === '"') {
          var k = src.indexOf(ch, p + 1); k = k === -1 ? n : k + 1;
          out += span('t-str', src.slice(p, k)); p = k; continue;
        }
      }
      out += esc(ch); p++;
    }
    return out;
  }

  function highlight(src, lang) {
    if (lang === 'env') return hlEnv(src);
    if (lang === 'docker') return hlDocker(src);
    if (lang === 'css') return hlCSS(src);
    if (lang === 'ts' || lang === 'js') return hlTS(src, false);
    if (lang === 'tsx' || lang === 'jsx') return hlTS(src, true);
    if (lang === 'bash' || lang === 'sh') return hlBash(src);
    if (lang === 'edge' || lang === 'html') return hlEdge(src);
    if (lang === 'json') return hlJSON(src);
    return esc(src);
  }

  var LANG_LABEL = { docker: 'Dockerfile', ts: 'TypeScript', tsx: 'TSX', js: 'JavaScript', bash: 'Terminal', env: '.env', edge: 'Edge', html: 'HTML', json: 'JSON', text: 'Text', tree: 'Tree', css: 'CSS', sql: 'SQL' };
  var COPY_ICON = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';

  function enhanceCode(root) {
    var blocks = root.querySelectorAll('pre[data-lang]');
    for (var b = 0; b < blocks.length; b++) {
      var pre = blocks[b];
      var lang = pre.getAttribute('data-lang');
      var file = pre.getAttribute('data-file') || '';
      var codeEl = pre.querySelector('code');
      var raw = codeEl.textContent;
      codeEl.innerHTML = highlight(raw, lang);
      var wrap = document.createElement('div');
      var kind = (lang === 'bash' || lang === 'sh') ? ' term' : (lang === 'tree' ? ' tree' : '');
      wrap.className = 'code' + kind;
      var label = file || (lang === 'bash' ? 'Terminal' : (lang === 'tree' ? 'Project structure' : ''));
      wrap.innerHTML = '<div class="code-head"><span class="code-dots"><i></i><i></i><i></i></span>' +
        '<span class="code-file' + (file ? '' : ' dim') + '">' + esc(label) + '</span>' +
        (label === (LANG_LABEL[lang] || '') || lang === 'tree' ? '' : '<span class="code-lang">' + esc(LANG_LABEL[lang] || lang) + '</span>') +
        '<button class="copy-btn" type="button">' + COPY_ICON + '<span>Copy</span></button></div>';
      pre.parentNode.insertBefore(wrap, pre);
      wrap.appendChild(pre);
      (function (btn, text) {
        btn.addEventListener('click', function () {
          var clean = text.replace(/^\$ /gm, '');
          var done = function () {
            btn.className = 'copy-btn ok';
            btn.querySelector('span').textContent = 'Copied';
            setTimeout(function () { btn.className = 'copy-btn'; btn.querySelector('span').textContent = 'Copy'; }, 1600);
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(clean).then(done, function () { fallbackCopy(clean); done(); });
          } else { fallbackCopy(clean); done(); }
        });
      })(wrap.querySelector('.copy-btn'), raw);
    }
  }
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
  }

  /* ================================================================
     Rendering chapters
     ================================================================ */
  var ARROW_L = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"/></svg>';
  var ARROW_R = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>';

  function showChapter(id, anchor, fromSearch) {
    if (!BY_ID[id]) id = ORDER[0];
    var ch = BY_ID[id];
    var tpl = document.getElementById('tpl-' + id);
    var idx = ORDER.indexOf(id);
    var prev = idx > 0 ? BY_ID[ORDER[idx - 1]] : null;
    var next = idx < ORDER.length - 1 ? BY_ID[ORDER[idx + 1]] : null;

    var head = '<div class="ch-kicker"><span>Chapter ' + pad(ch.num) + '</span><span class="dot"></span><span class="grp">' + esc(ch.group) + '</span></div>' +
      '<h1 class="ch-title">' + esc(ch.title) + '</h1>' +
      '<p class="ch-sub">' + esc(ch.sub) + '</p>' +
      '<div class="ch-meta">';
    if (ch.time) head += '<span class="pill">&#9201; <b>' + esc(ch.time) + '</b></span>';
    if (ch.builds) head += '<span class="pill">&#128295; You build: <b>' + esc(ch.builds) + '</b></span>';
    head += '</div>';

    var pager = '<nav class="pager">' +
      (prev ? '<a class="prev" href="#' + prev.id + '"><div class="pg-l">' + ARROW_L + ' Previous</div><div class="pg-t">' + pad(prev.num) + '. ' + esc(prev.title) + '</div></a>' : '<span class="empty"></span>') +
      (next ? '<a class="next" href="#' + next.id + '"><div class="pg-l">Next ' + ARROW_R + '</div><div class="pg-t">' + pad(next.num) + '. ' + esc(next.title) + '</div></a>' : '<span class="empty"></span>') +
      '</nav><p class="kbd-hint">Tip: use <kbd>&larr;</kbd> <kbd>&rarr;</kbd> to move between chapters and <kbd>/</kbd> to search.</p>';

    contentEl.innerHTML = head;
    var body = document.createElement('div');
    body.className = 'ch-body';
    if (tpl) body.appendChild(document.importNode(tpl.content, true));
    contentEl.appendChild(body);
    contentEl.insertAdjacentHTML('beforeend', pager);
    contentEl.style.display = 'block';
    enhanceCode(body);
    buildRail(body);

    currentId = id;
    visited[id] = 1; saveVisited();
    updateSidebar();
    document.getElementById('hdrProgress').style.width = Math.round((idx + 1) / ORDER.length * 100) + '%';
    document.title = ch.title + ' — AdonisJS + Inertia';
    document.body.classList.remove('nav-open');

    if (anchor) {
      var target = document.getElementById(anchor);
      if (target) {
        setTimeout(function () {
          target.scrollIntoView({ behavior: fromSearch ? 'smooth' : 'auto', block: 'start' });
          if (fromSearch) { target.classList.add('flash-target'); }
        }, 30);
        return;
      }
    }
    window.scrollTo(0, 0);
  }

  var railLinks = [];
  function buildRail(body) {
    var hs = body.querySelectorAll('h2[id], h3[id]');
    if (hs.length < 2) { railEl.innerHTML = ''; railLinks = []; return; }
    var html = '<div class="rail-h">On this page</div>';
    for (var k = 0; k < hs.length; k++) {
      html += '<a href="#' + currentOrPending() + '/' + hs[k].id + '" data-t="' + hs[k].id + '" class="' + (hs[k].tagName === 'H3' ? 'lvl3' : '') + '">' + esc(hs[k].textContent) + '</a>';
    }
    railEl.innerHTML = html;
    railLinks = railEl.querySelectorAll('a');
  }
  var pendingId = null;
  function currentOrPending() { return pendingId || currentId; }

  function onScrollSpy() {
    if (!railLinks.length) return;
    var best = null;
    for (var k = 0; k < railLinks.length; k++) {
      var el = document.getElementById(railLinks[k].getAttribute('data-t'));
      if (el && el.getBoundingClientRect().top < 140) best = k;
    }
    for (var m = 0; m < railLinks.length; m++) railLinks[m].className = railLinks[m].className.replace(' on', '').replace(/^on$/, '') + (m === best ? ' on' : '');
  }
  window.addEventListener('scroll', onScrollSpy, { passive: true });

  /* ================================================================
     Routing
     ================================================================ */
  var navFromSearch = false;
  function route() {
    var h = (location.hash || '').replace(/^#/, '');
    var parts = h.split('/');
    var id = parts[0] || ORDER[0];
    var anchor = parts[1] || null;
    pendingId = BY_ID[id] ? id : ORDER[0];
    if (id === currentId && anchor) {
      var t = document.getElementById(anchor);
      if (t) {
        t.scrollIntoView({ behavior: 'smooth', block: 'start' });
        if (navFromSearch) t.classList.add('flash-target');
        navFromSearch = false;
        return;
      }
    }
    showChapter(pendingId, anchor, navFromSearch);
    navFromSearch = false;
  }
  window.addEventListener('hashchange', route);

  function go(id, anchor) {
    var h = '#' + id + (anchor ? '/' + anchor : '');
    if (location.hash === h) route(); else location.hash = h;
  }

  /* ================================================================
     Search — two pass: exact substring first, then tight fuzzy
     ================================================================ */
  var INDEX = [];
  function buildIndex() {
    for (var k = 0; k < ORDER.length; k++) {
      var ch = BY_ID[ORDER[k]];
      INDEX.push({ kind: 'chapter', id: ch.id, anchor: null, title: ch.title, crumb: 'Chapter ' + pad(ch.num) + ' · ' + ch.group, keywords: ch.keywords || '', order: k * 1000 });
      var tpl = document.getElementById('tpl-' + ch.id);
      if (!tpl) continue;
      var hs = tpl.content.querySelectorAll('h2[id], h3[id]');
      for (var m = 0; m < hs.length; m++) {
        INDEX.push({ kind: 'section', id: ch.id, anchor: hs[m].id, title: hs[m].textContent.replace(/\s+/g, ' ').trim(), crumb: pad(ch.num) + '. ' + ch.title, keywords: hs[m].getAttribute('data-k') || '', order: k * 1000 + m + 1 });
      }
    }
  }
  var fuse = null;
  function getFuse() {
    if (!fuse && window.Fuse) {
      fuse = new window.Fuse(INDEX, {
        keys: [{ name: 'title', weight: 0.75 }, { name: 'keywords', weight: 0.25 }],
        threshold: 0.22,
        distance: 50,
        includeScore: true,
        minMatchCharLength: 2,
        ignoreLocation: false
      });
    }
    return fuse;
  }

  function wordStart(text, pos) { return pos === 0 || /[\s\-\/(.:&+,]/.test(text.charAt(pos - 1)); }

  function runSearch(q) {
    q = q.trim();
    if (!q) return defaultResults();
    var ql = q.toLowerCase();
    var seen = {};
    var exact = [];
    for (var k = 0; k < INDEX.length; k++) {
      var it = INDEX[k];
      var tl = it.title.toLowerCase();
      var pos = tl.indexOf(ql);
      var score = null;
      if (pos !== -1) {
        score = (wordStart(tl, pos) ? 0 : 0.2) + (tl === ql ? -0.1 : 0) + pos * 0.002 + (it.kind === 'chapter' ? -0.05 : 0);
      } else if (ql.length >= 3 && it.keywords && (' ' + it.keywords.toLowerCase() + ' ').indexOf(ql) !== -1) {
        score = 0.45 + (it.kind === 'chapter' ? -0.05 : 0);
      }
      if (score !== null) { exact.push({ item: it, score: score, how: 'exact' }); seen[k] = 1; }
    }
    exact.sort(function (a, b) { return a.score - b.score || a.item.order - b.item.order; });
    var results = exact;
    if (results.length < 6 && ql.length >= 3 && getFuse()) {
      var fz = getFuse().search(q);
      for (var f = 0; f < fz.length; f++) {
        if (fz[f].score > 0.5) continue;
        var ri = INDEX.indexOf(fz[f].item);
        if (seen[ri]) continue;
        seen[ri] = 1;
        results.push({ item: fz[f].item, score: 1 + fz[f].score, how: 'fuzzy' });
      }
    }
    // per-chapter cap on sections
    var perCh = {};
    var capped = [];
    for (var r = 0; r < results.length && capped.length < 14; r++) {
      var itm = results[r].item;
      if (itm.kind === 'section') {
        perCh[itm.id] = (perCh[itm.id] || 0) + 1;
        if (perCh[itm.id] > 3) continue;
      }
      capped.push(results[r]);
    }
    return capped;
  }

  function defaultResults() {
    var res = [];
    var start = Math.max(0, ORDER.indexOf(currentId));
    for (var k = start; k < Math.min(ORDER.length, start + 6); k++) {
      res.push({ item: INDEX[0] && findChapterItem(ORDER[k]), score: 0, how: 'default' });
    }
    return res;
  }
  function findChapterItem(id) {
    for (var k = 0; k < INDEX.length; k++) if (INDEX[k].kind === 'chapter' && INDEX[k].id === id) return INDEX[k];
    return null;
  }

  // Title-only highlighting: exact typed substring, or the in-order characters
  // of the query found as a subsequence (prefix-first), never the whole word.
  function highlightTitle(title, q) {
    q = q.trim();
    if (!q) return esc(title);
    var tl = title.toLowerCase(), ql = q.toLowerCase();
    var pos = tl.indexOf(ql);
    if (pos !== -1) {
      return esc(title.slice(0, pos)) + '<mark>' + esc(title.slice(pos, pos + q.length)) + '</mark>' + esc(title.slice(pos + q.length));
    }
    // longest prefix of the query that appears contiguously
    var best = 0, bestPos = -1;
    for (var len = ql.length - 1; len >= 3; len--) {
      var pp = tl.indexOf(ql.slice(0, len));
      if (pp !== -1) { best = len; bestPos = pp; break; }
    }
    if (bestPos !== -1) {
      return esc(title.slice(0, bestPos)) + '<mark>' + esc(title.slice(bestPos, bestPos + best)) + '</mark>' + esc(title.slice(bestPos + best));
    }
    return esc(title);
  }

  var IC_CH = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5V21h16"/></svg>';
  var IC_SEC = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9h16M4 15h16M10 3 8 21M16 3l-2 18"/></svg>';

  var smBackdrop = document.getElementById('smBackdrop');
  var smInput = document.getElementById('smInput');
  var smResults = document.getElementById('smResults');
  var selIdx = 0;
  var current = [];

  function renderResults() {
    var q = smInput.value;
    current = runSearch(q);
    if (!current.length) {
      smResults.innerHTML = '<div class="sm-empty">No matches for <b>' + esc(q.trim()) + '</b>.<br>Try a concept like <i>transformer</i>, <i>flash</i>, or <i>policy</i>.</div>';
      return;
    }
    var html = '<div class="sm-sec">' + (q.trim() ? 'Results' : 'Continue reading') + '</div>';
    for (var k = 0; k < current.length; k++) {
      var it = current[k].item;
      if (!it) continue;
      html += '<div class="sm-item' + (k === selIdx ? ' sel' : '') + '" data-i="' + k + '">' +
        '<span class="sm-ic">' + (it.kind === 'chapter' ? IC_CH : IC_SEC) + '</span>' +
        '<span class="sm-txt"><div class="sm-title">' + highlightTitle(it.title, q) + '</div><div class="sm-crumb">' + esc(it.crumb) + '</div></span>' +
        '<span class="sm-go">&crarr;</span></div>';
    }
    smResults.innerHTML = html;
  }
  function moveSel(d) {
    if (!current.length) return;
    selIdx = (selIdx + d + current.length) % current.length;
    var items = smResults.querySelectorAll('.sm-item');
    for (var k = 0; k < items.length; k++) items[k].className = 'sm-item' + (k === selIdx ? ' sel' : '');
    var sel = items[selIdx];
    if (sel) {
      var r = sel.getBoundingClientRect(), cr = smResults.getBoundingClientRect();
      if (r.bottom > cr.bottom) smResults.scrollTop += r.bottom - cr.bottom + 6;
      if (r.top < cr.top) smResults.scrollTop -= cr.top - r.top + 6;
    }
  }
  function openResult(k) {
    var r = current[k];
    if (!r || !r.item) return;
    closeSearch();
    navFromSearch = true;
    go(r.item.id, r.item.anchor);
  }
  function openSearch() {
    smBackdrop.className = 'sm-backdrop open';
    smInput.value = '';
    selIdx = 0;
    renderResults();
    setTimeout(function () { smInput.focus(); }, 10);
  }
  function closeSearch() { smBackdrop.className = 'sm-backdrop'; smInput.blur(); }

  smInput.addEventListener('input', function () { selIdx = 0; renderResults(); smResults.scrollTop = 0; });
  smInput.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown') { e.preventDefault(); moveSel(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); moveSel(-1); }
    else if (e.key === 'Enter') { e.preventDefault(); openResult(selIdx); }
    else if (e.key === 'Escape') { e.preventDefault(); closeSearch(); }
  });
  smResults.addEventListener('click', function (e) {
    var el = e.target;
    while (el && el !== smResults && !(el.className && String(el.className).indexOf('sm-item') !== -1)) el = el.parentNode;
    if (el && el !== smResults) openResult(parseInt(el.getAttribute('data-i'), 10));
  });
  smResults.addEventListener('mousemove', function (e) {
    var el = e.target;
    while (el && el !== smResults && !(el.className && String(el.className).indexOf('sm-item') !== -1)) el = el.parentNode;
    if (el && el !== smResults) {
      var k = parseInt(el.getAttribute('data-i'), 10);
      if (k !== selIdx) { selIdx = k; moveSel(0); }
    }
  });
  smBackdrop.addEventListener('click', function (e) { if (e.target === smBackdrop) closeSearch(); });
  document.getElementById('smClose').addEventListener('click', closeSearch);
  document.getElementById('searchBtn').addEventListener('click', openSearch);

  /* ================================================================
     Global keys, menu
     ================================================================ */
  var isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
  document.getElementById('kbdHint').textContent = isMac ? '⌘ K' : 'Ctrl K';

  document.addEventListener('keydown', function (e) {
    var open = smBackdrop.className.indexOf('open') !== -1;
    if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K')) {
      e.preventDefault();
      if (open) closeSearch(); else openSearch();
      return;
    }
    if (open) return;
    var tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (e.key === '/') { e.preventDefault(); openSearch(); return; }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var idx = ORDER.indexOf(currentId);
    if (e.key === 'ArrowRight' && idx < ORDER.length - 1) go(ORDER[idx + 1]);
    if (e.key === 'ArrowLeft' && idx > 0) go(ORDER[idx - 1]);
  });

  document.getElementById('menuBtn').addEventListener('click', function () { document.body.classList.toggle('nav-open'); });
  document.getElementById('scrim').addEventListener('click', function () { document.body.classList.remove('nav-open'); });

  /* ================================================================
     Boot
     ================================================================ */
  buildSidebar();
  buildIndex();
  route();
})();
</script>
</body>
</html>
