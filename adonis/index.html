<p>A <strong>user</strong> owns many <strong>projects</strong>. A project has many <strong>tasks</strong>, and each task can have many <strong>comments</strong>. Users join other people's projects through the <strong>project_members</strong> pivot table, which also records their role. Each task remembers who created it and, optionally, who it is assigned to.</p>
<h2 id="migrations-create-the-models-and-migrations">Create the models and migrations</h2>
<p>Lucid follows a naming convention: the <code>Project</code> model maps to the <code>projects</code> table. Generate each model with its migration using the <code>-m</code> flag:</p>
<pre data-lang="bash"><code>$ node ace make:model Project -m
DONE:    create app/models/project.ts
DONE:    create database/migrations/1759150000001_create_projects_table.ts

$ node ace make:model Task -m
$ node ace make:model Comment -m
$ node ace make:migration create_project_members_table</code></pre>
<p>The timestamp prefix in each migration filename decides the order they run in, which matters for foreign keys: <code>projects</code> must exist before <code>tasks</code> can point at it. Generating them in this order keeps things correct.</p>
<h2 id="migrations-write-the-migrations">Write the migrations</h2>
<h4 class="step-h"><span class="step-badge">1</span><span>Projects</span></h4>
<pre data-lang="ts" data-file="database/migrations/1759150000001_create_projects_table.ts"><code>import { BaseSchema } from '@adonisjs/lucid/schema'

export default class extends BaseSchema {
  protected tableName = 'projects'

  async up() {
    this.schema.createTable(this.tableName, (table) =&gt; {
      table.increments('id')
      table
        .integer('user_id')
        .unsigned()
        .notNullable()
        .references('users.id')
        .onDelete('CASCADE')
      table.string('name', 120).notNullable()
      table.text('description').nullable()
      table.string('color', 20).notNullable().defaultTo('violet')
      table.string('status', 20).notNullable().defaultTo('active')

      table.timestamp('created_at').notNullable()
      table.timestamp('updated_at').nullable()
    })
  }

  async down() {
    this.schema.dropTable(this.tableName)
  }
}</code></pre>
<p>Every migration has two halves. <code>up()</code> applies the change; <code>down()</code> reverses it, so a rollback can undo exactly what <code>up()</code> did. <code>this.schema</code> is a <strong>Knex schema builder</strong> — Lucid is built on Knex, and its column methods (<code>increments</code>, <code>string</code>, <code>text</code>, <code>integer</code>, <code>timestamp</code>, <code>date</code>, <code>boolean</code>, …) are Knex's.</p>
<p>The <code>user_id</code> column uses <code>.references('users.id').onDelete('CASCADE')</code> to create a real foreign-key constraint: the database refuses a project that points at a missing user, and deleting a user deletes their projects.</p>
<div class="callout info"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/></svg></div><div class="callout-body"><div class="callout-t">snake_case in the database, camelCase in TypeScript</div><p>Columns are named <code>user_id</code> and <code>created_at</code> in SQL, but on models you will write <code>project.userId</code> and <code>project.createdAt</code>. Lucid converts between the two naming styles automatically, in both directions.</p></div></div>
<h4 class="step-h"><span class="step-badge">2</span><span>Project members (the pivot table)</span></h4>
<pre data-lang="ts" data-file="database/migrations/1759150000002_create_project_members_table.ts"><code>import { BaseSchema } from '@adonisjs/lucid/schema'

export default class extends BaseSchema {
  protected tableName = 'project_members'

  async up() {
    this.schema.createTable(this.tableName, (table) =&gt; {
      table.increments('id')
      table
        .integer('project_id')
        .unsigned()
        .notNullable()
        .references('projects.id')
        .onDelete('CASCADE')
      table
        .integer('user_id')
        .unsigned()
        .notNullable()
        .references('users.id')
        .onDelete('CASCADE')
      table.string('role', 20).notNullable().defaultTo('member')

      // A user can only join a given project once
      table.unique(['project_id', 'user_id'])

      table.timestamp('created_at').notNullable()
      table.timestamp('updated_at').nullable()
    })
  }

  async down() {
    this.schema.dropTable(this.tableName)
  }
}</code></pre>
<p>The composite <code>unique</code> index enforces a business rule at the database level. Even if a bug in your code tries to add the same member twice, the database will refuse.</p>
<h4 class="step-h"><span class="step-badge">3</span><span>Tasks</span></h4>
<pre data-lang="ts" data-file="database/migrations/1759150000003_create_tasks_table.ts"><code>import { BaseSchema } from '@adonisjs/lucid/schema'

export default class extends BaseSchema {
  protected tableName = 'tasks'

  async up() {
    this.schema.createTable(this.tableName, (table) =&gt; {
      table.increments('id')
      table
        .integer('project_id')
        .unsigned()
        .notNullable()
        .references('projects.id')
        .onDelete('CASCADE')
      table
        .integer('creator_id')
        .unsigned()
        .notNullable()
        .references('users.id')
        .onDelete('CASCADE')
      table
        .integer('assignee_id')
        .unsigned()
        .nullable()
        .references('users.id')
        .onDelete('SET NULL')

      table.string('title', 200).notNullable()
      table.text('notes').nullable()
      table.string('status', 20).notNullable().defaultTo('todo')
      table.string('priority', 20).notNullable().defaultTo('normal')
      table.date('due_on').nullable()
      table.timestamp('completed_at').nullable()

      table.timestamp('created_at').notNullable()
      table.timestamp('updated_at').nullable()

      // The task board always filters by project and status
      table.index(['project_id', 'status'])
    })
  }

  async down() {
    this.schema.dropTable(this.tableName)
  }
}</code></pre>
<p>Note the different delete behaviour for the two user references. If the task's <strong>creator</strong> is deleted, the task goes too (<code>CASCADE</code>). If the <strong>assignee</strong> is deleted, the task simply becomes unassigned (<code>SET NULL</code>). Encoding these rules in the schema means you never have to remember them in application code.</p>
<h4 class="step-h"><span class="step-badge">4</span><span>Comments</span></h4>
<pre data-lang="ts" data-file="database/migrations/1759150000004_create_comments_table.ts"><code>import { BaseSchema } from '@adonisjs/lucid/schema'

export default class extends BaseSchema {
  protected tableName = 'comments'

  async up() {
    this.schema.createTable(this.tableName, (table) =&gt; {
      table.increments('id')
      table.integer('task_id').unsigned().notNullable().references('tasks.id').onDelete('CASCADE')
      table.integer('user_id').unsigned().notNullable().references('users.id').onDelete('CASCADE')
      table.text('body').notNullable()
      table.timestamp('created_at').notNullable()
      table.timestamp('updated_at').nullable()
    })
  }

  async down() {
    this.schema.dropTable(this.tableName)
  }
}</code></pre>
<h2 id="migrations-run-them">Run them</h2>
<pre data-lang="bash"><code>$ node ace migration:run
❯ migrated database/migrations/1759150000001_create_projects_table
❯ migrated database/migrations/1759150000002_create_project_members_table
❯ migrated database/migrations/1759150000003_create_tasks_table
❯ migrated database/migrations/1759150000004_create_comments_table</code></pre>
<p>Lucid records each file in an <code>adonis_schema</code> table. Running <code>migration:run</code> again does nothing, because every migration has already been applied. If you made a mistake in the last batch, <code>node ace migration:rollback</code> runs the <code>down()</code> methods of that batch so you can fix the file and migrate again.</p>
<div class="callout warn"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg></div><div class="callout-body"><div class="callout-t">Never edit a migration that has run in production</div><p>Once a migration has been applied to a shared database, treat it as history. To change a table later, create a <em>new</em> migration with <code>alterTable</code>. Editing an old file does nothing for databases that already ran it, and makes your schema diverge between machines.</p></div></div>
<h2 id="migrations-the-generated-schema">The generated schema</h2>
<p>Here is the part that is new in AdonisJS 7. After migrating, open <code>database/schema.ts</code>. Lucid has inspected your database and written one class per table:</p>
<pre data-lang="ts" data-file="database/schema.ts (generated — excerpt)"><code>/**
 * This file is automatically generated
 * DO NOT EDIT manually
 * Run "node ace migration:run" command to re-generate this file
 */
import { BaseModel, column } from '@adonisjs/lucid/orm'
import { DateTime } from 'luxon'

export class TaskSchema extends BaseModel {
  static $columns = ['assigneeId', 'completedAt', 'createdAt', /* … */] as const
  $columns = TaskSchema.$columns
  @column()
  declare assigneeId: number | null
  @column.dateTime()
  declare completedAt: DateTime | null
  @column.date()
  declare dueOn: DateTime | null
  @column({ isPrimary: true })
  declare id: number
  @column()
  declare status: string
  // …
}</code></pre>
<p>In older AdonisJS versions you declared every column by hand on the model and had to keep it in sync with the migration. Now the migration is the single source of truth: models extend these generated classes, and nullability, dates and primary keys all come from the real database.</p>
<p>Dates become <strong>Luxon <code>DateTime</code></strong> objects. <code>date</code> columns (like <code>due_on</code>) use <code>@column.date()</code>, while timestamps use <code>@column.dateTime()</code>.</p>
<h2 id="migrations-narrow-the-types-with-schema-rules">Narrow the types with schema rules</h2>
<p><code>status</code> is a plain <code>string</code> in the database, but in Kazi it can only be <code>todo</code>, <code>doing</code> or <code>done</code>. Tell the generator about that in <code>database/schema_rules.ts</code>, which the starter kit wires up through <code>config/database.ts</code>:</p>
<pre data-lang="ts" data-file="database/schema_rules.ts"><code>import { type SchemaRules } from '@adonisjs/lucid/types/schema_generator'

export default {
  tables: {
    projects: {
      columns: {
        status: { tsType: `'active' | 'archived'`, decorators: [{ name: '@column' }] },
      },
    },
    tasks: {
      columns: {
        status: { tsType: `'todo' | 'doing' | 'done'`, decorators: [{ name: '@column' }] },
        priority: { tsType: `'low' | 'normal' | 'high'`, decorators: [{ name: '@column' }] },
      },
    },
  },
} satisfies SchemaRules</code></pre>
<p>Regenerate the schema by running <code>node ace migration:run</code> (or rolling back and migrating again). Now <code>task.status = 'finished'</code> is a compile-time error — the union type flows all the way to React through transformers, as you will see in chapter 9.</p>
<div class="callout tip"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></div><div class="callout-body"><div class="callout-t">Prefer PostgreSQL for production</div><p>SQLite (the kit's default, stored in <code>tmp/db.sqlite3</code>) is perfect for learning and for tests. Chapter 25 shows how to switch to PostgreSQL for deployment; your migrations will not need to change.</p></div></div>
<div class="callout recap"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div><div class="callout-body"><div class="callout-t">What you built in this chapter</div><ul><li>Designed Kazi's five tables and their relationships.</li><li>Wrote migrations with foreign keys, cascade rules, defaults and indexes.</li><li>Ran and rolled back migrations and understood the <code>adonis_schema</code> table.</li><li>Learned that <code>database/schema.ts</code> is generated from the database, and narrowed column types with schema rules.</li></ul></div></div>
</template>
<template id="tpl-models">
<p>A <strong>model</strong> is a TypeScript class that represents one table. You use it to query rows, create records, and — most importantly — navigate relationships: from a project to its tasks, from a task to its assignee. In AdonisJS 7 the model file only holds <em>behaviour</em>, because the columns already live in the generated schema class.</p>
<h2 id="models-the-project-model">The Project model</h2>
<p>Open the file <code>make:model</code> created. It is almost empty:</p>
<pre data-lang="ts" data-file="app/models/project.ts"><code>import { ProjectSchema } from '#database/schema'

export default class Project extends ProjectSchema {}</code></pre>
<p>That is already a working model — <code>Project.all()</code>, <code>Project.find(1)</code> and <code>Project.create({...})</code> all work. Let's add the relationships.</p>
<pre data-lang="ts" data-file="app/models/project.ts"><code>import { ProjectSchema } from '#database/schema'
import { belongsTo, hasMany, manyToMany, scope } from '@adonisjs/lucid/orm'
import type { BelongsTo, HasMany, ManyToMany } from '@adonisjs/lucid/types/relations'
import type { ModelQueryBuilderContract } from '@adonisjs/lucid/types/model'
import User from '#models/user'
import Task from '#models/task'

export default class Project extends ProjectSchema {
  /**
   * The user who created the project. The column is `user_id`,
   * but "owner" reads better than "user" everywhere else.
   */
  @belongsTo(() =&gt; User, { foreignKey: 'userId' })
  declare owner: BelongsTo&lt;typeof User&gt;

  @hasMany(() =&gt; Task)
  declare tasks: HasMany&lt;typeof Task&gt;

  /**
   * Teammates, through the project_members pivot table.
   * `role` is read from the pivot row.
   */
  @manyToMany(() =&gt; User, {
    pivotTable: 'project_members',
    pivotColumns: ['role'],
    pivotTimestamps: true,
  })
  declare members: ManyToMany&lt;typeof User&gt;

  /**
   * Projects the given user may see: ones they own,
   * plus ones they were invited to.
   */
  static visibleTo = scope(
    (query: ModelQueryBuilderContract&lt;typeof Project&gt;, user: User) =&gt; {
      query.where((q) =&gt; {
        q.where('user_id', user.id).orWhereHas('members', (members) =&gt; {
          members.where('users.id', user.id)
        })
      })
    }
  )
}</code></pre>
<h3 id="models-reading-the-relationship-decorators">Reading the relationship decorators</h3>
<ul><li><code>@belongsTo(() =&gt; User, { foreignKey: 'userId' })</code> — the project row holds the foreign key. By convention Lucid would look for <code>userId</code> on a relation called <code>user</code>; because we named the relation <code>owner</code>, we spell the key out.</li><li><code>@hasMany(() =&gt; Task)</code> — the <em>other</em> table holds the foreign key. Lucid infers <code>projectId</code> on <code>Task</code> from the model name <code>Project</code>.</li><li><code>@manyToMany(() =&gt; User, {...})</code> — neither table holds the key; the pivot table does. Lucid infers <code>project_id</code> and <code>user_id</code> as the pivot columns. <code>pivotColumns: ['role']</code> makes the role available as <code>member.$extras.pivot_role</code>, and <code>pivotTimestamps</code> fills the pivot's <code>created_at</code>/<code>updated_at</code> for you.</li></ul>
<p>The <code>() =&gt; User</code> arrow functions are not decoration: they let two model files import each other without a circular-import crash, because the class is only resolved when the relationship is first used.</p>
<h3 id="models-query-scopes">Query scopes</h3>
<p><code>visibleTo</code> is a <strong>query scope</strong> — a reusable chunk of query logic with a name. Kazi will need "projects this user may see" on the dashboard, the project list and in tests. Writing it once here keeps every one of those queries honest. You apply it like this:</p>
<pre data-lang="ts"><code>const projects = await Project.query().withScopes((scopes) =&gt; scopes.visibleTo(user))</code></pre>
<p><code>orWhereHas('members', ...)</code> compiles to an <code>EXISTS</code> subquery against the pivot table, so it stays fast even when projects have many members.</p>
<h2 id="models-the-task-model">The Task model</h2>
<pre data-lang="ts" data-file="app/models/task.ts"><code>import { TaskSchema } from '#database/schema'
import { belongsTo, hasMany } from '@adonisjs/lucid/orm'
import type { BelongsTo, HasMany } from '@adonisjs/lucid/types/relations'
import { DateTime } from 'luxon'
import Project from '#models/project'
import User from '#models/user'
import Comment from '#models/comment'

export default class Task extends TaskSchema {
  @belongsTo(() =&gt; Project)
  declare project: BelongsTo&lt;typeof Project&gt;

  @belongsTo(() =&gt; User, { foreignKey: 'creatorId' })
  declare creator: BelongsTo&lt;typeof User&gt;

  @belongsTo(() =&gt; User, { foreignKey: 'assigneeId' })
  declare assignee: BelongsTo&lt;typeof User&gt;

  @hasMany(() =&gt; Comment)
  declare comments: HasMany&lt;typeof Comment&gt;

  /**
   * Computed property: true when the task has a due date in the past
   * and is not finished yet. Transformers can expose getters like columns.
   */
  get isOverdue() {
    if (!this.dueOn || this.status === 'done') return false
    return this.dueOn &lt; DateTime.now().startOf('day')
  }

  /**
   * Keep completedAt in sync with the status in one place.
   */
  moveTo(status: Task['status']) {
    this.status = status
    this.completedAt = status === 'done' ? DateTime.now() : null
    return this
  }
}</code></pre>
<p>Two users are related to a task, so both relationships need an explicit <code>foreignKey</code>. Notice <code>moveTo</code> uses <code>Task['status']</code> — thanks to the schema rules from the previous chapter, that is the union <code>'todo' | 'doing' | 'done'</code>, not a loose string.</p>
<div class="callout tip"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></div><div class="callout-body"><div class="callout-t">Put domain rules on the model</div><p>"When a task is marked done, record when" is a rule about tasks, not about HTTP. Putting it in <code>moveTo()</code> means the controller, a background job, and a seeder all behave the same way. Controllers should coordinate; models should know the rules.</p></div></div>
<h2 id="models-the-comment-model">The Comment model</h2>
<pre data-lang="ts" data-file="app/models/comment.ts"><code>import { CommentSchema } from '#database/schema'
import { belongsTo } from '@adonisjs/lucid/orm'
import type { BelongsTo } from '@adonisjs/lucid/types/relations'
import Task from '#models/task'
import User from '#models/user'

export default class Comment extends CommentSchema {
  @belongsTo(() =&gt; Task)
  declare task: BelongsTo&lt;typeof Task&gt;

  @belongsTo(() =&gt; User, { foreignKey: 'userId' })
  declare author: BelongsTo&lt;typeof User&gt;
}</code></pre>
<h2 id="models-extend-the-user-model">Extend the User model</h2>
<p>The starter kit's <code>User</code> model composes the generated schema with the <code>withAuthFinder</code> mixin, which adds password hashing and a <code>verifyCredentials</code> method (chapter 16). Add the inverse relationships to it:</p>
<pre data-lang="ts" data-file="app/models/user.ts"><code>import { UserSchema } from '#database/schema'
import hash from '@adonisjs/core/services/hash'
import { compose } from '@adonisjs/core/helpers'
import { withAuthFinder } from '@adonisjs/auth/mixins/lucid'
import { hasMany, manyToMany } from '@adonisjs/lucid/orm'
import type { HasMany, ManyToMany } from '@adonisjs/lucid/types/relations'
import Project from '#models/project'

export default class User extends compose(UserSchema, withAuthFinder(hash)) {
  @hasMany(() =&gt; Project)
  declare ownedProjects: HasMany&lt;typeof Project&gt;

  @manyToMany(() =&gt; Project, { pivotTable: 'project_members' })
  declare projects: ManyToMany&lt;typeof Project&gt;

  get initials() {
    const [first, last] = this.fullName ? this.fullName.split(' ') : this.email.split('@')
    if (first &amp;&amp; last) {
      return `${first.charAt(0)}${last.charAt(0)}`.toUpperCase()
    }
    return `${first.slice(0, 2)}`.toUpperCase()
  }
}</code></pre>
<p><code>compose()</code> is how AdonisJS applies mixins to a class: <code>UserSchema</code> supplies the columns, <code>withAuthFinder(hash)</code> supplies auth behaviour, and your class adds relationships on top.</p>
<h2 id="models-relationship-methods-you-will-use">Relationship methods you will use</h2>
<table><thead><tr><th>Goal</th><th>Code</th></tr></thead><tbody><tr><td>Eager load with the query</td><td><code>Project.query().preload('owner').preload('tasks')</code></td></tr><tr><td>Load onto an existing instance</td><td><code>await project.load('members')</code></td></tr><tr><td>Create a child with the key set</td><td><code>await project.related('tasks').create({ title, creatorId })</code></td></tr><tr><td>Query through a relation</td><td><code>await project.related('tasks').query().where('status', 'todo')</code></td></tr><tr><td>Add a pivot row</td><td><code>await project.related('members').attach({ [user.id]: { role: 'member' } })</code></td></tr><tr><td>Remove a pivot row</td><td><code>await project.related('members').detach([user.id])</code></td></tr><tr><td>Count without loading</td><td><code>Project.query().withCount('tasks')</code> then <code>project.$extras.tasks_count</code></td></tr></tbody></table>
<div class="callout info"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/></svg></div><div class="callout-body"><div class="callout-t">preload vs load and the N+1 problem</div><p>If you fetch 20 projects and then read <code>project.owner</code> on each one, a naive ORM would run 1 query for the projects plus 20 for the owners — the "N+1" problem. <code>preload('owner')</code> runs exactly two queries total: one for projects, one for all their owners, then stitches them together. Lucid never lazy-loads automatically; accessing a relation you did not preload gives <code>undefined</code>, which makes N+1 bugs obvious instead of silent.</p></div></div>
<div class="callout recap"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div><div class="callout-body"><div class="callout-t">What you built in this chapter</div><ul><li>Created <code>Project</code>, <code>Task</code> and <code>Comment</code> models that extend generated schema classes.</li><li>Declared <code>belongsTo</code>, <code>hasMany</code> and <code>manyToMany</code> relationships, including custom foreign keys and pivot columns.</li><li>Wrote a <code>visibleTo</code> query scope that every listing will reuse.</li><li>Added a computed <code>isOverdue</code> getter and a <code>moveTo()</code> domain method.</li></ul></div></div>
</template>
<template id="tpl-seeding">
<p>An empty database makes it hard to build UI. Before writing pages, let's fill Kazi with believable teams, projects and tasks. AdonisJS separates this into two tools: <strong>factories</strong> describe <em>how</em> to make a fake record, and <strong>seeders</strong> decide <em>what</em> to create.</p>
<h2 id="seeding-factories">Factories</h2>
<h4 class="step-h"><span class="step-badge">1</span><span>Generate the factories</span></h4>
<pre data-lang="bash"><code>$ node ace make:factory Project
$ node ace make:factory Task</code></pre>
<h4 class="step-h"><span class="step-badge">2</span><span>Describe a fake task</span></h4>
<pre data-lang="ts" data-file="database/factories/task_factory.ts"><code>import factory from '@adonisjs/lucid/factories'
import Task from '#models/task'
import { DateTime } from 'luxon'

export const TaskFactory = factory
  .define(Task, async ({ faker }) =&gt; {
    return {
      title: faker.helpers.arrayElement([
        'Draft the launch announcement',
        'Fix login redirect on mobile',
        'Review pricing page copy',
        'Set up staging database backups',
        'Interview two beta customers',
        'Design empty states for the board',
        'Write onboarding email sequence',
        'Audit accessibility of forms',
      ]),
      notes: faker.helpers.maybe(() =&gt; faker.lorem.sentences(2), { probability: 0.5 }) ?? null,
      status: faker.helpers.arrayElement(['todo', 'todo', 'doing', 'done'] as const),
      priority: faker.helpers.arrayElement(['low', 'normal', 'normal', 'high'] as const),
      dueOn: faker.helpers.maybe(
        () =&gt; DateTime.now().plus({ days: faker.number.int({ min: -5, max: 21 }) }),
        { probability: 0.6 }
      ) ?? null,
    }
  })
  .state('done', (task) =&gt; {
    task.status = 'done'
    task.completedAt = DateTime.now()
  })
  .build()</code></pre>
<p><code>faker</code> is <strong>Faker.js</strong>, injected by the factory. <code>helpers.arrayElement</code> picks a random value, <code>helpers.maybe</code> returns a value only some of the time (useful for nullable columns), and <code>number.int</code> gives a random integer. A <strong>state</strong> is a named variation — <code>TaskFactory.apply('done')</code> builds a finished task.</p>
<h4 class="step-h"><span class="step-badge">3</span><span>Describe a fake project, with tasks</span></h4>
<pre data-lang="ts" data-file="database/factories/project_factory.ts"><code>import factory from '@adonisjs/lucid/factories'
import Project from '#models/project'
import { TaskFactory } from '#database/factories/task_factory'

export const ProjectFactory = factory
  .define(Project, async ({ faker }) =&gt; {
    return {
      name: faker.helpers.arrayElement([
        'Website relaunch',
        'Mobile app v2',
        'Q4 marketing push',
        'Customer onboarding',
        'Data warehouse',
        'Support playbook',
      ]),
      description: faker.company.catchPhrase(),
      color: faker.helpers.arrayElement(['violet', 'emerald', 'amber', 'sky', 'rose']),
      status: 'active' as const,
    }
  })
  .relation('tasks', () =&gt; TaskFactory)
  .build()</code></pre>
<p><code>.relation('tasks', () =&gt; TaskFactory)</code> teaches the project factory how to build children. When you later call <code>.with('tasks', 8)</code>, Lucid creates the project first and sets <code>projectId</code> on each task automatically.</p>
<h2 id="seeding-a-seeder-for-kazi">A seeder for Kazi</h2>
<pre data-lang="bash"><code>$ node ace make:seeder MainSeeder</code></pre>
<pre data-lang="ts" data-file="database/seeders/main_seeder.ts"><code>import { BaseSeeder } from '@adonisjs/lucid/seeders'
import User from '#models/user'
import { ProjectFactory } from '#database/factories/project_factory'

export default class extends BaseSeeder {
  async run() {
    /**
     * Three people. The password is hashed automatically by
     * the withAuthFinder mixin before the row is saved.
     */
    const [jane, otieno, amina] = await User.createMany([
      { fullName: 'Jane Wanjiku', email: 'jane@kazi.test', password: 'password123' },
      { fullName: 'Otieno Odhiambo', email: 'otieno@kazi.test', password: 'password123' },
      { fullName: 'Amina Hassan', email: 'amina@kazi.test', password: 'password123' },
    ])

    /**
     * Jane owns three projects, each with eight tasks she created.
     */
    const projects = await ProjectFactory.merge({ userId: jane.id })
      .with('tasks', 8, (task) =&gt; task.merge({ creatorId: jane.id }))
      .createMany(3)

    /**
     * Otieno and Amina join Jane's first two projects.
     */
    for (const project of projects.slice(0, 2)) {
      await project.related('members').attach({
        [otieno.id]: { role: 'member' },
        [amina.id]: { role: 'member' },
      })
    }

    /**
     * Otieno owns a project of his own that Jane cannot see.
     */
    await ProjectFactory.merge({ userId: otieno.id, name: 'Private research' })
      .with('tasks', 4, (task) =&gt; task.merge({ creatorId: otieno.id }))
      .create()
  }
}</code></pre>
<p><code>merge()</code> overrides generated attributes — here, it fills the foreign keys the factory cannot guess. The private project owned by Otieno is deliberate: it gives you something to test authorization against in chapter 17.</p>
<p>Now rebuild the database from scratch and seed it:</p>
<pre data-lang="bash"><code>$ node ace migration:fresh --seed</code></pre>
<div class="callout danger"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="m15 9-6 6M9 9l6 6"/></svg></div><div class="callout-body"><div class="callout-t">migration:fresh deletes everything</div><p><code>migration:fresh</code> drops <em>every</em> table and re-runs all migrations. It is ideal in development, and it will destroy your data anywhere else. AdonisJS refuses to run it in production unless you pass <code>--force</code>; do not.</p></div></div>
<h2 id="seeding-explore-the-data-in-the-repl">Explore the data in the REPL</h2>
<p>Time to put the models to work.</p>
<pre data-lang="bash"><code>$ node ace repl
&gt; await loadModels()
&gt; const jane = await models.user.findByOrFail('email', 'jane@kazi.test')</code></pre>
<h4 class="step-h"><span class="step-badge">4</span><span>Projects Jane can see</span></h4>
<pre data-lang="ts"><code>&gt; const visible = await models.project.query()
    .withScopes((s) =&gt; s.visibleTo(jane))
    .preload('owner')
    .withCount('tasks')
    .orderBy('created_at', 'desc')
&gt; visible.map((p) =&gt; `${p.name} by ${p.owner.fullName}: ${p.$extras.tasks_count} tasks`)</code></pre>
<p>You should see Jane's three projects and not Otieno's private one. <code>withCount('tasks')</code> adds a <code>COUNT</code> subquery and places the result in <code>$extras.tasks_count</code> without loading any task rows.</p>
<h4 class="step-h"><span class="step-badge">5</span><span>Counting with conditions</span></h4>
<pre data-lang="ts"><code>&gt; const board = await models.project.query()
    .where('id', visible[0].id)
    .withCount('tasks', (q) =&gt; q.where('status', 'done').as('done_count'))
    .withCount('tasks', (q) =&gt; q.as('total_count'))
    .firstOrFail()
&gt; board.$extras
{ done_count: 2, total_count: 8 }</code></pre>
<p>This is exactly the data the project list will need for its progress bars.</p>
<h4 class="step-h"><span class="step-badge">6</span><span>Nested preloads</span></h4>
<pre data-lang="ts"><code>&gt; const task = await models.task.query()
    .preload('assignee')
    .preload('comments', (q) =&gt; q.preload('author').orderBy('created_at'))
    .firstOrFail()
&gt; task.isOverdue</code></pre>
<p>The callback form of <code>preload</code> lets you filter, sort or preload <em>inside</em> the relationship. <code>task.isOverdue</code> runs your getter from the previous chapter.</p>
<div class="callout tip"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></div><div class="callout-body"><div class="callout-t">Query builder vs model instances</div><p><code>Project.query()</code> returns <strong>model instances</strong> with relationships and getters. For reports where you only need numbers, <code>db.from('tasks').count('* as total')</code> (with <code>import db from '@adonisjs/lucid/services/db'</code>) returns plain objects and skips model overhead. Kazi's dashboard will use both.</p></div></div>

<template id="tpl-routing">
<p>With data in place, Kazi needs URLs. In AdonisJS every URL is declared in <code>start/routes.ts</code> and handled by a <strong>controller</strong> method. There is no file-based routing and no client-side router: the server owns navigation, and Inertia simply follows along.</p>
<h2 id="routing-anatomy-of-a-route">Anatomy of a route</h2>
<pre data-lang="ts"><code>router.get('/projects/:id', [controllers.Projects, 'show'])
//     ^verb  ^pattern       ^controller          ^method</code></pre>
<ul><li>The <strong>verb</strong> (<code>get</code>, <code>post</code>, <code>put</code>, <code>patch</code>, <code>delete</code>) matches the HTTP method.</li><li>The <strong>pattern</strong> can contain parameters like <code>:id</code>, which arrive in the controller as <code>params.id</code>. Add <code>?</code> for an optional parameter (<code>:slug?</code>).</li><li>The <strong>handler</strong> is a tuple of controller reference and method name. TypeScript checks that the method exists.</li></ul>
<h2 id="routing-create-the-projects-controller">Create the projects controller</h2>
<pre data-lang="bash"><code>$ node ace make:controller projects
DONE:    create app/controllers/projects_controller.ts</code></pre>
<p>Start with two actions: a list and a detail page. For now, return plain objects so you can see data flowing; the next chapter replaces them with transformers.</p>
<pre data-lang="ts" data-file="app/controllers/projects_controller.ts"><code>import Project from '#models/project'
import type { HttpContext } from '@adonisjs/core/http'

export default class ProjectsController {
  /**
   * GET /projects
   */
  async index({ inertia, auth }: HttpContext) {
    const user = auth.getUserOrFail()

    const projects = await Project.query()
      .withScopes((scopes) =&gt; scopes.visibleTo(user))
      .orderBy('updated_at', 'desc')

    return inertia.render('projects/index', {
      projects: projects.map((project) =&gt; ({ id: project.id, name: project.name })),
    })
  }

  /**
   * GET /projects/:id
   */
  async show({ inertia, params, auth }: HttpContext) {
    const user = auth.getUserOrFail()

    const project = await Project.query()
      .where('id', params.id)
      .withScopes((scopes) =&gt; scopes.visibleTo(user))
      .firstOrFail()

    return inertia.render('projects/show', {
      project: { id: project.id, name: project.name },
    })
  }
}</code></pre>
<p>A few details are worth pausing on:</p>
<ul><li><code>auth.getUserOrFail()</code> returns the logged-in <code>User</code>, or throws if nobody is logged in. Because these routes will sit behind the <code>auth</code> middleware, it will never actually throw — but it gives you a non-nullable type, unlike <code>auth.user</code>.</li><li><code>firstOrFail()</code> throws a "row not found" exception when there is no match. AdonisJS's exception handler converts that into a <strong>404</strong> response automatically. You do not write <code>if (!project) return response.notFound()</code>.</li><li>Applying <code>visibleTo</code> in <code>show</code> is a security decision, not a convenience. Without it, anyone logged in could view any project by guessing its id. The query now <em>cannot</em> return a project the user may not see, so a forbidden project looks exactly like a missing one: 404.</li></ul>
<div class="callout warn"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg></div><div class="callout-body"><div class="callout-t">Scope the query, not just the UI</div><p>Hiding a link in React does not protect data. Anyone can type <code>/projects/7</code> into the address bar. Every controller action must enforce access on the server. Chapter 17 adds Bouncer policies for finer-grained rules like "only the owner may delete".</p></div></div>
<h2 id="routing-register-the-routes">Register the routes</h2>
<p>Add the projects routes inside the existing authenticated group:</p>
<pre data-lang="ts" data-file="start/routes.ts"><code>import { middleware } from '#start/kernel'
import { controllers } from '#generated/controllers'
import router from '@adonisjs/core/services/router'

router.on('/').renderInertia('home', {}).as('home')

router
  .group(() =&gt; {
    router.get('signup', [controllers.NewAccount, 'create'])
    router.post('signup', [controllers.NewAccount, 'store'])
    router.get('login', [controllers.Session, 'create'])
    router.post('login', [controllers.Session, 'store'])
  })
  .use(middleware.guest())

router
  .group(() =&gt; {
    router.on('/dashboard').renderInertia('dashboard', {}).as('dashboard')

    router.get('/projects', [controllers.Projects, 'index'])
    router
      .get('/projects/:id', [controllers.Projects, 'show'])
      .where('id', router.matchers.number())

    router.post('logout', [controllers.Session, 'destroy'])
  })
  .use(middleware.auth())</code></pre>
<p><code>.where('id', router.matchers.number())</code> does two jobs: <code>/projects/abc</code> no longer matches the route at all (so it is a clean 404 before your controller runs), and <code>params.id</code> arrives as a real <code>number</code> instead of a string.</p>
<div class="callout info"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/></svg></div><div class="callout-body"><div class="callout-t">Route groups</div><p><code>router.group(() =&gt; { ... })</code> lets you apply something to many routes at once. Here <code>.use(middleware.auth())</code> protects every route in the group. Groups can also add a URL prefix with <code>.prefix('/admin')</code> or a name prefix with <code>.as('admin')</code>, and they nest.</p></div></div>
<h2 id="routing-route-names-are-generated-for-you">Route names are generated for you</h2>
<p>Every route built from a controller tuple gets a <strong>name</strong> automatically, derived from the controller and method: <code>[controllers.Projects, 'index']</code> becomes <code>projects.index</code>, and <code>[controllers.NewAccount, 'create']</code> becomes <code>new_account.create</code>. You will use these names everywhere in React instead of hard-coded URLs.</p>
<p>Routes that do not point to a controller — like <code>router.on('/dashboard').renderInertia(...)</code> — have no controller to derive a name from, so they get one explicitly with <code>.as('dashboard')</code>.</p>
<p>List them all to check:</p>
<pre data-lang="bash"><code>$ node ace list:routes

METHOD  ROUTE ............................ HANDLER                    MIDDLEWARE
GET     / (home) ......................... renderInertia
GET     /signup (new_account.create) ..... NewAccountController.create  guest
POST    /signup (new_account.store) ...... NewAccountController.store   guest
GET     /login (session.create) .......... SessionController.create     guest
POST    /login (session.store) ........... SessionController.store      guest
GET     /dashboard (dashboard) ........... renderInertia                auth
GET     /projects (projects.index) ....... ProjectsController.index     auth
GET     /projects/:id (projects.show) .... ProjectsController.show      auth
POST    /logout (session.destroy) ........ SessionController.destroy    auth</code></pre>
<div class="callout tip"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></div><div class="callout-body"><div class="callout-t">Renaming a URL is now free</div><p>Because React links to <code>projects.show</code> rather than <code>/projects/7</code>, you can later change the pattern to <code>/p/:id</code> in one place and every link in the app follows. Chapter 11 shows this in action.</p></div></div>
<h2 id="routing-where-kazi-s-routes-are-heading">Where Kazi's routes are heading</h2>
<p>Here is the full set of routes you will add over the next chapters, so you can see the shape of the app. You do not need to paste this yet; each chapter adds its own lines.</p>
<table><thead><tr><th>Method</th><th>URL</th><th>Name</th><th>Purpose</th></tr></thead><tbody><tr><td>GET</td><td><code>/projects</code></td><td><code>projects.index</code></td><td>Searchable, paginated list</td></tr><tr><td>GET</td><td><code>/projects/create</code></td><td><code>projects.create</code></td><td>New-project form</td></tr><tr><td>POST</td><td><code>/projects</code></td><td><code>projects.store</code></td><td>Save a new project</td></tr><tr><td>GET</td><td><code>/projects/:id</code></td><td><code>projects.show</code></td><td>Task board</td></tr><tr><td>GET</td><td><code>/projects/:id/edit</code></td><td><code>projects.edit</code></td><td>Edit form</td></tr><tr><td>PUT</td><td><code>/projects/:id</code></td><td><code>projects.update</code></td><td>Save changes</td></tr><tr><td>DELETE</td><td><code>/projects/:id</code></td><td><code>projects.destroy</code></td><td>Delete</td></tr><tr><td>POST</td><td><code>/projects/:id/tasks</code></td><td><code>tasks.store</code></td><td>Quick-add a task</td></tr><tr><td>GET</td><td><code>/tasks/:id</code></td><td><code>tasks.show</code></td><td>Task detail + comments</td></tr><tr><td>PATCH</td><td><code>/tasks/:id/status</code></td><td><code>task_status.update</code></td><td>Move a task between columns</td></tr><tr><td>POST</td><td><code>/tasks/:id/comments</code></td><td><code>comments.store</code></td><td>Comment on a task</td></tr><tr><td>POST</td><td><code>/projects/:id/members</code></td><td><code>project_members.store</code></td><td>Invite a teammate</td></tr></tbody></table>
<div class="callout info"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg></div><div class="callout-body"><div class="callout-t">Static routes before dynamic ones</div><p>When you add <code>/projects/create</code> in chapter 13, it must be registered <em>before</em> <code>/projects/:id</code>, or <code>create</code> would be captured as an id. The <code>number()</code> matcher protects you here too, since <code>create</code> is not a number — but ordering static routes first is a good habit either way.</p></div></div>
<div class="callout recap"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div><div class="callout-body"><div class="callout-t">What you built in this chapter</div><ul><li>Understand route verbs, patterns, parameters and controller tuples.</li><li>Built <code>ProjectsController</code> with <code>index</code> and <code>show</code>, scoped to what the user may see.</li><li>Protected routes with a group and the <code>auth</code> middleware, and added a number matcher.</li><li>Know how route names are generated and how to inspect them with <code>list:routes</code>.</li></ul></div></div>
</template>
<template id="tpl-transformers">
<p>Passing <code>{ id, name }</code> by hand works, but it does not scale. Every page would re-invent how a project looks, dates would be serialized inconsistently, and React would have no idea what type the props are. AdonisJS 7 solves this with <strong>transformers</strong>: classes that turn a model into the plain object sent to the browser, and generate a matching TypeScript type as a side effect.</p>
<div class="callout info"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/></svg></div><div class="callout-body"><div class="callout-t">Why not just send the model?</div><p>A Lucid model contains far more than you want to expose — hashed passwords, internal flags, foreign keys, unloaded relations. A transformer is an explicit allow-list. If a field is not in the transformer, it never reaches the browser. That is both a security boundary and a contract with your frontend.</p></div></div>
<h2 id="transformers-your-first-transformer">Your first transformer</h2>
<pre data-lang="bash"><code>$ node ace make:transformer project
DONE:    create app/transformers/project_transformer.ts</code></pre>
<pre data-lang="ts" data-file="app/transformers/project_transformer.ts"><code>import type Project from '#models/project'
import { BaseTransformer } from '@adonisjs/core/transformers'
import UserTransformer from '#transformers/user_transformer'

export default class ProjectTransformer extends BaseTransformer&lt;Project&gt; {
  toObject() {
    return {
      ...this.pick(this.resource, [
        'id',
        'name',
        'description',
        'color',
        'status',
        'createdAt',
        'updatedAt',
      ]),

      /**
       * Only included when the controller preloaded `owner`.
       */
      owner: UserTransformer.transform(this.whenLoaded(this.resource.owner)),

      /**
       * Filled by withCount() in the controller. $extras holds any
       * computed column that is not part of the table.
       */
      taskCounts: {
        total: Number(this.resource.$extras.total_count ?? 0),
        done: Number(this.resource.$extras.done_count ?? 0),
      },
    }
  }
}</code></pre>
<p>The pieces:</p>
<ul><li><code>this.resource</code> is the model being transformed.</li><li><code>this.pick(resource, [...])</code> copies the listed properties. The list is type-checked against the model, so a typo like <code>'nmae'</code> is a compile error. <code>DateTime</code> values are serialized to ISO strings.</li><li><code>UserTransformer</code> ships with the starter kit. Nesting one transformer inside another is how you shape relationships.</li><li><code>this.whenLoaded(...)</code> returns the relation only if it was preloaded, and <code>undefined</code> otherwise. Without it, forgetting a <code>preload</code> would crash instead of simply omitting the field.</li></ul>
<p>Now the task transformer:</p>
<pre data-lang="bash"><code>$ node ace make:transformer task</code></pre>
<pre data-lang="ts" data-file="app/transformers/task_transformer.ts"><code>import type Task from '#models/task'
import { BaseTransformer } from '@adonisjs/core/transformers'
import UserTransformer from '#transformers/user_transformer'

export default class TaskTransformer extends BaseTransformer&lt;Task&gt; {
  toObject() {
    return {
      ...this.pick(this.resource, [
        'id',
        'projectId',
        'title',
        'notes',
        'status',
        'priority',
        'dueOn',
        'completedAt',
        'createdAt',
        'isOverdue',
      ]),
      assignee: UserTransformer.transform(this.whenLoaded(this.resource.assignee)),
    }
  }
}</code></pre>
<p><code>isOverdue</code> is the getter from chapter 6. Transformers treat getters exactly like columns, which is a clean way to ship derived values without duplicating logic in React.</p>
<h2 id="transformers-use-them-in-the-controller">Use them in the controller</h2>
<pre data-lang="ts" data-file="app/controllers/projects_controller.ts"><code>import Project from '#models/project'
import type { HttpContext } from '@adonisjs/core/http'
import ProjectTransformer from '#transformers/project_transformer'
import TaskTransformer from '#transformers/task_transformer'

export default class ProjectsController {
  async index({ inertia, auth }: HttpContext) {
    const user = auth.getUserOrFail()

    const projects = await Project.query()
      .withScopes((scopes) =&gt; scopes.visibleTo(user))
      .preload('owner')
      .withCount('tasks', (q) =&gt; q.as('total_count'))
      .withCount('tasks', (q) =&gt; q.where('status', 'done').as('done_count'))
      .orderBy('updated_at', 'desc')

    return inertia.render('projects/index', {
      projects: ProjectTransformer.transform(projects),
    })
  }

  async show({ inertia, params, auth }: HttpContext) {
    const user = auth.getUserOrFail()

    const project = await Project.query()
      .where('id', params.id)
      .withScopes((scopes) =&gt; scopes.visibleTo(user))
      .preload('owner')
      .preload('members')
      .firstOrFail()

    const tasks = await project
      .related('tasks')
      .query()
      .preload('assignee')
      .orderBy('created_at', 'desc')

    return inertia.render('projects/show', {
      project: ProjectTransformer.transform(project).useVariant('withMembers'),
      tasks: TaskTransformer.transform(tasks),
    })
  }
}</code></pre>
<p><code>transform()</code> accepts a single model or an array. Note that <code>show</code> sends <code>project</code> and <code>tasks</code> as <strong>two separate props</strong> rather than nesting tasks inside the project. That is deliberate: in chapter 19 you will refresh only the <code>tasks</code> prop after a change, which is only possible when it is its own top-level key.</p>
<h2 id="transformers-variants-different-shapes-for-different-pages">Variants: different shapes for different pages</h2>
<p>The board page needs the member list; the project cards do not. Rather than always sending members, add a <strong>variant</strong> — an alternative method that returns a different shape:</p>
<pre data-lang="ts" data-file="app/transformers/project_transformer.ts"><code>export default class ProjectTransformer extends BaseTransformer&lt;Project&gt; {
  toObject() {
    // … unchanged
  }

  /**
   * Used on the board, where we render avatars and the assignee picker.
   */
  withMembers() {
    return {
      ...this.toObject(),
      members: UserTransformer.transform(this.whenLoaded(this.resource.members)),
    }
  }
}</code></pre>
<p>Select it with <code>.useVariant('withMembers')</code>, as the <code>show</code> action above already does. Variants can also be <code>async</code> and receive the HTTP context through dependency injection — chapter 17 uses that to attach permission flags computed by policies.</p>
<h2 id="transformers-nesting-depth">Nesting depth</h2>
<p>Transformers limit how deeply they nest by default, which protects you from accidentally serializing huge graphs or infinite cycles (a user's projects' members' projects…). When you legitimately need a deeper tree — a task, its comments, and each comment's author — raise the limit explicitly with <code>.depth(n)</code>:</p>
<pre data-lang="ts"><code>comments: CommentTransformer.transform(this.whenLoaded(this.resource.comments))?.depth(2),</code></pre>
<p>You will write exactly this in the task page in chapter 13.</p>
<h2 id="transformers-the-generated-types">The generated types</h2>
<p>Save the files with the dev server running and look in <code>.adonisjs/client/data.d.ts</code>. You will find a <code>Data</code> namespace generated from your transformers:</p>
<pre data-lang="ts" data-file=".adonisjs/client/data.d.ts (generated — simplified)"><code>export namespace Data {
  export type User = {
    id: number
    fullName: string | null
    email: string
    createdAt: string
    updatedAt: string | null
    initials: string
  }
  export type Project = {
    id: number
    name: string
    description: string | null
    color: string
    status: 'active' | 'archived'
    createdAt: string
    updatedAt: string | null
    owner?: Data.User
    taskCounts: { total: number; done: number }
  }
  export namespace Project {
    export type Variants = {
      withMembers: Data.Project &amp; { members?: Data.User[] }
    }
  }
  export type Task = {
    id: number
    status: 'todo' | 'doing' | 'done'
    priority: 'low' | 'normal' | 'high'
    dueOn: string | null
    isOverdue: boolean
    assignee?: Data.User | null
    // …
  }
}</code></pre>
<p>Look at what happened to <code>status</code>: the union you declared in <code>schema_rules.ts</code> in chapter 5 travelled from the database schema, through the model, through the transformer, into a frontend type. Dates became <code>string</code>, because JSON has no date type. Optional relations became optional properties. This is the end-to-end type safety AdonisJS 7 is built around, and you did not write a single frontend type by hand.</p>
<div class="callout tip"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></div><div class="callout-body"><div class="callout-t">Use the Data types, never re-declare them</div><p>It is tempting to write <code>type Project = { id: number; name: string }</code> in a React file. Don't. Import <code>Data.Project</code> from <code>@generated/data</code> so that changing a transformer updates every component that depends on it — and TypeScript tells you which ones break.</p></div></div>
<div class="callout recap"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div><div class="callout-body"><div class="callout-t">What you built in this chapter</div><ul><li>Understand why transformers exist: an explicit allow-list plus generated types.</li><li>Wrote <code>ProjectTransformer</code> and <code>TaskTransformer</code> with <code>pick</code>, nested transformers and <code>whenLoaded</code>.</li><li>Exposed <code>withCount</code> results through <code>$extras</code> and a model getter as a field.</li><li>Added a <code>withMembers</code> variant and learned when to use <code>.depth()</code>.</li><li>Read the generated <code>Data</code> namespace and saw a column union type flow into React.</li></ul></div></div>
</template>
<template id="tpl-pages">
<p>The server side of the project list and board is done. Now React gets to render them. Every string you pass to <code>inertia.render()</code> points at a file in <code>inertia/pages/</code>, and the props you pass arrive as the component's props — with the types generated in the last chapter.</p>
<h2 id="pages-generate-the-pages">Generate the pages</h2>
<pre data-lang="bash"><code>$ node ace make:page projects/index
$ node ace make:page projects/show</code></pre>
<p>These create <code>inertia/pages/projects/index.tsx</code> and <code>inertia/pages/projects/show.tsx</code>. Because of the <code>indexPages</code> codegen hook, <code>inertia.render('projects/index', ...)</code> in your controller now type-checks both the page name and the props you pass.</p>
<h2 id="pages-the-layout">The layout</h2>
<p>Every logged-in page in Kazi shares a header with navigation. The starter kit already has <code>inertia/layouts/app.tsx</code>; add a <strong>Projects</strong> entry to its nav array:</p>
<pre data-lang="tsx" data-file="inertia/layouts/app.tsx"><code>import Logo from '~/components/logo'
import { type ReactNode } from 'react'

import FlashToasts from '~/components/flash_toasts'
import ThemeToggle from '~/components/theme_toggle'
import NavLink, { type NavItem } from '~/components/nav_link'

const nav: NavItem[] = [
  { label: 'Dashboard', route: 'dashboard', icon: House },
  { label: 'Projects', route: 'projects.index', icon: FolderKanban },
]

export default function AppLayout({ children }: { children: ReactNode }) {
  return (
    &lt;&gt;
      &lt;header className="header header--bar"&gt;
        &lt;div className="header__inner"&gt;
          &lt;Logo size={28} /&gt;
          &lt;div className="header__right"&gt;
            &lt;ThemeToggle /&gt;
            &lt;Form route="session.destroy"&gt;
              &lt;button type="submit" className="btn btn--secondary btn--sm"&gt;
                &lt;LogOut size={15} /&gt; Log out
              &lt;/button&gt;
            &lt;/Form&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/header&gt;

      &lt;nav className="subnav"&gt;
        &lt;div className="subnav__inner"&gt;
          {nav.map(({ label, route, icon: Icon }) =&gt; (
            &lt;NavLink key={label} route={route} className="subnav__item"&gt;
              {Icon &amp;&amp; &lt;Icon size={14} /&gt;}
              {label}
            &lt;/NavLink&gt;
          ))}
        &lt;/div&gt;
      &lt;/nav&gt;

      &lt;div className="app-main"&gt;{children}&lt;/div&gt;

<p><code>route: 'projects.index'</code> is type-checked: <code>NavItem['route']</code> is derived from the generated route registry, so a misspelled route name will not compile.</p>
<div class="callout info"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/></svg></div><div class="callout-body"><div class="callout-t">Persistent layouts</div><p>Pages attach a layout with a static property: <code>ProjectsIndex.layout = [AppLayout]</code>. When you navigate between two pages that share the same layout, Inertia keeps the layout component <strong>mounted</strong> and only swaps the page inside it. Header state survives, animations don't restart, and an audio player in the layout would keep playing. The value is an array because layouts can nest: <code>[AppLayout, SettingsLayout]</code>.</p></div></div>

<p>Read the prop types carefully:</p>
<ul><li><code>InertiaProps&lt;{ projects: Data.Project[] }&gt;</code> merges your page props with the <strong>shared props</strong> every page receives (like <code>user</code> and <code>errors</code>, defined in the Inertia middleware — chapter 15).</li><li><code>project.taskCounts.total</code>, <code>project.owner?.fullName</code>: all autocompleted, all checked. Remove <code>owner</code> from the transformer and this line turns red.</li><li><code>Page</code> is a small kit component that renders the heading and sets the browser tab title through Inertia's <code>&lt;Head&gt;</code>. With <code>VITE_APP_NAME=Kazi</code>, the tab reads "Projects - Kazi".</li></ul>

<h2 id="pages-reading-shared-props-anywhere-usepage">Reading shared props anywhere: usePage</h2>
<p>Page components receive props directly. Deeply nested components can read the current page too, with Inertia's <code>usePage()</code> hook:</p>
<pre data-lang="tsx" data-file="inertia/components/current_user.tsx"><code>import { usePage } from '@inertiajs/react'

  const { props } = usePage()
  if (!props.user) return null
  return &lt;span className="avatar"&gt;{props.user.initials}&lt;/span&gt;
}</code></pre>
<p><code>props.user</code> is fully typed because <code>inertia/types.ts</code> registers the shared props with Inertia's global config. Prefer passing props down for page-specific data; reach for <code>usePage()</code> for truly global data like the user or flash messages.</p>
<div class="callout recap"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div><div class="callout-body"><div class="callout-t">What you built in this chapter</div><ul><li>Generated pages with <code>make:page</code> and typed their props with <code>InertiaProps</code> and <code>Data.*</code>.</li><li>Added a nav entry to the persistent <code>AppLayout</code> and attached layouts with <code>.layout</code>.</li><li>Built the project list with progress bars and a three-column task board.</li><li>Used a variant type (<code>Data.Project.Variants[...]</code>) and a column union type in React.</li><li>Know when to use <code>usePage()</code> instead of props.</li></ul></div></div>

<template id="tpl-navigation">
<p>Kazi has pages, but a SPA is only as good as its navigation. In this chapter you'll learn every way to move between pages in Inertia — declarative links, active states, and navigation from code — while adding the task detail page.</p>
<h2 id="navigation-the-link-component">The Link component</h2>
<p>You have already used it. <code>Link</code> renders a real <code>&lt;a href&gt;</code> — so middle-click, "open in new tab" and screen readers all work — but intercepts normal clicks and performs an Inertia visit instead of a full page load.</p>
<p>Always import it from the AdonisJS package, not directly from Inertia:</p>
<pre data-lang="tsx"><code>import { Link } from '@adonisjs/inertia/react' // ✅ adds type-safe `route` prop
// import { Link } from '@inertiajs/react'      ❌ only knows raw hrefs</code></pre>
<p>The AdonisJS wrapper resolves route names to URLs:</p>
<pre data-lang="tsx"><code>&lt;Link route="projects.index"&gt;All projects&lt;/Link&gt;

&lt;Link route="projects.show" routeParams={{ id: project.id }}&gt;
  {project.name}
&lt;/Link&gt;

&lt;Link route="projects.index" qs={{ page: 2 }}&gt;
  Next page
&lt;/Link&gt;</code></pre>
<ul><li><code>route</code> must be a registered route name.</li><li><code>routeParams</code> must contain every parameter the route pattern declares, with the right names.</li><li><code>qs</code> builds a query string. When the route validates its query string (chapter 18), <code>qs</code> is type-checked too.</li></ul>
<p>Everything else is passed through to Inertia's own <code>Link</code>, so you can use its options:</p>
<pre data-lang="tsx"><code>&lt;Link route="projects.show" routeParams={{ id: 3 }} preserveScroll prefetch&gt;
  Website relaunch
&lt;/Link&gt;</code></pre>
<p><code>preserveScroll</code> keeps the scroll position after the visit; <code>prefetch</code> starts loading the page when the user hovers the link, so the click feels instant.</p>
<div class="callout tip"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></div><div class="callout-body"><div class="callout-t">Use a plain <code>&lt;a&gt;</code> for external URLs</div><p><code>Link</code> is for pages inside Kazi. For external sites or file downloads, use a normal <code>&lt;a href="..." target="_blank" rel="noreferrer"&gt;</code> so the browser handles it natively.</p></div></div>
<h2 id="navigation-active-navigation-navlink">Active navigation: NavLink</h2>
<p>The starter kit's <code>NavLink</code> (used in the layout) marks itself as current. It is a nice example of combining two helpers you'll use again:</p>
<pre data-lang="tsx" data-file="inertia/components/nav_link.tsx"><code>import { urlFor } from '~/client'
import { usePage } from '@inertiajs/react'
import { type ReactNode } from 'react'
import { Link } from '@adonisjs/inertia/react'

export type NavRoute = Parameters&lt;typeof urlFor&gt;[0]

export default function NavLink({
  route,
  exact = false,
  className,
  children,
}: {
  route: NavRoute
  exact?: boolean
  className?: string
  children: ReactNode
}) {
  const { url } = usePage()
  const href = urlFor(route)
  const path = url.split('?')[0]
  const isActive = exact ? path === href : path === href || path.startsWith(`${href}/`)

  return (
    &lt;Link href={href} className={className} aria-current={isActive ? 'page' : undefined}&gt;
      {children}
    &lt;/Link&gt;
  )
}</code></pre>
<ul><li><code>urlFor(name, params?)</code> from <code>inertia/client.ts</code> turns a route name into a URL string anywhere in React — useful when you need the URL itself rather than a link.</li><li><code>usePage().url</code> is the current URL, updated on every Inertia visit.</li></ul>
<p>Because <code>/projects/3</code> starts with <code>/projects/</code>, the <strong>Projects</strong> tab stays highlighted while you are on a board. That is exactly what we want.</p>
<h2 id="navigation-add-the-task-detail-page">Add the task detail page</h2>
<p>Clicking a task card should open the task. This needs all the pieces you have learned so far: a controller, a route, a transformer and a page.</p>
<h4 class="step-h"><span class="step-badge">1</span><span>Controller</span></h4>
<pre data-lang="bash"><code>$ node ace make:controller tasks</code></pre>
<pre data-lang="ts" data-file="app/controllers/tasks_controller.ts"><code>import Task from '#models/task'
import Project from '#models/project'
import type { HttpContext } from '@adonisjs/core/http'
import TaskTransformer from '#transformers/task_transformer'
import ProjectTransformer from '#transformers/project_transformer'

export default class TasksController {
  /**
   * GET /tasks/:id
   */
  async show({ inertia, params, auth }: HttpContext) {
    const user = auth.getUserOrFail()

    const task = await Task.query()
      .where('id', params.id)
      .preload('assignee')
      .preload('creator')
      .firstOrFail()

    /**
     * The visibility scope decides whether this user may see the task:
     * no visible project means a 404, exactly like a missing task.
     */
    const project = await Project.query()
      .where('id', task.projectId)
      .withScopes((scopes) =&gt; scopes.visibleTo(user))
      .preload('members')
      .preload('owner')
      .firstOrFail()

    return inertia.render('tasks/show', {
      task: TaskTransformer.transform(task),
      project: ProjectTransformer.transform(project).useVariant('withMembers'),
    })
  }
}</code></pre>
<p>The task is loaded first, then its project is loaded <strong>through the <code>visibleTo</code> scope</strong>. If the project is not visible to the user, <code>firstOrFail()</code> throws and the response is a 404. Once again, a task from Otieno's private project simply does not exist as far as Jane can tell. You will reuse this "load the parent through the scope" pattern in every task and comment action.</p>
<h4 class="step-h"><span class="step-badge">2</span><span>Route</span></h4>
<pre data-lang="ts" data-file="start/routes.ts"><code>router
  .get('/tasks/:id', [controllers.Tasks, 'show'])
  .where('id', router.matchers.number())</code></pre>
<p>Add it inside the authenticated group, next to the project routes.</p>
<h4 class="step-h"><span class="step-badge">3</span><span>Page</span></h4>
<pre data-lang="bash"><code>$ node ace make:page tasks/show</code></pre>

<h2 id="navigation-navigating-from-code-userouter">Navigating from code: useRouter</h2>
<p>Sometimes navigation is not a click on a link: a keyboard shortcut, a row in a table, a redirect after some client-side work. Use the <code>useRouter</code> hook from the AdonisJS package, which understands route names just like <code>Link</code> does.</p>
<p>Let's add two shortcuts to the board: <strong>n</strong> opens the new-project form, and <strong>Escape</strong> on a task page goes back to its board.</p>
<pre data-lang="tsx" data-file="inertia/hooks/use_shortcut.ts"><code>import { useEffect } from 'react'

export function useShortcut(key: string, handler: () =&gt; void) {
  useEffect(() =&gt; {
    function onKey(event: KeyboardEvent) {
      const target = event.target as HTMLElement
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(target.tagName)) return
      if (event.key === key &amp;&amp; !event.metaKey &amp;&amp; !event.ctrlKey) handler()
    }
    window.addEventListener('keydown', onKey)
    return () =&gt; window.removeEventListener('keydown', onKey)
  }, [key, handler])
}</code></pre>
<pre data-lang="tsx" data-file="inertia/pages/tasks/show.tsx (additions)"><code>import { useRouter } from '@adonisjs/inertia/react'
import { useShortcut } from '~/hooks/use_shortcut'

export default function TaskShow({ task, project }: PageProps) {
  const router = useRouter()

  useShortcut('Escape', () =&gt;
    router.visit({ route: 'projects.show', routeParams: { id: project.id } })
  )

  // … rest of the component
}</code></pre>
<p><code>router.visit({ route, routeParams })</code> resolves the URL and HTTP method from your route definitions, and TypeScript validates both. There are also verb-specific shortcuts — <code>router.get</code>, <code>router.post</code>, <code>router.patch</code>, <code>router.delete</code> — each of which only accepts routes registered for that verb. You'll use <code>router.patch</code> to move tasks between columns in chapter 19.</p>
<div class="callout info"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/></svg></div><div class="callout-body"><div class="callout-t">Inertia's own router</div><p><code>@inertiajs/react</code> also exports a plain <code>router</code> object (not a hook) that takes URLs instead of route names: <code>router.visit('/projects')</code>, <code>router.reload()</code>, <code>router.on('start', ...)</code>. Use the AdonisJS <code>useRouter</code> when you are navigating to a named route; use Inertia's <code>router</code> for URL-level operations like reloading the current page or listening to navigation events.</p></div></div>

<template id="tpl-validation">
<p>Before Kazi can accept input, it needs rules. AdonisJS uses <strong>VineJS</strong>, a fast schema-based validator that also produces TypeScript types for the validated data. You write the rules once on the server; the errors show up next to the right input in React without you writing any glue.</p>
<h2 id="validation-anatomy-of-a-validator">Anatomy of a validator</h2>
<pre data-lang="bash"><code>$ node ace make:validator project
DONE:    create app/validators/project.ts</code></pre>
<pre data-lang="ts" data-file="app/validators/project.ts"><code>import vine from '@vinejs/vine'

export const PROJECT_COLORS = ['violet', 'emerald', 'amber', 'sky', 'rose'] as const

/**
 * Field builders are functions so each validator gets fresh instances.
 */
const name = () =&gt; vine.string().trim().minLength(3).maxLength(120)
const description = () =&gt; vine.string().trim().maxLength(500).nullable()
const color = () =&gt; vine.enum(PROJECT_COLORS)

export const createProjectValidator = vine.create({
  name: name(),
  description: description(),
  color: color(),
})

export const updateProjectValidator = vine.create({
  name: name(),
  description: description(),
  color: color(),
  status: vine.enum(['active', 'archived'] as const),
})</code></pre>
<p><code>vine.create({...})</code> compiles a schema into a reusable, pre-compiled validator. Each field is a chain of rules read left to right:</p>
<ul><li><code>vine.string()</code> — must be a string. <code>.trim()</code> is a <strong>mutation</strong>, not a check: surrounding whitespace is removed before the next rules run and in the output.</li><li><code>.minLength(3).maxLength(120)</code> — length checks.</li><li><code>vine.enum([...] as const)</code> — must be one of the values. The <code>as const</code> makes the output type the union <code>'violet' | 'emerald' | ...</code> rather than <code>string</code>.</li><li><code>.nullable()</code> — <code>null</code> is accepted and passed through.</li></ul>
<div class="callout info"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/></svg></div><div class="callout-body"><div class="callout-t">Why nullable and not optional?</div><p>The starter kit's <code>config/bodyparser.ts</code> sets <code>convertEmptyStringsToNull: true</code>. When someone clears the description textarea, the server receives <code>null</code>, not <code>""</code>. So an optional text field in an HTML form is <strong>nullable</strong> in VineJS. Use <code>.optional()</code> for fields that may be <em>absent</em> from the payload entirely, such as a JSON API field.</p></div></div>
<h2 id="validation-using-a-validator">Using a validator</h2>
<p>In a controller, one line validates the request and gives you a typed result:</p>
<pre data-lang="ts"><code>const payload = await request.validateUsing(createProjectValidator)
//    ^ { name: string; description: string | null; color: 'violet' | 'emerald' | ... }</code></pre>
<p><code>validateUsing</code> reads the request body <em>and</em> query string, runs the validator, and either returns clean data or throws. You never touch the raw <code>request.all()</code> again, and you never save a field you didn't validate.</p>
<h2 id="validation-what-happens-when-validation-fails">What happens when validation fails</h2>
<p>This is where the stack earns its keep. Follow a failed submission of the new-project form:</p>
<ol><li>React's <code>Form</code> component sends <code>POST /projects</code> as an Inertia request.</li><li><code>request.validateUsing()</code> throws a validation exception.</li><li>The exception handler sees an Inertia request, <strong>flashes the errors to the session</strong>, and redirects back to the page the form came from.</li><li>Inertia follows the redirect with a <code>GET</code>. The Inertia middleware's <code>share()</code> method reads the flashed errors with <code>this.getValidationErrors(ctx)</code> and adds them to the page as the <code>errors</code> prop.</li><li>The <code>Form</code> component exposes <code>errors.name</code>, <code>errors.color</code>, … to your JSX.</li></ol>
<p>You wrote none of steps 3–5. The kit's middleware already contains:</p>
<pre data-lang="ts" data-file="app/middleware/inertia_middleware.ts (excerpt)"><code>return {
  errors: ctx.inertia.always(this.getValidationErrors(ctx)),
  // …
}</code></pre>
<div class="callout info"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/></svg></div><div class="callout-body"><div class="callout-t">JSON clients get JSON</div><p>If the same endpoint is called by a client that asks for JSON (an <code>Accept: application/json</code> header), AdonisJS responds with a <code>422</code> status and a JSON array of errors instead of redirecting. The same validator serves both.</p></div></div>
<h2 id="validation-kazi-s-other-validators">Kazi's other validators</h2>
<h4 class="step-h"><span class="step-badge">1</span><span>Tasks</span></h4>
<pre data-lang="ts" data-file="app/validators/task.ts"><code>import vine from '@vinejs/vine'

export const TASK_STATUSES = ['todo', 'doing', 'done'] as const
export const TASK_PRIORITIES = ['low', 'normal', 'high'] as const

const title = () =&gt; vine.string().trim().minLength(2).maxLength(200)

/**
 * Quick-add on the board: just a title and an optional priority.
 */
export const createTaskValidator = vine.create({
  title: title(),
  priority: vine.enum(TASK_PRIORITIES).optional(),
})

/**
 * Full edit form on the task page.
 */
export const updateTaskValidator = vine.create({
  title: title(),
  notes: vine.string().trim().maxLength(5000).nullable(),
  priority: vine.enum(TASK_PRIORITIES),
  assigneeId: vine.number().positive().withoutDecimals().nullable(),
  dueOn: vine.date().nullable(),

/**
 * Moving a card between columns.
