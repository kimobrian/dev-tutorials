export const taskStatusValidator = vine.create({
  status: vine.enum(TASK_STATUSES),
})</code></pre>
<p><code>vine.date()</code> accepts strings like <code>2026-10-05</code> from an <code>&lt;input type="date"&gt;</code>. The starter kit's <code>start/validator.ts</code> registers a global transform so validated dates come out as <strong>Luxon <code>DateTime</code></strong> objects — exactly the type Lucid date columns expect. That means <code>task.merge(payload)</code> just works.</p>
<h4 class="step-h"><span class="step-badge">2</span><span>Comments and team invites</span></h4>
<pre data-lang="ts" data-file="app/validators/comment.ts"><code>import vine from '@vinejs/vine'

export const commentValidator = vine.create({
  body: vine.string().trim().minLength(1).maxLength(2000),
})</code></pre>
<pre data-lang="ts" data-file="app/validators/project_member.ts"><code>import vine from '@vinejs/vine'

export const inviteMemberValidator = vine.create({
  email: vine
    .string()
    .trim()
    .toLowerCase()
    .email()
    .exists({ table: 'users', column: 'email' }),
})</code></pre>
<p><code>.exists({ table, column })</code> runs a database query: the email must belong to a registered user. Its sibling <code>.unique({ table, column })</code> does the opposite, and the kit's signup validator uses it to reject duplicate emails. Database rules run <em>after</em> the cheap rules, so an obviously malformed email never costs a query.</p>
<h2 id="validation-friendlier-messages">Friendlier messages</h2>
<p>Default messages are functional ("The name field must have at least 3 characters"). Kazi can do better. Register a messages provider once in <code>start/validator.ts</code>, the preload file the kit already created:</p>
<pre data-lang="ts" data-file="start/validator.ts"><code>import { DateTime } from 'luxon'
import vine, { VineDate, SimpleMessagesProvider } from '@vinejs/vine'

declare module '@vinejs/vine/types' {
  interface VineGlobalTransforms {
    date: DateTime
  }
}

VineDate.transform((value) =&gt; DateTime.fromJSDate(value))

vine.messagesProvider = new SimpleMessagesProvider(
  {
    'required': 'Please fill in {{ field }}',
    'minLength': '{{ field }} needs at least {{ min }} characters',
    'maxLength': '{{ field }} can be at most {{ max }} characters',
    'email': 'That does not look like an email address',
    'enum': 'Choose one of the listed options',
    'database.exists': 'No Kazi user has that email yet',
    'name.minLength': 'Give your project a name of at least {{ min }} characters',
  },
  {
    name: 'project name',
    dueOn: 'due date',
    assigneeId: 'assignee',
  }
)</code></pre>
<p>The first object maps <strong>rule names</strong> (optionally prefixed with a field, like <code>name.minLength</code>) to messages with <code>{{ placeholders }}</code>. The second maps field names to human labels, used wherever <code>{{ field }}</code> appears.</p>
<div class="callout tip"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></div><div class="callout-body"><div class="callout-t">Validate on the server, hint on the client</div><p>It is fine to add <code>required</code> or <code>maxLength</code> attributes to your HTML inputs for instant feedback, but they are a convenience only. The VineJS validator is the rule. Anything that reaches your controller must pass through it.</p></div></div>
<div class="callout recap"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div><div class="callout-body"><div class="callout-t">What you built in this chapter</div><ul><li>Wrote validators with string, enum, number, date, nullable and optional rules.</li><li>Understood the full error round-trip: exception → session flash → redirect → shared <code>errors</code> prop.</li><li>Used database rules (<code>exists</code>, <code>unique</code>) for invites and signups.</li><li>Customized messages and field labels globally.</li></ul></div></div>
</template>
<template id="tpl-forms">
<p>Kazi can display data; now people need to change it. Inertia offers two ways to submit data: the <strong><code>Form</code> component</strong>, which works with plain uncontrolled inputs, and the <strong><code>useForm</code> hook</strong>, which gives you controlled state. This chapter uses <code>Form</code> for everything it does best: classic create and edit pages.</p>
<h2 id="forms-a-shared-helper-for-visible-project">A shared helper for "visible project"</h2>
<p>Every mutation will start by loading a project the user is allowed to see. Put that in one place on the model:</p>
<pre data-lang="ts" data-file="app/models/project.ts (addition)"><code>export default class Project extends ProjectSchema {
  // … relationships and the visibleTo scope

  static findVisibleOrFail(id: number, user: User) {
    return Project.query()
      .where('id', id)
      .withScopes((scopes) =&gt; scopes.visibleTo(user))
      .firstOrFail()
  }
}</code></pre>
<h2 id="forms-creating-a-project">Creating a project</h2>
<h4 class="step-h"><span class="step-badge">1</span><span>Controller actions</span></h4>
<pre data-lang="ts" data-file="app/controllers/projects_controller.ts (additions)"><code>import { createProjectValidator, updateProjectValidator } from '#validators/project'

export default class ProjectsController {
  // … index and show

  /**
   * GET /projects/create
   */
  async create({ inertia }: HttpContext) {
    return inertia.render('projects/create', {})
  }

  /**
   * POST /projects
   */
  async store({ request, response, auth, session }: HttpContext) {
    const user = auth.getUserOrFail()
    const payload = await request.validateUsing(createProjectValidator)

    const project = await user.related('ownedProjects').create(payload)

    session.flash('success', `Project "${project.name}" created`)
    return response.redirect().toRoute('projects.show', { id: project.id })
  }
}</code></pre>
<p><code>user.related('ownedProjects').create(payload)</code> inserts a project with <code>userId</code> already set from the relationship, so you cannot forget the owner. After saving, the action <strong>redirects</strong> — it does not render. That is the Inertia (and classic web) pattern: mutations redirect, <code>GET</code> requests render. It means refreshing the page after creating a project never resubmits the form.</p>
<h4 class="step-h"><span class="step-badge">2</span><span>Routes</span></h4>
<pre data-lang="ts" data-file="start/routes.ts (inside the auth group)"><code>router.get('/projects', [controllers.Projects, 'index'])
router.get('/projects/create', [controllers.Projects, 'create'])
router.post('/projects', [controllers.Projects, 'store'])
router
  .get('/projects/:id', [controllers.Projects, 'show'])
  .where('id', router.matchers.number())</code></pre>
<h4 class="step-h"><span class="step-badge">3</span><span>Reusable fields</span></h4>
<p>Create and edit forms share their fields, so extract them. The component receives the <code>errors</code> object from the <code>Form</code> render prop and optional initial values:</p>
<pre data-lang="tsx" data-file="inertia/components/project_fields.tsx"><code>import type { Data } from '@generated/data'

const COLORS = ['violet', 'emerald', 'amber', 'sky', 'rose'] as const

type Props = {
  errors: Partial&lt;Record&lt;string, string&gt;&gt;
  project?: Data.Project
}

export default function ProjectFields({ errors, project }: Props) {
  return (
    &lt;&gt;
      &lt;div className="field"&gt;
        &lt;label className="field__label" htmlFor="name"&gt;Name&lt;/label&gt;

          id="name"
          name="name"
          className="field__input"

          aria-invalid={errors.name ? 'true' : 'false'}

        /&gt;
        {errors.name &amp;&amp; &lt;span className="field__error"&gt;{errors.name}&lt;/span&gt;}
      &lt;/div&gt;

      &lt;div className="field"&gt;

          id="description"
          name="description"
          rows={3}
          className="field__input"
          defaultValue={project?.description ?? ''}
          aria-invalid={errors.description ? 'true' : 'false'}
        /&gt;

      &lt;/div&gt;

      &lt;fieldset className="field"&gt;
        &lt;legend className="field__label"&gt;Colour&lt;/legend&gt;
        &lt;div style={{ display: 'flex', gap: 12 }}&gt;

                name="color"
                value={color}
                defaultChecked={(project?.color ?? 'violet') === color}
              /&gt;{' '}
              {color}
            &lt;/label&gt;
          ))}
        &lt;/div&gt;

    &lt;/&gt;
  )
}</code></pre>
<p>The inputs are <strong>uncontrolled</strong>: they have a <code>name</code> and a <code>defaultValue</code>, and React does not track their state. When the form submits, the <code>Form</code> component reads every named field, exactly like a native HTML form would.</p>
<h4 class="step-h"><span class="step-badge">4</span><span>The page</span></h4>
<pre data-lang="bash"><code>$ node ace make:page projects/create</code></pre>
<pre data-lang="tsx" data-file="inertia/pages/projects/create.tsx"><code>import Page from '~/components/page'

<p><code>&lt;Form route="projects.store"&gt;</code> knows from the route registry that <code>projects.store</code> is a <code>POST</code> to <code>/projects</code>. You never pass <code>method</code> or <code>action</code> — the AdonisJS wrapper deliberately does not accept them, so they cannot drift from the server. The render prop gives you:</p>
<ul><li><code>errors</code> — validation messages keyed by field name.</li><li><code>processing</code> — <code>true</code> while the request is in flight; use it to disable the button and prevent double submits.</li></ul>

<h2 id="forms-editing-and-deleting">Editing and deleting</h2>
<p>For now, only the <strong>owner</strong> may edit or delete a project. We'll enforce that by querying through the owner relationship; chapter 17 replaces this with a Bouncer policy.</p>
<pre data-lang="ts" data-file="app/controllers/projects_controller.ts (additions)"><code>  /**
   * GET /projects/:id/edit
   */
  async edit({ inertia, params, auth }: HttpContext) {
    const user = auth.getUserOrFail()
    const project = await user.related('ownedProjects').query().where('id', params.id).firstOrFail()

    return inertia.render('projects/edit', {
      project: ProjectTransformer.transform(project),
    })
  }

  /**
   * PUT /projects/:id
   */
  async update({ params, request, response, auth, session }: HttpContext) {
    const user = auth.getUserOrFail()
    const project = await user.related('ownedProjects').query().where('id', params.id).firstOrFail()

    const payload = await request.validateUsing(updateProjectValidator)
    await project.merge(payload).save()

    session.flash('success', 'Project updated')
    return response.redirect().toRoute('projects.show', { id: project.id })
  }

  /**
   * DELETE /projects/:id
   */
  async destroy({ params, response, auth, session }: HttpContext) {
    const user = auth.getUserOrFail()
    const project = await user.related('ownedProjects').query().where('id', params.id).firstOrFail()

    await project.delete()

    session.flash('success', `Deleted "${project.name}"`)
    return response.redirect().toRoute('projects.index')
  }</code></pre>
<p><code>merge(payload)</code> assigns only the validated fields; <code>save()</code> issues an <code>UPDATE</code> for the columns that actually changed and bumps <code>updated_at</code>. Deleting relies on the <code>CASCADE</code> foreign keys from chapter 5 to remove the project's tasks, comments and memberships.</p>
<pre data-lang="ts" data-file="start/routes.ts (inside the auth group)"><code>router.get('/projects/:id/edit', [controllers.Projects, 'edit']).where('id', router.matchers.number())
router.put('/projects/:id', [controllers.Projects, 'update']).where('id', router.matchers.number())
router.delete('/projects/:id', [controllers.Projects, 'destroy']).where('id', router.matchers.number())</code></pre>
<div class="callout info"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/></svg></div><div class="callout-body"><div class="callout-t">PUT and DELETE from a browser form</div><p>HTML forms can only send GET and POST. Inertia does not have that limitation because it sends requests with <code>fetch</code>, so <code>Form</code> really sends <code>PUT</code> and <code>DELETE</code>. After a <code>PUT</code>/<code>DELETE</code>, the Inertia middleware turns your redirect into a <code>303 See Other</code>, so the browser follows it with a <code>GET</code> rather than replaying the <code>DELETE</code> against the new URL.</p></div></div>
<pre data-lang="tsx" data-file="inertia/pages/projects/edit.tsx"><code>import Page from '~/components/page'
import AppLayout from '~/layouts/app'

import type { Data } from '@generated/data'

type PageProps = InertiaProps&lt;{ project: Data.Project }&gt;

export default function ProjectsEdit({ project }: PageProps) {
  return (
    &lt;Page title={`Edit ${project.name}`}&gt;
      &lt;Form route="projects.update" routeParams={{ id: project.id }}&gt;
        {({ errors, processing }) =&gt; (
          &lt;div className="auth__form" style={{ maxWidth: 520 }}&gt;
            &lt;ProjectFields errors={errors} project={project} /&gt;

            &lt;div className="field"&gt;
              &lt;label className="field__label" htmlFor="status"&gt;Status&lt;/label&gt;
              &lt;select id="status" name="status" className="field__input" defaultValue={project.status}&gt;
                &lt;option value="active"&gt;Active&lt;/option&gt;
                &lt;option value="archived"&gt;Archived&lt;/option&gt;
              &lt;/select&gt;
            &lt;/div&gt;

            &lt;div style={{ display: 'flex', gap: 8 }}&gt;
              &lt;button type="submit" className="btn btn--primary" disabled={processing}&gt;
                Save changes
              &lt;/button&gt;
              &lt;Link route="projects.show" routeParams={{ id: project.id }} className="btn btn--ghost"&gt;
                Cancel
              &lt;/Link&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        )}
      &lt;/Form&gt;

      &lt;hr style={{ margin: '32px 0' }} /&gt;

      &lt;Form route="projects.destroy" routeParams={{ id: project.id }}&gt;
        {({ processing }) =&gt; (
          &lt;button
            type="submit"
            className="btn btn--secondary"
            disabled={processing}
            onClick={(event) =&gt; {

ProjectsEdit.layout = [AppLayout]</code></pre>
<p>The delete button is its own tiny <code>Form</code> pointing at <code>projects.destroy</code> — the component infers <code>DELETE</code> from the route. Calling <code>event.preventDefault()</code> on the button click cancels the submission when the user backs out of the confirm dialog.</p>
<h2 id="forms-comments-on-tasks">Comments on tasks</h2>
<p>Comments show the <code>Form</code> component in a slightly different role: a small form embedded in a larger page that clears itself after success.</p>
<h4 class="step-h"><span class="step-badge">5</span><span>Transformer and controller</span></h4>
<pre data-lang="bash"><code>$ node ace make:transformer comment
$ node ace make:controller comments</code></pre>
<pre data-lang="ts" data-file="app/transformers/comment_transformer.ts"><code>import type Comment from '#models/comment'
import { BaseTransformer } from '@adonisjs/core/transformers'
import UserTransformer from '#transformers/user_transformer'

export default class CommentTransformer extends BaseTransformer&lt;Comment&gt; {
  toObject() {
    return {
      ...this.pick(this.resource, ['id', 'body', 'createdAt']),
      author: UserTransformer.transform(this.whenLoaded(this.resource.author)),
    }
  }
}</code></pre>
<pre data-lang="ts" data-file="app/controllers/comments_controller.ts"><code>import Task from '#models/task'
import Project from '#models/project'
import type { HttpContext } from '@adonisjs/core/http'
import { commentValidator } from '#validators/comment'

export default class CommentsController {
  /**
   * POST /tasks/:id/comments
   */
  async store({ params, request, response, auth }: HttpContext) {
    const user = auth.getUserOrFail()
    const task = await Task.findOrFail(params.id)
    await Project.findVisibleOrFail(task.projectId, user)

    const { body } = await request.validateUsing(commentValidator)
    await task.related('comments').create({ body, userId: user.id })

    return response.redirect().back()
  }
}</code></pre>
<p><code>response.redirect().back()</code> returns to the page the request came from — the task page — which re-renders with the new comment.</p>
<pre data-lang="ts" data-file="start/routes.ts (inside the auth group)"><code>router.post('/tasks/:id/comments', [controllers.Comments, 'store']).where('id', router.matchers.number())</code></pre>
<h4 class="step-h"><span class="step-badge">6</span><span>Include comments in the task</span></h4>
<p>Preload comments with their authors in <code>TasksController.show</code>, and add them to the transformer:</p>
<pre data-lang="ts" data-file="app/controllers/tasks_controller.ts (show, change)"><code>const task = await Task.query()
  .where('id', params.id)
  .preload('assignee')
  .preload('creator')
  .preload('comments', (comments) =&gt; comments.preload('author').orderBy('created_at', 'asc'))
  .firstOrFail()</code></pre>
<pre data-lang="ts" data-file="app/transformers/task_transformer.ts (change)"><code>import CommentTransformer from '#transformers/comment_transformer'

// inside toObject()
return {
  ...this.pick(this.resource, [/* … */]),
  assignee: UserTransformer.transform(this.whenLoaded(this.resource.assignee)),
  comments: CommentTransformer.transform(this.whenLoaded(this.resource.comments))?.depth(2),
}</code></pre>
<p>The <code>depth(2)</code> allows the transformer tree task → comments → author to be serialized fully, as discussed in chapter 9.</p>
<h4 class="step-h"><span class="step-badge">7</span><span>The comment form</span></h4>
<pre data-lang="tsx" data-file="inertia/components/task_comments.tsx"><code>import { Form } from '@adonisjs/inertia/react'

<div class="callout recap"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div><div class="callout-body"><div class="callout-t">What you built in this chapter</div><ul><li>Added <code>Project.findVisibleOrFail()</code> so every mutation starts from a permitted project.</li><li>Built create, edit and delete for projects with the <code>Form</code> component and uncontrolled inputs.</li><li>Learned the "mutations redirect, GETs render" rule and how PUT/DELETE redirects become 303s.</li><li>Posted comments with a self-resetting form that preserves scroll.</li></ul></div></div>

<template id="tpl-useform">
<p>The <code>Form</code> component is perfect when the browser can own the input state. But some forms need React to know the values as they change: a submit button that only enables when something changed, a select that shows or hides other fields, a value that must be converted before sending. For those, Inertia provides the <strong><code>useForm</code> hook</strong>.</p>
<div class="callout info"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/></svg></div><div class="callout-body"><div class="callout-t">Form or useForm?</div><p>Reach for <code>Form</code> first — less code, native behaviour. Switch to <code>useForm</code> when you need to <em>read</em> field values while the user types: conditional fields, live previews, "unsaved changes" warnings, or data that must be reshaped before it is sent.</p></div></div>
<h2 id="useform-quick-add-tasks-on-the-board">Quick-add tasks on the board</h2>
<h4 class="step-h"><span class="step-badge">1</span><span>The server side</span></h4>
<pre data-lang="ts" data-file="app/controllers/tasks_controller.ts (addition)"><code>import { createTaskValidator } from '#validators/task'

  /**
   * POST /projects/:id/tasks
   */
  async store({ params, request, response, auth }: HttpContext) {
    const user = auth.getUserOrFail()
    const project = await Project.findVisibleOrFail(params.id, user)

    const payload = await request.validateUsing(createTaskValidator)
    await project.related('tasks').create({ ...payload, creatorId: user.id })

<pre data-lang="ts" data-file="start/routes.ts (inside the auth group)"><code>router.post('/projects/:id/tasks', [controllers.Tasks, 'store']).where('id', router.matchers.number())</code></pre>
<p>The route name is <code>tasks.store</code> because the handler is <code>TasksController.store</code>, even though the URL lives under <code>/projects</code>. Names follow controllers, URLs follow your information architecture.</p>
<h4 class="step-h"><span class="step-badge">2</span><span>The component</span></h4>
<pre data-lang="tsx" data-file="inertia/components/quick_add_task.tsx"><code>import { type FormEvent } from 'react'
import { useForm } from '@inertiajs/react'
import { urlFor } from '~/client'
import type { Data } from '@generated/data'

export default function QuickAddTask({ projectId }: { projectId: number }) {
  const form = useForm({
    title: '',
    priority: 'normal' as Data.Task['priority'],
  })

  function submit(event: FormEvent) {
    event.preventDefault()
    form.post(urlFor('tasks.store', { id: projectId }), {
      preserveScroll: true,
      onSuccess: () =&gt; form.reset('title'),
    })
  }

  return (
    &lt;form onSubmit={submit} className="quick-add" style={{ display: 'flex', gap: 8, marginBottom: 16 }}&gt;
      &lt;input
        className="field__input"
        placeholder="Add a task and press Enter…"
        value={form.data.title}
        onChange={(event) =&gt; form.setData('title', event.target.value)}
        aria-invalid={form.errors.title ? 'true' : 'false'}
      /&gt;

      &lt;select
        className="field__input"
        style={{ width: 130 }}
        value={form.data.priority}
        onChange={(event) =&gt; form.setData('priority', event.target.value as Data.Task['priority'])}
      &gt;
        &lt;option value="low"&gt;Low&lt;/option&gt;
        &lt;option value="normal"&gt;Normal&lt;/option&gt;
        &lt;option value="high"&gt;High&lt;/option&gt;
      &lt;/select&gt;

      &lt;button className="btn btn--primary" disabled={form.processing || !form.data.title.trim()}&gt;
        Add
      &lt;/button&gt;

      {form.recentlySuccessful &amp;&amp; &lt;span className="field__hint"&gt;Added ✓&lt;/span&gt;}
      {form.errors.title &amp;&amp; &lt;span className="field__error"&gt;{form.errors.title}&lt;/span&gt;}
    &lt;/form&gt;
  )
}</code></pre>
<p>Line by line:</p>
<ul><li><code>useForm({ title: '', priority: 'normal' })</code> creates form state. The initial object also defines the <strong>type</strong> of <code>form.data</code> and which keys can appear in <code>form.errors</code>.</li><li><code>form.setData('title', value)</code> updates one field. Inputs are <strong>controlled</strong>: their <code>value</code> comes from <code>form.data</code>.</li><li><code>form.post(url, options)</code> submits <code>form.data</code>. <code>useForm</code> takes plain URLs, so <code>urlFor('tasks.store', { id })</code> from <code>inertia/client.ts</code> builds a type-checked one from the route name.</li><li><code>onSuccess: () =&gt; form.reset('title')</code> clears only the title, keeping the chosen priority for the next task — handy when adding several high-priority tasks in a row.</li><li><code>form.recentlySuccessful</code> is <code>true</code> for two seconds after a success. Free feedback, no timers.</li><li><code>form.processing</code> disables the button while the request is in flight.</li></ul>
<p>Drop it into the board page, above the columns:</p>
<pre data-lang="tsx" data-file="inertia/pages/projects/show.tsx (change)"><code>import QuickAddTask from '~/components/quick_add_task'

// inside &lt;Page&gt;, before &lt;div className="board"&gt;
&lt;QuickAddTask projectId={project.id} /&gt;</code></pre>
<p>Add a few tasks. Each one appears in the <strong>To do</strong> column immediately, because the redirect back re-runs <code>ProjectsController.show</code> and Inertia swaps in the fresh <code>tasks</code> prop. There is no client-side cache to update and no optimistic state to reconcile.</p>
<h2 id="useform-the-task-editor">The task editor</h2>
<p>The task page gets an edit form with several field types: text, textarea, select, and date. This is where <code>useForm</code>'s extra features pay off.</p>
<h4 class="step-h"><span class="step-badge">3</span><span>The server side</span></h4>
<pre data-lang="ts" data-file="app/controllers/tasks_controller.ts (addition)"><code>import { updateTaskValidator } from '#validators/task'

  /**
   * PUT /tasks/:id
   */
  async update({ params, request, response, auth, session }: HttpContext) {
    const user = auth.getUserOrFail()
    const task = await Task.findOrFail(params.id)
    const project = await Project.findVisibleOrFail(task.projectId, user)

    const payload = await request.validateUsing(updateTaskValidator)

    /**
     * The assignee must belong to the project.
     */
    if (payload.assigneeId) {
      await project.load('members')
      const allowed = [project.userId, ...project.members.map((member) =&gt; member.id)]
      if (!allowed.includes(payload.assigneeId)) {
        session.flash('error', 'Tasks can only be assigned to project members.')
        return response.redirect().back()
      }
    }

    await task.merge(payload).save()

    session.flash('success', 'Task saved')
    return response.redirect().back()
  }</code></pre>
<p>The membership check is a <em>business rule</em> that depends on data (who is on this project), so it lives in the controller after validation rather than in the schema. The UI will only offer members, but the server never trusts the UI.</p>
<pre data-lang="ts" data-file="start/routes.ts (inside the auth group)"><code>router.put('/tasks/:id', [controllers.Tasks, 'update']).where('id', router.matchers.number())</code></pre>
<h4 class="step-h"><span class="step-badge">4</span><span>The component</span></h4>
<pre data-lang="tsx" data-file="inertia/components/task_editor.tsx"><code>import { type FormEvent } from 'react'
import { useForm } from '@inertiajs/react'
import { urlFor } from '~/client'
import type { Data } from '@generated/data'

type Props = {
  task: Data.Task
  members: Data.User[]
}

export default function TaskEditor({ task, members }: Props) {
  const form = useForm({
    title: task.title,
    notes: task.notes ?? '',
    priority: task.priority,
    assigneeId: task.assignee?.id ? String(task.assignee.id) : '',
    dueOn: task.dueOn ? task.dueOn.slice(0, 10) : '',
  })

  function submit(event: FormEvent) {
    event.preventDefault()
    // Reshape the payload for this submission only
    form.transform((data) =&gt; ({
      ...data,
      assigneeId: data.assigneeId ? Number(data.assigneeId) : null,
      dueOn: data.dueOn || null,
    }))

    form.put(urlFor('tasks.update', { id: task.id }), {
      preserveScroll: true,
      onSuccess: () =&gt; form.setDefaults(),
    })
  }

  return (
    &lt;form onSubmit={submit} className="auth__form" style={{ maxWidth: 560 }}&gt;
      &lt;div className="field"&gt;
        &lt;label className="field__label" htmlFor="title"&gt;Title&lt;/label&gt;
        &lt;input
          id="title"
          className="field__input"
          value={form.data.title}
          onChange={(e) =&gt; form.setData('title', e.target.value)}
        /&gt;
        {form.errors.title &amp;&amp; &lt;span className="field__error"&gt;{form.errors.title}&lt;/span&gt;}
      &lt;/div&gt;

      &lt;div className="field"&gt;
        &lt;label className="field__label" htmlFor="notes"&gt;Notes&lt;/label&gt;
        &lt;textarea
          id="notes"
          rows={4}
          className="field__input"
          value={form.data.notes}
          onChange={(e) =&gt; form.setData('notes', e.target.value)}
        /&gt;
      &lt;/div&gt;

      &lt;div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 12 }}&gt;
        &lt;div className="field"&gt;
          &lt;label className="field__label" htmlFor="priority"&gt;Priority&lt;/label&gt;
          &lt;select
            id="priority"
            className="field__input"
            value={form.data.priority}
            onChange={(e) =&gt; form.setData('priority', e.target.value as Data.Task['priority'])}
          &gt;
            &lt;option value="low"&gt;Low&lt;/option&gt;
            &lt;option value="normal"&gt;Normal&lt;/option&gt;
            &lt;option value="high"&gt;High&lt;/option&gt;
          &lt;/select&gt;
        &lt;/div&gt;

        &lt;div className="field"&gt;
          &lt;label className="field__label" htmlFor="assignee"&gt;Assignee&lt;/label&gt;
          &lt;select
            id="assignee"
            className="field__input"
            value={form.data.assigneeId}
            onChange={(e) =&gt; form.setData('assigneeId', e.target.value)}
          &gt;
            &lt;option value=""&gt;Nobody&lt;/option&gt;
            {members.map((member) =&gt; (
              &lt;option key={member.id} value={member.id}&gt;
                {member.fullName ?? member.email}
              &lt;/option&gt;
            ))}
          &lt;/select&gt;
          {form.errors.assigneeId &amp;&amp; &lt;span className="field__error"&gt;{form.errors.assigneeId}&lt;/span&gt;}
        &lt;/div&gt;

        &lt;div className="field"&gt;
          &lt;label className="field__label" htmlFor="dueOn"&gt;Due date&lt;/label&gt;
          &lt;input
            id="dueOn"
            type="date"
            className="field__input"
            value={form.data.dueOn}
            onChange={(e) =&gt; form.setData('dueOn', e.target.value)}
          /&gt;
          {form.errors.dueOn &amp;&amp; &lt;span className="field__error"&gt;{form.errors.dueOn}&lt;/span&gt;}
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div style={{ display: 'flex', gap: 8, alignItems: 'center' }}&gt;
        &lt;button className="btn btn--primary" disabled={!form.isDirty || form.processing}&gt;
          Save task
        &lt;/button&gt;
        {form.isDirty &amp;&amp; (
          &lt;button type="button" className="btn btn--ghost" onClick={() =&gt; form.reset()}&gt;
            Discard changes
          &lt;/button&gt;
        )}
      &lt;/div&gt;
    &lt;/form&gt;
  )
}</code></pre>
<p>The new pieces:</p>
<ul><li><strong><code>form.isDirty</code></strong> compares current data with the defaults. The Save button stays disabled until something actually changes, and a <strong>Discard changes</strong> button appears.</li><li><strong><code>form.transform(fn)</code></strong> registers a function that reshapes the data just before the next submission, without touching the form state. In React it is a separate call, made before <code>form.put()</code>. HTML selects and inputs deal in strings; the server wants a number or <code>null</code>. The transform bridges the two so the inputs stay simple.</li><li><strong><code>form.setDefaults()</code></strong> after success makes the saved values the new baseline, so <code>isDirty</code> becomes <code>false</code> again.</li></ul>
<p>Wire it into the task page, passing the owner plus members as the assignee options:</p>
<pre data-lang="tsx" data-file="inertia/pages/tasks/show.tsx (change)"><code>import TaskEditor from '~/components/task_editor'
import TaskComments from '~/components/task_comments'

// inside the component
const people = [project.owner, ...(project.members ?? [])].filter(
  (person): person is Data.User =&gt; Boolean(person)

// inside &lt;Page&gt;
&lt;TaskEditor task={task} members={people} /&gt;
&lt;TaskComments task={task} /&gt;</code></pre>

<template id="tpl-shared-data">
<p>Your controllers have been calling <code>session.flash('success', '…')</code> for a while. Let's look at how those messages reach the screen, and at the mechanism behind it: <strong>shared data</strong>, the props every page receives without any controller passing them.</p>
<h2 id="shared-data-the-inertia-middleware">The Inertia middleware</h2>
<p>Everything global flows through one file, <code>app/middleware/inertia_middleware.ts</code>. The kit's version looks like this:</p>
<pre data-lang="ts" data-file="app/middleware/inertia_middleware.ts"><code>import type { HttpContext } from '@adonisjs/core/http'
import type { NextFn } from '@adonisjs/core/types/http'
import UserTransformer from '#transformers/user_transformer'
import BaseInertiaMiddleware from '@adonisjs/inertia/inertia_middleware'

export default class InertiaMiddleware extends BaseInertiaMiddleware {
  share(ctx: HttpContext) {
    const { auth, request } = ctx as Partial&lt;HttpContext&gt;

    const theme: 'light' | 'dark' =
      request?.plainCookie('app_theme', { defaultValue: 'light', encoded: false }) ?? 'light'

    return {
      errors: ctx.inertia.always(this.getValidationErrors(ctx)),
      user: ctx.inertia.always(auth?.user ? UserTransformer.transform(auth.user) : undefined),
      preferences: ctx.inertia.always({ theme }),
    }
  }

  flash(ctx: HttpContext) {
    const { session } = ctx as Partial&lt;HttpContext&gt;

    const success: string | undefined = session?.flashMessages.get('success')
    const error: string | undefined = session?.flashMessages.get('error')

    return { success, error }
  }

  async handle(ctx: HttpContext, next: NextFn) {
    await this.init(ctx)
    const output = await next()
    this.dispose(ctx)
    return output
  }
}

declare module '@adonisjs/inertia/types' {
  type MiddlewareSharedProps = InferSharedProps&lt;InertiaMiddleware&gt;
  export interface SharedProps extends MiddlewareSharedProps {}
}</code></pre>
<p>Three methods, three jobs:</p>
<ul><li><strong><code>share(ctx)</code></strong> returns props merged into <em>every</em> page's props.</li><li><strong><code>flash(ctx)</code></strong> returns one-time messages. They travel in a separate <code>flash</code> field of the page object, not in <code>props</code>.</li><li><strong><code>handle()</code></strong> wires the middleware into the request. Leave it as is.</li></ul>
<div class="callout warn"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg></div><div class="callout-body"><div class="callout-t">The context may be half-built</div><p>The middleware runs as <em>server</em> middleware, so it also renders pages for requests that never reached a route — a 404, for example. In that case the session and auth middleware never ran, and <code>ctx.auth</code> is <code>undefined</code>. That is why the kit writes <code>const { auth } = ctx as Partial&lt;HttpContext&gt;</code> and uses <code>auth?.user</code>. Always keep that defensive style when you add shared data.</p></div></div>
<h2 id="shared-data-flash-messages-end-to-end">Flash messages, end to end</h2>
<ol><li>A controller calls <code>session.flash('success', 'Task saved')</code> and redirects.</li><li>The session stores the message for exactly <strong>one</strong> more request.</li><li>On the next request, <code>flash()</code> reads it and it lands on the page object as <code>flash.success</code>.</li><li>The kit's <code>FlashToasts</code> component, rendered by <code>AppLayout</code>, turns it into a toast:</li></ol>
<pre data-lang="tsx" data-file="inertia/components/flash_toasts.tsx"><code>import { useEffect } from 'react'
import { toast, Toaster } from 'sonner'
import { router, usePage } from '@inertiajs/react'

export default function FlashToasts() {
  const { flash } = usePage()

  useEffect(() =&gt; {
    return router.on('start', () =&gt; toast.dismiss('flash'))
  }, [])

  useEffect(() =&gt; {
    if (flash.error) toast.error(flash.error, { id: 'flash' })
    if (flash.success) toast.success(flash.success, { id: 'flash' })
  }, [flash])

  return &lt;Toaster position="top-center" toastOptions={{ unstyled: true }} /&gt;
}</code></pre>
<p><code>router.on('start', …)</code> subscribes to Inertia's navigation events: when any new visit starts, the old toast is dismissed. The function it returns unsubscribes, which is exactly what <code>useEffect</code> cleanup expects. Because flash data is stripped from browser history, pressing <strong>Back</strong> never replays an old "Project deleted" toast.</p>
<h3 id="shared-data-adding-a-new-flash-type">Adding a new flash type</h3>
<p>Kazi wants an informational toast too, for things that are neither success nor failure. Add it to the middleware…</p>
<pre data-lang="ts" data-file="app/middleware/inertia_middleware.ts (flash method)"><code>flash(ctx: HttpContext) {
  const { session } = ctx as Partial&lt;HttpContext&gt;

  const success: string | undefined = session?.flashMessages.get('success')
  const error: string | undefined = session?.flashMessages.get('error')
  const info: string | undefined = session?.flashMessages.get('info')

  return { success, error, info }
}</code></pre>
<p>…and handle it in <code>FlashToasts</code>:</p>
<pre data-lang="tsx" data-file="inertia/components/flash_toasts.tsx (change)"><code>useEffect(() =&gt; {
  if (flash.error) toast.error(flash.error, { id: 'flash' })
  if (flash.success) toast.success(flash.success, { id: 'flash' })
  if (flash.info) toast.info(flash.info, { id: 'flash' })
}, [flash])</code></pre>
<p><code>flash.info</code> type-checks immediately. <code>inertia/types.ts</code> registers <code>Data.FlashMessages</code> — generated from the return type of your <code>flash()</code> method — with Inertia's global config, so <code>usePage().flash</code> always matches the server.</p>
<h2 id="shared-data-shared-data-an-open-task-badge">Shared data: an open-task badge</h2>
<p>Let's put a number next to <strong>Dashboard</strong> in the nav: how many unfinished tasks are assigned to me. Every page needs it, so it belongs in <code>share()</code>.</p>
<pre data-lang="ts" data-file="app/middleware/inertia_middleware.ts (share method)"><code>import db from '@adonisjs/lucid/services/db'

/**
 * share() may be async, so it can run a query.
 */
async share(ctx: HttpContext) {
  const { auth, request } = ctx as Partial&lt;HttpContext&gt;
  // … theme as before

  const openTaskCount = auth?.user ? await this.countOpenTasks(auth.user.id) : 0

  return {
    errors: ctx.inertia.always(this.getValidationErrors(ctx)),
    user: ctx.inertia.always(auth?.user ? UserTransformer.transform(auth.user) : undefined),
    preferences: ctx.inertia.always({ theme }),

    /**
     * Unfinished tasks assigned to the current user.
     * always() so it refreshes even during partial reloads.
     */
    openTaskCount: ctx.inertia.always(openTaskCount),
  }
}

private async countOpenTasks(userId: number) {
  const row = await db
    .from('tasks')
    .where('assignee_id', userId)
    .whereNot('status', 'done')
    .count('* as total')
    .first()
  return Number(row?.total ?? 0)
}</code></pre>
<p><code>share()</code> is allowed to return a promise, which is what makes the query possible. The query itself uses Lucid's <code>db</code> service directly instead of the <code>Task</code> model — we only need a number, so there is no reason to build model instances.</p>
<p>Show the badge in the layout:</p>
<pre data-lang="tsx" data-file="inertia/layouts/app.tsx (change)"><code>import { usePage } from '@inertiajs/react'

export default function AppLayout({ children }: { children: ReactNode }) {
  const { props } = usePage()

  // …
  {nav.map(({ label, route, icon: Icon }) =&gt; (
    &lt;NavLink key={label} route={route} className="subnav__item"&gt;
      {Icon &amp;&amp; &lt;Icon size={14} /&gt;}
      {label}
      {route === 'dashboard' &amp;&amp; props.openTaskCount &gt; 0 &amp;&amp; (
        &lt;span className="badge"&gt;{props.openTaskCount}&lt;/span&gt;
      )}
    &lt;/NavLink&gt;

}</code></pre>
<div class="callout info"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/></svg></div><div class="callout-body"><div class="callout-t">Why always()?</div><p>In chapter 19 you'll use <strong>partial reloads</strong> to refresh just one prop (say, <code>tasks</code>) after a change. Shared props are normally skipped during partial reloads, to keep them cheap. But when a task moves to <em>Done</em>, the badge must update too. <code>ctx.inertia.always()</code> opts a prop into every response, partial or not. Use it for small, cheap values that must stay in sync — errors, the user, counters — and avoid it for anything expensive.</p></div></div>
<div class="callout tip"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></div><div class="callout-body"><div class="callout-t">Keep share() lean</div><p>Everything in <code>share()</code> runs on every Inertia request in the app. A single <code>COUNT</code> on an indexed column is fine. A heavy query is not — put it on the page that needs it, or make it a deferred prop (chapter 20).</p></div></div>

<template id="tpl-authentication">
<p>Kazi has had working login since chapter 2 — the starter kit wrote it. Now that you understand controllers, validators and forms, it is time to read that code properly, because you will be extending it. By the end you will know exactly what happens when someone signs in.</p>
<h2 id="authentication-the-session-guard">The session guard</h2>
<p>AdonisJS authentication is organized around <strong>guards</strong>. A guard knows how to recognize a user on a request. The kit configures one guard, <code>web</code>, which uses a <strong>session cookie</strong> — the right choice for a browser app like Kazi.</p>
<pre data-lang="ts" data-file="config/auth.ts"><code>import { defineConfig } from '@adonisjs/auth'
import { sessionGuard, sessionUserProvider } from '@adonisjs/auth/session'

const authConfig = defineConfig({
  default: 'web',

  guards: {
    web: sessionGuard({
      useRememberMeTokens: false,
      provider: sessionUserProvider({
        model: () =&gt; import('#models/user'),
      }),
    }),
  },
})

export default authConfig</code></pre>
<p>When a user logs in, the guard stores their id in the session. On later requests, the session middleware reads the signed session cookie, the guard looks up the user through the <strong>provider</strong> (the <code>User</code> model), and <code>ctx.auth.user</code> is filled in.</p>
<div class="callout info"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/></svg></div><div class="callout-body"><div class="callout-t">Why sessions and not tokens?</div><p>With Inertia, your frontend and backend share one origin. Session cookies are <code>HttpOnly</code> (invisible to JavaScript, so XSS cannot steal them), are sent automatically, and are protected against CSRF by Shield. Access tokens are for clients that are <em>not</em> your web app — mobile apps and third-party integrations. AdonisJS has an access-tokens guard for those; Kazi does not need it.</p></div></div>
<h2 id="authentication-passwords-and-verifycredentials">Passwords and verifyCredentials</h2>
<p>The <code>User</code> model composes the <code>withAuthFinder</code> mixin:</p>
<pre data-lang="ts" data-file="app/models/user.ts (excerpt)"><code>export default class User extends compose(UserSchema, withAuthFinder(hash)) {
  // …
}</code></pre>
<p>The mixin does two things. It adds a hook that <strong>hashes the password</strong> whenever it changes, so <code>User.create({ password: 'plain' })</code> stores a hash (scrypt by default, configured in <code>config/hash.ts</code>). And it adds <code>User.verifyCredentials(email, password)</code>, which finds the user and checks the password in a <strong>timing-safe</strong> way: it takes the same time whether the email exists or not, so attackers cannot probe which emails are registered.</p>
<h2 id="authentication-reading-the-kit-s-controllers">Reading the kit's controllers</h2>
<pre data-lang="ts" data-file="app/controllers/session_controller.ts"><code>import User from '#models/user'
import { loginValidator } from '#validators/user'
import type { HttpContext } from '@adonisjs/core/http'

export default class SessionController {
  async create({ inertia }: HttpContext) {
    return inertia.render('auth/login', {})
  }

  async store({ request, auth, response }: HttpContext) {
    const { email, password } = await request.validateUsing(loginValidator)
    const user = await User.verifyCredentials(email, password)

    await auth.use('web').login(user)
    response.redirect().toRoute('dashboard')
  }

  async destroy({ auth, response }: HttpContext) {
    await auth.use('web').logout()
    response.redirect().toRoute('session.create')
  }
}</code></pre>
<ul><li><code>create</code> renders the login page (<code>inertia/pages/auth/login.tsx</code>, a <code>Form</code> pointing at <code>session.store</code>).</li><li><code>store</code> validates, verifies credentials, and calls <code>auth.use('web').login(user)</code>. If the credentials are wrong, <code>verifyCredentials</code> throws an "invalid credentials" exception that AdonisJS turns into a flashed error and a redirect back to the form — no <code>try/catch</code> needed.</li><li><code>destroy</code> logs out and sends the user to the login page.</li></ul>
<p>The signup controller (<code>NewAccountController</code>) follows the same shape: validate with <code>signupValidator</code> (which uses <code>.unique()</code> on the email and <code>.sameAs('password')</code> on the confirmation), create the user, log them in, redirect.</p>
<h2 id="authentication-the-three-auth-middleware">The three auth middleware</h2>
<table><thead><tr><th>Middleware</th><th>Registered as</th><th>Behaviour</th></tr></thead><tbody><tr><td><code>silent_auth_middleware</code></td><td>router middleware (every route)</td><td>Calls <code>auth.check()</code>; never blocks. Makes <code>auth.user</code> available on public pages.</td></tr><tr><td><code>auth_middleware</code></td><td>named: <code>middleware.auth()</code></td><td>Redirects guests to <code>/login</code>.</td></tr><tr><td><code>guest_middleware</code></td><td>named: <code>middleware.guest()</code></td><td>Redirects logged-in users <em>away</em> from login/signup.</td></tr></tbody></table>
<p>The guest middleware redirects to <code>/</code> by default. For Kazi, a logged-in user visiting <code>/login</code> should land on their dashboard:</p>
<pre data-lang="ts" data-file="app/middleware/guest_middleware.ts (change)"><code>export default class GuestMiddleware {
  /**
   * The URL to redirect to when the user is already logged in
   */
  redirectTo = '/dashboard'
  // …
}</code></pre>
<h2 id="authentication-three-ways-to-read-the-user">Three ways to read the user</h2>
<pre data-lang="ts"><code>auth.user              // User | undefined  — fine on public pages
auth.isAuthenticated   // boolean
auth.getUserOrFail()   // User — throws if nobody is logged in</code></pre>
<p>In routes protected by <code>middleware.auth()</code>, prefer <code>getUserOrFail()</code>: TypeScript then knows the user exists, and you avoid sprinkling <code>auth.user!</code> non-null assertions around.</p>
<h2 id="authentication-a-smarter-home-page">A smarter home page</h2>
<p>Kazi's marketing home page is pointless for someone who is already logged in. Replace the <code>renderInertia</code> route with a small <strong>closure route</strong> that decides:</p>
<pre data-lang="ts" data-file="start/routes.ts (change)"><code>router
  .get('/', async ({ auth, response, inertia }) =&gt; {
    if (auth.isAuthenticated) {
      return response.redirect().toRoute('dashboard')
    }
    return inertia.render('home', {})
  })
  .as('home')</code></pre>
<p>Closure routes are handy for tiny handlers like this one. <code>auth.isAuthenticated</code> is already known here because the silent-auth middleware ran before the route handler.</p>
<h2 id="authentication-landing-on-something-useful-after-signup">Landing on something useful after signup</h2>
<p>New users start with nothing. Send them straight to the new-project form with a friendly nudge:</p>
<pre data-lang="ts" data-file="app/controllers/new_account_controller.ts (store, change)"><code>async store({ request, response, auth, session }: HttpContext) {
  const { fullName, email, password } = await request.validateUsing(signupValidator)
  const user = await User.create({ fullName, email, password })

  await auth.use('web').login(user)

  session.flash('info', 'Welcome to Kazi! Start by creating your first project.')
  return response.redirect().toRoute('projects.create')
}</code></pre>
<h2 id="authentication-optional-remember-me">Optional: "Remember me"</h2>
<p>By default, a session ends when the session cookie expires. A remember-me token keeps users logged in for weeks across browser restarts. It needs a table and a small change to the model.</p>

export default class User extends compose(UserSchema, withAuthFinder(hash)) {
  static rememberMeTokens = DbRememberMeTokensProvider.forModel(User)
  // …
}</code></pre>

<pre data-lang="ts" data-file="app/controllers/session_controller.ts (store, change)"><code>const { email, password, remember } = await request.validateUsing(loginValidator)

await auth.use('web').login(user, !!remember)</code></pre>
<pre data-lang="tsx" data-file="inertia/pages/auth/login.tsx (addition)"><code>&lt;label className="field__label" style={{ display: 'flex', gap: 8 }}&gt;

&lt;/label&gt;</code></pre>
<div class="callout warn"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg></div><div class="callout-body"><div class="callout-t">Security belongs to the framework</div><p>Resist the urge to hand-roll auth pieces: comparing passwords with <code>===</code>, storing plain tokens, or putting the user id in a readable cookie. AdonisJS's hashing, signed sessions, hashed remember-me tokens and Shield's CSRF protection work together. When you need more — rate-limiting login attempts, email verification, social login — use the official packages (<code>@adonisjs/limiter</code>, <code>@adonisjs/ally</code>) rather than custom code.</p></div></div>
<div class="callout recap"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div><div class="callout-body"><div class="callout-t">What you built in this chapter</div><ul><li>Understand guards, providers and why Kazi uses the session guard.</li><li>Know what <code>withAuthFinder</code> and <code>verifyCredentials</code> do for security.</li><li>Read the kit's login, signup and logout controllers.</li><li>Know the roles of the silent-auth, auth and guest middleware.</li><li>Added a smart home route, a post-signup redirect, and optional remember-me tokens.</li></ul></div></div>
</template>
<template id="tpl-authorization">
<p>Authentication answers <em>who are you?</em> <strong>Authorization</strong> answers <em>what may you do?</em> So far Kazi has enforced access with query scopes: you can only load projects you own or belong to. That handles visibility. But inside a visible project, some actions should still be restricted — only the owner may rename or delete it, or manage who is on the team.</p>
<p>AdonisJS handles this with <strong>Bouncer</strong>, and it organizes rules into <strong>policies</strong>.</p>
<div class="callout info"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/></svg></div><div class="callout-body"><div class="callout-t">Scopes filter, policies decide</div><p>Use a <strong>query scope</strong> when you are fetching a <em>list</em> ("which projects can Jane see?") — filtering in SQL is efficient and can't leak rows. Use a <strong>policy</strong> when you are about to perform an <em>action</em> on one record ("may Jane delete project 7?"). Kazi uses both, and they complement each other.</p></div></div>
<h2 id="authorization-install-bouncer">Install Bouncer</h2>
<pre data-lang="bash"><code>$ node ace add @adonisjs/bouncer</code></pre>
<div class="callout tool"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg></div><div class="callout-body"><div class="callout-t">node ace add</div><p><code>node ace add &lt;package&gt;</code> installs an official package <em>and</em> runs its configuration step. For Bouncer that means creating <code>app/abilities/main.ts</code>, registering a middleware that puts a <code>bouncer</code> object on every HTTP context, and adding the <code>#abilities/*</code> and <code>#policies/*</code> import aliases (the kit already declares them).</p></div></div>
<h2 id="authorization-the-project-policy">The project policy</h2>
<pre data-lang="bash"><code>$ node ace make:policy project
DONE:    create app/policies/project_policy.ts</code></pre>
<pre data-lang="ts" data-file="app/policies/project_policy.ts"><code>import type User from '#models/user'
import type Project from '#models/project'
import { BasePolicy } from '@adonisjs/bouncer'

export default class ProjectPolicy extends BasePolicy {
  /**
   * Owners can change the project's name, colour and status.
   */
  edit(user: User, project: Project) {
    return user.id === project.userId
  }

  /**
   * Deleting is destructive, so it is its own permission even
   * though today it has the same rule as editing.
   */
  delete(user: User, project: Project) {
    return user.id === project.userId
  }

  /**
   * Only owners invite and remove teammates.
   */
  manageMembers(user: User, project: Project) {
    return user.id === project.userId
  }
}</code></pre>
<p>Each method receives the logged-in user first, then the resource, and returns <code>true</code> to allow. Keeping <code>edit</code> and <code>delete</code> separate costs nothing now and pays off the day you decide, say, that archived projects can be deleted by any member.</p>
<h2 id="authorization-enforce-it-in-controllers">Enforce it in controllers</h2>
<p>Refactor the owner-only queries from chapter 13 to load the project normally and ask the policy:</p>
<pre data-lang="ts" data-file="app/controllers/projects_controller.ts (edit / update / destroy)"><code>import ProjectPolicy from '#policies/project_policy'

  async edit({ inertia, params, auth, bouncer }: HttpContext) {
    const project = await Project.findVisibleOrFail(params.id, auth.getUserOrFail())
    await bouncer.with(ProjectPolicy).authorize('edit', project)

    return inertia.render('projects/edit', {
      project: ProjectTransformer.transform(project),
    })
  }

  async update({ params, request, response, auth, bouncer, session }: HttpContext) {
    const project = await Project.findVisibleOrFail(params.id, auth.getUserOrFail())
    await bouncer.with(ProjectPolicy).authorize('edit', project)

    const payload = await request.validateUsing(updateProjectValidator)
    await project.merge(payload).save()

    session.flash('success', 'Project updated')
    return response.redirect().toRoute('projects.show', { id: project.id })
  }

  async destroy({ params, response, auth, bouncer, session }: HttpContext) {
    const project = await Project.findVisibleOrFail(params.id, auth.getUserOrFail())
    await bouncer.with(ProjectPolicy).authorize('delete', project)

    await project.delete()

    session.flash('success', `Deleted "${project.name}"`)
    return response.redirect().toRoute('projects.index')
  }</code></pre>
<p><code>authorize()</code> throws an authorization exception when the policy returns <code>false</code>; AdonisJS responds with <strong>403 Forbidden</strong>. Notice the difference in outcomes now:</p>
<ul><li>Otieno's <em>private</em> project, requested by Jane → <strong>404</strong>. The scope hides its existence.</li><li>A project Jane is a <em>member</em> of, but does not own, when she tries to edit it → <strong>403</strong>. She can see it, she just may not change it.</li></ul>
<p>Chapter 23 gives the 403 a friendly page.</p>
<div class="callout tip"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/></svg></div><div class="callout-body"><div class="callout-t">authorize vs allows vs denies</div><p><code>authorize(action, resource)</code> throws — use it to guard controller actions. <code>allows(action, resource)</code> and <code>denies(action, resource)</code> return booleans — use them when you need to branch, or to compute flags for the UI.</p></div></div>
<h2 id="authorization-tell-react-what-the-user-may-do">Tell React what the user may do</h2>
<p>Policies are server code; React cannot import them. Instead, compute <strong>permission flags</strong> on the server and send them as props. The natural place is a transformer variant, because it is already the place where you decide what the frontend sees.</p>
<pre data-lang="ts" data-file="app/transformers/project_transformer.ts (addition)"><code>import { inject } from '@adonisjs/core'
import type { HttpContext } from '@adonisjs/core/http'
import ProjectPolicy from '#policies/project_policy'

export default class ProjectTransformer extends BaseTransformer&lt;Project&gt; {
  // … toObject() and withMembers()

  /**
   * Everything the board page needs, including what the viewer may do.
   */
  @inject()
  async forBoard({ bouncer }: HttpContext) {
    const policy = bouncer.with(ProjectPolicy)

    return {
      ...this.withMembers(),
      can: {
        edit: await policy.allows('edit', this.resource),
        delete: await policy.allows('delete', this.resource),
        manageMembers: await policy.allows('manageMembers', this.resource),
      },
    }
  }
}</code></pre>
<p><code>@inject()</code> asks AdonisJS's IoC container to pass the current <code>HttpContext</code> into the variant method. The variant reuses <code>withMembers()</code>, so the shapes stay consistent.</p>
<p>Use it in <code>ProjectsController.show</code>:</p>
<pre data-lang="ts" data-file="app/controllers/projects_controller.ts (show, change)"><code>return inertia.render('projects/show', {
  project: ProjectTransformer.transform(project).useVariant('forBoard'),
  tasks: TaskTransformer.transform(tasks),
})</code></pre>
<p>And on the board page, update the prop type and show owner-only actions:</p>
<pre data-lang="tsx" data-file="inertia/pages/projects/show.tsx (changes)"><code>import { Link } from '@adonisjs/inertia/react'

type PageProps = InertiaProps&lt;{
  project: Data.Project.Variants['forBoard']
  tasks: Data.Task[]
}&gt;

// inside &lt;Page … actions={…}&gt;
actions={
  project.can.edit &amp;&amp; (
    &lt;Link route="projects.edit" routeParams={{ id: project.id }} className="btn btn--secondary"&gt;
      Edit project
    &lt;/Link&gt;
  )
}</code></pre>
<p><code>project.can.edit</code> is a typed boolean, generated from the variant's return type. Hiding the button is purely cosmetic — the controller would refuse anyway — but it keeps the UI honest about what will work.</p>
<h2 id="authorization-team-management">Team management</h2>
<p>Owners can now invite teammates by email and remove them. This feature ties together validation (<code>exists</code>), policies, and pivot tables.</p>
<h4 class="step-h"><span class="step-badge">1</span><span>Controller</span></h4>
<pre data-lang="bash"><code>$ node ace make:controller project_members</code></pre>
<pre data-lang="ts" data-file="app/controllers/project_members_controller.ts"><code>import User from '#models/user'
import Project from '#models/project'
import type { HttpContext } from '@adonisjs/core/http'
import ProjectPolicy from '#policies/project_policy'
import { inviteMemberValidator } from '#validators/project_member'

export default class ProjectMembersController {
  /**
   * POST /projects/:id/members
   */
  async store({ params, request, response, auth, bouncer, session }: HttpContext) {
    const project = await Project.findVisibleOrFail(params.id, auth.getUserOrFail())
    await bouncer.with(ProjectPolicy).authorize('manageMembers', project)

    const { email } = await request.validateUsing(inviteMemberValidator)
    const invitee = await User.findByOrFail('email', email)

    if (invitee.id === project.userId) {
      session.flash('info', 'The owner is already part of the project.')
      return response.redirect().back()
    }

    /**
     * sync(..., false) adds the row if missing and never detaches others,
     * so inviting someone twice is harmless.
     */
    await project.related('members').sync({ [invitee.id]: { role: 'member' } }, false)

    session.flash('success', `${invitee.fullName ?? invitee.email} joined ${project.name}`)
    return response.redirect().back()
  }

  /**
   * DELETE /projects/:id/members/:userId
   */
  async destroy({ params, response, auth, bouncer, session }: HttpContext) {
    const project = await Project.findVisibleOrFail(params.id, auth.getUserOrFail())
    await bouncer.with(ProjectPolicy).authorize('manageMembers', project)

    await project.related('members').detach([params.userId])

    session.flash('success', 'Member removed')
    return response.redirect().back()
  }
}</code></pre>
<h4 class="step-h"><span class="step-badge">2</span><span>Routes</span></h4>
<pre data-lang="ts" data-file="start/routes.ts (inside the auth group)"><code>router

  .where('id', router.matchers.number())

router
  .delete('/projects/:id/members/:userId', [controllers.ProjectMembers, 'destroy'])
  .where('id', router.matchers.number())
  .where('userId', router.matchers.number())</code></pre>

<h2 id="authorization-tasks-who-may-delete">Tasks: who may delete?</h2>
<p>Kazi lets every project member work on tasks, but deleting a task is reserved for its creator or the project owner. That is a rule about a task <em>and</em> its project:</p>
<pre data-lang="ts" data-file="app/policies/task_policy.ts"><code>import type User from '#models/user'
import type Task from '#models/task'
import { BasePolicy } from '@adonisjs/bouncer'

export default class TaskPolicy extends BasePolicy {
  /**
   * Expects task.project to be loaded.
   */
  delete(user: User, task: Task) {
    return user.id === task.creatorId || user.id === task.project.userId
  }
}</code></pre>

<template id="tpl-search-pagination">
<p>Three projects fit on a screen; three hundred do not. In this chapter the project list gets a search box, Active/Archived tabs, and pagination — all driven by the <strong>URL query string</strong>, so every state is linkable and the back button just works.</p>
<div class="callout info"><div class="callout-ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 2 7l10 5 10-5-10-5z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/></svg></div><div class="callout-body"><div class="callout-t">The URL is the state</div><p>In an Inertia app, filters belong in the query string, not in React state. <code>/projects?q=web&amp;status=archived&amp;page=2</code> fully describes what is on screen: refresh it, bookmark it, or send it to a teammate and they see the same thing. The server reads the query, the page renders what it is given, and there is no client-side store to keep in sync.</p></div></div>
<h2 id="search-pagination-validate-the-query-string">Validate the query string</h2>
<p>Query strings are user input, so they get a validator like everything else.</p>
<pre data-lang="ts" data-file="app/validators/project.ts (addition)"><code>export const projectFiltersValidator = vine.create({
  q: vine.string().trim().maxLength(100).optional(),
  status: vine.enum(['active', 'archived'] as const).optional(),
  page: vine.number().min(1).withoutDecimals().optional(),
})</code></pre>
<p><code>request.validateUsing()</code> validates the query string as well as the body, so the same call works for <code>GET</code> requests. There is a bonus: because the route's validator declares these fields, the route registry knows the route's <strong>query string type</strong>, and <code>Link</code>'s <code>qs</code> prop is type-checked against it. <code>qs={{ page: 'two' }}</code> will not compile.</p>
<h2 id="search-pagination-paginate-in-the-controller">Paginate in the controller</h2>
<pre data-lang="ts" data-file="app/controllers/projects_controller.ts (index, replace)"><code>import { projectFiltersValidator } from '#validators/project'

  async index({ inertia, auth, request }: HttpContext) {
    const user = auth.getUserOrFail()
    const filters = await request.validateUsing(projectFiltersValidator)
    const status = filters.status ?? 'active'

    const page = await Project.query()
      .withScopes((scopes) =&gt; scopes.visibleTo(user))
      .where('status', status)
      .if(filters.q, (query) =&gt; {
        query.whereRaw('LOWER(name) LIKE ?', [`%${filters.q!.toLowerCase()}%`])
      })
      .preload('owner')
      .withCount('tasks', (q) =&gt; q.as('total_count'))
      .withCount('tasks', (q) =&gt; q.where('status', 'done').as('done_count'))
      .orderBy('updated_at', 'desc')
      .paginate(filters.page ?? 1, 9)

    return inertia.render('projects/index', {
      projects: ProjectTransformer.paginate(page.all(), page.getMeta()),
      filters: { q: filters.q ?? '', status },
    })
  }</code></pre>
<p>The new pieces:</p>
<ul><li><code>.if(condition, callback)</code> applies part of a query only when the condition is truthy. It keeps optional filters readable without breaking the chain into <code>if</code> statements.</li><li><code>LOWER(name) LIKE ?</code> gives a case-insensitive match on both SQLite and PostgreSQL. The <code>?</code> placeholder means the value is sent as a bound parameter — never concatenate user input into SQL.</li><li><code>.paginate(page, perPage)</code> runs two queries (a <code>COUNT</code> and a <code>LIMIT/OFFSET</code> select) and returns a paginator.</li><li><code>ProjectTransformer.paginate(rows, meta)</code> serializes the rows with the transformer and attaches pagination metadata. The prop has the shape <code>{ data: Data.Project[], metadata: {...} }</code>.</li><li><code>filters</code> echoes back what the server actually applied, so the UI always reflects the server's truth, including defaults like <code>status: 'active'</code>.</li></ul>
<h2 id="search-pagination-the-page">The page</h2>
<pre data-lang="tsx" data-file="inertia/pages/projects/index.tsx"><code>import { useEffect, useRef, useState } from 'react'

  const firstRender = useRef(true)

  /**

   * then ask the server for the filtered list.

  useEffect(() =&gt; {

  }, [q])

  return (

          className="field__input"
          placeholder="Search projects…"
          value={q}
          onChange={(event) =&gt; setQ(event.target.value)}
          style={{ maxWidth: 320 }}
        /&gt;
        {(['active', 'archived'] as const).map((status) =&gt; (
          &lt;Link
            key={status}
            route="projects.index"
            qs={{ q: filters.q || undefined, status }}
            className={`btn btn--sm ${filters.status === status ? 'btn--primary' : 'btn--ghost'}`}
            preserveState
          &gt;
            {status === 'active' ? 'Active' : 'Archived'}
          &lt;/Link&gt;
        ))}
        &lt;span className="field__hint" style={{ marginLeft: 'auto' }}&gt;
          {metadata.total} project{metadata.total === 1 ? '' : 's'}
        &lt;/span&gt;
      &lt;/div&gt;

      &lt;div className="project-grid"&gt;
        {data.map((project) =&gt; (
          /* the same card markup as chapter 10 */
          &lt;Link
            key={project.id}
            route="projects.show"
            routeParams={{ id: project.id }}
            className={`project-card swatch-${project.color}`}
          &gt;
            &lt;h2&gt;{project.name}&lt;/h2&gt;

      &lt;/div&gt;

      {metadata.lastPage &gt; 1 &amp;&amp; (
        &lt;nav style={{ display: 'flex', gap: 8, justifyContent: 'center', marginTop: 24 }}&gt;
          {metadata.currentPage &gt; 1 &amp;&amp; (
            &lt;Link
              route="projects.index"
              qs={{ ...filters, q: filters.q || undefined, page: metadata.currentPage - 1 }}
              className="btn btn--ghost btn--sm"
              preserveScroll
            &gt;
              ← Previous
            &lt;/Link&gt;
          )}
          &lt;span className="field__hint"&gt;
            Page {metadata.currentPage} of {metadata.lastPage}
          &lt;/span&gt;
          {metadata.currentPage &lt; metadata.lastPage &amp;&amp; (
            &lt;Link
              route="projects.index"

              className="btn btn--ghost btn--sm"

            &lt;/Link&gt;
